 ww1_ottoman.14.a: "Okay"
 ww1_ottoman.14.d: "After end of the World War, the Russian- and British-occupied territories were returned to Persia gradually. After the signing of the Treaty of Brest-Litovsk in 1918 between the Russian Soviet Republic and the Central Powers Persia should regain sovereignty over its northern territories. However, these were still occupied by White Russian troops. In 1919 Britain tried to make Persia a protectorate by a bilateral treaty, but it did not materialize."
 ww1_ottoman.14.t: "Leave southern Persia"
 ww1_ottoman.15.a: "Okay"
 ww1_ottoman.15.d: "After end of the World War, the Russian- and British-occupied territories were returned to Persia gradually. After the signing of the Treaty of Brest-Litovsk in 1918 between the Russian Soviet Republic and the Central Powers Persia should regain sovereignty over its northern territories. However, these were still occupied by White Russian troops. In 1919 Britain tried to make Persia a protectorate by a bilateral treaty, but it did not materialize."
 ww1_ottoman.15.t: "Leave northern Persia"
 ww1_ottoman.16.a: "Damn!"
 ww1_ottoman.16.d: "General Otto Liman von Sanders, the head of the German military mission to the Ottoman Empire, has left our country today to return home, together with the other German military leaders."
 ww1_ottoman.16.t: "The German military mission leaves the country"
 ww1_ottoman.1.a: "Okay"
 ww1_ottoman.1.d: "The presence of oil deposits around Mosul had been well known for a long time. At the beginning of the 20th century, oil was becoming more and more important with each day, but at that time the German Empire was completely dependent on oil imports from USA. For this reason Germany decided to fund the construction of the Baghdad railway, obtaining in exchange the concession to extract all raw materials near the railway. Historically the Germans didn't complete the railway section to Mosul."
 ww1_ottoman.1.t: "Oil in Mosul"
 ww1_ottoman.17.a: "Declare War"
 ww1_ottoman.17.d: "The German military mission to the Ottoman Empire has returned home today. General Otto Liman von Sanders, the head of the mission, together with the other German military leaders, has just arrived in Berlin and is ready to receive his next assignment."
 ww1_ottoman.17.t: "The military mission to the Ottoman Empire returns home"
 ww1_ottoman.18.a: "Allow them to pass!"
 ww1_ottoman.18.b: "Deny them access!"
 ww1_ottoman.18.d: "The pursuit of Goeben and Breslau was a naval action that occurred in the Mediterranean Sea at the outbreak of the First World War, when elements of the British Mediterranean Fleet attempted to intercept the German Mittelmeerdivision comprising the battlecruiser SMS Goeben, and the light cruiser SMS Breslau. The German ships evaded the British fleet and passed through the Dardanelles to reach Constantinople, where their arrival was a catalyst that contributed to the Ottoman Empire joining the Central Powers by issuing a declaration of war against the Triple Entente."
 ww1_ottoman.18.t: "Pursuit of Goeben and Breslau"
 ww1_ottoman.19.a: "Keep Them!"
 ww1_ottoman.19.b: "Sell Them!"
 ww1_ottoman.19.d: "The Ottoman Empire has two dreadnoughts under construction in our dockyards. Should we allow them to purchase the vessels or keep them for our own use?"
 ww1_ottoman.19.t: "Ottoman Dreadnoughts"
 ww1_ottoman.20.a: "Sell Them!"
 ww1_ottoman.20.d: "The Ottoman Empire has two dreadnoughts under construction in our dockyards."
 ww1_ottoman.20.t: "Ottoman Dreadnoughts"
 ww1_ottoman.21.a: "Organize the Repression"
 ww1_ottoman.21.d: "Muhammad ibn Ali al-Idrisi established the Idrisid Emirate of Asir in rebellion against our great Ottoman Empire."
 ww1_ottoman.21.t: "Idrisid Revolt"

 ww1_ottoman.22.t: "Anglo-Ottoman Convention"
 ww1_ottoman.22.d: "The British offer an agreement about Kuwait and Qatar to settle the matter. Should we sign this Convention?"
 ww1_ottoman.22.a: "Yes, it's time to find a compromise..."
 ww1_ottoman.22.b: "Never!"

 ww1_ottoman.100.a: "Join Central Powers"
 ww1_ottoman.100.b: "Not Now"
 ww1_ottoman.100.d: "German Empire asks us to join the Central Powers. Should we accept and help them in war?"
 ww1_ottoman.100.t: "Join Central Powers"

 ww1_ottoman.23.t: "Ottomans want closer integration"
 ww1_ottoman.23.d: ""
 ww1_ottoman.23.a: "Accept"
 ww1_ottoman.23.b: "Reject"

 ww1_ottoman.24.t: "Jabal Shammar accepted our integration offer"
 ww1_ottoman.24.d: "Jabal Shammar accepted our proposal of integration as we recognized their claims over Arabia while they allowed our government to have bigger influence on them."
 ww1_ottoman.24.a: "Good."

 ww1_ottoman.25.t: "Jabal Shammar rejected our integration offer"
 ww1_ottoman.25.d: "Jabal Shammar rejected our proposal of integration. What should we do?"
 ww1_ottoman.25.a: "We tried our best"
 ww1_ottoman.25.b: "Then we are going to use other means"

 ww1_ottoman.26.t: "Fate of the Eastern Vilayets"
 ww1_ottoman.26.d: "In eastern part of the Anatolia lies a bunch of different ethnicities. As a part of the Treaty of Sevres and the Wilsons 14 points these minoritys are allowed to do free referandums to choose their future. While we can allow these referandums we can also just seize the weakness of Entente powers and ignore this part. What should we do?"
 ww1_ottoman.26.a: "We don't have a choice..."
 ww1_ottoman.26.b: "Maybe we can just ignore that part?"

 ww1_ottoman.27.t: "Mission to the North"
 ww1_ottoman.27.d: "With efforts to disarm the resistance groups started we gazed our eyes on the black sea region because of its active resistance against the Treaty of Sevres.While we can just ignore them but this will further destablize the country or we can send someone trusted to disarm the rebels. What should we do?"
 ww1_ottoman.27.a: "We can ignore some rebels."
 ww1_ottoman.27.b: "Send him to disarm the resistance"

 ww1_ottoman.28.t: "Mustafa Kemal Pasha Rebels!"
 ww1_ottoman.28.d: "Grim news have arrived to the capital.After we send Mustafa Kemal Pasha to Samsun for disarming the population.He secretly builded a shadow government over our eastern vilayets and now he declared the cretion of a new Turkish state rival to us.We can join him for the Turkish liberation or we can stay loyal to the Sultan. What is your choice?"
 ww1_ottoman.28.a: "Forward for Independence!"
 ww1_ottoman.28.b: "We are only loyal to the Sultan"
 ww1_ottoman.29.t: "Young Turk Officers Rebels Against Us!"
 ww1_ottoman.29.d: "My sultan bad news plagues us!.Today at morning old Ottoman Young Officers declared the creation of the Second Action Army,They plan to march to the capital and rebring their regime.They already captured all of our remaining balkan lands and if we dont act fast all of the empire can try to rebel against us.We need to act fast!"
 ww1_ottoman.29.a: "Send the army to thrace and began the push them back!"
 #Enver path
 ww1_ottoman.30.t: "Young Turk Officers Resigns"
 ww1_ottoman.30.d: "Today some of our important general and chief of armys including the chief of the navy resing because of some untold reasons.This a is good and bad thing at the same time good beacuse biggest parts of the army opposition is dealt with no blood but bad because they are also the most trained personals we can afford and also because of their revolutionary sides they can try to rise an opposition army like in the 31 March coup but we must now preapere for the coming storm."
 ww1_ottoman.30.a: "We cant stop them..."
 ww1_ottoman.31.t: "Ottomans Demand Bosnia"
 ww1_ottoman.31.d: "Today a delegation from the Ottoman Empire has arrived with one thing.They demand our newly annexed terrority of Bosnia.They claim we stole the land from them during the 31 March coup.While they are not the strongest country we border but they are also not the weakest one.Should we protect our claims or just leave to them?"
 ww1_ottoman.31.a: "No!Its our righful land."
 ww1_ottoman.31.b: "Yes.Bosnia isnt that important anyway."
 ww1_ottoman.32.t: "Question of the Sultan"
 ww1_ottoman.32.d: "With opposition to Ottoman Monarchy has been gone we can now freely choose our nwe sultan.But this will be not easy as there are three big candidates for this new era.Current Sultan Mehmed the V old sultan and absolutist Abdulhamid the II and the reformist sultan Abdulmejid the II which one of them will be leader of the new era?"
 ww1_ottoman.32.a: "Curren Sultan Mehmed the V!"
 ww1_ottoman.32.b: "Old Sultan Abdulhamid the II!"
 ww1_ottoman.32.b: "Reformist Sultan Abdulmejid the II!"
 ww1_ottoman.33.t: "Austria Rejected Our Demands"
 ww1_ottoman.33.d: "Today our delegation from the Austrian Empire has arrived with bad news.Thinking they have a rightful claim on the land rejected our demands.What should we do?"
 ww1_ottoman.33.a: "At least we tried..."
 ww1_ottoman.33.b: "Onwards to Sarajevo!"
 ww1_ottoman.34.t: "Austria Accepts Our Demands"
 ww1_ottoman.34.d: "First step to victory has been avhieved my Sultan !Austrian Emperor accepted our demands and promised leave the Bosnia to us under 24 hours. This bright victory should be a really good propaganda for our populace."
 ww1_ottoman.34.a: "Very Good!"
 ww1_ottoman.35.t: "Question of Capitulations"
 ww1_ottoman.35.d: "Capitulations or in Turkish "Kapitülasyonlar" are deals that give foreign merchants special privilages. They are used tostimulate the market and show friendship among countries but with the age of industrilazition they become deals that harms countries. A greatexample is the Ottoman Empire. At the start they allowed for cheap goods enter the market but as the capitulations grew. They began to shrink our own domestic production and lead to economic problems. While we tried to get rid of them, we are unsuccesful but a new oppurtunity came. With thegreat powers of the contienent now at war we can now easily dismiss them howewer this can worsen our trade relations."
 ww1_ottoman.35.a: "Cancel them now while we have a chance."
 ww1_ottoman.35.b: "We shall ask them to cancel them normally."
 ww1_ottoman.36.t: "Ottoman Empire Asks Us to Cancel Our Trade Privilages"
 ww1_ottoman.36.d: "Ottoman Empire asks us to cancel our trade privilages or in other word capitulations. While canceling them will improve the relations between our countries we can also continue them for profits."
 ww1_ottoman.36.a: "Cancel them."
 ww1_ottoman.36.b: "Hell no!"
 ww1_ottoman.47.t: "[FROM.GetNameDef] has Refused Our Demands"
 ww1_ottoman.47.d: "[FROM.GetNameDef] has refused our demands to cancel their privilages. They still think us as a free raw resources market but they will see what is going to happen to them some day."
 ww1_ottoman.47.a: "How rude!"
 ww1_ottoman.37.t: "İbrahim Hakkı Pasha Resigns"
 ww1_ottoman.37.d: "Following the Italian declaration of war and the rising anti-war sentitments İbrahim Hakkı Pasha has resigned from the position of the Grand Vizier. We should immediately find a new grand vizier to run the country."
 ww1_ottoman.37.a: "Mehmed Said Pasha is the new grand vizier."
 ww1_ottoman.38.t: "Mehmed Said Pasha Resigns"
 ww1_ottoman.38.d: "As our war against the Italians continued new government of the Mehmed Said Pasha quickly lost support. He resigned from the position of the grand vizier today. We should immediately find a new grand vizier to continue the war effort."
 ww1_ottoman.38.a: "Ahmed Muhtar Pasha is the new grand vizier."
 ww1_ottoman.39.t: "Ahmed Muhtar Pasha Resigns"
 ww1_ottoman.39.d: "With Balkan Leauge declaring war on us and our frontlines in the balkans collapsing Ahmed Muhtar Pasha has resigned from the position of grand vizier. We should find a grand vizier that can end this war fast!"
 ww1_ottoman.39.a: "Mehmed Kamil Pasha will do the job."
 ww1_ottoman.40.t: "Raid on the Sublime Porte"
 ww1_ottoman.40.d: "Today a group of military officers led by İsmail Enver Pasha has launched a raid to Sublime Porte, government building where the grand vizier is located. They are not happy to hear that government is trying to end the war with Balkan Leauge. They are now demanding our grand vizier to resign and replace him with the Mahmud Shevket Pasha. What should we do?"
 ww1_ottoman.40.a: "The coup is succesfull."
 ww1_ottoman.40.b: "Army will surround the building and arrest the generals."
 ww1_ottoman.41.t: "Assasination of the Mahmud Shevket Pasha"
 ww1_ottoman.41.d: "Today grim news has reached to the capital as the our new grand vizier Mahmud Shevket Pasha is assainated while going with his car. We should find a new grand vizier."
 ww1_ottoman.41.a: "Said Halim Pasha is the new grand vizier."
 ww1_ottoman.42.t: "Said Halim Pasha Resigns"
 ww1_ottoman.42.d: "Following our entry to the Great War and our defeats in various fronts led to government of the Said Halim Pasha to collapse. Fortunately we have candidate for the grand vizier. Mehmed Talat Pasha who is minister of the interior would be a great pick."
 ww1_ottoman.42.a: "Mehmed Talat Pasha is the new grand vizier."
 ww1_ottoman.43.t: "Ottoman Empire Demands Total Annexation"
 ww1_ottoman.43.d: ""
 ww1_ottoman.43.a: "Ok"
 ww1_ottoman.43.b: "No"
 ww1_ottoman.44.t: "A Secret Letter From the Ottomans"
 ww1_ottoman.44.d: ""
 ww1_ottoman.44.a: "We shall stand with our Muslim brothers!"
 ww1_ottoman.44.b: "No"
 ww1_ottoman.45.t: "Question of Albania"
 ww1_ottoman.45.d: "Albania, a country that has a long history of resistance against us, Turks. They tried to resist Ottoman Conquests all the way back in the 1450's under the leadership of the Skanderbeg and now they try to do the same by launch continued revolts across our Albanian majority lands. They tried the revolt again in start of the 1910 but we succesfully keep the situation under control howewer this will not last long. We should give them some autonomy to end these long lasting Albanian revolts. But how much autonomy should we give to them?"
 ww1_ottoman.45.a: "We should give them regional autonomy but not muvh more."
 ww1_ottoman.45.b: "We should create a little Albanian puppet state."
 ww1_ottoman.45.c: "We should create a big Albanian puppet state."
 ww1_ottoman.46.t: "Internal Policy for Non-Turkish Ethnicities"
 ww1_ottoman.46.d: "Our empire has a lot of different ethnicities. Slavs, Greeks and Albanians in the balkans, Armenians and Georgians in the Caucasia, Arabs, Assyrians, Kurds and other minorities in the Middle East. While for the most part they stayed loyal to us after the Napoleonic Wars and the rapidly spreading idea of nationalism different ethnicities began to rebel against us. While we gave them autonomy under various laws known as Adem-i Merkeziyetçilik in Turkish. They are still not satisfied and still rebelling. We should do something different or increase their autonomy to stop these rebellions."
 ww1_ottoman.46.a: "We should began to use more hard ways."
 ww1_ottoman.46.b: "We shall continue the give them more autonomy."
 ww1_ottoman.48.t: "Emirate of Nejd Seizes Dammam!"
 ww1_ottoman.48.d: "Emirate of Nejd, a tribal country located in Central Arabia led by the House of Saud thinked they can grab a piece from us without any concequences. Just a few hours ago they seized the port of Dammam and the surrounding regions and incorpareted them into their Emirate. Should we let them slip by or ready our forces for a another expedition to Nejd?"
 ww1_ottoman.48.a: "We shall destroy the Sauds once and for all!"
 ww1_ottoman.49.t: "Results Of The Ottoman Elections"
 ww1_ottoman.49.d: "We finally got our first free and fair multiparty election results. After years of authoritarian rule we can finally taste more freedom!. There are multiple parties that got seats in the parliement but there are two main parties who got the most seats. Motherland and Liberation Party led by famous Mustafa Kemal Pasha and Freedom and Accord Party and most fierce anti-CUP Freedom and Accord Party led by autonomist Mehmed Sabahaddin. So, Winner of the this historic election is..."
 ww1_ottoman.49.a: "MLP and Mustafa Kemal Pasha!"
 ww1_ottoman.49.b: "FAP and Mehmed Sabahaddin!"
 ww1_ottoman.50.t: "Germany Offers a Secret Friendship Treaty"
 ww1_ottoman.50.d: "Today ambasadors from Germany has arrived us with a secret deal. In the deal they wanted a mutual friendship treaty. Knowing our sympathies for them as we are rejected by our former allies this deal can be really good to break our isolation. We should accept this treaty!"
 ww1_ottoman.50.a: "Accept the offer."
 ww1_ottoman.51.t: "Germany Offers us Ships"
 ww1_ottoman.51.d: "With the start of the war between Germany and the United Kingdom German ships that are standing in the Mediterranean Sea is now fully trapped and this caused Germany a great problem in the recent days as two German ships, Goben and Breslau are being chased by the Royal Navy came to us. Germany offered the sell the ships to us in a very good price. While this can violate our neutrality we can also use them to modernize our navy."
 ww1_ottoman.51.a: "Purchase and rename them."
 ww1_ottoman.51.b: "We can't risk our own neutrality."
 ww1_ottoman.52.t: "Status of Egypt"
 ww1_ottoman.52.d: "Egypt changed hands in history multiple times. From Macedonians, Romans, Byzantium, us and lastly to British Empire after the 1882 revolt. With us now regaining control over the country a new question rose. Should we integrate them like in 16th century or make them a vassal state like in the eighteen hundreds?"
 ww1_ottoman.52.a: "They shall be incorporated back into the empire."
 ww1_ottoman.52.d: "They shall became a vassal of us."
 ww1_ottoman.53.t: "Ottomans Asks For an Alliance"
 ww1_ottoman.53.d: ""
 ww1_ottoman.53.a: "Yes"
 ww1_ottoman.53.b: "No"
 ww1_ottoman.54.t: "Ottomans Wants to Buy Kuwait"
 ww1_ottoman.54.d: "Should we sell them Kuwait?"
 ww1_ottoman.54.a: "Yes"
 ww1_ottoman.55.t: "British Empire Accepts our Offer"
 ww1_ottoman.55.d: "After some negotiations British Empire agreed to leave Kuwait to us in exchange of reperations."
 ww1_ottoman.55.a: "Great!"
 ww1_ottoman.56.t: "Ottoman Empire asks for the Arabian Coast"
 ww1_ottoman.56.d: "Should we give them the Arabian Coast?"
 ww1_ottoman.56.a: "They dont have any importance anyway..."
 ww1_ottoman.57.t: "British Empire Accepts our Demands"
 ww1_ottoman.57.d: ""
 ww1_ottoman.57.a: "Great!"
 ww1_ottoman.58.t: "Ottomans Wants to Buy Cyprus"
 ww1_ottoman.58.d: "Should we sell them Cyprus?"
 ww1_ottoman.58.a: "Yes"
 ww1_ottoman.59.t: "British Empire Accepts our Offer"
 ww1_ottoman.59.d: "After some negotiations British Empire agreed to leave Kuwait to us in exchange of reperations."
 ww1_ottoman.59.a: "Great!"