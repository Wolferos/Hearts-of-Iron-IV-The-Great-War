 ww1_ottoman.5.t: "The Asienkorps has arrived"
 ww1_ottoman.6.a: "Okay"
 ww1_ottoman.6.d: "During the reign of Abdul Hamid II from 1876 to 1909, the Ottoman navy was hardly supported. This changed when the Young Turks came to power. The majority of the Young Turks was pro-British, so much that in 1909 not German but British experts were invited to expand and modernize the fleet. The head of the mission was also commander of the entire Ottoman fleet. The heads were admiral Douglas Gamble (1909-1910), followed by admiral Hugh Pigot Williams (1910-1911) and then by admiral Arthur Limpus (1912-1914).\nAs the transfer of the German ships 'Goeben' and 'Breslau' was almost completed, admiral Limpus was withdrawn from the supreme command of the fleet and shifted to the Ottoman ministry of navy. A month later on 9th September 1914, the German Admiral Souchon was appointed commander of the Ottoman navy and the British naval mission left the Ottoman Empire."
 ww1_ottoman.6.t: "The British naval mission leaves the country"
 ww1_ottoman.7.a: "Okay"
 ww1_ottoman.7.d: "During the reign of Abdul Hamid II from 1876 to 1909, the Ottoman navy was hardly supported. This changed when the Young Turks came to power. The majority of the Young Turks was pro-British, so much that in 1909 not German but British experts were invited to expand and modernize the fleet. The head of the mission was also commander of the entire Ottoman fleet. The heads were admiral Douglas Gamble (1909-1910), followed by admiral Hugh Pigot Williams (1910-1911) and then by admiral Arthur Limpus (1912-1914).\nAs the transfer of the German ships 'Goeben' and 'Breslau' was almost completed, admiral Limpus was withdrawn from the supreme command of the fleet and shifted to the Ottoman ministry of navy. A month later on 9th September 1914, the German Admiral Souchon was appointed commander of the Ottoman navy and the British naval mission left the Ottoman Empire."
 ww1_ottoman.7.t: "The naval mission returns home from the Ottoman Empire"
 ww1_ottoman.8.a: "Okay"
 ww1_ottoman.8.d: "On 16th August 1914 Enver Pasha demanded German support for the reorganization and the overhaul of coastal fortifications at the Dardanelles Strait. For this task, the retired vice-admiral Guido von Usedom was reactivated as 'Generalinspekteur der Küstenverteidigung an den Dardanellen' (Inspector General of the coastal defenses at the Dardanelles) on 25th August. Under his leadership, a dedicated team of 26 officers and 520 men, was sent to Constantinople. This team (known as Sonderkommando der Kaiserlichen Marine in der Türkei/Special Detachment of the Imperial Navy in Turkey) should also compensate the shortage of specialists caused by the discontinuation of the British naval mission. The repairs to the fortifications began in early September."
 ww1_ottoman.8.t: "Overhaul coastal defence at the Dardanelles"
 ww1_ottoman.9.a: "Okay"
 ww1_ottoman.9.d: "On 16th August 1914 Enver Pasha demanded German support for the reorganization and the overhaul of coastal fortifications at the Dardanelles Strait. For this task, the retired vice-admiral Guido von Usedom was reactivated as 'Generalinspekteur der Küstenverteidigung an den Dardanellen' (Inspector General of the coastal defenses at the Dardanelles) on 25th August. Under his leadership, a dedicated team of 26 officers and 520 men, was sent to Constantinople. This team (known as Sonderkommando der Kaiserlichen Marine in der Türkei/Special Detachment of the Imperial Navy in Turkey) should also compensate the shortage of specialists caused by the discontinuation of the British naval mission. The repairs to the fortifications began in early September."
 ww1_ottoman.9.t: "Overhaul of Dardanelles defense network completed"
 ww1_ottoman.10.a: "Okay"
 ww1_ottoman.10.d: "By the Treaty of Saint Petersburg (1907), the status of Tibet, Afghanistan and Persia were staked between the British and the Russian Empire. By this treaty the decades-long conflict (known as 'The Great Game') was resolved between the two empires and made the Triple Entente possible.\nExcept an area in the center ('neutral zone') Persia was divided between the two empires in economic zones. Persia itself was not involved in the negotiation of the treaty and was just informed after its signing in September 1907.\nAt the outbreak of the First World War Persia was hassled by the British and Russian Empire to declare war on the Ottoman Empire. The Persian government refused to do so and declared neutrality instead. Russia and Britain ignored this statement and occupied the country to campaign from there.\nParticularly the protection of Southern Persia was of the utmost importance for Britain. There were oilfields located which were run by the APOC ('Anglo-Persian Oil Company'). Since 1914 the APOC was responsible for the oil supply of the British fleet."
 ww1_ottoman.10.t: "Protect the oil fields in southern Persia"
 ww1_ottoman.11.a: "Damn!"
