 ww1_ottoman.3.t: "Germany extends its military support"
 ww1_ottoman.4.a: "Okay"
 ww1_ottoman.4.d: "The 'Asienkorps' (Asia Corps) was a German expeditionary force in the Ottoman Empire. The first groups were stationed under the code name 'Pascha' on the Sinai front, where they arrived in March 1916. First commander was general Friedrich Kreß von Kressenstein.\nThe capture of Baghdad by the British on 11th March 1917 induced the German Empire to strengthen the 'Asienkorps'. The new groups (named 'Pascha II') reached the Ottoman Empire in August 1917. Colonel Werner von Frankenberg und Proschlitz was made commander of the 'Asienkorps'. In addition, in June 1917, the staff of the Ottoman Army Group F was completely replaced by German officers and renamed to 'Heeresgruppe Yildirim' (Army Group Thunderbolt). General Erich von Falkenhayn was made commander. To this army group there were assigned three Ottoman armies and the 'Asienkorps'.\nThe initial goal was the reconquest of Baghdad, which was abandoned in October 1917. The 'Asienkorps' was moved to Palestine to stabilize the front. In 1918, the 'Asienkorps' was strengthened again and achieved a strength of 16,000 men.\nTo the 'Asienkorps' also belonged 6 Fliegerabteilungen (flier detachements) and 1 Jagdstaffel (hunting squadron) with a total of about 70 aircrafts. Austria-Hungary was also involved with several artillery batteries.\nAfter the surrender of the Ottoman Empire in late October 1918, the troops of the 'Asienkorps' were interned in Constantinople and shipped home in January 1919."
 ww1_ottoman.4.t: "Prepare the Asienkorps"
 ww1_ottoman.5.a: "Excellent!"
