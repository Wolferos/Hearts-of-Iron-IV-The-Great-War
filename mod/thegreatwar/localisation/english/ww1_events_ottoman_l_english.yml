 ww1_ottoman.2.a: "Okay"
 ww1_ottoman.2.d: "The German military had already operated in the Ottoman Empire for decades. The first German military mission was active from 1882 to 1895 to reorganize the Ottoman army. After that a military attaché office was established, but its influence was much less than that of the mission. Only the disastrous defeat in the First Balkan War in 1913 motivated the Ottoman army to request again German help for reforming the army. After months of negotiations, the second German military mission arrived in Constantinople in December 1913 under the leadership of Otto Liman von Sanders. Actually it was scheduled that the military mission would withdraw in case of war. With signing of the secret treaty between the German and the Ottoman Empire on 2nd August 1914 it was agreed that the mission should stay in Constantinople. It was promised that the mission would get a vast influence on the conduct of war of the Ottoman army. Many German officers would hold leadership positions. Numerous officers, specialists and troops were deployed during the war. It is estimated that approximately 25,000 men were in use for the military mission. The Ottoman army was supplied with weapons and aircrafts. Since the sea was locked, material and human support could only be sent overland to the Ottoman Empire. Since the German Empire was at war with Serbia, the supply could only be sent through neutral Romania, but this was not enough. However in mid-September 1914 Romania refused the transit permit and so the Ottoman Empire was cut off from support from the German Empire. Only with the occupation of Serbia, the Ottoman Empire was able to be supplied with war material again."
 ww1_ottoman.2.t: "Extend military mission in the Ottoman Empire"
 ww1_ottoman.3.a: "Excellent!"
