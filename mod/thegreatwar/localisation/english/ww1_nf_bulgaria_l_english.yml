 # [Bulgaria] Diplomatic Effort
 #=========================================================================
 BUL_first_balkan: "Liberate the Balkans"
 BUL_first_balkan_desc: "The time to act is now, we should strike against our foe while they're still weak. To arms Bulgarians!"
 BUL_ww1_diplomatic_effort: "Diplomatic Effort"
 BUL_ww1_diplomatic_effort_desc: ""
