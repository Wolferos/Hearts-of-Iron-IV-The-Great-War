 BUL_ww1_equip_ger_desc: ""
 BUL_ww1_supportrussia: "Support Russia"
 BUL_ww1_supportrussia_desc: ""
 BUL_ww1_military_reserve: "Military Reserve"
 BUL_ww1_military_reserve_desc: ""
 BUL_ww1_EmbargoGermany: "Sanction Germany"
 BUL_ww1_EmbargoGermany_desc: ""
 BUL_ww1_EmbargoAustria: "Sanction Austria-Hungary"
 BUL_ww1_EmbargoAustria_desc: ""
 BUL_ww1_EmbargoFrance: "Sanction France"
 BUL_ww1_EmbargoFrance_desc: ""
 BUL_ww1_EmbargoRussia: "Sanction Russia"
 BUL_ww1_EmbargoRussia_desc: ""
 BUL_ww1_BalkansPolitics: "Balkan Politics"
 BUL_ww1_BalkansPolitics_desc: "More so than those who master warfare, those who master diplomacy stand to gain in the dynamic Balkan Peninsula. Indeed when then Knyaz Ferdinand elevated our Princedom to a Tsardom of similar status to the Kingdoms of Europe, it was timed with care; the Ottoman Empire busy with revolts and Austro-Hungarian interference. So let's keep going, §YGreater Bulgaria§! stands but a few good moves from our grasp..."
 BUL_ww1_BalkansPolitics_tt: "\nEnables the §YMontenegrin Allegiance§! decisions for §G[BUL.GetName]§!, §Y[MNT.GetName]§! and §R[SER.GetName]§!.\n§R[SER.GetName]§! will start in an advantageous position.\n"
 BUL_ww1_ApeasementBalkans: "Appeasement in Balkans"
 BUL_ww1_ApeasementBalkans_desc: "Diplomatic tensions escalate in the Balkans; consider a cautious approach to avoid conflict. Navigating the delicate balance of appeasement becomes paramount as regional stability hangs in the balance."
 BUL_ww1_RecognizeAlbania: "Recognize Albania's Sovereignty"
 BUL_ww1_RecognizeAlbania_desc: ""
 BUL_ww1_ReleaseAlbania: "Release Albania"
 BUL_ww1_ReleaseAlbania_desc: ""
 BUL_ww1_balkan_league: "Propose a Military Alliance to Serbia"
 BUL_ww1_balkan_league_desc: "With the blessing of the Russian Empire (and no lack of active diplomatic efforts from said Russians) it seems possible that the Balkan states of Bulgaria and Serbia can put their differences aside for now to deal with other issues together. While this is a solid alliance in itself, maybe Montenegrin reinforcements and Greek ships could be put to good use too?"
 BUL_ww1_join_entente: "Join Entente"
 BUL_ww1_join_entente_desc: ""
 BUL_ww1_war_effort: "War Effort"
 BUL_ww1_war_effort_desc: ""
 BUL_ww1_anti_ottoman: "Anti-Ottoman Policy"
 BUL_ww1_anti_ottoman_desc: "While we've accomplished the long sought after unification with Eastern Rumelia, the Ottoman Empire still holds important Bulgarian inhabited territories. We should not forget this, and work to get them back. After all, in this turbulent era an opportunity might eventually present itself..."
 BUL_ww1_anti_auh: "Anti-Austro-Hungarian Policy"
 BUL_ww1_anti_auh_desc: ""
 BUL_ww1_BalkanLeagueMenace: "Balkan League Menace"
 BUL_ww1_BalkanLeagueMenace_desc: ""
 BUL_ww1_GreeceFriend: "Alliance with Greece"
 BUL_ww1_GreeceFriend_desc: ""
 BUL_ww1_bulgaria_first: "Bulgaria First"
 BUL_ww1_bulgaria_first_desc: "With the rather recent Bulgarian national awakening, our people are easily swayed by nationalist propaganda. We should continue to push this for the benefit of our Government and Army."
 BUL_ww1_recognize_minorities: "Recognize Minorities"
 BUL_ww1_recognize_minorities_desc: ""
 BUL_ww1_meet_croatian_leaders: "Meet Croatian Leaders"
 BUL_ww1_meet_croatian_leaders_desc: ""
