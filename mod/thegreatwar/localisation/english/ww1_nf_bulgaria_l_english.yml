 BUL_ww1_return_Dobrudja_desc: ""
 BUL_ww1_friend_romania: "Bulgarian-Romanian Friendship"
 BUL_ww1_friend_romania_desc: ""
 BUL_ww1_pro_fra: "Franco-Bulgarian Relations"
 BUL_ww1_pro_fra_desc: ""
 BUL_ww1_pro_rus: "Russo-Bulgarian Relations"
 BUL_ww1_pro_rus_desc: "Despite the very tense current situation, we must not forget that it was following the Treaty of San Stefano that the Principality of Bulgaria was able to see the light of day. Getting closer to Russia could be favorable to us."
 BUL_ww1_pro_ger: "German-Bulgarian Relations"
 BUL_ww1_pro_ger_desc: ""
