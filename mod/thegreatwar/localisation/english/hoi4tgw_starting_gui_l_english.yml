l_english:
 starting_header_1:0 "Welcome to the Great War Mod!"

 starting_monologue_1:0 "One hundred years ago, a war in Europe erupted which would change the world as we know it. Men were forced out of their homes, from their farms and apartments, to fight in seemingly neverending trenches, gaining meters and meters of ground a day at the cost of massive casualties.\n\nHearts of Iron IV: The Great War, an overhaul mod for Hearts of Iron IV, puts you in the position of one of the countries of the world in World War One's time period. In an era where the stakes were high and risks even higher, you'll have to tread lightly when it comes to diplomacy. A single mistake or a single bluff gone too far could mean the deaths of millions.\n\nOf course, that's not to say that the Great War is the only thing on anyone's minds. Revolution is flaring up in China and Mexico, Italy is rumored to have designs on taking Libya, and the Balkan States seem to be banding closer against one of their foreign targets. With all this conflict across the world, the Great Powers alone won't be having all of the fun.\n\nThe War itself has been modeled to match more closely the style of war of World War I. Infantry will rule the Battlefield at the beginning of the Conflict, before Planes and Armored Cars will take the field in good numbers. Trench Systems will see construction throughout Europe, until a mad engineer's dream, the Tank, rolls out of the factory and onto the Battlefield. All the while, massive fleets of massive Dreadnoughts will fill the Oceans, with all sides vying to wrest control of the waters.\n\nWith elaborate National Focus trees that delve deep into Alternate History, you may find two games with the same country end up completely differently. What if the Zimmermann Telegram had never been sent? What if Italy decided to go hardline and fight with the Central Powers? In this Mod, the smallest divergences can change everything.\n\nThe Great War Mod is designed to attempt to emulate how Paradox themselves would have designed the scenario, so veterans of the Hearts of Iron franchise will have no trouble adjusting. Even the new animations and models are designed with Paradox's standards in mind. You may just settle into the game so quickly, you'll wind up with trench foot and shell shock before you realize it."

 starting_faq_1:0 "Q: Ironman Friendly?\nA: We've modified way too many files for this.\n\nQ: Is it playable in Multiplayer?\nA: Yes! It's a great way to spend a saturday night, just make sure you boys don't let carried away and let that stretch to monday morning.\n\nQ: Recommended countries?\nA: The German Empire, Austria-Hungary and the French Republic are always a good choice to start but you are free to try any country.\n\nQ: Great Mod! Can I help you?\nA: Yes! We have a GitHub Repository for that.\n\nQ: Interwar Period and World War II?\nA: We've an Interwar Scenario since the Open Beta 0.10 and we already included some WW2 Vanilla National Focuses.\n\nQ: Where can I download it?\nA: We strongly recomand to use the Workshop Version but you can download it on Mod DB or NexusMods."

