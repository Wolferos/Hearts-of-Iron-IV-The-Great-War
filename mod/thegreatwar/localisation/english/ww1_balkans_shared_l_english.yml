#Focuses
 balkan_generic_focus: "Balkan Generic Focus Tree"
 BLL_balkan_politics: "Balkan Politics"
 BLL_balkan_politics_desc: "More so than those who master warfare, those who master diplomacy stand to gain in the dynamic Balkan Peninsula. The Ottoman Empire busy with revolts and Austro-Hungarian interference. So let's keep going!"
 BLL_anti_ottoman_policy: "Anti-Ottoman Policy"
 BLL_anti_ottoman_policy_desc: "While we've already fought against the Ottoman Empire for our Independence, and later for some territorial gains, we should not forget that there's more that should be ours to our south. We'll have to work towards getting them back still. After all, in this turbulent era an opportunity might eventually present itself..."
 BLL_form_the_balkan_league: "Form the Balkan League"
 BLL_form_the_balkan_league_desc: "With the blessing of the Russian Empire, it seems possible that the Balkan states can put their differences aside for now to deal with other issues together."
 BLL_appeasement_in_the_balkans: "Appeasement in the Balkans"
 BLL_appeasement_in_the_balkans_desc: "Diplomatic tensions escalate in the Balkans; consider a cautious approach to avoid conflict. Navigating the delicate balance of appeasement becomes paramount as regional stability hangs in the balance."
 BLL_pacifism: "Pacifism"
 BLL_pacifism_desc: "Do we still need to demonstrate today the unnecessary destruction and absurd waste of resources caused by wars? We must put our diplomatic corps to work on the peaceful resolution of conflicts. Ever more killings will lead us nowhere and will only generate ever more hatred and revanchism."
 BLL_rescind_our_claims_on_ottoman_land: "Rescind Our Claims on Ottoman Land"
 BLL_rescind_our_claims_on_ottoman_land_desc: "If we want to pacify our relations, then we must stop claiming everything and anything about our Ottoman neighbors. Let's officially renounce these old rivalries, and they will appreciate it all the more."
