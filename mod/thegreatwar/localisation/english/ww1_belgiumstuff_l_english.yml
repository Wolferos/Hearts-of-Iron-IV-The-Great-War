 # Diplomatic Tree
 BEL_ww1_diplomatic_effort: "Diplomatic Effort"
 BEL_ww1_diplomatic_effort_desc: "In today's world, remaining neutral is becoming increasingly difficult. Our diplomatic corps keeps urging us to either take a stance in the emerging power struggles or officially declare our neutrality. We cannot answer this question yet, but we can easily provide our diplomats with the tools to pursue either of these options."
 BEL_ww1_benilux_focus: "Benelux Focus"
 BEL_ww1_benilux_focus_desc: "Our geopolitical situation has always been very difficult, being squeezed between France, England, and Germany. We will always be surrounded by more or less hostile and far more powerful nations. So we must unite with our Dutch and Luxembourgish neighbors, so that the Benelux countries can pool our common efforts for our defense!"
 BEL_ww1_entente_focus: "Entente Friendship"
 BEL_ww1_entente_focus_desc: "It is hard to imagine that we would win the favor of the Prussians, who are decidedly too aggressive and expansionist! Our neighbors France and Great Britain are our natural allies. We must seek an alliance with them if Belgium is to survive the next century."
 BEL_adios_1839_agreement: "Revise the London Treaty"
 BEL_adios_1839_agreement_desc: "The Treaty of 1839 is old and outdated, and it primarily serves the British and Germans as a geopolitical instrument. We must demand a revision of its terms to better secure our sovereignty and independence, as well as the free use of our ports and naval bases."
 BEL_ww1_germany_focus: "Central Powers Friendship"
 BEL_ww1_germany_focus_desc: "The Austro-Prussian alliance is a dangerous mixture of raw military power and seemingly inexhaustible manpower. Who better to prevent these warlike Teutons from annihilating us in the event of war? We should court them diplomatically."
 BEL_ww1_neutrality_focus: "Neutrality Focus"
 BEL_ww1_neutrality_focus_desc: "Nothing stops the urge for conquest. After Napoleon came Wilhelm II, and there will always be others: We must not and cannot allow ourselves to be drawn into new wars every 50 years, wars that are as murderous as they are pointless. Absolute neutrality must be our only political position, if only to set an example for other peace-loving countries."
 BEL_ww1_ally_benilux: "Benelux Alliance"
 BEL_ww1_ally_benilux_desc: "No one is under any illusions about the military resilience of Belgium, the Netherlands, and even more so Luxembourg, if the Germans or French ever decide to invade any of the countries. But if we establish a military alliance with our two neighbors, such a challenge will be much, much harder for anyone to undertake... and we increase our chances of protecting ourselves from aggression."
 BEL_ww1_conquer_benilux: "Conquer Benelux"
 BEL_ww1_conquer_benilux_desc: "There was a time when Belgium was infinitely larger than it is today. We should reunite the old Belgian territory, especially since our neighbors have repeatedly demonstrated political misjudgment and weakness. We must annex Luxembourg and the Netherlands."
 BEL_ww1_major_alliance: "Choose Side"
 BEL_ww1_major_alliance_desc: "Neutrality was an illusory choice. It is now a dead end, and the entire Belgian political class recognizes this; we must choose a side—and immediately... the Entente or the Triple Alliance?"
 BEL_ww1_fortify_borders: "Fortify Borders"
 BEL_ww1_fortify_borders_desc: "Unlike our neighbors, we absolutely cannot afford to lose any territory before stopping the invaders: an external aggressor must be stopped at the border—or not at all! We must therefore fund a new program to build trenches and armored casemates."
 BEL_ww1_demand_eupen: "Demand Eupen"
 BEL_ww1_demand_eupen_desc: "The city of Eupen fully belongs to Wallonia, and the German Empire stole it from us in 1815. They do not need it, although it rightfully belongs to our nation! We must demand its return to Belgium."
 BEL_ww1_unite_benilux: "Unite Benelux"
 BEL_ww1_unite_benilux_desc: "Enough patience. The Benelux countries are now partially or fully under our control. To make history, we must fully unite these nations located at Europe's crossroads."

 BEL_ww1_congo: "Congolese Policy"
 BEL_ww1_congo_desc: "It is remarkable that such a small nation as ours possesses such a vast colonial empire! We must not leave the initiative to the private sector, but instead invest decisively more in our colonial policy, hire administrators, and dedicate a ministry to these matters."
 BEL_ww1_congo_infra: "Congolese Infrastructure Financing Plan"
 BEL_ww1_congo_infra_desc: "The Congo is potentially immensely rich and is inhabited by diligent and willing people. Our colonial minister has drawn up a thirty-point plan based on an ambitious financing project: roads, railway lines, ports, stations, warehouses, private enterprises, and public spaces! Let us spend without counting the cost."
 BEL_ww1_ReorganizeForcePublique: "Reorganize La Force Publique"
 BEL_ww1_ReorganizeForcePublique_desc: "Our colonial army can no longer rely exclusively on soldiers from the homeland, who are sent with great difficulty to the heart of Africa, are few in number, and regularly suffer from disease and supply issues. We must rely on the locals and involve the Congolese in the exercise of public authority."
 BEL_ww1_congo_RubberMonocultureExpansion: "Rubber Monoculture Expansion"
 BEL_ww1_congo_RubberMonocultureExpansion_desc: ""What is rubber used for? For everything, of course! In both civilian and military industry, rubber is in demand everywhere, especially for the tires that equip the new automobiles. And as luck would have it, the Congo, where the rubber tree grows, has rubber in abundance. We must fund a program to develop new rubber plantations."
 BEL_ww1_ApproveLeopoldLegacyCongo: "Defend Leopold II's Legacy"
 BEL_ww1_ApproveLeopoldLegacyCongo_desc: "Despite his brutal suppression orders, Leopold II left Belgium a vast territory in Africa. It is thanks to him that we were able to take possession of the entire Congo Basin! We must honor his efforts."
 BEL_ww1_CongoFreeState: "Reestablish the Congo Free State"
 BEL_ww1_CongoFreeState_desc: "The independent Congo Free State, founded in 1885, paved the way for the future restoration of a free and sovereign state. We propose to continue on this path, and one day, the Congo will be our most valuable ally."
 BEL_ww1_ColonialRepression: "Colonial Repression"
 BEL_ww1_ColonialRepression_desc: "Recent unrest in our African colonies threatens to spread like wildfire. We must send clear and unequivocal instructions to our colonial authorities and order the merciless suppression of uprisings and banditry!"
 BEL_ww1_InviteEuropeanSettlers: "Invite European Settlers"
 BEL_ww1_InviteEuropeanSettlers_desc: "To increase our influence on the land, we must encourage Belgians to migrate to the heart of Africa. More settlers ultimately mean more businesses, goods, and power."
 BEL_ww1_DenyLeopoldLegacyCongo: "Deny Defend Leopold II's Legacy"
 BEL_ww1_DenyLeopoldLegacyCongo_desc: "King Leopold II was wise, but he also made terrible mistakes and exploited the colonized population in dreadful ways. These horrors must never be repeated... and we must discreetly sweep this unfortunate legacy under the rug."
 BEL_ww1_FreeCongo: "Free Congo"
 BEL_ww1_FreeCongo_desc: "History is not moving in the direction of oppression. The Congolese deserve to be free and independent like everyone else, especially since this colony has not brought us much. We must meet with local politicians and prepare the full autonomy of the country."
 BEL_ww1_ClaimingHumanRightsAfrica: "Claiming Human Rights in Africa"
 BEL_ww1_ClaimingHumanRightsAfrica_desc: "Human rights are a universal truth, whether for white, black, or any other peoples on Earth! It was a disastrous blindness to deny this until now. The Congolese are a proud and free people who have suffered enough."

