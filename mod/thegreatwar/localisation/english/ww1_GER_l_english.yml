 GER_int_hitler_chancellor: "Name Hitler Chancellor of Germany"
 GER_int_hitler_chancellor_desc: "Chancellor von Papen has advised President Hindenburg to give Hitler his post. So long as the President was alive and able to keep his power, Hitler shouldn't be able to exercize true control, and will burn himself out. Yet, this is a serious risk...but may avert Civil War."
 GER_int_reichstag_fire_decree: "Reichstag Fire Decree"
 GER_int_reichstag_fire_decree_desc: "The Reichstag Fire Decree (Reichstagsbrandverordnung) is the common name of the Decree of the Reich President for the Protection of People and State issued by German President Paul von Hindenburg on the advice of Chancellor Adolf Hitler in immediate response to the Reichstag fire. The decree nullified many of the key civil liberties of German citizens."
 GER_int_night_long_knives: "Night of the Long Knives"
 GER_int_night_long_knives_desc: "Now that the new Reich has taken over, the old enemies must be purged. Anyone who could potentially ever even be against the Reich must be purged- and quickly!"

