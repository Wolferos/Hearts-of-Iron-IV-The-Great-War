 RUS_ww1_avenge_fall_constantinople: "Avenge 1453"
 RUS_ww1_avenge_fall_constantinople_desc: "The Fall of Constantinople was the capture of the capital of the Byzantine Empire by an invading army of the Ottoman Empire on 29 May 1453. The Ottomans were commanded by Mehmed the Conqueror, the seventh sultan of the Ottoman Empire, who defeated an army commanded by Byzantine Emperor Constantine XI Palaiologos."
