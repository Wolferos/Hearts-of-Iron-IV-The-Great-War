# Army Tree
#=========================================================================
 RUS_ww1_army_effort: "Reorganise Imperial Russian Army"
 RUS_ww1_army_effort_desc: "The army has not seen major reforms since Dmitry Milyutin's reforms in 1874. It is time to reorganize the Russian Imperial Army for today's warfare."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 RUS_ww1_form_air_force: "Form Imperial Russian Air Service"
 RUS_ww1_form_air_force_desc: "Military aviation seems to have a bright future. This is why we must separate as soon as possible the Imperial Russian Air Service from Engineer Corps to become a separate branch of the army."
 RUS_ww1_aviation_effort_2: "Sikorsky's Airplane Research"
 RUS_ww1_aviation_effort_2_desc: "The genius of Igor Sikorsky in the field of aviation is beyond doubt. We must support this talented engineer so that he can develop Russian planes capable of rivaling, if not exceeding, the performance of those of the other great powers."
 RUS_ww1_aviation_effort_4: "Russko-Baltiisky Vagonny Zavod"
