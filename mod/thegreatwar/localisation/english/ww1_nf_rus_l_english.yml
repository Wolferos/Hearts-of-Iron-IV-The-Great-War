 RUS_ww1_adopt_reforms: "Adopt The Reforms"
 RUS_ww1_adopt_reforms_desc: "The Empire is under attack from all sides, maybe we should accept some reforms proposed by the opposition. If we do nothing, we run the risk of seeing revolutionary movements appear."
