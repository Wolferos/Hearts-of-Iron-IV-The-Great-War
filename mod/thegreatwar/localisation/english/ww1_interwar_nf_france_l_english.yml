 #--------------------------------------------------------------
 # [FRANCE] Interwar
 #=========================================================================
 FRA_interwar_PeaceAfterVersailles: "Peace at Last"
 FRA_interwar_PeaceAfterVersailles_desc: ""

 FRA_interwar_allied_occupation_rhineland: "Allied Occupation of the Rhineland"
 FRA_interwar_allied_occupation_rhineland_desc: "Courtesy of the Treaty of Versailles, France has full rights of not only occupation of the Rheinland, but also full economic power in the region, a great boon to the French economy. If we take advantage of our tenure here, we can ensure that Germany's loss is France's gain."
 FRA_interwar_annees_folles: "Les Années Folles"
 FRA_interwar_annees_folles_desc: "The end of the war has brought upon us a great economic boom, unmatched by any prior. While some economists are warning that the good times may not last forever, they're just sticks in the mud and prudes. France and the French people will live it up while the times are good!"
 FRA_interwar_occupation_ruhr: "Occupation of the Ruhr"
 FRA_interwar_occupation_ruhr_desc: "The Germans are unable to pay their completely unreasonable debt to us, perhaps unsurprisingly, which is yet more opportunity for France. The Ruhr region is rich in resources and manufacturing, and we can simply expand our occupation of the Rheinland into the region as compensation for the missed payments."
 FRA_interwar_france_interwantion_in_syria: "Intervene in Syria"
 FRA_interwar_france_interwantion_in_syria_desc: ""
 FRA_interwar_war_with_syria: "War With Syria"
 FRA_interwar_war_with_syria_desc: ""
 FRA_interwar_great_depression: "Deflationist Program"
 FRA_interwar_great_depression_desc: "The French government and populace has come to a rare consensus on the subject of the depression. It is a necessary evil, to rid the world of excess flowing cash and companies in over their head saved by speculation and governments. Let them burn, then, as France will simply steer herself for the imminent recovery! Deflation of the Franc will keep us competitive in these times."
 FRA_interwar_treaty_of_lausanne: "Treaty of Lausanne"
 FRA_interwar_treaty_of_lausanne_desc: ""
 FRA_interwar_invade_constantinople: "Invade Constantinople"
 FRA_interwar_invade_constantinople_desc: "The situation in Turkey is out of control, perhaps we should consider setting up a military intervention in order to regain control."

 FRA_interwar_SupportWhiteRussia: "Support the White Movement"
 FRA_interwar_SupportWhiteRussia_desc: "The Whites aren't republicans but they are the only force still capable of standing up to the Bolsheviks, we should support them, better an Imperial Russia than a Russia full of marxist ideas."

 FRA_interwar_SupportKoltchak: "Help Koltchak"
 FRA_interwar_SupportKoltchak_desc: "Too much blood has been spilled. It is time for France to abandon the White cause."

 FRA_interwar_WarWithSoviet: "Military Intervention in Russia"
 FRA_interwar_WarWithSoviet_desc: ""

 FRA_interwar_BetrayKoltchak: "Betray Koltchak"
 FRA_interwar_BetrayKoltchak_desc: ""

 FRA_interwar_DealWithSoviet: "Secret Deal with the Soviets"
 FRA_interwar_DealWithSoviet_desc: ""

 FRA_interwar_HelpPoland: "Send Equipment to Haller's Army"
 FRA_interwar_HelpPoland_desc: ""
