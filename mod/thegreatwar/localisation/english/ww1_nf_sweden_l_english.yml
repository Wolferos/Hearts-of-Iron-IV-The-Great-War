 SWE_necessary_purges: "Necessary Purges"
 SWE_necessary_purges_desc: "The nation needs to be cleansed of elements that oppose our goal"
 SWE_ww1_fancy_uniforms: "Fancy Uniforms"
 SWE_ww1_fancy_uniforms_desc: "We need to spend more money on full dress uniforms to match our glorious history"
 SWE_ww1_gendarmerie: "Gendarmerie"
 SWE_ww1_gendarmerie_desc: "Let the army take a load of the ordinary police work. They are so effective at what they do."
 SWE_ww1_monarchy: "Authoritarianism Focus"
 SWE_ww1_monarchy_desc: ""
 SWE_ww1_laborcamp: "Labor Camps"
 SWE_ww1_laborpcamp_desc: "Work sets you free"
 SWE_ww1_new_thinking: "Improve Karlberg"
 SWE_ww1_new_thinking_desc: "To be the best we need to start thinking on new tactics"
 SWE_ww1_freespeech: "Free Press"
 SWE_ww1_freespeech_desc: "Form the Swedish Press Council"
 SWE_ww1_full_rearmament: "Harsh Rationing"
 SWE_ww1_full_rearmament_desc: ""
 SWE_ww1_massive_effort: "Massive Effort"
 SWE_ww1_massive_effort_desc: ""
 SWE_ww1_no_loitering: "No Loitering!"
 SWE_ww1_no_loitering_desc: "Any failure to earn an honest living shall be condemned to forced labor. This is a treatment effort and not a punishment."
 SWE_ww1_SpreadRevolution: "Spread the Revolution"
 SWE_ww1_SpreadRevolution_desc: "Help our brethren to break free from their shackles"
 SWE_ww1_foreign_expeditions: "Foreign Expeditions"
 SWE_ww1_foreign_expeditions_desc: "Let us fight with those who fight for our cause"
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 SWE_ww1_diplomatic_effort: "Diplomatic Effort"
 SWE_ww1_diplomatic_effort_desc: ""
 SWE_ww1_germany_focus: "Befriend the Central Powers"
 SWE_ww1_germany_focus_desc: "We stand with Germany! Let us exchange a bit more iron ore (from the Gällivare fields) for coal and other goods."
 SWE_ww1_neutrality_focus: "Neutrality"
 SWE_ww1_neutrality_focus_desc: ""
 SWE_ww1_boden_fortress: "Build the Boden Fortress"
 SWE_ww1_boden_fortress_desc: "We have known of the strategic importance of the northern Gulf of Bothnia since the late 1880s. Things have dragged on long enough. We must fund the construction of a fortress at Boden that will halt offensives coming from our eastern neighbors."
 SWE_ww1_boden_fortressII: "Reinforce the Boden Defenses"
 SWE_ww1_boden_fortressII_desc: "The fortress is complete, but the original plan must be adapted to recent developments in the war. We must reinforce the internal structure of the forts and equip them with new guns."
 SWE_ww1_boden_fortressIII: "Perfect the Defense of Boden"
 SWE_ww1_boden_fortressIII_desc: "The commander of Boden has sent us a memorandum, and in it, he explains that he needs a full Corps of Engineers to effectively defend the secondary forts and make full use of the infrastructure."
 SWE_ww1_fortify_coast: "Coastal Defense"
 SWE_ww1_fortify_coast_desc: "We must draw up plans for the protection of our coasts, and prepare against an enemy amphibious landing. This must not happen."
 SWE_ww1_conquer_finland: "Retake Finland"
 SWE_ww1_conquer_finland_desc: "There was a time when Greater Scandinavia occupied both shores of the Gulf of Bothnia. It is time to reclaim the former eastern half of the kingdom."
 SWE_ww1_major_alliance: "Choose a Side"
 SWE_ww1_major_alliance_desc: "The Old Continent is being torn apart between the Triple Alliance and the Triple Entente, and the consequences of this conflict are spreading across the entire planet! We can no longer turn a blind eye, we must choose our side, and quickly!"
 SWE_ww1_demand_aland: "Demand Åland"
 SWE_ww1_demand_aland_desc: "The Åland Islands are an unavoidable strategic possession of the Baltic... and in foreign hands, they are a dagger pointed at Stockholm! We must demand control of these lands."
 SWE_ww1_scandinavian_talks: "Inter-Scandinavian Talks"
 SWE_ww1_scandinavian_talks_desc: "Let's talk about current events!"
 SWE_ww1_scandinavian_defence_union: "Scandinavian Defense Union"
 SWE_ww1_scandinavian_defence_union_desc: "By acting together, we can strengthen our position against the belligerents. We will not match any of the continent's great military states, but we will be strong enough to make our voice respected throughout the world."
 SWE_ww1_uk_deal: "Trade Agreement with the United Kingdom"
 SWE_ww1_uk_deal_desc: "Let us exchange a bit more iron ore (from the Kiruna fields) for food and other goods."
 SWE_ww1_central_power: "Join the Central Powers"
 SWE_ww1_central_power_desc: "The Central Powers have long been friends of our country, and they desperately need our help in these uncertain times. Joining them is a one-way ticket to fighting the war on their side, and we had better be sure of what we are doing and have the means to win, but our support could turn the winds of fate."
 SWE_ww1_german_support: "German Support"
 SWE_ww1_german_support_desc: "The Germans have the best army in the world, and highly effective leadership. Since we are joining their side, we must ask them to support us in order to be useful allies."
 SWE_ww1_disarmament: "Disarmament"
 SWE_ww1_disarmament_desc: "The liberals want to reduce military spending and invest in social reforms. The war has weighed heavily enough on the shoulders of our people."
 SWE_ww1_rearmament: "Rearmament"
 SWE_ww1_rearmament_desc: "The right-wing parties want to invest more in defense and domestic ammunition production. We do not know what tomorrow holds, and a great country like ours cannot let its army wither away!"
