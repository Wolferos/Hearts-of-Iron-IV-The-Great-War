#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 SWE_ww1_naval_effort: "Modernize the Svenska Marinen"
 SWE_ww1_naval_effort_desc: "Combustion-powered ships have begun to shine above their contemporaries, and have heralded yet another new era of naval warfare. Huge ships with equally large guns fighting at incredible engagement ranges is slated to be the order of the day. Due to this, a modernization program for our ships, as well as training in the new ways of warfare for our officers, is most certainly in order."
#--------------------------------------------------------------
# Interwar Tree
#=========================================================================
 SWE_ww1_interwar_Victory: "Sweden Victorious"
 SWE_ww1_interwar_Victory_desc: "Some doubted our victory, but they now admit they were wrong. Sweden is among the great victors of this conflict, and will take part in shaping the new world order!"
 SWE_ww1_interwar_scandinavian_position: "The Scandinavian Question"
 SWE_ww1_interwar_scandinavian_position_desc: "The question of a Scandinavia united beyond the national differences still separating Danes, Norwegians, Swedes, and Finns is gaining importance in public debate. And lately, it has even come up several times in Parliament..."
 SWE_ww1_interwar_regional_neutrality: "Regional Neutrality"
 SWE_ww1_interwar_regional_neutrality_desc: "This part of the world is relatively well balanced, and it should remain so. We are not defenseless, but we are resolved not to attempt any new military adventure, and it is this clear position that our diplomats will affirm in the years to come."
 SWE_ww1_interwar_nordic_dominance: "Nordic Leadership"
 SWE_ww1_interwar_nordic_dominance_desc: "Sweden is by far the most powerful state in the whole of northern Europe, and it is time we assumed the responsibilities that come with wealth and power. Let us assure our neighbors of our friendship and protection."
 SWE_ww1_interwar_mutual_defense: "Mutual Defense"
 SWE_ww1_interwar_mutual_defense_desc: "A guarantee of independence is not quite an alliance, but it is close. It is, in a way, a defensive alliance, one that allows us to unite against the predation of our neighbors, be they Russian, German, or even British."
 SWE_ww1_interwar_scandinavian_development: "Scandinavian Development"
 SWE_ww1_interwar_scandinavian_development_desc: "This excellent Scandinavian cooperation also allows us to pool financial and material resources for our mutual development! We are already reaping the first benefits, and the economy now sees its means increased all the more."
 SWE_ww1_interwar_integration_of_foreign_affairs: "Integration of Foreign Affairs"
 SWE_ww1_interwar_integration_of_foreign_affairs_desc: "Of course, this does not directly concern our allies, but Gustaf V's speech is nonetheless full of good foreign policy ideas, ones that would benefit them as well. We should invite them to consider it."
 SWE_ww1_interwar_scandinavian_emperor: "Scandinavian Emperor"
 SWE_ww1_interwar_scandinavian_emperor_desc: "What a joyous day! Amid popular rejoicing, the parliaments of both Norway and Finland have accepted, by near-unanimous vote, the proposal of Scandinavian unity we put to them. Gustaf V will ascend the throne of a new empire... that of Scandinavia!"
#--------------------------------------------------------------
# Finland Tree
#=========================================================================
 SWE_ww1_finnish_affairs: "Finnish Affairs"
 SWE_ww1_finnish_affairs_desc: "Now that Finland is under Swedish control, we must take our responsibilities to give this people good living conditions. By investing ourselves in the governance of Finland, internal peace will be strengthened."
 SWE_ww1_expand_the_pohjanmaa_sawmills: "Expand the Pohjanmaa Sawmills"
 SWE_ww1_expand_the_pohjanmaa_sawmills_desc: "Wood is a useful resource for any industry, whether civilian or military. And our country has an immense forest cover! Let us finance the creation of new sawmills."
 SWE_ww1_develop_chromium_sources: "Develop Chromium Sources"
 SWE_ww1_develop_chromium_sources_desc: "Chromium is becoming a rare metal, yet indispensable to our industry, particularly for manufacturing aircraft. And we know that Sweden holds untapped deposits."
 SWE_ww1_fortify_the_border: "Fortify the Border"
 SWE_ww1_fortify_the_border_desc: "The Russians are a constant threat we must prepare against. Let us remember that the bear is never truly hibernating!"
 SWE_ww1_expand_karjalan_railways: "Expand the Karjalan Railways"
 SWE_ww1_expand_karjalan_railways_desc: "Karelian communication routes are notoriously insufficient, and would greatly benefit from an expansion of the railway network, for both civilian and military use."
 SWE_ww1_light_industry_development: "Light Industry Development"
 SWE_ww1_light_industry_development_desc: "Pharmaceuticals, textiles, food processing... let us unlock funds intended to expand Finland's light industrial base."
 SWE_ww1_heavy_industry_development: "Heavy Industry Development"
 SWE_ww1_heavy_industry_development_desc: "Foundries, steelworks, arsenals... let us unlock funds intended to expand Finland's heavy industrial base."
 SWE_ww1_scandinavian_investment: "Scandinavian Investment"
 SWE_ww1_scandinavian_investment_desc: "Now that Scandinavia is a reality, it must be given the means to match its ambitions. We have gathered funds to invest in the development of our regions."
 SWE_ww1_swedish_ingria: "Swedish Ingria"
 SWE_ww1_swedish_ingria_desc: "The Russians tend to forget it, but we do not: once a possession of the Swedish empire, Ingria was unjustly stolen from us, then made the heart of the Russian empire by Peter the Great. In the event of war, this will be a priority target for us... Saint Petersburg will be ours!"
 SWE_ww1_greater_finland: "Greater Finland"
 SWE_ww1_greater_finland_desc: "We should remind the Finnish people of the long heritage they carry, and that their lands once stretched far further than they do today! And that with a little more sacrifice, we can see this great kingdom rise again."
 SWE_ww1_sweden_victorious: "Victory in the East"
 SWE_ww1_sweden_victorious_desc: "It is finally over, the conflict has been won. The plenipotentiaries await our decision, but our claims are ready: we will annex Murmansk, Onega, and Olonets."
 SWE_ww1_haven_for_white_russian_refugees: "Haven for White Russian Refugees"
 SWE_ww1_haven_for_white_russian_refugees_desc: "Russia will suffer for a long time yet from the civil war and its aftermath, and the Reds are committing appalling atrocities. We must offer a refuge to those fleeing this devastated country."
