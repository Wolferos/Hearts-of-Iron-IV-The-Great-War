 SWE_ww1_executive_monarchy: "Executive Constitutional Monarchy"
 SWE_ww1_executive_monarchy_desc: "Rewrite the constitution! Give the king the means he needs to put things right."
 SWE_ww1_absolute_monarchy: "Absolute Monarchy"
 SWE_ww1_absolute_monarchy_desc: "Yet another small change in the constitution is needed. Let the King have his changes in the constitution."
