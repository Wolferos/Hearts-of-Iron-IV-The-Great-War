#Ideas
 
 TUR_illitirate_population: "Illitirate Population"
 TUR_illitirate_population_desc: "Most of our population doesnt know how to read and write caused by the lack of schools in the countryside. If we want to catch up on the western powers in technologhy we shall reform our education system."
 
 TUR_army_of_bygone_era_ns: "Army of Bygone Era"
 TUR_army_of_bygone_era_ns_desc: "Our army is very uncompetent compeared to European armies because of the the lack of army reforms if we want to go to war we really need to make big army reforms"

 TUR_abdulmejid_ii: "Abdulmejid II"

 TUR_ottoman_public_debt_administration_ns: "Ottoman Public Debt Administration"
 TUR_ottoman_public_debt_administration_ns_desc: "Ottoman Public Debt Administration created because of our massive unpaid debts to France,Britain and Germany.Administration controls nearly every part of our economy and makes us reliant on foreign goods.If we want to regain our control over our own economy we need to pay our massive debts."
 TUR_small_debt_payment_ns: "Small Debt Payment"
 TUR_large_debt_payment_ns: "Large Debt Payment"

 TUR_outdated_industry_ns: "Outdated Industry"
 TUR_outdated_industry_ns_desc: "Our industry is pretty weak compeared to their European counterparts mainly because of our production methods being pretty old and ineffecient if we want to rival the industries of big powers we need to modernize our economy."

 TUR_separatist_movements_ns: "Separatist Movements"
 TUR_separatist_movements_ns_desc: "Ottoman Empire is plauged with nationalist rebellions all the way from the Napoleonic Wars. Because of them gaining popularity every day we cant control them after some time. This is the exact reason why we lost our most Balkan terrorities. While they are given more and more rights to the different ethnicities it is again not enough to stop them."
 
 TUR_capitulations_ns: "Capitulations"
 TUR_capitulations_ns_desc: "Capitulations or in Turkish "Kapitülasyonlar" are deals that give foreign merchants special privilages. They are used tostimulate the market and show friendship among countries but with the age of industrilazition they become deals that harms countries. A greatexample is the Ottoman Empire. At the start they allowed for cheap goods enter the market but as the capitulations grew. They began to shrink our own domestic production and lead to economic problems."
 
 TUR_Mehmed_V_ns: "Mehmed the V"
 TUR_Mehmed_V_ns_desc: "Mehmed the V is 35th Ottoman Sultan and 114th Ottoman Caliph. He is put on the throne after his brother Abdulmejid the II had deposed. While he is very popular among the people he doesnt hold any real power."
 
