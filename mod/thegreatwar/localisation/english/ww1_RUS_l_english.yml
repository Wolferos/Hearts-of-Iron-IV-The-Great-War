l_english:
#Ideas
 RUS_rural_communities: "Obshchina"
 RUS_rural_communities_desc: "Obshchina are rural communities of peasants made up of former serfs being forced into communalization."
 RUS_political_deadlock: "Political Deadlock"
 RUS_duma_1: "Duma"
 RUS_aladincare_1: "Aladincare"
 RUS_aladincare_1_desc: "Aladincare are social welfare programs founded by the Russian prime minister Aleksei Aladin."
 RUS_the_stolypin_reforms_1: "Stolypin's Reforms"
 RUS_tsars_authority_1: "Tsar's Authority"
 RUS_ww1_dual_power_ns: "Dual Power"
 RUS_ww1_dual_power_ns_desc: "It is said that ancient Sparta had two kings, each preventing the other from becoming overly authoritarian and megalomaniacal. We should try the experiment and encourage sharing supreme power at the head of the country between two individuals."
 RUS_ww1_october_revolution_ns: "October Revolution"
 RUS_ww1_october_revolution_ns_desc: "The October Revolution has just erupted, and the centuries-old power of the Tsars is faltering! The Bolsheviks are galvanized by the fiery speeches of leaders like Lenin, and the people are taking to the streets. Russia is covered in red!"
#Focuses
 #Political
 RUS_support_duma: "Support the Duma"
 RUS_support_duma_desc: "The Tsar may have too much power. Perhaps we should take inspiration from the British to strengthen the power of parliamentarians before it's too late and the Empire collapses on itself."
 RUS_independent_courts: "Independent Courts"
 RUS_independent_courts_desc: "Although the courts were given independence by Alexander II in 1864, those rights have since been stripped away following his death. If we are to be a true democracy, we must allow the courts to work independently of the Tsar."
 RUS_election: "The Election of [GetYear]"
 RUS_election_desc: "The recent Duma elections have been quite corrupt, with the nobility and wealthy gaining top priority. We shall hold a fully democratic election inside the country, where a wide margin of our people will be able to participate in the voting."
 RUS_aladin: "His Excellency, Aladin"
 RUS_aladin_desc: "Results have come in, and the victor of the election is Aleksei Aladin, a trudovik, who has widely been considered one of the Duma's best and most brilliant for challenging the Tsar's autocracy. The people have spoken and have chosen him to lead Russia."
 RUS_decommunalization: "Abolish the Obshchina"
 RUS_decommunalization_desc: "It is clear that the Obshchina was only made to keep the peasants subjugated under the wealthy's control, despite the ban on serfdom in the country. We can no longer give favoritism to the higher-ups, and thus this policy must be abolished for a fully democratic nation."
 RUS_welfare: "Aladincare"
 RUS_welfare_desc: "With the Obshchina now gone, we can now properly focus on granting equal rights. Agrarian land reforms shall be launched, and peasants shall be given more rights so that our working class can thrive."
 RUS_protect_labor: "Labor Rights"
 RUS_protect_labor_desc: "Further labor rights shall be given to the workers, to show that we protect and care for our glorious workers."
 RUS_lvov: "His Excellency, Lvov"
 RUS_lvov_desc: "Results have come in, and the victor of the election is Georgy Lvov, and although he has aristocratic roots, he remains fiercely devoted to democratic ideals, being part of the Kadet Party. The people have spoken and have chosen him to lead Russia."
 RUS_freeing_political_opponents: "Free the Opposition"
 RUS_freeing_political_opponents_desc: "Instead of trying to lock away the opposition, as seen under the Tsar's authority, we will instead allow the opposition against us to continue to go about, promoting their ideals. As a democracy, freedom of speech must be granted."
 RUS_reckless_industrialization: "Reckless Industrialization"
 RUS_reckless_industrialization_desc: "It is clear to everyone in the country that Russia lags behind the rest of Europe in terms of industrial might. If we are to be seen as a serious power, we must have a large economy to back it up, no matter how reckless it may be."
 RUS_champion_of_conservatism: "Conservative Champion"
 RUS_champion_of_conservatism_desc: "Lvov has been able to champion his conservative ideals inside the Russian nation and has led the nation to be better off. His conservative ideals will hopefully help the Russian nation go far in the world."
 RUS_status_quo: "Keep the Status Quo"
 RUS_status_quo_desc: "The time is not right for any such radical changes at the moment, as the situation in Russia remains tense. Balancing autocracy and democracy has proven to be very difficult since the 1905 revolution, but we must keep going as a radical change may result in one side becoming upset and destabilizing the nation."
 RUS_discuss_tsar_authority: "Discuss the Tsar's Authority"
 RUS_discuss_tsar_authority_desc: "The Tsar may have too much power. Perhaps we should take inspiration from the British to strengthen the power of parliamentarians before it's too late and the Empire collapses on itself."
 RUS_parliamentary_immunity: "Parliamentary Immunity"
 RUS_parliamentary_immunity_desc: "Although Parliamentary Immunity was established formally back in 1906, it remained under heavy restrictions by the Tsar. We must appease the pro-democracy advocates in our country and allow for full parliamentary immunity."
 RUS_fifth_duma: "Establish the Fifth Duma"
 RUS_fifth_duma_desc: "The current Fourth Duma has proven to be very weak and inefficient, and we can not rely on it for any political decisions, mainly due to it being politically polarized. New elections will be launched to officially establish a Fifth Duma inside the Empire."
 RUS_legitimate_power: "Legitimate Power in Leadership"
 RUS_legitimate_power_desc: "With these moves, we have seemingly legitimized our power inside the Russian Empire. We have allowed for light democratization that has led many to support the current status quo once again. Russia may remain on a tightrope, but at least we are now more secure than before."
 RUS_adopt_marxist_ideas: "Adopt Marxist Ideas"
 RUS_adopt_marxist_ideas_desc: "The current developments and status quo inside Russia have proved nothing in the grand scheme of things. It is clear by now that neither autocracy nor democracy will be able to flourish, and that only a radical change may lead to a successful future for the nation. Perhaps Lenin and his Bolsheviks have the right idea with Marxism..."
 RUS_legitimate_bolsheviks: "Bolsheviks Consolidation of Power"
 RUS_legitimate_bolsheviks_desc: "With us now allowing many of the Bolsheviks in the country, including Vladimir Lenin himself, they have begun to be entrenched in Russian politics, and their word and message are spreading quite rapidly. Their power is already beginning to consolidate, and perhaps soon Russia will become a socialist bulwark."
 RUS_disarm_the_cossacks: "Disarm The Cossacks"
 RUS_disarm_the_cossacks_desc: "The Cossacks are too powerful. We can no longer allow them to do as they please. We must disarm them before they stage a coup."
 RUS_right_of_the_people: "Declaration of the Rights of the Peoples"
 RUS_right_of_the_people_desc: "With any such opposing forces now out of the way, we can finally overthrow the government in a relatively peaceful manner and establish a communist Russian state. Lenin will become the leader of this country, and privileges are already being stripped from the upper class, and full equality is on its way. Russia is about to see a red flood."
 RUS_the_stolypin_reforms: "Accelerate the Stolypin Reforms"
 RUS_the_stolypin_reforms_desc: "Although the Stolypin Reforms have benefitted Russia, it is clear that their full effects have not yet been seen. We must accelerate these reforms to help speed up the process and allow the country to improve at a much faster rate."
 RUS_invite_foreign_investors: "Invite Foreign Investors"
 RUS_invite_foreign_investors_desc: "An essential part of growing our economy is ensuring we can get foreign investments from investors all across the world. We will invite them and hopefully get them to invest in our economy to help it grow."
 RUS_incentivize_urbanization: "Incentivize Urbanization"
 RUS_incentivize_urbanization_desc: "We need a bigger working class if we want our economy to function at the highest level. We will heavily promote and give incentives for people to move out of rural areas and into urban sectors."
 RUS_condemn_marxist_ideas: "Condemn Marxist Ideas"
 RUS_condemn_marxist_ideas_desc: "The supporters of Marx and his ideology have brought upon much chaos and instability for the Russian nation. Although Lenin and his cohort are not currently inside the country, the influence of their ideology remains. We must ensure this can not pose a threat to our country any longer."
 RUS_crush_strikes: "Crush Strikes"
 RUS_crush_strikes_desc: "Our recent actions in condemning Marxist ideas did not go over well with many people, with them resorting to strikes, destabilizing our country. We must crush these strikes before they can get any bigger!"
 RUS_resist_duma: "Resist the Duma"
 RUS_resist_duma_desc: "The Duma established following the 1905 revolution has only proved to weaken our state as a result. The Tsar's power has been weakened and has led to countless political stagnations since. If we want to be a fully functioning state, we must resist and eventually get rid of the Duma."
 RUS_reinforce_tsar_authority: "Reinforce the Tsar's Authority"
 RUS_reinforce_tsar_authority_desc: "The legitimate authority of the Tsar is constantly questioned. We must take strong measures to put an end to this, even if it means making enemies."
 RUS_purge_imperial_guard: "Purge of the Imperial Guard"
 RUS_purge_imperial_guard_desc: "We cannot trust anyone, not even our own imperial guard. Many inside the Imperial Guard hold sympathies toward other ideologies, such as Marxism, which have proven to threaten our country's stability. We cannot allow these sectors in the Imperial Guard to continue meddling any longer. A purge shall begin!"
 RUS_arrest_opposition_leaders: "Arrest Opposition Leaders"
 RUS_arrest_opposition_leaders_desc: "To fully ensure that the Tsar remains with no opposition, we must ensure that the leaders of opposition groups against the Tsar cannot be allowed to function in our society. They shall be arrested at once."
 RUS_dissolve_imperial_duma: "Dissolve the Imperial Duma"
 RUS_dissolve_imperial_duma_desc: "The time has come. With no more threats to the Tsar and his power, we can finally take the big leap and dissolve the imperial duma, which has only weakened the Tsar's authority and brought 0 benefits. With the Duma gone, no one will be able to oppose the Tsar."
 #Diplomatic
 RUS_ww1_diplomatic_effort: "Diplomatic Effort"
 RUS_ww1_diplomatic_effort_desc: "Russia is in an interesting situation diplomatically, as although we are tied to an alliance with the French, it does not mean it is permanent. Many times we have tried to align with the Germans and Austrians, and maybe one more shot at it could make it finally work. There is also our stance on certain issues inside of the Balkans, Asia, and the Middle East which need our attention. Whatever diplomatic decisions we make will define the Russian nation in the years to come."
 RUS_ww1_assert_position_east: "Assert Position in the East"
 RUS_ww1_assert_position_east_desc: "The east has not been too kind to us. Although in recent decades we gained influence over the Chinese, our influence in Asia came crumbling down in 1905 as we suffered a humiliating defeat to the Japanese Empire, destroying a large portion of our navy and thwarting any further attempts to expand our influence in Asia. It has been a long while since then, and perhaps finally we could attempt to exert more influence over Asia once again."
 RUS_ww1_BalkansPolitics: "Balkans Politics"
 RUS_ww1_BalkansPolitics_desc: "We have prompted up many regimes in the Balkans in the past, whether it be Serbia, Bulgaria, or Romania. We must ensure that these nations remain independent and under our sphere of influence. Rumor has it they may be banding together to expel the Ottomans from Europe. Perhaps we could aid in that..."
 RUS_ww1_ApeasementBalkans: "Appeasement in Balkans"
 RUS_ww1_ApeasementBalkans_desc: "The situation in the Balkans could deteriorate further and work against us. We should seek solutions to defuse the situation."
 RUS_ww1_rom: "Romanian Rapprochement"
 RUS_ww1_rom_desc: "Although we were the ones to ultimately free and liberate the Romanians from Ottoman control in 1878, this did not stop them from instead cozying up to the Germans and joining the Triple Alliance. Despite their entry, their country continues to remain at a crossroads on which side to lean toward. Perhaps if we make them some promises, we can sway them to our side fully instead."
 RUS_ww1_oirganization_realm: "Organize the Realm"
 RUS_ww1_oirganization_realm_desc: "With our recent choices in foreign policy, we have been able to organize our own sphere of influence, allowing for the Russian Empire to acquire a bigger realm across the globe. We must organize this realm and ensure that it remains intact no matter what."
 RUS_ww1_fortify_russian_borders: "Fortify Russian Borders"
 RUS_ww1_fortify_russian_borders_desc: "It is no secret that if we ever come into confrontation with the Germans, it will be difficult to defend due to the type of terrain we will be fighting on. We must take extensive measures to improve our border defenses before it is too late."
 RUS_ww1_airport_russian_borders: "Build Airports near Russian Borders"
 RUS_ww1_airport_russian_borders_desc: "The advent of aviation is proving to be very important in the field of warfare. We should not lag and begin to invest in building airports right near our borders to ensure our planes will be able to fly and attack our enemies as quickly as possible."
 RUS_ww1_fortify_italian_borders: "Fortify Italian Borders"
 RUS_ww1_fortify_italian_borders_desc: ""
 RUS_ww1_fortify_bosnia_borders: "Fortify Balkans Borders"
 RUS_ww1_fortify_bosnia_borders_desc: ""
 RUS_ww1_fortify_coast_dalmatia: "Fortify Dalmatian Coasts"
 RUS_ww1_fortify_coast_dalmatia_desc: ""
 RUS_ww1_ready_country: "Recruitment Propaganda"
 RUS_ww1_ready_country_desc: ""
 RUS_ww1_military_harmonization: "Military Harmonization"
 RUS_ww1_military_harmonization_desc: ""
 RUS_ww1_balkans_policy: "Balkans Policy"
 RUS_ww1_balkans_policy_desc: ""
 RUS_ww1_balkans_policy_intervene: "First Balkan War Reaction"
 RUS_ww1_balkans_policy_intervene_desc: ""
 RUS_ww1_pro_fra: "Celebrate Russo-French Alliance"
 RUS_ww1_pro_fra_desc: "The long-standing bonds of friendship between Russia and France are strong, and our economic and military interests come together. Let us celebrate this alliance to show the Austrians and the Germans that in case of war we will fight against them as one man."
 RUS_ww1_friend_with_auh: "Second Russo-Austrian Agreement"
 RUS_ww1_friend_with_auh_desc: "Our first agreement with the Austrians was signed in 1897, to help silence the friction our nations had over the Balkans, and help increase cooperation between our states. It seems that the Austrians have, however, largely abandoned the stipulations of this agreement, as shown by their annexation of Bosnia in 1908. If we want to be on the side of the Germans, then we must ensure a new agreement is signed between us to establish our increased cooperation and spheres of influence."
 RUS_ww1_support_serbia_weapons: "Support Serbia"
 RUS_ww1_support_serbia_weapons_desc: "Serbia has always been our ally, and a loyal one at that. Their ambition to create a unified South Slavic state will benefit us, as it will weaken our enemies. We shall support them with whatever they need."
 RUS_ww1_RussoTurkishBorder: "Strengthen Russo-Turkish Border"
 RUS_ww1_RussoTurkishBorder_desc: "Time and time again we have had squabbles with the Ottoman Empire. With it now seeming as though they are warming up to the Germans, it seems likely they will join them if a big war were to come. We shall strengthen our border defenses with the Turks in preparation for such a circumstance."
 RUS_ww1_AzerbaijanisRights: "Recognize Azerbaijani People"
 RUS_ww1_AzerbaijanisRights_desc: "For a long time now, the Azerbaijani people have been classified as 'Turkic' instead of their own ethnicity. We need to gain favor from our ethnicities, especially those who hold critical resources, such as in the case of the Baku Oil Fields. The Azerbaijani people could sabotage this resource output if not treated fairly. As such, we will recognize and codify them explicitly as Azerbaijani people, to gain their favor."
 RUS_ww1_CaucasusFocus: "Caucasus Focus"
 RUS_ww1_CaucasusFocus_desc: "The Caucasus is an area where dire contention may occur. We have only just recently solidified our control over the area in recent decades. It also looks like the Ottomans are eyeing up our Caucasian lands for themselves. We put focus on this region and build it up, or else we fear the region destabilizing or losing the region altogether."
 RUS_ww1_restore_russia_glory: "Restore Russia's Former Glory"
 RUS_ww1_restore_russia_glory_desc: "Russia as a nation used to be one of glory and pride. Our military successes were everywhere, from Peter the Great's conquests to the defeat of Napoleon, largely by our hands. In recent times, our military has been proven to be weak and inefficient. We will need to restore our former glory at once and show our enemies we are still ones to be feared."
 RUS_ww1_avenge_fall_constantinople: "Avenge 1453"
 RUS_ww1_avenge_fall_constantinople_desc: "The Fall of Constantinople was the capture of the capital of the Byzantine Empire by an invading army of the Ottoman Empire on 29 May 1453. The Ottomans were commanded by Mehmed the Conqueror, the seventh sultan of the Ottoman Empire, who defeated an army commanded by Byzantine Emperor Constantine XI Palaiologos. We shall reverse this defeat and take the city back for ourselves!"
 RUS_wilhlems_deal: "Deal with Wilhelm II"
 RUS_wilhlems_deal_desc: "Although we may not have the best relations with them, making a deal with the German Empire may be our best bet. Our allegiance right now is France, and it is clear that in any big war to come, we will be taking the brunt of the attacks by the Germans and Austrians. We would like to avoid this devastation as much as possible. Making a deal with the Germans may be our best bet in doing so, even if it betrays our own allies."
 RUS_ww1_invest_west: "Invest in the West"
 RUS_ww1_invest_west_desc: "The western parts of our country hold a great amount of resources and have potential for a large industrial buildup. However, this area has been underdeveloped since we began our industrialization, leading to us not being able to reap the full reward. We must build the western parts up to gain the full benefits of the area."
 RUS_around_manchuria: "Invest in Outer Manchuria"
 RUS_around_manchuria_desc: "Our infrastructure on the border with Korea must be reinforced. If the Japanese want war again, we'll have to be ready."
 RUS_ww1_friend_with_romania: "Improve Relations with Romania"
 RUS_ww1_friend_with_romania_desc: "Although we were the ones to ultimately free and liberate the Romanians from Ottoman control in 1878, this did not stop them from instead cozying up to the Germans and joining the Triple Alliance. Despite their entry, their country continues to remain at a crossroads on which side to lean toward. Perhaps if we make them some promises, we can sway them to our side fully instead."
 RUS_ww1_EmbargoUK: "Sanctions United Kingdom"
 RUS_ww1_EmbargoUK_desc: "We have historically been rivals to the United Kingdom, shown explicitly during the Great Game between us that occurred during the mid-1800s. We only became allies in the Entente Cordiale out of convenience. With us now moving firmly to the German side, we no longer have a reason to keep our good relations. If they are enemies of Germany, they are enemies of us. An embargo shall be launched upon them."
 RUS_ww1_JoinCentralPowers: "Knife in the Back"
 RUS_ww1_JoinCentralPowers_desc: "The time has come to officially withdraw from the Entente and join the Central Powers alongside Germany and Austria-Hungary. Our allies may see this as a pure betrayal, as we have now put a knife into their backs and harmed their chances against Germany, but we see it differently. The brothers' alliance has been reborn."
 RUS_ww1_reinforce_western_forts: "Reinforce Western Border"
 RUS_ww1_reinforce_western_forts_desc: "It is no secret that if we ever come into confrontation with the Germans and the Austrians, it will be difficult to defend due to the type of terrain we will be fighting on. We must take extensive measures to improve our border defenses before it is too late."
 RUS_ww1_defy_germany: "Defy Germany"
 RUS_ww1_defy_germany_desc: "The Germans have proven time and time again that they are a people we cannot trust, and we must defy them at every step. To do this, we shall guarantee the independence of all countries which may be invaded by them in the future, to ensure they do not get far."
 RUS_annex_northern_persia: "Occupy Northern Persia"
 RUS_annex_northern_persia_desc: "Although the Persians have claimed themselves as a neutral party, who knows how long that can be trusted. If they were to oppose us, our trade routes and interests in the country set up by the Anglo-Russian Convention could be harmed. We shall preemptively occupy the northern part of their country to secure these vital assets."
 RUS_ww1_Attack_Afghanistan: "Prepare the invasion of Afghanistan"
 RUS_ww1_Attack_Afghanistan_desc: "It is becoming clear that Afghanistan is being heavily influenced by outside powers, seeking to get them to join their side and possibly threaten our Central Asian holdings. We must prepare for a potential invasion of the country if worst comes to worst."
 RUS_russify_finland: "Russify Finland"
 RUS_russify_finland_desc: "If we want Finns to stop challenging our authority, we have to assimilate them into Russian culture. In the short term, this could create tensions, but in the long term Finland could become a Russian region like any other."
 RUS_ww1_leave_entente: "Leave Entente"
 RUS_ww1_leave_entente_desc: ""
 RUS_guarantee_serbia: "Guarantee Serbia"
 RUS_guarantee_serbia_desc: ""
 RUS_ww1_add_fuel_to_the_fire: "Spark the Powder Keg"
 RUS_ww1_add_fuel_to_the_fire_desc: "With the Archduke now being assassinated, tensions have once again been stirred up by Austria-Hungary and Serbia. We will take advantage of this situation to ensure this sparks a war, so that we can destroy the Germans and Austrians once and for all. We will request our allies to allow Serbia into the Entente."
 RUS_ww1_support_serbia: "Orthodox Brotherhood"
 RUS_ww1_support_serbia_desc: "Russia is the proclaimed 'protector of orthodoxy.' However, in recent years we have slacked off from that title due to internal issues at home. We must show our orthodox brothers that we are still willing and ready to reinforce them when the time comes."
 RUS_fight_sweden_gotland: "Claim Gotland"
 RUS_fight_sweden_gotland_desc: "Gotland stands as a very strategic island situated in the Baltic Sea. We could make sure great use of this land to ensure our naval dominance in the area."
 RUS_european_focus: "Western Focus"
 RUS_european_focus_desc: "The West, Europe specifically, has been proving to be volatile in recent years, with the Germans and Austrians continuing to make aggressive moves against us and our allies. No matter how or when, war seems inevitable. We must make the right decisions in our European affairs to ensure our survival."
 RUS_asian_focus: "Assert Russian Position in Asia"
 RUS_asian_focus_desc: "We must fortify our influence in Asia. The fate of the Empire hinges on our calculated moves."
 RUS_ww1_Reinforce_Northern_Persia: "Invest in Northern Persia"
 RUS_ww1_Reinforce_Northern_Persia_desc: "The northern part of Persia was granted to our sphere of influence following the Anglo-Russian Convention of 1907. We shall start building up this area to have it give us more benefits long-term."
 RUS_ww1_Revoke_Persia_Convention: "Revoke The Convention of 1907"
 RUS_ww1_Revoke_Persia_Convention_desc: "Although the convention of 1907 did seem to sort out our relations with the British, this agreement now seems laughable. What right do the British have to tell us where our influence lies? We have been the ones fighting the Persians the most, while the British just stood there. All of Persia rightfully belongs to our sphere of influence."
 RUS_ww1_Support_Persia_Convention: "Support The Convention of 1907"
 RUS_ww1_Support_Persia_Convention_desc: "The Anglo-Russian Convention of 1907 was signed on August 31, 1907, in Saint Petersburg. The Convention ended the long dispute over Persia. The United Kingdom promised to stay out of northern Persia, and Russia recognized southern Persia as part of the British sphere of influence. We must uphold this agreement to ensure stability in the area."
 RUS_ww1_Persian_Cossack_Brigade: "Reinforce The Persian Cossack Brigade"
 RUS_ww1_Persian_Cossack_Brigade_desc: "The Persian Cossack Brigade was a Cossack-style cavalry unit formed in 1879 in Persia. It was modelled after the Caucasian Cossack regiments of the Imperial Russian Army. We shall reinforce these units with whatever they have to ensure they remain on equal equipment and organizational levels as our own army."
 RUS_ww1_Russian_Influence_over_Persia: "Tehran Cross-Border Agreement"
 RUS_ww1_Russian_Influence_over_Persia_desc: "Although we may not have direct ownership of their land, we can still use the Persians for our own gain. We must gain military access through their territory, so we can potentially have a flank against the Ottomans when the time comes to fight them. We could also use this to exploit their lands for ourselves..."
 RUS_ww1_Puppet_Persia: "Occupy Northern Persia"
 RUS_ww1_Puppet_Persia_desc: "Although the Persians have claimed themselves as a neutral party, who knows how long that can be trusted. If they were to oppose us, our trade routes and interests in the country set up by the Anglo-Russian Convention could be harmed. We shall preemptively occupy the northern part of their country to secure these vital assets."
 RUS_ww1_Militarize_NorthenPersia: "Militarize Northern Persia"
 RUS_ww1_Militarize_NorthenPersia_desc: "The new puppet region we have prompted up in Northern Persia is very weak militarily, as a majority of the Persian military has remained with the southern regime. We shall begin the process of militarizing and providing them with as much equipment as they need so they can build up a proper military force."
 RUS_annex_manchurian_sphere: "Occupy Manchuria"
 RUS_annex_manchurian_sphere_desc: "Our construction of the Trans-Siberian Railway was thwarted when we were humiliated by the Japanese during our war with them. The loss of influence in Manchuria has proven to be a major blow in the eyes of the people and us. We must begin reversing this humiliation by reinstating our influence in Manchuria and directly occupying it once again."
 RUS_ww1_treaty_portsmouth: "Revoke Treaty of Portsmouth"
 RUS_ww1_treaty_portsmouth_desc: "The Treaty of Portsmouth that ended our war with the Japanese was one of our greatest mistakes. It forced us to relinquish many parts of our influence and prestige across Asia. With us slowly reasserting our influence in Asia, the time has come to revoke this terrible treaty and begin the 2nd Russo-Japanese War. This time, a 2nd Tsushima won't be happening."
 RUS_second_russo_japanese_war_defeat: "Defeat in the second Russo-Japanese War"
 RUS_second_russo_japanese_war_defeat_desc: "We have been defeated in the second Russo-Japanese War. It is clear that Asia is not a place for our influence to be. \n §OThis focus will be completed by event§!"
 RUS_second_russo_japanese_war_victory: "Victory in the second Russo-Japanese War"
 RUS_second_russo_japanese_war_victory_desc: "We were victorious in the second Russo-Japanese War. Japan has been defeated at last, revoking our humiliation in 1905. Asia will now be free rein for our influence once again. \n §OThis focus will be completed by event§!"
 RUS_manchurian_policy: "Manchurian Policy"
 RUS_manchurian_policy_desc: "With our victory over the Japanese, our holdings in Manchuria are now secure. With this, we can now decide what our policy towards these lands shall be moving forward."
 RUS_manchurian_puppet: "A Manchurian Puppet"
 RUS_manchurian_puppet_desc: "The best way to govern Inner Manchuria is through a local puppet state, to ensure they can gain support from the locals instead of us relying on direct control, which only leads to more resistance."
 RUS_manchurian_russification: "Russification of Manchuria"
 RUS_manchurian_russification_desc: "The best way to govern Inner Manchuria is through a policy of Russification, so as to bring the area properly into Russia and secure our access to ice-free waters in the east"
 RUS_expand_dalniy_naval_base: "Expand Dalniy Naval Base"
 RUS_expand_dalniy_naval_base_desc: "The naval base at Port Arthur and the commercial naval facilities at Dalniy can be expanded and the peninsula fortified from naval attack now that we have regained control of the area from Japan, to accommodate this, we should bring in many settlers from Russia"
 RUS_ww1_friend_with_jap: "Allies by Convenience"
 RUS_ww1_friend_with_jap_desc: "Although we may not be particularly fond of them, it is clear that we must work with the Japanese out of convenience, similar to the British. We both share common enemies in the form of Germany, so for now we shall tolerate being allies with them."
 RUS_reinforce_vladivostok: "Reinforce Vladivostok"
 RUS_reinforce_vladivostok_desc: "If the Japanese attack us again, Vladivostok will have to be impregnable. It shall be heavily fortified and prepared to fend off any invaders."
 RUS_mongolian_protectorate: "Mongolian Protectorate"
 RUS_mongolian_protectorate_desc: "Mongolia has only just become an independent nation, meaning they are weak and susceptible to our influence. With the Qing no longer having any say in the area, we shall now step in and force them to be our protectorate, firmly placing them under our influence."
 RUS_ww1_Xinhai_Revolution_Opportunity: "Xinhai Revolution Opportunity"
 RUS_ww1_Xinhai_Revolution_Opportunity_desc: "What is unfolding in China presents us with an unexpected opportunity. We must seize the moment without delay!"
 RUS_ww1_polish_corps: "Korpus Polski w Rosji"
 RUS_ww1_polish_corps_desc: "The Poles in our empire may dislike us due to our policies in past decades toward them, but we can still influence and propagandize them to join the Russian Imperial Army. If we give them vague promises of a Polish protectorate and land acquisitions after the war, surely that will be enough for them to side with us over the Germans and Austrians."

