 RUS_ww1_dual_power_ns: "Dual Power"
 RUS_ww1_dual_power_ns_desc: "It is said that ancient Sparta had two kings, each preventing the other from becoming overly authoritarian and megalomaniacal. We should try the experiment and encourage sharing supreme power at the head of the country between two individuals."
 RUS_ww1_october_revolution_ns: "October Revolution"
 RUS_ww1_october_revolution_ns_desc: "The October Revolution has just erupted, and the centuries-old power of the Tsars is faltering! The Bolsheviks are galvanized by the fiery speeches of leaders like Lenin, and the people are taking to the streets. Russia is covered in red!"
