 SPR_alfonso_xiii_desc: "King Alfonso XIII, ''El Africano'', has ruled Spain since his mother's regency ended in 1902. Though Spain is legally a constitutional monarchy, in recent years he has become the favorite child of the aristocrats, and is practically running the country himself. With the start of the new decade, the King's plan to modernize the country continues. Viva Rey Alfonso!"
