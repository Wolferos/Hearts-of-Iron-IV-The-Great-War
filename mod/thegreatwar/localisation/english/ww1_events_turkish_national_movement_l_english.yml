l_english:
 ww1_tnm.1.t: "Fate of the Eastern Vilayets"
 ww1_tnm.1.d: "In eastern part of the Anatolia lies a bunch of different ethnicities. As a part of the Treaty of Sevres and the Wilsons 14 points these minoritys are allowed to do free referandums to choose their future. While we can allow these referandums we can also just seize the weakness of Entente powers and ignore this part. What should we do?"
 ww1_tnm.1.a: "We don't have a choice..."
 ww1_tnm.1.b: "Maybe we can just ignore that part?"

 ww1_tnm.2.t: "Mission to the North"
 ww1_tnm.2.d: "With efforts to disarm the resistance groups started we gazed our eyes on the black sea region because of its active resistance against the Treaty of Sevres.While we can just ignore them but this will further destablize the country or we can send someone trusted to disarm the rebels. What should we do?"
 ww1_tnm.2.a: "We can ignore some rebels."
 ww1_tnm.2.b: "Send him to disarm the resistance"
 
 ww1_tnm.3.t: "Mustafa Kemal Pasha Rebels!"
 ww1_tnm.3.d: "Grim news have arrived to the capital.After we send Mustafa Kemal Pasha to Samsun for disarming the population.He secretly builded a shadow government over our eastern vilayets and now he declared the cretion of a new Turkish state rival to us.We can join him for the Turkish liberation or we can stay loyal to the Sultan. What is your choice?"
 ww1_tnm.3.a: "Forward for Independence!"
 ww1_tnm.3.b: "We are only loyal to the Sultan"