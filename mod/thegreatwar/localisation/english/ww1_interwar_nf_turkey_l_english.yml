l_english:
 #--------------------------------------------------------------
 # [TURKEY] Interwar
 #=========================================================================

 TUK_interwar_DenyAlliedDemands:0 "Reject Allied Demands"
 TUK_interwar_DenyAlliedDemands_desc:0 "The people may not understand why we reject the Western demands, but we know that in the long term, it is better not to give in to their proud ultimatums."

 TUK_interwar_AmasyaCircular:0 "Amasya Circular"
 TUK_interwar_AmasyaCircular_desc:0 "The unity and independence of the nation are in great danger. The circular we drafted in Amasya calls for the immediate independence of Turkey in order to save the fatherland!"

 TUK_interwar_SupportTheSultanate:0 "Pardon the Sultan"
 TUK_interwar_SupportTheSultanate_desc:0 "The Sultanate is not only the foundation of our nation; it is also our heritage. Challenging it in hopes of rapid modernization was a mistake… we must reaffirm our support for it."

 TUK_interwar_DefendTheSultanate:0 "Legitimaze the Rule with the Sultan"
 TUK_interwar_DefendTheSultanate_desc:0 "There is now improved cooperation between the Sultan and the Turkish nation. If we continue to support it, we can strengthen our own government."

 TUK_interwar_EmbraceOttomanLegacy:0 "Crown Abdulmejid II as the New Sultan"
 TUK_interwar_EmbraceOttomanLegacy_desc:0 "Even if it's the times are tough for the Empire, we must not forget our glorious past. Let us give back to young people the pride of being Ottoman."

 TUK_interwar_MehmedVISultan:0 "Mehmed VI is the Sultan"
 TUK_interwar_MehmedVISultan_desc:0 "The rightful ruler of the Ottomans can only be Mehmed VI. He will ascend the throne... but if that is to happen, Mustafa Kemal must not live another day."

 TUK_interwar_QuestionTheSultanate:0 "Accusing Mehmed Reşad of Treason"
 TUK_interwar_QuestionTheSultanate_desc:0 "The passivity and stagnation of Mehmed V are unforgivable. Better yet, he is guilty! We must overthrow him—by force if necessary. This despot must no longer rule."

 TUK_interwar_QuestionTheSultanate2:0 "Discrediting the Sultanate"
 TUK_interwar_QuestionTheSultanate2_desc:0 "What legitimacy does the Sultanate even have? Why must we still endure this sclerotic legacy? We must encourage public debate that questions the power of this despot."

 TUK_interwar_QuestionTheSultanate3:0 "Abolish the Sultanate"
 TUK_interwar_QuestionTheSultanate3_desc:0 "The situation is changing rapidly, and the Sultan is now powerless and barely has any support. We can now exile him and his family without much trouble."

 TUK_interwar_TurkishNationalism:0 "Turkish Nationalism"
 TUK_interwar_TurkishNationalism_desc:0 "Turkey shall be free, independent, and modern! Now that it has rid itself of its ancient Sultan, it can look to the future as a strong nation. This nationalism must guide all our politics."

 TUK_interwar_ProclamationRepublicTurkey:0 "Proclaim a New Turkish State"
 TUK_interwar_ProclamationRepublicTurkey_desc:0 "The proclamation is ready, published, and will be declared before a massive crowd and the eyes of the world. Today, the Republic of Turkey is born!"

 TUK_interwar_push_for_misak_i_milli:0 "Push for Misak-ı Milli"
 TUK_interwar_push_for_misak_i_milli_desc:0 ""

 TUK_interwar_demand_thrace_and_the_agean_islands:0 "Demand Thrace and the Aegan Islands"
 TUK_interwar_demand_thrace_and_the_agean_islands_desc:0 ""

 TUK_interwar_ClaimtheBalkans:0 "Claim the Balkans"
 TUK_interwar_ClaimtheBalkans_desc:0 "Our presence in the Balkans demands proactive measures to secure our interests in the region. Let's assert our rightful claims and ensure stability in this pivotal area."

 TUK_interwar_Adriatic:0 "Look towards the Adriatic"
 TUK_interwar_Adriatic_desc:0 "Beyond Greece lies another sea—the Adriatic—a sea that every Mediterranean naval power must control. We must plan to establish naval bases in the region to support our future fleets."

 TUK_interwar_FightItaly:0 "The Empire Strikes Back"
 TUK_interwar_FightItaly_desc:0 "The Italians have challenged us enough! Even though the former Sultanate no longer exists, we haven't forgotten their insults. It is time to prepare for the coming conflict with the Latins!"

 TUK_interwar_demand_syria:0 "Demand Syria"
 TUK_interwar_demand_syria_desc:0 ""

 TUK_interwar_demand_mosul_and_kirkuk:0 "Demand Musul and Kirkuk"
 TUK_interwar_demand_mosul_and_kirkuk_desc:0 ""

 TUK_interwar_ClaimtheOttomanLands:0 "Claim Ottoman Lands"
 TUK_interwar_ClaimtheOttomanLands_desc:0 "The Ottoman Empire may be gone, but we have not yet abandoned the lands it ruled for centuries! And we certainly won't let them fall into the hands of European vultures. Let us claim these territories for ourselves!"

 TUK_interwar_AbdulmejidII:0 "Legitimate Caliph Abdulmejid II"
 TUK_interwar_AbdulmejidII_desc:0 "Abdulmejid II is officially the last potential claimant to the Turkish throne. Without a doubt, he is the one we must choose if we decide to restore a Caliph. He has wisely stayed out of recent politics, but has already made it clear that he is ready to lead if necessary. Let us legitimize him in the eyes of the people—we will have a leader who is perfectly suited for us."

 TUK_interwar_WorldwideCaliphate:0 "Worldwide Caliphate"
 TUK_interwar_WorldwideCaliphate_desc:0 "What if we established a single… eternal… Caliphate that spans the entire Earth? Wouldn't that be the best way to unite ourselves with God? Of course, this is a long and difficult task—but let us ponder the idea for a moment."

 TUK_interwar_AbolishOttomanCaliphate:0 "Abolish the Ottoman Caliphate"
 TUK_interwar_AbolishOttomanCaliphate_desc:0 "The Caliphate, like the Ottoman Empire, is an ancient, outdated, sclerotic and inefficient legacy. By abolishing it, we will be far freer to determine our own future."

 TUK_interwar_CloseIslamicCourts:0 "Close Islamic Courts"
 TUK_interwar_CloseIslamicCourts_desc:0 "These religious courts are a disgrace to modern Turkey—they are regressive, conservative, and obscurantist. We will sign a decree for their closure. There will be protests, but the politicians will agree it's the right move."

 TUK_interwar_NeoTanzimat:0 "Neo-Tanzimât"
 TUK_interwar_NeoTanzimat_desc:0 "Tanzimât—meaning 'reorganization' in Turkish—were important reforms that enabled great progress in our old nation. We granted ourselves a modern constitution and parliament, reformed the state, the bureaucracy, and our laws. With a new round of Tanzimât, we shall no longer be the sick man of Europe."

 TUK_interwar_AtaturkReforms:0 "Atatürk's Reforms"
 TUK_interwar_AtaturkReforms_desc:0 "Mustafa Kemal presented the key points of his ambitious reform program to the Council of Ministers. Language, law, the education system, domestic and foreign economy—even fashion! What would soon be called the Kemalist reforms was set to propel our country decades into the future."

 TUK_interwar_NewTurkishAlphabet:0 "New Turkish Alphabet"
 TUK_interwar_NewTurkishAlphabet_desc:0 "The Harf Devrimi is an idea by Mustafa Kemal, aimed at modernizing our language, cleansing it of unnecessary elements, and further modernizing public and cultural life. Of course, the people must be given some time to adjust."

 TUK_interwar_TheSixArrows:0 "The Six Arrows"
 TUK_interwar_TheSixArrows_desc:0 "The Six Arrows is the founding ideology of the Republic of Turkey. Implemented by Mustafa Kemal Atatürk, it was defined by sweeping political, social, cultural and religious reforms designed to separate the new Turkish state from its Ottoman predecessor and embrace a modernized lifestyle."

 TUK_interwar_ProFascism:0 "Adopt Mussolini's Ideology"
 TUK_interwar_ProFascism_desc:0 "This Italian political leader, whom they call Il Duce, has managed to suppress the rebels in his country and crush dissent. Though he advocates an openly aggressive ideology of power and command, we would do well to consider adopting it ourselves..."

 TUK_interwar_Industrialization:0 "Get the Country Back on Track"
 TUK_interwar_Industrialization_desc:0 "We have found new capital that we can immediately invest into our domestic economy. That is always good news."

 TUK_interwar_AntiCapitalism:0 "Anti-Capitalist Policies"
 TUK_interwar_AntiCapitalism_desc:0 "Excessive capitalism has ruined millions just so a minority of ultra-rich can grow richer. We must protect ourselves from this disease of the economy that is infecting more and more countries. Some Bolshevik intellectuals exiled in our country have already spoken out wisely on the matter."

 TUK_interwar_AntiUSA:0 "Criticize American Ambitions"
 TUK_interwar_AntiUSA_desc:0 "The Americans are growing ever more powerful, backed by their enormous industrial capacity. One day, they will threaten to dominate the whole world—unless someone stops them! We should not hesitate to take the opportunity to criticize their ambitions so they do not get the final word."

 TUK_interwar_WarUSA:0 "Confront the United States"
 TUK_interwar_WarUSA_desc:0 "The Americans are going too far in meddling in European affairs! Let us summon their ambassador and inform him that we reject the intrusion of American warships into our waters and the landing of troops. Boys, go home!"

 TUK_interwar_Socialism:0 "Embrace Socialism"
 TUK_interwar_Socialism_desc:0 "We need massive popular support to ensure the survival of our government and build a modern and powerful Turkey. The best way to achieve that is through socialism, which enjoys broad public support."

 TUK_interwar_USSRFriend:0 "Move Closer to the USSR"
 TUK_interwar_USSRFriend_desc:0 "The Reds will not collapse—not anymore. Aligning ourselves with the USSR would be a better long-term strategy, as it would earn us the favor of such a powerful neighbor."

 TUK_interwar_ErzurumCongress:0 "Erzurum Congress"
 TUK_interwar_ErzurumCongress_desc:0 "The motherland is one and indivisible."

 TUK_interwar_SivasCongress:0 "Organize the Sivas Congress"
 TUK_interwar_SivasCongress_desc:0 "Enough killing! We have sent official invitations for a political congress in Sivas, Anatolia. The most prominent representatives of our parliament will gather to discuss the topic of the hour: the foundation of an autonomous and modern Republic of Turkey. Their first challenge will be to drive out the foreign expeditionary forces and form a national government!"

 TUK_interwar_Battle_of_Aydin:0 "Battle of Aydın"
 TUK_interwar_Battle_of_Aydin_desc:0 "The Greeks are concentrating more and more forces to capture Aydın, a coastal city. At least two regiments have been reported, and more are expected. We must send reinforcements to Commander Ali Efe to secure victory, or we will bitterly regret it."

 TUK_interwar_DealWithGreece:0 "Negotiate with the Greeks"
 TUK_interwar_DealWithGreece_desc:0 "A long war with the Greeks will exhaust us, even if we have no doubt that we would eventually win. It is better to negotiate with them so that we can focus on our true enemies for the time being."

 TUK_interwar_ShamefulCompromise:0 "Shameful Compromise"
 TUK_interwar_ShamefulCompromise_desc:0 "War is cruel, and as Brennus said so long ago: woe to the vanquished! We must make a painful compromise to end the conflict. It will be hard to justify, but who has a better solution?"

 TUK_interwar_AWorldatPeace:0 "A World at Peace"
 TUK_interwar_AWorldatPeace_desc:0 "It takes courage to go to war, but even more to put away the weapons. Stirring the powder keg again will bring us nothing but suffering, hatred, and death. We should base our foreign policy on dialogue and discussion."

 TUK_interwar_FriendENG:0 "Stop Challenging British Decisions"
 TUK_interwar_FriendENG_desc:0 "The British are proud, but they do not threaten our immediate regional interests, and we have defeated them sufficiently in the war to assert our authority. Ceasing to oppose their policies will be a welcome gesture of détente between our two nations."

 TUK_interwar_FriendFRA:0 "Cooperate with the French"
 TUK_interwar_FriendFRA_desc:0 "Cooperating with the French may seem dishonorable, but it may be the only way to save face. After all, they are likely to be better allies than the British, and the friendship between our two peoples goes back to their former king, Francis I..."

 TUK_interwar_FRARenaultFT:0 "Renault Tank Blueprint"
 TUK_interwar_FRARenaultFT_desc:0 "The French light tanks are a revolution. If we could get the blueprints for these tanks, we could develop our own light armor. We have formally requested a license to produce this excellent machine."

 TUK_interwar_AntiGreekPropaganda:0 "Anti-Greek Propaganda"
 TUK_interwar_AntiGreekPropaganda_desc:0 "Some Turks say Greece is the main enemy of our country. We should do everything we can to make all people think the same."

 TUK_interwar_EasternFront:0 "Şark Cephesi"
 TUK_interwar_EasternFront_desc:0 "The Great European War may be over, but conflicts in the periphery rage on. Across the Middle East, there are reasons to fix bayonets, so we should close ranks in government to be able to make even the toughest decisions."

 TUK_interwar_SupportAntiColonial:0 "Support Anti-Colonial Aspirations"
 TUK_interwar_SupportAntiColonial_desc:0 "The great powers divide the world among themselves without considering the aspirations of the peoples—this must come to an end!"

 TUK_interwar_SupportEgypt:0 "Support Egyptian Separatists"
 TUK_interwar_SupportEgypt_desc:0 "The Egyptians no longer want the British deciding their future—we should encourage them!"

 TUK_interwar_MiddleEastRelations:0 "Establish new Relations in the Middle East"
 TUK_interwar_MiddleEastRelations_desc:0 "We will need allies in the times to come—good ones. Sending new delegations to the eastern emirates would be a first step in earning their favor."

 TUK_interwar_IranEnnemy:0 "Challenge the Shah"
 TUK_interwar_IranEnnemy_desc:0 "Our disagreement with our own sultan is still fresh, and it would be odd to cozy up to a neighboring monarch of the same kind. The Persian Shah is just another despot."

 TUK_interwar_IranFriend:0 "Make a Deal with the Shah"
 TUK_interwar_IranFriend_desc:0 "The Shah of Persia is a reasonable and responsible man. By opening talks, we can turn him into an ally in the future. There's no shortage of issues to discuss."

 TUK_interwar_ArabWorld:0 "Improve Our Image in the Arab World"
 TUK_interwar_ArabWorld_desc:0 "The eastern emirates are trying to position themselves in relation to us, and there's understandable suspicion of our modernizing reforms. Let's reassure them of our good intentions—they'll be more willing to work with us."

 TUK_interwar_Oil:0 "Arabian Black Gold"
 TUK_interwar_Oil_desc:0 "The Arab peoples are our natural allies, and our trade relations with them are as strong as our diplomacy. Thanks to our tireless support, we now have a steady oil supply."

 TUK_interwar_AntiSyria:0 "Ignore Rebels in Syria"
 TUK_interwar_AntiSyria_desc:0 "Regardless of protests, our policy on the southern border must remain firm and unyielding. Syria must not become a threat! These rebels stirring in the desert will fade on their own."

 TUK_interwar_ClaimSyria:0 "Syria Is Our Land"
 TUK_interwar_ClaimSyria_desc:0 "The Ottoman Empire may be gone, but Turkey is still Turkey! And Syria is forever a province of it. We must claim what is rightfully ours."

 TUK_interwar_ProSyria:0 "Support the Syrian Rebels"
 TUK_interwar_ProSyria_desc:0 "Helping the Syrian rebels would only cost us a few crates of ammunition and old rifles we no longer use. In return, it would be valuable assistance in undermining the French presence—without declaring war."

 TUK_interwar_SupportSyrianRebels:0 "Brothers in Arms"
 TUK_interwar_SupportSyrianRebels_desc:0 "The Syrians have prepared their uprising and independence in detail. They only need the signal, and the entire country will rise up! And that's thanks—well, largely—to us."

 TUK_interwar_RecognizeSyria:0 "Recognize Syrian Independence"
 TUK_interwar_RecognizeSyria_desc:0 "We will be the first to recognize Syria as a free and independent state. They would be glad to have our support, and we would gain a valuable ally."

 TUK_interwar_TheCaucasusQuestion:0 "The Caucasus Question"
 TUK_interwar_TheCaucasusQuestion_desc:0 "We must return to work—on one of the most difficult geopolitical files: the Caucasus! Turks, Armenians, Georgians, Russians, and dozens of other peoples live there—but most importantly, the region holds invaluable resources. He who controls the mountains will rule the northern Middle East."

 TUK_interwar_Azerbaijan:0 "Recognize Azerbaijan"
 TUK_interwar_Azerbaijan_desc:0 "Do the Azerbaijanis want their freedom and independence? Then we should be the first to recognize them as a sovereign state. That way, they'll be more inclined to support us later."

 TUK_interwar_ProtectAzerbaijan:0 "Question of Azerbaijan"
 TUK_interwar_ProtectAzerbaijan_desc:0 "Azerbaijan, a newly independent Turkic state is just like us! But unlike us they are in no shape of defending themselves. We need to decide their fate for their good!"
 
 TUK_interwar_EaseTensions:0 "Ease Tensions"
 TUK_interwar_EaseTensions_desc:0 "The Bolsheviks are brutal and unstable. We must seek reconciliation north of Turkey, for war could erupt much faster than expected!"

 TUK_interwar_RaiseTensions:0 "Raise Tensions"
 TUK_interwar_RaiseTensions_desc:0 "The Reds wreak havoc in the north, along with every bandit, separatist, militant, and thief the region has to offer! We must reinforce our military presence and threaten immediate retaliation against any who disturb the peace."

 TUK_interwar_NahcivanDetachment:0 "Nakhchivan Detachment"
 TUK_interwar_NahcivanDetachment_desc:0 "We should send a military unit of a few hundred infantrymen to the Nakhchivan region to protect its integration into Azerbaijan. You never know..."

 TUK_interwar_AccusetheGreeksinIzmir:0 "Accuse the Greeks in İzmir"
 TUK_interwar_AccusetheGreeksinIzmir_desc:0 "The devastating fire that ravaged Smyrna must have been started by someone! Who would make a better culprit than the Greeks, whose expansionist ambitions we already know?"

 TUK_interwar_NoCompromise:0 "No Compromise"
 TUK_interwar_NoCompromise_desc:0 "We negotiated as long as we could, but to continue would be a sign of weakness. We will sign no more compromises. Now our enemies must yield to our demands—or face us!"

 TUK_interwar_Balkans:0 "Reignite the Powder Keg"
 TUK_interwar_Balkans_desc:0 "The Bulgarians are now openly hostile. Let us order our border guards to repel their incursions without mercy. We must show no weakness!"

 TUK_interwar_AntiBulgaria:0 "Invade Bulgarian Territories"
 TUK_interwar_AntiBulgaria_desc:0 "The Bulgarians are becoming increasingly aggressive, with border incidents growing more frequent. We must set an example—if only to let the whole region know that Turkey is neither weak nor apathetic! We already have invasion plans for Bulgaria, and it's time to use them again."

 TUK_interwar_DenounceTheSykesPicotAgreement:0 "Denounce the Sykes-Picot Agreement"
 TUK_interwar_DenounceTheSykesPicotAgreement_desc:0 "The shameful agreement between the French and British is now public knowledge, and we will denounce and reject it. These bloated Europeans have no right to divide our land and people!"

 TUK_interwar_RevengeForMudros:0 "Revenge for Mudros"
 TUK_interwar_RevengeForMudros_desc:0 "This is perhaps the only benefit we draw from it, but it's a real one. The Armistice of Mudros has outraged the entire political class and the people, who now advocate for an openly militarist society—so that one day we may take our revenge."

 TUK_interwar_GiveAndTake:0 "Give and Take"
 TUK_interwar_GiveAndTake_desc:0 "To better prepare our internal politics for the challenges ahead, all parties must make mutual concessions. The French once called this the 'union sacrée'..."

 TUK_interwar_IgnoreTheArmisticeOfMudros:0 "Ignore the Armistice of Mudros"
 TUK_interwar_IgnoreTheArmisticeOfMudros_desc:0 "This armistice signed on the Greek isles does not concern us. It was signed by the previous government under threat and coercion. We recognize neither its terms nor its demands! The British can go sip their tea if it bothers them so much."

 TUK_interwar_RefuseTheDismembermentOfTheEmpire:0 "Reject the Dismemberment"
 TUK_interwar_RefuseTheDismembermentOfTheEmpire_desc:0 "Why should we accept this unjust settlement of the last world conflict that led to the partitioning of our country? Especially since we had dealt a severe blow to the Entente on our own shores. Let us refuse this dismemberment and reunite our homeland!"

 TUK_interwar_treaty_of_ankara:0 "Treaty of Ankara"
 TUK_interwar_treaty_of_ankara_desc:0 ""

 TUK_interwar_AntiBritish:0 "Expel the British"
 TUK_interwar_AntiBritish_desc:0 "The British have no business in Mosul, and they need to know it."

 TUK_interwar_AntiFrench:0 "Send the French Home"
 TUK_interwar_AntiFrench_desc:0 "French ambitions in the Middle East are clear—they want to carve us up. We must act before it's too late."

 TUK_interwar_NegociateWithTheAllies:0 "Negotiate with the Allies"
 TUK_interwar_NegociateWithTheAllies_desc:0 "Negotiating with the Allies might lead to a compromise that isn't too disadvantageous."

 TUK_interwar_RespectTheArmisticeOfMudros:0 "Mondros Mütarekesi"
 TUK_interwar_RespectTheArmisticeOfMudros_desc:0 "The armistice to be signed in Mudros may hurt our national pride, but it will allow us to end hostilities with the Allies, which are now unnecessary. We will release many prisoners and implement a welcome ceasefire."

 TUK_interwar_TreatyofSevres:0 "Denounce the Treaty of Sèvres"
 TUK_interwar_TreatyofSevres_desc:0 "It is time to expose the Treaty of Sèvres for what it is: a fraud! Not only did it dismantle our empire without our consent, but it literally divided the Middle East into European zones of influence. Let us denounce this unjust treaty!"

 TUK_interwar_TreatyofLausanne:0 "Treaty of Lausanne"
 TUK_interwar_TreatyofLausanne_desc:0 "After months of intense negotiations, a treaty is ready to be signed in Lausanne, Switzerland. Our diplomats have done a superb job, drafting a text that recognizes our republic and borders while imposing only minimal reparations, in exchange for demilitarizing the Dardanelles and a few minor concessions. Peace at last!"

 TUK_interwar_TurkishArmenianWar:0 "Turkish-Armenian War"
 TUK_interwar_TurkishArmenianWar_desc:0 "The Armenians will be like a dagger constantly pointed at our back if we let them exist on our borders. We must address this issue at the root and prepare to invade their land."

 TUK_interwar_FightTheBolsheviks:0 "Fight the Bolsheviks"
 TUK_interwar_FightTheBolsheviks_desc:0 "We cannot face the future calmly knowing the Bolsheviks are at our borders, waiting for a sign to invade and establish their so-called revolution! It will be a long and costly war, but a necessary one."

 TUK_interwar_sign_the_treaty_of_kars:0 "Sign the Treaty of Kars"
 TUK_interwar_sign_the_treaty_of_kars_desc:0 ""

 TUK_interwar_InfiltreGreece:0 "Covert Operations in Greek Occupied Lands"
 TUK_interwar_InfiltreGreece_desc:0 "We have much support in areas currently occupied by the Greeks. We must build a strong network there, from which we could sabotage their weapons and ammunition depots."

 TUK_interwar_KarbogaziAmbush:0 "Karboğazı Ambush"
 TUK_interwar_KarbogaziAmbush_desc:0 "We have the chance to lure a foreign expeditionary division into a deadly trap near Karbogazi. Defeating the invaders here will be devastating for their public opinion."

 TUK_interwar_BattleOfSakarya:0 "Fortify Behind the Sakarya River"
 TUK_interwar_BattleOfSakarya_desc:0 "We will face the Greeks at Sakarya! They outnumber us, but their troops are poorly equipped and, more importantly, poorly supplied! Thanks to Turkish cavalry harassing their rear nonstop,if we fortify behind the river,we will achieve a decisive victory."
 
 TUK_interwar_SupportTurkishCypriots:0 "Support the Turkish Cypriots"
 TUK_interwar_SupportTurkishCypriots_desc:0 "There is a large Turkish community on the island of Cyprus—a community determined to… reunite with the motherland, of course. It goes without saying that it's in our interest to support them. Let's start by sending them money and a few weapons!"

 TUK_interwar_InvadeCyprus:0 "Plot with the Separatists"
 TUK_interwar_InvadeCyprus_desc:0 "There's no more time for negotiation. Cyprus is a giant powder keg ready to blow—with our blessing! The resistance fighters are just waiting for our green light to ignite an uprising against the proud British."

 TUK_interwar_InviteBritishDiplomat:0 "Send Diplomats"
 TUK_interwar_InviteBritishDiplomat_desc:0 "The path of negotiation is far more profitable than that of war. Let us send a Turkish delegation to London to establish an embassy and discuss our disagreements. A glass of wine resolves disputes better than rifles ever could."

 TUK_interwar_industrial_effort:0 "Industrial Effort"
 TUK_interwar_industrial_effort_desc:0 "The Industrial Revolution is still ongoing, and our nation still has much to do to keep up. Launching a few new, ambitious projects to boost our industrial capacity will bring short- and long-term benefits, not least of which is greatly improving our ability to arm our troops."

 TUK_interwar_infrastructure_effort:0 "Infrastructure Effort"
 TUK_interwar_infrastructure_effort_desc:0 "As our industry grows, the private sector continues to demand increased infrastructure investment to support the national economy. While doing so, we won't be able to construct new factories for the time being. Nevertheless, infrastructure also benefits our nation by improving troop mobility and supply flow—this investment might not be such a bad plan."

 TUK_interwar_construction_effort:0 "Construction Effort"
 TUK_interwar_construction_effort_desc:0 "A foreign company from a neighboring neutral nation has merged with one of our national industries. If we encourage this new subsidiary to relocate its factories and workforce to our country, we will see an immediate boost to our civilian industry. Of course, we should oversee the construction of these new factories..."

 TUK_interwar_production_effort:0 "Restore Factories"
 TUK_interwar_production_effort_desc:0 "Our industrial apparatus is severely underdeveloped and cannot produce the volume of weapons and equipment our armed forces will need in the coming years—let alone meet civilian demand. We must attract both foreign and domestic investment to expand our factories."

 TUK_interwar_DuzenliOrdu:0 "Düzenli Ordu"
 TUK_interwar_DuzenliOrdu_desc:0 "Our armies will never again consist of peasant levies hastily thrown to the front lines. Our modern Turkish army will be a professional, modern force that is always on the move! It will be a regular army."

 TUK_interwar_TrenchWarfare:0 "Trench Warfare Training"
 TUK_interwar_TrenchWarfare_desc:0 "Observers returning from Europe reported the horrific slaughter that was so-called trench warfare. Fortunately, we didn't have to go through such hell... but if we ever do, we would be wise to include key survival tactics in our training programs."

 TUK_interwar_gasmask_focus:0 "Adapt to New Methods"
 TUK_interwar_gasmask_focus_desc:0 "Warfare is evolving rapidly, and one of its most terrifying innovations is chemical warfare. We should begin producing our own gas and, most importantly, equip our troops with gas masks so they have a fighting chance."

 TUK_interwar_Turkish_Artilley:0 "Specialized Artillery"
 TUK_interwar_Turkish_Artilley_desc:0 "Mortars, smoke grenades, flares, grenade launchers, anti-tank guns... every modern army's artillery must adapt to varied battlefield scenarios to support our brave soldiers. We must be capable of producing all types of artillery."

 TUK_interwar_motorization_focus:0 "Produce Military Trucks"
 TUK_interwar_motorization_focus_desc:0 "Logistics is the most crucial aspect of any conflict! It is simply unthinkable to continue relying on donkey-drawn carts. We need robust, long-range trucks to transport troops, fuel, ammunition, and the countless supplies our armies require."

 TUK_interwar_Turkish_Tank:0 "Design Turkish Tanks"
 TUK_interwar_Turkish_Tank_desc:0 "It's more than regrettable that we must depend on European factories for tanks! We have capable engineers, abundant oil, and steel! Then let's design our own machines."

 TUK_interwar_Turkish_GroundArmy:0 "Türk Ordusu"
 TUK_interwar_Turkish_GroundArmy_desc:0 "The Turkish Army is the heir to the vast legions of the glorious Ottoman Empire! And we will transform it into a modern, swift, and formidable force. Let's begin by redefining its doctrines and objectives through a colloquium of our best generals."

 TUK_interwar_TurkishAirForce:0 "Türk Hava Kuvvetleri"
 TUK_interwar_TurkishAirForce_desc:0 "Just as sailors have an admiralty, pilots should have a central general staff! We should gather our veterans and most skilled pilots to pool their talent and experience to form the foundation of Turkey's future air force!"

 TUK_interwar_AirBase:0 "New Air Bases"
 TUK_interwar_AirBase_desc:0 "The runways needed for aircraft aren't particularly complicated to construct—as long as they're properly leveled and prepared. We can begin building several new air bases."

 TUK_interwar_PilotSchool:0 "Pilot Schools"
 TUK_interwar_PilotSchool_desc:0 "We need new recruits who can fly these planes! And mastering these machines requires long training, so we should fund the construction of several air force academies."

 TUK_interwar_TurkishAirForceBranch:0 "Turkish Air Force Branch"
 TUK_interwar_TurkishAirForceBranch_desc:0 "More and more fighters to rule the skies! We must continue specializing our pilots so our fighter formations become the most feared in the world."

 TUK_interwar_bomber_focus:0 "Focus on Bombers"
 TUK_interwar_bomber_focus_desc:0 "The bomber is a simple and practical machine. Focusing our designs and production capabilities on this aircraft class would be an excellent way to ensure the air force can function as an effective infantry support tool by destroying enemy defenses and positions. Of course, fighter planes can still be produced, but these bombers could win the war for us."

 TUK_interwar_Restore_The_Turkish_Navy:0 "Türk Donanması"
 TUK_interwar_Restore_The_Turkish_Navy_desc:0 "The Turkish fleet must become the leading naval power in the Mediterranean. To achieve this, we must rebuild our navy from the ground up—starting with re-establishing an admiralty!"

 TUK_interwar_Shipyard:0 "Improved Shipyards"
 TUK_interwar_Shipyard_desc:0 "If we want to become a noteworthy naval power, we must equip our arsenals with the capacity to build large ships—without relying on foreign powers to do it for us!"

 TUK_interwar_improved_ships:0 "Adopt British Methods"
 TUK_interwar_improved_ships_desc:0 "The British are the greatest shipbuilders in the world—understandable for an island nation. For now, we would benefit from studying their methods by visiting their arsenals."

 TUK_interwar_destroyer_effort:0 "Turkish Made Destroyers"
 TUK_interwar_destroyer_effort_desc:0 "The future Turkish Navy must rely on a fleet of small, mobile, and well-armed ships before considering the construction of heavy vessels. It's time to design our first models."

 TUK_interwar_CompeteOnTheSeas:0 "Compete on the Seas"
 TUK_interwar_CompeteOnTheSeas_desc:0 "It's time to draw up plans for our first dreadnought battleship, entirely made in Turkey! The only question that remains is what to name the first ship in the series..."

 TUK_interwar_AegeanSeaDomination:0 "Aegean Sea Domination"
 TUK_interwar_AegeanSeaDomination_desc:0 "Thanks to our new navy, we are now naturally outclassing all regional powers—be they Russian, Greek, or British."

 TUK_interwar_Marines:0 "Amphibious Warfare"
 TUK_interwar_Marines_desc:0 "The experience at Gallipoli taught us that landing an infantry corps on a coast to open a new front is both risky and exhausting. It requires specialized training, appropriate equipment, and above all, seamless logistical support. Let's form a commission to study this challenge."
