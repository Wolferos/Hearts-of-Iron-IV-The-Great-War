 GER_int_imperialismus:0 "Imperialismus"
 GER_int_imperialismus_desc:0 "The German Empire stands strong, but its legacy could be greater. By embracing imperial ambition, we prepare to revive the spirit of the Holy Roman Empire and assert our rightful dominance over Europe."
