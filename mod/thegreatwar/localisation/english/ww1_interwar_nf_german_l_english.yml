 GER_int_liberate_constantinopole:0 "Liberate Constantinople"
 GER_int_liberate_constantinopole_desc:0 "The ancient bastion of Christendom lies in foreign hands. To honor our faith and history, we must restore Constantinople to its rightful place within the Christian world."
