#--------------------------------------------------------------
# Army Tree
#=========================================================================
 AUH_ww1_army_effort: "Landstreitkräfte Österreich-Ungarns"
 AUH_ww1_army_effort_desc: "El ejército de Austria-Hungría se divide en tres jurisdicciones: una fuerza austríaca, una fuerza húngara y una fuerza unificada conjunta, todas ellas con sus propios oficiales y personal. La modernización de tal fuerza es un orden alto, pero posible, y conducirá inevitablemente a una fuerza armada más eficaz." 
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 AUH_ww1_form_air_force: "Formar la K.u.K. Luftfahrtruppen"
 AUH_ww1_form_air_force_desc: "Estos aviones nuevos son juguetes interesantes, y quizás tienen algún valor militar. Los pilotos civiles podían fácilmente ser atraídos por nuestros militares, los expertos podían enseñarnos cómo utilizar estos artefactos de nueva generación y si este proyecto da frutos, podemos ganar una ventaja decisiva sobre nuestros oponentes que se quedan atrás en este campo -particularmente en las doctrinas de Estos aviones."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 AUH_ww1_naval_effort: "Reforzar la K.u.K. Kriegsmarine"
 AUH_ww1_naval_effort_desc: "Aunque Austria no ha estado sin litoral desde el siglo XIV, nuestro imperio nunca se ha jactado de una marina particularmente temible. Sin embargo, es mejor tarde que nunca. Un gran programa de modernización para respaldar nuestra construcción de nuevos buques, esperamos que nos dé una fuerza naval capaz de competir en el duro mar Mediterráneo."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 AUH_ww1_political_effort: "Esfuerzo Político"
 AUH_ww1_political_effort_desc: ""

 AUH_ww1_sovereignist_ethos: "Centralización"
 AUH_ww1_sovereignist_ethos_desc: ""

 AUH_ww1_support_kaiser: "Reformar la Autoridad Imperial"
 AUH_ww1_support_kaiser_desc: "Su majestad real, el Kaiser und Konig ha gobernado sabiamente sobre nuestra nación durante mucho tiempo, pero las amenazas a su gobierno han comenzado a aparecer. Desde los nacionalistas tratando de estallar a los republicanos tratando de federalistas tratando de formar en una democracia más regionalista, el trono ha ganado muchos enemigos internamente. Debemos llevar a cabo una campaña de reelaboración de imágenes para la K.u.K. Para ayudar a asegurar su alcance sobre Austria-Hungría."

 AUH_ww1_contest_kaiser: "Disputar la Autoridad Imperial"
 AUH_ww1_contest_kaiser_desc: "Tal vez la monarquía no es una forma de gobernar un estado multinacionalista más. El Kaiser und Konig es duramente impopular fuera de Austria misma, y tiene muchos enemigos dentro de su propia parte casera del Imperio. Si debilitamos su autoridad desde dentro, ¿qué oportunidad tiene para retener su gobierno? Los partidos más poderosos pueden tomar su lugar."

 AUH_ww1_internationalism_focus: "Enfoque Internacionalista"
 AUH_ww1_internationalism_focus_desc: ""

 AUH_ww1_militarism: "Militarismo"
 AUH_ww1_militarism_desc: ""

 AUH_ww1_indoctrination_focus: "Adoctrinamiento"
 AUH_ww1_indoctrination_focus_desc: ""

 AUH_ww1_political_commissars: "Comisarios Políticos"
 AUH_ww1_political_commissars_desc: ""

 AUH_ww1_paramilitarism: "Paramilitarismo"
 AUH_ww1_paramilitarism_desc: ""

 AUH_ww1_political_correctness: "Corrección Política"
 AUH_ww1_political_correctness_desc: ""

 AUH_ww1_military_youth: "Juventud Militar"
 AUH_ww1_military_youth_desc: ""

 AUH_ww1_student_movement_focus: "Movimiento Estudiantil"
 AUH_ww1_student_movement_focus_desc: "La juventud de nuestro país es realmente brillante, y eso puede ayudarnos para nuestra investigación, particularmente en el campo de las Doctrinas de la Tierra."

 AUH_ww1_monarchy: "Enfoque Autoritario"
 AUH_ww1_monarchy_desc: ""

 AUH_ww1_democracy: "Enfoque Democrático"
 AUH_ww1_democracy_desc: ""

 AUH_ww1_centralizedpower: "Burocracia"
 AUH_ww1_centralizedpower_desc: ""

 AUH_ww1_freespeech: "Libertad de Expresión"
 AUH_ww1_freespeech_desc: ""

 AUH_ww1_reorganization_act: "Ley de Reorganización"
 AUH_ww1_reorganization_act_desc: ""

 AUH_ww1_leave_central_power: "Abandonar las Potencias Centrales"
 AUH_ww1_leave_central_power_desc: "Los alemanes fueron una vez nuestra mejor apuesta para la supervivencia, pero Austria ahora debe seguir su propio camino. Tal vez un día, si el gobierno de Alemania reflejara el nuestro o si, tal vez, la necesidad lo obligara, nos volveríamos a aliar de nuevo. Desgraciadamente, por ahora, debemos ofrecer a nuestros hermanos al norte adiós, y desearles bien."

 AUH_ww1_limited_rearmament: "Racionamiento Limitado"
 AUH_ww1_limited_rearmament_desc: ""

 AUH_ww1_full_rearmament: "Racionamiento Severo"
 AUH_ww1_full_rearmament_desc: ""

 AUH_ww1_unitedpeople: "Unificar el Reino"
 AUH_ww1_unitedpeople_desc: ""

 AUH_ww1_massive_effort: "Esfuerzo Masivo"
 AUH_ww1_massive_effort_desc: ""

 AUH_ww1_fortify_city: "Fortificaciones Civiles"
 AUH_ww1_fortify_city_desc: ""

 AUH_ww1_fortify_coast: "Defensa Costera"
 AUH_ww1_fortify_coast_desc: ""

 AUH_ww1_install_communism: "Revolución del Proletariado"
 AUH_ww1_install_communism_desc: "La gente ha sufrido suficiente con las élites austriacas que controlan y oprimen a la gente en las granjas y fábricas. ¡De ahora en adelante, los ciudadanos del Danubio estarán juntos frente a la opresión aristocrática!"

 AUH_ww1_install_democracy: "Elecciones Libres"
 AUH_ww1_install_democracy_desc: "Por primera vez, los hombres del Danubio tendrán voz en el gobierno. Con la vieja monarquía ahora una cosa del pasado, una república federal puede ser proclamada, que puede escuchar y atender a cada parte del estado de la nación. Ya no seremos austriacos, ni húngaros ni nada más ni menos que ciudadanos."

 AUH_ww1_end_dual_monarchy_emperor: "Finalizar la Monarquía Doble"
 AUH_ww1_end_dual_monarchy_emperor_desc: "Hungría sólo ha servido para derrotar a Austria. Al renunciar al trono húngaro como uno de nuestros títulos principales, y en lugar de relegarlo al tema de Austria, recordaremos a todos los que están a cargo aquí. Algunos de esos bárbaros masturiosos pueden quejarse, pero ¿qué importa? Los vencemos en 1846, podemos hacerlo de nuevo si es necesario." 

 AUH_ww1_oppression_minorities: "Oprimir las Minorías"
 AUH_ww1_oppression_minorities_desc: "La mejor manera de garantizar la lealtad al trono austríaco de los grupos minoritarios es evitar que se identifiquen entre sí para empezar. Al hacer ilegales las publicaciones y discursos públicos en otros idiomas, castigar a los ciudadanos que no confirman nuestras normas culturales e imponer la inferioridad local a nuestra cultura principal, podemos engañar a algunos del grupo a pensar que son uno de nosotros y mantener a los demás De hablar en contra de nosotros."

 AUH_ww1_autrichian_lead: "Sede Austriaca"
 AUH_ww1_autrichian_lead_desc: "Con el fin de la monarquía dual y la centralización del reino bajo Austria, los militares se han vuelto a convertir en una organización unificada, con líderes militares austriacos en la cima. Aunque los oficiales de otras nacionalidades protestan, tener un ejército sólido y cohesionado ha proporcionado beneficios a nuestra doctrina ya su propagación." 

 AUH_ww1_same_language: "Prohibir Lenguas Minoritarias"
 AUH_ww1_same_language_desc: "El alemán es el único idioma al que se le permite hablar. Esta no es la versión alemana de este mod, así que no le digas a nadie que estás leyendo esta descripción, o que la oíste de mí."

 AUH_ww1_dismantle_auh: "Desmantelar Austria-Hungría"
 AUH_ww1_dismantle_auh_desc: "El sueño de una monarquía austro-húngara unida está roto. Tal vez deberíamos dejar de lado nuestros sueños de multinacionalismo."

 AUH_ww1_make_concessions: "Hacer Concesiones"
 AUH_ww1_make_concessions_desc: "Los aristócratas están cada vez más preocupados de que el Kaiser está dando demasiados derechos favorables demasiado rápido, y puede pasar el trono más. ¿Qué saben ellos?"
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 AUH_ww1_diplomatic_effort: "Esfuerzo Diplomático"
 AUH_ww1_diplomatic_effort_desc: ""

 AUH_ww1_triple_alliance: "Renovar la Triple Alianza"
 AUH_ww1_triple_alliance_desc: "La Triple Alianza es, sin rodeos, lo único que nos mantiene en el mapa. Seríamos completamente tontos para no seguir buscando acuerdo con sus firmantes, y continuaremos asegurando y validando la alianza hasta el día de hoy."

 AUH_ww1_back_ger: "Fortalecer los lazos con Alemania"
 AUH_ww1_back_ger_desc: "Aunque algunos miembros de la aristocracia austríaca siguen amargados por el proceso de unificación alemana, son nuestros hermanos y uno de los pocos estados amistosos de nuestro gobierno se ha quedado en estos días." 

 AUH_ww1_military_advisors: "Experiencia Militar Alemana"
 AUH_ww1_military_advisors_desc: "Dicen que Prusia nació de una bala de cañón, y aunque no pueden llamar al país que más, el axioma sigue siendo cierto. Aceptar la ayuda de Alemania para modernizar nuestro ejército sería un beneficio fácil de obtener de esta alianza."

 AUH_ww1_back_italy: "Asegurar la lealtad italiana"
 AUH_ww1_back_italy_desc: "Los italianos son, por decir lo menos, no exactamente en los términos más amistosos con nosotros. Debemos iniciar negociaciones con ellos, para establecer relaciones más amigables, si esperamos mantenerlos en nuestra alianza. Por supuesto, si seguimos con esto, probablemente terminaremos perdiendo territorio ..."

 AUH_ww1_give_italy_territories: "Dar Zara e Istria"
 AUH_ww1_give_italy_territories_descn: "Los italianos han hecho sus demandas claras: La región históricamente italiana de Istria, así como una concesión alrededor de la ciudad de Split en la costa dálmata. Desafortunadamente, todo esto es territorio costero, pero podría ser un precio que valga la pena pagar para mantener a Italia alineada con las Potencias Centrales." 

 AUH_ww1_italy_honnor_pact: "Llamar a Italia a la guerra"
 AUH_ww1_italy_honnor_pact_desc: "Italia está ahora esencialmente obligada a unirse en una guerra con nosotros. Si les hemos enviado territorio y les prometimos más de Francia por nada, su pueblo le dará al gobierno el infierno. Ahora que las cosas han estallado, es hora de recaudar nuestras cuotas para distribuir algunas de nuestras preciadas regiones."


 AUH_ww1_assert_position_east: "Afirmar la posición en el Este"
 AUH_ww1_assert_position_east_desc: "La posición de las Potencias Centrales en el Este es la misma: debilitar a Rusia y construir hegemonía en la región. Como la guerra con Rusia en particular parece ser casi inevitable, debido a la situación de los Balcanes, este es un curso de acción eficaz a tomar, aunque conducirá a Francia y Rusia más cerca, lo que podría resultar un problema."

 AUH_ww1_anti_ru: "Política anti-Rusa"
 AUH_ww1_anti_ru_desc: "Para subsanar nuestra posición, romperemos la mayor parte de las relaciones diplomáticas con Rusia y comenzaremos a trabajar públicamente en su contra. Esto probablemente hará poco, pero enojarlos por ahora, pero nos abrirá una serie de opciones para tratar con ellos en el futuro."

 AUH_ww1_anti_ru_limit_trade: "Limitar el Comercio con Rusia"
 AUH_ww1_anti_ru_limit_trade_desc: "Rusia es uno de nuestros principales socios comerciales, y estamos en una posición afortunada en la que nos necesitan más de lo que necesitamos. Al imponer sanciones y aranceles a los productos rusos, podemos garantizar que obtengamos una ventaja sobre ellos económicamente."

 AUH_ww1_rom: "Acercarse a Rumanía"
 AUH_ww1_rom_desc: "Los rumanos son una espina en nuestro lado. Controlamos una gran parte de su territorio, y aunque son oficialmente un miembro menor de la Triple Alianza, no hay duda de que miran nuestro territorio con envidia. Deberíamos extender buenas noticias a ellos, para intentar acercarlos al equipo ganador. Por supuesto, para ganar verdaderamente más podría tomar concesión ..."

 AUH_ww1_rom_give_bucovina: "Dar Bucovina a Rumanía"
 AUH_ww1_rom_give_bucovina_desc: "Bucovina no es una cantidad significativa de territorio, pero es algo de la tierra más rumana en el Imperio Austro-Húngaro. Conceder este territorio no está garantizado para ganar su corazón, pero es sin duda vale la pena hacer una oferta, estamos mucho mejor con un aliado sólido de 2 pulgadas de tierra."

 AUH_ww1_rom_honnor_pact: "Llamar a Rumanía a la Guerra"
 AUH_ww1_rom_honnor_pact_desc: "Puesto que Rumania aceptó nuestra oferta de Bucovina, estamos en una buena posición para llamarlos al conflicto actual. No hay duda de que si se niegan, su pueblo estará muy disgustado con ellos."

 AUH_ww1_oirganization_realm: "Organizar el Reino"
 AUH_ww1_oirganization_realm_desc: "Austria-Hungría, como una colección de partes de viejos reinos, no está en una gran posición defensiva. A pesar de esto, sin embargo, podemos fortalecer y atrincherar a nuestras tropas, para tratar de contener el peso de una ofensa en cualquiera de nuestras fronteras amplias." 

 AUH_ww1_fortify_russian_borders: "Fortificar las fronteras rusas"
 AUH_ww1_fortify_russian_borders_desc: "La región de Galitzia es de gran interés estratégico, y mantener a los rusos es importante si queremos mantener una ventaja en el Oriente. Una línea de la fortificación en esa región ayudará a batir detrás el oso."

 AUH_ww1_airport_russian_borders: "Construir aeropuertos cerca de las fronteras rusas"
 AUH_ww1_airport_russian_borders_desc: "El advenimiento de los aviones de combate puede muy bien ser un factor decisivo en la guerra en el Este. Si construimos pistas de aterrizaje de esta manera temprano y bien, podemos albergar más aviones en la región, por lo que es una perspectiva más probable para romper la superioridad aérea enemiga y, por extensión, ganar batallas cruciales en la región."

 AUH_ww1_fortify_italian_borders: "Fortificar las Fronteras Italianas"
 AUH_ww1_fortify_italian_borders_desc: "La frontera italiana es larga y curiosamente curvada, lo que dificulta que las unidades se apoyen entre sí. Peor aún, los propios italianos están profundamente arraigados en los fondos de las cadenas montañosas y en las zonas urbanas fortificadas. Puesto que es poco probable que intervengamos pronto, debemos estar seguros de que al menos podemos defender desde esa dirección."

 AUH_ww1_fortify_bosnia_borders: "Fortificar los Balcanes"
 AUH_ww1_fortify_bosnia_borders_desc: "Es altamente improbable que los Balcanes nos den problemas serios, pero siempre es mejor estar seguro que lamentar, para que los marinos franceses que llegan a la región nos den un despertar grosero. También negará a Serbia y Montenegro la posibilidad de atacar a nuestro territorio en cualquier grado, haciendo más para una campaña segura de los Balcanes."

 AUH_ww1_fortify_coast_dalmatia: "Fortificar la Costa Dálmata"
 AUH_ww1_fortify_coast_dalmatia_desc: "A pesar de que no tenemos una armada muy fuerte, todavía tenemos una larga costa, que hay que defender si no se va a establecer un frente de los Balcanes a Italia, lo que sería un desastre para nuestro esfuerzo de guerra. La mejora de los fuertes costeros existentes y la construcción de nuevos, así como algunos fuertes convencionales en el área por si acaso, puede ayudar a asegurarnos de que nunca tenemos que enfrentar ese escenario de pesadilla." 

 AUH_ww1_ready_country: "Propaganda de Reclutamiento"
 AUH_ww1_ready_country_desc: ""

 AUH_ww1_polnische_wehrmacht: "Polnische Wehrmacht"
 AUH_ww1_polnische_wehrmacht_desc: "Si prometemos a los polacos su propio Estado después de la guerra, tal vez los residentes de nuestra parte de Polonia estén más dispuestos a participar en la acción. Si cederemos o no el territorio es, por supuesto, una cuestión por decidir aún, pero por ahora, podemos disfrutar de la afluencia de hombres sanos sin pensar en las consecuencias." 
 
 AUH_ww1_military_harmonization: "Armonía Militar"
 AUH_ww1_military_harmonization_desc: "Un ejército con 3 subdivisiones en sus fuerzas terrestres por sí sola no es fácil de mantener bajo control, pero últimamente nuestros oficiales se han acostumbrado cada vez más a lidiar con las complejidades de tal fuerza. A medida que nuestros militares comienzan a operar más orgánicamente y de una manera más unificada, más ideas están llegando al nivel superior, lo cual es beneficioso para nuestra doctrina."

 AUH_ww1_balkans_policy: "Política de los Balcanes"
 AUH_ww1_balkans_policy_desc: "Desde la adquisición y la anexión de Bosnia, hemos tratado de mantener nuestra participación en los Balcanes seguro, y, sin duda, seguir expandiéndose en esa área si tenemos una oportunidad fácil y barato. Al establecer nuestro argumento en el escenario mundial, podemos participar más activamente en la política de la región de los Balcanes." 

 AUH_ww1_balkans_policy_intervene: "Primera reacción a la Guerra de los Balcanes"
 AUH_ww1_balkans_policy_intervene_desc: "La guerra de los Balcanes fue una experiencia interesante, sobre todo al mostrar la sorprendente fuerza potencial de estos estados balcánicos cuando se unificaron. Aunque estábamos apoyando al Imperio Otomano, parece que su poder en esta región se ha erosionado completamente. Tal vez Austria tiene que encontrar un nuevo amigo cercano, si vamos a mantener lo que tenemos aquí?" 

 AUH_ww1_balkans_bulgaria_friend: "Enviar Consejeros Militares"
 AUH_ww1_balkans_bulgaria_friend_desc: "Los búlgaros están en un punto difícil en este momento. Su guerra contra Serbia se ha derramado en un conflicto con literalmente cada uno de sus vecinos. Si no enviamos al menos asesores, podría haber terminado para ellos. Esta es también, por supuesto, una interesante oportunidad de hacer amigos con uno de estos estados balcánicos ..."

 AUH_ww1_balkans_bulgaria_send_troops: "Enviar tropas para ayudar a Bulgaria"
 AUH_ww1_balkans_bulgaria_send_troops_desc: "Para garantizar que Bulgaria tenga al menos una oportunidad de luchar para no ser anexada, podemos enviar a algunas de nuestras propias tropas, nominalmente voluntarias, para tratar de dar a Bulgaria por lo menos alguna ventaja en el conflicto. Esto proporcionará una experiencia muy necesaria y seguirá empujando a Bulgaria más hacia nuestra esquina."

 AUH_ww1_balkans_serbian_expansion: "Investigar el Expansionismo Serbio"
 AUH_ww1_balkans_serbian_expansion_desc: "Aunque los serbios han sido nominalmente amistosos con Austria desde que alcanzaron la independencia plena, puesto que hemos anexado Bosnia, las cosas han sido mucho menos amistosas entre el gobierno serbio. Debido a una fuerte subida de la delincuencia, especialmente de los inmigrantes recientes de Serbia en el interior de nuestras fronteras, una investigación sobre las actividades de Serbia en Austria debe llevarse a cabo."

 AUH_ww1_balkans_serbian_ultimatum: "Enviar Ultimatum a Serbia"
 AUH_ww1_balkans_serbian_ultimatum_desc: "Por lo tanto, los bastardos serbios estaban tratando de agitar las rebeliones para obtener sus manos sucias en nuestras provincias eslavas del sur! Deben ser castigados por esta clara violación de la confianza, y nuestro buen Kaiser ha comenzado a preparar un ultimátum al gobierno serbio, que seguramente no estarán en condiciones de rechazar."
