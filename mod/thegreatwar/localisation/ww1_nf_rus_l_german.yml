l_german:
###  Übersetzung von Proho
 # [RUSSISCHES REICH] Armee-Einsatz
 #=========================================================================
 RUS_ww1_army_effort:0 "Reorganisation der kaiserlich-russischen Armee"
 RUS_ww1_army_effort_desc:0 "Die Armee hat seit den Reformen von Dmitry Milyutin im Jahr 1874 keine größeren Reformen mehr erlebt und ist eindeutig nicht auf einen globalen Konflikt vorbereitet: Viele Ausrüstungsgegenstände sind veraltet, die logistische Infrastruktur ist unzureichend und wir haben nur sehr wenige Lastwagen oder Luftschiffe. Es ist an der Zeit, die kaiserliche Armee neu zu organisieren, denn wenn der Tag erst einmal gekommen ist, wird es zu spät sein."
 RUS_ww1_trenchwarfare:0 "Schwerpunkt Grabenkämpfe"
 RUS_ww1_trenchwarfare_desc:0 "Der moderne Krieg ist nicht mehr mit dem Krieg unserer Vorfahren vergleichbar. Die Kämpfer werden durch das Feuer von Maschinengewehren und Kanonen dezimiert, und die einzige Möglichkeit zu überleben besteht darin, sich in Gräben zu vergraben, die die Soldaten so gut wie möglich ausheben. Es müssen Regeln aufgestellt und die richtige Ausrüstung zur Verfügung gestellt werden."
 RUS_ww1_artillery_effort_1:0 "Artillerie Einsatz I"
 RUS_ww1_artillery_effort_1_desc:0 "Wenn wir unsere Artilleriegeschütze in Gruppenbatterien zusammenfassen, können wir das Feuer auf einen bestimmten Punkt konzentrieren und den Schaden maximieren."
 RUS_ww1_artillery_effort_2:0 "Artillerie Einsatz II"
 RUS_ww1_artillery_effort_2_desc:0 "Wenn wir die besten ausländischen Ballistikexperten zu Rate ziehen, könnten wir sehr nützliche Ratschläge für die Gestaltung unserer eigenen Fässer erhalten."
 RUS_ww1_artillery_effort_3:0 "Artillerie Einsatz III"
 RUS_ww1_artillery_effort_3_desc:0 "Durch die Weiterentwicklung unserer Feueroptiken und Koordinatensysteme würden die Batterien effizienter arbeiten und die Granaten weniger streuen."
 RUS_ww1_artillery_effort_4:0 "Artillerie Einsatz IV"
 RUS_ww1_artillery_effort_4_desc:0 "Durch die Standardisierung der Produktion von Granaten und Kalibern sollte der kaiserliche Artilleriepark rationalisiert werden."
 RUS_ww1_special_forces:0 "Schwerpunkt Spezialkräfte"
 RUS_ww1_special_forces_desc:0 "Durch die chemische Kriegsführung sind wir zufällig auf eine ausgezeichnete Kategorie von Truppen gestoßen, die allen anderen in unserer Armee überlegen sind. Diese Männer scheinen in der Lage zu sein, wie Infanteristen zu agieren, aber weit über den Standard-Füsilier hinaus. Eine Investition in die Spezialisierung und Ausbildung dieser Männer könnte zur Schaffung echter Spezialkräfte führen. Wenn es nur eine Möglichkeit gäbe, sie schneller in den Kampf zu bringen..."
 RUS_ww1_army_motorization_focus:0 "Schwerpunkt Motorisierung"
 RUS_ww1_army_motorization_focus_desc:0 "Einige unserer Experten im Generalstab - oder vielleicht auch nur Männer mit Schützengrabenerfahrung - haben vorgeschlagen, speziell für den Truppentransport entwickelte Fahrzeuge in Serie zu fertigen, wodurch wir in kurzer Zeit mehr Streitkräfte in den Kampf bringen könnten. Natürlich erfordert diese Entscheidung Training und spezielle Ausrüstung, was eine erhebliche Investition bedeutet, aber das ließe sich leicht regeln."
 RUS_ww1_doctrine_effort:0 "Doktrin Bemühungen I"
 RUS_ww1_doctrine_effort_desc:0 "Obwohl die Ära der adligen Generäle vorbei ist, wurden viele unserer hochrangigen Offiziere nicht aufgrund ihres Talents, sondern aufgrund ihrer Beziehungen oder familiären Bindungen ausgewählt. Dies erhält ihre Loyalität, macht sie aber wenig wettbewerbsfähig. Wir sollten damit beginnen, sie nach ihren Verdiensten zu ernennen, aber wir sollten aufpassen, dass nicht zu viele Mitglieder des gewöhnlichen Abschaums aufsteigen..."
 RUS_ww1_doctrine_effort_2:0 "Doktrin Bemühungen II"
 RUS_ww1_doctrine_effort_2_desc:0 "Obwohl unser allgemeines Personal bislang nach Verdienst befördert wurde, sind sie nicht die einzigen, die uns bei der Verbesserung unserer Doktrinen helfen können. Ein Typus von Forscher, der seit den frühen 1800er Jahren untätig geblieben ist, ist der Salongeneral.  Obwohl diese Männer nur über sehr begrenzte Kampferfahrung verfügen, kann ihr Studium des Krieges nicht ignoriert werden. Ihre Integration könnte für unsere Militärtaktik von Vorteil sein."
 RUS_ww1_doctrine_effort_3:0 "Doktrin Bemühungen III"
 RUS_ww1_doctrine_effort_3_desc:0 "Einer der kritischen Punkte im Krieg wurde viel zu lange ignoriert: die Logistik. Damit die Truppen ihre volle Effektivität im Kampf behalten können, müssen wir sicherstellen, dass sie rechtzeitig ankommen und angemessen mit Wasser, Nahrung und Waffen versorgt werden. Wenn wir Experten zu diesem Thema zu Wort kommen lassen und Fahrer von Versorgungsfahrzeugen ausbilden, würde dies nicht nur unmittelbare Vorteile für unsere Bodendoktrinen mit sich bringen, sondern auch andere zukünftige Vorteile."
 RUS_ww1_equipment_effort:0 "Ausrüstung Aufwand I"
 RUS_ww1_equipment_effort_desc:0 "Unsere alten Salongeneräle scheinen nicht über die Überalterung unserer Waffen und unserer gesamten militärischen Instrumente alarmiert zu sein, aber es ist ein Problem, das immer regelmäßiger von jungen Offizieren und insbesondere von denen, die wirklich kämpfen, angesprochen wird! Wir müssen ein Programm zur Modernisierung unserer Streitkräfte auflegen."
 RUS_ww1_equipment_effort_2:0 "Ausrüstung Aufwand II"
 RUS_ww1_equipment_effort_2_desc:0 "Unsere neuen Vorarbeiter bitten uns nicht nur um neue Gewehre, sondern auch um neue Unterstützungswaffen. Die Erfahrungen mit diesen neuen Waffen haben zu neuen Ideen wie leichten Maschinengewehren, Grabenmörsern und Gewehrgranaten geführt, die sehr nützlich erscheinen, sobald wir die richtigen Leute für ihre Entwicklung und Produktion abstellen können."
 RUS_ww1_equipment_effort_3:0 "Ausrüstung Aufwand III"
 RUS_ww1_equipment_effort_3_desc:0 "Die Versorgungsoffiziere haben einen Brief mit Forderungen geschickt, um mehr Schützengrabengewehre zu bekommen: solche, die Gewehrgranaten abfeuern können, Bajonettschäfte, Schussoptiken und mehr Karabiner. Wir könnten einfach mehr davon produzieren, aber es würde Sinn machen, unsere Waffen zu standardisieren, damit sie alle diese neuen Verbesserungen aufnehmen können."
 RUS_ww1_equipment_effort_4:0 "Ausrüstung Aufwand IV"
 RUS_ww1_equipment_effort_4_desc:0 "Unsere Intendanten haben uns leider eine neue Liste mit Forderungen zukommen lassen. Glücklicherweise haben wir den Kurierdienst angewiesen, weitere ihrer Beschwerden zu ignorieren. Ihre neueste Forderung ist die Ausrüstung des Ingenieurkorps: Werkzeuge, Gewehre und diese neuen Flammenwerfer, so schnell wie möglich. Natürlich könnte eine bessere Ausstattung des Ingenieurkorps uns ungeahnte Vorteile verschaffen."
 RUS_ww1_armor_effort_1:0 "Panzerung Einsatz"
 RUS_ww1_armor_effort_1_desc:0 "Unsere ersten Investitionen haben sich ausgezahlt! Die Ingenieure und Designer der Artillerie und der Fahrzeuge haben einen völlig neuen Fahrzeugtyp entwickelt, den sie uns nun anbieten: einen schwer gepanzerten Traktor mit einer Feldkanone. Obwohl die ersten Prototypen noch nicht weit genug entwickelt sind, um im Kampf eingesetzt zu werden, sind sie sehr vielversprechend, insbesondere um die Sackgasse der Schützengräben zu unseren Gunsten zu entscheiden, wenn diese Maschinen dem Feuer der Maschinengewehre standhalten können, wie uns garantiert wird."
 RUS_ww1_armor_effort_2:0 "Panzerung Einsatz II"
 RUS_ww1_armor_effort_2_desc:0 "Unsere Experimente mit Panzern sind ein durchschlagender Erfolg! Dennoch können wir uns mit unseren derzeitigen Konzepten nicht zufrieden geben. Unsere Ingenieure haben neue und interessante Vorschläge gemacht, wie drehbare Geschütztürme, Abteilungen mit speziellen Motoren und eine Panzerführerluke. Dies kann nicht ignoriert werden. Wenn wir die Ersten wären, die diese Ideen in die Tat umsetzen, könnten wir unwiderstehlich sein!"
 RUS_ww1_gasmask_focus:0 "Schwerpunkt Chemische Kriegsführung"
 RUS_ww1_gasmask_focus_desc:0 "Mehrere unserer Chemiker haben den Einsatz eines neuen chemischen Wirkstoffs vorgeschlagen, der unglaublich tödlich ist. Ein Gift, das von unseren Mörsern und unserer Artillerie angetrieben wird. Auch wenn die chemische Kriegsführung fast ein Jahrhundert lang missbilligt wurde, welche andere Wahl haben wir, wenn wir den Krieg gewinnen können! Abgesehen von diesem Aspekt sollten wir uns auch für die bessere Entwicklung von schnellen Gegenmaßnahmen mit diesem Thema beschäftigen."
 #--------------------------------------------------------------
 # [RUSSISCHES REICH] Luftfahrt-Bemühungen
 #=========================================================================
 RUS_ww1_aviation_effort:0 "Gründung des Kaiserlich Russischen Flugdienstes"
  RUS_ww1_aviation_effort_desc:0 "Die militärische Luftfahrt scheint eine große Zukunft zu haben. Deshalb müssen wir den Kaiserlich-Russischen Flugdienst so schnell wie möglich aus dem Pionierkorps herauslösen und zu einer eigenen Abteilung der Armee machen."
 RUS_ww1_sikorsky_airplane_research:0 "Sikorskys Flugzeugforschung"
 RUS_ww1_sikorsky_airplane_research_desc:0 "Die Genialität von Igor Sikorsky auf dem Gebiet der Luftfahrt steht außer Zweifel. Wir müssen diesen begabten Ingenieur unterstützen, damit er russische Flugzeuge entwickeln kann, die in der Lage sind, mit den Leistungen der anderen Großmächte zu konkurrieren, wenn nicht sie sogar zu übertreffen."
 RUS_ww1_rbvz_production:0 "Russko-Baltiisky Vagonny Zavod"
 RUS_ww1_rbvz_production_desc:0 "Die Eisenbahn ist eine hervorragende Antwort auf das erste unserer Probleme, nämlich die extreme Ausdehnung unseres Landes! Dank der Eisenbahn können wir alle Regionen erschließen und Nachrichten, Waren, Reisende und Truppen leichter von einem Punkt der Welt zum anderen transportieren. Einer unserer Minister schlug daher vor, ein Unternehmen in Riga, Lettland, zu gründen, das diese Maschinen in großen Stückzahlen herstellen sollte."
 RUS_ww1_fighter_focus:0 "Schwerpunkt Jäger"
 RUS_ww1_fighter_focus_desc:0 "Der Wert von Kampfflugzeugen steht nicht in Frage. Wenn wir unsere Anstrengungen in der Luft auf die Entwicklung und den Einsatz dieser Flugzeuge konzentrieren, könnten unsere Flugzeuge eines Tages den Himmel überfluten, die Flugzeuge des Feindes zerstören, ohne dass diese etwas dagegen unternehmen können, und uns einen entscheidenden Vorteil verschaffen. Natürlich ist auch die Bomberlobby interessant, daher sollten wir nicht alle unsere Eier in einen Korb legen..."
 RUS_ww1_bomber_focus:0 "Schwerpunkt Bomber"
 RUS_ww1_bomber_focus_desc:0 "Der Bomber ist eine einfache und praktische Maschine. Die Konzentration unserer Designs und Produktionskräfte auf diese spezielle Klasse von Luftfahrzeugen wäre ein guter Weg, um sicherzustellen, dass wir die Luftwaffe als Truppenunterstützungsinstrument einsetzen können, das in der Lage ist, die Infanterie durch die Zerstörung feindlicher Verteidigungsanlagen und Stellungen zu unterstützen. Natürlich können immer noch Kampfflugzeuge produziert werden, aber diese Bomber könnten den Krieg für uns gewinnen."
 RUS_ww1_airship_focus:0 "Schwerpunkt Luftschiffe"
 RUS_ww1_airship_focus_desc:0 "Das Luftschiff ist unser ältestes Luftfahrzeug, und Experten sagen voraus, dass diese Maschine keine große Zukunft auf dem Schlachtfeld hat. Das ist jedoch keine Entschuldigung dafür, ihre Konstruktion zu vernachlässigen, vor allem, wenn sie ein immer noch brauchbares Mittel sein können, um schwere Bomberladungen abzuwerfen. Wenn wir die Zeppelin-Manufakturen unter unsere Fittiche nehmen, können wir ihr Potenzial voll ausschöpfen, solange wir noch können."
 RUS_ww1_aviation_effort_2:0 "Luftfahrt-Bemühungen I"
 RUS_ww1_aviation_effort_2_desc:0 "Nachdem wir nun endgültig eine Luftwaffe aufgebaut haben, haben wir einige interessante Fortschritte gemacht. Vor allem haben unsere Konstrukteure von Luftfahrzeugen nicht nur allgemeine Modelle, sondern auch spezielle Prototypen für bestimmte Rollen entwickelt. Der effektive Einsatz dieser Flugzeuge, die für Rollen wie den Angriff auf feindliche Flugzeuge oder den Abwurf von Bomben konzipiert sind, wird Tests und Forschung erfordern, aber er wird sich als vorteilhaft erweisen."
 RUS_ww1_aviation_effort_4:0 "Luftfahrt-Bemühungen II"
 RUS_ww1_aviation_effort_4_desc:0 "Unsere Bemühungen, Flugzeuge für spezielle Rollen zu entwickeln, haben zu einer großen Vielfalt an Flugzeugen geführt, mit denen man viele verschiedene Dinge tun kann. Insbesondere die Klasse der Jagdflugzeuge hat besonders die Jugend angezogen, die sich bereits für sie begeistert. Sie haben interessante Ideen für die Zukunft unserer Luftwaffe geliefert. Vielleicht sollten wir ihren Ideen mehr Kredit gewähren, um unserer Doktrin willen."
 RUS_ww1_pilotformation_1:0 "Pilotenausbildung I"
 RUS_ww1_pilotformation_1_desc:0 "Nur wenige Menschen haben das Zeug dazu, eine dieser gefährlichen Maschinen zu steuern. Gründen wir eine Schule, die sie ausbilden soll."
 RUS_ww1_pilotformation_2:0 "Pilotenausbildung II"
 RUS_ww1_pilotformation_2_desc:0 "Die neuen Formationen, die wir entworfen haben, haben sich im Kampf als vorteilhaft erwiesen. Es ist jedoch etwas anderes, ob wir sicherstellen, dass sich unsere Piloten daran halten. Wenn wir unsere besten «Asse» dazu ermutigen würden, ein Handbuch über Lufttaktiken und Schulungen für unsere Piloten zu verfassen, würden wir sicherstellen, dass unsere Piloten das Beste daraus machen, und vielleicht könnten diese Schriften bei der Entwicklung neuer Doktrinen helfen."
 RUS_ww1_aircraftprod_1:0 "Luftfahrzeugproduktion I"
 RUS_ww1_aircraftprod_1_desc:0 "Es ist eine Zeitverschwendung, lokale Werkstätten jedes Flugzeug von Hand herstellen zu lassen. Ein staatliches Unternehmen muss mit den industriellen Mitteln ausgestattet werden, um Flugzeuge am Fließband herzustellen."
 RUS_ww1_aircraftprod_2:0 "Luftfahrzeugproduktion II"
 RUS_ww1_aircraftprod_2_desc:0 "Während das Flugzeug in Fabriken produziert wurde, die bisher dem Fahrzeugbau gewidmet waren, haben wir neue Fabriken errichtet, die sich speziell mit der Herstellung und Montage von Flugzeugen befassen. Diese neuen Fabriken, die normalerweise von Experten geleitet werden, werden uns helfen, die Produktion zu rationalisieren und die Modelle in der Produktion zu verbessern."
 RUS_ww1_airbomb_1:0 "Luftbombardierung I"
 RUS_ww1_airbomb_1_desc:0 "Während sich die Taktiken unserer Kampfflugzeuge mit der Ausbildung weiterentwickeln, sind unsere Bomber immer noch relativ einfache Maschinen mit grundlegenden Strategien. Einige unserer ältesten Bomber verfügen mittlerweile über ein gewisses, bisher ungenutztes Fachwissen über den Luftkrieg. Und das könnte uns helfen. Indem wir diese Veteranen einsetzen, können wir sicher sein, dass die alten Lektionen des Bombardements nicht mit den neuen Flugzeugen verloren gehen."
 RUS_ww1_airbomb_2:0 "Luftbombardierung II"
 RUS_ww1_airbomb_2_desc:0 "Eines der größten Probleme, mit denen unsere Luftwaffe derzeit zu kämpfen hat, ist die Tatsache, dass Bombardements derzeit noch ein Spiel mit Vermutungen sind, bei dem geometrische Berechnungen während des Flugs durchgeführt werden müssen, die weder praktikabel noch praktikabel sind. Mit nicht nur der Doktrin, sondern auch mit standardisierter Ausrüstung und Personal, das im Umgang damit geschult ist, können wir das Bombardement in eine tödliche, präzise und unmittelbare Bedrohung verwandeln."
 RUS_ww1_air_innovation:0 "Schwerpunkt Luft-Innovation"
 RUS_ww1_air_innovation_desc:0 "All diese jüngsten Fortschritte in der Luftkriegsführung, sowohl in der Theorie als auch in der Praxis, haben zu einem goldenen Zeitalter der Luftfahrt geführt. Vom Piloten bis zum Mechaniker scheint jeder eine Idee und etwas zu haben, das er ändern und anbieten kann, einen Impuls, den wir auf nationaler Ebene nutzen können! Vielleicht wird das Flugzeug eines Tages die wichtigste Waffe im Krieg sein ..."
 RUS_ww1_navalair:0 "Marinebombardierung"
 RUS_ww1_navalair_desc:0 "Einer unserer Offiziersanwärter der Luftwaffe hat vor kurzem ein Projekt entwickelt, an dem sie heimlich gearbeitet haben. Ein Wasserflugzeug wurde von einem unbeweglichen Schiff aus gestartet und warf eine Bombe auf einen alten Kahn ab, wodurch dieser schnell sank. Obwohl die meisten unserer hohen Kommandeure nicht sonderlich beeindruckt waren, könnte die Aufmerksamkeit des Staatsoberhauptes dem Projekt wahrscheinlich einen Schub verleihen."
 #--------------------------------------------------------------
 # [RUSSISCHES REICH] Industrieller Einsatz
 #=========================================================================
 RUS_ww1_industrial_effort:0 "Industrieller Einsatz"
 RUS_ww1_industrial_effort_desc:0 "Die Industrielle Revolution ist immer noch im Gange, und unsere Nation hat immer noch einiges zu tun, um an der Spitze zu bleiben. Ein paar neue, ehrgeizige Projekte zur Steigerung unserer industriellen Fähigkeiten in Angriff zu nehmen, würde unserer Nation kurz- und langfristige Vorteile bringen, und das geringste davon wäre eine große Verbesserung unserer Fähigkeit, unsere Truppen zu bewaffnen."

 RUS_ww1_extension_of_the_putilov_factory:0 "Erweiterung der Putilow-Fabrik"
 RUS_ww1_extension_of_the_putilov_factory_desc:0 "Die Fabrik von Nikolai Putilow wird bald ihr 50-jähriges Bestehen feiern, und sie floriert, produziert Schienen und Lokomotiven in großer Zahl, die von Sankt Petersburg aus bis in die Nöte unseres Landes exportiert werden. Wir sollten ihnen umfangreiche Kredite gewähren, damit sie ihre Aktivitäten weiter ausbauen können, denn im Kriegsfall wird uns dieses industrielle Potenzial sehr nützlich sein. Übrigens könnten diese Werkstätten auch leicht in Waffenfabriken umgewandelt werden!"

 RUS_ww1_construction_effort:0 "Konstruktionsaufwand I"
 RUS_ww1_construction_effort_desc:0 "Ein ausländisches Unternehmen aus einer benachbarten neutralen Nation ist mit einer unserer nationalen Industrien fusioniert worden. Wenn wir die neue Tochtergesellschaft dazu ermutigen, ihre Fabriken und Arbeitsplätze in unser Land zu verlegen, werden wir einen sofortigen Anstieg unserer zivilen Industrie erleben. Natürlich sollten wir den Bau dieser neuen Fabriken beaufsichtigen..."
 RUS_ww1_construction_effort_2:0 "Konstruktionsaufwand II"
 RUS_ww1_construction_effort_2_desc:0 "Manchmal muss sich der Staat sogar in einem Freihandelsmarkt einmischen. Wenn der Staat die Gründung neuer Unternehmen finanzieren muss, müssen wir dafür sorgen, dass wir wettbewerbsfähig und unabhängig von ausländischen Importen bleiben, falls der Handel schwieriger werden könnte."
 RUS_ww1_construction_effort_3:0 "Konstruktionsaufwand III"
 RUS_ww1_construction_effort_3_desc:0 "Unsere zivile industrielle Expansion ist fast abgeschlossen, aber es gibt immer noch einiges zu tun. Einige Grundstücke, die wir in einer Stadt besitzen, können immer noch an einen unserer Konzerne verkauft werden, mit deren Zustimmung, damit sie dort eine Manufaktur errichten. Dies wird unsere zivile Warenproduktion weiter erhöhen und uns mehr Optionen für zukünftige Bauten geben."
 RUS_ww1_production_effort:0 "Rüstungsaufwand I"
 RUS_ww1_production_effort_desc:0 "Die Menge an Waffen, die wir erworben haben, hat das Interesse eines örtlichen Stahlfabrikanten geweckt, der in unserem Land eine neue Waffenfabrik errichten möchte. Wenn wir diese Bemühungen unterstützen, indem wir ihm helfen, das nötige Land zu erwerben und ihm Investoren und Talente zur Verfügung stellen, werden wir mehr als nur den Gewinn einer neuen Rüstungsfabrik erhalten."
 RUS_ww1_production_effort_2:0 "Rüstungsaufwand II"
 RUS_ww1_production_effort_2_desc:0 "Ein Automobilunternehmen, das in der Vergangenheit Fahrzeuge der Militärklasse für uns gebaut hat, hat Interesse daran bekundet, eine völlig neue Fabrik speziell für die Militärproduktion zu errichten, um seine Produktionskapazitäten für den zivilen Markt zu erhalten. Wenn wir ihnen beim Bau dieser Fabrik helfen, könnten wir einen Exklusivvertrag aushandeln, was eine direkte Erhöhung unserer militärischen Produktionskapazität bedeuten würde."
 RUS_ww1_production_effort_3:0 "Rüstungsaufwand III"
 RUS_ww1_production_effort_3_desc:0 "Ein Flugzeugkonstrukteur und ein Mechaniker kamen mit einer neuen Anfrage zu uns, um eine Militärflugzeugfabrik zu gründen, in der Flugzeuge für unsere Armeen zusammengebaut werden sollten."
 RUS_ww1_dockyard_effort_1:0 "Werft Erweiterung I"
 RUS_ww1_dockyard_effort_1_desc:0 "Indem wir ungenutztes oder verlassenes Küstenland kaufen, um unsere bestehende Infrastruktur auszubauen, könnten wir unsere Arsenale und Werften vergrößern."
 RUS_ww1_dockyard_effort_2:0 "Werft Erweiterung II"
 RUS_ww1_dockyard_effort_2_desc:0 "Matrosen der Handelsmarine, Fischer und pensionierte Seeleute unserer eigenen Marine können ihr Talent und ihre Erfahrung auf See nutzen, um an unseren neuen Docks zu arbeiten und sie zu beaufsichtigen."
 RUS_ww1_dockyard_effort_3:0 "Werft Erweiterung III"
 RUS_ww1_dockyard_effort_3_desc:0 "Einige unserer alten Handelshäfen werden heutzutage nicht mehr viel genutzt. Mit ein paar Investitionen und Renovierungsarbeiten könnten diese leicht für militärische Zwecke umgebaut werden."
 RUS_ww1_airfield_expansion_1:0 "Das Militärgelände Gatchina als Flugplatz"
 RUS_ww1_airfield_expansion_1_desc:0 "Flugplätze haben den Luxus, dass sie nur ein Stück Land benötigen, das relativ nah an einem Straßennetz liegt. Die Einrichtung dieser Grundstücke ist eine Arbeit für sich, die sich jedoch auszahlen wird. In der Nähe von Gatschina gibt es viel ehemaliges Ackerland, das sich gut für diesen Zweck eignen würde."
 RUS_ww1_airfield_expansion_2:0 "Flugplatz Ausbau I"
 RUS_ww1_airfield_expansion_2_desc:0 "Zumindest benötigen Flugzeuge für ihre Basen keinen großen Aufwand: Meistens reicht ein übersichtliches Gelände zum Starten und Landen völlig aus, solange es schön flach ist."
 RUS_ww1_airfield_expansion_3:0 "Flugplatz Ausbau II"
 RUS_ww1_airfield_expansion_3_desc:0 "Einige unserer zivilen Landebahnen aus den Tagen vor der Militärluftfahrt sind noch da und jetzt verlassen. Wir können sie für einen Brotpreis zurückkaufen und für unsere eigenen Zwecke nutzen."
 RUS_ww1_infrastructure_effort:0 "Infrastruktur Ausbau I"
 RUS_ww1_infrastructure_effort_desc:0 "Mit dem Wachstum unserer Industrie fordert der Privatsektor weiterhin, die Investitionen in die Infrastruktur zu erhöhen, um die nationale Wirtschaft zu unterstützen. Solange wir das tun, werden wir nicht mehr Möglichkeiten erhalten, neue Fabriken zu errichten. Natürlich hilft die Infrastruktur auch unserer Nation, indem sie die Geschwindigkeit und den Versorgungsfluss für unsere Truppen erhöht, daher könnte diese Investition kein so schlechter Plan sein."
 RUS_ww1_infrastructure_effort_2:0 "Infrastruktur Ausbau II"
 RUS_ww1_infrastructure_effort_2_desc:0 "Mit unseren Industriebetrieben, Werften und Landebahnen, die immer weiter ausgebaut werden, gibt es immer mehr zu investieren. Der logische Schritt nach vorne ist derzeit die Eisenbahn, die wir bislang weitgehend ignoriert haben. Investitionen in deren Modernisierung werden dazu beitragen, Vorräte und Menschen zu bewegen und neue Gebiete für Investitionen in unsere Wirtschaft zu erschließen."
 RUS_ww1_infrastructure_effort_3:0 "Infrastruktur Ausbau III"
 RUS_ww1_infrastructure_effort_3_desc:0 "Da ein großer Krieg droht, müssen wir weiterhin in Bauprojekte investieren und dafür sorgen, dass unsere Truppen die angenehmsten Eisenbahnen der Welt haben."
 RUS_ww1_infrastructure_effort_4:0 "Infrastruktur Ausbau IV"
 RUS_ww1_infrastructure_effort_4_desc:0 "Einige Bauingenieure haben die Schaffung eines der ehrgeizigsten Straßennetzes vorgeschlagen, das unsere größten Städte und einige unserer Militärstützpunkte miteinander verbinden soll. Die Investition in dieses Projekt wird unsere Infrastruktur zu einem Objekt der Begierde für die ganze Welt machen, alle Straßen werden zu unserer Hauptstadt führen!"
 RUS_ww1_extra_tech_slot:0 "Zusätzlicher Forschungsplatz"
 RUS_ww1_extra_tech_slot_desc:0 "Mit einem so großen Industriesektor und mehreren unserer klügsten Köpfe an den Schalthebeln der Militärmanufakturen und der militärischen Entwicklung sind schnell Ergebnisse zu erwarten. Einige der Industrien, die wir anfangs unterstützt haben, haben einige leidenschaftliche Individuen hervorgebracht, die interessante Forschungen für unsere Nation durchführen können."
 RUS_ww1_expand_the_academy_of_sciences:0 "Erweiterung der Akademie der Wissenschaften"
 RUS_ww1_expand_the_academy_of_sciences_desc:0 "Die Freigabe eines Budgets zur Erweiterung der Forschungsabteilungen der Akademie der Wissenschaften in Petrograd würde uns die Durchführung von mehr experimentellen Projekten ermöglichen."
 #--------------------------------------------------------------
 # [RUSSISCHES REICH] Marine-Einsatz
 #==============================================================
 RUS_ww1_naval_effort:0 "Verstärkung der Kaiserlich Russischen Marine"
  RUS_ww1_naval_effort_desc:0 "Seit unserer Niederlage bei Tsushima wird die kaiserlich-russische Marine nicht mehr gefürchtet. Wir müssen die notwendigen Maßnahmen ergreifen, damit diese Vorstellung so schnell wie möglich aus den Köpfen der Menschen verschwindet."
 RUS_ww1_newnavalcanons_1:0 "MarinegeschützeI"
 RUS_ww1_newnavalcanons_1_desc:0 "Während sich das Design unserer Schiffe ständig weiterentwickelt, sollten wir die Marineartillerie an Bord unserer Schiffe nicht vergessen. Obwohl wir die Kaliber seit über einem Jahrhundert standardisiert haben, haben wir immer noch zu viele verschiedene Kaliber für zu viele verschiedene Rollen. Indem wir die Anzahl der Standards reduzieren und jede Waffenart universeller machen, können wir das Design von Schiffen rationalisieren."
 RUS_ww1_european_seas_focus:0 "Schwerpunkt Europa"
 RUS_ww1_european_seas_focus_desc:0 "Russland wird immer aus der Kiewer Rus' hervorgehen. Unsere Hauptinteressen werden immer auf diese Region gerichtet sein, und wir müssen unsere politische und diplomatische Position in dieser Hinsicht stärken."
 RUS_ww1_asian_seas_focus:0 "Schwerpunkt Asien"
 RUS_ww1_asian_seas_focus_desc:0 "Négliger l'Extrême-Orient serait une grave erreur. Les prétentions impérialistes du Japon ne sont pas passées inaperçues, de même que la progression des Américains dans le Pacifique. Il faut renforcer nos intérêts dans la région !"
 RUS_ww1_newnavalcanons_2:0 "MarinegeschützeII"
 RUS_ww1_newnavalcanons_2_desc:0 "Bien que nous ayons dorénavant résolut le problème des canons, nous devrions maintenant concentrer nos efforts sur le matériel servant à soutenir ces batteries navales. Les télémètres commencent à devenir un standard pour nos navires. L’assurance que nos officiers sauront s’en servir, surtout à distance d’engagement maximale, nous permettra d’exploiter notre artillerie à son potentiel maximal."
 RUS_ww1_newnavalcanons_3:0 "Marinegeschütze III"
 RUS_ww1_newnavalcanons_3_desc:0 "Die Analoge Feuerkontrolle ist ein Meilenstein in der Schifffahrt, da sie alle Teile eines Schiffes auf das gleiche Ziel ausrichten kann. Obwohl es sich um ein relativ primitives Gerät handelt, ist es bereits sehr gefragt. Diese neuen Konstruktionen können uns einen entscheidenden Vorteil auf See verschaffen."
 RUS_ww1_dreadnought_effort:0 "Dreadnought-Einsatz"
 RUS_ww1_dreadnought_effort_desc:0 "Seitdem die Briten die erste Schlachtschiffklasse enthüllt haben, ist zwischen den größten Marinen der Welt ein Wettrüsten ausgebrochen, um immer größere und mächtigere Schlachtschiffe zu bauen. Wenn unser Land mit der Zeit gehen will, müssen auch wir unsere Designs verbessern und unsere eigenen Dreadnoughts herstellen."
 RUS_ww1_flexible_navy:0 "Flexible Marine"
 RUS_ww1_flexible_navy_desc:0 "Die riesigen Wasserflächen, die es auf beiden Seiten des Reiches abzudecken gilt, erfordern, dass sich unsere Flotten schnell anpassen und bei Bedarf reorganisieren können. Unser Marinehauptquartier ist bereits bereit, sich in diesem Sinne zu reformieren."
 RUS_ww1_large_navy:0 "Große Marine"
 RUS_ww1_large_navy_desc:0 "Unsere Geschwader müssen zwei Ozeane gleichzeitig abdecken! Die Anzahl unserer Kriegsschiffe ernsthaft zu erhöhen, ist keine Option. Wir brauchen genug, um große Geschwader für die Weiße und die Blaue Flotte zusammenzustellen."
 RUS_ww1_navyreform:0 "Marine Einsatz"
 RUS_ww1_navyreform_desc:0 "Es sind nicht einfach nur Kanonen und Schiffe, mit denen man eine Seeschlacht gewinnen kann. Das beste Schiff der Welt ist nutzlos, wenn es nicht zur richtigen Zeit am richtigen Ort ist. Investitionen in direkte Kommunikationskanäle zwischen Schiffen sowie zwischen der Flotte und dem Hafen können sicherstellen, dass jedes Schiff zur richtigen Zeit am richtigen Ort ist, und unsere Seeherrschaft unterstützen."
 RUS_ww1_submarine_effort:0 "U-Boot-Bemühungen"
 RUS_ww1_submarine_effort_desc:0 "U-Boote sind billig, können in großer Zahl eingesetzt werden und können eine furchterregende materielle und psychologische Bedrohung verursachen! Wir müssen einen Teil des Marinebudgets für den Bau mehrerer dieser neuen Maschinen bereitstellen."
 RUS_ww1_cruiser_effort:0 "Kreuzer Anstrengung"
 RUS_ww1_cruiser_effort_desc:0 "Unsere Admiräle fordern eine größere Flotte und eine große Investition in Kreuzer, um uns mittelgroße Schiffe zu verschaffen, die feindliche Schiffe und Transporter belästigen und größere Kriegsschiffe unterstützen können. Unsere Konstruktionsbüros in die Lage zu versetzen, neue Schiffsklassen dieser Art zu entwerfen und zu bauen, wird uns gegen jeden Feind mit einer großen Flotte helfen und unsere Unterseeboote sichern."
 RUS_ww1_destroyer_effort:0 "Zerstörer Anstrengung"
 RUS_ww1_destroyer_effort_desc:0 "Unsere Admiräle haben den Ausbau unserer Torpedobootsflotte und größere Investitionen in diesem Bereich gefordert. Dies wird uns leichtere Schiffe bescheren, die gut für den Kampf gegen feindliche Tauchboote, die Aufklärung und die Begleitung von Konvois sind. Die Bestellung von besseren Torpedobooten bei unseren Werften wird uns helfen, unsere Handelsrouten offen zu halten und unsere eigenen U-Boote zu unterstützen."
 RUS_ww1_capital_ships_effort:0 "Entwicklung von Großen Schiffen"
 RUS_ww1_capital_ships_effort_desc:0 "Unsere Admiräle haben uns eine relativ einfache Bitte geschickt: Mehr Schlachtschiffe, und zwar größere und mächtigere! Der Bau dieser titanischen Schiffe wird uns helfen, die Meere zu kontrollieren und unseren Bodentruppen, die im Falle einer Seeinvasion an Land gehen, eine gute Feuerunterstützung zu bieten."
 RUS_ww1_carrier_focus:0 "Träger Bemühungen"
 RUS_ww1_carrier_focus_desc:0 "Einige radikale Köpfe haben ein unbewaffnetes Schiff vorgeschlagen, das nur für den Einsatz von Marinebombern ausgerüstet ist, die von dort aus starten und weit draußen auf dem Meer zuschlagen sollen. Das ist ein sehr vielversprechendes Projekt, auch wenn es durch die heutige Technologie ein wenig behindert wird. Wenn wir unsere Bemühungen in diesem Projekt fortsetzen, wird die Marinefliegerei vielleicht eines Tages Allgemeingut werden..."
 RUS_ww1_antisubmarine:0 "U-Boot-Bekämpfung"
 RUS_ww1_antisubmarine_desc:0 "U-Boote sind besonders schwer zu fassende Schiffe, vor allem, wenn sie gut gesteuert werden. Sofern wir nicht vorhaben, unsere gesamte Transport- und Handelsflotte auf den Grund schicken zu lassen, haben uns unsere Admiräle geraten, mit Investitionen in Tiefenladungen, fortschrittliche Torpedos und andere Waffen zu beginnen, mit denen wir die Bedrohung aus der Welt schaffen können."
 #--------------------------------------------------------------
 # [RUSSISCHES REICH] Politische Bemühungen
 #=========================================================================
 RUS_ww1_political_effort:0 "Politische Bemühungen"
 RUS_ww1_political_effort_desc:0 "Die Zeit für eine Reformation ist gekommen. Die Nation wurde jahrelang gut nach den alten Prinzipien regiert, aber diese schwierigen Zeiten, in denen wir uns befinden, erfordern eine Regierung, die in der Lage ist, auf sie zu reagieren. Wenn wir in der Lage sein wollen, den Weg zu ändern oder unsere derzeitige Regierung zu unterstützen, um Angriffen von außen standzuhalten, kann ein politischer Wandel unserer Nation und der Zukunft unseres Volkes nur zugutekommen."
 RUS_ww1_reject_reforms:0 "Ablehnung der Reformen"
 RUS_ww1_reject_reforms_desc:0 "Die von unseren Gegnern vorgeschlagenen Reformen haben nur ein Ziel, die Schwächung des Reiches und des Zaren. Wir dürfen keine Schwächen zeigen. Das würden sie ausnutzen, um uns zu erstechen."
 RUS_ww1_adopt_reforms:0 "Annahme der Reformen"
 RUS_ww1_adopt_reforms_desc:0 "Das Reich wird von allen Seiten angegriffen, vielleicht sollten wir einige von der Opposition vorgeschlagene Reformen akzeptieren. Wenn wir nichts tun, laufen wir Gefahr, dass revolutionäre Bewegungen entstehen."
 RUS_ww1_condemn_marxist_ideas:0 "Verurteilung marxistischer Ideen"
 RUS_ww1_condemn_marxist_ideas_desc:0 "Die Ideen von Marx sind mehr als gefährlich und werden unter dem Deckmantel der Gleichheit nur soziale Unordnung verbreiten und eine seit Jahrhunderten bestehende Ordnung in Frage stellen! Und außerdem: Wie kann man einem Deutschen trauen?"
 RUS_ww1_crush_strikes:0 "Streiks zerschlagen"
 RUS_ww1_crush_strikes_desc:0 "Die gewalttätigen Streiks, die in letzter Zeit an allen Ecken und Enden des Landes ausgebrochen sind, laufen über. Man muss die Truppe schicken, um diese Aufstände niederzuschlagen!"
 RUS_strengthen_the_constitution:0 "Stärkung der Verfassung"
 RUS_strengthen_the_constitution_desc:0 "Die einzige Antwort auf politische Unruhen ist Zuverlässigkeit und Entschlossenheit. Mehrere unserer prominenten Politiker haben sich kürzlich für eine Überarbeitung der kaiserlichen Verfassung ausgesprochen, um sie zu stärken und damit die Macht wieder zu festigen."
 RUS_ww1_arrest_opposition_leaders:0 "Oppositionsführer verhaften"
 RUS_ww1_arrest_opposition_leaders_desc:0 "Uns wurden Beweise dafür vorgelegt, dass einige Politiker in die jüngsten zivilen Unruhen verwickelt sind. Sie werden ausreichen, um sie vor einem Gericht wegen Hochverrats zu verurteilen!"
 RUS_ww1_dissolve_imperial_duma:0 "Auflösung der Reichsduma"
 RUS_ww1_dissolve_imperial_duma_desc:0 "Die Duma war eine lästige Versammlung, die nur dazu diente, den schärfsten Reformern des Landes einen Kauknochen zu geben. Aber das hat die Liberalen nicht beruhigt, und sie verstrickt sich wieder einmal in lange und unfruchtbare Debatten. Wir sollten ein Dekret erlassen, um ihre dritte Auflösung anzuordnen."
 RUS_ww1_reinforce_tsar_authority:0 "Die Autorität des Zaren stärken"
 RUS_ww1_reinforce_tsar_authority_desc:0 "Die legitime Autorität des Zaren wird ständig in Frage gestellt, wir müssen energische Maßnahmen ergreifen, um dem ein Ende zu setzen, auch wenn wir uns damit Feinde machen."
 RUS_ww1_purge_imperial_guard:0 "Säuberung der Kaiserlichen Garde"
 RUS_ww1_purge_imperial_guard_desc:0 "Insiderinformationen berichten uns von einem wachsenden Anteil an abtrünnigen Offizieren und störenden Elementen in den Wachbataillonen. Wir können eine solche Abspaltung innerhalb der Truppen, die den imperialen Thron schützen sollen, nicht tolerieren!"
 RUS_ww1_discuss_tsar_authority:0 "Erörtern der Autorität des Zaren"
 RUS_ww1_discuss_tsar_authority_desc:0 "Der Zar hat vielleicht zu viel Macht. Vielleicht sollten wir uns von den Briten inspirieren lassen und die Macht der Parlamentarier stärken, bevor es zu spät ist und das Reich in sich zusammenfällt."
 RUS_ww1_parliamentary_immunity:0 "Parlamentarische Immunität"
 RUS_ww1_parliamentary_immunity_desc:0 "Wenn wir Russland grundlegend reformieren, zu einem modernen Staat machen und vor allem auf dem Weg zur Demokratie vorankommen wollen, dann müssen wir aufhören, Angst vor Reformern zu haben, und die mundtotmachende Macht der Zaren und der etablierten Behörden einschränken. Es muss eine parlamentarische Immunität gesetzlich verankert werden, damit jeder gewählte Abgeordnete sicher sein kann, dass er keine Repressalien zu befürchten hat, wenn er ein Projekt vorschlägt."
 RUS_ww1_fifth_duma:0 "Etablierung der Fünften Duma"
 RUS_ww1_fifth_duma_desc:0 "Seit der letzten Auflösung ist ein wenig Wasser den Fluss hinuntergeflossen. Die Wahlen haben stattgefunden und die politische Landschaft wurde neu zusammengesetzt; es scheint ein guter Zeitpunkt zu sein, um die Parlamentarier zurückzuholen und eine fünfte Duma zu bilden. Hoffentlich muss diese nicht wie die vorherigen aufgelöst werden..."
 RUS_ww1_legitimate_power:0 "Legitimierte Macht in der Führung"
 RUS_ww1_legitimate_power_desc:0 "Offenbar ist es in den Augen des Volkes nicht mehr ausreichend, die weltliche Macht von Gott zu erhalten. Wir müssen an unserer Kommunikation arbeiten, um neue Wege zu finden, die kaiserliche Macht zu legitimieren."
 RUS_ww1_adopt_marxist_ideas:0 "Marxistische Ideen übernehmen"
 RUS_ww1_adopt_marxist_ideas_desc:0 "Die Arbeiten von Marx und Engels haben gezeigt, wie die zunehmende Industrialisierung der Industrieländer, die das ganze letzte Jahrhundert über geherrscht hat, in Wirklichkeit nur einer privilegierten bürgerlichen Klasse zugute kam und im Gegenzug die Arbeiter und Bauern erheblich verarmt hat, ohne dass die adligen Klassen in irgendeiner Weise davon profitiert hätten. Dieses kapitalistische System muss wie ein tollwütiger Hund mundtot gemacht werden! Wir müssen in unser politisches Programm Elemente aufnehmen, die die Ideen von Marx aufgreifen."
 RUS_ww1_legitimate_bolsheviks:0 "Konsolidierung der Macht der Bolschewiki"
 RUS_ww1_legitimate_bolsheviks_desc:0 "Der Sturz der provisorischen Regierung war ein erster Schritt, aber diese gewaltsam erlangte Macht muss gefestigt werden, um nicht erneut gestürzt zu werden. Es müssen eine Reihe von Dekreten und Reformen veröffentlicht werden, um die Forderungen des Volkes zu erfüllen, und es muss so schnell wie möglich eine Regierung sowie eine Kommission gebildet werden, die die neue sozialistische Republik gründen soll."
 RUS_ww1_disarm_the_cossacks:0 "Entwaffnung der Kosaken"
 RUS_ww1_disarm_the_cossacks_desc:0 "Die Kosaken sind zu mächtig. Wir können sie nicht mehr machen lassen, was sie wollen, wir müssen sie entwaffnen, bevor sie zum x-ten Mal einen Staatsstreich durchführen."
 RUS_ww1_right_of_the_people:0 "Erklärung der Rechte der Völker"
 RUS_ww1_right_of_the_people_desc:0 ""
 RUS_export_the_revolution:0 "Die Revolution exportieren"
 RUS_export_the_revolution_desc:0 "Das ist der Leitspruch der Kommunisten, ein Motto, das den Geist der Einheit und Solidarität, der klassenbewusste Menschen bewegt, auf den Punkt bringt: Proletarier aller Länder, vereinigt euch! Also werden wir dieses Prinzip wörtlich nehmen und damit beginnen, die Revolution zu exportieren, indem wir unsere besten Redner und politischen Agitatoren ins Ausland schicken. Die soziale Revolution wird global sein oder sie wird nicht sein!"
 RUS_ww1_sovereignist_ethos:0 "Souveränistisches Ethos"
 RUS_ww1_sovereignist_ethos_desc:0 "Gibt es etwas Wichtigeres als die Souveränität unserer Nation? Wir sind kein Dominion, keine Kolonie und kein unbedeutender Akteur, sondern ein großes, eigenständiges Land. Es ist an der Zeit, dies auf der diplomatischen Bühne erneut zu bekräftigen."
 RUS_ww1_support_kaiser:0 "Stärkung der kaiserlichen Autorität"
 RUS_ww1_support_kaiser_desc:0 "Kaiser Wilhelm II. ist ein Mann mit gesundem Menschenverstand, der einen starken und verantwortungsbewussten deutschen Staat aufgebaut hat. Wer weiß, was passieren wird, wenn er von der Macht verdrängt wird? Wir müssen dem deutschen Herrscher unsere Unterstützung zukommen lassen."
 RUS_ww1_contest_kaiser:0 "Kaiserliche Autorität anfechten"
 RUS_ww1_contest_kaiser_desc:0 "Kaiser Wilhelm II. ist alt, ja sogar senil! Seine Entscheidungen werden immer erratischer, und er hat eine ganze Clique von Operettengenerälen mit sich gezogen, die nach Macht und Eroberung gieren. Sie werden nicht aufhören, Kriege führen zu wollen. Es muss eine Reihe von innenpolitischen Maßnahmen eingeleitet werden, um seine Autorität zu untergraben."
 RUS_ww1_internationalism_focus:0 "Schwerpunkt Internationalismus"
 RUS_ww1_internationalism_focus_desc:0 "Die Kommunistische Revolution kann nicht aufgehalten werden. Es ist gut, dass unser Volk sie umarmt, und zwar sofort und nicht durch einen Bürgerkrieg. Wenn wir anfangen, unsere Unterstützung für die internationalistische kommunistische Bewegung zu zeigen, werden wir rot wie Menschenblut sein!"
 RUS_ww1_militarism:0 "Militarismus"
 RUS_ww1_militarism_desc:0 "Unsere Armee wird immer mehr zu einem Teil des täglichen Lebens unserer Nation. Glücklicherweise begünstigt die Unterstützung der Bevölkerung unsere Truppen derzeit, da sie sie als die Helden sehen, die sie sind, die unter unserem Banner kämpfen. Diese Militärkultur, die wir etablieren werden, wird der Sache unserer Streitkräfte dienen."
 RUS_ww1_indoctrination_focus:0 "Indoktrination"
 RUS_ww1_indoctrination_focus_desc:0 "Nach jahrelangen Debatten darüber, wie wir die Unterstützung der Bürger für unser wunderbares neues Regime gewinnen können, haben einige Mitglieder des Arbeiterrats die Einrichtung eines neuen „Ministeriums der Liebe“ vorgeschlagen, das die Menschen offiziell davon überzeugen soll, unsere Regierung zu unterstützen. Wir werden hier nicht darüber sprechen, was in diesem Ministerium inoffiziell geschehen wird..."
 RUS_ww1_political_commissars:0 "Politische Kommissare"
 RUS_ww1_political_commissars_desc:0 "Das Militär ist paradoxerweise ein Ort, an dem anti-nationale Stimmungen gedeihen. Wenn wir dafür sorgen, dass unsere Regierung ihre Augen überall hat, können wir diese Agitprop-Gruppen aufspüren und sie am Wachsen hindern."
 RUS_ww1_paramilitarism:0 "Paramilitarismus"
 RUS_ww1_paramilitarism_desc:0 "Einige Länder sind so dumm, bewaffnete Milizen aus Angst vor Rebellionen zu verurteilen. Wenn wir jedoch vorsichtig genug sind, diese auf Regimetreue zu beschränken, können wir eine weitere Gruppe wütender und bewaffneter Männer schaffen, die unsere Nation unterstützen können. Dies wird uns im Falle eines Krieges von Nutzen sein."
 RUS_ww1_political_correctness:0 "Politische Korrektheit"
 RUS_ww1_political_correctness_desc:0 "Bestimmen wir Intellektuelle, die der Macht nahe stehen, um die Nachrichtenagenturen genau zu überwachen ... und sicherzustellen, dass jeder Text nicht subversiv ist."
 RUS_ww1_military_youth:0 "Militärische Jugend"
 RUS_ww1_military_youth_desc:0 "Unsere militaristische Kultur muss auch bei unseren Kindern präsent sein! Indem wir den Respekt vor dem Militär erzwingen und der jungen Generation eine Ausbildung bieten, können wir sicher sein, dass sie heranwachsen und sich einschreiben, um unserem glorreichen Regime zu dienen. Manche mögen dies als Ausbeutung bezeichnen ... aber es klingt besser, wenn man sagt, dass wir den Heranwachsenden eine glänzende Zukunft ermöglichen."
 RUS_ww1_student_movement_focus:0 "Studentenbewegung"
 RUS_ww1_student_movement_focus_desc:0 "Die Universitäten und Studentenligen sind voll von jungen, blutrünstigen Menschen, die darauf aus sind, sich zu prügeln oder neue politische Ideen zu verbreiten. Es wird nicht schwer sein, Agenten in den richtigen Netzwerken zu platzieren, um all diese Energie in die richtige Richtung zu lenken!"
 RUS_ww1_monarchy:0 "Schwerpunkt Autoritarismus"
 RUS_ww1_monarchy_desc:0 "Die Macht, die vom Parlament und vom Volk ausgeübt wird, kann gefährlich sein. Der einzige wirkliche Weg, die Kontrolle über die Nation zu behalten, insbesondere in solch schwierigen Zeiten, wäre, eine allgemein feste Position einzunehmen und unser Land so zu führen, wie es sein sollte."
 RUS_ww1_democracy:0 "Schwerpunkt Demokratie"
 RUS_ww1_democracy_desc:0 "Es wird gesagt, dass jeder Herrscher seine Macht vom Volk ableitet. Wenn wir einen Schritt in Richtung einer demokratischeren Gesellschaft machen, auch wenn wir es nicht wirklich werden, können wir zumindest eine bessere Position erreichen, um mit demokratischen Nationen auf der ganzen Welt verhandeln zu können."
 RUS_ww1_centralizedpower:0 "Bürokratie"
 RUS_ww1_centralizedpower_desc:0 "Indem wir die Zahl der Staatsbeamten verdoppeln, stärken wir unsere Kontroll- und Regulierungsmöglichkeiten über unsere gesamte Regierung und stellen sicher, dass uns nichts entgeht. Die Anstrengungen der Nation werden viel besser genutzt. Außerdem wird es die nationale Papierindustrie in Schwung bringen..."
 RUS_ww1_freespeech:0 "Freie Rede"
 RUS_ww1_freespeech_desc:0 "Die Zeiten ändern sich und wir müssen zeigen, dass wir keine Angst vor Widerspruch haben. Wir müssen das Dekret unterzeichnen, das das Erscheinen von Gazetten erlaubt, die nicht systematisch vom kaiserlichen Zensurausschuss genehmigt werden."
 RUS_ww1_reorganization_act:0 "Umstrukturierungsgesetz"
 RUS_ww1_reorganization_act_desc:0 "Der militärisch-industrielle Apparat leidet unter seiner Überalterung und der Zersplitterung seiner Anstrengungen. Unser Wirtschaftsminister hat einen ehrgeizigen Plan zur Reorganisation unserer Produktionskapazitäten vorgeschlagen."
 RUS_ww1_leave_central_power:0 "Mittelmächte verlassen"
 RUS_ww1_leave_central_power_desc:0 "Was hat uns dazu bewogen, dieser Tripel-Allianz beizutreten? Es ist offensichtlich, dass sie überhaupt nicht in unserem Sinne ist und sogar unsere Interessen an unserer Westgrenze bedroht. Es waren die Franzosen und die Engländer, mit denen wir uns hätten verbünden sollen. Verlassen wir den Deutsch-Österreichischen Bund sofort."
 RUS_ww1_limited_rearmament:0 "Begrenzte Wiederaufrüstung"
 RUS_ww1_limited_rearmament_desc:0 "Unsere Armee angemessen mit militärischen Gütern zu versorgen, erfordert große Investitionen und Requisitionen. Natürlich können sich Zivilisten bei einer begrenzten Rationierung immer noch amüsieren - wahrscheinlich auf Kosten des Militärs."
 RUS_ww1_full_rearmament:0 "Volle Wiederbewaffnung"
 RUS_ww1_full_rearmament_desc:0 "Wer kann in die Zukunft blicken und sagen, dass die Kriege aufhören werden? Wir müssen dafür sorgen, dass unsere Streitkräfte den vor ihnen liegenden Aufgaben gewachsen bleiben."
 RUS_ww1_unitedpeople:0 "Das Reich vereinigen"
 RUS_ww1_unitedpeople_desc:0 "Von den Ufern der Ostsee bis zu den Stränden des Pazifiks vereint das Russische Reich Dutzende von Völkern mit unterschiedlichen Ursprüngen und Bestrebungen. Wir müssen dieses riesige Gebiet besser vereinen, indem wir seine Bevölkerung unter einem einzigen Banner vereinen."
 RUS_ww1_massive_effort:0 "Massive Anstrengung"
 RUS_ww1_massive_effort_desc:0 "Jeder Mann und jede Frau muss den nationalen Bemühungen helfen! Da das Gespenst des Großen Krieges jeden Tag ein wenig näher rückte, wurde ein großes Wirtschaftsprogramm in Angriff genommen, um unsere industrielle Kapazität zu entwickeln und uns zu helfen, unsere verhassten Rivalen zu überwinden!"
 RUS_ww1_fortify_city:0 "Zivile Befestigungen"
 RUS_ww1_fortify_city_desc:0 "Der Wind des Krieges kann sich unangenehm schnell drehen, und die Front entwickelt sich noch schneller. Es wäre hilfreich, Gruppen von arbeitslosen Bürgern zu mobilisieren, damit sie an bestimmten Stellen Verteidigungsanlagen errichten, und das würde den Pioniertruppen Zeit sparen."
 RUS_ww1_fortify_coast:0 "Küstenverteidigung"
 RUS_ww1_fortify_coast_desc:0 "Eine Küste ist nicht leicht zu verteidigen. Da es Schiffe gibt, die praktisch überall an unseren Küsten Truppen anlanden können, sind Küstenforts nicht zu unterschätzen, wenn es darum geht, unsere Feinde ins Meer zurückzuwerfen."
 RUS_ww1_install_communism:0 "Proletarische Revolution"
 RUS_ww1_install_communism_desc:0 "Die Arbeiter sind der Motor des sozialen und industriellen Wandels! Die Zeit ist gekommen, dass die Ausgebeuteten, die Unterdrückten, die Ausgestoßenen, diejenigen, die nur die Kraft ihrer Hände und Arme für sich haben, dass diese ihre Zukunft selbst in die Hand nehmen! Wir müssen die proletarische Revolution in unserem eigenen Land organisieren, und zwar in großem Maßstab!"
 RUS_ww1_install_democracy:0 "Freie Wahlen"
 RUS_ww1_install_democracy_desc:0 "Die Macht geht immer vom Volk aus. Die Abhaltung freier Wahlen wird zumindest die Illusion einer direkten Demokratie und einer guten Repräsentativität der Bürger schaffen und unserer Regierung die Legitimität verleihen, die ihr bisher fehlte."
 RUS_ww1_oppression_minorities:0 "Minderheiten unterdrücken"
 RUS_ww1_oppression_minorities_desc:0 "Es ist eine altbekannte Technik, die immer wieder funktioniert... Einen Sündenbock zu benennen, lenkt die Aufmerksamkeit von den wütenden Elementen ab. Man muss nur eine gute, virulente Pressekampagne finanzieren..."
 RUS_ww1_make_concessions:0 "Zugeständnisse machen"
 RUS_ww1_make_concessions_desc:0 "Ein Nachgeben gegenüber bestimmten Forderungen wäre keine große politische oder finanzielle Anstrengung ... und würde stattdessen ein positiveres Bild der Regierung vermitteln."
 #--------------------------------------------------------------
 # [RUSSISCHES REICH] Diplomatische Bemühungen
 #=========================================================================
 RUS_ww1_diplomatic_effort:0 "Diplomatische Bemühungen"
  RUS_ww1_diplomatic_effort_desc:0 "Wir müssen unser diplomatisches Korps finanziell und personell besser ausstatten, um in unseren Außenbeziehungen effektiv zu sein."
 RUS_ww1_assert_position_east:0 "Position im Osten behaupten"
 RUS_ww1_assert_position_east_desc:0 "Allzu oft neigen wir dazu, die sibirischen Gebiete für einen fernen Osten zu halten, der vom russischen Reich losgelöst ist, in dem keine Gesetze gelten und unsere Absichten unklar sind. Es ist an der Zeit, dass sich dies ändert und wir unsere Politik an den Ufern des Pazifiks neu definieren."
 RUS_ww1_BalkansPolitics:0 "Balkan Politik"
 RUS_ww1_BalkansPolitics_desc:0 "Der Balkan ist eine Region, die nun schon seit Jahrzehnten unsere Aufmerksamkeit auf sich zieht, da wir dort eine große Anzahl slawischer Völker finden, die unsere Interessen und unsere Kultur teilen, und es ist auch eine hochgradig strategische Region, von der aus jeder Konflikt ausbrechen kann, ganz zu schweigen von der Präsenz der Türken, die uns den Zugang zum Mittelmeer verwehren. Wir sollten unsere Außenpolitik darauf ausrichten, unsere Bemühungen in diesem Gebiet fortzusetzen."
 RUS_ww1_ApeasementBalkans:0 "Beschwichtigungspolitik auf dem Balkan"
 RUS_ww1_ApeasementBalkans_desc:0 "Auf dem Balkan sind schon viele Kriege ausgebrochen, und nur sehr wenig Nutzen ist daraus gezogen worden. Wenn Kanonen ein Ziel nicht erreichen, ist die Wahrscheinlichkeit groß, dass ein gutes diplomatisches Bankett mehr Erfolg verspricht - und das für viel weniger Geld. Es ist an der Zeit, dass wir uns versöhnlich zeigen."
 RUS_ww1_rom:0 "Annäherung an Rumänien"
 RUS_ww1_rom_desc:0 "Die Rumänen haben sich in den letzten Jahren weitgehend bewährt und friedliche Absichten gegenüber uns gezeigt. Wir sollten ihnen eine Delegation schicken und eine Freundschaftserklärung unterzeichnen."
 RUS_ww1_oirganization_realm:0 "Das Reich organisieren"
 RUS_ww1_oirganization_realm_desc:0 "Unser Reich ist konservativ, aber wir können das imperiale Regime beibehalten und trotzdem effizient sein. Wenn wir die richtigen Schritte unternehmen, um unsere interne Organisation zu vereinfachen, wird unser ziviles und wirtschaftliches Leben davon profitieren."
 RUS_ww1_fortify_russian_borders:0 "Russische Grenzen befestigen"
 RUS_ww1_fortify_russian_borders_desc:0 "Es ist undenkbar, die gesamten Grenzen Russlands zu befestigen, wenn man die absurde Anzahl an Kilometern bedenkt, die es abzudecken gilt. Aber dennoch können wir bereits mit dem Bau einer Handvoll Festungen beginnen, die an den richtigen Stellen platziert werden, um große Teile des Landes zu überwachen."
 RUS_ww1_airport_russian_borders:0 "Bau von Flughäfen in der Nähe der russischen Grenzen"
 RUS_ww1_airport_russian_borders_desc:0 "Es muss in den Bau von Flugplätzen in der Nähe unserer Grenzen investiert werden. Dies wird nicht nur für den zivilen Verkehr nützlich sein, sondern im Kriegsfall werden unsere Staffeln bereits fertige Flugplätze haben."
 RUS_ww1_fortify_italian_borders:0 "Italienische Grenzen befestigen"
 RUS_ww1_fortify_italian_borders_desc:0 "Die Grenzen des Königreichs Italien müssen verstärkt werden, denn derzeit ist es ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_fortify_bosnia_borders:0 "Balkan-Grenzen verstärken"
 RUS_ww1_fortify_bosnia_borders_desc:0 "Die Grenzen des Balkans müssen verstärkt werden, denn derzeit ist er ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_fortify_coast_dalmatia:0 "Dalmatinische Küsten befestigen"
 RUS_ww1_fortify_coast_dalmatia_desc:0 "Die Küsten Dalmatiens müssen verstärkt werden, denn derzeit ist es ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_ready_country:0 "Rekrutierungs-Propaganda"
 RUS_ww1_ready_country_desc:0 "Der Armee fehlt es an Gewehren, Lastwagen und Uniformen, vor allem aber an Rekruten. Der Militärdienst ist für junge Russen nicht mehr interessant, daher müssen wir einen Aufruf an Freiwillige starten und Propagandabilder veröffentlichen, die sie dazu auffordern, ihre Pflicht für das Vaterland zu tun."
 RUS_ww1_military_harmonization:0 "Harmonisierung des Militärs"
 RUS_ww1_military_harmonization_desc:0 "Einer der Gründe für die chronische Ineffizienz unserer Streitkräfte sind die zu großen Unterschiede in den Mitteln und Zielen der verschiedenen Armeen. Wenn wir das ändern wollen, müssen wir unsere militärischen Ziele neu und klar definieren und dafür sorgen, dass die Flotte, die Armee und auch die Flieger ihre Anstrengungen in diese Richtung lenken. Und schließlich müssen wir erhebliche Mittel investieren, um ihre Entwicklung zu unterstützen."
 RUS_ww1_balkans_policy:0 "Balkan Politik"
 RUS_ww1_balkans_policy_desc:0 "Der Balkan ist eine Region, die nun schon seit Jahrzehnten unsere Aufmerksamkeit auf sich zieht, da wir dort eine große Anzahl slawischer Völker finden, die unsere Interessen und unsere Kultur teilen, und es ist auch eine hochgradig strategische Region, von der aus jeder Konflikt ausbrechen kann, ganz zu schweigen von der Präsenz der Türken, die uns den Zugang zum Mittelmeer verwehren. Wir sollten unsere Außenpolitik darauf ausrichten, unsere Bemühungen in diesem Gebiet fortzusetzen."
 RUS_ww1_balkans_policy_intervene:0 "Erster Balkankrieg - Reaktion"
 RUS_ww1_balkans_policy_intervene_desc:0 "Der Balkan geht wieder in Flammen auf, und die Serben geraten mit den Griechen und Bulgaren aneinander! Wir unterstützen ihre Forderungen, und es ist an der Zeit, dies offen zu bekräftigen, vor allem gegenüber den Osmanen, die bereits ihre Waffen strecken, um die Situation auszunutzen."
 RUS_ww1_pro_fra:0 "Die Russisch-Französische Allianz feiern"
 RUS_ww1_pro_fra_desc:0 "Die seit langem bestehenden Bande der Freundschaft zwischen Russland und Frankreich sind stark, und unsere wirtschaftlichen und militärischen Interessen treffen aufeinander. Lassen Sie uns dieses Bündnis feiern, um den Österreichern und den Deutschen zu zeigen, dass wir im Falle eines Krieges als ein Mann gegen sie kämpfen werden."
 RUS_ww1_friend_with_auh:0 "Zweite Russisch-Österreichische Vereinbarung"
 RUS_ww1_friend_with_auh_desc:0 "Es hat Zeit und Geld gekostet, aber wir haben endlich eine neue Vereinbarung ausgearbeitet, die die Differenzen zwischen uns und den Österreichern für eine Weile aus der Welt schaffen wird. Wenn wir es jetzt unterzeichnen, sollte es die Wogen zwischen uns für eine Weile glätten."
 RUS_ww1_support_serbia_weapons:0 "Serbien unterstützen"
 RUS_ww1_support_serbia_weapons_desc:0 "Die Serben kämpfen eifrig, aber es fehlt ihnen an Waffen und Munition. Wir müssen ihnen einige Ladungen davon schicken, sonst werden sie in einigen Monaten der Zermürbung zum Opfer fallen."
 RUS_ww1_RussoTurkishBorder:0 "Stärkung der Russisch-Türkischen Grenze"
 RUS_ww1_RussoTurkishBorder_desc:0 "Wir haben die letzten Konflikte mit den Türken nicht vergessen, und trotz der vergangenen Jahre wurde nichts geregelt. Denken Sie daran, dass ihre Grenzen in beide Richtungen durchlässig sind und dass die Grenze zu den Türken durch die Stationierung von mehr Armeeeinheiten verstärkt werden muss. "
 RUS_ww1_AzerbaijanisRights:0 "Aserbaidschanisches Volk anerkennen"
 RUS_ww1_AzerbaijanisRights_desc:0 "Wir haben bereits versucht, Aserbaidschan einzunehmen, jedoch ohne Erfolg. Seitdem hat sich das Land jedoch entwickelt und verwestlicht; wir sollten ihre Unabhängigkeit und Freiheit anerkennen, um sie zu einem Verbündeten an unserer Südgrenze zu machen."
 RUS_ww1_CaucasusFocus:0 "Schwerpunkt Kaukasus"
 RUS_ww1_CaucasusFocus_desc:0 "Die jüngsten Prospektionskampagnen im Kaukasus zeigen, dass die Region im Laufe der Zeit immer interessanter werden wird, da sie nicht nur reich an fruchtbarem Ackerland, sondern auch an Ölquellen ist. Die Region sollte für unsere Investitionen und zivile Arbeit Priorität haben."
 RUS_ww1_BakuInvest:0 "Investieren in Baku"
 RUS_ww1_BakuInvest_desc:0 "Baku ist voller Öl, wir müssen die Region schnell entwickeln, denn unser Bedarf an dem schwarzen Gold wächst."
 RUS_ww1_restore_russia_glory:0 "Russlands früheren Ruhm wiederherstellen"
 RUS_ww1_restore_russia_glory_desc:0 "Es gab eine Zeit, in der die Legionen des Zaren auf beiden Seiten Eurasiens gefürchtet wurden, eine Zeit, in der Russland ein Titan war, den man nicht ignorieren konnte! Es ist an der Zeit, eine Politik der vollen Macht zu verfolgen und unsere Nation fürchten zu lassen. Wir werden den Thron von Sankt Petersburg mit Ruhm bedecken!"
 RUS_ww1_avenge_fall_constantinople:0 "1453 rächen"
 RUS_ww1_avenge_fall_constantinople_desc:0 "Der Fall von Konstantinopel war die Einnahme der Hauptstadt des Byzantinischen Reiches durch eine Invasionsarmee des Osmanischen Reiches am 29. Mai 1453. Die Osmanen standen unter dem Kommando von Mehmed dem Eroberer, dem siebten Sultan des Osmanischen Reiches, der ein Heer unter dem Kommando des byzantinischen Kaisers Konstantin XI Palaiologos besiegte."
 RUS_wilhlems_deal:0 "Abkommen mit Wilhlem II."
 RUS_wilhlems_deal_desc:0 "Die Deutschen sind uns definitiv feindlich gesinnt, aber der Kaiser ist trotzdem nicht verrückt. Es wird nichts kosten, sich die Vorschläge der deutschen Bevollmächtigten anzuhören."
 RUS_ww1_invest_west:0 "Im Westen investieren"
 RUS_ww1_invest_west_desc:0 "Die Menschen im Westen lassen sich leichter umwerben, wenn wir einige Murmeln bei ihnen anlegen. Wenn wir Kapital in ihre Fabriken investieren, ist das eine gute Geldanlage, und wir machen ihnen ein diplomatisches Geschenk."
 RUS_around_manchuria:0 "Investieren in der Äußeren Mandschurei"
 RUS_around_manchuria_desc:0 "Unsere Infrastruktur an der Grenze zu Korea muss verstärkt werden. Wenn die Japaner wieder einen Krieg wollen, müssen wir bereit sein."
 RUS_ww1_friend_with_romania:0 "Beziehungen zu Rumänien verbessern"
 RUS_ww1_friend_with_romania_desc:0 "Es ist an der Zeit, den Rumänen näher zu kommen. Wenn wir ihre Ambitionen in Siebenbürgen nicht in Frage stellen, könnten wir sie dazu bringen, ihre Positionen zu überdenken."
 RUS_ww1_EmbargoUK:0 "Sanktionen - Vereinigtes Königreich"
 RUS_ww1_EmbargoUK_desc:0 "Diese Briten sind wirklich ärgerlich, und ihre systematische Einmischung in die Weltangelegenheiten ist nicht mehr tolerierbar. Wir haben hier eine Gelegenheit, ihnen auf der diplomatischen Bühne die Nase zu putzen."
 RUS_ww1_JoinCentralPowers:0 "Messer im Rücken"
 RUS_ww1_JoinCentralPowers_desc:0 "Dies wird wahrscheinlich als der größte geopolitische Verrat dieses Jahrhunderts angesehen werden, aber man muss auch pragmatisch sein. Die Mittelmächte sind die einzigen Mächte, die kurz- und mittelfristig für uns von Interesse sind."
 RUS_ww1_reinforce_western_forts:0 "Verstärkung der Westgrenze"
 RUS_ww1_reinforce_western_forts_desc:0 "Die größte Bedrohung geht vom Westen aus. An dieser Grenze des Reiches müssen wir die meisten Divisionen konzentrieren."
 RUS_ww1_defy_germany:0 "Deutschland trotzen"
 RUS_ww1_defy_germany_desc:0 "Deutschland ist eine junge Nation, ein diplomatischer unbeschriebenes Blatt, das ihren mächtigsten Nachbarn nicht unterschätzen sollte! Es ist an der Zeit, sie mit ihren Ambitionen herauszufordern: Entweder sie knicken vor uns ein oder sie nehmen sie an - und wir werden Krieg gegen sie führen!"
 RUS_annex_northern_persia:0 "Nordpersien besetzen"
 RUS_annex_northern_persia_desc:0 ""
 RUS_ww1_Attack_Afghanistan:0 "Invasion in Afghanistan vorbereiten"
 RUS_ww1_Attack_Afghanistan_desc:0 "Eurasien ist der weiche Unterleib des Imperiums. Wir müssen uns sofort auf eine Invasion dieses kleinen Landes vorbereiten, um unsere Interessen dort zu schützen ... und eine Invasion unseres Staatsgebiets zu verhindern."
 RUS_russify_finland:0 "Finnland russifizieren"
 RUS_russify_finland_desc:0 "Wenn wir wollen, dass die Finnen unsere Autorität nicht mehr in Frage stellen, müssen wir sie an die russische Kultur assimilieren. Kurzfristig könnte dies zu Spannungen führen, aber langfristig könnte Finnland eine russische Region wie jede andere werden."
 RUS_ww1_leave_entente:0 "Entente verlassen"
 RUS_ww1_leave_entente_desc:0 "Die Franko-Briten sind in Wahrheit nicht zuverlässiger als die Österreich-Deutschen, und es gibt keine Garantie dafür, dass sie sich um unsere Interessen kümmern werden. Wir sollten die Entente verlassen; wenn es ihnen so wichtig ist, sich mit ihren unmittelbaren Nachbarn zu zerfleischen, dann sei es ihnen gegönnt."
 RUS_guarantee_serbia:0 "Serbien garantieren"
 RUS_guarantee_serbia_desc:0 "Die Serben müssen vor dem Appetit der Italiener, Österreicher oder sonst wem geschützt werden. Dieses Land kann uns nicht entgleiten, also müssen wir ihre Unabhängigkeit garantieren. Daher sollte jeder, der versucht, dieses kleine Land zu erobern, auf der Hut sein."
 RUS_ww1_add_fuel_to_the_fire:0 "Das Pulverfass zünden"
 RUS_ww1_add_fuel_to_the_fire_desc:0 ""
 RUS_ww1_support_serbia:0 "Orthodoxe Bruderschaft"
 RUS_ww1_support_serbia_desc:0 "Wenn wir eine Gemeinsamkeit mit den Serben haben, dann ist es die Religion! Unsere orthodoxen Brüder müssen unter unsere Schirmherrschaft gestellt werden. Schlagen wir ihnen vor, sich uns in einer Bruderschaft anzuschließen."
 RUS_fight_sweden_gotland:0 "Gotland beanspruchen"
 RUS_fight_sweden_gotland_desc:0 "Die Insel Götland ist nur ein Kieselstein inmitten der Gischt, aber ein Kieselstein, auf dem man Flugzeuge landen und Kanonen aufstellen könnte! Oder sogar einen Marinestützpunkt, der für jede anständige Kriegsflotte mehr als nützlich ist. Wir sollten einen offiziellen Anspruch auf diese Position erheben, damit sie uns nicht eines Tages direkt bedroht."
 RUS_european_focus:0 "Schwerpunkt Westen"
 RUS_european_focus_desc:0 "Unser Land ist das größte der Welt, aber in Europa liegen die meisten unserer Interessen und unsere wichtigsten Verbündeten. Dieser Region muss Priorität eingeräumt werden"
 RUS_ww1_scandinavia_focus:0 "Skandinavische Politik"
 RUS_ww1_scandinavia_focus_desc:0 "Die geografische Nähe zu Skandinavien macht diese Region für uns zu einer zentralen Herausforderung, ebenso wie die strategische und wirtschaftliche Konkurrenz, die dort um die Kontrolle über Eisen, Öl und Holz herrscht. Wir müssen uns diesen Ländern annähern, während wir gleichzeitig wichtige Abschreckungsmittel in dieser Region aufrechterhalten."
 RUS_asian_focus:0 "Russische Position in Asien stärken"
 RUS_asian_focus_desc:0 "Es wäre an der Zeit, die Asiaten und den Westen, der sich dafür interessiert, daran zu erinnern, dass Russland auch weiterhin eine Macht ist, die im Fernen Osten präsent ist. Diplomatisch und militärisch müssen wir unser Interesse an der Region verstärken und einige Machtdemonstrationen durchführen."
 RUS_ww1_Tungsten_Nerchinsk:0 "Suche nach Wolfram-Erz in der Nähe von Nerchinsk"
 RUS_ww1_Tungsten_Nerchinsk_desc:0 "Ein Memorandum des Irkutsker Instituts für Ingenieurwesen lässt uns wissen, dass in Transbaikalien, nahe der asiatischen Grenze, große Metallvorkommen entdeckt wurden. Einige Unternehmen könnten ihre Ausbeutung bereits jetzt übernehmen."
 RUS_ww1_Reinforce_Northern_Persia:0 "In Nordpersien investieren"
 RUS_ww1_Reinforce_Northern_Persia_desc:0 "Einige unserer führenden Industriellen schlagen vor, dass wir etwas Kapital in die persischen Gebiete im Süden investieren sollten. Es handelt sich um ein notorisch unterentwickeltes und archaisches Land, das jedoch über reiche Ländereien verfügt. Es wäre zweifellos eine gute Investition."
 RUS_ww1_Revoke_Persia_Convention:0 "Das Abkommen von 1907 widerrufen"
 RUS_ww1_Revoke_Persia_Convention_desc:0 "Das Englisch-Russische Abkommen von 1907 wurde am 31. August 1907 in Sankt Petersburg unterzeichnet. Die Konvention beendete den langen Streit um Persien. Das Vereinigte Königreich verpflichtete sich, sich aus Nordpersien herauszuhalten, und Russland erkannte Südpersien als Teil der britischen Einflusssphäre an."
 RUS_ww1_Support_Persia_Convention:0 "Das Abkommen von 1907 unterstützen"
 RUS_ww1_Support_Persia_Convention_desc:0 "Das Englisch-Russische Abkommen von 1907 wurde am 31. August 1907 in Sankt Petersburg unterzeichnet. Die Konvention beendete den langen Streit um Persien. Das Vereinigte Königreich verpflichtete sich, sich aus Nordpersien herauszuhalten, und Russland erkannte Südpersien als Teil der britischen Einflusssphäre an."
 RUS_ww1_Persian_Cossack_Brigade:0 "Verstärkung der persischen Kosakenbrigade"
 RUS_ww1_Persian_Cossack_Brigade_desc:0 "Die Persische Kosakenbrigade war eine Kavallerieeinheit im Kosakenstil, die 1879 in Persien gebildet wurde. Sie war den kaukasischen Kosakenregimentern der Russischen Kaiserlichen Armee nachempfunden und ist heute eine Eliteeinheit. Wir sollten diese Truppe mobilisieren, um sie zu einer Polizeieinheit zu machen."
 RUS_ww1_Russian_Influence_over_Persia:0 "Grenzüberschreitendes Abkommen mit Teheran"
 RUS_ww1_Russian_Influence_over_Persia_desc:0 "Wir haben ein Abkommen mit dem Schah von Persien vorbereitet. Es geht um territoriale, wirtschaftliche und finanzielle Fragen und ermöglicht es uns, die von uns gewünschten Personen in Schlüsselpositionen zu platzieren, um unseren Einfluss in ganz Persien geltend zu machen. Wir werden sie leicht manipulieren können."
 RUS_ww1_Puppet_Persia:0 "Nordpersien besetzen"
 RUS_ww1_Puppet_Persia_desc:0 "Nordpersien versinkt in Anarchie, und es gibt nur einen guten Grund, das Land zu besetzen. Na ja, nur die nördliche Region ... und was soll's, wenn wir es nicht tun, werden es schließlich die Briten sein, die sich darum kümmern!"
 RUS_ww1_Militarize_NorthenPersia:0 "Nordpersien militarisieren"
 RUS_ww1_Militarize_NorthenPersia_desc:0 "Persien wird weiter geschwächt; daher haben sie keine Chance, sich uns entgegenzustellen, wenn wir Militäreinheiten dorthin schicken, um die dort befindlichen russischen Interessen zu schützen."
 RUS_ww1_treaty_portsmouth:0 "Vertrag von Portsmouth widerrufen"
 RUS_ww1_treaty_portsmouth_desc:0 "Der Vertrag, den wir 1905 unterzeichnet hatten, war eine echte Demütigung, die wir gegenüber den japanischen Schurken erleiden mussten. Es kam nicht in Frage, weiterhin Kriegsentschädigungen zu zahlen und ihnen die Mandschurei so einfach abzutreten."
 RUS_annex_manchurian_sphere:0 "Mandschurei besetzen"
 RUS_annex_manchurian_sphere_desc:0 "Die Mandschurei ist das Pulverfass Asiens und ein Land, bei dem wir es uns nicht leisten können, es nicht mehr zu kontrollieren. Wir müssen Truppen dorthin zurückschicken, und sei es nur, um den Japanern den Weg zu versperren und notfalls schnell in China investieren zu können. Mehrere unserer Divisionen sind bereits abmarschbereit."
 RUS_ww1_friend_with_jap:0 "Verbündete aus Bequemlichkeit"
 RUS_ww1_friend_with_jap_desc:0 "Wer hätte gedacht, dass wir uns eines Tages den Japanern annähern würden? Die Zufälle der Geopolitik nehmen manchmal einen sehr seltsamen Weg. Wie auch immer, es ist nun so, dass ihre und unsere Ziele übereinstimmen und wir alle von einer Zusammenarbeit profitieren können. Vielleicht können wir am Ende sogar das Kriegsbeil endgültig begraben."
 RUS_reinforce_vladivostok:0 "Wladiwostok verstärken"
 RUS_reinforce_vladivostok_desc:0 "Wenn die Japaner uns erneut angreifen, muss Wladiwostok uneinnehmbar sein. Der Hafen muss mit zwei neuen Festungen verstärkt, Küstenbatterien gebaut und Lagerhäuser ausgehoben werden."
 RUS_mongolian_protectorate:0 "Mongolisches Protektorat"
 RUS_mongolian_protectorate_desc:0 "Die Mongolen sind schwach und bereit zu fallen. Wir haben kein besonderes Interesse daran, sie zu annektieren, aber es wäre eine Katastrophe, wenn sie selbst von unseren Rivalen im Süden annektiert würden. Wir könnten das Problem also lösen, indem wir ihnen ein Protektorat anbieten."
 RUS_ww1_Xinhai_Revolution_Opportunity:0 "Xinhai Revolution Chance"
 RUS_ww1_Xinhai_Revolution_Opportunity_desc:0 "Die Revolution, die gerade in China begonnen hat, bringt die Macht des Kaisers ins Wanken! Die Aufstände in Wuchang sind bereits blutig. Die Einmischung des Westens hat einer Gesellschaft, die durch Immobilität, Korruption und politische Unruhe bereits bis auf die Grundmauern untergraben war, nur den letzten Anstoß gegeben. Wir müssen uns mit dem Thema beschäftigen und die sich bietenden Gelegenheiten jetzt nutzen, denn unsere Rivalen werden nicht warten."
 RUS_ww1_polish_corps:0 "Polnisches Korps in Russland"
 RUS_ww1_polish_corps_desc:0 "Viele Polen leben in Russland, und viele Polen wollen gegen die Deutschen kämpfen, auch wenn sie kein eigenes Land haben! Wir brauchen immer noch Männer: Stellen wir eine rein polnische Legion zusammen, die aus Freiwilligen und Offizieren aus dieser Gemeinschaft besteht. Sie werden mit noch mehr Kraft und Zusammenhalt kämpfen."
 kis_brestlitovsk:0 "Vertrag von Brest-Litowsk"
 kis_tsarnicholasabdicated:0 "Zar dankt ab"
