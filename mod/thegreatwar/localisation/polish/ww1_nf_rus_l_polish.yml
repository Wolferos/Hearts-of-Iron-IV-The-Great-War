 RUS_ww1_Revoke_Persia_Convention: "Unieważnienie konwencji z 1907 r."
 RUS_ww1_Revoke_Persia_Convention_desc: "Konwencja angielsko-rosyjska z 1907 roku została podpisana 31 sierpnia 1907 roku w Sankt Petersburgu. Konwencja ta kończyła długi spór o Persję. Wielka Brytania obiecała, że nie będzie zajmować północnej Persji, a Rosja uznała południową Persję za część brytyjskiej strefy wpływów."
 RUS_ww1_Support_Persia_Convention: "Poparcie konwencji z 1907 r."
 RUS_ww1_Support_Persia_Convention_desc: "Konwencja angielsko-rosyjska z 1907 roku została podpisana 31 sierpnia 1907 roku w Sankt Petersburgu. Konwencja ta kończyła długi spór o Persję. Wielka Brytania obiecała, że nie będzie zajmować północnej Persji, a Rosja uznała południową Persję za część brytyjskiej strefy wpływów."
