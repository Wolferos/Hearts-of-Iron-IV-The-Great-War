 # [Events]
 ww1_belgium.2.t: "Belgium proposes alliance"
 ww1_belgium.2.d: "Today we recieved message that Belgium wants to invite us in their alliance. They propose unite Benelux and create new strong alliance. What should we do?"
 ww1_belgium.2.a: "That is good proposal"
 ww1_belgium.2.b: "No"
 ww1_belgium.3.t: "Belgium demands subjugation"
 ww1_belgium.3.d: "Today Belgium sent us official demand of subjugation. They also said that they will use force if needed. What is our answer?"
 ww1_belgium.3.a: "We have no choice"
 ww1_belgium.3.b: "They may come only if they break our defence"
 ww1_belgium.4.t: "Belgium demands Eupen"
 ww1_belgium.4.d: "Eupen always was a Belgium territory. Now they demand their rightful lands. Belgium is not so strong, but should we start war for small piece of land?"
 ww1_belgium.4.a: "It is their historical land after all"
 ww1_belgium.4.b: "No, it is german territory"
 ww1_belgium.5.t: "Unite Benelux"
 ww1_belgium.5.d: "We think it's time for uniting Benelux. We will unite people of Benelux Region under our rule."
 ww1_belgium.5.a: "We will send demand to our neighbours"
 ww1_belgium.5.b: "We already control Benelux"