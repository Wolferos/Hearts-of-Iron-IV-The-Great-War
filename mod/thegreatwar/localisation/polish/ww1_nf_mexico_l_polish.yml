l_polish:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 MEX_ww1_army_effort: "Odnowienie armii meksykańskiej"
 MEX_ww1_army_effort_desc: "Niestabilność naszego kraju sprawiła, że nasza armia istnieje tylko teoretycznie. Musimy natychmiast przystąpić do jej odbudowy, jeśli chcemy jeszcze powalczyć."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 MEX_ww1_form_air_force: "Powołanie meksykańskich sił lotniczych"
 MEX_ww1_form_air_force_desc: "Biznesmeni z USA dali nam samolot, a mechanicy z Europy odpowiednie narzędzie, by na samolocie zamontować broń. To wspaniały początek naszego lotnictwa."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 MEX_ww1_naval_effort: "Odbudowa Floty Meksykańskiej"
 MEX_ww1_naval_effort_desc: "Nasza flota w porównaniu do jankeskiej to jest dramat. Jeśli chcemy być potęgą musimy ją rozbudować."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 mex_political_effort: "Reforma polityczna" 
 mex_political_effort_desc: "Nadszedł czas na reformę. Obecne czasy są niepewne, więc stary system sprawowania rządów powinien zostać wyrzucony na śmietnik historii. Ta reforma umocni nasze rządy, więc nie ma czasu do stracenia."
 mex_ww1_sovereignist_ethos: "Wsparcie dla demokracji Madero"
 mex_ww1_sovereignist_ethos_desc: "Francisco Madero żąda powrotu do demokracji oraz większej decentralizacji naszego państwa. To z pewnością osłabi nasz reżim, ale uchroni nasz naród przed wojną domową."
 mex_ww1_Support_the_democracy: "Wsparcie dla demokracji"
 mex_ww1_Support_the_democracy_desc: "Każdy władca musi mieć mandat od narodu, żeby rządzić. Jeśli bardziej zdemokratyzujemy nasz kraj to dołączymy do prestiżowego klubu państw demokratycznych."
 mex_ww1_centralizedpower: "Program pracy"
 mex_ww1_centralizedpower_desc: "W czasach wojny i pokoju potrzebujemy siły roboczej. Jeśli nakażemy pracować bezdomnym za mała stawkę to zwiększymy wydajność naszego przemysłu."
 mex_ww1_freespeech: "Wolność słowa"
 mex_ww1_freespeech_desc: "Jeśli zagwarantujemy naszym obywatelom wolność słowa i prawo do demonstracji, to upewnimy się, że ich złość będzie wyrażona w bardziej kreatywny sposób. Jednak jeśli ktoś podpali teatr z widownią w środku lub znieważy matkę naszego przywódcy to nadal wyląduje w pierdlu."
 mex_ww1_reorganization_act: "Akt reorganizacji"
 mex_ww1_reorganization_act_desc: "Much of our territory has been under the possession of various groups and individuals since civilization came to our humble nation. Over hundreds of years, however, much of this territory has been inefficiently laid out or used. By reorganizing the land and owners of our nation, particularly those that have been dormant, we can squeeze some of the newly displaced people into our factories."
 mex_ww1_full_rearmament: "Pełne racjonowanie żwyności"
 mex_ww1_full_rearmament_desc: "With our brave heroes actively defending the nation, they should have top priority for food and materials! Of course, the civilian population may resort to literally counting their beans and we might have a more restless population on our hands because of it, but if nothing else, our boys in uniform won't go hungry anytime soon."
 Mex_collectivist_ethos: "Wsaprcie innych liderów rewolucji" 
 Mex_collectivist_ethos_desc: "The old state is doomed to fall, taking our country with it unless we are to take extreme measures. By adopting a harsher stance, and moving our country towards a more extreme government form, we'll be able to protect ourselves and our national interests effectively in today's world."
 Mex_nationalism_focus: "Wsparcie dla Pancho Villi"
 Mex_nationalism_focus_desc: "Pancho Villa has gotten a taste of power in Mexico, and has harshened his tone, becoming more of a hardline nationalist and pro-military. Perhaps he is the leader that will finally bring us above Uncle Sam..."
 mex_militarism: "Militaryzm"
 mex_militarism_desc: "Our growing military is becoming more and more a part of our nation's daily life. Luckily, popular support is favoring our troops currently, seeing them as the heroes fighting for our banner that they are. This military culture we are establishing is only furthering the cause of our armed forces."
 mex_military_youth: "Bojówki młodzieżowe"
 mex_military_youth_desc: "Our militaristic culture must even be present with the children! By drilling respect for the military, and even offering training to the younger generations, we can ensure that they grow up to enlist to serve our glorious regime. Some might call this exploitation, but it sounds better when you say you're giving teenagers a bright future."
 mex_paramilitarism: "Paramilitaryzm"
 mex_paramilitarism_desc: "Some nations are foolish enough to condemn armed civilian groups, for fear of rebellion. However, if we are careful to restrict these ad-hoc militias to loyalists to the regime, we can create yet another group of angry men with guns who support our nation, which could do us well in case of war."
 mex_internationalism_focus: "Wsparcie dla Emiliana Zapaty"
 mex_internationalism_focus_desc: "Emiliano Zapata's message of extreme Socialism in Mexico- which, to put it bluntly, is nothing more than mere Communism- is a popular message indeed, especially in the very south of the country. Supporting his position could pacify the populace once and for all, even if it makes us slightly unpopular with the world's democracies."
 mex_political_correctness: "Poprawność polityczna"
 mex_political_correctness_desc: "Anyone who speaks out against our movement is clearly doing it as a hate crime towards the people we support with it. Therefore, anyone who speaks out the regime is to be closely watched, and, perhaps, unpersoned."
 mex_indoctrination_focus: "Indoktrynacja"
 mex_indoctrination_focus_desc: "After many years of debate on how to get rowdy anti-communist citizens to finally support our wonderful new regime, some of the men on the Worker's Council suggested the establishment of a new ''Ministry of Love'', which, officially, humanely persuades people to understand why they should support our government. We don't talk about what happens unofficially in there."
 mex_political_commissars: "Komisarze polityczni"
 mex_political_commissars_desc: "The military, ironically, is a place where anti-communist support thrives. By ensuring that our loving government has eyes everywhere, we can root out the dissent from these groups before it can rise."
 mex_ww1_unitedpeople: "Zapał patriotyczny"
 mex_ww1_unitedpeople_desc: "A motivated populace can do great things! By inspiring our people to rally around our sacred banner, we can easily win their hearts and minds, and string them along for, well, anything we want to do, really, so long as we have a reasonable enough opposing force to look like the good guys."
 mex_ww1_massive_effort: "Wysiłek narodowy"
 mex_ww1_massive_effort_desc: "Every man and woman must help our nation's efforts! With the spectre of the Great War floating over all, a great program has been undertaken to build up our industrial capacity to help us overcome our most hated rivals!"
 mex_ww1_fortify_city: "Fortyfikacje cywilne"
 mex_ww1_fortify_city_desc: "When the fight comes to our borders, it's best to be prepared. By hiring construction workers to build up fortresses and bunkers on some of our outer provinces, we can safely hold off any enemy who dares attack us!"
 mex_ww1_fortify_coast: "Obrona wybrzeża"
 mex_ww1_fortify_coast_desc: "A coastline is not an easy thing to defend. With ships able to land troops nearly anywhere coastal in our nation, Coastal Forts, which can help against marine invasions, are no difficult building to construct, and will help throw our enemies back into the ocean from whence they came."
 mex_ww1_improve_our_puertos: "Wzmocnienie floty"
 mex_ww1_improve_our_puertos_desc: "Being at war, our navy remains weak before the enemy. This will help defend our ports."
 mex_ww1_Restore_Autocracy: "Odnowienie reżimu autorytarnego"
 mex_ww1_Restore_Autocracy_desc: "Perhaps this Democracy stuff isn't working so well after all. Madero is a fine president and all, but clearly the state needs more power and centralization. A General named Victoriano Huerta may be qualified to help the cause out here..."
 mex_ww1_Unify_all_indigenous_languages: "Zjednoczenie wszystkich obywateli"
 mex_ww1_Unify_all_indigenous_languages_desc: "Even after all of these years, the many Central American native peoples still have not been truly integrated into our society. Are they not as well equipped to hold and fire a gun as the sons of Cortez? For the sake of our military manpower, this situation must come to an end!"
 mex_support_revolucionary_forces: "Wsparcie sił rewolucyjnych"
 mex_support_revolucionary_forces_desc: "The forces of the Mexican public clearly have no more tolerance for the dictatorship in charge of the country. Of course, there are several roads to potentially go down after the deposition..."
 mex_ww1_Take_Action: "Centralizacja władzy"
 mex_ww1_Take_Action_desc: "Who needs native and individual rights when the Government could just keep all of them? New laws drafted to give more power to the government will help us exercize rule and establish some order in this tenuous state."
 mex_ww1_preserve: "Heroizm"
 mex_ww1_preserve_desc: "It seems that at least one man in every regiment has an amazing story to tell of valor and intrigue in battle, outsmarting a foe or pulling off some sort of amazing feat. Enshrining these men in our culture and giving them a special place in our divisions will drive the rest of our troops to attempt to emulate that same success."
 mex_ww1_paramilitarism: "Wzmocnienie Obrony"
 mex_ww1_paramilitarism_desc: "If you want to see proof that the Mexican state is tired of the fighting within its own borders, just see the size of our fitting military recruits. We have to make the most of this. Extensive training given to second-rate forces may get them on the same level as our regulars."
 MEX_ww1_Strengthen_military_forces: "Wzmocnienie sił wojskowych"
 MEX_ww1_Strengthen_military_forces_desc: "There are still areas where improvement can be made to our equipment and training practices. Anything to get a better army..."
 MEX_ww1_Recluting_the_rebels: "Amnestia dla rebeliantów"
 MEX_ww1_Recluting_the_rebels_desc: "Several trained men from the Mexican Revolution simply want the opportunity to return home after a long, futile struggle. We cannot blame them. However, we can also put these skills to use. Guaranteeing safe passage home for these veterans in exchange for a year of service could help us put their skills to use and stop them from fighting our government once again!"
 MEX_ww1_Rebuild_Mexico: "Odbudowa Meksyku"
 MEX_ww1_Rebuild_Mexico_desc: "The revolution has left much shattered. We have to recover from this tragedy!"
 MEX_ww1_Renew_the_republic: "Emerytura Diaza"
 MEX_ww1_Renew_the_republic_desc: "President Diaz has served Mexico for well long enough. In his advanced age, he can no longer effecetively rule even the country he has won. His understudy, Victoriano Huerta, must take over for him."
 MEX_ww1_supress_the_rebels: "Szturm na kryjówki rebeliantów"
 MEX_ww1_supress_the_rebels_desc: "We arrested rebels who had a copy of the San Louis plan, along with notes mentioning specific hideouts and meeting places. Wonderful! If we send the troops into action, we can nip any sort of revolution in the bud."
 MEX_ww1_support_diaz: "Wsparcie Porfirio Diaza"
 MEX_ww1_support_diaz_desc: "Bleeding-heart Rebels without much of a cause are still gathering against our government, against the prosperity and security the Porfiriato has bestowed upon them. All support we can muster from our society to keep the current administration in power is necessary."
 MEX_ww1_Save_Madero: "Pokojowe przekazanie władzy"
 MEX_ww1_Save_Madero_desc: "The most important part of proving the legitimacy of our new constitution is the first transition of power. Ceding the legitimate owner of the state to the next President is quite important. Venustiano Carranza is gearing up for a run at office, and ensuring he will be able to take power if elected will prove that our Democracy works."
 mex_ww1_subjugate_UPCA: "Aneksja Aaeryki Centralnej"
 mex_ww1_subjugate_UPCA_desc: "The states of Central America are weak, scattered nations, too small and prone to foreign influence to be of any value as independent countries. To remove this potential staging ground for our enemies we must re-establish a Central American union- even if it's in our own borders..."
 mex_ww1_Lessons_of_war: "Wojenne doświadczenie"
 mex_ww1_Lessons_of_war_desc: "The instability in Mexico has given many of our troops combat experience matched elsewhere only in Europe. If we can make the most out of this, it can be a nice silver lining in this dark cloud."
 mex_ww1_2nd_Mexican_American_war: "Odzyskanie Aztlanu"
 mex_ww1_2nd_Mexican_American_war_desc: "Aztlán is the area of Northern Mexico stolen by the Estados Unidos so many years ago. We must stake a claim to the region in preperation for the Mexican government's return to the area. Of course, the war won't start quite yet, but this will put us on the road to revenge."
 mex_ww1_Support_the_columbus_raid: "Wsparcie rajdu do Columbus"
 mex_ww1_Support_the_columbus_raid_desc: "Pancho Villa has plans to raid the town of Columbus in New Mexico to cause some havoc in Yankee territory. Perhaps if we egged him on a bit and supplied him, he would be more able to operate. Of course, this WOULD risk tempting the wrath of Uncle Sam, but it's not like the U.S. Army is that much of a threat to us anyway...right?"
 mex_ww1_demand_belice: "Zażądanie Belize"
 mex_ww1_demand_belice_desc: "Belize is rightfully part of the Guatemalan territory that we now possess. Perhaps we should remind the United Kingdom of this before it comes to blows..."
 mex_ww1_Reconquer_the_UPCA: "Odzyskanie centralnej Ameryki"
 mex_ww1_Reconquer_the_UPCA_desc: "The states of Central America are weak, scattered nations, too small and prone to foreign influence to be of any value as independent countries. To remove this potential staging ground for our enemies we must re-establish a Central American union- even if it's in our own borders..."
 mex_ww1_Plan_of_San_Diego: "Plan San Diego"
 mex_ww1_Plan_of_San_Diego_desc: "If we are to stand a chance against los Estados Unidos when it comes to blows, we must weaken their industry, population, and will to conduct a war. A succession of raids on border cities may do nicely! Of course, we may have to have a scapego- I mean, volunteer- to carry out these actions. Pancho Villa seems to be a reasonable start."
 mex_ww1_Prepare_the_reconquista: "Przygotowanie do rekonkwisty"
 mex_ww1_Prepare_the_reconquista_desc: "The humiliation of 1848 must be undone before it's too late! Call the White House and tell them that the Mexicans are coming over the border!"
 mex_ww1_Stabilize_the_country: "Stabilizacja kraju"
 mex_ww1_Stabilize_the_country_desc: "The country's turmoil seems to be over, at least temporarily. It is time to start picking up the pieces and building again from where we left off."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 mex_why_we_fight: "UNASUR przede wszystkim"
 mex_why_we_fight_desc: "The instability of the world situation is too much to bear, and the threat of bad things happening to Latin America- or god forbid, to us- is too much to ignore. If we establish the Unión de Naciones Suramericanas as a proper military alliance, our combined strength will be a deterrence from any wannabe imperialist. Of course, this will also make sure that no Yankees will be meddling in our affairs."
 mex_Invite_Argentina: "Zaproś Argentynę"
 mex_Invite_Argentina_desc: "Argentina has a solid manpower base and a decent military, but they have existing problems with Brazil. If we mediate this conflict to resolution, we will likely be able to secure their membership."
 mex_Invite_Brazil: "Zaproś Brazylię"
 mex_Invite_Brazil_desc: "Brazil is one of the foremost countries in the southern hemisphere, but they do have minor conflicts around the region. Mexican Diplomacy can solve that, and they will hopefully make a fine addition to our alliance."
 mex_Invite_COL: "Zaproś Kolumbię"
 mex_Invite_COL_desc: "Colombia is not so distant from us, and their membership will almost make our alliance contiguous- with the seizure of Panama and Central America, of course, it will be. Obviously, their invitation should be a priority."
 mex_Invite_Bolivia: "Zaproś Boliwię"
 mex_Invite_Bolivia_desc: "Bolivia is not the most advanced or outstanding member of UNASUR, but they've expressed willingness to join, and so long as they have a path to our nation, why not?"
 mex_technology_sharing: "Dzielenie się technologią"
 mex_technology_sharing_desc: "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
