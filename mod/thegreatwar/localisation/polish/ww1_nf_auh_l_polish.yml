l_polish:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 AUH_ww1_army_effort: "Landstreitkräfte Österreich-Ungarns"
 AUH_ww1_army_effort_desc: "Austria-Hungary's army is actually split into three jurisdictions: An Austrian force, a Hungarian force, and a joint unified force, all of which operate with their own officers and staff. Modernization of such a force is a tall order, but possible, and will inevitably lead to a more effective armed force." 
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 AUH_ww1_form_air_force: "Utworzenie K.u.K. Luftfahrtruppen"
 AUH_ww1_form_air_force_desc: "These new Aeroplanes are interesting toys, and perhaps hold some military value. Civilian pilots could easily be attracted to our military, experts could teach us how to use these newfangled contraptions, and if this project bears fruit, we may earn ourselves a decisive advantage over our opponents who fall behind in this field- particularly in the doctrines of these aircraft."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 AUH_ww1_naval_effort: "Przezbrojenie K.u.K. Kriegsmarine"
 AUH_ww1_naval_effort_desc: "Though Austria hasn't been landlocked since the 14th Century, our empire has never boasted a particularly fearsome navy. However, it is better late than never. A large modernization program to back our construction of brand new ships will hopefully give us a naval force capable of competing in the harsh Mediterranean Sea."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 AUH_ww1_political_effort: "Nowe programy polityczne"
 AUH_ww1_political_effort_desc: ""
 AUH_ww1_sovereignist_ethos: "Centralizacja"
 AUH_ww1_sovereignist_ethos_desc: ""
 AUH_ww1_support_kaiser: "Wzmocnienie autorytetu kajzera"
 AUH_ww1_support_kaiser_desc: "His royal majesty the Kaiser und Konig has wisely ruled over our nation for a long time, but threats to his rule have been brewing. From Nationalists trying to break out to Federalists trying to form into a regionalist democracy, the throne has earned many enemies internally. We must conduct an image reworking campaign for the K.u.K. to help secure his power."
 AUH_ww1_contest_kaiser: "Kwestionowanie autorytetu kajzera"
 AUH_ww1_contest_kaiser_desc: "Perhaps Monarchy is no way to rule a multinationalist state anymore. The Kaiser und Konig is harshly unpopular outside of Austria itself, and has many enemies within his own home part of the Empire. If we weaken his authority from within, what chance does he have to retain his rule? More powerful parties can then take his place."
 AUH_ww1_internationalism_focus: "Ruch internacjonalistyczny"
 AUH_ww1_internationalism_focus_desc: ""
 AUH_ww1_militarism: "Militaryzm"
 AUH_ww1_militarism_desc: ""
 AUH_ww1_indoctrination_focus: "Indoktrynacja"
 AUH_ww1_indoctrination_focus_desc: ""
 AUH_ww1_political_commissars: "Komisarze polityczni"
 AUH_ww1_political_commissars_desc: ""
 AUH_ww1_paramilitarism: "Paramilitaryzm"
 AUH_ww1_paramilitarism_desc: ""
 AUH_ww1_political_correctness: "Poprawność polityczna"
 AUH_ww1_political_correctness_desc: ""
 AUH_ww1_military_youth: "Bojówki młodzieżowe"
 AUH_ww1_military_youth_desc: ""
 AUH_ww1_student_movement_focus: "Ruch studencki"
 AUH_ww1_student_movement_focus_desc: "The youth of our country are bright indeed, and that can help us for our research, particularly in the field of Land Doctrines."
 AUH_ww1_monarchy: "Ruch autorytarny"
 AUH_ww1_monarchy_desc: ""
 AUH_ww1_democracy: "Ruch demokratyczny"
 AUH_ww1_democracy_desc: ""
 AUH_ww1_centralizedpower: "Biurokracja"
 AUH_ww1_centralizedpower_desc: ""
 AUH_ww1_freespeech: "Wolność słowa"
 AUH_ww1_freespeech_desc: ""
 AUH_ww1_reorganization_act: "Akt reorganizacji"
 AUH_ww1_reorganization_act_desc: ""
 AUH_ww1_leave_central_power: "Opuszczenie państwa centralne"
 AUH_ww1_leave_central_power_desc: "The Germans were once our best bet for survival, but Austria now must go her own way. Maybe one day, if Germany's government would reflect ours or if, perhaps, necessity forced it, we would ally again. Alas, for now, we must bid our brothers to the north goodbye, and wish them well."
 AUH_ww1_limited_rearmament: "Ograniczone racjonowanie"
 AUH_ww1_limited_rearmament_desc: ""
 AUH_ww1_full_rearmament: "Pełne racjonowanie"
 AUH_ww1_full_rearmament_desc: ""
 AUH_ww1_unitedpeople: "Jedność narodowa"
 AUH_ww1_unitedpeople_desc: "A curious change in the pace of Austrian politics has taken place. Perhaps the people of the non-Austrian segments of the population have accepted their place here, or perhaps they are simply tired of the yammering on of the bleeding-heart nationalists." 
 AUH_ww1_massive_effort: "Masowa mobilizacja"
 AUH_ww1_massive_effort_desc: ""
 AUH_ww1_fortify_city: "Fortyfikacje cywilne"
 AUH_ww1_fortify_city_desc: ""
 AUH_ww1_fortify_coast: "Obrona wybrzeża"
 AUH_ww1_fortify_coast_desc: ""
 AUH_ww1_install_communism: "Rewolucja proletariacka"
 AUH_ww1_install_communism_desc: "The people have had enough of the Austrian elitists who are controlling and oppressing the people in the farms and factories. From now on, the citizens of the Danube will stand together in the face of aristocratic oppression!"
 AUH_ww1_install_democracy: "Wolne wybory"
 AUH_ww1_install_democracy_desc: "For the first time, the men of the Danube will have a say in their government. With the old Monarchy now a thing of the past, a federal republic can be proclaimed, which can listen and attend to every part of the nation state. No longer shall we be Austrian, or Hungarian, or anything more or less than citizens."
 AUH_ww1_end_dual_monarchy_emperor: "Koniec monarchii podwójnej"
 AUH_ww1_end_dual_monarchy_emperor_desc: "Hungary has only served to drive Austria down. By renouncing the Hungarian throne as one of our core titles, and instead relegating it to subject of Austria, we will remind everyone who is in charge here. Some of those moustachioed barbarians may complain, but what does that matter? We beat them in 1846, we can do it again if need be." 
 AUH_ww1_oppression_minorities: "Prześladowanie mniejszości"
 AUH_ww1_oppression_minorities_desc: "The best way to ensure loyalty from minority groups is to make them avoid identifying with each other. By making publications in other languages illegal, punishing citizens who fail to confirm to our culture, and enforcing local inferiority, we can fool some into thinking they are one of us, and keep the others from speaking out against us."
 AUH_ww1_autrichian_lead: "Austriackie HQ"
 AUH_ww1_autrichian_lead_desc: "With the end of the Dual Monarchy and the centralization of the realm under Austria, the Military has once again become a unified organization, with Austrian military leaders at the top. Though the officers of other nationalities are protesting, having a solid, cohesive military again has provided benefits to our doctrine and its spread." 
 AUH_ww1_same_language: "Zakazanie języków mniejszości"
 AUH_ww1_same_language_desc: "German is the only language you're allowed to speak. This isn't the German version of this mod, so don't tell anyone you're reading this description, or that you heard it from me."
 AUH_ww1_dismantle_auh: "Rozwiązanie Austro-Węgier"
 AUH_ww1_dismantle_auh_desc: "The dream of a united Austro-Hungarian monarchy lies broken. Perhaps we should cast aside our dreams of multinationalism, and pursue our own destiny."
 AUH_ww1_make_concessions: "Utworzenie koncesji"
 AUH_ww1_make_concessions_desc: "The Aristocrats are growing increasingly concerned that the Kaiser is giving out too many favorable rights too quickly, and may pass the throne over. What do they know?"
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 AUH_ww1_diplomatic_effort: "Dyplomacja"
 AUH_ww1_diplomatic_effort_desc: ""
 AUH_ww1_triple_alliance: "Odnowienie Trójprzymierza"
 AUH_ww1_triple_alliance_desc: "The Triple Alliance is, quite bluntly, the only thing keeping us on the map. We would be downright fools not to continue to seek accord with its signators, and continue to ensure and validate the alliance to this day."
 AUH_ww1_back_ger: "Wzmocnienie więzi z Niemcami"
 AUH_ww1_back_ger_desc: "Though some of the Austrian aristocrats are still bitter about the German unification process, they are our brothers, and one of the few friendly states to our government still left these days." 
 AUH_ww1_military_advisors: "Niemiecka ekspertyza wojskowa"
 AUH_ww1_military_advisors_desc: "They say that Prussia was hatched from a cannonball, and while they may not call the country that anymore, the axiom still holds true. Accepting the help of Germany to modernize our military would be an easy benefit to reap from this alliance."
 AUH_ww1_back_italy: "Zapewnienie włoskiej lojalności"
 AUH_ww1_back_italy_desc: "The Italians are, to say the least, not exactly on the friendliest terms with us. We should start negotiations with them, in order to establish more amicable relations, if we hope to keep them in our alliance. Of course, if we go through with this, we'll probably end up losing territory..."
 AUH_ww1_give_italy_territories: "Oddaj Tyrol Południowy i Istrię"
 AUH_ww1_give_italy_territories_descn: "The Italians have made their demands clear: The historically Italian region of Istria, as well as a concession around the city of Split on the Dalmatian coast. Unfortunately, this is all coastal territory, but it might be a price worth paying to keeep Italy aligned with the Central Powers." 
 AUH_ww1_italy_honnor_pact: "Wezwij Włochy do wojny"
 AUH_ww1_italy_honnor_pact_desc: "Italy is now essentially forced to join up in a war with us. If we've send them territory and promised them more from France for nothing, their people will give the government hell. Now that things have broken out, it's time to collect our dues for handing out some of our prized regions."
 AUH_ww1_assert_position_east: "Wzmocnienie pozycji na wschodzie"
 AUH_ww1_assert_position_east_desc: "The position of the Central Powers in the East is the same- weaken Russia, and build hegemony in the region. As war with Russia in particular seems to be nearly inevitable, due to the Balkan situation, this is an effective course of action to take, though will drive France and Russia closer, which could prove to be an issue."
 AUH_ww1_anti_ru: "Polityka antyrosyjska"
 AUH_ww1_anti_ru_desc: "To make good on our position, we shall sever most diplomatic ties with Russia, and begin to publicly work against them. This will likely do little but anger them for now, but it will open to us a host of options to deal with them in the future."
 AUH_ww1_anti_ru_limit_trade: "Ograniczony haldel z Rosją"
 AUH_ww1_anti_ru_limit_trade_desc: "Russia is one of our major trade partners, and we are in a fortunate position where they need us more than we need them. By placing sanctions and tariffs on Russian products, we can ensure that we get an edge over them economically."
 AUH_ww1_rom: "Zbliżenie do Rumunii"
 AUH_ww1_rom_desc: "The Romanians are a thorn in our side. We control a large portion of their territory, and though they're officially a minor member of the Triple Alliance, there is no doubt that they eye our territory with envy. We should extend good tidings out to them, to try and get them back closer to the winning team. Of course, to truly win them over might take concession..."
 AUH_ww1_rom_give_bucovina: "Oddaj Bukowinę Rumunii"
 AUH_ww1_rom_give_bucovina_desc: "Bucovina is not a significant amount of territory, but it's some of the most Romanian land in the Austro-Hungarian Empire. Conceding this territory is not guaranteed to win their heart, but it's certainly worth making an offer- we're a lot better off with a solid ally than a few inches of land."
 AUH_ww1_rom_honnor_pact: "Wezwij Rumunię do wojny"
 AUH_ww1_rom_honnor_pact_desc: "Since Romania accepted our offer of Bucovina, we are in a good position to call them into the current conflict. There is no doubt that if they decline, their people will be most displeased with them."
 AUH_ww1_oirganization_realm: "Zorganizowanie królestwa"
 AUH_ww1_oirganization_realm_desc: "Austria-Hungary, as a collection of parts of old kingdoms, is not in a great defensive position. Despite this, however, we can fortify and entrench our troops, to try and hold back the brunt of an offense on any of our broad borders." 
 AUH_ww1_fortify_russian_borders: "Fortyfikacja granicy rosyjskiej"
 AUH_ww1_fortify_russian_borders_desc: "The Galician region is one of keen strategic interest, and keeping the Russians out is important if we want to keep an advantage in the East. A fortification line in that region will help beat back the bear."
 AUH_ww1_airport_russian_borders: "Budowa lotnisk w pobliżu granicy rosyjskiej"
 AUH_ww1_airport_russian_borders_desc: "The advent of combat aeroplanes may very well be a deciding factor in the war in the East. If we build airstrips out this way early and well, we can host more planes in the region, making it a more likely prospect to break enemy air superiority and, by extension, win crucial battles in the region."
 AUH_ww1_fortify_italian_borders: "Fortyfikacja granicy włoskiej"
 AUH_ww1_fortify_italian_borders_desc: "The Italian border is long and oddly curved, making it difficult for units to support each other. Worse yet, the Italians themselves are entrenched at the bottoms of mountain chains and in fortified urban areas. Since we are unlikely to break into it any time soon, we must be sure that we can at the very least defend from that direction."
 AUH_ww1_fortify_bosnia_borders: "Fortyfikacja granicy bałkańskiej"
 AUH_ww1_fortify_bosnia_borders_desc: "It is highly unlikely that the Balkans will give us serious issues, but it is always better to be safe than sorry, lest French marines arriving in the region give us a rude awakening. It will also deny Serbia and Montenegro the chance to attack into our territory to any degree, further making for a safe Balkan campaign."
 AUH_ww1_fortify_coast_dalmatia: "Fortyfikacja wybrzeża Dalmacji"
 AUH_ww1_fortify_coast_dalmatia_desc: "Though we don't have a very strong navy, we still posess a long coastline, which must be defended if a front from the Balkans to Italy is not to be established, which would be a disaster for our war effort. Improving existing coastal forts and construction of new ones can help make sure that we never have to face that nightmare scenario." 
 AUH_ww1_ready_country: "Propaganda poborowa"
 AUH_ww1_ready_country_desc: "According to Austria-Hungary, the Austro-Hungarian army is the most prestigous employer in the world. By circulating positive news and information about our country and armed forces, we can build enthusiasm in otherwise apathetic men, helping our military out."
 AUH_ww1_polnische_wehrmacht: "Polnische Wehrmacht"
 AUH_ww1_polnische_wehrmacht_desc: "If we promise the Poles their own nationstate after the war, perhaps the residents of our part of Poland will be more willing to join in on the action. Whether we cede the territory or not is, of course, a matter to be decided yet, but for now, we can enjoy the influx of able-bodied men without thinking of the consequences." 
 AUH_ww1_military_harmonization: "Harmonizacja militarna"
 AUH_ww1_military_harmonization_desc: "An army with 3 subdivisions in its land forces alone is no easy thing to keep in check, but lately our officers have become more accustomed to dealing with the intricacies of such a force. As our military begins to operate more organically and in a more unified fashion, more ideas are coming to the top level, which is beneficial to our doctrine."
 AUH_ww1_balkans_policy: "Polityka bałkańska"
 AUH_ww1_balkans_policy_desc: "Since acquiring and annexing Bosnia, we have sought to keep our stake in the Balkans safe, and, admittedly, keep expanding in that area if we get an easy, cheap opportunity to. By establishing our argument on the world stage, we can become more actively involved in the politics of the Balkan region." 
 AUH_ww1_balkans_policy_intervene: "Reakcja na Pierwszą Wojnę Bałkańską"
 AUH_ww1_balkans_policy_intervene_desc: "The Balkan War was an interesting experience, particularly from showing the surprising potential strength of these Balkan states when unified. Though we were supporting the Ottoman Empire, it seems that their power in this region has eroded completely. Perhaps Austria needs to find a new nearby friend, if we are ever to keep what we have here?" 
 AUH_ww1_balkans_bulgaria_friend: "Wysłanie doradców wojskowych"
 AUH_ww1_balkans_bulgaria_friend_desc: "The Bulgarians are in a tough spot right now. Their war against Serbia has spilled over into a conflict with literally every single one of their neighbors. If we don't send at least advisors, it could be over for them. This is also, of course, an interesting opportunity to make friends with one of these Balkan states..."
 AUH_ww1_balkans_bulgaria_send_troops: "Wysłanie oddziałów do Bułgarii"
 AUH_ww1_balkans_bulgaria_send_troops_desc: "To ensure Bulgaria at least has a fighting chance not to get annexed, we can send in some of our own troops, nominally volunteers, to try and give Bulgaria at least some edge in the conflict. This will provide some much-needed experience, and keep pushing Bulgaria more into our corner."
 AUH_ww1_balkans_serbian_expansion: "Zbadanie serbskiego ekspansjonizmu"
 AUH_ww1_balkans_serbian_expansion_desc: "Though the Serbians were once allied to our state, since we've annexed Bosnia, things have been much less friendly betwen the Serbian government. Due to a sharp uptick in crime, especially from recent immigrants of Serbia right on the inside our borders, an investigation on Serbian activities in Austria must be carried out."
 AUH_ww1_balkans_serbian_ultimatum: "Wysłanie ultimatum Serbii"
 AUH_ww1_balkans_serbian_ultimatum_desc: "So, the Serbian bastards WERE just trying to stir up rebellions to get their grubby hands on our South Slavic provinces! They should be punished for this clear breach of trust, and our good Kaiser has begun to prepare an ultimatum to the Serbian government, which they surely will be in no position to refuse."
 AUH_ww1_annex_BOS: "Pełna aneksja Bośni i Hercegowiny"
 AUH_ww1_annex_BOS_desc: "Bosnia has been technically a part of our realm since 1908, though the process of completely establishing it in our empire has, to this point, been so slow that they still have some measure of autonomy within our realm here years later. This state of affairs benefits no one. Of course, the question now becomes ''Will Austria, Hungary, or perhaps both rule this state?''"
 AUH_ww1_Schutzkorps: "Utworzenie więcej Schutzkorps"
 AUH_ww1_Schutzkorps_desc: "The Schutzkorps was an auxiliary volunteer militia established by Austro-Hungarian authorities in the newly annexed province of Bosnia and Herzegovina to track down Bosnian Serb opposition."
