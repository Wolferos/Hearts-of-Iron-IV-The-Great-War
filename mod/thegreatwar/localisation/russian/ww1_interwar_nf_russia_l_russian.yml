l_russian:
 #--------------------------------------------------------------
 # [RUSSIA & WHITE RUSSIA] Interwar
 #=========================================================================

 RUS_int_honor_the_imperial_family:0 "Почтить Российский императорский дом"
 RUS_int_honor_the_imperial_family_desc:0 "Как бы нам ни хотелось, мы не можем просто подвести черту под многовековой историей. Династия Романовых является неотъемлемой частью России, будь то имперской или большевистской, поэтому мы должны предоставить почтить их память. Это будет очень позитивным сигналом, посланным внешним силам, следящим за ситуацией здесь."

 RUS_int_accept_polish_independence:0 "Признать независимость Польши"
 RUS_int_accept_polish_independence_desc:0 "Есть время империализма, а есть время выживания. Поляки отчаянно хотят быть независимыми и свободными, и сегодня мы не можем позволить себе держать их под своим контролем. Давайте примем их требования о независимости, это единственный логичный выбор: позже всегда будет время вернуть их под наше крыло..."

 RUS_int_refuse_polish_independence:0 "Не признавать независимость Польши"
 RUS_int_refuse_polish_independence_desc:0 "Польша должна оставаться неотъемлемой частью нашей великой Российской империи. Если мы уступим сепаратистам, вся Империя рискует распасться!"

 RUS_int_support_kirill_vladimirovich:0 "Признать царём Кирилла Владимировича"
 RUS_int_support_kirill_vladimirovich_desc:0 "После убийства Николая II красными список претендентов на императорский престол сократился. Самый законный из них — сын великого князя Владимира и великой княгини Павловны. Именно его мы должны признать сувереном."

 RUS_int_negotiate_with_trotsky:0 "Связаться с Троцким"
 RUS_int_negotiate_with_trotsky_desc:0 "Большевики сумасшедшие, но некоторые из них все еще в здравом уме. А что касается нас, то наши возможности с каждым месяцем становятся все меньше и меньше. Нам необходимо связаться с Троцким в Петрограде и принять его предложение о переговорах, поскольку другого шанса у нас, скорее всего, не будет."

 RUS_int_disinherit_kirill_vladimirovich:0 "А Владимирович-таки красный предатель"
 RUS_int_disinherit_kirill_vladimirovich_desc:0 "И это царь? Мы не забыли, что когда трон пошатнулся, князь Владимирович первым нас предал. Именно он во главе гвардейских стрелков атаковал Таврический дворец, надев красную рубашку в знак присоединения к большевикам! Не может быть и речи о том, чтобы оставить такого оппортуниста на троне Третьего Рима..."

 RUS_int_reestablish_the_zemsky_sobor:0 "Восстановить Земский собор"
 RUS_int_reestablish_the_zemsky_sobor_desc:0 "Раньше существовало собрание представителей всех регионов Империи, представлявших различные социальные классы и народы, населяющие Россию. В то время, когда мы так нуждаемся в единстве и стабильности на селе, это может быть отличным решением! Люди не только чувствовали бы, что их слушают, но и смогли излагать свое мнение по интересующим их вопросам."

 RUS_int_tsar_michael_ii:0 "Александр IV, император Всероссийский"
 RUS_int_tsar_michael_ii_desc:0 "После смерти царя Николая II престол перешел к его младшему брату, великому князю Михаилу Александровичу Романову. Он мудрый и ответственный человек, но до сих пор отказывался от престола, пока русский народ не признает его царем. Это его заслуга, но нам нужен лидер, и он нужен нам сейчас. Мы отправим его на трон как можно скорее."

 RUS_int_reclaim_the_baltic:0 "Вторгнуться в Прибалтику"
 RUS_int_reclaim_the_baltic_desc:0 "Наше влияние на Балтийском море должно быть полным, и если мы ослабеем в то время, когда Россия слабеет, то восстание распространится со скоростью лесного пожара! Мы раздавим прибалтов так, как их следует раздавить. Несколько армейских корпусов все еще дислоцируются под Петроградом, мы можем быстро составить план наступления."

 RUS_int_retake_the_caucasus:0 "Отвоевать Кавказ"
 RUS_int_retake_the_caucasus_desc:0 "Кавказ богат сырьём, и мы не можем допустить, чтобы он попал под влияние другой державы. Здесь есть колоссальные месторождения нефти и газа, вода, леса, полные дичи, и обширные сельскохозяйственные угодья, дающие прекрасные урожаи. Никто, кроме нас, не должен этого получить!"

 RUS_int_reclaim_the_finnish_throne:0 "Претендовать на Великое княжество Финляндское"
 RUS_int_reclaim_the_finnish_throne_desc:0 "Большевики признали независимость Финляндии при условии, что это позволит им укрепить свою власть. Но это в прошлом. Мы должны заявить о своем суверенитете над этой территорией."

 RUS_int_improve_russo_finnish_relations:0 "Улучшить русско-финляндские отношения"
 RUS_int_improve_russo_finnish_relations_desc:0 "Родилась новая страна, и мы должны поддерживать с ней добрые отношения, иначе у нас будет опасный противник менее чем в часе езды от Санкт-Петербурга! Давайте отправим дипломатов в Хельсинки и начнем с ними улаживать конфликты."

 RUS_int_all_the_russias:0 "Вся Россия"
 RUS_int_all_the_russias_desc:0 "От Балтийского моря и до Тихого океана, Россия охватывает треть планеты и большую часть Евразии. Она объединяет десятки народов, культур и вер, и чтобы найти путь к нашему единству, мы должны помнить эту важнейшую идею: есть одна Россия, состоящая из многих Россий..."

 RUS_int_burn_the_treaty_of_fredrikshamn:0 "В топку Фридрихсгамский договор!"
 RUS_int_burn_the_treaty_of_fredrikshamn_desc:0 ""

