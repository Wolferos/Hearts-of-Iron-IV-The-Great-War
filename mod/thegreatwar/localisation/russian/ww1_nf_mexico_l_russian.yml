l_russian:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 MEX_ww1_army_effort: "Восстановление мексиканской армии"
 MEX_ww1_army_effort_desc: "После революции мы были без армии, нужной для защиты нашего народа. Это делает нас слабыми и вряд ли даст успешно управлять дальше страной."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 MEX_ww1_form_air_force: "Основание мексиканских ВВС"
 MEX_ww1_form_air_force_desc: "Официальным предшественником военно-воздушных сил, была вспомогательная воздушная милицейская эскадра. Созданная во время мексиканской революции в апреле 1913 года военным министром генералом Мануэлем Мондрагоном. Он разрешил пилотам Мигелю Лебриху и Хуану Гильермо Вилласане бомбить цели на Кампо-де-Бальбуэна, в Мехико. 5 февраля 1915 г. лидер армии Конституционалистов, Венустьяно Карранса, основал Арма де Авиасьон, который стали нынешними ВВС."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 MEX_ww1_naval_effort: "Восстановление мексиканского ВМФ"
 MEX_ww1_naval_effort_desc: "После революции наш флот устарел. Мы должны восстановить наш военно-морской флот, чтобы защитить побережья Тихого и Атлантического океанов."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 mex_political_effort: "Политические реформы"
 mex_political_effort_desc: "Время для реформ пришло. Старая стабильная система изжила себя, народ она больше не удовлетворяет, в неспокойные времена требуется правительство, которое в состоянии реагировать эффективно. Выбирем ли мы путь изменений, или укрепления существующей власти. Но политические изменения должны быть на благо и ради будущего нашего народа."
 mex_ww1_sovereignist_ethos: "Поддержать власть Мадеро"
 mex_ww1_sovereignist_ethos_desc: "Власть была расколота слишком долго. За счет уменьшения силы регионов по сравнению с нашим центральным правительством, мы сможем преодолеть регионализм, что позволит сделать нашу нацию более сильной."
 mex_ww1_Support_the_democracy: "Поддержать демократию"
 mex_ww1_Support_the_democracy_desc: "Любой правитель, по сути, получает свою власть от народа. Мы делаем шаг в сторону более демократического общества, даже если мы не сильно изменимся сами, мы можем, по крайней мере, получить гораздо лучшее положение в торговле с различными демократическими странами мира."
 mex_ww1_centralizedpower: "Трудовая повинность"
 mex_ww1_centralizedpower_desc: "Во время войны, а также сразу до и после нее, каждый гражданин должен поработать на благо страны. Отправив на строительные работы бродяг, бездомных и всех других бездельников, мы сможем получить новые фабрики практически забесплатно, а рабочих для заводов можно набирать из этого же сброда."
 mex_ww1_freespeech: "Свобода слова"
 mex_ww1_freespeech_desc: "В последние десятилетия революции были крайне кровавыми, что не совсем хорошо сказывается на выживании главы государства. Предоставив людям право на свободу слова, люди как минимум смогут выражать свое недовольство более творческими способами. Те, кто кричит «ПОЖАР!» в переполненном кинотеатре, или те, кто больно много упоминают мать главы государства, несомненно, продолжат отправляться за решетку."
 mex_ww1_reorganization_act: "Закон о реорганизации"
 mex_ww1_reorganization_act_desc: "С тех пор как цивилизация осчастливила своим появлением наш скромный народ, земля начала попадать в собственность различных групп и индивидов. Но спустя сотни лет большая часть этих территорий находится в упадке, либо вообще не используется. Реорганизовав землевладельческую сферу, особенно в отношении заброшенных территорий, мы сможем набрать новых рабочих на заводы из числа появившихся безземельцев."
 mex_ww1_full_rearmament: "Жесткое нормирование"
 mex_ww1_full_rearmament_desc: "Наши бравые парни, обороняющие линию фронта должны первыми получать еду и материалы. Гражданское население наверняка станет считать каждый грамм подуктов, но самое главное, что наши люди в униформе не будут голодать."
 Mex_collectivist_ethos: "Поддержка других революционных лидеров"
 Mex_collectivist_ethos_desc: "Старый режим обречен на крах, ради нашей страны мы хотим пойти на крайние меры. Направив развитие нашей страны в сторону более жесткой формы правления, мы сможем эффективно защищать себя и свои национальные интересы в современном мире."
 Mex_nationalism_focus: "Поддержка Панчо Вильи"
 Mex_nationalism_focus_desc: "Национальная гордость за нашу великую родину имеет огромную поддержку у народа, благодаря недавним событиям. Некоторые политические эксперты в нашей стране даже придумали новую форму правления, известную как фашизм, который может прижиться в нашей стране. Возможно, эта форма правления может привести нашу почитаемую империю к славе!"
 mex_militarism: "Милитаризм"
 mex_militarism_desc: "Наша растущая военная мощь занимает все большую часть в идеологии. К счастью, народная поддержка наших войск в настоящее время велика. Люди видят в них героев борьбы за нашу Родину. Эта военная культура содействует развитию наших вооруженных сил."
 mex_military_youth: "Милитаризация молодежи"
 mex_military_youth_desc: "Наша милитаристская культура должна работать даже с детьми! Путем привития уважения к военным у подрастающего поколения, мы можем гарантировать, что они растут, чтобы служить нашему славному режиму. Некоторые могли бы назвать это эксплуатацией, но  лучше звучит, выражение, что мы даем подросткам светлое будущее."
 mex_paramilitarism: "Парамилитаризм"
 mex_paramilitarism_desc: "Некоторые народы настолько глупы, что осуждают вооруженные гражданские формирования, опасаясь бунта. Однако, если мы будем осторожны, чтобы отбирать в эти специальные отряды лояльных к режиму, мы можем создать еще одну группу обозленных мужчин с оружием, которых поддерживает наш народ. И  они могут сослужить нам хорошую службу в случае войны."
 mex_internationalism_focus: "Поддержка Эмилиано Сапаты"
 mex_internationalism_focus_desc: "Коммунистическую революцию не остановить. Хорошо, что наши люди приняли ее сейчас, чем после гражданской войны. Как только мы открыто объявляем поддержку движению коммунистов — интернационалистов, мы сами должны стать красными, как кровь человека."
 mex_political_correctness: "Политкорректность"
 mex_political_correctness_desc: "Любой, кто выступает против нашего движения, делает это на почве ненависти к тем людям, которых мы поддерживаем. Поэтому каждый, кого защищает режим должен осознавать себя одним народом."
 mex_indoctrination_focus: "Идеологическая обработка"
 mex_indoctrination_focus_desc: "После многих лет дебатов о том, как получить поддержку нашего замечательного нового режима у  антикоммунистических граждан. Некоторые люди из Совета предлагают создать новое "Министерство любви", которое, официально, по-человечески объясняет людям, почему они должны поддержать наше правительство."
 mex_political_commissars: "Политкомиссары"
 mex_political_commissars_desc: "Войска, по иронии судьбы, это место, где антикоммунистические настроения процветают. Благодаря тому, что у нашей любящей власти везде есть глаза, мы можем искоренить инакомыслие из этой группы, прежде чем оно может развиться."
 mex_ww1_unitedpeople: "Патриотический подъём"
 mex_ww1_unitedpeople_desc: "Мотивированное население может горы свернуть! Вдохновив наш народ сплотиться вокруг священного знамени, мы легко завоюем их разумы и сердца, что позволит нам проводить любую политику, но только до тех пор пока наше правительство будет выглядеть меньшим из возможных зол."
 mex_ww1_massive_effort: "Национальное единство"
 mex_ww1_massive_effort_desc: "Все мужчины и женщины обязаны каким-то образом поддержать усилия нашей страны! В свете грядущей Великой войны была создана масштабная программа по по увеличению нашего промышленного потенциала, чтобы мы могли превзойти любого нашего противника!"
 mex_ww1_fortify_city: "Оборона приграничных областей"
 mex_ww1_fortify_city_desc: "Когда война дойдет до наших границ, нам нужно быть к этому готовыми. Наняв строителей и инженеров для постройки фортов и бункеров в приграничных областях, мы сможем выдержать удары любого врага!"
 mex_ww1_fortify_coast: "Оборона побережья"
 mex_ww1_fortify_coast_desc: "Побережье нелегко защищать, особенно с появлением кораблей, которые могут высадить войска в любой точке мира. Однако, построив прибрежные форты, мы сможем защититься от морских вторжений, чтобы затем скинуть врагов обратно в море!"
 mex_ww1_improve_our_puertos: "Модернизация военно-морского флота"
 mex_ww1_improve_our_puertos_desc: "В настоящей войне, наш флот остается слабым перед врагом. Но это поможет защитить наши порты."
 mex_ww1_Restore_Autocracy: "Восстановить автократию"
 mex_ww1_Restore_Autocracy_desc: "Возможно, этот режим демократии не так хорошо работает. Мадеро — прекрасный президент и все, но, безусловно, государство нуждается в большей власти и централизации. Генерал по имени Викториано Уэрта может быть призван, для помощи нашему делу..."
 mex_ww1_oppression_minorities: "Угнетение нацменьшинств"
 mex_ww1_oppression_minorities_desc: "Лучший способ обеспечить лояльность меньшинств, неотождествление их друг с другом. Путем запрета публикаций на других языках кроме государственного, обеспечение неполноценности граждан в правах, которые не относятся к нашей культуре, мы можем заставить их считать себя одними из нас, и это удержит других от выступлений против нас."
 mex_ww1_Unify_all_indigenous_languages: "Объединение всех коренных народов"
 mex_ww1_Unify_all_indigenous_languages_desc: "После того, как страна была колонизирована, многие потомки коренных жителей все еще не в состоянии общаться на общем языке или служить стране."
 mex_support_revolucionary_forces: "Поддержка революционных сил"
 mex_support_revolucionary_forces_desc: "После 31-летней диктатуры, озлобленные мексиканцы воюют против федеральных властей. Желая сменить правительство."
 mex_ww1_Take_Action: "Рецентрализация"
 mex_ww1_Take_Action_desc: "Кому нужны права нации и личности, когда правительство может их просто игнорировать. Новые законы, призванные дать больше власти правительству, помогут нам установить какой-то порядок в этом слабом государстве."
 mex_ww1_preserve: "Героизм"
 mex_ww1_preserve_desc: "Похоже, что по крайней мере один человек в каждом полку имеет удивительную историю, может рассказать о доблести и интригах в битве, перехитрить врага или показать какой-то удивительный подвиг. Укрепление этих людей в нашей культуре и предоставление им особого места в наших дивизиях заставит наши войска пытаться им подражать."
 mex_ww1_paramilitarism: "Оборонительный фокус"
 mex_ww1_paramilitarism_desc: "Если вы хотите увидеть доказательства того, что мексиканское государство устало от боевых действий в своих собственных границах, просто посмотрите размер наших подходящих военных новобранцев. Мы должны использовать это с максимальной отдачей. Обширная подготовка, предоставляемая второразрядным силам, может привести их к тому же уровню, что и наши завсегдатаи."
 MEX_ww1_Strengthen_military_forces: "Модернизация вооружённых сил"
 MEX_ww1_Strengthen_military_forces_desc: ""
 MEX_ww1_Recluting_the_rebels: "Вербовка повстанцев"
 MEX_ww1_Recluting_the_rebels_desc: "После революции осталось несколько крупных групп повстанцев. Мы должны привлечь их, прежде чем они обратятся против нас."
 MEX_ww1_Rebuild_Mexico: "Восстановление Мексики"
 MEX_ww1_Rebuild_Mexico_desc: "Революция оставила много разрушений. Мы должны оправиться от этой трагедии."
 MEX_ww1_Renew_the_republic: "Восстановление Республики"
 MEX_ww1_Renew_the_republic_desc: "Поддержка правительства Викториано Уэрты. Правой руки Порфирио Диаза."
 MEX_ww1_supress_the_rebels: "Раздавить мятежников"
 MEX_ww1_supress_the_rebels_desc: "Мы арестовали мятежников, у которых были копии плана Сан-Луиса. Мы должны принять меры, если хотим предотвратить революцию."
 MEX_ww1_support_diaz: "Поддержка Порфирио Диаза"
 MEX_ww1_support_diaz_desc: "Наше правительство создало в стране экономическое и военное процветание. Но ему угрожают повстанцы, мы должны арестовать их."
 MEX_ww1_Save_Madero: "Сохранить Мадеро"
 MEX_ww1_Save_Madero_desc: "Мы можем спасти президента от гибели. А затем поддержать правительство Венустиано Каррансы."
 mex_ww1_subjugate_UPCA: "Восстановление Первой Республики"
 mex_ww1_subjugate_UPCA_desc: "Первая Республика охватывала большую часть Центральной Америки, которая была украдена предателями. Там существует нестабильная Федерация и разделенных мелких стран. Мы должны вернуть то, что принадлежит нам!!!"
 mex_ww1_Lessons_of_war: "Уроки войны"
 mex_ww1_Lessons_of_war_desc: "После возвращения того, что было нашим, мы узнали несколько тактик ведения войны, а также стратегий. Это поможет нам защитить нас должным образом."
 mex_ww1_2nd_Mexican_American_war: "Отвоевание Ацтлана"
 mex_ww1_2nd_Mexican_American_war_desc: "Они используют имя Ацтлана в землях Северной Мексики, которые были аннексированы США в результате американо–мексиканской войны. Ацтлана стала символом метисов активистов, которые считают, что они имеют законное и неотъемлемое право на эту землю. Для того, чтобы воспользоваться этим правом, некоторые члены движения Чикано предлагают создать новую страну, Република дель Норте."
 mex_ww1_Support_the_columbus_raid: "Поддержка рейда на Колумбус"
 mex_ww1_Support_the_columbus_raid_desc: "Рейд Панчо Вилльи теперь официально известен в США, как Мексиканская экспедиция, но изначально называлась карательной экспедицией армии США, проведенная армией США против военизированных сил мексиканского революционера Панчо Вильи во время мексиканской революции 1910-1920.Экспедиция была начата в ответ на нападение Вилльи на город Коламбус, штат Нью-Мексико."
 mex_ww1_demand_belice: "Требование Белиза"
 mex_ww1_demand_belice_desc: "Соединенные провинции Центральной Америки отдалились от нас. Великобритания имеет на правах колонии зону Белиза, которая является частью Гватемалы и мексиканской территории. Вот почему она так важна для нас!"
 mex_ww1_Reconquer_the_UPCA: "Отвоевать СПЦА"
 mex_ww1_Reconquer_the_UPCA_desc: "Претензии на Соединенные провинции Центральной Америки. Поскольку у нас есть законное право на эту территорию, ведь Мексика наследница первой Республики"
 mex_ww1_Plan_of_San_Diego: "План Сан-Диего"
 mex_ww1_Plan_of_San_Diego_desc: "План предусматривал такие вещи, как убийство всех взрослых англоговорящих в юго-западных Штатах и возвращение земли коренным американцам. Были рейды в Техас, которые начались в июле 1915 года. Рейдерам противостояли Техасские рейнджеры армии США и местные отряды самообороны. В общей сложности, за 30 рейдов в Техасе уничтожено большое количество имущества и убит 21 американец. Неизвестно, кто был ответственен за разработку плана, Сан-Диего, но есть теории, что мексиканские революционные лидеры приняли участие в его спонсировании."
 mex_ww1_Prepare_the_reconquista: "Подготовка Реконкисты"
 mex_ww1_Prepare_the_reconquista_desc: "После унижений 1846 и 1848 годов, мы должны вернуть территории, которые принадлежат нам в качестве законных. И вернуть славу Мексики."
 mex_ww1_Stabilize_the_country: "Стабилизация ситуации в стране"
 mex_ww1_Stabilize_the_country_desc: "Мы должны стабилизировать политическую ситуацию в стране и возместить ущерб, который вызвала революция."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 mex_why_we_fight: "Почему мы воюем"
 mex_why_we_fight_desc: "Мир становится все более небезопасным. Наши люди должны видеть зверства, совершаемые теми, кто жаждет власти. Настало время сплотить людей вокруг нашего общего дела и убедиться, все готовы бороться за нашу свободу."
 mex_Invite_Argentina: "Пригласить Аргентину"
 mex_Invite_Argentina_desc: "Аргентина обладает солидной рабочей силой и достойными военными, но у них есть проблемы с Бразилией. Если мы разрешим этот конфликт, мы, скорее всего, сможем обеспечить их членство."
 mex_Invite_Brazil: "Пригласить Бразилию"
 mex_Invite_Brazil_desc: "Бразилия является одной из передовых стран в южном полушарии, но у них есть небольшие конфликты вокруг региона. Мексиканские дипломаты могут помочь в этом, и они, надеюсь, сделают прекрасное дополнение к нашему альянсу."
 mex_Invite_COL: "Пригласить Колумбию"
 mex_Invite_COL_desc: "Колумбия не так далека от нас, и их членство сделает наш альянс сильнее — с захватом Панамы и Центральной Америки. Очевидно, что их приглашение должно быть для нас приоритетом."
 mex_Invite_Bolivia: "Пригласить Боливию"
 mex_Invite_Bolivia_desc: "Боливия не является самым продвинутым или выдающимся членом УНАСУР, но они выразили готовность присоединиться, почему бы и нет?"
 mex_technology_sharing: "Обмен технологиями"
 mex_technology_sharing_desc: "Путем обмена технологическими достижениями с нашими союзниками, наша страна будет иметь возможность более эффективно проводить исследования."
