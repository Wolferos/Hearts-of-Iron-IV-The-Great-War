l_russian:

 #--------------------------------------------------------------
 # [RUSSIAN EMPIRE] Army Effort
 #=========================================================================
 RUS_ww1_army_effort:0 "Русская императорская армия"
 RUS_ww1_army_effort_desc:0 "Создана царём (позднее, императором) Петром I. Заменила иррегулярные поместные войска и стрелецкие полки. С 1699 года армия формировалась на основе рекрутской повинности, с 1874 года — на основе всеобщей воинской обязанности."

 RUS_ww1_trenchwarfare:0 "Позиционная война"
 RUS_ww1_trenchwarfare_desc:0 "Позиционная война — война, в которой вооружённая борьба ведётся, в основном, на сплошных, относительно стабильных фронтах (позициях) с глубокоэшелонированной обороной. Как правило, характеризуется высокой плотностью войск и развитым инженерным обеспечением позиций."

 RUS_ww1_artillery_effort_1:0 "Изучить влияние артиллерии в Русско-японской войне"
 RUS_ww1_artillery_effort_1_desc:0 "После русско-японской войны 1904-1905 года влияние артиллерии на ход боевых действий возросло. Опыт войны с Японией показал, что кроме пушек легкой полевой артиллерии, необходимы гаубицы, дальнобойные и подвижные, как пушки. "

 RUS_ww1_artillery_effort_2:0 "Ставка на полевую артиллерию"
 RUS_ww1_artillery_effort_2_desc:0 "В 1902 году на Путиловском заводе в Санкт-Петербурге конструкторами Л. А. Бишляком, К. М. Соколовским и К. И. Липницким была разработана 76,2-мм дивизионная пушка, известная также как «трёхдюймовка». Ставшая основой русской полевой артиллерии вплоть до революции, она положительно зарекомендовала себя у русских артиллеристов."

 RUS_ww1_artillery_effort_3:0 "Модернизация российской артиллерии"
 RUS_ww1_artillery_effort_3_desc:0 "Исходя из опыта прошедшей войны был сделан вывод, что для артиллерийской поддержки пехотных дивизий 76-мм пушек было явно недостаточно и требовалось более мощное орудие для разрушения укреплений противника во фронтовой полосе и на вооружение российской армии была принята 122-мм полевая скорострельная гаубица обр. 1909 года и 152-мм гаубицу обр. 1910 года."

 RUS_ww1_artillery_effort_4:0 "Улучшение российской артиллерии"
 RUS_ww1_artillery_effort_4_desc:0 "Во время Первой мировой войны большая часть потерь войск всех стран была вызвана именно огнём артиллерии. Если в русско-японскую войну на огонь артиллерии приходилось не более 15% потерь в живой силе, то в Первую мировую — до 75%."

 RUS_ww1_special_forces:0 "Специальные войска"
 RUS_ww1_special_forces_desc:0 "Первыми специальными войсками в регулярной русской армии стали артиллерия и инженерные войска — войска переднего края. С конца XIX — начала XX века стали активно развивать инженерные, дорожные, железнодорожные, связи, автомобильные, воздухоплавательные и авиационные подразделения и части армии и флота."

 RUS_ww1_army_motorization_focus:0 "Моторизация"
 RUS_ww1_army_motorization_focus_desc:0 "Россия в Первой Мировой войне активно использовала различные бронеавтомобили. Составляли основу броневых частей русской армии, бронеавтомобили Остин. На его основе были разработаны российские варианты, такие как — Остин-Кегресс, Остин-Путиловец."

 RUS_ww1_doctrine_effort:0 "Реформы армии"
 RUS_ww1_doctrine_effort_desc:0 "Осуществление реформ в армии проходило в два этапа: первый — в 1905-1909 годах, и второй — в 1909-1912 годах. Первоначально проводится ряд мероприятий по восстановлению боеспособности армии, начинаются работы по ее техническому переоснащению и реорганизации высшего военного управления. На втором этапе происходит централизация высшего военного управления, реорганизация армии и улучшение ее технического оснащения."

 RUS_ww1_doctrine_effort_2:0 "Боевая подготовка солдат"
 RUS_ww1_doctrine_effort_2_desc:0 "Боевая подготовка проводилась по определенному плану, который предусматривал разделение учебного года на два периода: зимний и летний, разбитых на несколько этапов. Для обеспечения однообразия обучения разрабатывались единые программы и издавались специальные наставления."

 RUS_ww1_doctrine_effort_3:0 "Усиленное обучение солдат"
 RUS_ww1_doctrine_effort_3_desc:0 "Усовершенствование программ по обучению новоприбывших солдат"

 RUS_ww1_equipment_effort:0 "Ставка на винтовку Мосина"
 RUS_ww1_equipment_effort_desc:0 "7,62-мм (3-линейная) винтовка обр. 1891 года — магазинная винтовка, принятая на вооружение Русской императорской армии ВС России в 1891 году. Активно использовалась в период с 1891 до конца Второй мировой войны"

 RUS_ww1_equipment_effort_2:0 "Пулемет Максима обр. 1910 года"
 RUS_ww1_equipment_effort_2_desc:0 "Пулемёт Максима обр. 1910 года — станковый пулемёт, вариант британского пулемёта Максима, широко использовавшийся российской и советской армиями во время Первой мировой и Второй мировой войн."

 RUS_ww1_equipment_effort_3:0 "Ручная граната Рдултовского"
 RUS_ww1_equipment_effort_3_desc:0 "РГ-14 (Ручная граната Рдултовского обр. 1914 года) — ручная осколочная граната, созданная перед самой Первой Мировой войной капитаном артиллерии Владимиром Иосифовичем Рдултовским на основе конструкции его предыдущей гранаты — РГ-12"

 RUS_ww1_equipment_effort_4:0 "Бомбомёт системы Аазена"
 RUS_ww1_equipment_effort_4_desc:0 "Бомбомет системы Аазена — 3,5-дюймовый (88,9-мм) штоковый миномёт Аазена был создан во Франции в 1915 году. Конструктор — Нильс Аазен. В 1915—1916 годах он производился в России и применялся во время Первой мировой войны."

 RUS_ww1_armor_effort_1:0 "Вездеход"
 RUS_ww1_armor_effort_1_desc:0 "Вездеходная машина, разработанная конструктором Александром Пороховщиковым в России в 1914-1915 годах. Пороховщиков рассматривал также возможность установки на неё бронирования и вооружения, из-за чего в советской и современной российской литературе «Вездеход» часто рассматривается, как один из первых русских проектов танка"

 RUS_ww1_armor_effort_2:0 "Русское танкостроение"
 RUS_ww1_armor_effort_2_desc:0 "Первые танки в России появились в армиях Белого движения в ходе Гражданской войны. Танки были английского и французского производства. Первым же русским танком, запущенным в серийное производство, был «Рено-русский». Представлял собою почти копию французского лёгкого танка Renault FT-17. Выпускался в 1920-1921 годах на Сормовском заводе"

 RUS_ww1_gasmask_focus:0 "Химическая война"
 RUS_ww1_gasmask_focus_desc:0 "В ходе Первой мировой войны химическое оружие очень широко применялось в боевых действиях, однако, несмотря на смертоносность его действия, показало невысокую эффективность. Возможность применения крайне зависела от погоды, направления и силы ветра."
 #--------------------------------------------------------------


 # [RUSSIAN EMPIRE] Aviation Effort
 #=========================================================================
 RUS_ww1_aviation_effort:0 "Российский императорский военно-воздушный флот"
 RUS_ww1_aviation_effort_desc:0 "Существовал в 1885-1917 годах. Несмотря на свою короткую историю сыграл значительную роль в развитии мировой авиации."

 RUS_ww1_sikorsky_airplane_research:0 "Cамолеты Сикорского"
 RUS_ww1_sikorsky_airplane_research_desc:0 "Игорь Иванович Сикорский — великий российский авиаконструктор, учёный, изобретатель, философ. Создатель первых в мире: четырёхмоторного самолёта «Русский витязь» (1913 год), тяжёлого четырёхмоторного бомбардировщика и пассажирского самолета «Илья Муромец» (1914 год). Во время Гражданской Войны эмигрировал в США и в 1942 году разработал первый серийный вертолет."

 RUS_ww1_rbvz_production:0 "Подписать контракт с РБВЗ"
 RUS_ww1_rbvz_production_desc:0 "Русско-Балтийский вагонный завод — акционерное машиностроительное предприятие Российской империи. Первоначально завод располагался в Риге, но ввиду Первой мировой войны осенью 1915 года был эвакуирован в Тверь, Москву и Петроград. Всего за период 1912—1917 заводом было выпущено 240 самолётов различных типов. Главным авиаконструктором с 1912 года был Игорь Сикорский."

 RUS_ww1_fighter_focus:0 "Сикорский С-16"
 RUS_ww1_fighter_focus_desc:0 "Одним из наиболее удачных машин Сикорского стал легкий истребитель С-16, выпущенный серией всего в 34 экземпляра. Первый самолет серии был готов в январе 1915 года. Самолет построили (как и все другие машины Сикорского) на РБВЗ в Санкт-Петербурге. Самолет С-16 представлял собой легкий истребитель сопровождения, предназначенный для прикрытия тяжелых бомбардировщиков."

 RUS_ww1_bomber_focus:0 "Илья Муромец"
 RUS_ww1_bomber_focus_desc:0 "С-22 «Илья Муромец» разработан Игорем ивановичем Сикорским. Выпускался с 1914 по 1919 год. На самолёте поставлен ряд рекордов грузоподъёмности, числа пассажиров, времени и максимальной высоты полёта. Является в истории первым серийным многомоторным бомбардировщиком."

 RUS_ww1_airship_focus:0 "Дирижабль"
 RUS_ww1_airship_focus_desc:0 "Этот летательный аппарат легче воздуха, представляющий собой комбинацию аэростата с силовой установкой (обычно это двигатель внутреннего сгорания с воздушным винтом) и системой управления ориентацией (рули управления), благодаря чему дирижабль может двигаться в любом направлении независимо от направления воздушных потоков."

 RUS_ww1_aviation_effort_2:0 "Русский витязь"
 RUS_ww1_aviation_effort_2_desc:0 "С-21 Русский витязь — первый в мире четырёхмоторный самолёт, дал начало тяжёлой авиации. Создан И. И. Сикорским в качестве опытного самолёта для стратегической разведки. Предусматривалось размещение как двух, так и четырёх моторов."

 RUS_ww1_aviation_effort_4:0 "Самолёты Терещенко"
 RUS_ww1_aviation_effort_4_desc:0 "Самолёты Терещенко — общее название нескольких серий монопланов и бипланов, выпускавшихся в России в Авиационном заводе Терещенко в 1911-1917 годах и разработанные при финансировании и/или прямом участии Фёдора Федоровича Терещенко."

 RUS_ww1_pilotformation_1:0 "Программа поддержки асов-истребителей"
 RUS_ww1_pilotformation_1_desc:0 "Ас — мастер воздушного боя. Впервые это слово было применено в Первую мировую войну к военным лётчикам, на высоком уровне владеющим искусством пилотирования и воздушного боя. Лучшие российские асы Первой мировой войны: Казаков Александр Александрович, Янченко Василий Иванович, Крутень Евграф Николаевич, Аргеев Павел Владимирович, Смирнов Иван Васильевич и другие.."

 RUS_ww1_pilotformation_2:0 "Программа поддержки асов-истребителей II"
 RUS_ww1_pilotformation_2_desc:0 "Ас — мастер воздушного боя. Впервые это слово было применено в Первую мировую войну к военным лётчикам, на высоком уровне владеющим искусством пилотирования и воздушного боя. Лучшие российские асы Первой мировой войны: Казаков Александр Александрович, Янченко Василий Иванович, Крутень Евграф Николаевич, Аргеев Павел Владимирович, Смирнов Иван Васильевич и другие.."

 RUS_ww1_aircraftprod_1:0 "Закупить самолеты у союзников"
 RUS_ww1_aircraftprod_1_desc:0 "В момент объявления войны на вооружении русской авиации состояли главным образом французские «Ньюпоры». Nieuport 17 — основной истребитель ВВС Российской империи. Выполнен по схеме полутораплана. Самолёт сильно повлиял на развитие авиации Первой Мировой. Им были укомплектованы войска Франции, России, Великобритании, Бельгии и Италии."

 RUS_ww1_aircraftprod_2:0 "Производство самолетов"
 RUS_ww1_aircraftprod_2_desc:0 "Начать массовое отечественных производство отечественных самолетов."

 RUS_ww1_airbomb_1:0 "Летающая лодка М-5"
 RUS_ww1_airbomb_1_desc:0 "М-5 — летающая лодка конструкции Д. П. Григоровича. Прототип был собран в апреле 1915 года, а в мае на Крестовском острове в Санкт-Петербурге лётчик Я. И. Седов-Серов совершил на нём первые полёты. Строительство М-5 развернулось довольно крупной серией. Всего морская авиация получила 183 машины."

 RUS_ww1_airbomb_2:0 "Святогор"
 RUS_ww1_airbomb_2_desc:0 "Святогор — русский самолёт, прототип бомбардировщика, был спроектирован конструктором В. А. Слесаревым. В самолёте были применены ряды новейших решений, которые были позже перенятые другими конструкторами. Крупнейший в то время самолёт; построен 13 марта 1916 года, доводился до 1921 года, однако совершить полёт так и не смог."

 RUS_ww1_air_innovation:0 "Российское авиастроение"
 RUS_ww1_air_innovation_desc:0 "Российское авиастроение до Революции 1917 года было на высоком уровне, были построены первый бобардировщик, четырёхмоторного самолёт. Прославился великий росийский авиаконструктор Игорь Иванович Сикорский. Но после Революции отрасль пришла в упадок. Восстанавливатся она начала только после Гражданской войны в России. Первыми истребителями СССР собственной конструкции был И-1 Григоровича"

 RUS_ww1_navalair:0 "Военно-морская авиация"
 RUS_ww1_navalair_desc:0 "Предназначена для уничтожения кораблей, группировок сил, конвоев, десантов противника в море и в базах, поиска и уничтожения его ПЛ, нарушения системы наблюдения и управления его театра военных действий, прикрытия группировок своих кораблей, ведения разведки, выдачи целеуказания в интересах применения оружия силами флота и решения других задач."

 #--------------------------------------------------------------


 # [RUSSIAN EMPIRE] Industrial Effort
 #=========================================================================
 RUS_ww1_industrial_effort:0 "Развитие промышленности России"
 RUS_ww1_industrial_effort_desc:0 "Эпоха господства промышленности находится в самом разгаре, и нам еще предстоит много работы. Создание новых проектов для увеличения нашего промышленного потенциала принесет нам неплохую выгоду, особенно в части производства снаряжения для наших военных."

 RUS_ww1_construction_effort:0 "Развитие строительства"
 RUS_ww1_construction_effort_desc:0 "Одна из зарубежных фирм была поглощена нашим государственным предприятием. Если мы убедим их перенести производство и рабочие места в нашу страну, то это даст значительный рост сектору гражданской экономики. Конечно, со своей стороны мы обеспечим постройку всех необходимых сооружений..." 

 RUS_ww1_construction_effort_2:0 "Развитие строительства II"
 RUS_ww1_construction_effort_2_desc:0 "Иногда, даже в нерегулируемой рыночной экономике, государству приходится в нее вмешиваться. Если мы создадим новые государственные корпорации и обеспечим их заводами, то мы гарантируем, что наша страна сможет жить самодостаточно в то время, когда торговля будет затруднена."

 RUS_ww1_construction_effort_3:0 "Развитие строительства III"
 RUS_ww1_construction_effort_3_desc:0 "Расширение нашей гражданской промышленности почти закончено, однако у нас есть еще один замысел. Мы можем продать компаниям некоторые пригородные земли, при условии, что они будут использовать ее для постройки своих заводов. Это еще сильнее увеличит выпуск гражданской продукции, и у нас практически не осталось способов для роста производства, кроме обыденной постройки фабрик."

 RUS_ww1_production_effort:0 "Развитие вооружений"
 RUS_ww1_production_effort_desc:0 "Количество закупаемого нами вооружения привлекло внимание местного стального магната, который хотел бы организовать новую оружейную компанию в нашей стране. Если мы поддержим это начинание, найдя землю, инвесторов и хороших рабочих, то очень скоро мы ощутим все преимущества от существования военного завода." 

 RUS_ww1_production_effort_2:0 "Развитие вооружений II"
 RUS_ww1_production_effort_2_desc:0 "От одного автомобильного концерна поступило предложение по созданию отдельного завода по производству военной продукции, вместо её производства на существующих линиях. Если мы заинтересованы в таком заводе, который увеличит общее производство военной техники, то стоит заключить эксклюзивный договор."

 RUS_ww1_production_effort_3:0 "Развитие вооружений III"
 RUS_ww1_production_effort_3_desc:0 "Один из авиационных конструкторов попросил нас помочь в создании нового завода по производству его авиатехники. Хотя его модели не были протестированы, в худшем случае, мы просто перепрофилируем завод на производство проверенной техники. Профинансировав строительство, мы увеличим наш военно-промышленный потенциал."

 RUS_ww1_dockyard_effort_1:0 "Ремонт верфей"
 RUS_ww1_dockyard_effort_1_desc:0 "Отремонтировав старые верфи мы сможем увеличить наши производтсвенные сощности по выпуску кораблей."

 RUS_ww1_dockyard_effort_2:0 "Строительство новых верфей"
 RUS_ww1_dockyard_effort_2_desc:0 "Выкупив неиспользуемые прибрежные земли и расширив нашу существующую инфраструктуру, мы сможем увеличить наши производтсвенные сощности по выпуску кораблей."

 RUS_ww1_dockyard_effort_3:0 "Строительство новых верфей II"
 RUS_ww1_dockyard_effort_3_desc:0 "Некоторые коммерческие доки пришли в упадок, но если вложиться в их ремонт и модернизацию, то они могут быть легко перенаправлены на производство военных судов."

 RUS_ww1_airfield_expansion_1:0 "Военно-полевой аэродром в Гатчине"
 RUS_ww1_airfield_expansion_1_desc:0 "Военно-полевой аэродром в Гатчине — первый военный аэродром России. Построен в 1909 году."

 RUS_ww1_airfield_expansion_2:0 "Строительство новых аэродромов"
 RUS_ww1_airfield_expansion_2_desc:0 "Для постройки аэродромов нужен лишь открытый участок земли, находящийся рядом с дорожной сетью. Создание самих полос и инфраструктуры это конечно, серьезная работа, но она точно окупится."

 RUS_ww1_airfield_expansion_3:0 "Строительство новых аэродромов II"
 RUS_ww1_airfield_expansion_3_desc:0 "Построив полноценные аэродромы у больших городов, мы сможем создать сеть легко снабжаемых баз для наших самолетов, что позволит нам существенно лучше оборонять самые важные регионы."

 RUS_ww1_infrastructure_effort:0 "Построить новые дороги"
 RUS_ww1_infrastructure_effort_desc:0 "Построив новые дороги и отремонтировав старые, мы значительно можем улучшить снабжение для российской армии."

 RUS_ww1_infrastructure_effort_2:0 "Улучшение инфраструктуры России"
 RUS_ww1_infrastructure_effort_2_desc:0 "По мере роста промышленности, частный сектор все чаще требует от нас инвестиций в инфраструктуру, что поможет росту экономики. Но если мы начнем заниматься этим делом, то у нас больше не будет ресурсов на строительство новых заводов. С другой стороны, именно инфрастраструктура будет влиять на скорость подвоза припасов и перемещения наших войск, так что может это и неплохая идея."

 RUS_ww1_infrastructure_effort_3:0 "Улучшение инфраструктуры России II"
 RUS_ww1_infrastructure_effort_3_desc:0 "Хотя у нас постоянно растет количество заводов, верфей и аэродромов, у нас еще есть возможности для новых вложений. Следующим логичным шагом станет развитие сети железных дорог, которые мы до сих пор упускали из виду. Проложение железнодорожных путей не только ускорит перемещение припасов и людской силы, но и откроет новые возможности для инвестиций в экономику."

 RUS_ww1_infrastructure_effort_4:0 "Восстановить инфраструктуру"
 RUS_ww1_infrastructure_effort_4_desc:0 "Война принесла огромный урон Российской инфраструктуре. Пора восстановить её!"

 RUS_ww1_extra_tech_slot:0 "Дополнительный слот для иследований"
 RUS_ww1_extra_tech_slot_desc:0 "Создание огромного промышленного потенциала, а также назначения наших лучших руководителей из НИОКР и военной сферы на новые предприятия, должны были рано или поздно принести плоды. Некоторые отрасли производства подарили нам выдающихся изобретателей, которые смогут создать новые технологии для нашей страны."

 RUS_ww1_expand_the_academy_of_sciences:0 "Расширить Академию наук"
 RUS_ww1_expand_the_academy_of_sciences_desc:0 "Петербургская академия наук, а с 1917 года — Российская академия наук, давала России выдающихся учёных и исследователей. Они вносили огромный вклад в развитие России."

 #--------------------------------------------------------------


 # [RUSSIAN EMPIRE] Naval Effort
 #=========================================================================
 RUS_ww1_naval_effort:0 "Российский императорский флот"
 RUS_ww1_naval_effort_desc:0 "Российский императорский флот — наименование военно-морского флота Российской империи с 1721 по 1917 годы. К началу русско-японской войны 1904-1905 годов — третий в мире флот по боевой мощи (после флотов Великобритании и Франции)."

 RUS_ww1_newnavalcanons_1:0 "Укрепление Российского императорского флота"
 RUS_ww1_newnavalcanons_1_desc:0 ""

 RUS_ww1_european_seas_focus:0 "Балтийский флот"
 RUS_ww1_european_seas_focus_desc:0 "Датой основания Балтийского флота принято считать 18 мая 1703 года. В годы Первой мировой войны корабли Балтийского флота проводили минно-заградительные операции (поставлено 35 тыс. мин), а также действовали на коммуникациях немецкого флота, содействовали сухопутным войскам и обеспечивали оборону Финского залива."

 RUS_black_sea_focus:0 "Черноморский флот"
 RUS_black_sea_focus_desc:0 "Черноморский флот Российской империи ведёт своё начало от русского военного флота, созданного на Чёрном море после присоединения Крыма к Российской империи из кораблей Азовской и Днепровской военных флотилий. К началу Первой мировой войны в составе Черноморского флота имелось 5 линейных броненосцев, 2 крейсера, 17 эсминцев, 12 миноносцев, 4 ПЛ."

 RUS_ww1_asian_seas_focus:0 "Сибирская военная флотилия"
 RUS_ww1_asian_seas_focus_desc:0 "Сибирская военная флотилия — объединение военных кораблей и судов на Дальнем Востоке России. Существовала с 1731 по 1922год. К 1914 году в состав Сибирской флотилии входили крейсера «Аскольд» и «Жемчуг», канонерская лодка «Манчжур», 8 эскадренных миноносцев, 17 миноносцев и 13 подводных лодок."

 RUS_ww1_newnavalcanons_2:0 "Линейные корабли типа «Императрица Мария»"
 RUS_ww1_newnavalcanons_2_desc:0 "Тип «Императрица Мария» — серия российских линкоров. Были спроектированы в 1910—1911 годах на основе линкоров типа «Севастополь» и предназначались для противостояния новым турецким линкорам на Чёрном море. В 1911—1917 годах были построены три корабля этого типа."

 RUS_ww1_newnavalcanons_3:0 "Развитие орудий флота"
 RUS_ww1_newnavalcanons_3_desc:0 "Корабельная система управления огнем вызвала бурю обсуждений в морском сообществе, благодаря ее способности обеспечить наведение пушек судна на одну и ту же цель. Пусть она и примитивная, но корабли, поддерживающие использование такой системы, пользуются все большей популярностью. Эти новые проекты поставят нас на вершину морского технологического прогресса."

 RUS_ww1_dreadnought_effort:0 "Линейные корабли типа «Севастополь»"
 RUS_ww1_dreadnought_effort_desc:0 "Линейные корабли типа «Севастополь» — Балтийская серия российских линкоров, первые дредноуты российского флота. Проект разработан Балтийским судостроительным заводом в Санкт-Петербурге, под руководством профессора Морской академии И.Г. Бубнова и при участии А.Н. Крылова. Все 4 корабля были заложены в июне 1909 года на верфях Санкт-Петербурга."

 RUS_ww1_flexible_navy:0 "Гибкость военно-морского флота"
 RUS_ww1_flexible_navy_desc:0 "Новая тактика ведения войны на море с учетом применения подводных лодок позволит эффективнее наносить удары по вражеским конвоям."

 RUS_ww1_large_navy:0 "Большой военно-морской флот"
 RUS_ww1_large_navy_desc:0 "Включение крупных судов в нашу доктрину морской войны и обеспечение безопасности торговых конвоев покажет, какие типы кораблей нам нужнее всего."

 RUS_ww1_navyreform:0 "Реформы военно-морского флота"
 RUS_ww1_navyreform_desc:0 "Морские сражения выигрывают не только орудия и корабли. Даже самое лучшее судно будет бесполезно, если оно не окажется в нужное время в нужном месте. Вложения в развитую систему коммуникаций между судами и портами гарантирует нам, что нужные корабли окажутся в необходимом месте в точное время, а это только упрочит наше морское превосходство."

 RUS_ww1_submarine_effort:0 "Подводные лодки типа «Барс»"
 RUS_ww1_submarine_effort_desc:0 "Подводные лодки типа «Барс» — серия российских подводных лодок начала XX века. Всего было построено 24 лодки — эта серия была самой многочисленной из всех российских проектов субмарин тех лет."

 RUS_ww1_cruiser_effort:0 "Бронепалубные крейсера типа «Богатырь»"
 RUS_ww1_cruiser_effort_desc:0 "«Богатырь» — тип бронепалубных крейсеров Российского императорского флота начала XX века. В российском флоте классифицировались как крейсера 1-го ранга. Проект разработан немецкой компанией «Вулкан», которая построила головной крейсер — «Богатырь». Ещё три крейсера были построены в России силами отечественной промышленности — «Олег», «Кагул», «Очаков»."

 RUS_ww1_destroyer_effort:0 "Эскадренные миноносцы типа «Орфей»"
 RUS_ww1_destroyer_effort_desc:0 "Эскадренные миноносцы типа «Орфей» — тип эскадренных миноносцев, принадлежащие первой серии эскадренных миноносцев типа «Новик», и строившиеся по программе «усиленного» судостроения на 1913—1917 годы"

 RUS_ww1_capital_ships_effort:0 "Линейные крейсера типа «Измаил»"
 RUS_ww1_capital_ships_effort_desc:0 "Линейные крейсера типа «Измаил» — тип российских линейных крейсеров первой четверти XX века. Было запланировано построить их 1912—1917 годах, но завершить строительство не удалось. Все 4 корабля были в 1923 годы проданы на слом в Германию"

 RUS_ww1_carrier_focus:0 "Развитие концепции авианосцев"
 RUS_ww1_carrier_focus_desc:0 "Развитие авиации в начале XX века заставило морские ведомства различных стран обратить внимание на возможность применения самолётов в морском военном деле. Общие черты концепции авианосцев были предложены в 1908 году. В России одним из первых гидроавианосецев была «Орлица» 1915 года."

 RUS_ww1_antisubmarine:0 "Американский Голланд"
 RUS_ww1_antisubmarine_desc:0 "Подводные лодки проекта «Американский Голланд» — разработан американской компанией Electric Boat Co. Флот Российской империи в 1916 году заказал у Канады 17 субмарин. Один из представителей этого семейства — АГ-21 участвовала в Великой Отечественной войне, став самой старой лодкой всего Советского ВМФ."
 
 #--------------------------------------------------------------
 
 
 # [RUSSIAN EMPIRE] Political Effort
 #=========================================================================
 RUS_ww1_political_effort:0 "Последствия революции 1905 года"
 RUS_ww1_political_effort_desc:0 "Пришло время перемен. Страна годами успешно управлялась на основе старых принципов, но эти трудные времена требуют правительства, способного им соответствовать. Если мы хотим изменить курс, чтобы противостоять внешней агрессии, политические изменения могут принести пользу только нашей стране и будущему нашего народа."

 RUS_ww1_reject_reforms:0 "Отвергнуть реформы"
 RUS_ww1_reject_reforms_desc:0 "Реформы, предлагаемые нашими противниками, имеют только одну цель — ослабить Империю и Царя. Мы не должны показывать никаких слабостей. Они воспользуются этим, чтобы нанести нам удар ножом в спину."

 RUS_ww1_adopt_reforms:0 "Принять реформы"
 RUS_ww1_adopt_reforms_desc:0 "Империя подвергается нападкам со всех сторон... может быть, нам следует принять некоторые реформы, предлагаемые оппозицией. Если мы ничего не сделаем, мы рискуем увидеть появление революционных движений."

 RUS_ww1_condemn_marxist_ideas:0 "Осудить идеи Маркса"
 RUS_ww1_condemn_marxist_ideas_desc:0 "Идеи Маркса более чем опасны и под видом равенства лишь распространят общественный беспорядок и поставят под сомнение порядок, установленный веками! И вообще, как можно доверять немцу?"

 RUS_ww1_crush_strikes:0 "Подавить забастовки рабочих"
 RUS_ww1_crush_strikes_desc:0 "Жестокие забастовки, вспыхнувшие в последнее время по всей стране, выходят за грани допустимого. Мы должны отправить войска для их подавления!"

 RUS_strengthen_the_constitution:0 "Усилить конституцию"
 RUS_strengthen_the_constitution_desc:0 "Перед лицом политических беспорядков единственным ответом являются надежность и твердость. Несколько наших видных политиков недавно высказались в пользу пересмотра Конституции с целью ее укрепления."

 RUS_ww1_arrest_opposition_leaders:0 "Арестовать лидеров оппозиции"
 RUS_ww1_arrest_opposition_leaders_desc:0 "Нам предоставлены доказательства причастности некоторых политических лидеров к недавним гражданским беспорядкам. Их будет достаточно, чтобы осудить их в суде за государственную измену!"

 RUS_ww1_dissolve_imperial_duma:0 "Распустить Государственную думу"
 RUS_ww1_dissolve_imperial_duma_desc:0 "Это раздражающее собрание, Дума, лишь дало повод для нападок самым яростным реформаторам страны. Но это не успокоило либералов, и она вновь втянута в долгие и бесплодные дебаты. Мы должны издать указ о ее третьем роспуске."

 RUS_ww1_reinforce_tsar_authority:0 "Укрепить самодержавие"
 RUS_ww1_reinforce_tsar_authority_desc:0 "Законная власть царя постоянно подвергается сомнению, мы должны принять решительные меры, чтобы положить этому конец, даже если это означает нажить врагов."

 RUS_ww1_purge_imperial_guard:0 "Чистки в Лейб-гвардии"
 RUS_ww1_purge_imperial_guard_desc:0 "Отчеты внутренней разведки указывают на рост числа неорганизованных офицеров и деструктивных элементов в батальонах Лейб-гвардии. Мы не можем терпеть подобного инакомыслия в войсках, призванных защищать императорский трон!"

 RUS_ww1_discuss_tsar_authority:0 "Обсуждение царской власти"
 RUS_ww1_discuss_tsar_authority_desc:0 "У царя может быть слишком много власти... возможно, нам следует почерпнуть вдохновение у британцев, чтобы усилить власть парламента, пока не стало слишком поздно и империя не рухнула сама собой."

 RUS_ww1_parliamentary_immunity:0 "Депутатская неприкосновенность"
 RUS_ww1_parliamentary_immunity_desc:0 "Если мы хотим коренным образом реформировать Россию и двигаться вперед по пути демократии, то нам необходимо, прежде всего, ограничить репрессивную силу действующей власти. Депутатская неприкосновенность должна быть законодательно закреплена, чтобы каждый депутат мог быть уверен в том, что не подвергнется репрессиям."

 RUS_ww1_fifth_duma:0 "Выборы в пятую Думу"
 RUS_ww1_fifth_duma_desc:0 "С момента последнего роспуска Думы утекло немало воды. Выборы состоялись, и политический ландшафт изменился. Кажется, настало время созвать депутатов и сформировать пятую Думу. Надеюсь, что эту не придется распускать, как предыдущие..."

 RUS_ww1_legitimate_power:0 "Узаконить царскую власть"
 RUS_ww1_legitimate_power_desc:0 "Видимо, получение власти от Бога уже недостаточно в глазах людей. Нам нужно работать над нашей коммуникацией, чтобы найти новые способы легитимации власти."

 RUS_ww1_adopt_marxist_ideas:0 "Принять идеи Маркса"
 RUS_ww1_adopt_marxist_ideas_desc:0 "Труды Маркса и Энгельса продемонстрировали, как растущая индустриализация развитых стран на деле принесла пользу лишь привилегированному классу буржуазии, и взамен значительно обеднила рабочих и крестьян. Эту капиталистическую систему необходимо обуздать! Мы должны ввести элементы идей Маркса в нашу политическую программу."

 RUS_ww1_legitimate_bolsheviks:0 "Консолидация власти большевиками"
 RUS_ww1_legitimate_bolsheviks_desc:0 "Свержение Временного правительства было первым шагом, но эту власть, взятую силой, придется консолидировать, чтобы избежать ее повторного свержения. Необходимо провести ряд реформ для удовлетворения народных требований, а также как можно скорее сформировать правительство и собрание, ответственное за создание новой социалистической республики."

 RUS_ww1_disarm_the_cossacks:0 "Разоружить казаков"
 RUS_ww1_disarm_the_cossacks_desc:0 "Казаки слишком сильны. Мы больше не можем позволять им делать то, что им вздумается — мы должны разоружить их, прежде чем они устроят переворот."

 RUS_ww1_right_of_the_people:0 "Декларация прав народов России"
 RUS_ww1_right_of_the_people_desc:0 "В принятой 2 (15) ноября 1917 года Декларации были провозглашены четыре основные принципа национальной политики: равенство и суверенность, право народов России на свободное самоопределение; отмена всех и всяких национальных ограничений; свободное развитие национальных меньшинств и этнографических групп, населяющих территорию России."

 RUS_export_the_revolution:0 "Распространение революции"
 RUS_export_the_revolution_desc:0 "Этот ключевой девиз коммунистов, который сам по себе передает дух единства и солидарности, движимый людьми, сознающими классовое неравенство: «Пролетарии всех стран, соединяйтесь!». Поэтому мы применим этот принцип буквально и начнем экспортировать революцию, отправляя за границу наших лучших ораторов и политических агитаторов. Социалистическая революция будет мировой, либо ее не будет!"

 RUS_ww1_sovereignist_ethos:0 "Вертикаль власти"
 RUS_ww1_sovereignist_ethos_desc:0 "Что может быть важнее суверенитета нашей страны? Мы не доминион, не колония и не второстепенный игрок, а большая держава. Пришло время подтвердить это на дипломатической арене."

 RUS_ww1_support_kaiser:0 "Укрепить авторитет императора"
 RUS_ww1_support_kaiser_desc:0 "Кайзер Вильгельм II был здравомыслящим человеком, построившим сильное и ответственное немецкое государство. Кто знает, что произойдет, если его отстранят от власти? Мы должны поддержать немецкого лидера."

 RUS_ww1_contest_kaiser:0 "Поддать сомнению авторитет императора"
 RUS_ww1_contest_kaiser_desc:0 "Кайзер Вильгельм II стар, даже дряхл! Его решения становятся все более непредсказуемыми, и он привел с собой целую клику генералов оперетты, жаждущих власти и завоеваний. Они не перестанут хотеть вести войну. Необходимо инициировать ряд внутриполитических акций, чтобы подорвать его авторитет."

 RUS_ww1_internationalism_focus:0 "Интернационализм"
 RUS_ww1_internationalism_focus_desc:0 "Коммунистическую революцию остановить невозможно. Хорошо, что наш народ принимает это, и немедленно, а не путем гражданской войны. Когда мы начнем демонстрировать свою поддержку Интернациональному Коммунистическому Движению, мы будем такими же красными, как кровь людей."

 RUS_ww1_militarism:0 "Милитаризм"
 RUS_ww1_militarism_desc:0 "Наши военные силы становятся все более неотъемлемой частью повседневной жизни нашей страны. К счастью, народная поддержка сейчас на стороне наших солдат, поскольку люди видят в них героев, сражающихся под нашими знаменами. Эта военная культура, которую мы собираемся создать, послужит делу наших вооруженных сил."

 RUS_ww1_indoctrination_focus:0 "Идеологическая обработка"
 RUS_ww1_indoctrination_focus_desc:0 "После многих лет дебатов о том, как заручиться поддержкой граждан для нашего замечательного нового режима, некоторые члены Рабочего совета предложили создать новое «Министерство любви», которое официально убедило бы людей поддержать наше правительство. Мы не будем здесь говорить о том, что будет происходить неофициально в этом министерстве..."

 RUS_ww1_political_commissars:0 "Политкомиссары"
 RUS_ww1_political_commissars_desc:0 "Как это ни парадоксально, армия является местом, где процветают антинациональные настроения. Обеспечивая нашему правительству наблюдение за всем, мы можем отслеживать эти группы подстрекателей и не допускать их роста."

 RUS_ww1_paramilitarism:0 "Парамилитаризм"
 RUS_ww1_paramilitarism_desc:0 "Некоторые страны настолько глупы, что осуждают вооруженные формирования, опасаясь восстаний. Однако если мы будем достаточно осторожны и ограничим их сторонниками режима, мы сможем создать еще одну группу разгневанных вооруженных людей, которые смогут поддержать нашу нацию. Это пригодится нам в случае войны."

 RUS_ww1_political_correctness:0 "Политкорректность"
 RUS_ww1_political_correctness_desc:0 "Давайте назначим интеллектуалов, приближенных к власти, чтобы они внимательно следили за информационными агентствами... и следили за тем, чтобы каждый текст не носил подрывной характер."

 RUS_ww1_military_youth:0 "Милитаризация молодежи"
 RUS_ww1_military_youth_desc:0 "Наша милитаристская культура должна присутствовать и в наших детях! Проявляя уважение к военным и обеспечивая подготовку молодого поколения, мы можем быть уверены, что они вырастут и пойдут служить нашему славному режиму. Некоторые могут назвать это эксплуатацией... но звучит лучше, когда вы говорите, что даете подросткам светлое будущее."

 RUS_ww1_student_movement_focus:0 "Студенческое движение"
 RUS_ww1_student_movement_focus_desc:0 "Университеты и студенческие лиги полны молодых, энергичных людей, жаждущих борьбы или распространения новых политических идей. Не составит большого труда разместить агентов в нужных сетях, чтобы направить всю эту энергию в нужное русло!"

 RUS_ww1_monarchy:0 "Закручивание гаек"
 RUS_ww1_monarchy_desc:0 "Полномочия, осуществляемые парламентом и народом, могут быть опасными. Единственный реальный способ сохранить контроль над страной, особенно в такие трудные времена, — это занять в целом твердую позицию и управлять страной так, как следует."

 RUS_ww1_democracy:0 "Либеральные реформы"
 RUS_ww1_democracy_desc:0 "Говорят, что любой лидер черпает свою власть из народа. Если мы сделаем шаг к более демократическому обществу, даже если мы на самом деле таковым не станем, мы, по крайней мере, сможем занять лучшую позицию для ведения переговоров с демократическими странами по всему миру."

 RUS_ww1_centralizedpower:0 "Бюрократия"
 RUS_ww1_centralizedpower_desc:0 "Удваивая число государственных служащих, мы укрепляем нашу способность контролировать и регулировать все наше правительство и гарантируем, что ничто не ускользнет от нашего контроля. Усилия страны будут использованы гораздо эффективнее. И тогда это заставит работать национальную бумажную промышленность..."

 RUS_ww1_freespeech:0 "Свобода слова"
 RUS_ww1_freespeech_desc:0 "Времена меняются, и мы должны показать, что не боимся противоречий. Мы должны подписать указ, разрешающий издание газет, которые сейчас не одобряются цензурным комитетом."

 RUS_ww1_reorganization_act:0 "Закон о реорганизации"
 RUS_ww1_reorganization_act_desc:0 "Военно-промышленный аппарат страдает от своей устарелости и распыления усилий. Наш министр экономики предложил амбициозный план реорганизации наших производственных мощностей."

 RUS_ww1_leave_central_power:0 "Покинуть Центральные державы"
 RUS_ww1_leave_central_power_desc:0 "Что могло побудить нас присоединиться к этому Тройственному союзу? Ясно, что это идет совсем не в нашем направлении и даже угрожает нашим интересам на нашей западной границе. Нам следовало бы объединиться с французами и англичанами. Давайте немедленно покинем Австро-Германский союз."

 RUS_ww1_limited_rearmament:0 "Ограниченное перевооружение"
 RUS_ww1_limited_rearmament_desc:0 "Для надлежащего снабжения нашей армии военными материалами требуются большие инвестиции и реквизиции. Конечно, при ограниченном пайке гражданские лица все равно смогут развлекаться — вероятно, за счет военных."

 RUS_ww1_full_rearmament:0 "Полное перевооружение"
 RUS_ww1_full_rearmament_desc:0 "Кто может предсказать будущее и сказать, что войны прекратятся? Мы должны обеспечить, чтобы наши силы были достаточны для решения стоящей перед нами задачи."

 RUS_ww1_unitedpeople:0 "Патриотический подъём"
 RUS_ww1_unitedpeople_desc:0 "От берегов Балтики до пляжей Тихого океана Российская империя объединяет десятки народов с разным происхождением и устремлениями. Мы должны лучше объединить эту гигантскую территорию, объединив ее население под одним знаменем."

 RUS_ww1_massive_effort:0 "Национальное единство"
 RUS_ww1_massive_effort_desc:0 "Каждый мужчина и каждая женщина должны помочь национальному усилию! Поскольку призрак мировой войны все ближе надвигается, была реализована крупная экономическая программа, направленная на развитие нашего промышленного потенциала и оказание нам помощи в борьбе с нашими ненавистными соперниками."

 RUS_ww1_fortify_city:0 "Оборона приграничных областей"
 RUS_ww1_fortify_city_desc:0 "Ход войны может измениться неприятно быстро, а фронт может двигаться еще быстрее. Было бы полезно мобилизовать группы праздных граждан для строительства оборонительных сооружений в определенных местах, и это сэкономило бы время для инженерных войск."

 RUS_ww1_fortify_coast:0 "Оборона побережья"
 RUS_ww1_fortify_coast_desc:0 "Берег защищать нелегко. Теперь, когда есть корабли, способные высадить десант практически в любой точке нашего побережья, прибрежные форты не станут слишком серьезным препятствием, чтобы отбросить наших врагов обратно в море."

 RUS_ww1_install_communism:0 "Пролетарская революция"
 RUS_ww1_install_communism_desc:0 "Рабочие — движущая сила социальных и промышленных изменений! Пришло время эксплуатируемым, угнетенным, изгоям, тем, у кого нет ничего, кроме силы рук и хватки, взять свое будущее в собственные руки! Мы должны организовать пролетарскую революцию в нашей собственной стране в широких масштабах!"

 RUS_ww1_install_democracy:0 "Свободные выборы"
 RUS_ww1_install_democracy_desc:0 "Власть всегда исходит от народа. Организация свободных выборов, по крайней мере, создаст иллюзию прямой демократии и надлежащего представительства граждан, а также придаст нашему правительству легитимность, которой ему не хватало."

 RUS_ww1_oppression_minorities:0 "Угнетать меньшинства"
 RUS_ww1_oppression_minorities_desc:0 "Это известный прием, но он все еще работает... назначение козла отпущения помогает отвлечь внимание от разгневанных элементов. Все, что вам нужно сделать, это профинансировать хорошую, яростную кампанию в прессе..."

 RUS_ww1_make_concessions:0 "Сделать уступки"
 RUS_ww1_make_concessions_desc:0 "Уступка некоторым требованиям не потребовала бы больших политических или финансовых усилий... и, с другой стороны, позволила бы правительству создать более позитивный имидж"


 #--------------------------------------------------------------

 # [RUSSIAN EMPIRE] Diplomatic Effort
 #=========================================================================

 RUS_ww1_diplomatic_effort:0 "Министерство иностранных дел"
 RUS_ww1_diplomatic_effort_desc:0 "В наше время сложно сказать, к чему приведут нынешние события в мире. Дипломаты уже засыпали нас вопросами о том, будем ли мы участвовать в грядущей битве за власть в мире, или же мы полностью отстранимся. А пока правительство раздумывает, у нас есть возможность подготовиться к различным сценариям, расширив штат дипломатов."

 RUS_ww1_assert_position_east:0 "Отстаивать позицию на Востоке"
 RUS_ww1_assert_position_east_desc:0 "Слишком часто мы склонны считать, что сибирские территории — это Дальний Восток, оторванный от Российской империи, где законы не действуют и где наши намерения неясны. Пришло время это изменить и пересмотреть нашу политику на берегах Тихого океана."

 RUS_ww1_BalkansPolitics:0 "Политика на Балканах"
 RUS_ww1_BalkansPolitics_desc:0 "Балканы — это регион, который уже несколько десятилетий привлекает наше внимание, поскольку там проживает большое количество славянских народов, разделяющих наши интересы и культуру. Нам следует направить нашу внешнюю политику на продолжение усилий в этой области."

 RUS_ww1_ApeasementBalkans:0 "Умиротворение Балкан"
 RUS_ww1_ApeasementBalkans_desc:0 "На Балканах уже было много войн, но пользы от них было очень мало. Когда пушки не достигают цели, можно с уверенностью сказать, что хороший дипломатический банкет с большей вероятностью увенчается успехом, причем за гораздо меньшие деньги. Настало время проявить нам миролюбие."

 RUS_ww1_rom:0 "Сближение с Румынией"
 RUS_ww1_rom_desc:0 "Румыны за последние годы проявили себя и продемонстрировали мирные намерения по отношению к нам. Мы должны отправить к ним делегацию и подписать декларацию о дружбе."

 RUS_ww1_oirganization_realm:0 "Провозгласить Царство"
 RUS_ww1_oirganization_realm_desc:0 "Наша империя консервативна, но мы можем поддерживать имперский режим, оставаясь эффективными. Если мы предпримем правильные шаги по упрощению нашей внутренней организации, наша гражданская и экономическая жизнь от этого выиграет."

 RUS_ww1_fortify_russian_borders:0 "Укрепления российских границ"
 RUS_ww1_fortify_russian_borders_desc:0 "Немыслимо укрепить все границы России, учитывая абсурдное количество километров, которые необходимо преодолеть. Однако мы уже можем начать строительство нескольких крепостей, размещенных в нужных местах, что позволит нам контролировать большие территории."

 RUS_ww1_airport_russian_borders:0 "Строить аэропорты вблизи границ"
 RUS_ww1_airport_russian_borders_desc:0 "Нам необходимо инвестировать в строительство аэродромов вблизи наших границ. Это будет полезно не только для гражданских перевозок, но и в случае войны у наших эскадрилий будут аэродромы, готовые подняться в небо."

 RUS_ww1_fortify_italian_borders:0 "Укрепления итальянских границ"
 RUS_ww1_fortify_italian_borders_desc:0 "Границы Королевства Италия необходимо укрепить, поскольку на данный момент они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."

 RUS_ww1_fortify_bosnia_borders:0 "Укрепления на Балканах"
 RUS_ww1_fortify_bosnia_borders_desc:0 "Границы на Балканах необходимо укрепить, поскольку сейчас они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."

 RUS_ww1_fortify_coast_dalmatia:0 "Укрепления в Далмации"
 RUS_ww1_fortify_coast_dalmatia_desc:0 "Побережье Далмации необходимо укрепить, поскольку сейчас они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."

 RUS_ww1_ready_country:0 "Пропагандировать военную службу"
 RUS_ww1_ready_country_desc:0 "Армии не хватает винтовок, грузовиков, формы, но больше всего — новобранцев. Молодые россияне больше не заинтересованы в военной службе, поэтому мы должны призывать добровольцев и публиковать пропагандистские изображения, призывающие их выполнить свой долг перед Родиной."

 RUS_ww1_military_harmonization:0 "Сбалансировать армию"
 RUS_ww1_military_harmonization_desc:0 "Одной из причин хронической неэффективности наших сил является огромная разница в ресурсах и целях между различными армиями. Если мы хотим изменить ситуацию, мы должны четко пересмотреть наши военные цели и обеспечить, чтобы флот, армия, а также летчики направляли свои усилия в этом направлении. И, наконец, мы должны инвестировать значительные ресурсы в поддержку их развития."

 RUS_ww1_balkans_policy:0 "Балканская стратегия"
 RUS_ww1_balkans_policy_desc:0 "Балканы называют «Пороховой бочкой Европы». И это не зря. В любой момент там может вспыхнуть война. Нам нужно попробовать остудить пыл балканских государств, которые так и ждут, чтобы перегрызть друг другу глотки."

 RUS_ww1_balkans_policy_intervene:0 "Реакция на Балканскую войну"
 RUS_ww1_balkans_policy_intervene_desc:0 "Балканы снова в огне, а сербы враждуют с греками и болгарами! Мы поддерживаем их требования, и пришло время подтвердить это открыто, особенно перед лицом османов, которые уже точат свое оружие, чтобы воспользоваться ситуацией."

 RUS_ww1_pro_fra:0 "Поддержать франко-русский союз"
 RUS_ww1_pro_fra_desc:0 "Франция для Российской империи была крайне важным союзником против расширения влияния Германии. Франко-русский союз — военно-политический союз России и Франции, который был основным вектором внешней политики двух государств в 1891—1917 годах и предшествовал созданию тройственной Антанты."

 RUS_ww1_friend_with_auh:0 "Соглашение с Австро-Венгрией"
 RUS_ww1_friend_with_auh_desc:0 "Это потребовало времени и денег, но мы наконец достигли нового соглашения, которое на время разрешит наши разногласия с австрийцами. Если мы подпишем его сейчас, это должно на некоторое время успокоить наши отношения."

 RUS_balkan_corridor:0 "Балканский коридор"
 RUS_balkan_corridor_desc:0 ""

 RUS_ww1_restore_russia_glory:0 "Восстановить былую славу России"
 RUS_ww1_restore_russia_glory_desc:0 "Было время, когда царские легионы наводили страх на обе стороны Евразии, время, когда Россия была титаном, которого нельзя было игнорировать! Пришло время взять на вооружение политику полной власти и вселить страх в нашу нацию. Мы покроем славой престол Петербурга!"

 RUS_triumph_of_orthodoxy:0 "Торжество православия"
 RUS_triumph_of_orthodoxy_desc:0 ""

 RUS_wilhlems_deal:0 "Соглашение с Вильгельмом II"
 RUS_wilhlems_deal_desc:0 "Для дальнейшего процветания России нужно пойти на союз с Германией. Не так давно были попытки заключения русско-германского союза. А именно — Бьеркский договор, секретный русско-германский союзный договор, который был подписан во время встречи императора Николая II с германским императором Вильгельмом II в 1905 году у балтийского острова Бьерке."

 RUS_invest_in_poland:0 "Инвестировать в Польшу"
 RUS_invest_in_poland_desc:0 ""

 RUS_invest_in_ukraine:0 "Инвестировать в Украину"
 RUS_invest_in_ukraine_desc:0 ""

 RUS_around_manchuria:0 "Инвестировать в Приамурье"
 RUS_around_manchuria_desc:0 "Губернии Приамурского генерал-губернаторства нуждаются в инвестициях для развития этих регионов. Нужно немедленно заняться этим вопросом."

 RUS_ww1_friend_with_romania:0 "Улучшить отношения с Румынией"
 RUS_ww1_friend_with_romania_desc:0 "У нас не очень хорошие отношения с Румынией из-за ряда территориальных разногласий. И это несмотря на то, что Россия помогла Румынии обрести независимость. Нам нужно улучшить отношения с этой страной."

 RUS_ww1_EmbargoUK:0 "Объявить эмбарго Великобритании"
 RUS_ww1_EmbargoUK_desc:0 "Соединённое королевство всегда лезло не в свои дела. Нашей огромности боятся. Мы должны наложить на них санкции, что бы они осознали свои ошибки!"

 RUS_ww1_JoinCentralPowers:0 "Нож в спину"
 RUS_ww1_JoinCentralPowers_desc:0 "Вероятно, это будет расценено как величайшее геополитическое предательство этого столетия, но мы должны быть прагматичны. В краткосрочной и среднесрочной перспективе нас интересуют только Центральные державы."

 RUS_ww1_reinforce_western_forts:0 "Укрепить западные границы"
 RUS_ww1_reinforce_western_forts_desc:0 "Самая большая угроза исходит с Запада. Именно на этой границе империи мы должны сосредоточить большую часть дивизий.

 RUS_contain_germany:0 "Сдерживать Германию"
 RUS_contain_germany_desc:0 ""

 RUS_annex_northern_persia:0 "Оккупировать Северную Персию"
 RUS_annex_northern_persia_desc:0 ""

 RUS_russify_finland:0 "Русификация Финляндии"
 RUS_russify_finland_desc:0 "Если мы хотим, чтобы финны перестали бросать вызов нашей власти, мы должны ассимилировать их в русскую культуру. В краткосрочной перспективе это может создать напряженность, но в долгосрочной перспективе Финляндия может стать просто еще одним российским регионом."

 RUS_ww1_leave_entente:0 "Покинуть Антанту"
 RUS_ww1_leave_entente_desc:0 "По правде говоря, франко-британцы не более надежны, чем австро-германские, и нет никаких гарантий, что они будут заботиться о наших интересах. Мы должны выйти из Антанты. Если они так стремятся разорвать друг друга на части вместе со своими ближайшими соседями, то это хорошо для них."

 RUS_guarantee_serbia:0 "Гарантировать независимость Сербии"
 RUS_guarantee_serbia_desc:0 "Сербов необходимо защитить от аппетитов итальянцев, австрийцев или кого-либо еще. Эта страна не может уйти от нас; поэтому мы должны гарантировать их независимость. Так что остерегайтесь тех, кто попытается завоевать эту маленькую страну."

 RUS_ww1_add_fuel_to_the_fire:0 "Искра в пороховой бочке"
 RUS_ww1_add_fuel_to_the_fire_desc:0 "Противоречия двух враждебных блоков особенно острые на Балканах, которые уже давно именовали пороховой бочкой Европы. Главными претендентами на роль хозяев этого региона были Россия и Австро-Венгрия. И вот теперь искра брошена в пороховую бочку, вместе с убийством австрийского эрцгерцога Франца Фердинанда."

 RUS_ww1_support_serbia:0 "Православное братство"
 RUS_ww1_support_serbia_desc:0 "Если у нас и есть что-то общее с сербами, так это религия! Наши православные братья должны быть поставлены под нашу эгиду. Давайте пригласим их присоединиться к нашему братству."

 RUS_fight_sweden_gotland:0 "Претензия на Готланд"
 RUS_fight_sweden_gotland_desc:0 "Остров Готланд — это всего лишь голая скала в морских брызгах, но скала, на которой можно приземлять самолеты и устанавливать пушки! Даже военно-морская база, более чем полезная для любого военного флота, достойного этого названия. Мы должны официально заявить об этой позиции, чтобы она в один прекрасный день не стала для нас прямой угрозой."

 RUS_european_focus:0 "Западный акцент"
 RUS_european_focus_desc:0 "Наша страна — самая большая в мире, но именно в Европе находятся наши главные интересы и наши главные союзники. Это регион, которому следует уделить приоритетное внимание."

 RUS_ww1_scandinavia_focus:0 "Политика в Скандинавии"
 RUS_ww1_scandinavia_focus_desc:0 "Географическая близость скандинавов делает этот вопрос для нас центральным, равно как и стратегическая и экономическая конкуренция за контроль над железом, нефтью и древесиной. Мы должны приблизиться к этим странам, сохраняя при этом значительные средства сдерживания в этом регионе."

 RUS_asian_focus:0 "Отстаивать позиции России в Азии"
 RUS_asian_focus_desc:0 "После поражения от Японии в Русско-японской войне 1904-1905 годов, Россия значительно потеряла влияние в Азии. Нужно усилить здесь наши позиции."

 RUS_ww1_treaty_portsmouth:0 "Аннулировать Портсмутский договор"
 RUS_ww1_treaty_portsmouth_desc:0 "Портсмутский мирный договор — договор между Российской империей и Японией, завершивший русско-японскую войну 1904—1905 годов. За этим договором Россия потеряла Порт-Артур и Дальний, юг Сахалина. Пора вернуть утраченые территории и наше влияние в Азии."

 RUS_annex_manchurian_sphere:0 "Оккупировать Маньчжурию"
 RUS_annex_manchurian_sphere_desc:0 "Маньчжурия — регион, который отделяет Российскую империю от Японской империи. Пора нам оккупировать Маньчжурию и вернуть себе Порт-Артур и порт Дальний, которые Россия потеряла после прошлой войны."

 RUS_ww1_friend_with_jap:0 "Наладить отношения с Японией"
 RUS_ww1_friend_with_jap_desc:0 "Русско-японская война сильно пошатнула русско-японские отношения, но современные обстоятельства на мировой политической арене вынуждают нас пойти на зближение с Японией."

 RUS_reinforce_vladivostok:0 "Укрепить Владивосток"
 RUS_reinforce_vladivostok_desc:0 "Вероятность новой Русско-японской войны достаточно велека. Мы должны укрпеить Владивосток и восстановить Сибирскую военную флотилию, которая сильно пострадала после Цусимского сражения."

 RUS_mongolian_protectorate:0 "Монгольский протекторат"
 RUS_mongolian_protectorate_desc:0 "Одним из важных геополитических результатов Синьхайской революции для России стало провозглашение независимости Внешней Монголии. Малозаселённая, но обширная Монголия стала важным буферным государством между Российской империей и Китаем."

 RUS_ww1_Xinhai_Revolution_Opportunity:0 "Извлечь выгоду из Синьхайской революции"
 RUS_ww1_Xinhai_Revolution_Opportunity_desc:0 "Революция, которая только что началась в Китае, потрясает власть императора! Восстания в Учане уже стали кровавыми. Западное вмешательство лишь придало последний импульс обществу, которое уже было подорвано до основания инерцией, коррупцией и политическими беспорядками. Мы должны заняться этим вопросом и воспользоваться возможностями, которые открываются сейчас, потому что наши конкуренты не будут ждать!"

 RUS_ww1_polish_corps:0 "Сформировать польский корпус"
 RUS_ww1_polish_corps_desc:0 "В России живет много поляков, и многие поляки хотят воевать против немцев, хотя у них нет своей страны! Нам по-прежнему нужны люди: давайте сформируем чисто польский легион, состоящий из добровольцев и офицеров этой общины. Они будут сражаться с еще большей силой и сплоченностью."
 
 RUS_ww1_support_serbia_weapons:0 "Поддержать Сербию оружием"
 RUS_ww1_support_serbia_weapons_desc:0 "Сербы упорно сражаются, но им не хватает оружия и боеприпасов. Нам нужно отправить им несколько партий вооружений, иначе они будут истощены через несколько месяцев."
 
 RUS_ww1_invest_west:0 "Инвестировать в западные губернии"
 RUS_ww1_invest_west_desc:0 "Губернии Привислинского края, Малороссии и Новороссии нуждаются в инвестициях для развития этих регионов. Нужно немедленно заняться этим вопросом."
 
 RUS_ww1_defy_germany:0 "Бросить вызов Германии"
 RUS_ww1_defy_germany_desc:0 "Германия — молодая страна, настоящий новичок в дипломатии, которому не следует недооценивать своего более могущественного соседа! Пришло время бросить вызов их амбициям: либо они поклонятся нам, либо они встретятся с нами лицом к лицу... на поле боя!"
 
 RUS_ww1_avenge_fall_constantinople:0 "Вернуться к Греческому проекту"
 RUS_ww1_avenge_fall_constantinople_desc:0 "Греческий проект — геополитический проект Екатерины II, предполагавший сокрушение Османской империи и раздел её территории между Россией, Священной Римской империей и Венецианской республикой. В Константинополе предполагалось возродить Византийскую державу во главе с внуком российской императрицы, которому было дано имя основателя города — Константин."

 RUS_ww1_extension_of_the_putilov_factory:0 "Расширение Путиловского завода"
 RUS_ww1_extension_of_the_putilov_factory_desc:0 "На Путиловском заводе необходимо начать конструирование и производство новых моделей бронетехники для нашей армии."

 kis_tsarnicholasabdicated:0 "Царь отрекся от престола"
 kis_brestlitovsk:0 "Брест-Литовский мирный договор"
 kis_Rasputin_Murdered:0 "Распутин убит"

 RUS_ww1_Tungsten_Nerchinsk:0 "Искать вольфрам рядом с Нерчинском"
 RUS_ww1_Tungsten_Nerchinsk_desc:0 "Выделить средства на прокладку грунтовой дороги от месторождений вольфрамовых руд в Нерчинском округе до Забайкальской железной дороги"
 
 RUS_ww1_Reinforce_Northern_Persia:0 "Инвестировать в Северную Персию"
 RUS_ww1_Reinforce_Northern_Persia_desc:0 "Некоторые из наших ведущих промышленников предлагают нам вложить часть капитала в персидские территории. Это печально известная слаборазвитая и архаичная страна, но с богатыми землями. Это определенно будет хорошей инвестицией."

 RUS_ww1_Support_Persia_Convention:0 "Поддержать Конвенцию 1907 года"
 RUS_ww1_Support_Persia_Convention_desc:0 "Англо-русская конвенция была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору о Персии. Соединенное Королевство пообещало держаться подальше от северной Персии, а Россия признала южную Персию частью британской сферы влияния."
 
 RUS_ww1_Revoke_Persia_Convention:0 "Отменить Конвенцию 1907 года"
 RUS_ww1_Revoke_Persia_Convention_desc:0 "Англо-русская конвенция была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору о Персии. Соединенное Королевство пообещало держаться подальше от северной Персии, а Россия признала южную Персию частью британской сферы влияния."

 RUS_ww1_Persian_Cossack_Brigade:0 "Усилить персидскую казачью бригаду"
 RUS_ww1_Persian_Cossack_Brigade_desc:0 "Персидская казачья бригада — кавалерийское подразделение казачьего типа, сформированное в 1879 году в Персии. Создано по образцу кавказских казачьих полков Российской императорской армии и сегодня является элитным подразделением. Мы должны мобилизовать эту силу и превратить ее в полицейское подразделение."
 
 RUS_ww1_Puppet_Persia:0 "Оккупировать Северную Персию"
 RUS_ww1_Puppet_Persia_desc:0 "Северная Персия погружается в анархию, и нет недостатка в веских причинах для оккупации страны. Ну, только северный регион... и в конце концов, если мы этого не сделаем, то об этом позаботятся британцы!"

 RUS_ww1_Russian_Influence_over_Persia:0 "Тегеранское трансграничное соглашение"
 RUS_ww1_Russian_Influence_over_Persia_desc:0 "Мы подготовили соглашение с шахом Персии. Это касается территориальных, экономических, финансовых вопросов... и позволит нам назначать нужных нам людей на ключевые должности, чтобы наше влияние ощущалось по всей Персии. Мы с ними легко справимся."

 RUS_ww1_Militarize_NorthenPersia:0 "Милитаризировать Северную Персию"
 RUS_ww1_Militarize_NorthenPersia_desc:0 "Персия продолжает слабеть, и у них не будет никаких шансов противостоять нам, когда мы направим туда воинские части для защиты российских интересов."

 RUS_ww1_RussoTurkishBorder:0 "Укрепить российско-турецкую границу"
 RUS_ww1_RussoTurkishBorder_desc:0 "Мы не забыли недавние конфликты между нами и турками, и, несмотря на прошедшие годы, ничего не было решено. Будем иметь в виду, что их границы проницаемы как в одном направлении, так и в другом. Нам необходимо укрепить границу, отделяющую нас от них, разместив там больше армейских подразделений."
 
 RUS_ww1_AzerbaijanisRights:0 "Признать азербайджанский народ"
 RUS_ww1_AzerbaijanisRights_desc:0 "Мы уже пытались захватить Азербайджан, но безуспешно. Мы должны признать их независимость и свободу, сделать их союзниками на нашей южной границе."
 
 RUS_ww1_CaucasusFocus:0 "Обратить внимание на Кавказ"
 RUS_ww1_CaucasusFocus_desc:0 "Недавние геологоразведочные кампании на Кавказе подчеркивают, что со временем этот регион будет становиться все более интересным, поскольку он богат не только плодородными сельскохозяйственными землями, но и нефтяными скважинами. Мы должны отдать этому региону главный приоритет для наших инвестиций и строительных работ."

 RUS_ww1_BakuInvest:0 "Инвестировать в Баку"
 RUS_ww1_BakuInvest_desc:0 "Баку полон нефти! Мы должны быстрее освоить регион, потому что наши потребности в черном золоте только растут."