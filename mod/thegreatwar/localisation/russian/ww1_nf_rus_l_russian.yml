l_russian:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 RUS_ww1_army_effort: "Русская императорская армия"
 RUS_ww1_army_effort_desc: "Создана царём (позднее, императором) Петром I. Заменила иррегулярные поместные войска и стрелецкие полки. С 1699 года армия формировалась на основе рекрутской повинности, с 1874 года — на основе всеобщей воинской обязанности."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 RUS_ww1_form_air_force: "Российский императорский военно-воздушный флот"
 RUS_ww1_form_air_force_desc: "Существовал в 1885-1917 годах. Несмотря на свою короткую историю сыграл значительную роль в развитии мировой авиации."
 RUS_ww1_aviation_effort_2: "Cамолеты Сикорского"
 RUS_ww1_aviation_effort_2_desc: "Игорь Иванович Сикорский — великий российский авиаконструктор, учёный, изобретатель, философ. Создатель первых в мире: четырёхмоторного самолёта «Русский витязь» (1913 год), тяжёлого четырёхмоторного бомбардировщика и пассажирского самолета «Илья Муромец» (1914 год). Во время Гражданской Войны эмигрировал в США и в 1942 году разработал первый серийный вертолет."
 RUS_ww1_aviation_effort_4: "Подписать контракт с РБВЗ"
 RUS_ww1_aviation_effort_4_desc: "Русско-Балтийский вагонный завод — акционерное машиностроительное предприятие Российской империи. Первоначально завод располагался в Риге, но ввиду Первой мировой войны осенью 1915 года был эвакуирован в Тверь, Москву и Петроград. Всего за период 1912—1917 заводом было выпущено 240 самолётов различных типов. Главным авиаконструктором с 1912 года был Игорь Сикорский."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================
 RUS_ww1_airfield_expansion_1: "Военно-полевой аэродром в Гатчине"
 RUS_ww1_airfield_expansion_1_desc: "Военно-полевой аэродром в Гатчине — первый военный аэродром России. Построен в 1909 году."
 RUS_ww1_extra_tech_slot_2: "Расширить Академию наук"
 RUS_ww1_extra_tech_slot_2_desc: "Петербургская академия наук, а с 1917 года — Российская академия наук, давала России выдающихся учёных и исследователей. Они вносили огромный вклад в развитие России."
#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 RUS_ww1_naval_effort: "Российский императорский флот"
 RUS_ww1_naval_effort_desc: "Российский императорский флот — наименование военно-морского флота Российской империи с 1721 по 1917 годы. К началу русско-японской войны 1904-1905 годов — третий в мире флот по боевой мощи (после флотов Великобритании и Франции)."
 RUS_ww1_european_seas_focus: "Балтийский флот"
 RUS_ww1_european_seas_focus_desc: "Датой основания Балтийского флота принято считать 18 мая 1703 года. В годы Первой мировой войны корабли Балтийского флота проводили минно-заградительные операции (поставлено 35 тыс. мин), а также действовали на коммуникациях немецкого флота, содействовали сухопутным войскам и обеспечивали оборону Финского залива."
 RUS_ww1_asian_seas_focus: "Сибирская военная флотилия"
 RUS_ww1_asian_seas_focus_desc: "Сибирская военная флотилия — объединение военных кораблей и судов на Дальнем Востоке России. Существовала с 1731 по 1922год. К 1914 году в состав Сибирской флотилии входили крейсера «Аскольд» и «Жемчуг», канонерская лодка «Манчжур», 8 эскадренных миноносцев, 17 миноносцев и 13 подводных лодок."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 RUS_ww1_political_effort: "Последствия революции 1905 года"
 RUS_ww1_political_effort_desc: "Пришло время перемен. Страна годами успешно управлялась на основе старых принципов, но эти трудные времена требуют правительства, способного им соответствовать. Если мы хотим изменить курс, чтобы противостоять внешней агрессии, политические изменения могут принести пользу только нашей стране и будущему нашего народа."
 RUS_ww1_reject_reforms: "Отвергнуть реформы"
 RUS_ww1_reject_reforms_desc: "Реформы, предлагаемые нашими противниками, имеют только одну цель — ослабить Империю и Царя. Мы не должны показывать никаких слабостей. Они воспользуются этим, чтобы нанести нам удар ножом в спину."
 RUS_ww1_adopt_reforms: "Принять реформы"
 RUS_ww1_adopt_reforms_desc: "Империя подвергается нападкам со всех сторон... может быть, нам следует принять некоторые реформы, предлагаемые оппозицией. Если мы ничего не сделаем, мы рискуем увидеть появление революционных движений."
 RUS_ww1_condemn_marxist_ideas: "Осудить идеи Маркса"
 RUS_ww1_condemn_marxist_ideas_desc: "Идеи Маркса более чем опасны и под видом равенства лишь распространят общественный беспорядок и поставят под сомнение порядок, установленный веками! И вообще, как можно доверять немцу?"
 RUS_ww1_crush_strikes: "Подавить забастовки рабочих"
 RUS_ww1_crush_strikes_desc: "Жестокие забастовки, вспыхнувшие в последнее время по всей стране, выходят за грани допустимого. Мы должны отправить войска для их подавления!"
 RUS_strengthen_the_constitution: "Усилить конституцию"
 RUS_strengthen_the_constitution_desc: "Перед лицом политических беспорядков единственным ответом являются надежность и твердость. Несколько наших видных политиков недавно высказались в пользу пересмотра Конституции с целью ее укрепления."
 RUS_ww1_arrest_opposition_leaders: "Арестовать лидеров оппозиции"
 RUS_ww1_arrest_opposition_leaders_desc: "Нам предоставлены доказательства причастности некоторых политических лидеров к недавним гражданским беспорядкам. Их будет достаточно, чтобы осудить их в суде за государственную измену!"
 RUS_ww1_dissolve_imperial_duma: "Распустить Государственную думу"
 RUS_ww1_dissolve_imperial_duma_desc: "Это раздражающее собрание, Дума, лишь дало повод для нападок самым яростным реформаторам страны. Но это не успокоило либералов, и она вновь втянута в долгие и бесплодные дебаты. Мы должны издать указ о ее третьем роспуске."
 RUS_ww1_reinforce_tsar_authority: "Укрепить самодержавие"
 RUS_ww1_reinforce_tsar_authority_desc: "Законная власть царя постоянно подвергается сомнению, мы должны принять решительные меры, чтобы положить этому конец, даже если это означает нажить врагов."
 RUS_ww1_purge_imperial_guard: "Чистки в Лейб-гвардии"
 RUS_ww1_purge_imperial_guard_desc: "Отчеты внутренней разведки указывают на рост числа неорганизованных офицеров и деструктивных элементов в батальонах Лейб-гвардии. Мы не можем терпеть подобного инакомыслия в войсках, призванных защищать императорский трон!"
 RUS_ww1_discuss_tsar_authority: "Обсуждение царской власти"
 RUS_ww1_discuss_tsar_authority_desc: "У царя может быть слишком много власти... возможно, нам следует почерпнуть вдохновение у британцев, чтобы усилить власть парламента, пока не стало слишком поздно и империя не рухнула сама собой."
 RUS_ww1_parliamentary_immunity: "Депутатская неприкосновенность"
 RUS_ww1_parliamentary_immunity_desc: "Если мы хотим коренным образом реформировать Россию и двигаться вперед по пути демократии, то нам необходимо, прежде всего, ограничить репрессивную силу действующей власти. Депутатская неприкосновенность должна быть законодательно закреплена, чтобы каждый депутат мог быть уверен в том, что не подвергнется репрессиям."
 RUS_ww1_fifth_duma: "Выборы в пятую Думу"
 RUS_ww1_fifth_duma_desc: "С момента последнего роспуска Думы утекло немало воды. Выборы состоялись, и политический ландшафт изменился. Кажется, настало время созвать депутатов и сформировать пятую Думу. Надеюсь, что эту не придется распускать, как предыдущие..."
 RUS_ww1_legitimate_power: "Узаконить царскую власть"
 RUS_ww1_legitimate_power_desc: "Видимо, получение власти от Бога уже недостаточно в глазах людей. Нам нужно работать над нашей коммуникацией, чтобы найти новые способы легитимации власти."
 RUS_ww1_adopt_marxist_ideas: "Принять идеи Маркса"
 RUS_ww1_adopt_marxist_ideas_desc: "Труды Маркса и Энгельса продемонстрировали, как растущая индустриализация развитых стран на деле принесла пользу лишь привилегированному классу буржуазии, и взамен значительно обеднила рабочих и крестьян. Эту капиталистическую систему необходимо обуздать! Мы должны ввести элементы идей Маркса в нашу политическую программу."
 RUS_ww1_legitimate_bolsheviks: "Консолидация власти большевиками"
 RUS_ww1_legitimate_bolsheviks_desc: "Свержение Временного правительства было первым шагом, но эту власть, взятую силой, придется консолидировать, чтобы избежать ее повторного свержения. Необходимо провести ряд реформ для удовлетворения народных требований, а также как можно скорее сформировать правительство и собрание, ответственное за создание новой социалистической республики."
 RUS_ww1_disarm_the_cossacks: "Разоружить казаков"
 RUS_ww1_disarm_the_cossacks_desc: "Казаки слишком сильны. Мы больше не можем позволять им делать то, что им вздумается — мы должны разоружить их, прежде чем они устроят переворот."
 RUS_ww1_right_of_the_people: "Декларация прав народов России"
 RUS_ww1_right_of_the_people_desc: "В принятой 2 (15) ноября 1917 года Декларации были провозглашены четыре основные принципа национальной политики: равенство и суверенность, право народов России на свободное самоопределение; отмена всех и всяких национальных ограничений; свободное развитие национальных меньшинств и этнографических групп, населяющих территорию России."
 RUS_export_the_revolution: "Распространение революции"
 RUS_export_the_revolution_desc: "Этот ключевой девиз коммунистов, который сам по себе передает дух единства и солидарности, движимый людьми, сознающими классовое неравенство: «Пролетарии всех стран, соединяйтесь!». Поэтому мы применим этот принцип буквально и начнем экспортировать революцию, отправляя за границу наших лучших ораторов и политических агитаторов. Социалистическая революция будет мировой, либо ее не будет!"
 RUS_ww1_sovereignist_ethos: "Вертикаль власти"
 RUS_ww1_sovereignist_ethos_desc: "Что может быть важнее суверенитета нашей страны? Мы не доминион, не колония и не второстепенный игрок, а большая держава. Пришло время подтвердить это на дипломатической арене."
 RUS_ww1_support_kaiser: "Укрепить авторитет императора"
 RUS_ww1_support_kaiser_desc: "Кайзер Вильгельм II был здравомыслящим человеком, построившим сильное и ответственное немецкое государство. Кто знает, что произойдет, если его отстранят от власти? Мы должны поддержать немецкого лидера."
 RUS_ww1_contest_kaiser: "Поддать сомнению авторитет императора"
 RUS_ww1_contest_kaiser_desc: "Кайзер Вильгельм II стар, даже дряхл! Его решения становятся все более непредсказуемыми, и он привел с собой целую клику генералов оперетты, жаждущих власти и завоеваний. Они не перестанут хотеть вести войну. Необходимо инициировать ряд внутриполитических акций, чтобы подорвать его авторитет."
 RUS_ww1_internationalism_focus: "Интернационализм"
 RUS_ww1_internationalism_focus_desc: "Коммунистическую революцию остановить невозможно. Хорошо, что наш народ принимает это, и немедленно, а не путем гражданской войны. Когда мы начнем демонстрировать свою поддержку Интернациональному Коммунистическому Движению, мы будем такими же красными, как кровь людей."
 RUS_ww1_militarism: "Милитаризм"
 RUS_ww1_militarism_desc: "Наши военные силы становятся все более неотъемлемой частью повседневной жизни нашей страны. К счастью, народная поддержка сейчас на стороне наших солдат, поскольку люди видят в них героев, сражающихся под нашими знаменами. Эта военная культура, которую мы собираемся создать, послужит делу наших вооруженных сил."
 RUS_ww1_indoctrination_focus: "Идеологическая обработка"
 RUS_ww1_indoctrination_focus_desc: "После многих лет дебатов о том, как заручиться поддержкой граждан для нашего замечательного нового режима, некоторые члены Рабочего совета предложили создать новое «Министерство любви», которое официально убедило бы людей поддержать наше правительство. Мы не будем здесь говорить о том, что будет происходить неофициально в этом министерстве..."
 RUS_ww1_political_commissars: "Политкомиссары"
 RUS_ww1_political_commissars_desc: "Как это ни парадоксально, армия является местом, где процветают антинациональные настроения. Обеспечивая нашему правительству наблюдение за всем, мы можем отслеживать эти группы подстрекателей и не допускать их роста."
 RUS_ww1_paramilitarism: "Парамилитаризм"
 RUS_ww1_paramilitarism_desc: "Некоторые страны настолько глупы, что осуждают вооруженные формирования, опасаясь восстаний. Однако если мы будем достаточно осторожны и ограничим их сторонниками режима, мы сможем создать еще одну группу разгневанных вооруженных людей, которые смогут поддержать нашу нацию. Это пригодится нам в случае войны."
 RUS_ww1_political_correctness: "Политкорректность"
 RUS_ww1_political_correctness_desc: "Давайте назначим интеллектуалов, приближенных к власти, чтобы они внимательно следили за информационными агентствами... и следили за тем, чтобы каждый текст не носил подрывной характер."
 RUS_ww1_military_youth: "Милитаризация молодежи"
 RUS_ww1_military_youth_desc: "Наша милитаристская культура должна присутствовать и в наших детях! Проявляя уважение к военным и обеспечивая подготовку молодого поколения, мы можем быть уверены, что они вырастут и пойдут служить нашему славному режиму. Некоторые могут назвать это эксплуатацией... но звучит лучше, когда вы говорите, что даете подросткам светлое будущее."
 RUS_ww1_student_movement_focus: "Студенческое движение"
 RUS_ww1_student_movement_focus_desc: "Университеты и студенческие лиги полны молодых, энергичных людей, жаждущих борьбы или распространения новых политических идей. Не составит большого труда разместить агентов в нужных сетях, чтобы направить всю эту энергию в нужное русло!"
 RUS_ww1_monarchy: "Закручивание гаек"
 RUS_ww1_monarchy_desc: "Полномочия, осуществляемые парламентом и народом, могут быть опасными. Единственный реальный способ сохранить контроль над страной, особенно в такие трудные времена, — это занять в целом твердую позицию и управлять страной так, как следует."
 RUS_ww1_democracy: "Либеральные реформы"
 RUS_ww1_democracy_desc: "Говорят, что любой лидер черпает свою власть из народа. Если мы сделаем шаг к более демократическому обществу, даже если мы на самом деле таковым не станем, мы, по крайней мере, сможем занять лучшую позицию для ведения переговоров с демократическими странами по всему миру."
 RUS_ww1_centralizedpower: "Бюрократия"
 RUS_ww1_centralizedpower_desc: "Удваивая число государственных служащих, мы укрепляем нашу способность контролировать и регулировать все наше правительство и гарантируем, что ничто не ускользнет от нашего контроля. Усилия страны будут использованы гораздо эффективнее. И тогда это заставит работать национальную бумажную промышленность..."
 RUS_ww1_freespeech: "Свобода слова"
 RUS_ww1_freespeech_desc: "Времена меняются, и мы должны показать, что не боимся противоречий. Мы должны подписать указ, разрешающий издание газет, которые сейчас не одобряются цензурным комитетом."
 RUS_ww1_reorganization_act: "Закон о реорганизации"
 RUS_ww1_reorganization_act_desc: "Военно-промышленный аппарат страдает от своей устарелости и распыления усилий. Наш министр экономики предложил амбициозный план реорганизации наших производственных мощностей."
 RUS_ww1_leave_central_power: "Покинуть Центральные державы"
 RUS_ww1_leave_central_power_desc: "Что могло побудить нас присоединиться к этому Тройственному союзу? Ясно, что это идет совсем не в нашем направлении и даже угрожает нашим интересам на нашей западной границе. Нам следовало бы объединиться с французами и англичанами. Давайте немедленно покинем Австро-Германский союз."
 RUS_ww1_limited_rearmament: "Ограниченное перевооружение"
 RUS_ww1_limited_rearmament_desc: "Для надлежащего снабжения нашей армии военными материалами требуются большие инвестиции и реквизиции. Конечно, при ограниченном пайке гражданские лица все равно смогут развлекаться — вероятно, за счет военных."
 RUS_ww1_full_rearmament: "Полное перевооружение"
 RUS_ww1_full_rearmament_desc: "Кто может предсказать будущее и сказать, что войны прекратятся? Мы должны обеспечить, чтобы наши силы были достаточны для решения стоящей перед нами задачи."
 RUS_ww1_unitedpeople: "Патриотический подъём"
 RUS_ww1_unitedpeople_desc: "От берегов Балтики до пляжей Тихого океана Российская империя объединяет десятки народов с разным происхождением и устремлениями. Мы должны лучше объединить эту гигантскую территорию, объединив ее население под одним знаменем."
 RUS_ww1_massive_effort: "Национальное единство"
 RUS_ww1_massive_effort_desc: "Каждый мужчина и каждая женщина должны помочь национальному усилию! Поскольку призрак мировой войны все ближе надвигается, была реализована крупная экономическая программа, направленная на развитие нашего промышленного потенциала и оказание нам помощи в борьбе с нашими ненавистными соперниками."
 RUS_ww1_fortify_city: "Оборона приграничных областей"
 RUS_ww1_fortify_city_desc: "Ход войны может измениться неприятно быстро, а фронт может двигаться еще быстрее. Было бы полезно мобилизовать группы праздных граждан для строительства оборонительных сооружений в определенных местах, и это сэкономило бы время для инженерных войск."
 RUS_ww1_fortify_coast: "Оборона побережья"
 RUS_ww1_fortify_coast_desc: "Берег защищать нелегко. Теперь, когда есть корабли, способные высадить десант практически в любой точке нашего побережья, прибрежные форты не станут слишком серьезным препятствием, чтобы отбросить наших врагов обратно в море."
 RUS_ww1_install_communism: "Пролетарская революция"
 RUS_ww1_install_communism_desc: "Рабочие — движущая сила социальных и промышленных изменений! Пришло время эксплуатируемым, угнетенным, изгоям, тем, у кого нет ничего, кроме силы рук и хватки, взять свое будущее в собственные руки! Мы должны организовать пролетарскую революцию в нашей собственной стране в широких масштабах!"
 RUS_ww1_install_democracy: "Свободные выборы"
 RUS_ww1_install_democracy_desc: "Власть всегда исходит от народа. Организация свободных выборов, по крайней мере, создаст иллюзию прямой демократии и надлежащего представительства граждан, а также придаст нашему правительству легитимность, которой ему не хватало."
 RUS_ww1_oppression_minorities: "Угнетать меньшинства"
 RUS_ww1_oppression_minorities_desc: "Это известный прием, но он все еще работает... назначение козла отпущения помогает отвлечь внимание от разгневанных элементов. Все, что вам нужно сделать, это профинансировать хорошую, яростную кампанию в прессе..."
 RUS_ww1_make_concessions: "Сделать уступки"
 RUS_ww1_make_concessions_desc: "Уступка некоторым требованиям не потребовала бы больших политических или финансовых усилий... и, с другой стороны, позволила бы правительству создать более позитивный имидж"
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 RUS_ww1_diplomatic_effort: "Министерство иностранных дел"
 RUS_ww1_diplomatic_effort_desc: "В наше время сложно сказать, к чему приведут нынешние события в мире. Дипломаты уже засыпали нас вопросами о том, будем ли мы участвовать в грядущей битве за власть в мире, или же мы полностью отстранимся. А пока правительство раздумывает, у нас есть возможность подготовиться к различным сценариям, расширив штат дипломатов."
 RUS_ww1_assert_position_east: "Отстаивать позицию на Востоке"
 RUS_ww1_assert_position_east_desc: "Слишком часто мы склонны считать, что сибирские территории — это Дальний Восток, оторванный от Российской империи, где законы не действуют и где наши намерения неясны. Пришло время это изменить и пересмотреть нашу политику на берегах Тихого океана."
 RUS_ww1_BalkansPolitics: "Политика на Балканах"
 RUS_ww1_BalkansPolitics_desc: "Балканы — это регион, который уже несколько десятилетий привлекает наше внимание, поскольку там проживает большое количество славянских народов, разделяющих наши интересы и культуру. Нам следует направить нашу внешнюю политику на продолжение усилий в этой области."
 RUS_ww1_ApeasementBalkans: "Умиротворение Балкан"
 RUS_ww1_ApeasementBalkans_desc: "На Балканах уже было много войн, но пользы от них было очень мало. Когда пушки не достигают цели, можно с уверенностью сказать, что хороший дипломатический банкет с большей вероятностью увенчается успехом, причем за гораздо меньшие деньги. Настало время проявить нам миролюбие."
 RUS_ww1_rom: "Сближение с Румынией"
 RUS_ww1_rom_desc: "Румыны за последние годы проявили себя и продемонстрировали мирные намерения по отношению к нам. Мы должны отправить к ним делегацию и подписать декларацию о дружбе."
 RUS_ww1_oirganization_realm: "Провозгласить Царство"
 RUS_ww1_oirganization_realm_desc: "Наша империя консервативна, но мы можем поддерживать имперский режим, оставаясь эффективными. Если мы предпримем правильные шаги по упрощению нашей внутренней организации, наша гражданская и экономическая жизнь от этого выиграет."
 RUS_ww1_fortify_russian_borders: "Укрепления российских границ"
 RUS_ww1_fortify_russian_borders_desc: "Немыслимо укрепить все границы России, учитывая абсурдное количество километров, которые необходимо преодолеть. Однако мы уже можем начать строительство нескольких крепостей, размещенных в нужных местах, что позволит нам контролировать большие территории."
 RUS_ww1_airport_russian_borders: "Строить аэропорты вблизи границ"
 RUS_ww1_airport_russian_borders_desc: "Нам необходимо инвестировать в строительство аэродромов вблизи наших границ. Это будет полезно не только для гражданских перевозок, но и в случае войны у наших эскадрилий будут аэродромы, готовые подняться в небо."
 RUS_ww1_fortify_italian_borders: "Укрепления итальянских границ"
 RUS_ww1_fortify_italian_borders_desc: "Границы Королевства Италия необходимо укрепить, поскольку на данный момент они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."
 RUS_ww1_fortify_bosnia_borders: "Укрепления на Балканах"
 RUS_ww1_fortify_bosnia_borders_desc: "Границы на Балканах необходимо укрепить, поскольку сейчас они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."
 RUS_ww1_fortify_coast_dalmatia: "Укрепления в Далмации"
 RUS_ww1_fortify_coast_dalmatia_desc: "Побережье Далмации необходимо укрепить, поскольку сейчас они представляют собой настоящее решето! Мы должны направить туда корпус инженеров для надзора за работами, которые приведут к строительству казематов и фортов."
 RUS_ww1_ready_country: "Пропагандировать военную службу"
 RUS_ww1_ready_country_desc: "Армии не хватает винтовок, грузовиков, формы, но больше всего — новобранцев. Молодые россияне больше не заинтересованы в военной службе, поэтому мы должны призывать добровольцев и публиковать пропагандистские изображения, призывающие их выполнить свой долг перед Родиной."
 RUS_ww1_military_harmonization: "Сбалансировать армию"
 RUS_ww1_military_harmonization_desc: "Одной из причин хронической неэффективности наших сил является огромная разница в ресурсах и целях между различными армиями. Если мы хотим изменить ситуацию, мы должны четко пересмотреть наши военные цели и обеспечить, чтобы флот, армия, а также летчики направляли свои усилия в этом направлении. И, наконец, мы должны инвестировать значительные ресурсы в поддержку их развития."
 RUS_ww1_balkans_policy: "Балканская стратегия"
 RUS_ww1_balkans_policy_desc: "Балканы называют «Пороховой бочкой Европы». И это не зря. В любой момент там может вспыхнуть война. Нам нужно попробовать остудить пыл балканских государств, которые так и ждут, чтобы перегрызть друг другу глотки."
 RUS_ww1_balkans_policy_intervene: "Реакция на Балканскую войну"
 RUS_ww1_balkans_policy_intervene_desc: "Балканы снова в огне, а сербы враждуют с греками и болгарами! Мы поддерживаем их требования, и пришло время подтвердить это открыто, особенно перед лицом османов, которые уже точат свое оружие, чтобы воспользоваться ситуацией."
 RUS_ww1_pro_fra: "Поддержать франко-русский союз"
 RUS_ww1_pro_fra_desc: "Франция для Российской империи была крайне важным союзником против расширения влияния Германии. Франко-русский союз — военно-политический союз России и Франции, который был основным вектором внешней политики двух государств в 1891—1917 годах и предшествовал созданию тройственной Антанты."
 RUS_ww1_friend_with_auh: "Соглашение с Австро-Венгрией"
 RUS_ww1_friend_with_auh_desc: "Это потребовало времени и денег, но мы наконец достигли нового соглашения, которое на время разрешит наши разногласия с австрийцами. Если мы подпишем его сейчас, это должно на некоторое время успокоить наши отношения."
 RUS_balkan_corridor: "Балканский коридор"
 RUS_balkan_corridor_desc: ""
 RUS_ww1_restore_russia_glory: "Восстановить былую славу России"
 RUS_ww1_restore_russia_glory_desc: "Было время, когда царские легионы наводили страх на обе стороны Евразии, время, когда Россия была титаном, которого нельзя было игнорировать! Пришло время взять на вооружение политику полной власти и вселить страх в нашу нацию. Мы покроем славой престол Петербурга!"
 RUS_triumph_of_orthodoxy: "Торжество православия"
 RUS_triumph_of_orthodoxy_desc: ""
 RUS_wilhlems_deal: "Соглашение с Вильгельмом II"
 RUS_wilhlems_deal_desc: "Для дальнейшего процветания России нужно пойти на союз с Германией. Не так давно были попытки заключения русско-германского союза. А именно — Бьеркский договор, секретный русско-германский союзный договор, который был подписан во время встречи императора Николая II с германским императором Вильгельмом II в 1905 году у балтийского острова Бьерке."
 RUS_invest_in_poland: "Инвестировать в Польшу"
 RUS_invest_in_poland_desc: ""
 RUS_invest_in_ukraine: "Инвестировать в Украину"
 RUS_invest_in_ukraine_desc: ""
 RUS_around_manchuria: "Инвестировать в Приамурье"
 RUS_around_manchuria_desc: "Губернии Приамурского генерал-губернаторства нуждаются в инвестициях для развития этих регионов. Нужно немедленно заняться этим вопросом."
 RUS_ww1_friend_with_romania: "Улучшить отношения с Румынией"
 RUS_ww1_friend_with_romania_desc: "У нас не очень хорошие отношения с Румынией из-за ряда территориальных разногласий. И это несмотря на то, что Россия помогла Румынии обрести независимость. Нам нужно улучшить отношения с этой страной."
 RUS_ww1_EmbargoUK: "Объявить эмбарго Великобритании"
 RUS_ww1_EmbargoUK_desc: "Соединённое королевство всегда лезло не в свои дела. Нашей огромности боятся. Мы должны наложить на них санкции, что бы они осознали свои ошибки!"
 RUS_ww1_JoinCentralPowers: "Нож в спину"
 RUS_ww1_JoinCentralPowers_desc: "Вероятно, это будет расценено как величайшее геополитическое предательство этого столетия, но мы должны быть прагматичны. В краткосрочной и среднесрочной перспективе нас интересуют только Центральные державы."
 RUS_ww1_reinforce_western_forts: "Укрепить западные границы"
 RUS_ww1_reinforce_western_forts_desc: "Самая большая угроза исходит с Запада. Именно на этой границе империи мы должны сосредоточить большую часть дивизий.
 RUS_contain_germany: "Сдерживать Германию"
 RUS_contain_germany_desc: ""
 RUS_annex_northern_persia: "Оккупировать Северную Персию"
 RUS_annex_northern_persia_desc: ""
 RUS_russify_finland: "Русификация Финляндии"
 RUS_russify_finland_desc: "Если мы хотим, чтобы финны перестали бросать вызов нашей власти, мы должны ассимилировать их в русскую культуру. В краткосрочной перспективе это может создать напряженность, но в долгосрочной перспективе Финляндия может стать просто еще одним российским регионом."
 RUS_ww1_leave_entente: "Покинуть Антанту"
 RUS_ww1_leave_entente_desc: "По правде говоря, франко-британцы не более надежны, чем австро-германские, и нет никаких гарантий, что они будут заботиться о наших интересах. Мы должны выйти из Антанты. Если они так стремятся разорвать друг друга на части вместе со своими ближайшими соседями, то это хорошо для них."
 RUS_guarantee_serbia: "Гарантировать независимость Сербии"
 RUS_guarantee_serbia_desc: "Сербов необходимо защитить от аппетитов итальянцев, австрийцев или кого-либо еще. Эта страна не может уйти от нас; поэтому мы должны гарантировать их независимость. Так что остерегайтесь тех, кто попытается завоевать эту маленькую страну."
 RUS_ww1_add_fuel_to_the_fire: "Искра в пороховой бочке"
 RUS_ww1_add_fuel_to_the_fire_desc: "Противоречия двух враждебных блоков особенно острые на Балканах, которые уже давно именовали пороховой бочкой Европы. Главными претендентами на роль хозяев этого региона были Россия и Австро-Венгрия. И вот теперь искра брошена в пороховую бочку, вместе с убийством австрийского эрцгерцога Франца Фердинанда."
 RUS_ww1_support_serbia: "Православное братство"
 RUS_ww1_support_serbia_desc: "Если у нас и есть что-то общее с сербами, так это религия! Наши православные братья должны быть поставлены под нашу эгиду. Давайте пригласим их присоединиться к нашему братству."
 RUS_fight_sweden_gotland: "Претензия на Готланд"
 RUS_fight_sweden_gotland_desc: "Остров Готланд — это всего лишь голая скала в морских брызгах, но скала, на которой можно приземлять самолеты и устанавливать пушки! Даже военно-морская база, более чем полезная для любого военного флота, достойного этого названия. Мы должны официально заявить об этой позиции, чтобы она в один прекрасный день не стала для нас прямой угрозой."
 RUS_european_focus: "Западный акцент"
 RUS_european_focus_desc: "Наша страна — самая большая в мире, но именно в Европе находятся наши главные интересы и наши главные союзники. Это регион, которому следует уделить приоритетное внимание."
 RUS_ww1_scandinavia_focus: "Политика в Скандинавии"
 RUS_ww1_scandinavia_focus_desc: "Географическая близость скандинавов делает этот вопрос для нас центральным, равно как и стратегическая и экономическая конкуренция за контроль над железом, нефтью и древесиной. Мы должны приблизиться к этим странам, сохраняя при этом значительные средства сдерживания в этом регионе."
 RUS_asian_focus: "Отстаивать позиции России в Азии"
 RUS_asian_focus_desc: "После поражения от Японии в Русско-японской войне 1904-1905 годов, Россия значительно потеряла влияние в Азии. Нужно усилить здесь наши позиции."
 RUS_ww1_treaty_portsmouth: "Аннулировать Портсмутский договор"
 RUS_ww1_treaty_portsmouth_desc: "Портсмутский мирный договор — договор между Российской империей и Японией, завершивший русско-японскую войну 1904—1905 годов. За этим договором Россия потеряла Порт-Артур и Дальний, юг Сахалина. Пора вернуть утраченые территории и наше влияние в Азии."
 RUS_annex_manchurian_sphere: "Оккупировать Маньчжурию"
 RUS_annex_manchurian_sphere_desc: "Маньчжурия — регион, который отделяет Российскую империю от Японской империи. Пора нам оккупировать Маньчжурию и вернуть себе Порт-Артур и порт Дальний, которые Россия потеряла после прошлой войны."
 RUS_ww1_friend_with_jap: "Наладить отношения с Японией"
 RUS_ww1_friend_with_jap_desc: "Русско-японская война сильно пошатнула русско-японские отношения, но современные обстоятельства на мировой политической арене вынуждают нас пойти на зближение с Японией."
 RUS_reinforce_vladivostok: "Укрепить Владивосток"
 RUS_reinforce_vladivostok_desc: "Вероятность новой Русско-японской войны достаточно велека. Мы должны укрпеить Владивосток и восстановить Сибирскую военную флотилию, которая сильно пострадала после Цусимского сражения."
 RUS_mongolian_protectorate: "Монгольский протекторат"
 RUS_mongolian_protectorate_desc: "Одним из важных геополитических результатов Синьхайской революции для России стало провозглашение независимости Внешней Монголии. Малозаселённая, но обширная Монголия стала важным буферным государством между Российской империей и Китаем."
 RUS_ww1_Xinhai_Revolution_Opportunity: "Извлечь выгоду из Синьхайской революции"
 RUS_ww1_Xinhai_Revolution_Opportunity_desc: "Революция, которая только что началась в Китае, потрясает власть императора! Восстания в Учане уже стали кровавыми. Западное вмешательство лишь придало последний импульс обществу, которое уже было подорвано до основания инерцией, коррупцией и политическими беспорядками. Мы должны заняться этим вопросом и воспользоваться возможностями, которые открываются сейчас, потому что наши конкуренты не будут ждать!"
 RUS_ww1_polish_corps: "Сформировать польский корпус"
 RUS_ww1_polish_corps_desc: "В России живет много поляков, и многие поляки хотят воевать против немцев, хотя у них нет своей страны! Нам по-прежнему нужны люди: давайте сформируем чисто польский легион, состоящий из добровольцев и офицеров этой общины. Они будут сражаться с еще большей силой и сплоченностью."
 RUS_ww1_support_serbia_weapons: "Поддержать Сербию оружием"
 RUS_ww1_support_serbia_weapons_desc: "Сербы упорно сражаются, но им не хватает оружия и боеприпасов. Нам нужно отправить им несколько партий вооружений, иначе они будут истощены через несколько месяцев."
 RUS_ww1_invest_west: "Инвестировать в западные губернии"
 RUS_ww1_invest_west_desc: "Губернии Привислинского края, Малороссии и Новороссии нуждаются в инвестициях для развития этих регионов. Нужно немедленно заняться этим вопросом."
 RUS_ww1_defy_germany: "Бросить вызов Германии"
 RUS_ww1_defy_germany_desc: "Германия — молодая страна, настоящий новичок в дипломатии, которому не следует недооценивать своего более могущественного соседа! Пришло время бросить вызов их амбициям: либо они поклонятся нам, либо они встретятся с нами лицом к лицу... на поле боя!"
 RUS_ww1_avenge_fall_constantinople: "Вернуться к Греческому проекту"
 RUS_ww1_avenge_fall_constantinople_desc: "Греческий проект — геополитический проект Екатерины II, предполагавший сокрушение Османской империи и раздел её территории между Россией, Священной Римской империей и Венецианской республикой. В Константинополе предполагалось возродить Византийскую державу во главе с внуком российской императрицы, которому было дано имя основателя города — Константин."
 RUS_ww1_extension_of_the_putilov_factory: "Расширение Путиловского завода"
 RUS_ww1_extension_of_the_putilov_factory_desc: "На Путиловском заводе необходимо начать конструирование и производство новых моделей бронетехники для нашей армии."
 kis_tsarnicholasabdicated: "Царь отрекся от престола"
 kis_brestlitovsk: "Брест-Литовский мирный договор"
 kis_Rasputin_Murdered: "Распутин убит"
 RUS_ww1_Tungsten_Nerchinsk: "Искать вольфрам рядом с Нерчинском"
 RUS_ww1_Tungsten_Nerchinsk_desc: "Выделить средства на прокладку грунтовой дороги от месторождений вольфрамовых руд в Нерчинском округе до Забайкальской железной дороги"
 RUS_ww1_Reinforce_Northern_Persia: "Инвестировать в Северную Персию"
 RUS_ww1_Reinforce_Northern_Persia_desc: "Некоторые из наших ведущих промышленников предлагают нам вложить часть капитала в персидские территории. Это печально известная слаборазвитая и архаичная страна, но с богатыми землями. Это определенно будет хорошей инвестицией."
 RUS_ww1_Support_Persia_Convention: "Поддержать Конвенцию 1907 года"
 RUS_ww1_Support_Persia_Convention_desc: "Англо-русская конвенция была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору о Персии. Соединенное Королевство пообещало держаться подальше от северной Персии, а Россия признала южную Персию частью британской сферы влияния."
 RUS_ww1_Revoke_Persia_Convention: "Отменить Конвенцию 1907 года"
 RUS_ww1_Revoke_Persia_Convention_desc: "Англо-русская конвенция была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору о Персии. Соединенное Королевство пообещало держаться подальше от северной Персии, а Россия признала южную Персию частью британской сферы влияния."
 RUS_ww1_Persian_Cossack_Brigade: "Усилить персидскую казачью бригаду"
 RUS_ww1_Persian_Cossack_Brigade_desc: "Персидская казачья бригада — кавалерийское подразделение казачьего типа, сформированное в 1879 году в Персии. Создано по образцу кавказских казачьих полков Российской императорской армии и сегодня является элитным подразделением. Мы должны мобилизовать эту силу и превратить ее в полицейское подразделение."
 RUS_ww1_Puppet_Persia: "Оккупировать Северную Персию"
 RUS_ww1_Puppet_Persia_desc: "Северная Персия погружается в анархию, и нет недостатка в веских причинах для оккупации страны. Ну, только северный регион... и в конце концов, если мы этого не сделаем, то об этом позаботятся британцы!"
 RUS_ww1_Russian_Influence_over_Persia: "Тегеранское трансграничное соглашение"
 RUS_ww1_Russian_Influence_over_Persia_desc: "Мы подготовили соглашение с шахом Персии. Это касается территориальных, экономических, финансовых вопросов... и позволит нам назначать нужных нам людей на ключевые должности, чтобы наше влияние ощущалось по всей Персии. Мы с ними легко справимся."
 RUS_ww1_Militarize_NorthenPersia: "Милитаризировать Северную Персию"
 RUS_ww1_Militarize_NorthenPersia_desc: "Персия продолжает слабеть, и у них не будет никаких шансов противостоять нам, когда мы направим туда воинские части для защиты российских интересов."
 RUS_ww1_RussoTurkishBorder: "Укрепить российско-турецкую границу"
 RUS_ww1_RussoTurkishBorder_desc: "Мы не забыли недавние конфликты между нами и турками, и, несмотря на прошедшие годы, ничего не было решено. Будем иметь в виду, что их границы проницаемы как в одном направлении, так и в другом. Нам необходимо укрепить границу, отделяющую нас от них, разместив там больше армейских подразделений."
 RUS_ww1_AzerbaijanisRights: "Признать азербайджанский народ"
 RUS_ww1_AzerbaijanisRights_desc: "Мы уже пытались захватить Азербайджан, но безуспешно. Мы должны признать их независимость и свободу, сделать их союзниками на нашей южной границе."
 RUS_ww1_CaucasusFocus: "Обратить внимание на Кавказ"
 RUS_ww1_CaucasusFocus_desc: "Недавние геологоразведочные кампании на Кавказе подчеркивают, что со временем этот регион будет становиться все более интересным, поскольку он богат не только плодородными сельскохозяйственными землями, но и нефтяными скважинами. Мы должны отдать этому региону главный приоритет для наших инвестиций и строительных работ."
 RUS_ww1_BakuInvest: "Инвестировать в Баку"
 RUS_ww1_BakuInvest_desc: "Баку полон нефти! Мы должны быстрее освоить регион, потому что наши потребности в черном золоте только растут."
