 GER_int_beer_hall_putsch_succeeds:0 "Пивной путч"
 GER_int_beer_hall_putsch_succeeds_desc:0 "Пивной путч — неудачная попытка захвата государственной власти, предпринятая Национал-социалистической рабочей партией во главе с Гитлером и генералом Людендорфом 9 ноября 1923 года в Мюнхене." #WE NEED A DESC FOR THAT
 
 GER_int_the_locarno_traties:0 "Локарнские договоры"
 GER_int_the_locarno_traties_desc:0 "Мы поняли, что Франция очень хотела британской гарантии своих послевоенных границ. Мы можем приложить усилия для сохранения мира."
 
 GER_int_hitler_chancellor:0 "Гитлер — рейхсканцлер Германии"
 GER_int_hitler_chancellor_desc:0 "30 января 1933 года президент Гинденбург освободил фон Шлейхера от должности рейхсканцлер и назначил рейхсканцлером Гитлера." #WE NEED A DESC FOR THAT
 
 GER_int_night_long_knives:0 "Ночь длинных ножей"
 GER_int_night_long_knives_desc:0 "Ночь длинных ножей — расправа Гитлера над штурмовиками СА, произошедшая 30 июня 1934 года. Кодовое название — операция «Колибри». Поводом для расправы послужила нелояльность штурмовиков во главе с Эрнстом Рёмом и подозрения в подготовке путча." #WE NEED A DESC FOR THAT
 
 ############################################################################################
 
