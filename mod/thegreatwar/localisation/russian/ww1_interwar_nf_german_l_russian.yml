 GER_int_promote_fedor_von_bock:0 "Продвижение Федора фон Бока"
 GER_int_promote_fedor_von_bock_desc:0 "Федор фон Бок служил командиром батальона в 1916 году и был награжден медалью «За заслуги» (Pour le Mérite), высшей военной наградой Германской империи. В 1920-х годах Бок вместе с Куртом фон Шлейхером, Ойгеном Оттом и Куртом фон Хаммерштейн-Эквордом был членом секретной организации, известной как Sondergruppe R."
 
 GER_int_reichstag_fire_decree:0 "Указ о поджоге Рейхстага"
 GER_int_reichstag_fire_decree_desc:0 "Указ о поджоге Рейхстага (Reichstagsbrandverordnung) — это общее название Указа рейхспрезидента о защите народа и государства, изданного Паулем фон Гинденбургом по совету канцлера Адольфа Гитлера как реакция на поджог Рейхстага. Указ аннулировал многие ключевые гражданские свободы граждан Германии."
 
 GER_int_crush_the_spartacists:0 "Сокрушить спартакистов"
 GER_int_crush_the_spartacists_desc:0 "Мы должны позволить солдатам Добровольческого корпуса атаковать спартакистов."
 
