#--------------------------------------------------------------
# Army Tree
#=========================================================================
 AUH_ww1_army_effort: "Сухопутные войска Австро-Венгрии"
 AUH_ww1_army_effort_desc: "Вооружённые силы Австро-Венгрии (kaiserliche und königliche Armee) — совокупность всех войск и сил Австро-венгерской империи. Вооружённые силы Австро-Венгрии были образованы после преобразования в соответствии с австро-венгерским соглашением Австрии в дуалистическую монархию." 
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 AUH_ww1_form_air_force: "Военно-воздушные силы Австро-Венгрии"
 AUH_ww1_form_air_force_desc: "Военно-воздушные силы Австро-Венгрии (K.u.K. Luftfahrtruppen) — вид вооружённых сил Австро-Венгерской империи, существовавший в 1893—1919 годах. Накануне Первой мировой войны в состав военно-воздушного флота входило более 30 самолётов и 85 пилотов. Из всех стран-участниц мировой войны австро-венгерские воздушные силы были одними из самых слабых."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 AUH_ww1_naval_effort: "Военно-морские силы Австро-Венгрии"
 AUH_ww1_naval_effort_desc: "Перед Первой Мировой войной австро-венгерский флот (K.u.K. Kriegsmarin) состоял из двух эскадр. Военно-морские силы Австро-Венгрии прекратили своё существование в 1918 году, после поражения Австро-Венгрии в Первой Мировой войне и последующего за тем распада государства с утратой Австрией и Венгрией выхода к морю."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 AUH_ww1_political_effort: "Политические реформы"
 AUH_ww1_political_effort_desc: "Политические реформы – это изобретение или введение по зарубежным образцам великих социальных инноваций – новых политических организаций, новых форм правления, новых политических режимов, новых избирательных систем, предоставление права голоса новым социальным группам, например, афро-американцам, наёмным рабочим и беднякам, женщинам и т.д."
 
 AUH_ww1_sovereignist_ethos: "Вертикаль власти"
 AUH_ww1_sovereignist_ethos_desc: ""
 
 AUH_ww1_support_kaiser: "Укрепить авторитет императора"
 AUH_ww1_support_kaiser_desc: "Его королевское величество Кайзер и Кёниг мудро правил нашей страной в течение долгого времени, но появилась угроза его правлению. От националистов, которые борются за свободу слова и федералистов стремящихся объединить региональную демократию, у правительства появилось много врагов внутри страны. Мы должны провести кампанию по переработке абривиатуры K.u.K., чтобы помочь ему в контроле над Австро-Венгрией."
 
 AUH_ww1_contest_kaiser: "Оспорить авторитет императора"
 AUH_ww1_contest_kaiser_desc: "Возможно, монархия больше не способна править многонациональным государством. Кайзер и Кёниг резко потерял популярность за пределами самой Австрии и имеет множество врагов в своей собственной части империи. Если мы ослабим его авторитет изнутри, разве у него будет шанс сохранить свою власть? На его место придет лидер от более влиятельной партии."
 
 AUH_ww1_internationalism_focus: "Интернационализм"
 AUH_ww1_internationalism_focus_desc: ""
 
 AUH_ww1_militarism: "Милитаризм"
 AUH_ww1_militarism_desc: ""
 
 AUH_ww1_indoctrination_focus: "Идеологическая обработка"
 AUH_ww1_indoctrination_focus_desc: ""
 
 AUH_ww1_political_commissars: "Политкомиссары"
 AUH_ww1_political_commissars_desc: ""
 
 AUH_ww1_paramilitarism: "Парамилитаризм"
 AUH_ww1_paramilitarism_desc: ""
 
 AUH_ww1_political_correctness: "Политкорректность"
 AUH_ww1_political_correctness_desc: ""
 
 AUH_ww1_military_youth: "Милитаризация молодежи"
 AUH_ww1_military_youth_desc: ""
 
 AUH_ww1_student_movement_focus: "Студенческое движение"
 AUH_ww1_student_movement_focus_desc: "Молодежь нашей страны действительно смышлённая, и это может помочь нам в наших исследованиях, особенно в области сухопутных доктрин."
 
 AUH_ww1_monarchy: "Поддержать монархию"
 AUH_ww1_monarchy_desc: ""
 
 AUH_ww1_democracy: "Либеральные реформы"
 AUH_ww1_democracy_desc: ""
 
 AUH_ww1_centralizedpower: "Бюрократия"
 AUH_ww1_centralizedpower_desc: ""
 
 AUH_ww1_freespeech: "Свобода слова"
 AUH_ww1_freespeech_desc: ""
 
 AUH_ww1_reorganization_act: "Закон о реорганизации"
 AUH_ww1_reorganization_act_desc: ""
 
 AUH_ww1_leave_central_power: "Покинуть Центральные державы"
 AUH_ww1_leave_central_power_desc: "Немцы когда-то были нашей лучшей ставкой на выживание, но теперь Австрия должна идти своим путем. Может быть, когда-нибудь, если правительство Германии захочет, или, может быть, необходимость заставит его, мы снова будем союзниками. Увы, пока мы должны попрощаться с нашими братьями на севере и пожелать им удачи..."
 
 AUH_ww1_limited_rearmament: "Ограниченное перевооружение"
 AUH_ww1_limited_rearmament_desc: ""
 
 AUH_ww1_full_rearmament: "Полное перевооружение"
 AUH_ww1_full_rearmament_desc: ""
 
 AUH_ww1_unitedpeople: "Патриотическое рвение"
 AUH_ww1_unitedpeople_desc: "Произошло любопытное изменение общественных убеждений. Возможно, люди, которые не являются австрийцами, уже нашли свое место здесь, или, может быть, они просто устали от нытья."
 
 AUH_ww1_massive_effort: "Национальное единство"
 AUH_ww1_massive_effort_desc: ""
 
 AUH_ww1_fortify_city: "Оборона приграничных областей"
 AUH_ww1_fortify_city_desc: ""
 
 AUH_ww1_fortify_coast: "Оборона побережья"
 AUH_ww1_fortify_coast_desc: ""
 
 AUH_ww1_leave_central_power: "Покинуть Центральные державы"
 AUH_ww1_leave_central_power_desc: "Союз с Германией был лучшим выбором для выживания, но теперь нам необходимо идти своим путем. Возможно, если Германия будет учитывать не только свои интересы, мы сумеем вновь восстановить наш союз."
 
 AUH_ww1_install_communism: "Коммунистическая революция"
 AUH_ww1_install_communism_desc: "У людей было достаточно австрийских элит, которые контролируют и угнетают людей на фермах и фабриках. Отныне жители Дуная будут стоять вместе перед лицом аристократического притеснения!"
 
 AUH_ww1_install_democracy: "Свободные выборы"
 AUH_ww1_install_democracy_desc: "Впервые жители Дуная будут говорить в своем правительстве. Когда старая монархия ушла в прошлое, можно провозгласить федеративную республику, которая будет слушать и следить за каждой частью национального государства. Мы больше не будем австрийскими, венгерскими или чем-то большим или меньшим, чем гражданами."
 
 AUH_ww1_end_dual_monarchy_emperor: "Конец дуалистичной монархии"
 AUH_ww1_end_dual_monarchy_emperor_desc: "Венгрия только сбивает Австрию с пути. Отказавшись от венгерского престола как одного из наших основных титулов и передав его Австрии, мы напомним всем, кто здесь главный. Некоторые из этих усатых варваров могут пожаловаться, но какое это имеет значение? Мы победили их еще в 1846 году, мы можем сделать это снова, если потребуется." 
 
 AUH_ww1_oppression_minorities: "Угнетать меньшинства"
 AUH_ww1_oppression_minorities_desc: "Лучший способ обеспечить лояльность групп меньшинств австрийскому престолу состоит в том, чтобы заставить их избегать встреч друг с другом для начала. Делая публикации и публичные выступления на других языках незаконными, наказывая граждан, которые не поддерживают наши культурные нормы, и переносят местную неполноценность к нашей основной культуре. Мы можем обмануть некоторых из группы, заставив думать, что они одни из нас, тем самым удерживая других от высказываний против нас."
 
 AUH_ww1_autrichian_lead: "Австрийский штаб"
 AUH_ww1_autrichian_lead_desc: "С окончанием Двойной монархии и централизацией королевства Австрии, военные вновь стали единой организацией, в которой на вершине находятся австрийские военные лидеры. Хотя офицеры других национальностей протестуют, наличие сплоченных военных снова принесло пользу нашей доктрине и ее распространению." 
 
 AUH_ww1_same_language: "Запрет на языки меньшинств"
 AUH_ww1_same_language_desc: "Немецкий язык — это единственный язык, на котором вы должны говорить. Это не немецкая разновидность моды, поэтому не говорите никому, что вы прочитали это описание, или что вы слышали это от меня."
 
 AUH_ww1_dismantle_auh: "Упразднить Австро-Венгрию"
 AUH_ww1_dismantle_auh_desc: "Мечта об объединенной австро-венгерской монархии не увеньчалась успехом. Возможно, мы должны отбросить наши мечты о мультинационализме и следовать за собственной судьбой."
 
 AUH_ww1_make_concessions: "Уступки"
 AUH_ww1_make_concessions_desc: "Аристократы обеспокоены тем, что кайзер слишком влиятельный. Да что они знают?"
 
 
 #--------------------------------------------------------------
 
 
 # [GERMAN EMPIRE] Diplomatic Effort
 #=========================================================================
 
 AUH_ww1_diplomatic_effort: "Министерство иностранных дел"
 AUH_ww1_diplomatic_effort_desc: ""
 
 AUH_ww1_triple_alliance: "Возобновить Тройственный союз"
 AUH_ww1_triple_alliance_desc: "Тройственный союз, совершенно ясно, единственное, что удерживает нас на карте. Мы были бы дураками, если бы не продолжали добиваться согласия со своими союзниками и продолжать поддерживать альянс по сей день."
 
 AUH_ww1_back_ger: "Укрепить связи с Германией"
 AUH_ww1_back_ger_desc: "Хотя некоторые австрийские аристократы все еще плохо относятся к процессу объединения с Германией, но они наши братья, и одно из немногих дружественных государств." 
 
 AUH_ww1_military_advisors: "Военные эксперты из Германии"
 AUH_ww1_military_advisors_desc: "Говорят, что Пруссия произошла от пушечного ядра, и, хотя они больше не называют так страну, аксиома по-прежнему сохраняется. Принятие помощи от Германии в модернизации наших войск было бы хорошей выгодой из этого союза."
 
 AUH_ww1_back_italy: "Обеспечить лояльность Италии"
 AUH_ww1_back_italy_desc: "Итальянцы, мягко говоря, не совсем в дружеских отношениях с нами. Мы должны начать с ними переговоры, чтобы установить более близкие отношения, если мы надеемся сохранить их в нашем альянсе. Конечно, если мы пойдем на это, мы, вероятно, в конечном итоге потеряем территорию ..."
 
 AUH_ww1_give_italy_territories: "Отдать Зару и Истрию"
 AUH_ww1_give_italy_territories_desc: "Итальянцы четко сформулировали свои требования: исторически итальянский регион Истрии, а также концессию вокруг города Сплит на побережье Далмации. К сожалению, это прибрежная территория, но это может быть цена, которую стоит заплатить за союз с Италией." 
 
 AUH_ww1_italy_honnor_pact: "Призвать Италию в войну"
 AUH_ww1_italy_honnor_pact_desc: "В настоящее время Италия по сути вынуждена присоединиться к войне за нас. Если мы оставим им территорию и пообещаем что-либо от Франции ни за что, их народ последует за правительством. Когда все закончится, придет время собирать наши взносы за раздачу некоторых ценных регионов."
 
 
 AUH_ww1_assert_position_east: "Утвердить позиции на Востоке"
 AUH_ww1_assert_position_east_desc: "Позиция Центральных держав на Востоке одинакова — ослабить Россию и построить гегемонию в регионе. Поскольку война с Россией, в частности, кажется почти неизбежной, из-за ситуации на Балканском полуострове нам кажется, что это самый эффективный курс действий, хотя это будет способствовать сближению Франции и России, что может оказаться проблемой."
 
 AUH_ww1_anti_ru: "Антироссийская политика"
 AUH_ww1_anti_ru_desc: "Чтобы исправить положение, мы разорвем все дипломатические отношения с Россией и сделаем это публично. Скорее всего, этого будет мало, но пока они сообразят что к чему, мы откроем множество вариантов решения своих проблем в будущем."
 
 AUH_ww1_anti_ru_limit_trade: "Ограничение торговли с Россией"
 AUH_ww1_anti_ru_limit_trade_desc: "Россия является одним из наших основных торговых партнеров, и мы находимся в удачном положении, где они нуждаются в нас больше, чем мы. Путем введения санкций и тарифов на российскую продукцию мы можем гарантировать, что получим преимущество над ними в экономическом плане."
 
 AUH_ww1_rom: "Сблизиться с Румынией"
 AUH_ww1_rom_desc: "Румыны — это заноза в боку. Мы контролируем большую часть их территории, и хотя они официально являются второстепенным членом Тройственного союза, нет сомнений в том, что они с завистью смотрят на нашу территорию. Мы должны приносить им хорошие вести и попытаться приблизить к команде-победителю. Конечно, можно их захватить и тогда они точно пойдут на уступки ..."
 
 AUH_ww1_rom_give_bucovina: "Отдать Буковину Румынии"
 AUH_ww1_rom_give_bucovina_desc: "Буковина — незначительная территория, но это румынская земля в составе Австро-Венгерской империи. Если мы уступим эту территорию, чтобы завоевать их сердце, то это, безусловно, улучшит наши отношения — нам ведь намного лучше быть с союзником, чем с 2 дюймами земли."
 
 AUH_ww1_rom_honnor_pact: "Призвать Румынию в войну"
 AUH_ww1_rom_honnor_pact_desc: "Поскольку Румыния приняла наше предложение Буковины, мы имеем хорошую возможность призвать их на войну. Нет сомнения, что если они откажутся, то их народ будут очень недоволен."
 
 AUH_ww1_oirganization_realm: "Реорганизация государства"
 AUH_ww1_oirganization_realm_desc: "Австро-Венгрия, как коллекция частей старых королевств, не находится в отличной оборонительной позиции. Однако, несмотря на это, наши войска могут строить укрепления и окапываться, пытаться всячески сдерживать наступление на наших границах." 
 
 AUH_ww1_fortify_russian_borders: "Укрепить границу с Россией"
 AUH_ww1_fortify_russian_borders_desc: "Галицкая область является одной из основных стратегических точек, и сдерживание россиян важно, если мы хотим сохранить преимущество на Востоке. Линия укрепления в этом регионе поможет отбить нападение."
 
 AUH_ww1_airport_russian_borders: "Строить аэродромы вблизи российских границ"
 AUH_ww1_airport_russian_borders_desc: "Появление боевых самолётов может стать решающим фактором в войне с Россией. Если возвести больше аэродромов в регионе, то мы вероятно сможем разместить больше самолётов в регионе."
 
 AUH_ww1_fortify_italian_borders: "Укрепить границу с Италией"
 AUH_ww1_fortify_italian_borders_desc: "Итальянская граница длинная и сильно изогнутая, что затрудняет поддержку подразделений. Хуже того, сами итальянцы глубоко укрепились в нижней части горных цепей и в укрепленных городских районах. Поскольку мы вряд ли быстро туда прорвемся, мы должны быть уверены, что можем, по крайней мере, защищаться с этого направления."
 
 AUH_ww1_fortify_bosnia_borders: "Укрепить границы Балкан"
 AUH_ww1_fortify_bosnia_borders_desc: "Маловероятно, чтобы Балканы доставят нам серьезные проблемы, но всегда лучше быть в безопасности, чем сожалеть, чтобы французские морские пехотинцы, прибывающие в регион, стали грубым упущением. Это также лишит Сербию и Черногорию возможности напасть на нашу территорию, что обеспечит безопасную балканскую кампанию."
 
 AUH_ww1_fortify_coast_dalmatia: "Укрепить побережье Далмации"
 AUH_ww1_fortify_coast_dalmatia_desc: "Хотя у нас нет сверхмощного военно-морского флота, мы по-прежнему располагаем длинной береговой линией, которую нужно защищать, если фронт от Балканов до Италии не будет расширен, что стало бы катастрофой для наших военных. Улучшение существующих прибрежных укреплений и строительство новых, а также несколько обычных укреплений в этом районе на всякий случай могут помочь убедиться, что нам никогда не придется столкнуться с этим кошмаром." 
 
 AUH_ww1_ready_country: "Подготовка к войне"
 AUH_ww1_ready_country_desc: "По данным Австро-Венгрии, австро-венгерская армия является самым престижным работодателем в мире. Распространяя позитивные новости и информацию о нашей стране и вооруженных силах, мы можем прибавить энтузиазма апатичным людям, помогая нашим военным."
 
 AUH_ww1_polnische_wehrmacht: "Германизация Польши"
 AUH_ww1_polnische_wehrmacht_desc: "Если мы пообещаем полякам свое национальное государство после войны, возможно, жители части Польши будут охотнее присоединяться к нам. Уступим ли мы территорию или нет, это, конечно, еще предстоит решить, но пока мы можем только наслаждаться притоком трудоспособных людей, не думая о последствиях." 
  
 AUH_ww1_military_harmonization: "Унификация армии"
 AUH_ww1_military_harmonization_desc: "Армию с тремя подразделениями в своих сухопутных войсках нелегко держать под контролем, но в последнее время наши офицеры все более привыкают разбираться в тонкостях такой силы. По мере того, как наши военные начинают действовать более органично и более сплоченно, появляется все больше полезных идей для нашей доктрины."
 
 AUH_ww1_balkans_policy: "Балканская политика"
 AUH_ww1_balkans_policy_desc: "С момента захвата и аннексии Боснии мы стремились сохранить нашу землю на Балканах в безопасности и, по возможности, продолжать расширяться за счет этой области, если получим такую возможность. Применив веские аргументы на мировой арене, мы можем более активно участвовать в политике балканского региона." 
 
 AUH_ww1_balkans_policy_intervene: "Реакция на Первую Балканскую войну"
 AUH_ww1_balkans_policy_intervene_desc: "Балканская война была интересной, особенно из-за того, что они продемонстрировали удивительную потенциальную силу этих балканских государств в союзе. Хотя мы поддерживаем Османскую империю, кажется, что их власть в этом регионе полностью утрачена. Возможно, Австрии нужно найти нового близкого друга, если мы когда-нибудь будем удерживать то, что имеем здесь?" 
 
 AUH_ww1_balkans_bulgaria_friend: "Направить военных советников"
 AUH_ww1_balkans_bulgaria_friend_desc: "Сейчас болгары находятся в трудном положении. Их война против Сербии перешла в конфликт с буквально каждым из их соседей. Мы должны послать советников пока не поздно. Это, конечно же, интересная возможность подружиться с одним из этих балканских государств ..."
 
 AUH_ww1_balkans_bulgaria_send_troops: "Послать войска Болгарии"
 AUH_ww1_balkans_bulgaria_send_troops_desc: "Чтобы Болгария, по крайней мере, имела шанс на победу и не была аннексирована, мы можем отправить некоторые из наших собственных войск, номинально добровольцев, чтобы дать Болгарии хотя бы некоторое преимущество в конфликте. Это даст некоторый столь необходимый опыт и улучшит отношения с Болгарией."
 
 AUH_ww1_balkans_serbian_expansion: "Изучить сербский экспансионизм"
 AUH_ww1_balkans_serbian_expansion_desc: "Раньше сербы были дружелюбны к Австрии, так как они достигли полной независимости, но после того, как мы аннексировали Боснию, отношения с сербским правительством поменялись. Из-за резкого всплеска преступности, особенно из недавних иммигрантов из Сербии, находящихся внутри наших границ, необходимо провести расследование сербской деятельности в Австрии."
 
 AUH_ww1_balkans_serbian_ultimatum: "Послать ультиматум Сербии"
 AUH_ww1_balkans_serbian_ultimatum_desc: "Итак, сербские ублюдки нагло попытались разжечь бунт, чтобы засунуть свои грязные руки в наших южнославянские провинции! Они должны быть наказаны за это, и наш хороший кайзер начал готовить ультиматум сербскому правительству, от которого они, безусловно, не смогут отказаться."
 
 AUH_ww1_annex_BOS: "Аннексировать Боснию и Герцеговину"
 AUH_ww1_annex_BOS_desc: ""
 
 AUH_ww1_Schutzkorps: "Сформировать Шуцкори"
 AUH_ww1_Schutzkorps_desc: "Шуцкори была вспомогательной волонтерской милицией, созданной австро-венгерскими властями в недавно аннексированной провинции Босния и Герцеговина для отслеживания оппозиции боснийских сербов."
  
