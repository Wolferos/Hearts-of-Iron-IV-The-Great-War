 ##### Events #####
 ww1_belgium.2.t: "Бельгия предлагает союз"
 ww1_belgium.2.d: "Сегодня мы получили сообщение о том, что Бельгия хочет пригласить нас в их союз. Они предлагают объединить Бенилюкс и создать новый сильный союз. Что нам делать?"
 ww1_belgium.2.a: "Это хорошее предложение"
 ww1_belgium.2.b: "Нет"
 ww1_belgium.3.t: "Бельгия требует подчинения"
 ww1_belgium.3.d: "Сегодня Бельгия прислала нам официальный запрос о подчинении. Они также сказали, что при необходимости они будут использовать силу. Каков наш ответ?"
 ww1_belgium.3.a: "У нас нет выбора"
 ww1_belgium.3.b: "Они могут прийти только в том случае, если они нарушат нашу защиту"
 ww1_belgium.4.t: "Бельгия требует Евпен"
 ww1_belgium.4.d: "Евпен всегда был территорией Бельгии. Теперь они требуют своих законных земель. Бельгия не такая сильная, но мы можем начать войну за небольшой участок земли"
 ww1_belgium.4.a: "Ведь это их историческая земля"
 ww1_belgium.4.b: "Нет, это немецкая территория"
 ww1_belgium.5.t: "Объединить Бенилюкс"
 ww1_belgium.5.d: "Мы считаем, что пришло время объединить Бенилукс. Мы будем объединять людей в регионе Бенилюкс в соответствии с нашими законами."
 ww1_belgium.5.a: "Мы отправим запрос нашим соседям"
 ww1_belgium.5.b: "Мы уже контролируем Бенилюкс"
 
