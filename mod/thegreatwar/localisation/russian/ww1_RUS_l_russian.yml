 RUS_asian_focus_desc: "Мы должны укрепить своё влияние в Азии — судьба Империи зависит от наших продуманных шагов."
 RUS_ww1_Reinforce_Northern_Persia: "Инвестировать в Северную Персию"
 RUS_ww1_Reinforce_Northern_Persia_desc: ""
 RUS_ww1_Revoke_Persia_Convention: "Аннулировать Конвенцию 1907 года"
 RUS_ww1_Revoke_Persia_Convention_desc: "Англо-российская конвенция 1907 года была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору по поводу Персии. Великобритания пообещала не вмешиваться в дела Северной Персии, а Россия признала Южную Персию частью британской сферы влияния."
 RUS_ww1_Support_Persia_Convention: "Поддержать Конвенцию 1907 года"
 RUS_ww1_Support_Persia_Convention_desc: "Англо-российская конвенция 1907 года была подписана 31 августа 1907 года в Санкт-Петербурге. Конвенция положила конец длительному спору по поводу Персии. Великобритания обязалась не вмешиваться в дела северной Персии, а Россия признала южную Персию частью британской сферы влияния."
 RUS_ww1_Persian_Cossack_Brigade: "Усилить Персидскую казачью бригаду"
 RUS_ww1_Persian_Cossack_Brigade_desc: "Персидская казачья бригада — это кавалерийское подразделение казачьего типа, сформированное в 1879 году в Персии. Оно было создано по образцу кавказских казачьих полков Императорской российской армии."
