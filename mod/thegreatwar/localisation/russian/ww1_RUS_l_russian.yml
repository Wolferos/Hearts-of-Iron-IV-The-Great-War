 RUS_ww1_avenge_fall_constantinople: "Отомстить за 1453 год"
 RUS_ww1_avenge_fall_constantinople_desc: "Падение Константинополя — это захват столицы Византийской империи вторгшейся армией Османской империи 29 мая 1453 года. Во главе османцев стоял Мехмед Завоеватель, седьмой султан Османской империи, который нанёс поражение армии под командованием византийского императора Константина XI Палеолога."
