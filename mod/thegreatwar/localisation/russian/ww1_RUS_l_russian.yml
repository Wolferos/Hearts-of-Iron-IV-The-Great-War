#Ideas
 RUS_rural_communities: "Община"
 RUS_rural_communities_desc: "Общины — это сельские общины крестьян, сформированные из бывших крепостных, которых принуждали к общинному устройству."
 RUS_political_deadlock: "Политический тупик"
 RUS_duma_1: "Дума"
 RUS_aladincare_1: "Аладинкаре"
 RUS_aladincare_1_desc: "Аладинкаре — это программы социального обеспечения, основанные премьер-министром России Алексеем Аладиным."
 RUS_the_stolypin_reforms_1: "Реформы Столыпина"
 RUS_tsars_authority_1: "Власть царя"
 RUS_ww1_dual_power_ns: "Двойная власть"
 RUS_ww1_dual_power_ns_desc: "Говорят, что в древней Спарте было два царя, каждый из которых не давал другому стать чрезмерно авторитарным и мегаломанским. Нам следует провести этот эксперимент и поощрять разделение верховной власти во главе страны между двумя людьми."
 RUS_ww1_october_revolution_ns: "Октябрьская революция"
 RUS_ww1_october_revolution_ns_desc: "Октябрьская революция только что разразилась, и многовековая власть царей шатается! Большевики воодушевлены пламенными речами таких лидеров, как Ленин, и народ выходит на улицы. Россия окрашена в красный цвет!"
