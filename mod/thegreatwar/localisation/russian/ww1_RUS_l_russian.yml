 RUS_russify_finland_desc: "Если мы хотим, чтобы финны перестали оспаривать нашу власть, мы должны ассимилировать их в русскую культуру. В краткосрочной перспективе это может вызвать напряжённость, но в долгосрочной перспективе Финляндия может стать российским регионом, как и любой другой."
