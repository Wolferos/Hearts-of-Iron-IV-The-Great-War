 RUS_manchurian_puppet: "Марионеточное государство в Маньчжурии"
 RUS_manchurian_puppet_desc: "Лучший способ управлять Внутренней Маньчжурией — это создать там марионеточное государство"
 RUS_manchurian_russification: "Русификация Маньчжурии"
 RUS_manchurian_russification_desc: "Лучший способ управлять Внутренней Маньчжурией — это проводить политику русификации, чтобы должным образом присоединить этот регион к России и обеспечить наш доступ к незамерзающим водам на востоке"
 RUS_expand_dalniy_naval_base: "Расширить военно-морскую базу в Дальнем"
 RUS_expand_dalniy_naval_base_desc: "Теперь, когда мы вернули контроль над этим районом, отвоевав его у Японии, можно расширить военно-морскую базу в Порт-Артуре и коммерческие морские сооружения в Дальнем, а также укрепить полуостров от морских атак; для этого нам следует привлечь много поселенцев из России"
 RUS_ww1_friend_with_jap: "Союзники по обстоятельствам"
