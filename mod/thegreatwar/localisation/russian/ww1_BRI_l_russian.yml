l_russian:
#Ideas
 BRI_breton_nationalism: "Бретонский национализм"
 BRI_breton_officer_academy: "Бретонская офицерская академия"
 BRI_breton_cultural_revival: "Бретонское культурное возрождение"
 BRI_breton_shipbuilding_bureau: "Бретонское судостроительное бюро"
#Focuses
 BRI_восстановленное_королевство: "Восстановленное королевство"
 BRI_восстановленное_королевство_описание: "Бретань не была свободной уже несколько столетий, и хотя наша нынешняя ситуация далека от идеала, мы должны извлечь из неё максимум пользы"
 BRI_начать_восстановление_бретонской_культуры: "Начать восстановление бретонской культуры"
 BRI_begin_the_restoration_of_breton_culture_desc: "Бретонская культура сильно пострадала от многовекового французского господства; мы должны принять меры, чтобы исправить это, иначе у нас не будет достаточной легитимности как у правительства"
 BRI_prohibit_the_use_of_french: "Запретить использование французского языка"
 BRI_prohibit_the_use_of_french_desc: "Хотя это может оказаться непопулярным и в некоторой степени навредить нам, это необходимый шаг для возрождения бретонской культуры"
 BRI_begin_replacing_french_loan_words: "Начать замену французских заимствований"
 BRI_begin_replacing_french_loan_words_desc: "В нашем языке есть некоторые заимствования из французского; мы должны официально заменить их заимствованиями из других кельтских языков, таких как корнуолльский и валлийский"
 BRI_purge_the_french_bureacracy: "Избавиться от французской бюрократии"
 BRI_purge_the_french_bureacracy_desc: "Хотя это будет больно для нас, это самый важный шаг к восстановлению и сохранению нашей культуры"
 BRI_breton_culture_revived: "Возрождение бретонской культуры"
 BRI_breton_culture_revived_desc: "Наша культура теперь вновь свободна от французского влияния"
 BRI_celtic_brotherhood_with_ireland: "Кельтское братство с Ирландией"
 BRI_celtic_brotherhood_with_ireland_desc: "Хотя мы ближе к валлийцам и корнуолльцам, у них нет роскоши в виде собственных государств, поэтому ирландцы остаются единственной независимой кельтской нацией"
 BRI_cultural_exchange_with_ireland: "Культурный обмен с Ирландией"
 BRI_cultural_exchange_with_ireland_desc: "Культурный и торговый обмен с ирландцами поможет нивелировать английское и французское влияние в каждой из наших стран, а также способствовать росту нашей экономики"
 BRI_a_breton_army: "Бретонская армия"
 BRI_a_breton_army_desc: "Мы не можем вечно полагаться на немцев, нам следует создать собственную армию для защиты нашей родины"
 BRI_invite_german_instructors: "Пригласить немецких инструкторов"
 BRI_invite_german_instructors_desc: "Для обеспечения эффективного офицерского корпуса нам нужна помощь извне, и Германия — идеальный партнёр для этого"
 BRI_purchase_german_equipment: "Приобрести немецкое снаряжение"
 BRI_purchase_german_equipment_desc: "Приобретение немецкого снаряжения позволит нам быстро вооружить войска"
 BRI_a_domestic_arms_industry: "Собственная оборонная промышленность"
 BRI_a_domestic_arms_industry_desc: "Наличие отечественной оборонной промышленности позволит нам поддерживать нашу армию даже без посторонней помощи"
 BRI_stir_breton_nationalism: "Разжигание бретонского национализма"
 BRI_stir_breton_nationalism_desc: "Разжигание бретонского национализма позволит нам получить столь необходимых новобранцев для нашей армии"
 BRI_a_breton_airforce: "Бретонские военно-воздушные силы"
 BRI_a_breton_airforce_desc: "Обеспечение нашего присутствия в воздухе может иметь решающее значение для сохранения нашей независимости"
 BRI_purchase_seaplanes_from_germany: "Закупка гидросамолётов у Германии"
 BRI_purchase_seaplanes_from_germany_desc: "Закупка гидросамолётов у Германии обеспечит нам присутствие морской авиации"
 BRI_purchase_fighters_from_germany: "Закупка истребителей у Германии"
 BRI_purchase_fighters_from_germany_desc: "Закупка истребителей у Германии позволит нам защитить наше воздушное пространство от враждебных держав"
 BRI_purchase_bombers_from_germany: "Закупка бомбардировщиков из Германии"
 BRI_purchase_bombers_from_germany_desc: "Закупка бомбардировщиков из Германии обеспечит нашим ВВС непосредственное присутствие на поле боя"
 BRI_license_german_aircraft: "Получение лицензии на производство немецких самолётов"
 BRI_license_german_aircraft_desc: "Получение лицензии на немецкую авиацию позволит нам производить современные самолёты внутри страны, а также даст нам знания, необходимые для создания собственных моделей самолётов"
 BRI_a_breton_fleet: "Бретонский флот"
 BRI_a_breton_fleet_desc: "Бретань имеет давние морские традиции, и мы должны этим воспользоваться"
 BRI_purchase_ships_from_germany: "Закупка кораблей у Германии"
 BRI_purchase_ships_from_germany_desc: "Закупка кораблей у немецких верфей позволит нам создать небольшой, но современный военно-морской флот"
 BRI_breton_shipbuilding_bureau: "Бретонское бюро судостроения"
 BRI_breton_shipbuilding_bureau_desc: "Бюро судостроения позволит нам максимально эффективно использовать наши верфи"
 BRI_breton_officer_academy: "Бретонская академия офицеров"
 BRI_breton_officer_academy_desc: "Бретонская академия офицеров обеспечит нас способными офицерами"
 BRI_expand_university_of_rennes: "Расширение Университета Ренна"
 BRI_expand_university_of_rennes_desc: "Расширение Университета Ренна принесёт нашей нации много преимуществ" 
