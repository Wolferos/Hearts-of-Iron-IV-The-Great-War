l_french:
#########################
### BRITAIN - VICTORY ###
#########################
 int_england.1.title: "La Grande-Bretagne réclame Al Hajara !"
 int_england.1.desc: "Pourquoi ?"
 int_england.1.a: "Qu'ils en prennent pour leur grade !"
 int_england.1.b: "NON, PAS DU TOUT"
 int_england.2.title: "La Grande-Bretagne réclame Ruwaished !"
 int_england.2.desc: "Pourquoi ?"
 int_england.2.a: "Qu'ils en prennent pour leur grade !"
 int_england.2.b: "NON, PAS DU TOUT"
########################
### FRANCE - VICTORY ###
########################
 int_france.1.title: "La France annexe le Liban !"
 int_france.1.desc: "QUOI ?!"
 int_france.1.a: "On n'a pas le choix…"
 int_france.2.title: "Restauration royale"
 int_france.2.desc: ""
 int_france.2.a: "Longue vie au Roi !"
 int_france.3.title: "La France revendique le désert syrien !"
 int_france.3.desc: "Pourquoi ?"
 int_france.3.a: "Qu'ils en prennent pour leur grade !"
 int_france.3.b: "NON, PAS DU TOUT"
 int_france.4.title: "Occupation de la Rhénanie"
 int_france.4.desc: ""
 int_france.4.a: "On n'a pas besoin de ce terrain..."
 int_france.4.b: "Nous maintiendrons l'occupation de la Rhénanie !"
 int_france.5.title: "La France exige la démilitarisation !"
 int_france.5.desc: ""
 int_france.5.a: "On ne peut pas entrer en guerre avec la France…"
 int_france.5.b: "Que peut bien nous faire la France ?"
 int_france.6.title: "Les Allemands rejettent nos revendications"
 int_france.6.desc: ""
 int_france.6.a: "Il faut qu'on fasse quelque chose !"
 int_france.6.b: "Qu'il en soit ainsi…"
#########################
### GERMANY - VICTORY ###
#########################
 int_germany.1.t:0 "L'Allemagne demande des réparations de guerre"
 int_germany.1.d:0 ""
 int_germany.1.a:0 "Nous n'avons pas le choix..."
 int_germany.1.b:0 "Non"
 int_germany.2.t:0 "La Russie accepte"
 int_germany.2.d:0 ""
 int_germany.2.a:0 "Nous allons leur soutirer tous leurs marks !"
 int_germany.3.t:0 "La Russie refuse"
 int_germany.3.d:0 ""
 int_germany.3.a:0 "UND DAS IST EIN TOTALER KRIEG!"
 int_germany.3.b:0 "Nous devons faire marche arrière !"
########################
### GERMANY - DEFEAT ###
########################
 int_germany.4.t:0 "Tentative de coup d'État en Allemagne"
 int_germany.4.d:0 "Adolf Hitler, le chef du parti nazi, qui a lentement gagné en importance depuis la fin de la guerre, s'est associé à quelques membres du parti, notamment Erich Ludendorff, pour tenter un coup d'État en Allemagne. Cette tentative de coup d'État est totalement désespérée, et il est clair qu'Hitler pense qu'il a quelque chose à y gagner. Comment devons-nous réagir ?"
 int_germany.4.a:0 "Qu'il crie ! Nous ne l'écoutons pas."
 int_germany.4.b:0 "Faites-le taire ! Envoyez l'armée !"
 int_germany.9.title: "Fin de la guerre civile"
 int_germany.9.desc: "La révolution allemande est terminée… Mais nous pouvons nous arrêter en Autriche…"
 int_germany.9.a: "L'Autriche peut attendre… Commençons à reconstruire !"
 int_germany.9.b: "Lançons une petite révolution !"
 int_germany.10.title: "Fin de la révolution autrichienne"
 int_germany.10.desc: "La révolution autrichienne est terminée. Il est temps de reconstruire notre pays !"
 int_germany.10.a: "C'est parti pour la reconstruction !"
########################
### POLAND - VICTORY ###
########################
 int_poland.6.title: "On a gagné !"
 int_poland.6.desc: "Après la bataille de Poznań, les Polonais ont remporté la victoire et les Allemands se sont rendus dans la nuit !"
 int_poland.6.a: "On a réussi ! Niech żyje Polska!"
 int_poland.6.a.tt: "Les Polonais ont remporté l'insurrection de la Grande Pologne"
 int_poland.7.title: "Armistice de Trèves"
 int_poland.7.desc: ""
 int_poland.7.a: "C'est pour ça qu'on a gagné"
 int_poland.7.b: "On ne les laissera pas nous annexer !"
 int_poland.8.title: "Gdynia est polonaise"
 int_poland.8.desc: ""
 int_poland.8.a: "Nous n'avons pas de Joice"
########################
### OTHER ###
########################
 # Hitler Chancellor of Germany
 interwar_news.1.t:0 "Un nouveau chancelier pour l'Allemagne"
 interwar_news.1.d:0 "Pour tenter d'apaiser le parti national-socialiste croissant chaque mois un peu plus, et en espérant qu'il devienne innoffensif, Franz Von Papen du DNVP s'est tenu en faveur d'Hitler, que le président Von Hindenburg a accepté comme nouveau chancelier. En tant que critique virulent du traité de Versailles, cela pourrait mener à la fin de la paix si chèrement acquise..."
 interwar_news.1.a:0 "Qu'est-ce que cela signifie pour l'avenir de l'Allemagne?"
 # March on Rome (Mussolini)
 interwar_news.2.t:0 "Marche sur Rome"
 interwar_news.2.d:0 "Benito Mussolini, Emilio De Bono, Italo Balbo et Cesare Maria De Vecchi, ont pris la route de Rome avec 30 000 hommes, avec le soutien de la population. Vittorio Emmanuel III, craignant la guerre civile, a nommé Mussolini en tant que Presidente del Consiglio, c'est-à-dire premier ministre. Mussolini a déjà commencé a évincer le roi des affaires du pouvoir; et ceci pourrait bien changer toute l'Europe."
 interwar_news.2.a:0 "Un nouveau Duce pour l'Italie"
 # Wall Street Crash
 interwar_news.3.t:0 "Crash de Wall Street"
 interwar_news.3.d:0 "Le rêve d'une prospérité économique éternelle s'est effondré brutalement pour devenir un véritable cauchemar. Les pratiques frauduleuses dans le secteur bancaire aussi bien que la spéculation incontrôlée effrénée aux États-Unis ont mené la Bourse de New York a une chute historique de ses cours, connu désormais comme le "Jeudi Noir"; lequel s'est rapidement répercuté sur les marchés boursiers de Londres, Paris et ailleurs encore dans le monde. Les temps vont être particulièrement difficiles pour le monde occidental..."
 interwar_news.3.a:0 "Quelqu'un va devoir appeler le vitrier!"
  # Lenin Death
 interwar_news.4.t:0 "Lénine est mort"
 interwar_news.4.d:0 "Vladimir Ilyich Ulyanov, plus connu sous le nom de Lénine, est mort. Après une longue vie d'intrigues politiques culminant dans l'évincement du tsar et la création de l'URSS, il a finalement succombé à une hémorragie interne. Joseph Staline et Léon Trotsky, les deux chefs communistes les plus en vue de l'Union Soviétique, ont déjà commencé à s'entredéchirer pour remplir le trou béant laissé au pouvoir."
 interwar_news.4.a:0 "L'URSS ne survivra pas dix ans sans lui!"
  # Revolution in Egypt >>> https://en.wikipedia.org/wiki/Egyptian_revolution_of_1919
 interwar_news.5.t:0 "Révolution en Egypte"
 interwar_news.5.d:0 "Peu de temps après que l'armistice aie été conclu en Europe, une délégation d'activistes nationalsites égyptiens menés par Saad Zaghlul a fait une demande au haut commissaire Reginald Wingate, pour mettre fin au protectorat britannique égyptien; à la conférence de Paris. Pendant ce temps, un mouvement indépendantiste puissant s'est lancé en Egypte et au Soudan, en utilisant la résistance passive. A ce moment-là, Zaghlul et le parti de Wafd ont été très soutenu par le peuple égyptien. LEs émissaires de Wafdist sont entrés dans les villes et les villages pour rassembler les signatures autorisant les leaders du mouvement a adresser une pétition à l'Angleterre pour l'indépendance totale du pays."
 interwar_news.5.a:0 "Comment l'Empire Britannique va répondre?"
  # Polish-Soviet War >>> https://en.wikipedia.org/wiki/Polish%E2%80%93Soviet_War
 interwar_news.6.t:0 "Guerre Russo-polonaise"
 interwar_news.6.d:0 "Les soviétiques ont vu la Pologne comme le tremplin que l'Armée Rouge doit utiliser pour aider les mouvements communistes à travers l'Europe, et provoquer d'autres révolutions."
 interwar_news.6.a:0 "La Pologne peut-elle se défendre seule contre la Russie ?"
 # Second Spanish Republic
 interwar_news.7.t:0 "La deuxième République espagnole est proclamée"
 interwar_news.7.d:0 "La deuxième République espagnole a été proclamée lorsque le roi Alphonse XIII a quitté le pays à la suite des élections municipales où les candidats anti-monarchistes ont remporté la majorité des voix."
 interwar_news.7.a:0 "¡Viva el Presidente!"
 # The Turkish National Movement + The Greco-Turkish War
 interwar_news.8.t:0 "Guerre d'indépendance turque"
 interwar_news.8.d:0 "En conséquence de la défaite de l'Empire ottoman dans la Grande Guerre et l'occupation subséquente de Constantinople et la partition de l'Empire ottoman par les Alliés, les Ottomans ont vu le mouvement comme une partie d'une conspiration internationale contre eux. Certains révolutionnaires turcs se sont rebellés contre ce cloisonnement !"
 interwar_news.8.a:0 "Est-ce que Mustafa Kemal va réussir ?"
 # Occupation of Smyrna
 interwar_greco_turkish_war:0 "Guerre gréco-turque"
 interwar_news.9.t:0 "Occupation de Smyrne"
 interwar_news.9.d:0 "Les Grecs ont reçu l'ordre d'occuper Smyrne par la Triple Entente dans le cadre de la partition de l'Empire ottoman. L'Empire ottoman est à genoux mais toujours vivant !"
 interwar_news.9.a:0 "Les Grecs peuvent-ils gagner seuls ?"
  # Treaty of Lausanne
 interwar_treaty_of_lausanne:0 "Le Traité de Lausanne a été signé"
 interwar_news.10.t:0 "Traité de Lausanne"
 interwar_news.10.d:0 "Le Traité de Lausanne a été signé au Palais de Rumine, à Lausanne, en Suisse. Il régla officiellement le conflit qui existait à l'origine entre l'Empire ottoman et la France, l'Empire britannique et la Grèce depuis le début de la Première Guerre mondiale."
 interwar_news.10.a:0 "Constantinople restera sous la domination turque"
 # Irish War of Independence
 interwar_irish_war_of_independence:0 "Guerre d'indépendance irlandaise"
 interwar_news.11.t:0 "Guerre d'indépendance irlandaise"
 interwar_news.11.d:0 "La Pâques de 1916, et en particulier l'exécution de quinze personnes par un peloton d'exécution, l'emprisonnement ou l'internement de centaines d'autres, et l'imposition de la loi martiale a provoqué un profond changement dans l'opinion publique irlandaise. \nLa République d'Irlande, l'armée républicaine irlandaise, a déclenché une guerre non déclarée contre l'armée britannique."
 interwar_news.11.a:0 "Que Dieu sauve le roi"
 # Irish Free State
 interwar_irish_free_state:0 "État libre d'Irlande"
 interwar_news.12.t:0 "Création de l'État libre d'Irlande"
 interwar_news.12.d:0 "Le conflit entre les forces de la République irlandaise autoproclamée, l'Armée républicaine irlandaise (IRA) et les forces de la Couronne britannique est terminé. L'État libre d'Irlande est créé !"
 interwar_news.12.a:0 "Saoirse !"
  # The Locarno_Treaties
 interwar_news.13.t:0 "Les accords de Locarno"
 interwar_news.13.d:0 "Les puissances alliées de l'Europe de l'Ouest et les nouveaux États d'Europe centrale et orientale ont cherché à assurer le règlement territorial d'après-guerre et à rétablir des relations normatives avec l'Allemagne vaincue. Il a également été déclaré que l'Allemagne ne ferait jamais la guerre avec les autres pays."
 interwar_news.13.a:0 "La paix est garantie"
  # Iraqi Revolt against the British # Open Beta 0.6
 interwar_news.14.t:0 "Révolte irakienne contre les Britanniques"
 interwar_news.14.d:0 "En Irak, les Britanniques se sont débarrassés de la plupart des anciens fonctionnaires ottomans et la nouvelle administration était composée principalement de fonctionnaires britanniques. Beaucoup de gens en Irak ont commencé à craindre de faire partie de l'Empire britannique. Au point que l'un des plus éminents moudjahidin chiites, l'ayatollah Muhammad Taqi al-Shirazi, a alors publié une fatwa déclarant que le service dans l'administration britannique était illégal."
 interwar_news.14.a:0 "Comment réagira l'Empire britannique ?" 
  # Mehmed VI on the throne after the death of Mehmed V
 interwar_news.15.t:0 "Mehmed VI est le nouveau sultan de l'empire ottoman"
 interwar_news.15.d:0 "Après la mort de Mehmed V, son frère ; Mehmed VI fut ceint de l'épée d'Osman le 4 juillet 1918, comme le trente-sixième padishah. Il est maintenant le nouveau sultan de l'Empire ottoman et le nouveau Calife de l'Islam. Mais il n'a le pouvoir que sur le papier, en fait c'est surtout la CUP (Commission pour l'Unité et le Progrès) qui contrôle maintenant ce qui se passe en Turquie...."
 interwar_news.15.a:0 "Peut-il empêcher la CUP de prendre le pouvoir ?"


  # Józef Piłsudski death
 interwar_news.16.t:0 "Józef Piłsudski est mort"
 interwar_news.16.d:0 "Józef Piłsudski était un patriote polonais qui a consacré sa vie à la réalisation d'une nation polonaise indépendante. Sa carrière a été un triomphe de capacité et de volonté contre d'énormes difficultés. Il n'a pas choisi de devenir le leader de l'indépendance polonaise ; ce rôle lui a été imposé.\n\nNé dans la partie de la Pologne sous contrôle russe en 1867, sa famille était pauvre mais aristocratique, descendant des princes lituaniens, mais entièrement polonaise. Après l'école secondaire, il s'inscrit en 1885 dans une école de médecine à Kharkov. Les autorités scolaires prennent conscience de sa haine pour l'Empire russe et le suspendent en 1886 pour manque de fiabilité politique.\nIl meurt en 1935 d'un cancer du foie à l'âge de 67 ans."
 interwar_news.16.a:0 "Un diamant parmi les héros de la Pologne"
 EVENT_hoi4tgw_interwar_jozef_pilsudski_death:0 "Józef Piłsudski est mort"


  # Wall Street Bombing # https://en.wikipedia.org/wiki/Wall_Street_bombing
 interwar_news.17.t:0 "Attentat de Wall Street"
 interwar_news.17.d:0 "Le 16 septembre 1920, une charrette tirée par des chevaux et transportant un énorme explosif improvisé a explosé au coin de rue le plus fréquenté de Wall Street. Un témoin oculaire a décrit "deux nappes de flammes qui semblaient envelopper toute la largeur de Wall Street et atteindre la hauteur du dixième étage des grands immeubles". Trente-huit personnes ont été tuées dans l'attentat de Wall Street, et des centaines ont été blessées."
 interwar_news.17.a:0 "Qui a fait ça... peut-être les Anarchistes ?"

  # Earthquake in China # https://en.wikipedia.org/wiki/1920_Haiyuan_earthquake
 interwar_news.18.t:0 "Tremblement de terre massif en Chine"
 interwar_news.18.d:0 "Le 16 décembre 1920, la province du Gansu en Chine a été victime d'un violent tremblement de terre. D'une magnitude de 7,8 sur l'échelle de Richter, il a provoqué un changement de cours des rivières et des glissements de terrain qui ont déversé des montagnes. La destruction s'est étendue à sept provinces chinoises. La ville de Sujiahe, dans le comté de Xiji, a été complètement ensevelie sous un glissement de terrain. On estime à 200 000 le nombre de morts dans cette catastrophe."
 interwar_news.18.a:0 "La nature est parfois cruelle..."

  # France Leaves Rhineland
 interwar_news.19.title: "La France quitte la Rhénanie"
 interwar_news.19.desc: ""
 interwar_news.19.a: "C'est bien… Je crois…"

  # France Stays In Rhineland
 interwar_news.20.title: "La France reste en Rhénanie"
 interwar_news.20.desc: ""
 interwar_news.20.a: "Ils n'ont pas peur de… la guerre ?"
 interwar_news.20.b: "Bon choix."

  # France Stays In Rhineland
 interwar_news.21.title: "La Pologne annexe la Grande-Pologne !"
 interwar_news.21.desc: ""
 interwar_news.21.a: "Super nouvelle !"
 interwar_news.21.b: "Maudite Pologne !"

  # Suwałki Agreement
 interwar_poland_events.1.t:0 "Accord de Suwałki"
 interwar_poland_events.1.d:0 "Sous la pression de la Société des Nations, la Pologne a accepté de négocier avec nous pour établir une ligne de démarcation et accepter un cessez-le-feu. Comment devrions-nous réagir ?"
 interwar_poland_events.1.a:0 "Signer l'accord"
 interwar_poland_events.1.b:0 "Continuer le combat !"

# Coup d'état in Lithuania
 interwar_poland_events.2.t:0 "Coup d'état en Lituanie"
 interwar_poland_events.2.d:0 "Les services secrets lituaniens ont intercepté et décodé l'ordre de retarder le coup d'État et le gouvernement lituanien a été informé de la coupure des fils télégraphiques et a intercepté notre ordre. Nous avons été informés de nombreuses arrestations massives de partisans polonais dans la nuit. Cette tentative de coup d'État est un échec complet..."
 interwar_poland_events.2.a:0 "Putain de merde !"

 # POL ask for a Ceasefire to SOV
 interwar_poland_events.3.t:0 "Mettre fin à la guerre polono-soviétique ?"
 interwar_poland_events.3.d:0 "Les Polonais ont proposé un cessez-le-feu, étant donné la situation, il serait sage de bien réfléchir à notre décision. Que devrions-nous faire ?"
 interwar_poland_events.3.a:0 "Accepter le cessez-le-feu"
 interwar_poland_events.3.b:0 "Décliner le cessez-le-feu"

 # POL ask for a Ceasefire to UKR
 interwar_poland_events.4.t:0 "Mettre fin à la guerre polono-ukrainienne ?"
 interwar_poland_events.4.d:0 "Les Soviétiques sont en guerre contre nos deux pays, peut-être serait-il plus sage d'unir nos forces pour vaincre la menace rouge..."
 interwar_poland_events.4.a:0 "D'accord, faites le nécessaire"
 interwar_poland_events.4.b:0 "On ne peut pas leur faire confiance"

 # POL ask for a Ceasefire to RUS
 interwar_poland_events.5.t:0 "La Pologne reconnaît l'autorité de l'Empire russe"
 interwar_poland_events.5.d:0 "Les Polonais sont en mauvaise posture face aux Bolcheviks et ils demandent notre aide. Bien sûr, ils sont maintenant prêts à reconnaître que seuls les Russes sont capables de vaincre les Rouges. Après notre victoire, les Polonais devront accepter nos décisions."
 interwar_poland_events.5.a:0 "Les Polonais ont reconnu leur mère la Russie"
 interwar_poland_events.5.b:0 "Ces traîtres ne valent pas mieux que les Rouges"

  # The Turks accuse the Greeks
 interwar_turkey.1.t:0 "Les Turcs accusent les Grecs"
 interwar_turkey.1.d:0 "Plusieurs fonctionnaires turcs ont publiquement accusé les Grecs d'avoir commis des massacres à Izmir. Une commission interalliée enquête sur ces incidents, mais pour l'instant, la Commission a déclaré que le massacre n'était pas organisé par le commandement grec. De leur côté, les militaires grecs ont affirmé qu'ils avaient été attaqués dans la ville."
 interwar_turkey.1.a:0 "C'est une sale guerre..."

  # Indisputable Greek Victory over TUK
 interwar_turkey.2.t:0 "Victoire incontestable de la Grèce"
 interwar_turkey.2.d:0 "Coincés de tous côtés, les Turcs ont accepté de signer un armistice d'urgence comme les Allemands à Compiègne. Dans cette histoire, les Grecs sortent grands vainqueurs et des scènes de liesse se déroulent à Athènes."
 interwar_turkey.2.a:0 "Constantinople parlera à nouveau le Grec"

  # TUK ask for a Ceasefire to GRE
 interwar_turkey.3.t:0 "Les Turcs demandent la paix"
 interwar_turkey.3.d:0 "Les Turcs ne peuvent plus tenir, ils sont prêts à accepter n'importe quoi, nous devrions profiter de la situation et saisir cette chance."
 interwar_turkey.3.a:0 "La plus grosse part du gâteau sera la nôtre"
 interwar_turkey.3.b:0 "Poursuivre l'offensive"

  # Proclamation of the Republic of Turkey
 interwar_turkey.4.t:0 "Proclamation de la République de Turquie"
 interwar_turkey.4.d:0 "La République de Turquie a été proclamée après le renversement du Sultan Mehmet VI par le nouveau Parlement républicain. Ce nouveau régime a porté le coup de grâce à l'État ottoman qui avait été pratiquement effacé de la scène mondiale après la Première Guerre mondiale."
 interwar_turkey.4.a:0 "L'empire ottoman est désormais une chose du passé"

 interwar_turkey.5.t: "Question de l'Azerbaïdjan"
 interwar_turkey.5.d: "Les Turcs d'Azerbaïdjan étant désormais libres, de nouvelles opportunités se sont ouvertes pour la région. Que devons-nous faire ?"
 interwar_turkey.5.a: "Nous unirons nos nations pour former un grand État turc !"
 interwar_turkey.5.b: "Assurez-leur une protection"
 interwar_turkey.5.c: "Un pacte d'amitié réciproque suffira"
 interwar_turkey.6.t: "La Turquie propose un accord frontalier et un traité d'amitié mutuelle"
 interwar_turkey.6.d: "Aujourd'hui, un émissaire du Mouvement national turc nous a contactés pour nous faire une proposition concernant le Caucase. Que devons-nous faire ?"
 interwar_turkey.6.a: "Accepter le traité"
 interwar_turkey.6.b: "Le rejeter"
 interwar_turkey.7.t: "Les Soviétiques acceptent le traité"
 interwar_turkey.7.d: "Après un bref moment d'attente, le gouvernement soviétique a accepté notre proposition de traité."
 interwar_turkey.7.a: "Bien"
 interwar_turkey.8.t: "Les Soviétiques rejettent le traité"
 interwar_turkey.8.d: "Après un bref moment d'attente, le gouvernement soviétique a rejeté notre proposition de traité."
 interwar_turkey.8.a: "C'est leur perte"
 interwar_turkey.9.t: "Les Turcs revendiquent la Thrace et les îles de la mer Égée !"
 interwar_turkey.9.d: "Que devrions-nous faire ?"
 interwar_turkey.9.a: "Accepter"
 interwar_turkey.9.b: "Refuser"
 interwar_turkey.10.t: "La Grèce accepte nos revendications !"
 interwar_turkey.10.d: "Craignant une perte considérable, le gouvernement grec a accepté nos exigences."
 interwar_turkey.10.a: "Bien"
 interwar_turkey.11.t: "La Grèce rejette nos revendications !"
 interwar_turkey.11.d: "Pensant pouvoir nous battre cette fois-ci, le gouvernement grec a rejeté nos revendications sans ménagement. Que devons-nous faire ?"
 interwar_turkey.11.a: "Ils doivent savoir que nous ne bluffons pas !"
 interwar_turkey.11.b: "On ne peut pas entrer en guerre dans ces conditions…"
 interwar_turkey.12.t: "La Turquie propose un accord"
 interwar_turkey.12.d: "Que devrions-nous faire ?"
 interwar_turkey.12.a: "Accepter"
 interwar_turkey.12.b: "Refuser"
 interwar_turkey.13.t: "La Turquie réclame notre annexion !"
 interwar_turkey.13.d: "Que devrions-nous faire ?"
 interwar_turkey.13.a: "Accepter"
 interwar_turkey.13.b: "Refuser"
 interwar_turkey.14.t: "La Turquie revendique la Syrie !"
 interwar_turkey.14.d: "Que devrions-nous faire ?"
 interwar_turkey.14.a: "Accepter"
 interwar_turkey.14.b: "Refuser"
 interwar_turkey.15.t: "La Turquie exige Mosoul"
 interwar_turkey.15.d: "Que devrions-nous faire ?"
 interwar_turkey.15.a: "Accepter"
 interwar_turkey.15.b: "Refuser"
 interwar_turkey.20.t: "L'Arménie demande une capitulation conditionnelle"
 interwar_turkey.20.d: "Après avoir pris les villes de Kars et d'Ardahan, le gouvernement arménien d'Erevan a cédé à la panique et a demandé la paix. Que devons-nous faire ?"
 interwar_turkey.20.a: "Accepter"
 interwar_turkey.20.b: "En route pour Erevan !"
 interwar_turkey.500.t: "Proclamation du Sultanat turc"
 interwar_turkey.500.d: "Aujourd’hui, dans la ville de Konstantiniyye, récemment libérée, le chef du Mouvement national turc a proclamé la création du Sultanat turc. Alors qu’au départ, le gouvernement national se montrait méfiant à l’égard de la monarchie, il a fini par changer d’avis à l’issue d’une série de conférences et a reconnu le Sultan Abdulmejid II comme monarque de l’État. Une grande partie du monde ayant reconnu ce nouvel État, l'espoir d'un âge d'or turc a commencé à naître."
 interwar_turkey.500.a: "J'espère que cette fois-ci, ils ne tomberont pas malades !"
