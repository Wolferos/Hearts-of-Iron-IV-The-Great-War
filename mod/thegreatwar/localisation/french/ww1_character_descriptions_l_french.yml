 # SPR
 SPR_alfonso_xiii_desc: "Le roi Alphonse XIII, 'El Africano', a régné sur l'Espagne depuis la fin de la régence de sa mère en 1902. Bien que l'Espagne soit légalement une monarchie constitutionnelle, ces dernières années, il est devenu l'enfant favori des aristocrates et dirige pratiquement le pays lui-même. Avec le début de la nouvelle décennie, le projet du roi de moderniser le pays se poursuit. Viva Rey Alfonso!"
