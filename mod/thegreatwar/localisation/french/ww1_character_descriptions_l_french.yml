 # SPR
 SPR_alfonso_xiii_desc: "Le roi Alphonse XIII, « El Africano », règne sur l'Espagne depuis la fin de la régence de sa mère en 1902. Bien que l'Espagne soit officiellement une monarchie constitutionnelle, il est devenu ces dernières années le chouchou des aristocrates et dirige pratiquement le pays de main de maître. En ce début de nouvelle décennie, le projet du roi visant à moderniser le pays se poursuit. Vive le roi Alphonse !"
