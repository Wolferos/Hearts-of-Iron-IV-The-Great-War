#--------------------------------------------------------------
# Army Tree
#=========================================================================
 MEX_ww1_army_effort: "Restaurer l'armée mexicaine"
 MEX_ww1_army_effort_desc: "L'instabilité récente du pays a radicalement affecté notre armée. Nous devons rétablir une chaîne de commandement et une doctrine adéquates si nous voulons avoir l'espoir de survivre à de futurs conflits internes - ou à Dieu ne plaise, aux invasions étrangères ..."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 MEX_ww1_form_air_force: "Fonder l'armée de l'air mexicaine"
 MEX_ww1_form_air_force_desc: "Le prédécesseur officiel de l'Armée de l'Air fut la Milice Aérienne Auxiliaire Militaire, créée en avril 1913, durant la Révolution mexicaine par le secrétaire de la guerre et Général de la Marine, Manuel Mondragon. C'est lui qui autorisa les pilotes Miguel Lebrija et Juan Guillermo Villasana a bombarder des cibles à Campo de Balbuena, directement à Mexico. Le 5 Février 1915, le chef de l'Armée Constitutionnelle, Venustiano Carranza, fonda l'Arma de Aviación Militar, qui allait devenir l'Armée de l'Air mexicaine."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 MEX_ww1_naval_effort: "Reconstruire la marine mexicaine"
 MEX_ww1_naval_effort_desc: "Après la Révolution, notre marine est devenue dépassée et nos navires, obsolètes. Nous devons reconstruire la flotte nationale afin de lui donner la capacité de protéger les mers du Pacifique et de l'Atlantique."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 mex_political_effort: "Effort politique"
 mex_political_effort_desc: "Le temps de la réforme est venu. Alors que la nation ai prospéré sous la direction du système de ces bonnes vielles années, les récents temps turbulents exigent un gouvernement qui est en mesure d'y répondre. Que nous choisissions de changer notre façon de gouverner la nation, ou de renforcer notre gouvernement actuel pour faire face aux nouvelles menaces extérieures, le changement politique ne peut que profiter à l'avenir de notre nation et de notre peuple."
 mex_ww1_sovereignist_ethos: "Soutenir la démocratie de Madero"
 mex_ww1_sovereignist_ethos_desc: "The authority of the state has been too split for too long. By reducing the powers of our substates compared to our central government, we will overcome regionalism and factionalism to make a stronger nation, which will inevitably open the door to enact further measures."
 mex_ww1_Support_the_democracy: "Soutenir la démocratie"
 mex_ww1_Support_the_democracy_desc: "On dit que tout dirigeant, au plus profond, tire son pouvoir du peuple. Si nous nous dirigeons vers une société plus démocratique, même si nous ne le devenons pas, nous pouvons au moins arriver dans une position beaucoup plus confortable pour commercer avec les diverses nations démocratiques du monde."
 mex_ww1_centralizedpower: "Programme travailliste"
 mex_ww1_centralizedpower_desc: "En temps de guerre, ou immédiatement avant ou après, chaque personne a un travail à faire pour sa nation. Si nous prenons les vagabonds, les sans-abri et tous les autres profiteurs qui ne peuvent pas trouver de travail afin de construire pour nous, nous pourrons créer de nouveaux manufacturiers pour presque rien, et l'usine peut même embaucher dans le même bassin ouvrier si besoin."
 mex_ww1_freespeech: "La liberté d'expression"
 mex_ww1_freespeech_desc: "En donnant aux gens le droit à la liberté d'expression et de manifestation, nous nous assurons que, à tout le moins, que les gens puissent exprimer leur colère et leurs positions d'une manière plus créative. Toute personne qui crie «Au Feu!» dans un cinéma bondé, ou utilise un quelconque terme pour décrire la mère du chef de l'État, ira toujours en prison."
 mex_ww1_reorganization_act: "Loi sur la réorganisation"
 mex_ww1_reorganization_act_desc: "Une grande partie de notre territoire a été sous la possession de divers groupes et individus depuis que la civilisation est venue à notre humble nation. Cependant, sur des centaines d'années, une grande partie de ce territoire a été mal aménagée ou utilisée. En réorganisant les terres et les propriétaires de notre pays, en particulier ceux qui sont restés inactifs, nous pouvons faire entrer dans nos usines des certaines des personnes nouvellement déplacées."
 mex_ww1_full_rearmament: "Rationnement Strict"
 mex_ww1_full_rearmament_desc: "Pour nos héros courageux qui défendent activement la nation, ils devraient avoir une priorité absolue pour la nourriture et les matériaux ! Bien sûr, la population civile peut compter littéralement ses haricots et nous pourrions avoir une population plus agitée à cause de cela, mais au moins, nos garçons en uniforme n'auront jamais faim."
 Mex_collectivist_ethos: "Soutenir d'autres leaders révolutionnaires"
 Mex_collectivist_ethos_desc: "L'ancien État est condamné à tomber, emportant notre pays à moins que nous ne prenions des mesures extrêmes. En adoptant une position plus sévère et en orientant notre pays vers une forme de gouvernement plus extrême, nous serons en mesure de nous protéger et de protéger efficacement nos intérêts nationaux dans le monde d'aujourd'hui."
 Mex_nationalism_focus: "Soutenir Pancho Villa"
 Mex_nationalism_focus_desc: "La fierté nationale et l'amour de notre patrie connaît une nouvelle ère, vu les récents évènements. Certains de nos experts politiques théorisent une nouvelle forme de gouvernement, connue sous le nom de... fascisme, qui place la Nation au centre de tout. Peut-être que ce gouvernement pourrait conduire notre empire bien-aimé à sa nouvelle gloire!"
 mex_militarism: "Militarisme"
 mex_militarism_desc: "Notre armée croissante devient de plus en plus une partie de la vie quotidienne de notre nation. Heureusement, le soutien populaire favorise actuellement nos troupes, les considérant comme les héros qui se battent pour notre bannière. Cette culture militaire que nous établissons ne fait que favoriser la cause de nos forces armées."
 mex_military_youth: "Jeunesse militaire"
 mex_military_youth_desc: "Notre culture militariste doit même être présente avec les enfants ! En forçant le respect pour les militaires, et même en offrant une formation militaire aux jeunes générations, nous pouvons nous assurer qu'ils grandissent pour s'enrôler au service de notre glorieux régime. Certains pourraient appeler cela de l'embrigadement forcé, mais cela sonne mieux quand vous dites que vous donnez un brillant avenir aux adolescents."
 mex_paramilitarism: "Paramilitarisme"
 mex_paramilitarism_desc: "Certaines nations sont assez sottes pour condamner les groupes civils armés, par crainte de la rébellion. Cependant, si nous prenons soin de limiter ces milices ad hoc aux loyalistes du régime, nous pouvons créer un autre groupe d'hommes en colère avec des armes qui soutiennent notre nation, ce qui pourrait bien nous servir en cas de guerre."
 mex_internationalism_focus: "Soutenez Emiliano Zapata"
 mex_internationalism_focus_desc: "The Communist Revolution cannot be stopped. It is better that our people embrace it and embrace it now, than have a civil war for it later. Once we openly begin our support for the Internationalist Communist Movement, we shall become as red as the blood of man."
 mex_political_correctness: "Politiquement correct"
 mex_political_correctness_desc: "Toute personne qui dénonce notre mouvement le fait clairement en tant que crime haineux envers les personnes que nous soutenons. Par conséquent, toute personne qui parle du régime doit être surveillée de près et, peut-être, emprisonné."
 mex_indoctrination_focus: "Endoctrinement"
 mex_indoctrination_focus_desc: "Après de nombreuses années de débats sur la façon d'amener les citoyens anti-communistes turbulents à soutenir enfin notre merveilleux nouveau régime, certains des membres du Conseil des Travailleurs ont suggéré la création d'un nouveau "Ministère de l'Amour" qui, officiellement, persuade humainement les gens à comprendre pourquoi ils devraient soutenir notre gouvernement. Nous ne parlons pas de ce qui se passe officieusement là-bas."
 mex_political_commissars: "Commissaires Politiques"
 mex_political_commissars_desc: "L'armée, ironiquement, est un endroit où le soutien anti-communiste prospère. En veillant à ce que notre gouvernement  ait des yeux partout, nous pouvons extirper la dissidence de ces groupes avant qu'elle ne puisse augmenter."
 mex_ww1_unitedpeople: "Ferveur patriotique"
 mex_ww1_unitedpeople_desc: "Une population motivée peut faire de grandes choses ! En inspirant nos gens à se rassembler autour de notre bannière sacrée, nous pouvons facilement gagner leurs coeurs et leurs esprits, et les enchaîner pour, eh bien, tout ce que nous voulons faire, vraiment, tant que nous avons une force opposée suffisamment importante face à nos Bons gars."
 mex_ww1_massive_effort: "Effort Massif"
 mex_ww1_massive_effort_desc: "Chaque homme et chaque femme doit aider les efforts de notre nation ! Avec le spectre de la Grande Guerre flottant sur tous, un grand programme a été entrepris pour renforcer notre capacité industrielle pour nous aider à surmonter nos rivaux les plus détestés !"
 mex_ww1_fortify_city: "Fortifications Civiles"
 mex_ww1_fortify_city_desc: "Quand le combat arrive à nos frontières, mieux vaut être préparé. En engageant des ouvriers de chantier pour construire des forts et des bunkers dans certaines de nos provinces frontalières, nous pouvons en toute sécurité repousser tout ennemi qui oserait nous attaquer !"
 mex_ww1_fortify_coast: "Défense Côtière"
 mex_ww1_fortify_coast_desc: "Un littoral n'est pas une chose facile à défendre. Avec des navires capables de débarquer des troupes sur presque toute côte de notre nation, il nous faut des forts côtiers. Ces structures peu coûteuses peuvent aider contre les invasions marines, et ne sont pas des bâtiments difficiles à construire. Elles aideront à rejeter nos ennemis dans l'océan d'où ils sont venus."
 mex_ww1_improve_our_puertos: "Améliorer notre marine"
 mex_ww1_improve_our_puertos_desc: "Étant en guerre, notre marine reste faible devant l'ennemi. Cela aidera à défendre nos ports que d'investir dans de nouvelles coques!"
 mex_ww1_Restore_Autocracy: "Restaurer le régime autoritaire"
 mex_ww1_Restore_Autocracy_desc: "Peut-être que ce truc de démocratie ne fonctionne pas si bien, après tout. Madero est un bon président, certes, mais clairement l'état a besoin de plus de pouvoir et de centralisation. Un général nommé Victoriano Huerta peut être qualifié pour aider à cette cause ..."
 mex_ww1_Unify_all_indigenous_languages: "Unifier tous les peuples autochtones"
 MEX_ww1_Unify_all_indigenous_languages_desc: "Bien que le temps de la colonisation soit terminé, beaucoup de gens sont encore des descendants des peuplades indigènes amérindiennes, ce qui les sépare du reste de la population, et les laisse incapables de communiquer, ou même de servir le pays."
 mex_support_revolucionary_forces: "Soutenez les forces révolutionnaires"
 mex_support_revolucionary_forces_desc: "Après 31 ans de dictature brutale, des Mexicains furieux se soulèvent contre le gouvernement fédéral. Ils veulent le renverser."
 mex_ww1_Take_Action: "Re-centralisation"
 mex_ww1_Take_Action_desc: "Qui a besoin des droits autochtones et individuels quand le gouvernement pourrait tous les garder ? De nouvelles lois conçues pour donner plus de pouvoir au gouvernement nous aideront à exercer un pouvoir et à établir un certain ordre dans cet état ténu."
 mex_ww1_preserve: "Héroïsme"
 mex_ww1_preserve_desc: "Il semble qu'au moins un homme dans chaque régiment a une histoire incroyable à raconter sur la bravoure et l'intrigue dans la bataille, à déjouer un ennemi ou à tirer un exploit incroyable. Enchâsser ces hommes dans notre culture et leur donner une place spéciale dans nos divisions conduira le reste de nos troupes à tenter d'imiter ce même succès."
 mex_ww1_paramilitarism: "Priorité Défensive"
 mex_ww1_paramilitarism_desc: "Si vous voulez voir la preuve que l'État mexicain est fatigué des combats à l'intérieur de ses propres frontières, il suffit de voir la taille de nos recrues militaires. Nous devons tirer le meilleur parti de cela. Une formation approfondie donnée aux forces de seconde zone peut les amener au même niveau que nos troupes régulières."
 MEX_ww1_Strengthen_military_forces: "Renforcer les Forces Militaires"
 MEX_ww1_Strengthen_military_forces_desc: "Il y a encore des domaines où des améliorations peuvent être apportées à nos équipements et à nos pratiques de formation. Tout ça pour avoir une meilleure armée ..."
 MEX_ww1_Recluting_the_rebels: "Recruter les Rebelles"
 MEX_ww1_Recluting_the_rebels_desc: "Après la Révolution, il restait encore un certain nombre d'ex-combattants des forces rebelles, maintenant désoeuvrés. Nous devrions les recruter, avant qu'ils ne recommencent à faire ce qu'ils font le mieux..."
 MEX_ww1_Rebuild_Mexico: "Reconstruire le Mexique"
 MEX_ww1_Rebuild_Mexico_desc: "La Révolution a laissé le Mexique exsangue et presque entièrement ravagé. Nous devons aller de l'avant, et reconstruire le pays. Au travail!"
 MEX_ww1_Renew_the_republic: "Renouveler la République"
 MEX_ww1_Renew_the_republic_desc: "Soutenir le gouvernement de Victoriano Huerta. Porfirio diaz est sa main droite!"
 MEX_ww1_supress_the_rebels: "Supprimer les rebelles"
 MEX_ww1_supress_the_rebels_desc: "Nous arrêtons les rebelles étant en possession d'un plan de San Louis plan. Si nous agissons maintenant, nous pouvons prévenir tout mouvement insurrectionnel!"
 MEX_ww1_support_diaz: "Soutenir Porfirio Diaz"
 MEX_ww1_support_diaz_desc: "Notre gouvernement est prospère, militairement et économiquement. Mais il est harcelé par les rebelles... et nous devons les exterminer. "
 MEX_ww1_Save_Madero: "Transition pacifique"
 MEX_ww1_Save_Madero_desc: "La partie la plus importante de la preuve de la légitimité de notre nouvelle constitution est la première transition de pouvoir. Il est très important de céder la propriété légitime de l'État au prochain président. Venustiano Carranza se prépare à se présenter aux élections, et le fait de s'assurer qu'il sera en mesure de prendre le pouvoir s'il est élu prouvera que notre démocratie fonctionne."
 MEX_ww1_subjugate_UPCA: "Restaurer la première république"
 MEX_ww1_subjugate_UPCA_desc: "La première république engloblait l'ensemble de l'Amérique Centrale, qui était spoliée par les traîtres, lesquels l'avaient transformée en une fédération instable et divisée en petits pays. Nous devons reprendre ce qui nous appartient!"
 mex_ww1_Lessons_of_war: "Leçons de guerre"
 MEX_ww1_Lessons_of_war_desc: "Après avoir recouvré notre dû, nous avons appris certaines tactiques militaires, ainsi que plusieurs stratégies qui nous aideront dans les guerres futures, et grâce auxquelles nous pourront nous défendre convenablement."
 mex_ww1_2nd_Mexican_American_war: "Reprendre Aztlan"
 MEX_ww1_2nd_Mexican_American_war_desc: "Ils utilisaient le nom de Aztlán pour désigner les terres du Mexique du nord, qui étaient annexxées par les États-Unis suite à la guerre américano-mexicaine. Aztlán est devenue un symbole pour les activistes de mestizo qui croient en leur droit primordial et légal de disposer de ces terres. Afin d'exercer ce droit, certains membres du gouvernement Chicano proposent qu'une nouvelle nation soit créée... la República del Norte."
 mex_ww1_Support_the_columbus_raid: "Soutenir le raid de Columbus"
 MEX_ww1_Support_the_columbus_raid_desc: "L'expédition de Pancho Villa est maintenant connue aux États-Unis comme l'Expédition Mexicaine, mais était au départ connue comme l'Expédition Punitive. Cette expédition était une opération militaire américaine, conduite par les Américains contre les forces paramilitaires de la révolution Mexicaine, entre 1910 et 1920. L'expédition fut lancée en réponse à l'attaque de Villa sur la ville de Columbus, au Nouveau-Mexique."
 MEX_ww1_demand_belice: "Revendiquer Belice"
 MEX_ww1_demand_belice_desc: "Après l'union des provinces de l'Amérique Centrale, le Royaume-Uni a séparé la région de Belice du Mexique, et l'a donné au Guatemala. Elle nous revient de droit!"
 MEX_ww1_Reconquer_the_UPCA: "Reconquérir les P.U.A.C"
 MEX_ww1_Reconquer_the_UPCA_desc: "Nous revendiquons les Provinces Unies d'Amérique Centrale. Nous avons un droit légitime sur ces terres, qui sont un territoire officiel de la première république!"
 mex_ww1_Plan_of_San_Diego: "Plan de San Diego"
 MEX_ww1_Plan_of_San_Diego_desc: "Le Plan de San Diego prévoyait certaines actions extrêmes, entre autres l'exécution de tous les hommes américains adultes dans les états du sud, et le retour de ces terres aux américains natifs. Les raids au Texas commencèrent en juillet 1915. Ils étaient effectués par les Rangers du Texas, l'armée américaine et des milices locales. Au total, une trentaine de raids au Texas détruisirent une grande quantité de propriétés, et tuèrent 21 américains. On ignore de nos jours qui conçut ce plan, mais certaines théories pensent que les chefs de la révolution mexicaine y prirent plus ou moins part."
 mex_ww1_Prepare_the_reconquista: "Préparer la Reconquista"
 MEX_ww1_Prepare_the_reconquista_desc: "Après l'humiliation de 1846 et de 1848, nous devons reprendre les territoires qui nous reviennent légitimement. Et restaurer ainsi l'ordre et la gloire du Mexique!"
 mex_ww1_Stabilize_the_country: "Stabiliser le pays"
 MEX_ww1_Stabilize_the_country_desc: "Les armes se sont tues. Pour assurer la prospérité de notre nation, il nous faut apaiser les esprits et stabiliser notre nation et sa politique."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 mex_why_we_fight: "Pourquoi nous Combattons"
 mex_why_we_fight_desc: "Chaque jour, le monde devient plus dangereux que la veille. Notre peuple a besoin de voir de ses yeux les atrocités commises par ceux qui détiennent le pouvoir. Il est temps de rallier le peuple à notre cause, et nous assurer que tous sont prêts à combattre pour notre liberté."
 mex_Invite_Argentina: "Inviter l'Argentine"
 mex_Invite_Argentina_desc: "L'Argentine a une base de main-d'œuvre solide et une armée décente, mais ils ont des problèmes avec le Brésil. Si nous intervenons dans la résolution de ce conflit, nous serons probablement en mesure de garantir leur adhésion."
 mex_Invite_Brazil: "Inviter le Brésil"
 mex_Invite_Brazil_desc: "Le Brésil est l'un des principaux pays de l'hémisphère sud, mais il y a des conflits mineurs dans la région. La diplomatie mexicaine peut résoudre ce problème et, espérons-le, apportera une belle addition à notre alliance."
 mex_Invite_COL: "Inviter la Colombie"
 mex_Invite_COL_desc: "La Colombie n'est pas si éloignée de nous, et leur adhésion rendra presque notre alliance contiguë - avec la saisie du Panama et de l'Amérique centrale, bien sûr, ce sera le cas. De toute évidence, leur invitation devrait être une priorité."
 mex_Invite_Bolivia: "Inviter la Bolivie"
 mex_Invite_Bolivia_desc: "La Bolivie n'est pas le membre le plus avancé ou le plus remarquable de l'UNASUR, mais ils ont exprimé leur volonté de se joindre à l'UNASUR, et aussi longtemps qu'ils ont un chemin vers notre nation, pourquoi pas ?"
 mex_technology_sharing: "Partage de Technologie"
 mex_technology_sharing_desc: "En partageant les progrès technologiques avec nos alliés, toute notre faction sera en mesure de mener plus efficacement la recherche et le développement en temps de guerre."
