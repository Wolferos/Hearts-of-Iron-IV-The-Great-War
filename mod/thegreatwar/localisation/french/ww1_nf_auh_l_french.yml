l_french:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 AUH_ww1_army_effort: "Landstreitkräfte Österreich-Ungarns"
 AUH_ww1_army_effort_desc: "L'armée austro-hongroise est en fait divisée en trois forces: une force autrichienne, une force hongroise et une force commune, qui fonctionnent toutes avec leurs propres officiers et personnels. La modernisation d'une telle force est une tâche difficile, mais possible, et conduira inévitablement à une force armée plus efficace."
 #--------------------------------------------------------------
 # Aviation Effort
 #=========================================================================
 AUH_ww1_form_air_force: "Formation de la K.u.K. Luftfahrtruppen"
 AUH_ww1_form_air_force_desc: "Ces nouveaux avions sont des jouets intéressants, et ont peut-être une certaine valeur militaire. Les pilotes civils pourraient facilement être attirés par nos militaires, les experts pourraient nous enseigner comment utiliser ces trucs ultramodernes, et si ce projet porte ses fruits, nous pouvons gagner un avantage décisif sur nos adversaires qui sont en retard dans ce domaine, notamment dans les doctrines aériennes."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 AUH_ww1_naval_effort: "Renforcer la K.u.K. Kriegsmarine"
 AUH_ww1_naval_effort_desc: "Bien que l'Autriche n'ait pas été enclavée depuis le 14ème siècle, notre empire ne c'est jamais vanté d'avoir une marine particulièrement redoutable. Cependant, mieux vaut tard que jamais. Un grand programme de modernisation pour soutenir notre construction de navires flambant neufs nous permettra espérons-le, d'avoir une force navale capable de rivaliser dans la mer méditerranée."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 AUH_ww1_political_effort: "Développement politique"
AUH_ww1_political_effort_desc: "Le temps de la Réforme est venu. La nation a été bien dirigée selon les vieux principes depuis des années, mais ces temps difficiles que nous traversons exigent un gouvernement capable d’y répondre. Si nous voulons pouvoir changer de voie, ou soutenir notre gouvernement actuel afin de résister à des agressions extérieures, le changement politique ne peut que profiter à notre nation et à l’avenir de notre peuple."
AUH_ww1_sovereignist_ethos: "Centralisation"
AUH_ww1_sovereignist_ethos_desc: "L’autorité de l’Etat a été divisée pendant trop longtemps. En réduisant les pouvoirs des sous-états par rapport au gouvernement centralisé, nous pouvons surmonter le régionalisme et l’esprit de coterie pour créer une nation plus forte, ce qui ouvrira inévitablement la porte à de nouvelles mesures."
AUH_ww1_support_kaiser: "Renforcer l'Autorité de l'Empereur"
AUH_ww1_support_kaiser_desc: "Sa majesté royale le Kaiser und Konig a sagement régné sur notre nation depuis longtemps, mais des menaces contre son règne ont couvé. Des nationalistes et fédéralistes tentent de façonner une démocratie régionaliste, le trône a gagné beaucoup d'ennemis intérieur. Nous devons conduire une campagne pour retouché l'image du K.u.K pour aider à sécuriser son pouvoir."
AUH_ww1_contest_kaiser: "Contester l'Autorité de l'Empereur"
AUH_ww1_contest_kaiser_desc: "Peut-être que la monarchie n'est désormais plus un moyen de gouverner un État multinational. Le Kaiser und Konig est durement impopulaire en dehors de l'Autriche elle-même et a beaucoup d'ennemis dans sa propre partie. Si nous affaiblissons son autorité de l'intérieur, quelle chance a-t-il de conserver son autorité? Des partis plus puissants peuvent alors prendre sa place."
 AUH_ww1_internationalism_focus: "Internationalisme"
AUH_ww1_internationalism_focus_desc: "Les bolchéviques nous ont montré la voie, suivons Vladimir Lénine et mettons fin aux privilèges de la bourgeoisie !"
 AUH_ww1_militarism: "Militarisme"
AUH_ww1_militarism_desc: "Notre armée devient de plus en plus partie prenante de la vie quotidienne de notre nation. Heureusement, le soutien populaire favorise nos troupes à l’heure actuelle, car ils les voient comme les héros qu’ils sont, se battant sous notre bannière. Cette culture militaire que nous allons établir servira la cause de nos forces armées."
 AUH_ww1_indoctrination_focus: "Endoctrinement"
AUH_ww1_indoctrination_focus_desc: "Après des années de débats sur la manière d’obtenir des citoyens le soutien pour notre merveilleux nouveau régime, certains des membres du Conseil des Travailleurs ont suggéré l’établissement d’un nouveau « Ministère de l’Amour », qui persuaderait officiellement les gens de soutenir notre gouvernement. Nous ne parlerons pas ici de ce qui se passera officieusement dans ce ministère..."
 AUH_ww1_political_commissars: "Comissaires Politiques"
AUH_ww1_political_commissars_desc: "L’armée est paradoxalement un endroit où le sentiment anti-national prospère. En nous assurant que notre gouvernement aie des yeux partout, nous pouvons traquer ces groupes d'agitateurs et les empêcher de grandir."
 AUH_ww1_paramilitarism: "Paramilitarisme"
AUH_ww1_paramilitarism_desc: "Certains pays sont assez idiots pour condamner les milices armées, craignant les rébellions. Cependant, si nous sommes assez prudents pour limiter celles-ci aux loyalistes du régime, nous pouvons créer un autre groupe d’hommes en colères et armés, pouvant soutenir notre nation. Cela nous sera utile en cas de guerre."
 AUH_ww1_political_correctness: "Politiquement Correct"
AUH_ww1_political_correctness_desc: "N’importe qui s’exprimant contre notre gouvernement commet clairement un crime de haine contre le peuple que nous défendons. Donc, quelqu’un qui se prononce contre le pouvoir en place devrait être surveillé de près."
 AUH_ww1_military_youth: "Jeunesse Militaire"
AUH_ww1_military_youth_desc: "Notre culture militariste doit aussi être présente chez nos enfants ! En forçant le respect de l’armée et en offrant une formation aux jeunes générations, nous pouvons être certains qu’ils grandissent et s’enrôlent pour servir notre glorieux régime. Certains pourraient appeler cela de l’exploitation... mais cela sonne mieux quand on dit que l’on donne un avenir brillant aux adolescents."
AUH_ww1_student_movement_focus: "Mouvement Étudiant"
AUH_ww1_student_movement_focus_desc: "La jeunesse de notre pays est brillante, et cela peut nous aider pour nos recherches, particulièrement dans le domaine des doctrines terrestres."
AUH_ww1_monarchy: "Autoritarisme"
AUH_ww1_monarchy_desc: "Les pouvoirs exercés par le Parlement et par le peuple peuvent être dangereux. La seule vraie façon de garder le contrôle de la nation, particulièrement dans de tels moments si difficiles, serait d’adopter une position généralement ferme, et de diriger notre pays comme il doit l’être."
AUH_ww1_democracy: "Priorité à la Démocratie"
AUH_ww1_democracy_desc: "Il est dit que n’importe quel dirigeant tire son pouvoir du peuple. Si nous faisons un pas vers une société plus démocratique, même si nous ne le devenons pas réellement, nous pouvons au moins atteindre une meilleure position, pour pouvoir négocier avec des nations démocratiques du monde entier."
AUH_ww1_centralizedpower: "Bureaucratie"
AUH_ww1_centralizedpower_desc: "En doublant le nombre de fonctionnaires d'état, nous renforçons nos capacité de contrôle et de régulation sur l'ensemble de notre gouvernement, et nous nous assurons que rien ne nous échappera. Les efforts de la nation seront bien mieux utilisés. Et puis, cela fera fonctionner l'industrie papetière nationale..."
AUH_ww1_freespeech: "Liberté d'Expression"
AUH_ww1_freespeech_desc: "En donnant aux gens le droit à la liberté d’expression et de manifestation, nous nous assurons qu’au moins, les gens peuvent mettre leur colère et leurs pensées dans quelque chose de plus créatif. Ceci dit, quelqu’un qui criera « AU FEU ! » dans un théâtre bondé, ou qui usera de n’importe quel terme un peu trop explicite pour décrire la mère du chef d’état, ira tout de même en prison..."
AUH_ww1_reorganization_act: "Loi de Réorganisation"
AUH_ww1_reorganization_act_desc: "De grandes parties de notre territoire ont été sous l’emprise de groupes et d’individus divers depuis que la civilisation est parvenue jusqu’à notre nation. Au cours des siècles cependant, une part de ces terres a été mal administrée ou exploitée. En réorganisant ces terres et leurs propriétaires, surtout ceux qui furent inefficaces, nous pouvons déplacer bon nombre de personnes pour leur permettre de travailler dans nos industries."
AUH_ww1_leave_central_power: "Quitter les Empires Centraux"
AUH_ww1_leave_central_power_desc: "Les Allemands étaient autrefois notre meilleur choix pour survivre, mais l'Autriche doit maintenant suivre son propre chemin. Peut-être qu'un jour, si le gouvernement allemand voudrait réfléchir, peut-être la nécessité forcée, nous nous allierons à nouveau. Hélas, pour l'instant, nous devons faire nos adieux à nos frères au nord, et leur souhaiter bonne chance."
AUH_ww1_limited_rearmament: "Réarmement limité"
AUH_ww1_limited_rearmament_desc: "Approvisionner correctement notre armée en fournitures militaires nécessite de grands investissements et des réquisitions. Bien sûr, avec un rationnement limité, les civils pourront toujours s’amuser –probablement au détriment des militaires."
AUH_ww1_full_rearmament: "Réarmement total"
AUH_ww1_full_rearmament_desc: "Qui peut prévoir l'avenir et dire que les guerres s'arrêteront ? Nous devons nous assurer que nos forces restent à la hauteur de la tâche qui les attendent."
AUH_ww1_unitedpeople: "Unifier le Royaume"
AUH_ww1_unitedpeople_desc: "Un curieux changement dans le rythme de la politique autrichienne a eu lieu. Peut-être que les peuples non autrichiens ont accepté leur place ici, ou peut-être sont-ils simplement fatigués de geindre sur des nationalistes au coeur tendre." 
AUH_ww1_massive_effort: "Effort Massif"
AUH_ww1_massive_effort_desc: "Chaque homme et chaque femme doivent aider l’effort national ! Avec le spectre de la Grande Guerre qui s’approche un peu plus chaque jour, un grand programme économique a été entrepris pour développer notre capacité industrielle et nous aider à surmonter nos rivaux détestés !"
AUH_ww1_fortify_city: "Fortifications Civiles"
AUH_ww1_fortify_city_desc: "Quand les combats atteindront nos frontières, il est préférable que nous y soyons préparés. En louant le services d’ouvriers du bâtiments pour construire des forteresses et des casemates sur certaines de nos provinces extérieures, nous pouvons tenir à distance l’ennemi qui oserait nous attaquer, et ce sans prendre de risques !"
 AUH_ww1_fortify_coast: "Défense Côtière"
AUH_ww1_fortify_coast_desc: "Une côte n’est pas facile à défendre. Maintenanht qu'il existe des navires capables de débarquer des troupes pratiquement n’importe où sur nos rivages, les forts côtiers ne seront pas de trop pour rejeter nos ennemis à la mer."
AUH_ww1_install_communism: "Révolution Prolétarienne"
AUH_ww1_install_communism_desc: "Le peuple en a assez des élitistes autrichiens qui contrôlent et oppriment les peuples dans les champs et les usines. A partir de maintenant, les citoyens du Danube vont se tenir ensemble face à l'oppression aristocratique!."
 AUH_ww1_install_democracy: "Élections Libres"
AUH_ww1_install_democracy_desc: "Pour la première fois, les hommes du Danube auront leur mot à dire dans leur gouvernement. Avec la vieille monarchie maintenant chose du passé, une république fédérale peut être proclamée, qui peut écouter et assister chaque partie de l'état nation. Nous ne serons plus autrichiens, ni hongrois, ni plus ni moins que des citoyens."
AUH_ww1_end_dual_monarchy_emperor: "La fin de la Double Monarchie"
AUH_ww1_end_dual_monarchy_emperor_desc: "La Hongrie n'a servi qu'à conduire l'Autriche vers le bas. En renonçant au trône hongrois comme un de nos titres principaux et le reléguant au lieu de cela à sujet de l'Autriche, nous rappellerons à tous qui sont responsables ici. Certains de ces barbares moustachus peuvent se plaindre mais qu'importe? Nous les avons battus en 1846, nous pouvons le faire à nouveau si nécessaire." 
AUH_ww1_oppression_minorities: "Opprimer les Minorités "
AUH_ww1_oppression_minorities_desc: "La meilleure façon d'assurer la loyauté des groupes minoritaires est de leur éviter de s'identifier les uns aux autres. En rendant illégales les publications dans d'autres langues, punishing citizens who fail to confirm to our culture, and enforcing local inferiority, we can fool some into thinking they are one of us, and keep the others from speaking out against us."
AUH_ww1_autrichian_lead: "QG Autrichien"
AUH_ww1_autrichian_lead_desc: "Avec la fin de la monarchie double et la centralisation du royaume en Autriche, l'armée est redevenue une organisation unifiée avec des chefs militaires autrichiens au sommet. Bien que les officiers d'autres nationalités protestent, avoir une armée solide et unie fournie des avantages à notre doctrine et sa propagation." 
AUH_ww1_same_language: "Interdire les Langues Minoritaires"
AUH_ww1_same_language_desc: "L'allemand est la seule langue que vous êtes autorisé à parler. Ce n'est pas la version allemande de ce mod, donc ne dites à personne que vous lisez cette description, ou que vous avez entendu cela de moi."
AUH_ww1_dismantle_auh: "Démanteler l'Autriche-Hongrie"
AUH_ww1_dismantle_auh_desc: "Le rêve d'une monarchie Austro-Hongroise unie est rompu. Peut-être devrions-nous abandonner nos rêves de multinationalisme, et poursuivre notre propre destin."
AUH_ww1_make_concessions: "Faire des Concessions"
 AUH_ww1_make_concessions_desc: "Les aristocrates s'inquiètent de plus en plus du fait que le Kaiser abandonne trop rapidement trop de droits favorables et risque de laisser passer le trône. Que savent-ils ?"
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
AUH_ww1_diplomatic_effort: "Effort Diplomatique"
AUH_ww1_diplomatic_effort_desc: "Il devient de plus en plus difficile de rester neutre dans le monde actuel. Notre corps diplomatique ne cesse de nous presser à prendre position dans les luttes de pouvoirs qui se développement, ou de déclarer officiellement notre neutralité. Nous ne pouvons pas encore répondre à la question, mais nous pouvons facilement donner les moyens à nos diplomates pour choisir une de ces options."
AUH_ww1_triple_alliance: "Célébrer la Triplice"
AUH_ww1_triple_alliance_desc: "La Triplice est très clairement la seule chose nous gardant sur la carte. Nous serions tout à fait fous de ne pas continuer à chercher d'accord avec ses signataires, et continuer à assurer et valider l'alliance à ce jour."
AUH_ww1_back_ger: "Renforcer les liens avec l'Allemagne"
AUH_ww1_back_ger_desc: "Bien que certains des aristocrates autrichiens soient encore amers au sujet du processus d'unification allemande, ils sont nos frères, et l'un des rares États amis de notre gouvernement ces jours-ci." 
AUH_ww1_military_advisors: "Expertise Militaire de l'Allemagne"
AUH_ww1_military_advisors_desc: "Ils disent que la Prusse a éclot d'un boulet de canon, et alors qu'ils ne peuvent pas appeler le pays qui n'est plus, l'axiome est toujours vrai. Accepter l'aide de l'Allemagne pour moderniser notre armée serait un avantage facile à tirer de cette alliance."
AUH_ww1_back_italy: "Garantir la Loyauté Italienne"
AUH_ww1_back_italy_desc: "Les Italiens ne sont pas, c'est le moins qu'on puisse dire, exactement avec les termes les plus amicaux avec nous. Nous devrions commencer des négociations avec eux, pour établir des relations plus amicales, si nous espérons les garder dans notre alliance. Bien sûr, si nous en allons jusqu'au bout, nous finirons probablement par perdre des territoires..."
AUH_ww1_give_italy_territories: "Donner le Tyrol Sud et l'Istrie"
AUH_ww1_give_italy_territories_descn: "Les Italiens ont rendu leurs revendications claires: l'historique région italienne de l'Istrie, ainsi qu'une concession autour de la ville de Split sur la côte dalmate. Malheureusement, il s'agit de territoire côtier, mais cela pourrait être un prix qui vaut la peine d'être payé pour garder l'Italie alignée avec les puissances centrales." 
AUH_ww1_italy_honnor_pact: "Appeler l'Italie à la Guerre"
AUH_ww1_italy_honnor_pact_desc: "L'Italie est maintenant obligée de se joindre à la guerre. Si nous leur avons cédé des territoires et leur en avons promis plus en France pour rien, le peuple leur donnera l'enfer. Maintenant que les choses ont éclaté, il est temps de percevoir nos dues après avoir distribué certaines de nos précieuses régions."
 AUH_ww1_assert_position_east: "Affirmer nos Position à l'Est"
 AUH_ww1_assert_position_east_desc: "La position des Empires Centraux dans l'est est la même: affaiblir la Russie et établir notre dans la région. Comme la guerre avec la Russie semble presque inévitable, en raison de la situation des Balkans, c'est une ligne de conduite efficace à prendre, bien que la France et la Russie se rapprochent, ce qui pourrait s'avérer un problème."
 AUH_ww1_anti_ru: "Politique Anti-Russe"
 AUH_ww1_anti_ru_desc: "Pour faire bon usage de notre position, nous rompons les liens diplomatiques avec la Russie et commençons à travailler publiquement contre eux. Cela ne fera probablement que de les irrité pour l'instant, mais il nous ouvrira une foule d'options à l'avenir."
 AUH_ww1_anti_ru_limit_trade: "Limiter le Commerce avec la Russie"
 AUH_ww1_anti_ru_limit_trade_desc: "La Russie est l'un de nos principaux partenaires commerciaux, et nous sommes en bonne position où ils ont davantage besoin de nous que nous avons besoin d'eux. En mettant en place des sanctions et droits de douane sur les produits russes, nous pouvons prendre un avantage économique sur eux."
 AUH_ww1_rom: "Se Rapprocher de la Roumanie"
 AUH_ww1_rom_desc: "Les Roumains sont une épine dans notre flanc. Nous contrôlons une grande partie de leur territoire, et bien qu'ils soient officiellement un membre mineur de la Triplice, il ne fait aucun doute qu'ils regardent notre territoire avec envie. Nous devrions leur donner de bonnes nouvelles, pour essayer de les rapprocher de l'équipe gagnante. Bien sûr, pour vraiment les convaincre nous pourrions faire des concessions..."
 AUH_ww1_rom_give_bucovina: "Offrir la Bucovine à la Roumanie"
 AUH_ww1_rom_give_bucovina_desc: "La Bucovine n'est pas une importante partie de territoire, mais c'est une partie roumaine de l'Empire austro-hongrois. La concession de ce territoire n'est pas une garantie pour gagner leur coeur, mais il vaut certainement la peine de faire une offre, nous sommes beaucoup mieux avec un solide allié à quelques centimètres de notre terre."
 AUH_ww1_rom_honnor_pact: "Appeler la Roumanie à la Guerre"
 AUH_ww1_rom_honnor_pact_desc: "Depuis que la Roumanie a accepté notre offre de la Bucovine, nous sommes en bonne position pour les appeler dans le conflit actuel. Il ne fait aucun doute que s'ils refusent, leur peuple en sera très mécontent."
 AUH_ww1_oirganization_realm: "Organiser le Royaume"
 AUH_ww1_oirganization_realm_desc: "L'Autriche-Hongrie comme une collection de parties de vieux royaumes, n'est pas dans une super position défensive. Malgré cela, nous pouvons fortifier et retrancher nos troupes, pour essayer de retenir le choc d'une attaque sur l'une de nos larges frontières." 
 AUH_ww1_fortify_russian_borders: "Fortifier les Frontières Russes"
 AUH_ww1_fortify_russian_borders_desc: "La région galicienne est d'un intérêt stratégique, et garder les Russes dehors est important si nous voulons garder un avantage dans l'Est. Une ligne de fortification dans cette région nous aidera à battre l'ours."
 AUH_ww1_airport_russian_borders: "Bâtir des Aéroports près des Frontières Russes"
 AUH_ww1_airport_russian_borders_desc: "L'arrivée des avions de combat peut très bien être un facteur décisif dans la guerre dans l'Est. Si nous construisons des pistes d'atterrissage nous pourrons accueillir plus d'avions dans la région, ce qui donne une perspective favorable de briser la supériorité aérienne ennemie et par extension gagner des batailles cruciales dans la région."
 AUH_ww1_fortify_italian_borders: "Fortifier les Frontières Italiennes"
 AUH_ww1_fortify_italian_borders_desc: "La frontière italienne est longue et curieusement incurvée, ce qui rend difficile pour les unités de se soutenir mutuellement. Pires encore, les Italiens eux-mêmes sont retranchés au bas des chaînes de montagnes et dans des zones fortifiées urbaines. Comme il est improbable que nous rompions cette défense bientôt, nous devons être sûrs que nous pouvons au moins nous défendre."
 AUH_ww1_fortify_bosnia_borders: "Fortifier les Frontières Balkaniques"
 AUH_ww1_fortify_bosnia_borders_desc: "Il est hautement improbable que les Balkans nous donnent des problèmes sérieux, mais il vaut toujours mieux d'être sûr que désolé, de peur que les troupes de marines françaises arrivant dans la région ne nous réveil brutalement. Elle refusera également à la Serbie et au Monténégro la possibilité d'attaquer sur notre territoire, pour une campagne sûre dans les Balkans. "
 AUH_ww1_fortify_coast_dalmatia: "Fortifier la Côte Dalmate"
 AUH_ww1_fortify_coast_dalmatia_desc: "Bien que nous n'ayons pas une très forte marine, nous possédons un long littoral, qui doit être défendu si un front des Balkans à l'Italie n'est pas établi, ce qui serait un désastre pour notre effort de guerre. Améliorer les forts côtiers existants et en construire de nouveaux peut contribuer à faire en sorte que nous ne soyons jamais confrontés à ce scénario de cauchemar." 
 AUH_ww1_ready_country: "Propagande de Recrutement"
 AUH_ww1_ready_country_desc: "Selon l'Autriche-Hongrie, l'armée austro-hongroise est l'employeur le plus prestigieux au monde. En faisant circuler des nouvelles positives et des informations sur notre pays et les forces armées, nous pouvons susciter l'enthousiasme chez les hommes apathiques, en aidant nos militaires."
 AUH_ww1_polnische_wehrmacht: "Polnische Wehrmacht"
 AUH_ww1_polnische_wehrmacht_desc: "Si nous promettons aux Polonais leur propre état après la guerre, peut-être que les habitants de notre partie de la Pologne seront plus disposés à participer à l'action. La question est de savoir si nous cédons ou non le territoire mais pour l'instant nous pouvons profiter de l'afflux d'hommes valides sans penser aux conséquences." 
 AUH_ww1_military_harmonization: "Harmonisation de l'Armée"
 AUH_ww1_military_harmonization_desc: "Une armée avec 3 subdivisions dans sa seule armée de terre n'est pas une chose facile à maintenir en contrôle, mais récemment nos officiers sont devenus plus habitués à traiter les complexités d'une telle force. Comme nos militaires commencent à fonctionner de façon plus organique et plus unifiée."
 AUH_ww1_balkans_policy: "Politique des Balkans"
 AUH_ww1_balkans_policy_desc: "Depuis l'acquisition et l'annexion de la Bosnie, nous avons cherché à garder notre intérêt dans les Balkans sûr, et il faut l'admettre continuer à s'étendre dans cette zone si nous obtenons une occasion facile. En établissant notre argument sur la scène mondiale, nous pouvons participer plus activement à la politique de la région des Balkans." 
 AUH_ww1_balkans_policy_intervene: "Réaction de la Première Guerre Balkanique"
 AUH_ww1_balkans_policy_intervene_desc: "La première guerre balkanique a été une expérience intéressante, notamment en montrant la puissance potentielle surprenante de ces États balkaniques une fois unifiée. Bien que nous ayons soutenu l'Empire ottoman, il semble que leur puissance dans cette région soit complètement érodé. Peut-être que l'Autriche doit trouver un nouvel ami à proximité, si nous voulons conserver ce que nous avons ici?" 
 AUH_ww1_balkans_bulgaria_friend: "Envoyer des Conseillers Militaires"
 AUH_ww1_balkans_bulgaria_friend_desc: "Les Bulgares sont en ce moment dans une situation difficile. Leur guerre contre la Serbie s'est répandue dans un conflit avec chacun de ses voisins. Si nous n'envoyons pas au moins des conseillers, cela pourrait en être fini pour eux. C'est aussi, bien sûr une occasion intéressante de se faire des amis dans un de ces États balkaniques..."
 AUH_ww1_balkans_bulgaria_send_troops: "Envoyer des Troupes pour aider la Bulgarie"
 AUH_ww1_balkans_bulgaria_send_troops_desc: "Pour s'assurer que la Bulgarie est au moins une chance de ne pas se faire annexer, nous pouvons envoyer quelques-unes de nos troupes, théoriquement volontaires, pour essayer de donner à la Bulgarie un certain avantage dans le conflit. Ceci fournira une expérience nécessaire, et continuera à pousser la Bulgarie dans notre camp."
 AUH_ww1_balkans_serbian_expansion: "Enquêter sur l'Expansionisme Serbe"
 AUH_ww1_balkans_serbian_expansion_desc: "Bien que les Serbes aient été autrefois alliés à notre État, depuis que nous avons annexé la Bosnie, les choses ont été beaucoup moins amicales avec le gouvernement serbe. En raison d'une hausse marquée de la criminalité, en particulier des récents immigrants de Serbie à l'intérieur de nos frontières, une enquête sur les activités serbes en Autriche doit être menée."
 AUH_ww1_balkans_serbian_ultimatum: "Envoyer un Ultimatum à la Serbie"
 AUH_ww1_balkans_serbian_ultimatum_desc: "Donc, les bâtards serbes essayaient juste de susciter des rébellions pour mettre leurs mains crasseuses sur nos provinces slaves du Sud! Ils devraient être punis pour cette violation flagrante de la confiance, et notre bon Kaiser a commencé à préparer un ultimatum au gouvernement serbe, qu'ils ne seront certainement pas en mesure de refuser."
 AUH_ww1_annex_BOS: "Annexion Totale de la Bosnie-Herzégovine"
 AUH_ww1_annex_BOS_desc: "La Bosnie fait techniquement partie de notre royaume depuis 1908, bien que le processus de l'établir complètement dans notre empire ait été, jusqu'ici, si lent qu'ils aient encore une certaine autonomie dans notre royaume ici des années plus tard. Cet état de choses ne profite à personne. Bien sûr, la question devient maintenant : Est-ce que l'Autriche, la Hongrie ou peut-être les deux gouverneront cet État ?"
 AUH_ww1_Schutzkorps: "Former Plus de Schutzkorps"
 AUH_ww1_Schutzkorps_desc: "Le Schutzkorps était une milice volontaire auxiliaire établie par les autorités austro-hongroises dans la province nouvellement annexée de Bosnie-Herzégovine pour traquer l'opposition des Serbes de Bosnie."
