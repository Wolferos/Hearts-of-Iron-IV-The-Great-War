l_french:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 RUS_ww1_army_effort: "Réorganiser l'Armée Impériale Russe"
 RUS_ww1_army_effort_desc: "L'armée n'a pas connu de réformes majeures depuis celles de Dmitry Milyutin en 1874, et n'est clairement pas prête à un conflit mondial : beaucoup d'équipements sont vétustes, les infrastructures logistiques sont insuffisantes et nous n'avons que très peu de camions ou d'aéroplanes. Il est temps de réorganiser l'armée impériale, car une fois le jour venu, il sera trop tard."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 RUS_ww1_form_air_force: "Former le Service Aérien Impérial Russe"
 RUS_ww1_form_air_force_desc: "L'aviation militaire semble avoir un bel avenir. C'est pourquoi nous devons séparer au plus vite le Service Aérien Impérial Russe du Corps du Génie pour en faire une branche distincte de l'armée."
 RUS_ww1_aviation_effort_2: "Recherches Aéronautiques de Sikorsky"
 RUS_ww1_aviation_effort_2_desc: "Le génie d'Igor Sikorsky dans le domaine de l'aviation ne fait aucun doute. Nous devons soutenir cet ingénieur talentueux afin qu'il puisse développer des avions russes capables de rivaliser, voire de dépasser, les performances de ceux des autres grandes puissances."
 RUS_ww1_aviation_effort_4: "Russko-Baltiisky Vagonny Zavod"
 RUS_ww1_aviation_effort_4_desc: "Le chemin de fer est une excellente réponse au premier de nos problèmes, à savoir l'étendue extrême de notre pays ! Grâce aux voies ferrées, nous pouvons désenclaver toutes les régions et faire passer les messages, les marchandises, les voyageurs et les troupes plus facilement d'un point du monde à un autre. Mais nous manquons de trains et de rails; aussi un de nos ministres a suggéré la création d'une entreprise basée à Riga, en Lettonie, qui fabriquerait en grand nombre ces machines."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================
 RUS_ww1_extension_of_the_putilov_factory: "Extension de l'usine de Putilov"
 RUS_ww1_extension_of_the_putilov_factory_desc: "L'usine de Nikolaï Putilov fêtera bientôt ses cinquantes années d'existence, et elle est florissante, produisant rails et locomotives en nombre, qui sont exportées depuis Saint-Pétersbourg jusqu'aux conflins de notre pays. Nous devrions leur accorder d'importants prêts pour étendre encore leurs activités, car en cas de guerre, ce potentiel industriel nous sera très utile. D'ailleurs, ces ateliers pourraient aussi être facilement reconvertis en usines d'armement !"
 RUS_ww1_airfield_expansion_1: "Transformations des Terrains Militaires de Gatchina en Aérodromes"
 RUS_ww1_airfield_expansion_1_desc: "Les terrains d’aviation ont pour eux le luxe de n’exiger qu’un bout de terrain relativement proche d’un réseau routier. L’établissement de ces terrains est un travail en soi, mais il s’avérera payant. A proximité de Gatchina, on trouve beaucoup d'anciens terrains agricoles qui se prêteraient fort bien à cet usage."
 RUS_ww1_extra_tech_slot_2: "Développer l'Académie des Sciences"
 RUS_ww1_extra_tech_slot_2_desc: "Débloquer une enveloppe pour étendre les services de recherche de l'Académie des Sciences de Petrograd nous permettrait de mener plus de projets expérimentaux."
#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 RUS_ww1_naval_effort: "Renforcer la Marine Impériale Russe"
 RUS_ww1_naval_effort_desc: "Depuis notre défaite à Tsushima, la marine impériale russe n'est plus qu'une plaisanterie dont se gaussent la plupart des flottes de guerre mondiales. Nous devons prendre les mesures nécessaires pour que cette image disparaisse au plus vite de l'esprit de nos rivaux, et réformer en profondeur la flotte."
 RUS_ww1_european_seas_focus: "Priorité à l'Europe"
 RUS_ww1_european_seas_focus_desc: "La Russie sera toujours issue de la Rus' de Kiev. Nos principaux intérêts seront toujours tournés vers cette région; il nous faut renforcer notre position politique et diplomatique en ce sens."
 RUS_ww1_asian_seas_focus: "Priorité à l'Asie"
 RUS_ww1_asian_seas_focus_desc: "Négliger l'Extrême-Orient serait une grave erreur. Les prétentions impérialistes du Japon ne sont pas passées inaperçues, de même que la progression des Américains dans le Pacifique. Il faut renforcer nos intérêts dans la région !"
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 RUS_ww1_political_effort: "Effort Politique"
 RUS_ww1_political_effort_desc: "Le temps de la Réforme est venu. La nation a été bien dirigée selon les vieux principes depuis des années, mais ces temps difficiles que nous traversons exigent un gouvernement capable d’y répondre. Si nous voulons pouvoir changer de voie, ou soutenir notre gouvernement actuel afin de résister à des agressions extérieures, le changement politique ne peut que profiter à notre nation et à l’avenir de notre peuple."
 RUS_ww1_reject_reforms: "Rejeter Les Réformes"
 RUS_ww1_reject_reforms_desc: "Les réformes proposées par nos adversaires n'ont qu'un seul but, affaiblir l'Empire et le Tsar. Nous ne devons montrer aucune faiblesse. Ils en profiteraient pour nous poignarder."
 RUS_ww1_adopt_reforms: "Adopter les Réformes"
 RUS_ww1_adopt_reforms_desc: "L'Empire est attaqué de toutes parts, peut-être devrions-nous accepter certaines réformes proposées par l'opposition. Si nous ne faisons rien, nous courons le risque de voir apparaître des mouvements révolutionnaires."
 RUS_ww1_condemn_marxist_ideas: "Condamner les Idées Marxistes"
 RUS_ww1_condemn_marxist_ideas_desc: "Les idées de Marx sont plus que dangereuses, et sous couvert d'égalité, ne feront que propager le désordre social et remettre en question un ordre établi depuis des siècles ! Et d'ailleurs, comment faire confiance à un Allemand ?"
 RUS_ww1_crush_strikes: "Écraser les Grèves"
 RUS_ww1_crush_strikes_desc: "Les grèves violentes qui se sont déclarées aux quatre coins du pays ces derniers temps sont en train de déborder. Il faut envoyer la troupe pour mater ces révoltes !"
 RUS_strengthen_the_constitution: "Renforcer la Constitution"
 RUS_strengthen_the_constitution_desc: "Face aux troubles politiques, la seule réponse, c'est la fiabilité et la fermeté. Plusieurs de nos éminents politiciens se sont récemments prononcés en faveur d'une révision de la Constitution impériale, afin de la renforcer, ce qui réaffirmera le pouvoir."
 RUS_ww1_arrest_opposition_leaders: "Arrêter les leaders de l'Opposition"
 RUS_ww1_arrest_opposition_leaders_desc: "Des preuves de l'implication de certains responsables politiques dans les troubles civils récents nous ont été apportées. Elles suffiront à les faire condamner devant un tribunal pour haute trahison !"
 RUS_ww1_dissolve_imperial_duma: "Dissoudre la Douma"
 RUS_ww1_dissolve_imperial_duma_desc: "Cette agacante assemblée qu'est la Douma ne servait qu'à donner un os à ronger aux plus virulents réformateurs du pays. Mais cela n'a pas calmé les libéraux, et elle s'empêtre encore une fois dans de longs et stériles débats. Nous devrions prendre un décret pour ordonner sa troisième dissolution."
 RUS_ww1_reinforce_tsar_authority: "Renforcer l'autorité du Tsar"
 RUS_ww1_reinforce_tsar_authority_desc: "L'autorité légitime du Tsar est constamment remise en cause, nous devons prendre des mesures fortes pour y mettre fin, quitte à nous faire des ennemis."
 RUS_ww1_purge_imperial_guard: "Purger la Garde Impériale"
 RUS_ww1_purge_imperial_guard_desc: "Les renseignements internes nous font part d'une proportion croissante d'officiers rebelles et d'éléments perturbateurs au sein des bataillons de la Garde. Nous ne pouvons tolérer une telle dissidence au sein des troupes censées protéger le trône impérial !"
 RUS_ww1_discuss_tsar_authority: "Débattre de l'Autorité du Tsar"
 RUS_ww1_discuss_tsar_authority_desc: "Le Tsar a peut-être trop de pouvoir, peut-être devrions-nous nous inspirer des Britanniques pour renforcer le pouvoir des parlementaires avant qu'il ne soit trop tard et que l'Empire ne s'effondre sur lui-même."
 RUS_ww1_parliamentary_immunity: "Immunité Parlementaire"
 RUS_ww1_parliamentary_immunity_desc: "Si nous voulons réformer en profondeur la Russie, en faire un état moderne et surtout progresser sur la voie de la démocratie, alors il faut cesser d'avoir peur des réformateurs, et limiter le pouvoir de musèlement des tsars et des autorités en place. Il faut établir légalement l'immunité parlementaire, pour que chaque élu puisse avoir l'assurance de ne pas subir de représailles lorsqu'il propose un projet."
 RUS_ww1_fifth_duma: "Établir la 5e Douma"
 RUS_ww1_fifth_duma_desc: "Un peu d'eau a coulé sous les ponts depuis la dernière dissolution. Des élections ont eu lieu et le paysage politique a été recomposé; le moment semble bon pour rappeler les parlementaires et composer une cinquième Douma. En espérant que celle-ci ne devra pas être dissoute comme les précédentes..."
 RUS_ww1_legitimate_power: "Légitimer le pouvoir du dirigeant"
 RUS_ww1_legitimate_power_desc: "Apparemment, recevoir le pouvoir temporel de Dieu n'est plus suffisant aux yeux du peuple. Il faut travailler notre communication pour trouver de nouvelles façons de légitimer le pouvoir impérial."
 RUS_ww1_adopt_marxist_ideas: "Adopter les Idées Marxistes"
 RUS_ww1_adopt_marxist_ideas_desc: "Les travaux de Marx et d'Engels ont démontré comment l'industrialisation croissante des pays développé qui a agité tout le dernier siècle n'a en réalité profité qu'à une classe bourgeoise privilégiée, et a en contrepartie appauvri considérablement les ouvriers, les paysans, et sans profiter d'aucune façon aux classes nobiliaires. Ce système capitaliste doit être muselé comme un chien enragé ! Il faut introduire dans notre programme politique des éléments reprenant les idées de Marx."
 RUS_ww1_legitimate_bolsheviks: "Consolidation Bolchévique du Pouvoir"
 RUS_ww1_legitimate_bolsheviks_desc: "Renverser le gouvernement provisoire était une première étape, mais ce pouvoir pris par la force devra être consolidé pour ne pas être à nouveau renversé. Il faut publier une série de décrets et de réformes pour satisfaire aux revendications populaires, et former au plus vite un gouvernement, ainsi qu'une commission chargée de fonder la nouvelle république socialiste."
 RUS_ww1_disarm_the_cossacks: "Désarmer les Cosaques"
 RUS_ww1_disarm_the_cossacks_desc: "Les Cosaques sont trop puissants et rackettent le peuple et le pouvoir depuis des siècles. Ca suffit ! Nous ne pouvons plus les laisser faire ce qu'ils veulent, nous devons les désarmer avant qu'ils ne fassent un énième coup d'État."
 RUS_ww1_right_of_the_people: "Déclaration des Droits du Peuple"
 RUS_ww1_right_of_the_people_desc: ""
 RUS_export_the_revolution: "Exporter la Révolution"
 RUS_export_the_revolution_desc: "C'est le maître mot des communistes, une devise qui résume à elle seule l'esprit d'unité et de solidarité qui agite les hommes conscients de l'inégalité des classes : Prolétaires de tous les pays, unissez-vous ! Alors, nous allons appliquer ce principe au pied de la lettre, et commencer a exporter la révolution, en envoyant nos meilleurs orateurs et agitateurs politiques à l'étranger. La révolution sociale sera mondiale ou ne sera pas !"
 RUS_ww1_sovereignist_ethos: "Ethos Souverainiste"
 RUS_ww1_sovereignist_ethos_desc: "Qu'y-a-t-il de plus important que la souveraineté de notre nation ? Nous ne sommes pas un dominion, ni une colonie, ni un acteur mineur, mais un grand pays autonome. Il est temps de le réaffirmer sur la scène diplomatique."
 RUS_ww1_support_kaiser: "Soutenir le Kaiser"
 RUS_ww1_support_kaiser_desc: "Le Kaiser Wilhelm II est un homme plein de bon sens, qui a construit un état allemand fort et responsable. Qui sait ce qu'il adviendra, s'il est évincé du pouvoir ? Il nous faut apporter notre soutien au dirigeant allemand."
 RUS_ww1_contest_kaiser: "Contester Guillaume II"
 RUS_ww1_contest_kaiser_desc: "Le Kaiser Wilhelm II est âgé, voire sénile ! Ses décisions sont de plus en plus erratiques, et il a entraîné avec lui toute une clique de généraux d'opérette avides de pouvoir et de conquête. Ils ne cesseront pas de vouloir faire la guerre. Il faut entamer une série d'actions de politique interne afin de saper son autorité."
 RUS_ww1_internationalism_focus: "Internationalisme"
 RUS_ww1_internationalism_focus_desc: "La Révolution Communiste ne peut être arrêtée. Il est bon que notre peuple l’embrasse, et immédiatement, plutôt qu’au moyen d’une guerre civile. Quand nous commenceront à montrer notre soutien pour le Mouvement Communiste Internationaliste, nous serons auss rouges que le sang des hommes !"
 RUS_ww1_militarism: "Militarisme"
 RUS_ww1_militarism_desc: "Notre armée devient de plus en plus partie prenante de la vie quotidienne de notre nation. Heureusement, le soutien populaire favorise nos troupes à l’heure actuelle, car ils les voient comme les héros qu’ils sont, se battant sous notre bannière. Cette culture militaire que nous allons établir servira la cause de nos forces armées."
 RUS_ww1_indoctrination_focus: "Endoctrinement"
 RUS_ww1_indoctrination_focus_desc: "Après des années de débats sur la manière d’obtenir des citoyens le soutien pour notre merveilleux nouveau régime, certains des membres du Conseil des Travailleurs ont suggéré l’établissement d’un nouveau « Ministère de l’Amour », qui persuaderait officiellement les gens de soutenir notre gouvernement. Nous ne parlerons pas ici de ce qui se passera officieusement dans ce ministère..."
 RUS_ww1_political_commissars: "Comissaires Politiques"
 RUS_ww1_political_commissars_desc: "L’armée est paradoxalement un endroit où le sentiment anti-national prospère. En nous assurant que notre gouvernement aie des yeux partout, nous pouvons traquer ces groupes d'agitateurs et les empêcher de grandir."
 RUS_ww1_paramilitarism: "Paramilitarisme"
 RUS_ww1_paramilitarism_desc: "Certains pays sont assez idiots pour condamner les milices armées, craignant les rébellions. Cependant, si nous sommes assez prudents pour limiter celles-ci aux loyalistes du régime, nous pouvons créer un autre groupe d’hommes en colères et armés, pouvant soutenir notre nation. Cela nous sera utile en cas de guerre."
 RUS_ww1_political_correctness: "Politiquement Correct"
 RUS_ww1_political_correctness_desc: "Désignons des intellectuels proches du pouvoir pour surveiller de près les agences de presse... et nous assurer que chaque texte ne sera pas subversif."
 RUS_ww1_military_youth: "Jeunesse Militaire"
 RUS_ww1_military_youth_desc: "Notre culture militariste doit aussi être présente chez nos enfants ! En forçant le respect de l’armée et en offrant une formation aux jeunes générations, nous pouvons être certains qu’ils grandissent et s’enrôlent pour servir notre glorieux régime. Certains pourraient appeler cela de l’exploitation... mais cela sonne mieux quand on dit que l’on donne un avenir brillant aux adolescents."
 RUS_ww1_student_movement_focus: "Mouvement Étudiant"
 RUS_ww1_student_movement_focus_desc: "Les universités et les ligues étudiantes regorgent de jeunes gens pleins de sang, avides d'en découdre ou de propager de nouvelles idées politiques. Ca ne sera pas très difficile de placer des agents au sein des bons réseaux pour orienter toute cette énergie, et la canaliser dans la bonne direction !"
 RUS_ww1_monarchy: "Autoritarisme"
 RUS_ww1_monarchy_desc: "Les pouvoirs exercés par le Parlement et par le peuple peuvent être dangereux. La seule vraie façon de garder le contrôle de la nation, particulièrement dans de tels moments si difficiles, serait d’adopter une position généralement ferme, et de diriger notre pays comme il doit l’être."
 RUS_ww1_democracy: "Démocratisme"
 RUS_ww1_democracy_desc: "Il est dit que n’importe quel dirigeant tire son pouvoir du peuple. Si nous faisons un pas vers une société plus démocratique, même si nous ne le devenons pas réellement, nous pouvons au moins atteindre une meilleure position, pour pouvoir négocier avec des nations démocratiques du monde entier."
 RUS_ww1_centralizedpower: "Bureaucratie"
 RUS_ww1_centralizedpower_desc: "En doublant le nombre de fonctionnaires d'état, nous renforçons nos capacité de contrôle et de régulation sur l'ensemble de notre gouvernement, et nous nous assurons que rien ne nous échappera. Les efforts de la nation seront bien mieux utilisés. Et puis, cela fera fonctionner l'industrie papetière nationale..."
 RUS_ww1_freespeech: "Liberté d'Expression"
 RUS_ww1_freespeech_desc: "Les temps changent, et nous devons montrer que nous ne craignons pas la contradiction. Nous devons signer le décret autorisant la parution de gazettes qui ne sont pas systématiquement approuvées par le comité de censure impérial."
 RUS_ww1_reorganization_act: "Loi de Réorganisation"
 RUS_ww1_reorganization_act_desc: "L'apppareil militaro-industriel souffre de sa vétusté et du dispersement de ses efforts. Notre ministre de l'économie a proposé un ambitieux plan de réorganisation de nos capacités de production."
 RUS_ww1_leave_central_power: "Quitter les Puissances Centrales"
 RUS_ww1_leave_central_power_desc: "Qu'est-ce qui a bien pu nous inciter à rejoindre cette Triple-Alliance ? Il est évident qu'elle ne va pas du tout dans notre sens et menace même nos intérêts sur notre frontière occidentale. C'est aux Français et aux Anglais que nous aurions dû nous allier. Quittons tout de suite la ligue austro-allemande."
 RUS_ww1_limited_rearmament: "Réarmement Limité"
 RUS_ww1_limited_rearmament_desc: "Approvisionner correctement notre armée en fournitures militaires nécessite de grands investissements et des réquisitions. Bien sûr, avec un rationnement limité, les civils pourront toujours s’amuser –probablement au détriment des militaires."
 RUS_ww1_full_rearmament: "Réarmement Total"
 RUS_ww1_full_rearmament_desc: "Qui peut prévoir l'avenir et dire que les guerres s'arrêteront ? Nous devons nous assurer que nos forces restent à la hauteur de la tâche qui les attendent."
 RUS_ww1_unitedpeople: "Unifier le Royaume"
 RUS_ww1_unitedpeople_desc: "Des bords de la Baltique jusqu'aux plages du Pacifique, l'empire russe rassemble des dizaines de peuples aux origines et aspirations différentes. Nous devons mieux unifier ce gigantesque territoire, en rassemblant sa population sous une seule bannière."
 RUS_ww1_massive_effort: "Effort Massif"
 RUS_ww1_massive_effort_desc: "Chaque homme et chaque femme doivent aider l’effort national ! Avec le spectre de la Grande Guerre qui s’approche un peu plus chaque jour, un grand programme économique a été entrepris pour développer notre capacité industrielle et nous aider à surmonter nos rivaux détestés !"
 RUS_ww1_fortify_city: "Fortifications Civiles"
 RUS_ww1_fortify_city_desc: "Le vent de la guerre peut tourner désagréablement vite, et le front évoluer encore plus vite. Il serait utile de mobiliser des groupes de citoyens désoeuvrés pour leur faire édifier des ouvrages défensifs à des endroits précis, et cela ferait gagner du temps aux troupes du génie."
 RUS_ww1_fortify_coast: "Défense Côtière"
 RUS_ww1_fortify_coast_desc: "Une côte n’est pas facile à défendre. Maintenanht qu'il existe des navires capables de débarquer des troupes pratiquement n’importe où sur nos rivages, les forts côtiers ne seront pas de trop pour rejeter nos ennemis à la mer."
 RUS_ww1_install_communism: "Révolution Prolétarienne"
 RUS_ww1_install_communism_desc: "Les ouvriers sont le moteur du changement social et industriel ! L'heure est venue pour que les exploités, les opprimés, les bannis, ceux qui n'ont pour eux que la force de leurs mains et de leurs bras, pour que ceux-là prennent en main leur avenir ! Nous devons organiser dans notre propre pays la révolution prolétarienne, à grande échelle !"
 RUS_ww1_install_democracy: "Élections Libres"
 RUS_ww1_install_democracy_desc: "Le pouvoir vient toujours du peuple. Organiser des élections libres donnera au moins l'illusion d'une démocratie directe et d'une bonne représentativité des citoyens, et donnera à notre gouvernement la légitimité qui lui manquait."
 RUS_ww1_oppression_minorities: "Oppresser les Minorités"
 RUS_ww1_oppression_minorities_desc: "C'est une technique bien connue, mais qui marche toujours... désigner un bouc émissaire permet de détourner l'attention des éléments colériques. Il suffit de financer une bonne campagne de presse bien virulente..."
 RUS_ww1_make_concessions: "Faire des Concessions"
 RUS_ww1_make_concessions_desc: "Céder à certaines revendications ne serait pas un gros effort politique ou financier... et cela permettrait en revanche de présenter une image plus positive du gouvernement."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 RUS_ww1_diplomatic_effort: "Développement Diplomatique"
 RUS_ww1_diplomatic_effort_desc: "Il faut mieux doter notre corps diplomatique en financements et en personnels pour être efficaces dans nos relations extérieures."
 RUS_ww1_assert_position_east: "Asseoir nos positions à l'Est"
 RUS_ww1_assert_position_east_desc: "On a trop souvent tendance à croire que les territoires sibériens sont un lointain orient, détaché de l'empire russe, où les lois de s'appliquent pas et où nos intentions sont floues. Il est temps que cela change et que nous redéfinissions notre politique sur les rivages du Pacifique."
 RUS_ww1_BalkansPolitics: "Politique des Balkans"
 RUS_ww1_BalkansPolitics_desc: "Les Balkans sont une région qui retient notre attention depuis des décennies maintenant, car nous y trouvons un grand nombre de peuples slaves qui partagent nos intérêts et notre culture, et c'est aussi une région hautement stratégique, d'où peuvent éclater n'importe quel conflit, sans parler de la présence des Turcs qui nous empêchent d'accéder à la Méditerranée. Nous devrions orienter notre politique extérieure pour poursuivre nos efforts dans cette zone."
 RUS_ww1_ApeasementBalkans: "Apaisement dans les Balkans"
 RUS_ww1_ApeasementBalkans_desc: "Beaucoup de guerres ont déjà éclaté dans les Balkans, et très peu de bénéfices en ont été tirés. Quand les canons ne parviennent pas à atteindre un objectif, il y a fort à parier qu'un bon banquet diplomatique a plus de chances de réussir, et pour beaucoup moins cher. Il est temps de nous montrer conciliants."
 RUS_ww1_rom: "Rapprochement avec la Roumanie"
 RUS_ww1_rom_desc: "Les Roumains ont largement fait leurs preuves ces dernières années, et fait montre d'intentions pacifiques envers nous. Nous devrions leur envoyer une délégation, et signer une déclaration d'amitié."
 RUS_ww1_oirganization_realm: "Organiser le Royaume"
 RUS_ww1_oirganization_realm_desc: "Notre empire est conservateur, mais nous pouvons garder le régime impérial tout en restant efficaces. Si nous prenons les bonnes mesures pour simplifier notre organisation interne, notre vie civile et économique en profitera."
 RUS_ww1_fortify_russian_borders: "Fortifier les frontières russes"
 RUS_ww1_fortify_russian_borders_desc: "Il est impensable de fortifier l'intégralité des frontières de la Russie, sachant le nombre absurde de kilomètres à couvrir. Mais cependant, nous pouvons déjà entamer la construction d'une poignée de forteresses placées aux bons endroits, qui permettront de surveiller de larges portions de terres."
 RUS_ww1_airport_russian_borders: "Construire des Aéroports près des frontières"
 RUS_ww1_airport_russian_borders_desc: "Il faut investir dans la construction d'aérodromes a proximité de nos frontières. Non seulement cela sera utile au trafic civil, mais en cas de guerre, nos escadrilles auront des terrains déjà prêts pour prendre les airs."
 RUS_ww1_fortify_italian_borders: "Fortifier les frontières Italiennes"
 RUS_ww1_fortify_italian_borders_desc: "Les frontières du royaume d'Italie ont besoin d'être renforcées, car actuellement, c'est une véritable passoire ! Nous devons envoyer un corps d'ingénieur sur place pour superviser les travaux qui conduiront à la construction de casemates et de forts."
 RUS_ww1_fortify_bosnia_borders: "Fortifer les frontières des Balkans"
 RUS_ww1_fortify_bosnia_borders_desc: "Les frontières des Balkans ont besoin d'être renforcées, car actuellement, c'est une véritable passoire ! Nous devons envoyer un corps d'ingénieur sur place pour superviser les travaux qui conduiront à la construction de casemates et de forts."
 RUS_ww1_fortify_coast_dalmatia: "Fortifier les côtes de Dalmatie"
 RUS_ww1_fortify_coast_dalmatia_desc: "Les côtes de la Dalmatie ont besoin d'être renforcées, car actuellement, c'est une véritable passoire ! Nous devons envoyer un corps d'ingénieur sur place pour superviser les travaux qui conduiront à la construction de casemates et de forts."
 RUS_ww1_ready_country: "Propagande de Recrutement"
 RUS_ww1_ready_country_desc: "L'armée manque de fusils, de camions, d'uniformes, mais avant tout de recrues. Le service militaire n'intéresse plus les jeunes russes, aussi devons-nous faire un appel aux volontaires et publier des images de propagandes les incitant à faire leur devoir pour la patrie."
 RUS_ww1_military_harmonization: "Harmonisation Militaire"
 RUS_ww1_military_harmonization_desc: "Une des raisons de l'inefficacité chronique de nos forces est la trop grande disparité de moyens et d'objectifs entre les différentes armées. Si nous voulons que cela change, nous devons redéfinir clairement nos objectifs militaires, et faire en sorte que la Flotte, l'Armée et aussi les aviateurs orientent leurs efforts en ce sens. Et enfin, nous devons investir des moyens conséquents pour soutenir leur développement."
 RUS_ww1_balkans_policy: "Politique des Balkans"
 RUS_ww1_balkans_policy_desc: "Les Balkans sont une région qui retient notre attention depuis des décennies maintenant, car nous y trouvons un grand nombre de peuples slaves qui partagent nos intérêts et notre culture, et c'est aussi une région hautement stratégique, d'où peuvent éclater n'importe quel conflit, sans parler de la présence des Turcs qui nous empêchent d'accéder à la Méditerranée. Nous devrions orienter notre politique extérieure pour poursuivre nos efforts dans cette zone."
 RUS_ww1_balkans_policy_intervene: "Première Réaction à la Guerre Balkanique"
 RUS_ww1_balkans_policy_intervene_desc: "Les Balkans s'enflamment à nouveau, et les Serbes s'écharpent avec les Grecs et les Bulgares ! Nous soutenons leurs revendications, et il est l'heure de le réaffirmer ouvertement, surtout face aux Ottomans qui sont déjà en train de fourbir leurs armes pour profiter de la situation."
 RUS_ww1_pro_fra: "Celébrer l'Alliance Franco-Russe"
 RUS_ww1_pro_fra_desc: "Les liens d'amitié qui unissent depuis longtemps la Russie et la France sont forts et nos intérêts économiques et militaires se rejoignent. Célébrons cette alliance afin de montrer aux Autrichiens et aux Allemands qu'en cas de guerre, nous les combattrons comme un seul homme."
 RUS_ww1_friend_with_auh: "Second Accord Austro-Russe"
 RUS_ww1_friend_with_auh_desc: "Cela a pris du temps et de l'argent, mais nous avons enfin mis au point un nouvel accord qui réglera pour un temps les différents qui nous opposent aux Autrichiens. Si nous le signons maintenant, cela devrait calmer le jeu entre nous pour un moment."
 RUS_ww1_support_serbia_weapons: "Soutenir la Serbie"
 RUS_ww1_support_serbia_weapons_desc: "Les Serbes se battent avec ardeur, mais manquent d'armes et de munitions. Nous devons leur en expédier quelques cargaisons, sans quoi ils seront victime d'attrition dans quelques mois."
 RUS_ww1_RussoTurkishBorder: "Renforcer la frontière russo-turque"
 RUS_ww1_RussoTurkishBorder_desc: "Nous n'avons pas oublié les derniers conflits qui nous opposent aux Turcs, et malgré les années écoulées, rien n'a été réglé. Gardons à l'esprit que leurs frontières sont perméables dans un sens autant que dans l'autre; il faut renforcer la frontière qui nous sépare d'eux en y postant plus d'unités de l'armée. "
 RUS_ww1_AzerbaijanisRights: "Reconnaître le peuple azerbaïdjanais"
 RUS_ww1_AzerbaijanisRights_desc: "Nous avons déjà tenté de nous emparer de l'Azerbaïdjan, sans succès. Mais depuis, le pays s'est développé et occidentalisé ; nous devrions reconnaître leur indépendance et leur liberté, pour en faire un allié à notre frontière sud."
 RUS_ww1_CaucasusFocus: "Priorité au Caucase"
 RUS_ww1_CaucasusFocus_desc: "Les dernières campagne de prospection du Caucase soulignent que la région présentera toujours plus d'intérêts au fil du temps, étant non seulement très riche en terres agricoles fertiles, mais aussi en puits de pétrole. Il faut donner toute notre priorité à cette région pour nos investissements et nos travaux civils."
 RUS_ww1_BakuInvest: "Investir à Bakou"
 RUS_ww1_BakuInvest_desc: "Bakou regorge de pétrole, nous devons rapidement développer la région car nos besoins en or noir ne font que croître."
 RUS_ww1_restore_russia_glory: "Rétablir la Gloire d'antan de la Russie"
 RUS_ww1_restore_russia_glory_desc: "Il fut un temps où les légions du tsar étaient redoutées des deux côtés de l'Eurasie, un temps où la Russie était un titan qui ne pouvait être ignoré ! Il est temps d'adopter une politique de pleine puissance et de faire craindre notre nation. Nous couvrirons de gloire le trône de Saint-Pétersbourg !"
 RUS_ww1_avenge_fall_constantinople: "Venger 1453"
 RUS_ww1_avenge_fall_constantinople_desc: "La Chute de Constantinople fut la prise de la capitale de l'Empire Byzantin par une armée d'envahisseurs ottomans, le 29 mai 1453. Ils étaient commandés par Mehmet le Conquérant, le septiéme sultan de l'empire Ottoman, qui défit une armée commandée par l'empereur byzantin Constantin XI Paléologue"
 RUS_wilhlems_deal: "Négocier avec Wilhlem II"
 RUS_wilhlems_deal_desc: "Les Allemands nous sont définitivement hostiles, mais le kaiser n'est pas fou pour autant. Cela ne coûtera rien d'écouter les propositions des plénipotentiaires germaniques."
 RUS_ww1_invest_west: "Investir dans l'Occident"
 RUS_ww1_invest_west_desc: "Les Occidentaux seront plus faciles à courtiser quand nous auront placé quelques billes chez eux. Si nous investissons des capitaux dans leurs usines, nous faisons un bon placement, et nous leur faisons un cadeau diplomatique."
 RUS_around_manchuria: "Investir dans la Mandchourie Extérieure"
 RUS_around_manchuria_desc: "Nos infrastructures à la frontière avec la Corée doivent être renforcées. Si les Japonais veulent à nouveau la guerre, nous devrons être prêts."
 RUS_ww1_friend_with_romania: "Améliorer les relations avec la Roumanie"
 RUS_ww1_friend_with_romania_desc: "Il est temps de se rapprocher des Roumains, si nous ne contestons pas leur ambition en Transylvanie, nous pourrions les amener à revoir leurs positions."
 RUS_ww1_EmbargoUK: "Sanctionner le Royaume-Uni"
 RUS_ww1_EmbargoUK_desc: "Ces Britanniques sont proprement exaspérants, et  leur ingérence systématique dans les affaires du monde n'est plus tolérable. Nous avons là une occasion de les moucher sur la scène diplomatique."
 RUS_ww1_JoinCentralPowers: "Couteau dans le Dos"
 RUS_ww1_JoinCentralPowers_desc: "Ce sera probablement vu comme la plus grande trahison géopolitique de ce siècle, mais il faut savoir être pragmatique. Les Puissances centrales sont les seules à présenter un intérêt pour nous à court et moyen terme."
 RUS_ww1_reinforce_western_forts: "Renforcer la frontière Occidentale"
 RUS_ww1_reinforce_western_forts_desc: "C'est à l'Ouest que se porte la plus grande menace. C'est sur cette frontière de l'empire que nous devons concentrer le plus de divisions."
 RUS_ww1_defy_germany: "Défier l'Allemagne"
 RUS_ww1_defy_germany_desc: "L'Allemagne est une jeune nation, un véritable blanc-bec diplomatique qui ne devrait pas sous-estimer leur plus puissant voisin ! Il est temps de les mettre au défi de leurs ambitions : soit ils plient devant nous, soit ils les assument... et nous leur feront la guerre !"
 RUS_annex_northern_persia: "Occuper la Perse du Nord"
 RUS_annex_northern_persia_desc: ""
 RUS_ww1_Attack_Afghanistan: "Préparer l'invasion de l'Afghanistan"
 RUS_ww1_Attack_Afghanistan_desc: "L'Eurasie est le ventre mou de l'empire. Nous devons nous préparer tout de suite à envahir ce petit pays pour y protéger nos intérêts... et prévenir une invasion de notre territoire national."
 RUS_russify_finland: "Russifier la Finlande"
 RUS_russify_finland_desc: "Si nous voulons que les Finlandais cessent de contester notre autorité, nous devons les assimiler à la culture russe. À court terme, cela pourrait créer des tensions, mais à long terme, la Finlande pourrait devenir une région russe comme les autres."
 RUS_ww1_leave_entente: "Quitter l'Entente"
 RUS_ww1_leave_entente_desc: "Les Franco-Britanniques ne sont pas plus fiables que les Austro-Allemands en vérité, et rien ne nous garantit qu'ils se soucieront de nos intérêts. Nous devrions quitter l'Entente ; s'ils tiennent tant à s'étriper avec leurs voisins immédiats, grand bien leur fasse."
 RUS_guarantee_serbia: "Garantir l'indépendance de la Serbie"
 RUS_guarantee_serbia_desc: "Les Serbes doivent être protégés des appétits des Italiens ou des Autrichiens, ou de qui que ce soit d'ailleurs. Ce pays ne peut pas nous échapper; aussi nous devons garantir leur indépendance. Ainsi, gare à celui qui tentera de conquérir ce petit pays."
 RUS_ww1_add_fuel_to_the_fire: "Allumer la Poudrière"
 RUS_ww1_add_fuel_to_the_fire_desc: ""
 RUS_ww1_support_serbia: "Confrèrie Orthodoxe"
 RUS_ww1_support_serbia_desc: "Si nous partageons bien un point commun avec les Serbes, c'est celui de la religion ! Nos frères orthodoxes doivent être placés sous notre égide. Proposons-leur de nous rejoindre au sein d'une confrérie."
 RUS_fight_sweden_gotland: "Revendiquer Götland"
 RUS_fight_sweden_gotland_desc: "L'île de Götland n'est qu'un caillou pelé au milieu des embruns, mais un caillou sur lequel on pourrait poser des avions et installer des canons ! Voire même une base navale, plus qu'utile à toute flotte de guerre digne de ce nom. Nous devrions formuler une revendication officielle sur cette position, pour ne pas qu'elle nous menace directement un jour."
 RUS_european_focus: "Priorité à l'Occident"
 RUS_european_focus_desc: "Notre pays est le plus étendu du monde, mais c'est bien en Europe que se trouvent l'essentiel de nos intérêts, et nos principaux alliés. C'est à cette région que la priorité doit être accordée."
 RUS_ww1_scandinavia_focus: "Politiques de Scandinavie"
 RUS_ww1_scandinavia_focus_desc: "La proximité géographique des scandinaves en fait un enjeu central pour nous, de même que la concurrence stratégique et économique qui s'y exerce pour le contrôle du fer, du pétrole et du bois. Il faut nous rapprocher de ces pays, tout en gardant d'importants moyens de dissuasion dans cette région."
 RUS_asian_focus: "Asseoir la position Russe en Asie"
 RUS_asian_focus_desc: "Il serait temps de rappeler aux Asiatiques et aux Occidentaux qui s'y intéressent que la Russie reste aussi une puissance présente en Extrême-Orient. Diplomatiquement et militairement, nous devons renforcer notre intérêt dans la région et procéder à quelques démonstrations de force."
 RUS_ww1_Tungsten_Nerchinsk: "Recherche de minerai de Wolfram près de Nerchinsk"
 RUS_ww1_Tungsten_Nerchinsk_desc: "Un mémorandum de l'institut d'ingénierie d'Irkoutsk nous fait savoir que d'importants gisements de métaux ont été découverts en transbaïkalie, près de la frontière asiatique. Certaines entreprises pourraient prendre en charge leur exploitation dès maintenant."
 RUS_ww1_Reinforce_Northern_Persia: "Investir en Perse Septentrionale"
 RUS_ww1_Reinforce_Northern_Persia_desc: "Certains de nos grands industriels suggèrent que nous investissions quelques capitaux dans les territoires perses, au sud. C'est un pays notoirement sous-développé et archaïque, mais dont les terres sont riches. Ce serait sans aucun doute un bon placement."
 RUS_ww1_Revoke_Persia_Convention: "Révoquer la Convention de 1907"
 RUS_ww1_Revoke_Persia_Convention_desc: "La Convention anglo-russe de 1907 a été signée le 31 août 1907 à Saint-Pétersbourg. La Convention a mis fin au long différend concernant la Perse. Le Royaume-Uni a promis de rester en dehors de la Perse Septentrionale, et la Russie a reconnu la Perse Méridionale comme faisant partie de la sphère d'influence britannique."
 RUS_ww1_Support_Persia_Convention: "Soutenir la Convention de 1907"
 RUS_ww1_Support_Persia_Convention_desc: "La Convention anglo-russe de 1907 a été signée le 31 août 1907 à Saint-Pétersbourg. La Convention a mis fin au long différend concernant la Perse. Le Royaume-Uni a promis de rester en dehors de la Perse Septentrionale, et la Russie a reconnu la Perse Méridionale comme faisant partie de la sphère d'influence britannique."
 RUS_ww1_Persian_Cossack_Brigade: "Renforcer la Brigade Cosaque Perse"
 RUS_ww1_Persian_Cossack_Brigade_desc: "La Brigade Cosaque Perse était une unité de cavalerie de style cosaque formée en 1879 en Perse. Elle a été calquée sur les régiments cosaques du Caucase de l'Armée Impériale Russe, et aujourd'hui, elle est une unité d'élite. Nous devrions mobiliser cette force pour en faire une unité de police."
 RUS_ww1_Russian_Influence_over_Persia: "Accord transfrontalier de Téhéran"
 RUS_ww1_Russian_Influence_over_Persia_desc: "Nous avons préparé un accord avec le Shah de Perse. Celui-ci porte sur des questions territoriales, économiques, financières... et va nous permettre de placer les éléments que nous désirons aux postes clés pour que notre influence soit prégnante dans toute la Perse. Nous les manipulerons facilement."
 RUS_ww1_Puppet_Persia: "Occuper la Perse Septentrionale"
 RUS_ww1_Puppet_Persia_desc: "La Perse du nord sombre dans l'anarchie, et il n'y a que l'embarras du choix pour trouver une bonne raison d'occuper le pays. Enfin, juste la région septentrionale... et puis après tout, si nous ne le faisons pas, ce seront les Britanniques qui s'en occuperont !"
 RUS_ww1_Militarize_NorthenPersia: "Militariser la Perse Septentrionale"
 RUS_ww1_Militarize_NorthenPersia_desc: "La Perse continue de s'affaiblir ; ils n'ont donc aucune chance de s'opposer à nous lorsque nous enverrons des unités militaires sur place pour protéger les intérêts russes qui s'y trouvent."
 RUS_ww1_treaty_portsmouth: "Révoquer le Traité de Portsmouth"
 RUS_ww1_treaty_portsmouth_desc: "Ce traité que nous avions signé en 1905 était une véritable humiliation que nous subissions face à la canaille japonaise ! Il est hors de question de continuer a verser des indemnités de guerre et de leur céder si facilement la Mandchourie."
 RUS_annex_manchurian_sphere: "Occuper la Mandchourie"
 RUS_annex_manchurian_sphere_desc: "La Mandchourie est la poudrière de l'Asie, et un pays que nous ne pouvons pas nous permettre de ne plus contrôler. Il faut renvoyer des troupes là-bas, ne serait-ce que pour barrer la route aux Japonais, et pour investir rapidement la Chine en cas de besoin. Plusieurs de nos divisions sont déjà prêtes à partir."
 RUS_ww1_friend_with_jap: "Alliés de Circonstances"
 RUS_ww1_friend_with_jap_desc: "Qui eût cru qu'un jour nous nous rapprocherions des Japonais ? Les aléas de la géopolitque prennent parfois un chemin bien étrange. Quoi qu'il en soit, il se trouve que leurs objectifs et les nôtres concordent désormais, et que nous avons tout à gagner à travailler de concert. Après tout, peut-être finirons-nous par enterrer définitivement la hache de guerre."
 RUS_reinforce_vladivostok: "Renforcer Vladivostok"
 RUS_reinforce_vladivostok_desc: "Si les Japonais nous attaquent à nouveau, Vladivostok devra être imprenable. Il faut renforcer le port avec deux nouvelles forteresses, construire des batteries côtières et creuser des entrepôts."
 RUS_mongolian_protectorate: "Protectorat Mongol"
 RUS_mongolian_protectorate_desc: "Les Mongols sont faibles et prêts à tomber. Nous n'avons pas d'intérêts particulier a les annexer, mais qu'ils se fassent eux-mêmes annexer par nos rivaux au sud serait en revanche une catastrophe. Aussi pourrions-nous régler le problème en leur proposant un protectorat."
 RUS_ww1_Xinhai_Revolution_Opportunity: "Opportunité de la Révolution Xinhai "
 RUS_ww1_Xinhai_Revolution_Opportunity_desc: "La révolution qui vient de commencer en Chine fait vaciller le pouvoir de l'empereur ! Les révoltes de Wuchang sont déjà sanglantes. Les ingérences des occidentaux n'ont fait que donner l'élan final à une société qui était déjà sapée jusqu'aux fondations par l'immobilisme, la corruption et l'agitation politique. Nous devons nous pencher sur la question et profiter dés maintenant des occasions qui se présentent, car nos rivaux n'attendront pas, eux !"
 RUS_ww1_polish_corps: "Korpus Polski w Rosji"
 RUS_ww1_polish_corps_desc: "Beaucoup de Polonais vivent en Russie, et beaucoup de Polonais désirent se battre contre les Allemands, même s'ils n'ont pas de pays propre ! Nous avons toujours besoin d'hommes : constituons une légion entièrement polonaise, constitués de volontaires et d'officiers issus de cette communauté. Ils se battront avec encore plus de force et de cohésion."
 kis_brestlitovsk: "Traité de Brest-Litovsk"
 kis_tsarnicholasabdicated: "Abdication du Tsar"
