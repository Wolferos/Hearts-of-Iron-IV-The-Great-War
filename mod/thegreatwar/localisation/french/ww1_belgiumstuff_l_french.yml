 # [Events]
 ww1_belgium.2.t: "La Belgique propose une alliance"
 ww1_belgium.2.d: "Aujourd'hui nous avons reçu un message de la Belgique nous invitant dans leur alliance. Ils proposent d'unir le Benelux et de créer une nouvelle alliance forte. Que devrions-nous faire ?"
 ww1_belgium.2.a: "C'est une bonne proposition."
 ww1_belgium.2.b: "Non!"
 ww1_belgium.3.t: "La Belgique exige la subjugation"
 ww1_belgium.3.d: "Aujourd'hui, la Belgique nous a envoyé une demande officielle de subjugation. Ils ont également dit qu'ils utiliseront la force si nécessaire. Quelle est notre réponse ?"
 ww1_belgium.3.a: "Nous n'avons pas le choix..."
 ww1_belgium.3.b: "Ils peuvent venir seulement s'ils brisent notre défense!"
 ww1_belgium.4.t: "La Belgique demande Eupen!"
 ww1_belgium.4.d: "Eupen a toujours été un territoire belge. Maintenant, ils revendiquent leurs terres légitimes. La Belgique n'est pas si forte, mais devrions-nous commencer la guerre pour un petit bout de terrain ?"
 ww1_belgium.4.a: "C'est leur terre historique après tout"
 ww1_belgium.4.b: "Non, c'est un territoire allemand"
 ww1_belgium.5.t: "Unir le Benelux"
 ww1_belgium.5.d: "Nous pensons qu'il est temps d'unir le Benelux. Nous allons unir les gens de la région du Benelux sous notre domination."
 ww1_belgium.5.a: "Nous enverrons la demande à nos voisins"
 ww1_belgium.5.b: "Nous contrôlons déjà le Benelux"
