 # Diplomatic Tree
 BEL_ww1_diplomatic_effort: "Développement diplomatique"
 BEL_ww1_diplomatic_effort_desc: "Dans le monde d'aujourd'hui, il est de plus en plus difficile de rester neutre. Notre corps diplomatique ne cesse de nous presser de prendre position dans les luttes de pouvoir émergentes ou de déclarer officiellement notre neutralité. Nous ne pouvons pas encore répondre à cette question, mais nous pouvons facilement fournir à nos diplomates les outils nécessaires pour poursuivre l'une ou l'autre de ces options."
 BEL_ww1_benilux_focus: "Priorité au Bénélux"
 BEL_ww1_benilux_focus_desc: "Notre situation géopolitique a toujours été très difficile, car nous sommes coincés entre la France, l'Angleterre et l'Allemagne. Nous serons toujours entourés de nations plus ou moins hostiles et beaucoup plus puissantes. Nous devons donc nous unir avec nos voisins néerlandais et luxembourgeois, afin que les pays du Benelux puissent unir leurs efforts pour notre défense !"
 BEL_ww1_entente_focus: "Amitié avec l'Entente"
 BEL_ww1_entente_focus_desc: "Il est difficile d'imaginer que nous gagnerons les faveurs des Prussiens, décidément trop agressifs et expansionnistes ! Nos voisins, la France et la Grande-Bretagne, sont nos alliés naturels. C'est avec eux que nous devons chercher à nous allier si la Belgique veut survivre au siècle prochain."
 BEL_adios_1839_agreement: "Réviser le traité de Londres"
 BEL_adios_1839_agreement_desc: "Le traité de 1839 est ancien et dépassé, et il sert principalement d'instrument géopolitique aux Britanniques et aux Allemands. Nous devons exiger une révision de ses termes afin de mieux garantir notre souveraineté et notre indépendance, ainsi que le libre usage de nos ports et de nos bases navales."
 BEL_ww1_germany_focus: "Amitié avec les puissances centrales"
 BEL_ww1_germany_focus_desc: "L'alliance austro-prussienne est un dangereux mélange de puissance militaire brute et de main-d'œuvre apparemment inépuisable. Qui pourrait mieux empêcher ces guerriers teutons de nous anéantir en cas de guerre ? Nous devrions les courtiser diplomatiquement."
 BEL_ww1_neutrality_focus: "Neutralité"
 BEL_ww1_neutrality_focus_desc: "Rien n'arrête l'envie de conquête. Après Napoléon, il y a eu Guillaume II, et il y en aura toujours d'autres : Nous ne devons pas et ne pouvons pas nous laisser entraîner dans de nouvelles guerres tous les 50 ans, des guerres aussi meurtrières qu'inutiles. La neutralité absolue doit être notre seule position politique, ne serait-ce que pour donner l'exemple aux autres pays pacifiques."
 BEL_ww1_ally_benilux: "Alliance du Benelux"
 BEL_ww1_ally_benilux_desc: "Personne ne se fait d'illusions sur la capacité de résistance militaire de la Belgique, des Pays-Bas, et plus encore du Luxembourg, si les Allemands ou les Français décident un jour d'envahir l'un ou l'autre de ces pays. Mais si nous établissons une alliance militaire avec nos deux voisins, un tel défi sera beaucoup, beaucoup plus difficile à relever... et nous augmentons nos chances de nous protéger contre une agression."
 BEL_ww1_conquer_benilux: "Conquérir le Benelux"
 BEL_ww1_conquer_benilux_desc: "Il fut un temps où la Belgique était infiniment plus grande qu'aujourd'hui. Nous devons réunifier l'ancien territoire belge, d'autant plus que nos voisins ont fait preuve à plusieurs reprises d'erreurs d'appréciation et de faiblesse politiques. Nous devons annexer le Luxembourg et les Pays-Bas."
 BEL_ww1_major_alliance: "Choisissez votre camp"
 BEL_ww1_major_alliance_desc: "La neutralité était un choix illusoire. C'est désormais une impasse, et toute la classe politique belge le reconnaît : il faut choisir un camp, et tout de suite... l'Entente ou la Triple Alliance ?"
 BEL_ww1_fortify_borders: "Fortifier les frontières"
 BEL_ww1_fortify_borders_desc: "Contrairement à nos voisins, nous ne pouvons absolument pas nous permettre de perdre du territoire avant d'arrêter les envahisseurs : un agresseur extérieur doit être arrêté à la frontière - ou pas du tout ! Nous devons donc financer un nouveau programme de construction de tranchées et de casemates blindées."
 BEL_ww1_demand_eupen: "Exiger Eupen"
 BEL_ww1_demand_eupen_desc: "La ville d'Eupen appartient pleinement à la Wallonie, et l'Empire allemand nous l'a volée en 1815. Ils n'en ont pas besoin, alors qu'elle appartient légitimement à notre nation ! Nous devons exiger sa restitution à la Belgique."

 BEL_ww1_unite_benilux: "Unifier le Benelux"
 BEL_ww1_unite_benilux_desc: "Assez de patience. Le Benelux est désormais partiellement ou totalement sous notre contrôle. Pour entrer dans l'histoire, nous devons unir pleinement ces nations situées au carrefour de l'Europe."

 BEL_ww1_congo: "Politique congolaise"
 BEL_ww1_congo_desc: "Il est remarquable qu'une nation aussi petite que la nôtre possède un empire colonial aussi vaste ! Nous ne devons pas laisser l'initiative au secteur privé, mais investir davantage dans notre politique coloniale, engager des administrateurs et consacrer un ministère à ces questions."
 BEL_ww1_congo_infra: "Plan de financement des infrastructures congolaises"
 BEL_ww1_congo_infra_desc: "Le Congo est potentiellement très riche et habité par un peuple diligent et volontaire. Notre ministre des colonies a élaboré un plan en trente points basé sur un ambitieux projet de financement : routes, voies ferrées, ports, gares, entrepôts, entreprises privées, espaces publics ! Dépensons sans compter."
 BEL_ww1_ReorganizeForcePublique: "Réorganiser la Force Publique"
 BEL_ww1_ReorganizeForcePublique_desc: "Notre armée coloniale ne peut plus s'appuyer exclusivement sur les soldats de la mère patrie, envoyés difficilement au cœur de l'Afrique, peu nombreux, souffrant régulièrement de maladies et de problèmes de ravitaillement. Il faut s'appuyer sur les locaux et associer les Congolais à l'exercice de l'autorité publique."
 BEL_ww1_congo_RubberMonocultureExpansion: "Expansion de la monoculture du caoutchouc"
 BEL_ww1_congo_RubberMonocultureExpansion_desc: ""À quoi sert le caoutchouc ? À tout, bien sûr ! Dans l'industrie civile et militaire, le caoutchouc est demandé partout, notamment pour les pneus qui équipent les nouvelles automobiles. Et comme par hasard, le Congo, où pousse l'hévéa, a du caoutchouc en abondance. Nous devons financer un programme de développement de nouvelles plantations d'hévéas."
 BEL_ww1_ApproveLeopoldLegacyCongo: "Défendre l'héritage de Léopold II"
 BEL_ww1_ApproveLeopoldLegacyCongo_desc: "Malgré ses ordres de suppression brutaux, Léopold II a laissé à la Belgique un vaste territoire en Afrique. C'est grâce à lui que nous avons pu prendre possession de tout le bassin du Congo ! Nous devons honorer ses efforts."
 BEL_ww1_CongoFreeState: "Rétablir l'État libre du Congo"
 BEL_ww1_CongoFreeState_desc: "L'État libre du Congo indépendant, fondé en 1885, a ouvert la voie à la restauration future d'un État libre et souverain. Nous nous proposons de poursuivre dans cette voie et, un jour, le Congo sera notre allié le plus précieux."
 BEL_ww1_ColonialRepression: "Répression coloniale"
 BEL_ww1_ColonialRepression_desc: "Les troubles récents dans nos colonies africaines menacent de se propager comme une traînée de poudre. Nous devons envoyer des instructions claires et sans équivoque à nos autorités coloniales et ordonner la répression impitoyable des soulèvements et du banditisme !"
 BEL_ww1_InviteEuropeanSettlers: "Inviter les colons européens"
 BEL_ww1_InviteEuropeanSettlers_desc: "Pour accroître notre influence sur le territoire, nous devons encourager les Belges à émigrer au cœur de l'Afrique. Plus de colons signifie en fin de compte plus d'entreprises, de biens et de pouvoir."
 BEL_ww1_DenyLeopoldLegacyCongo: "Nier Défendre l'héritage de Léopold II"
 BEL_ww1_DenyLeopoldLegacyCongo_desc: "Le roi Léopold II était sage, mais il a aussi commis de terribles erreurs et a exploité la population colonisée de manière épouvantable. Ces horreurs ne doivent jamais être répétées... et nous devons discrètement balayer cet héritage malheureux sous le tapis."
 BEL_ww1_FreeCongo: "Congo libre"
 BEL_ww1_FreeCongo_desc: "L'Histoire ne va pas dans le sens de l'oppression. Les Congolais méritent d'être libres et indépendants comme tout le monde, d'autant plus que cette colonie ne nous a pas apporté grand-chose. Nous devons rencontrer les responsables politiques locaux et préparer la pleine autonomie du pays."
 BEL_ww1_ClaimingHumanRightsAfrica: "Revendiquer les droits de l'homme en Afrique"
 BEL_ww1_ClaimingHumanRightsAfrica_desc: "Les Droits de l'Homme sont une vérité universelle, que ce soit pour les Blancs, les Noirs ou tous les autres peuples de la Terre ! C'est un aveuglement désastreux que de l'avoir nié jusqu'à présent. Les Congolais sont un peuple fier et libre qui a assez souffert."

