#--------------------------------------------------------------
# Political Tree
#=========================================================================
 SWE_political_effort: "Effort Politique"
 SWE_political_effort_desc: "Le conflit à venir nécessitera un effort suprême de la part de la nation, et l'union sacrée de ses représentants. Nous devons rassembler tous les partisans de notre gouvernement... et ceux de l'opposition. La victoire ne sera pas atteinte, si nous restons divisés."
 SWE_collectivist_ethos: "Ethos Collectiviste"
 SWE_collectivist_ethos_desc: "La Nation est avant tout une construction civique, civile et sociale. Chaque effort des citoyen doit donc être dirigé vers le bien-être de la seule communauté qui vaille, celle de l'ensemble de ses concitoyens ! Nous devons promouvoir ces valeurs de coopération, d'entraide et de solidarité pour encourager ces actions du quotidien."
 SWE_ww1_sovereignist_ethos: "Ethos Souverainiste"
 SWE_ww1_sovereignist_ethos_desc: "Qu'y-a-t-il de plus important que la souveraineté de notre nation ? Nous ne sommes pas un dominion, ni une colonie, ni un acteur mineur, mais un grand pays autonome. Il est temps de le réaffirmer sur la scène diplomatique."
 SWE_nationalism_focus: "Priorité au Nationalisme"
 SWE_nationalism_focus_desc: "La fierté nationale pour notre grand pays se regonfle grâce aux récents événements. Certains des experts politiques de notre pays ont même inventé une nouvelle forme de gouvernement, connu sous le nom de « fascisme », qui puisse prendre racine dans notre pays. Peut-être que cette nouvelle façon de gouverner pourrait mener notre empire à un nouvel âge d’or !"
 SWE_internationalism_focus: "Priorité à l'Internationalisme"
 SWE_internationalism_focus_desc: "La Révolution Communiste ne peut être arrêtée. Il est bon que notre peuple l’embrasse, et immédiatement, plutôt qu’au moyen d’une guerre civile. Quand nous commenceront à montrer notre soutien pour le Mouvement Communiste Internationaliste, nous serons auss rouges que le sang des hommes !"
 SWE_political_commissars: "Commissaires Politiques"
 SWE_political_commissars_desc: "L’armée est paradoxalement un endroit où le sentiment anti-national prospère. En nous assurant que notre gouvernement aie des yeux partout, nous pouvons traquer ces groupes d'agitateurs et les empêcher de grandir."
 SWE_BolshevikIdeals: "Idéaux Bolcheviques"
 SWE_BolshevikIdeals_desc: "Les Bolchéviques russes prônent la dictature d'un prolétariat écrasé par un siècle d'expansion industrielle sans limites ni contrôles, un partage absolu des ressources et une égalité sociale et économique. En étudiant de près leurs idées et les écrits de Lénine, nous pouvons certainement en tirer des enseignements qui nous aideront à construire un futur plus radieux pour nos enfants."
 SWE_ww1_democracy: "Priorité Démocratique"
 SWE_ww1_democracy_desc: "Il est dit que n’importe quel dirigeant tire son pouvoir du peuple. Si nous faisons un pas vers une société plus démocratique, même si nous ne le devenons pas réellement, nous pouvons au moins atteindre une meilleure position, pour pouvoir négocier avec des nations démocratiques du monde entier."
 SWE_ww1_executive_monarchy: "Monarchie Constitutionnelle Exécutive"
 SWE_ww1_executive_monarchy_desc: "Réécrivez la constitution ! Donnez au roi les moyens dont il a besoin pour remettre les choses en ordre."
 SWE_ww1_absolute_monarchy: "Monarchie Absolue"
 SWE_ww1_absolute_monarchy_desc: "Un dernier petit changement dans la constitution est nécessaire. Nous ne pouvons plus attendre pour donner les pleins pouvoirs au roi."
 SWE_militarism: "Militarisme"
 SWE_militarism_desc: "Notre armée devient de plus en plus partie prenante de la vie quotidienne de notre nation. Heureusement, le soutien populaire favorise nos troupes à l’heure actuelle, car ils les voient comme les héros qu’ils sont, se battant sous notre bannière. Cette culture militaire que nous allons établir servira la cause de nos forces armées."
 SWE_military_youth: "Jeunesse Militaire"
 SWE_military_youth_desc: "Notre culture militariste doit aussi être présente chez nos enfants ! En forçant le respect de l’armée et en offrant une formation aux jeunes générations, nous pouvons être certains qu’ils grandissent et s’enrôlent pour servir notre glorieux régime. Certains pourraient appeler cela de l’exploitation... mais cela sonne mieux quand on dit que l’on donne un avenir brillant aux adolescents."
 SWE_paramilitarism: "Paramilitarisme"
 SWE_paramilitarism_desc: "Certains pays sont assez idiots pour condamner les milices armées, craignant les rébellions. Cependant, si nous sommes assez prudents pour limiter celles-ci aux loyalistes du régime, nous pouvons créer un autre groupe d’hommes en colères et armés, pouvant soutenir notre nation. Cela nous sera utile en cas de guerre."
 SWE_necessary_purges: "Purges Nécessaires"
 SWE_necessary_purges_desc: "La nation doit être assainie des éléments qui s'opposent à notre vision du monde. Limogeons ceux qui doivent l'être."
 SWE_ww1_fancy_uniforms: "Uniformes Fantaisistes"
 SWE_ww1_fancy_uniforms_desc: "Nous devrions soutenir ce projet de nouveaux uniformes d'apparat qui nous est parvenu... une toute nouvelle tenue rutilante, qui reflètera nos traditions militaires et notre histoire glorieuse !"
 SWE_ww1_gendarmerie: "Gendarmerie"
 SWE_ww1_gendarmerie_desc: "Laissez l'armée se charger du travail ordinaire de la police. Ils sont efficaces dans ce qu'ils font; en nous calquant sur la gendarmerie française, nous pouvons faire en sorte que certaines unités de cavalerie se chargent des tâches de maintien de l'ordre."
 SWE_ww1_monarchy: "Priorité Autoritaire"
 SWE_ww1_monarchy_desc: "Les pouvoirs exercés par le Parlement et par le peuple peuvent être dangereux. La seule vraie façon de garder le contrôle de la nation, particulièrement dans de tels moments si difficiles, serait d’adopter une position généralement ferme, et de diriger notre pays comme il doit l’être."
 SWE_ww1_laborcamp: "Camps de Travail"
 SWE_ww1_laborpcamp_desc: "On nous a récemment souligné que les prisonniers de droit commun passent le temps de leur incarcération dans une intolérable oisiveté. Ce serait une excellente idée que ces forcenés remboursent à la nation leur dette, en versant leur sueur pour nous."
 SWE_ww1_new_thinking: "Rénover le château de Karlberg"
 SWE_ww1_new_thinking_desc: "Pour être les meilleurs, nous devons être à la pointe des nouvelles tactiques. Il faudrait convoquer de nouveaux colloques de stratégie militaire à l'académie royale de Karlberg, afin de développer de nouvelles doctrines militaires basée sur l'observation des conflits en cours."
 SWE_ww1_freespeech: "Liberté d'Expression"
 SWE_ww1_freespeech_desc: "Il faut former le Conseil de la Presse Suédoise; ainsi, nous nous assureront que les gens puissent mettre leurs colères et leurs pensées dans quelque chose de plus créatif. Ceci dit, quelqu’un qui usera de n’importe quel terme un peu trop explicite pour décrire la mère du chef d’état, ira tout de même en prison..."
 SWE_ww1_full_rearmament: "Réarmement total"
 SWE_ww1_full_rearmament_desc: "Qui peut prévoir l'avenir et dire que les guerres s'arrêteront ? Nous devons nous assurer que nos forces restent à la hauteur de la tâche qui les attendent."
 SWE_ww1_massive_effort: "Effort Massif"
 SWE_ww1_massive_effort_desc: "Chaque homme et chaque femme doivent aider l’effort national ! Avec le spectre de la Grande Guerre qui s’approche un peu plus chaque jour, un grand programme économique a été entrepris pour développer notre capacité industrielle et nous aider à surmonter nos rivaux détestés !"
 SWE_ww1_no_loitering: "Pas de flânerie !"
 SWE_ww1_no_loitering_desc: "Tout manquement à gagner honnêtement sa vie est condamné au travail forcé. Il s'agit d'un effort de traitement et non d'une punition."
 SWE_ww1_SpreadRevolution: "Répandre la Révolution"
 SWE_ww1_SpreadRevolution_desc: "Aidez nos frères à se libérer de leurs chaînes ! Nous qui en avons les moyens, c'est de notre responsabilité que d'apporter la liberté aux ouvriers, aux paysans et aux opprimés du monde entier !"
 SWE_ww1_foreign_expeditions: "Expéditions à l'étranger"
 SWE_ww1_foreign_expeditions_desc: "Combattons avec ceux qui se battent pour notre cause aujourd'hui, pour que nous n'ayons pas à combattre encore demain."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 SWE_ww1_diplomatic_effort: "Développement Diplomatique"
 SWE_ww1_diplomatic_effort_desc: "Il devient de plus en plus difficile de rester neutre dans le monde actuel. Notre corps diplomatique ne cesse de nous presser à prendre position dans les luttes de pouvoirs qui se développement, ou de déclarer officiellement notre neutralité. Nous ne pouvons pas encore répondre à la question, mais nous pouvons facilement donner les moyens à nos diplomates pour choisir une de ces options."
 SWE_ww1_germany_focus: "Amitié entre les Puissances Centrales"
 SWE_ww1_germany_focus_desc: "Nous sommes du côté de l'Allemagne ! Échangeons un peu plus de minerai de fer (des champs de Gällivare) contre du charbon et d'autres produits."
 SWE_ww1_neutrality_focus: "Neutralité"
 SWE_ww1_neutrality_focus_desc: "Nous n'avons rien à gagner en nous engageant dans la spirale guerrière qui semble emporter toutes les nations autour de nous. Nous n'avons aucune raison d'envoyer notre jeunesse à la mort pour des gains incertains. Nous devons ordonner à notre corps diplomatique d'afficher une position de neutralité absolue."
 SWE_ww1_boden_fortress: "Construire la forteresse de Boden"
 SWE_ww1_boden_fortress_desc: "Nous connaissons l'importance stratégique du nord du golfe de Botnie depuis la fin des années 1880. Les choses ont assez traîné, nous devons financer la construction d'une forteresse à Boden qui permettra d'arrêter les offensives venues de nos voisins de l'est."
 SWE_ww1_boden_fortressII: "Renforcer les défenses de Boden"
 SWE_ww1_boden_fortressII_desc: "La forteresse est achevée, mais le plan initial doit être adapté aux évolutions récentes de la guerre. Nous devons renforcer la structure interne des forts et les doter de nouveaux canons."
 SWE_ww1_boden_fortressIII: "Parfaire la défense de Boden "
 SWE_ww1_boden_fortressIII_desc: "Le commandant de Boden nous a adressé un mémorandum ; il y explique avoir besoin d'un corps complet du Génie pour défendre efficacement les forts secondaires et exploiter pleinement les infrastructures."
 SWE_ww1_fortify_coast: "Défense Côtière"
 SWE_ww1_fortify_coast_desc: "Nous devons tracer des plans pour la protection de nos côtes, et prévoir un débarquement amphibie de l'ennemi. Cela ne doit pas arriver."
 SWE_ww1_conquer_finland: "Reprendre la Finlande"
 SWE_ww1_conquer_finland_desc: "Fut un temps, la grande Scandinavie occupait les deux rives du golfe de Botnie. Il est l'heure de reprendre l'ancienne moitié orientale du royaume."
 SWE_ww1_major_alliance: "Choisir un Camp"
 SWE_ww1_major_alliance_desc: "Le Vieux Continent se déchire entre la Triplice et la Triple-Entente, et les conséquences de ce conflit s'étendent à la planète entière ! Nous ne pouvons plus fermer les yeux, il faut choisir notre camp, et vite ! "
 SWE_ww1_demand_aland: "Exiger Åland"
 SWE_ww1_demand_aland_desc: "Les îles d'Aland sont une possession stratégique incontournable de la Baltique... et aux mains de l'étranger, c'est un poignard pointé sur Stockholm ! Nous devons exiger le contrôle de ces terres."
 SWE_ww1_scandinavian_talks: "Discussions inter-scandinaves"
 SWE_ww1_scandinavian_talks_desc: "Parlons de l'actualité !"
 SWE_ww1_scandinavian_defence_union: "Union de Défense Scandinave"
 SWE_ww1_scandinavian_defence_union_desc: "En agissant ensemble, nous pouvons renforcer notre position face aux belligérants. Nous n'égalerons aucun des grands États militaires du continent, mais nous serons suffisamment puissants pour faire respecter notre voix dans le monde entier."
 SWE_ww1_uk_deal: "Accord commercial avec le Royaume-Uni"
 SWE_ww1_uk_deal_desc: "Échangeons un peu plus de minerai de fer (provenant des champs de Kiruna) contre de la nourriture et d'autres choses."
 SWE_ww1_central_power: "Rejoindre les Puissances Centrales"
 SWE_ww1_central_power_desc: "Les Puissances Centrales ont longtemps été des amis de notre pays, et ils ont désespérément besoin de notre aide dans ces temps plus qu’incertains. Les rejoindre est un aller simple pour faire la guerre de leur côté, et il vaudrait mieux être sûrs de ce que nous faisons et d’avoir les moyens de gagner, mais notre soutien peut faire tourner le vent du destin."
 SWE_ww1_german_support: "Soutien Allemand"
 SWE_ww1_german_support_desc: "Les Allemands ont la meilleure armée du monde, et un leadership des plus efficaces. Puisque nous les rejoignons dans leur camp, nous devons leur demander de nous soutenir pour être des alliés utiles."
 SWE_ww1_disarmament: "Désarmement"
 SWE_ww1_disarmament_desc: "Les libéraux veulent réduire les dépenses militaires et investir dans des réformes sociales. La guerre a assez pesé sur les épaules de notre peuple."
 SWE_ww1_rearmament: "Réarmement"
 SWE_ww1_rearmament_desc: "Les partis de droite veulent investir davantage dans la défense et la production nationale de munitions. Nous ne savons pas de quoi demain sera fait, et un grand pays comme le nôtre ne peut laisser son armée dépérir !"
