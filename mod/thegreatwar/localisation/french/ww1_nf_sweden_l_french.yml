# Naval Tree
#=========================================================================
 SWE_ww1_naval_effort: "Moderniser la Svenska Marinen"
 SWE_ww1_naval_effort_desc: "Les navires à moteur à combustion ont commencé à briller au-dessus de leurs contemporains et ont annoncé une nouvelle ère de guerre navale. D'énormes navires avec des canons tout aussi grands se battant à des distances d'engagement incroyables sont appelés à devenir l'ordre du jour. Pour cette raison, un programme de modernisation de nos navires, ainsi qu'une formation aux nouvelles méthodes de guerre pour nos officiers, sont très certainement nécessaires."
#--------------------------------------------------------------
# Interwar Tree
#=========================================================================
 SWE_ww1_interwar_Victory: "Suède Victorieuse"
 SWE_ww1_interwar_Victory_desc: "Il y en a eu pour douter de notre victoire, mais ceux-là reconnaissent aujourd'hui leur tort. La Suède fait partie des grands vainqueurs de ce conflit, et prendra part à l'ordonnancement du nouveau monde !"
 SWE_ww1_interwar_scandinavian_position: "Question Scandinave"
 SWE_ww1_interwar_scandinavian_position_desc: "La question d'une Scandinavie unie au-delà des différences nationales qui séparent encore Danois, Norvégiens, Suédois et Finlandais prend de l'importance dans le débat public. Et dernièrement, elle s'est même invitée plusieurs fois au Parlement..."
 SWE_ww1_interwar_regional_neutrality: "Neutralité Régionale"
 SWE_ww1_interwar_regional_neutrality_desc: "Cette partie du monde est relativement bien équilibrée, et il s'agirait qu'elle le reste. Nous ne sommes pas sans défense, mais nous sommes résolus à ne pas tenter de nouvelle aventure guerrière, et c'est cette position claire que nos diplomates vont affirmer dans les années à venir."
 SWE_ww1_interwar_nordic_dominance: "Leadership Nordique"
 SWE_ww1_interwar_nordic_dominance_desc: "La Suède est de loin l'état le plus puissant de tout le grand nord européen, et il est temps que nous assumions les responsabilités qui vont avec la richesse et la puissance. Assurons nos voisins de notre amitié et de notre protection."
 SWE_ww1_interwar_mutual_defense: "Défense Mutuelle"
 SWE_ww1_interwar_mutual_defense_desc: "Une garantie d'indépendance n'est pas une alliance, mais presque. C'est en quelque sorte une alliance défensive, et qui nous permet de nous unir contre la prédation des voisins, qu'ils soient russes, allemands ou même britanniques."
 SWE_ww1_interwar_scandinavian_development: "Développement Scandinave"
 SWE_ww1_interwar_scandinavian_development_desc: "Cette excellente coopération scandinave permet aussi de concentrer les moyens financiers et matériels pour notre développement mutuel ! Nous en récoltons ainsi les premiers bénéfices, et l'économie voit maintenant ses moyens d'autant plus augmentés."
 SWE_ww1_interwar_integration_of_foreign_affairs: "Intégration des Affaires Étrangères"
 SWE_ww1_interwar_integration_of_foreign_affairs_desc: "Bien sûr, cela ne concerne pas directement nos alliés, mais le discours de Gustaf V est néanmoins plein de bonnes idées de politique étrangère, qui leur bénéficieraient aussi. Nous devrions les inviter à y réfléchir."
 SWE_ww1_interwar_scandinavian_emperor: "Empereur Scandinave"
 SWE_ww1_interwar_scandinavian_emperor_desc: "Quel heureux jour ! Dans la liesse populaire, les parlements de Norvège et de Finlande ont tous les deux accepté à une quasi-unanimité la proposition d'unité scandinave que nous leur avons faite. Gustaf V va monter sur le trône d'un nouvel empire... celui de Scandinavie !"
#--------------------------------------------------------------
# Finland Tree
#=========================================================================
 SWE_ww1_finnish_affairs: "Affaires Finlandaises"
 SWE_ww1_finnish_affairs_desc: "Maintenant que la Finlande est dans l'escarcelle suédoise, nous devons prendre nos responsabilités pour donner de bonnes conditions de vie à ce peuple. En nous investissant dans la gouvernance de la Finlande, la paix intérieure en sera renforcée."
 SWE_ww1_expand_the_pohjanmaa_sawmills: "Développer les Scieries de Pohjanmaa"
 SWE_ww1_expand_the_pohjanmaa_sawmills_desc: "Le bois est une ressource utile à toute industrie, qu'elle soit civile ou militaire. Et notre pays dispose d'un couvert forestier immense ! Finançons la création de nouvelles scieries."
 SWE_ww1_develop_chromium_sources: "Développer les Sources de Chrome"
 SWE_ww1_develop_chromium_sources_desc: "Le chrome devient un métal rare, et pourtant indispensable pour notre industrie, notamment pour fabriquer des avions. Et nous savons que la Suède recèle des gisements inexploités."
 SWE_ww1_fortify_the_border: "Fortifier la Frontière"
 SWE_ww1_fortify_the_border_desc: "Les Russes sont une menace constante contre laquelle nous devons nous préparer. Souvenons-nous que l'ours n'est jamais vraiment en train d'hiberner !"
 SWE_ww1_expand_karjalan_railways: "Développer les chemins de fer de Karjalan"
 SWE_ww1_expand_karjalan_railways_desc: "Les voies de communications caréliennes sont notoirement insuffisantes, et bénéficiraient grandement d'un agrandissements des voies ferrées, pour un usage civil autant que militaire."
 SWE_ww1_light_industry_development: "Développement de l'Industrie Légère"
 SWE_ww1_light_industry_development_desc: "Pharmaceutique, textile, alimentaire... débloquons des fonds destinés à agrandir le parc industriel léger de Finlande."
 SWE_ww1_heavy_industry_development: "Développement de l'Industrie Lourde"
 SWE_ww1_heavy_industry_development_desc: "Fonderies, aciéries, arsenaux... débloquons des fonds destinés à agrandir le parc industriel lourd de Finlande."
 SWE_ww1_scandinavian_investment: "Investissement Scandinave"
 SWE_ww1_scandinavian_investment_desc: "Maintenant que la Scandinavie est une réalité, il faut lui donner les moyens de ses ambitions. Nous avons réuni des fonds à investir dans le développement de nos régions."
 SWE_ww1_swedish_ingria: "Ingrie Suédoise"
 SWE_ww1_swedish_ingria_desc: "Les Russes ont tendance à l'oublier, mais pas nous : autrefois possession de l'empire suédois, l'Ingrie a été injustement volée à ces derniers, puis consacrée coeur de l'empire russe par Pierre le Grand. En cas de guerre, cela va être une cible prioritaire pour nous... Saint-Pétersbourg sera à nous !"
 SWE_ww1_greater_finland: "Grande Finlande"
 SWE_ww1_greater_finland_desc: "Nous devrions rappeler au peuple finlandais de quel long héritage il est dépositaire, et qu'autrefois, leurs terres s'étendaient bien plus loin qu'actuellement ! Et qu'avec un peu plus de sacrifices, nous pouvons voir réapparaître ce grand royaume."
 SWE_ww1_sweden_victorious: "Victoire à l'Est"
 SWE_ww1_sweden_victorious_desc: "C'est enfin terminé, le conflit est remporté. Les plénipotentiaires attendent notre décision, mais nos revendications sont prêtes : nous allons annexer Mourmansk, Onéga et Olonets."
 SWE_ww1_haven_for_white_russian_refugees: "Refuge pour les réfugiés Russes Blancs"
 SWE_ww1_haven_for_white_russian_refugees_desc: "La Russie va souffrir encore longtemps de la guerre civile et de ses conséquences, et les Rouges commettent des atrocités effrayantes. Nous devons offrir un refuge à ceux qui fuient ce pays dévasté."
