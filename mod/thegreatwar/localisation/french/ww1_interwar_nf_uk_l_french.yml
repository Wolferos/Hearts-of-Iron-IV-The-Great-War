l_french:
 #--------------------------------------------------------------
 # [BRITISH EMPIRE] Interwar
 #=========================================================================
 ENG_interwar_aftermath_of_world_war_i:0 "Xonséquences de la Première Guerre mondiale"
 ENG_interwar_aftermath_of_world_war_i_desc:0 "Le conflit est terminé, et prions Dieu pour qu'il ne reprenne jamais. Des centaines de milliers d'hommes sont morts pour un résultat bien médiocre... cette guerre laissera dans notre histoire une trace indélébile et des conséquences dont nous auront du mal à nous défaire, dans notre politique, notre vie sociale et économique, et bien sûr dans notre démographie."
 ENG_interwar_jabbal_shammar_act: "Réclamer Al Hajara"
 ENG_interwar_jabbal_shammar_act_desc: ""
 ENG_interwar_jordan_act: "Réclamer Ruwaished"
 ENG_interwar_jordan_act_desc: ""
 ENG_interwar_irish_free_state:0 "État libre d'Irlande"
 ENG_interwar_irish_free_state_desc:0 "Les Irlandais ont manifesté massivement leur volonté de vivre libres et indépendants, en dehors de l'autorité de la couronne britannique. Il y a déjà eu suffisamment de victimes, inutile d'en rajouter plus : le cabinet du ministre est prêt à rencontrer les parlementaires irlandais pour assurer la création d'une Irlande libre."
 ENG_interwar_treaty_of_lausanne:0 "Traité de Lausanne"
 ENG_interwar_treaty_of_lausanne_desc:0 "Les délégations alliées sont parvenues à Lausanne et rencontrent actuellement leurs homologues turcs. Les pourparlers sont en cours et prendront encore quelques semaines, mais nous allons pouvoir parvenir à un accord qui consistera a reconnaître la nouvelle république turque et a délimiter de nouvelles frontières plus convenables, en protégeant certaines minorités ethniques en échange de l'abandon de certaines vieilles revendications."
 ENG_interwar_invade_constantinople:0 "Envahir Constantinople"
 ENG_interwar_invade_constantinople_desc:0 "Les troubles en Turquie mettent le monde sur la voie dangereuse d'un énième conflit meurtrier, et ce pays n'est plus que l'ombre de lui-même. On ne peut laisser des agitateurs s'emparer d'Istanbul et de contrôler un détroit aussi stratégiquement vital pour le commerce civil et le trafic militaire. Il faut commencer les préparatifs pour intervenir en Turquie et occuper la ville, et je vous parie que les vétérans de la campagne de Grèce seront plus que ravis de prendre leur revanche."
 #=========================================================================
 ENG_interwar_Allied_Intervention_in_Russia:0 "Intervention des Alliés en Russie"
 ENG_interwar_Allied_Intervention_in_Russia_desc:0 "Des réunions régulières entre Londres et Paris ont souligné la nécessité d'intervenir au plus vite en Russie. Le massacre n'aura-t-il donc jamais de fin ? Un corps expéditionnaire a été préparé, et la Navy nous couvrira pendant le voyage. Il faut mettre un terme à la menace rouge !"

 ENG_interwar_Czechoslovak_Legion:0 "Soutenir la Légion tchécoslovaque"
 ENG_interwar_Czechoslovak_Legion_desc:0 "La Légion Tchécoslovaque a prouvé sa valeur sur son sol et sur celui des autres. Et maintenant, ces brave sont retenus loins de chez eux ! Nous devrions leur proposer notre aide. Ils méritent de rentrer... et de créer leur propre état au coeur de l'Europe, un état qui sera notre allié."

 ENG_interwar_Czechoslovakia:0 "Reconnaître la Tchécoslovaquie"
 ENG_interwar_Czechoslovakia_desc:0 "Qui eut cru il y a encore quelques années qu'une nouvelle nation naîtrait des cendres de l'empire des Habsbourgs ? Les Tchécoslovaques sont prêts à entrer sur la scène internationale. Souhaitons-leur le meilleur."

 ENG_interwar_Mussolini:0 "Conséquences de la Marche sur Rome"
 ENG_interwar_Mussolini_desc:0 "Ce Mussolini n'a pas l'air d'être un individu de confiance... il a renversé le gouvernement stable sur lequel nous comptions jusqu'ici ! Et ses partisans sèment la terreur dans les rues italiennes. Enfin, cela pourrait être pire, imaginez s'il était acoquiné avec les Allemands..."

 ENG_interwar_Allied_Forces_Withdrew:0 "Retrait des forces alliées"
 ENG_interwar_Allied_Forces_Withdrew_desc:0 "Des années de guerre contre l'Autriche-Hongrie et l'Allemagne ont épuisé notre effort. Nous ne pouvons plus nous permettre de relancer encore la machine, c'est un trop gros effort pour nous. Et d'ailleurs, notre armée n'est pas franchement motivée pour aller se faire tuer dans les lointaines steppes russes, pour un conflit dont l'enjeu est encore très mal compris. Nous devrions préparer un plan de repli de nos forces, et laisser Rouges et Blancs s'entretuer comme ça leur chante."

 ENG_interwar_ImperialGoldReserve:0 "Accepter la restitution de l'or impérial aux Soviétiques"
 ENG_interwar_ImperialGoldReserve_desc:0 "Les Soviétiques ont eu le dessus. Nous le regrettons amèrement, mais la diplomatie exige d'être pragmatique, nous devons maintenant composer avec cette nouvelle puissance à l'est... et nous devrions leur envoyer les stocks d'or évacués par les Romanov. De toutes façons, nous n'aurions légalement rien pu en faire d'autre."

 ENG_interwar_AntiFascism:0 "Non au fascisme"
 ENG_interwar_AntiFascism_desc:0 "Les Fascistes infectent maintenant toutes les réunions politiques d'Europe ! Mais pas question de les voir dans nos rues. Nous devons réprimer ce mouvement dès maintenant, et accorder discrètement des moyens de propagande aux autres partis."

 ENG_interwar_WarOnFascism:0 "Guerre contre l'Italie"
 ENG_interwar_WarOnFascism_desc:0 "Les Italiens ont prouvé qu'ils ne sont pas des alliés fiables, même si ce fut en notre faveur au cours du dernier conflit. Et en prime, leur vie politique est plus qu'agitée, et menace d'être encore plus perturbée par l'arrivée de militants fascistes plus qu'avides de pouvoir. Nous devrions proposer notre médiation au roi Victor-Emmanuel III, sous la forme d'un petit corps expéditionnaire. Il est facile d'atteindre Rome, par la mer..."

 ENG_interwar_DealWithMussolini:0 "Inviter Mussolini à Londres"
 ENG_interwar_DealWithMussolini_desc:0 "Assez de guerre. Même si l'envie d'infliger une correction à ce Mussolini est bien présente, nous devons trouver un accord avec lui. Invitons-le à Londres avec une délégation, et entamons des pourparlers. Il changera d'avis."

 ENG_interwar_BritishFirst:0 "La Grande-Bretagne d'abord"
 ENG_interwar_BritishFirst_desc:0 "La nation britannique doit passer avant tout ! Économiquement, militairement, diplomatiquement, socialement... en fait, dans tous les domaines. Nous sommes le premier empire du monde, il faut ne pas l'oublier !"

 ENG_interwar_Keep_Calm_and_Stay_the_Course:0 "Garder votre calme et maintenir le cap"
 ENG_interwar_Keep_Calm_and_Stay_the_Course_desc:0 "Le flegme britannique est aussi légendaire que l'Earl Grey que nous infusons dans nos tasses. Restons résilients et optimistes en toutes circonstances, et l'avenir nous sourira."

 ENG_interwar_Favorise_Home_Ownership:0 "Favoriser l'accès à la propriété"
 ENG_interwar_Favorise_Home_Ownership_desc:0 "En permettant à une plus grande part de la population de devenirs propriétaires, nous nous assurons de voir leurs doléances entendues. Et ainsi de les rendre moins sensibles aux discours de certains agitateurs..."

 ENG_interwar_DealWithTrotsky:0 "Accord avec Trotsky"
 ENG_interwar_DealWithTrotsky_desc:0 "Même s'il reste un rouge, Trotsky a l'air nettement plus sensé que les fous dangereux qu'il a côtoyé. Nous devons négocier directement avec lui pour préparer la suite ; envoyons un message à notre ambassade moscovite."

 ENG_interwar_PromoteSocialism:0 "Promouvoir le socialisme"
 ENG_interwar_PromoteSocialism_desc:0 "Quelle nation peut mieux comprendre les idéaux socialistes que la nôtre, nous qui avons connu une Révolution Industrielle sans précédent ? Le but ultime de la vie civique est de promouvoir la liberté et l'égalité de tous ceux qui la composent. Faisons entrer au gouvernement des meneurs socialistes qui sauront propager cette vision !"

 ENG_interwar_ASovietKing:0 "Un roi soviétique"
 ENG_interwar_ASovietKing_desc:0 "Sa très gracieuse majesté s'est laissée convaincre au fil du temps du bien-fondé des idéaux des bolchéviques, même si c'est étrangement paradoxal quand on connaît le caractère fondamentalement anti-monarchique de cette idéologie. Toujours est-il que le roi suggère que nous adoptions un gouvernement ouvertement socialiste et bolchévique, et qu'une grande partie du pays penche en faveur de cette idée, camarade !"

 ENG_interwar_Support_Kolchak_s_Armies:0 "Soutenir les armées de Kolchak"
 ENG_interwar_Support_Kolchak_s_Armies_desc:0 "La Russie impériale sombre dans la guerre civile. Rouges et Blancs se déchirent; et nous ne pouvons rester les bras croisés ! Il faut envoyer tout de suite des cargos à l'amiral Kolchack, qui lutte a la tête des Blancs. Il a besoin d'armes, de munitions, de matériel médicaux, de nourritures... et nous avons aussi quelques tanks à lui expédier !"

 ENG_interwar_AntiBolshevik:0 "Politique anti-bolchevique"
 ENG_interwar_AntiBolshevik_desc:0 "Les bolchéviques prônent une doctrine sociale et économique tout à fait contraire à nos intérêts, et si nous n'y faisons rien, alors ils finiront un jour par nous agresser. Il faut orienter notre politique pour circonscrire cet incendie !"
 
 ENG_interwar_OperationThinkable:0 "Opération Thinkable"
 ENG_interwar_OperationThinkable_desc:0 "Certains de nos généraux se sont mis en tête de concevoir une première ébauche de plan si nous devions, je dis bien si nous devions, un jour entrer en guerre contre les Rouges... nous devrions y jeter un oeil, ne serait-ce que par curiosité."

 ENG_interwar_UnitedEmpire:0 "Empire-Uni"
 ENG_interwar_UnitedEmpire_desc:0 "Chaque centimètre carré de nos terres, qu'elles soient métropolitaines ou coloniales, appartiennent au même immense empire, celui de la couronne britannique, le plus puissant du monde ! Aucune distinction ne doit être faite entre colonies et métropole. Ce sont nos terres, et elles doivent être défendues et unifiées !"

 ENG_interwar_StreetsOfRaj:0 "Rues du Raj"
 ENG_interwar_StreetsOfRaj_desc:0 "Le vice-roi et gouverneur général des Indes n'est qu'un fantoche pathétique, dont les velleités indépendantistes sont connues de nos services. Mais le peuple ne s'y trompe pas, et nos généraux encore moins. Il est l'heure de passer à l'action afin d'annexer purement et simplement le Raj !"
 #=========================================================================