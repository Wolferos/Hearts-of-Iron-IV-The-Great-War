l_french:
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 HOL_ww1_army_effort: "Renforcer l'armée néerlandaise"
 HOL_ww1_army_effort_desc: "Beaucoup de nos fusils, canons, outils et malheureusement de nos commandants, sont des reliques d’une ère révolue. Avec l’adoption générale de la mitrailleuse Maxim, nous n’avons plus d’autres choix que de nous adapter. Plus vite nous adopterons ces nouvelles armes en circulation, avec les experts nécessaires pour nous apprendre à les utiliser, plus tôt notre armée pourra devenir une force combattante moderne et efficace."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 HOL_ww1_form_air_force: "Développement de l'Aviation I"
 HOL_ww1_form_air_force_desc: "Maintenant que nous avons pour de bon constitué une armée de l’Air, nous avons fait des avancées intéressantes. Plus notablement, nos concepteurs d’aéroplanes ont conçu des prototypes spécifiques pour des rôles précis, plus que des modèles génériques. Utiliser efficacement ces avions, conçus pour des rôles comme l’attaque des aéroplanes ennemis ou le largage de bombes, exigera des tests et des recherches, mais s’avérera avantageuse. "
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 HOL_ww1_naval_effort: "Reconstruire la Marine Royale Néerlandaise"
 HOL_ww1_naval_effort_desc: "Les navires propulsés par combustion ont le vent en poupe par rapport à leurs contemporains, et ils annoncent une nouvelle ère de guerre navale. Les énormes navires avec de gros canons engageant le combat à grande distance sont désignés pour l’ordre du jour. Pour cette raison, un programme de modernisation de nos navires, ainsi qu’une formation aux nouvelles tactiques militaires pour nos officiers, est nécessaire."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 HOL_political_effort: " Développement Politique"
 HOL_political_effort_desc: "L’heure de la réforme est arrivée. La nation a été sous bonne gouvernance du système depuis des années, mais ces temps troublés nécessitent un gouvernement qui soit en position de les affronter. Si nous voulons changer notre destin en tant que nation, ou soutenir notre gouvernement existant pour faire face aux agressions extérieures, des changements politiques ne peuvent que profiter à notre pays et au futur de notre peuple."
 HOL_Reform: "Courant réformateur"
 HOL_Reform_desc: "Les communistes du Sociaal-Democratische Arbeiderspartij gagnent de plus en plus d'influence dans notre pays, et leurs agitateurs sont de plus en plus dangereux. Nous devrions écouter ce qu'ils ont a dire, et inviter au moins un ou deux de leurs meneurs au gouvernement, pour apaiser les tensions. Nous aurions ainsi de nouveaux avis pour réformer le pays."
 HOL_Preserve: "Courant conservateur"
 HOL_Preserve_desc: "Face aux agitateurs communistes, c'est la fermeté qui doit prévaloir. Les conservateurs composent une grande partie de notre classe politique, et nous devons les conforter dans leurs positions."
 HOL_Reform_2: "Seconde Réforme"
 HOL_Reform_2_desc: "Les récentes réformes ont été un premier pas, mais les communistes sont maintenant encore plus nombreux et nombre d'autres figures politiques prônent une réforme plus ambitieuse encore, pour éviter la sclérose à notre grande nation. Il est l'heure de ne plus avoir froid aux yeux."
 HOL_Settle_religious_conflict: "Règlement des conflits religieux"
 HOL_Settle_religious_conflict_desc: "Ces vieilles haines entre protestants et catholiques empoisonnent la société et la politique néerlandaise depuis des siècles, et cela a assez duré ! Pour les temps à venir, il va falloir mettre ces dissenssions de côté et travailler pour le bien du pays. Il faut adopter des lois restrictives et punir sévèrement ces litiges quand ils éclatent en plein jour."
 HOL_End_census_kies: "Fin du census kiesrecht"
 HOL_End_census_kies_desc: "C'était une mauvaise idée depuis le départ que de confier le droit de vote à la seule taille du porte-monnaie de chaque citoyen. Dorénavant, tout homme peut voter, et pas juste les riches."
 HOL_Let_them_eat_potatoes: "Laissez-les manger des patates!"
 HOL_Let_them_eat_potatoes_desc: "La pomme de terre a l'avantage de pousser à peu près partout, de donner beaucoup de tubercules en un seul plant, et d'être nourrissante ! Financons de nouvelles exploitations, qui permettront de faire baisser le prix de l'alimentation sur le marché. Après tout, qui n'apprécie pas ces frites, avec un peu de sel et de la sauce..."
 HOL_Troelstra_reforms: "Réformes de Troelstra"
 HOL_Troelstra_reforms_decs: "Pieter Troelstra abolit tout parti politique et unit le peuple néerlandais. En tout cas, c'est ce qu'il souhaite faire, via son projet de révolution socialiste ! Et s'il n'avait pas tort ? Nous devrions organiser une rencontre avec lui, et juger de sa capacité a former un nouveau gouvernement."
 HOL_Capitalist_ideas: "Idées Capitalistes"
 HOL_Capitalist_ideas_desc: "Les capitalistes ont donné aux Pays-Bas leur puissance industrielle et financière actuelle. Sans renier nos idées sociales pour autant, nous devrions écouter leurs principaux chefs d'entreprises, pour améliorer notre vie économique."
 HOL_neutrality_focus1: "Neutralité"
 HOL_neutrality_focus1_desc: "Nous n'avons pas les moyens militaires necéssaires pour résister aux grandes puissances qui nous cernent de partout. Nous décidons de rester en-dehors de tout conflit armé en dehors de nos frontières."
 HOL_Reinforce_border: "Renforcer la Frontière"
 HOL_Reinforce_border_desc: "Nous n'avons pas le luxe de pouvoir nous permettre une bataille dans nos campagnes et nos villes : l'ennemi doit être arrêté à la frontière, ou pas du tout. Pour cela, nous devons renforcer nos défenses frontalière, en construisant plusieurs forteresses."
 HOL_Colony_effort: " Développement Colonial"
 HOL_Colony_effort_desc: "Dans cet effort pour développer notre pays, nous ne pouvons négliger nos colonies ! Nous devons continuer d'investir des moyens humains, matériels et financiers pour que l'empire néerlandais se perpétue, notamment dans le Pacifique."
 HOL_God_save_the_queen: "Dieu sauve la Reine!"
 HOL_God_save_the_queen_desc: "Notre reine est notre patrie, nous voulons servir pour et par elle. Développons le culte de la personnalité de notre famille royale, afin que le peuple aie toujours cette figure à laquelle se rallier."
 HOL_Netherland_first: "Les Pays-Bas d’abord !"
 HOL_Netherland_first_desc: "Face aux temps troublés qui s'annoncent, nous ne pouvons nous permettre la discorde et la division. Nous devons unifier notre pays !"
 HOL_Fight_2_live: "Combattre pour vivre un autre jour"
 HOL_Fight_2_live_desc: "Nous devons agir au cas où les choses iraient trop loin. Certains de nos ministres ont préparé un programme en vingt points, que nous adopterions en cas de menace extrême sur notre patrie, pour entrer rapidement en état de guerre totale et combattre jusqu'à la victoire."
 HOL_Live_2_Fight: "Vivre pour combattre le lendemain"
 HOL_Live_2_Fight_desc: "La défense est tout ce qui compte."
 HOL_democratic_focus: "Liberté"
 HOL_democratic_focus_desc: "Il est temps d’étendre nos perspectives politique et joindre les grandes nations libres du monde !"
 HOL_One_for_all: "Un pour tous!"
 HOL_One_for_all_desc: "Nous devons servir dans l’armée pour protéger la patrie!"
 HOL_More_men: "Et tous pour un!"
 HOL_More_men_desc: " Nous devons servir dans l’armée pour protéger notre peuple!"
 HOL_weapons: "Bénéfices de Guerre"
 HOL_weapons_desc: "Plus de bénéfices, c'est plus de réinvestisseemnts. Nous devons laisser l’industrie de l’armement profiter de la demande croissante en armes pour se renforcer encore, engager plus d'ouvriers et produire plus d'obus."
 HOL_VaderLand: "Voor volk en vaderland"
 HOL_VaderLand_desc: "Le nationalisme ne peut pas être une mauvaise chose..."
 HOL_Eupen: "Exiger Eupen"
 HOL_Eupen_desc: "Dans le passé, nous contrôlions Eupen... et il serait temps de la réclamer, car elle nous a injustement été volée. Et cela pourrait assurer la paix entre la Belgique et l’Allemagne."
 HOL_Enpower_democrats: "Renforcer les Démocrates"
 HOL_Enpower_democrats_desc: "La neutralité de notre pays est puissance, nous devrions montrer au monde que nous sommes prêts à tout pour défendre la liberté!"
 HOL_Faction_Bel: "Reformer la Groot Nederland"
 HOL_Faction_Bel_desc: "Nous allons restaurer la gloire d’antan des Pays-Bas ! Pour un bénéfice maximal, bien sûr."
 HOL_Faction_LUX: "Inviter le Luxembourg"
 HOL_Faction_LUX_desc: "Ils furent membre de notre République, par le passé. Peut-être voudraient-ils nous rejoindre à nouveau ?"
 HOL_Colony_freedom: "Autoriser des colonies plus autonomes "
 HOL_Colony_freedom_desc: "En bons communistes, nous n’avons pas de réelles colonies... mais le reste du monde ne le remarquera pas..."
 HOL_Fate_of_Siam: "Le destin du Siam"
 HOL_Fate_of_Siam_desc: "Le Siam est notre partenaire de longue date depuis des siècles, lorsque les premiers navigateurs sont venus y établir des comptoirs commerciaux. Aujourd'hui, beaucoup de voix s'élèvent chez eux pour que nous prenions une plus grande partie dans la gestion de leurs affaires."
 HOL_Claim_our_colies_america: "Revendiquer les Colonies américaines"
 HOL_Claim_our_colies_america_desc: ""
 HOL_Claim_our_colies: "Réclamer les colonies d’Asie"
 HOL_Claim_our_colies_desc: "Les Pays-Bas ne resteront pas passifs face à la suprématie britannique, japonaise, ou de qui que ce soit d'ailleurs. Nous devons rappeler au monde que certains territoires sont néerlandais de plein droit !"
 HOL_ww1_Colony_effort_1: "Développement des Colonies"
 HOL_ww1_Colony_effort_1_desc: "Nous devrions nous concentrer un peu plus sur le développement de nos colonies, en adoptant un plan de développement sur plusieurs années. Infrastructures civiles et commerciales, routes, réseaux hydrologiques, électrification du pays, industries locales... les sujets ne manquent pas."
 HOL_ww1_Improve_Colony_Dockyards: "Améliorer nos Chantiers Navals"
 HOL_ww1_Improve_Colony_Dockyards_desc: "Nous n'avons pas les moyens humains d'une armée très nombreuse, mais en revanche, notre marine peut être importante. Nous devons moderniser les chantiers navals de la Haye et d'Amsterdam pour pouvoir construire de nouveaux navires de guerre."
 HOL_ww1_Improve_Colony_Military: "Développer l’Industrie Militaire"
 HOL_ww1_Improve_Colony_Military_desc: "C'est un suicide que de dépendre des achats à l'étranger pour approvisionner notre armée. Nous devons produire nous-même au moins les fournitures les plus essentielles comme les obus, les balles de fusils et les matériels courants."
 HOL_ww1_Improve_Colony_Industry: "Améliorer notre production"
 HOL_ww1_Improve_Colony_Industry_desc: "Nous avons déjà considérablement amélioré nos rendements ces dernières années, mais nous pouvons toujours mieux faire. Avec quelques ajustements, nous pouvons encore accélérer le rythme de fabrication de nos plus grandes usines."
 HOL_ww1_Improve_Colony_Air: "Réformer l’armée de l’Air Coloniale"
 HOL_ww1_Improve_Colony_Air_desc: "Les forces aériennes sont un secteur qui se doit de rester à la pointe, et dans nos lointaines colonies, elles sont essentielles à la défense de nos intérêts. Il faut faire en sorte qu'elles assurent une cohésion parfaite avec le reste de nos forces, et que leur efficacité soit maximale."
 HOL_WW1_Colony_Research: "Recherches Coloniales"
 HOL_WW1_Colony_Research_desc: "Nos colonies sont partout dans le monde, et rassemblent des millions de personnes. Nous devrions accueillir les plus brillants esprits dans nos centres de recherche afin de faire progresser la recherche scientifique." 
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 HOL_ww1_diplomatic_effort: "Effort Diplomatique"
 HOL_ww1_diplomatic_effort_desc: "Il devient incroyablement difficile de rester systématiquement neutre dans les affaires du monde. Notre corps diplomatique demande déjà si nous devons être impliqués dans la lutte de pouvoir actuelle, ou si nous devons rester en dehors de ça. Bien que nous ne puissions pas encore répondre à la question, nous pouvons facilement augmenter les moyens dudit corps pour pouvoir choisir une de ces options."
 HOL_ww1_supportgermany: "Soutenir l’Allemagne"
 HOL_ww1_supportgermany_desc: "Le secteur industriel massif de l’empire allemand semble être un bon parti. Si le soutien public se porte en faveur des allemands, cela enverra un message positif et nous rapprochera des Puissances Centrales."
 HOL_ww1_supportfrance: "Soutenir la France"
 HOL_ww1_supportfrance_desc: "Bien que l’industrie française ne puisse pas rivaliser avec celle de l’Allemagne, ils ont beaucoup plus d’amis, et nous pourrions en être un de plus. En soutenant la France sur quelques questions diplomatiques majeures, nous pourrions les gagner à notre cause."
 HOL_ww1_supportaustria: " Soutenir l’Autriche-Hongrie"
 HOL_ww1_supportaustria_desc: "Le vieil empire Austro-Hongrois a vécu pour voir l’ascension de la plupart des nations majeures du monde. Ainsi, sûrement, si nous voulons être vus comme une nation majeure, quel meilleur parti soutenir ? Cela nous rapprochera également de la Triplice."
 HOL_ww1_supportrussia: "Soutenir la Russie"
 HOL_ww1_supportrussia_desc: "L’Empire Russe est en grand besoin d’une aide internationale. Pour la nation dont l’ancien leader a inventé le terme de « l’Homme Malade de la Russie », ils ne peuvent être en bonne santé. Notre soutien les aidera à patienter assez longtemps pour faire quelque chose de décisif."
 HOL_ww1_military_reserve: "Réserve Militaire"
 HOL_ww1_military_reserve_desc: "La guerre pourrait atteindre nos frontières d’un moment à l’autre, et en conséquence, nous devons nous préparer pour le pire. Une réserve militaire de conscrits peu formés n’aura pas de grande valeur en cas de guerre, mais ces jeunes gens impressionnables pourraient prendre goût à la vie militaire, et rejoindre ensuite la véritable armée."
 HOL_ww1_embargo_germany: "Sanctionner l’Allemagne"
 HOL_ww1_embargo_germany_desc: "Les attaques sous-marines illégales de l’Allemagne sont une insulte au libre-échange ! Sanctionner les autorités allemandes nous forcera à prendre parti, mais cela nous évitera de nous faire exploiter par les marchands allemands !"
 HOL_ww1_embargo_france: " Sanctionner la France"
 HOL_ww1_embargo_france_desc: "La magouille diplomatique de la France est impardonnable, comme leur traîtrise ! Bien qu’une sanction nous fasse apparaître comme non-neutres en cas de guerre, cela n’entraînera pas non plus notre pays dans la spirale du conflit. Et nous nous assurerons que la France ne profitera plus de nous !"
 HOL_ww1_sellweapons: "Vendre des armes"
 HOL_ww1_sellweapons_desc: "Bien que la tension du monde n'a jamais été aussi élevée, même ce nuage de tempête a une lueur d'espoir. Comme nous n'avons aucun intérêt à nous joindre au combat, nous pouvons facilement vendre nos armes et nos modèles d'arme - même aux deux côtés d'un conflit, si nous le voulons - et tuer les malheurs des autres. Leur faute sera de déclencher la guerre."
 HOL_ww1_joingermany: "Rejoindre les Puissances Centrales"
 HOL_ww1_joingermany_desc: "Les puissances centrales ont longtemps été des amis de notre nation et ont désespérément besoin d'aide en ces temps les plus incertains. Les rejoindre est un ticket à sens unique dans la guerre de leur côté, et nous ferions mieux d'y être si elles gagnent, et nous pourrions inverser la tendance avec une victoire décisive avec elles."
 HOL_ww1_joinfrance: "Rejoindre l'Entente"
 HOL_ww1_joinfrance_desc: "L'Entente semble actuellement être dans la meilleure position pour gagner la guerre, et nous ne voudrions pas être pris en défaut à la conférence de paix une fois qu'ils la feront. Rejoindre l'Entente va certainement nous entraîner dans la guerre, ce qui pourrait se terminer de manière désastreuse, mais au moins nous aurons des alliés pour nous aider, non ?"
 HOL_ww1_war_effort: "Effort de guerre"
 HOL_ww1_war_effort_desc: "Dans le monde contemporain, nous ne pouvons pas nous permettre de laisser d’autres nations surpasser notre armée. En développant notre base industrielle, nous nous assurons que nous aurons assez d’obus et de fusils pour nous démarquer."
 HOL_ww1_equip_fra: "Livraisons d'armes à l'Entente"
 HOL_ww1_equip_fra_desc: "Les Français sont prêts à payer le prix fort pour nos fusils. Qui sommes-nous pour dire non ?"
 HOL_ww1_equip_ger: "Livraisons d'armes aux Puissances Centrales"
 HOL_ww1_equip_ger_desc: "Pour une raison quelconque, les Allemands veulent nos armes. Pourquoi ne pas leur donner ce qu'ils veulent ?"
 HOL_ww1_Grants: "Subventions"
 HOL_ww1_Grants_desc: "Nous n'avons pas des millions de soldats, mais des millions tout court, ça, oui. Prêter de l'argent à l'Entente pour l'aider dans son effort de guerre sera tout aussi utile que de leur envoyer quelques milliers de jeunes hommes néerlandais."
 HOL_ww1_Volunteers: "Corps de Volontaires"
 HOL_ww1_Volunteers_desc: "Nous sommes et resterons neutres. Mais, nous pouvons quand même aider nos alliés dans leurs efforts de guerre en leur envoyant des troupes sous pavillon, euh... neutre."
 HOL_Colony_war: "Préparatifs de guerre dans les colonies"
 HOL_Colony_war_desc: "La guerre se rapproche, et quand elle sera là, quel que soit l'adversaire, il sera trop tard pour s'y préparer. Nos gouverneurs dans les colonies doivent prendre dès maintenant certaines mesures pour assurer la défense de leurs territoires en organisant une réserve militaire, en entreposant armes et munitions et en renforçant nos défenses."
 HOL_ww1_ENG_exchange_plan: "Plan d'échange néerlandais-anglais"
 HOL_ww1_ENG_exchange_plan_desc: "Ces Britanniques sont nos voisins maritimes directs, et ils seraient prêts à nous confier certains secrets et d'autres avantages si nous avions la bonne volonté d'organiser un partenariat commercial et scientifique avec eux."
 HOL_War_Reserach: "Recherche militaire"
 HOL_War_Reserach_desc: "Pour garder nos armées à la pointe de l'innovation, il importe d'orienter une partie de la recherche universitaire et civile vers les applications pratiques que pourraient nécessiter nos militaires."
 HOL_War_Studies: "Études de guerre"
 HOL_War_Studies_desc: "Nous devons étudier les combats qui se déroulent autour de nos frontières en envoyant des groupes d'observateurs, qui prendront des notes et tireront des leçons des affrontements en cours. Ils en tireront ainsi une expérience précieuse."
 HOL_Acces_Todos: "Ouvrir les frontières"
 HOL_Acces_Todos_desc: "La guerre approche à grands pas. Nous devrions ouvrir nos frontières pour sauver autant de vies humaines pendant que les armées nous contournent."
 HOL_ww1_war_fanatics: "Fanatiques de guerre"
 HOL_ww1_war_fanatics_desc: "Il y a des passionnés de la guerre qui aimeraient se battre aux côtés de nos amis. Après tout... pourquoi ne pas les écouter ?"
 HOL_ww1_ger_exchange_plan: "Plan d'échange néerlandais-allemand"
 HOL_ww1_ger_exchange_plan_desc: "Échanger des recherches avec les Allemands pourrait nous être très utile. Si nos voisins teutons sont expansionnistes, ils sont en revanche ingénieux. Ils ne refuseront pas de coopérer avec nous."
 HOL_German_access: "Accès militaire allemand"
 HOL_German_access_desc: "Un plan d'échange militaire avec l'Allemagne serait très profitable... et nos plénipotentiaires ont déjà eu des réunions secrètes aux cours desquelles les responsables allemands ont confirmé qu'ils seraient prêts à nous récompenser généreusement, si nous leur accordions un simple laisser-passer pour leurs troupes."
 HOL_neutrality_focus: "Neutralité"
 HOL_neutrality_focus_desc: "Alors que d'autres peuvent prétendre qu'il faut de la bravoure et de la sagesse pour prendre parti dans un conflit mondial, nous savons qu'il en faut plus encore pour refuser. Des siècles de tempérament belliqueux n'ont abouti qu'à des millions de victimes inutiles. Nous ne nous laisseront pas embarquer dans de nouveaux conflits."
 HOL_Hostile_diplo: "Neutralité hostile"
 HOL_Hostile_diplo_desc: "Si nous voulons être neutres, nous devrons être prêts à défendre notre neutralité. Nous défendrons la paix à coup de fusils si necéssaire, et tant pis pour le paradoxe !"
 HOL_friendly_diplo: "Neutralité amicale"
 HOL_friendly_diplo_desc: "Si nous voulons rester en dehors des guerres, nous devons nous lier d'amitié avec les parties combattantes. Français, Allemands, Britanniques, ils se mettront tous d'accord entre eux si nous les invitons au cours d'une table. Avec un bon sommelier non loin..."
 HOL_Armed_Neu: "Neutralité armée"
 HOL_Armed_Neu_desc: "Neutres ne doit en aucun cas signifier faible. Nous devons être préparés en cas de guerre, et êtres prêts à frapper lorsque cela sera necéssaire."
 HOL_Home_Defence: "Défense nationale"
 HOL_Home_Defence_desc: "C'est devenu incontrôlable, nous ne pouvons plus rester neutres ! Il faut donner plus de pouvoir aux généraux pour assurer la défense de la patrie."
 HOL_interventionism_focus: "Interventionnisme"
 HOL_interventionism_focus_desc: "Nous sommes partisans de la liberté de tous les peuples, et pas seulement de nos propres citoyens. Si empêcher la tyrannie signifie la guerre, alors qu'il en soit ainsi."
 HOL_deterrence: "Dissuasion"
 HOL_deterrence_desc: "Nous savons que la meilleure défense est une arme si connue que vous n'avez jamais à l'utiliser. Eh bien, il est temps d'appliquer l'expression au pied de la lettre."
 HOL_volunteer_corps: "Corps de volontaires"
 HOL_volunteer_corps_desc: "Forcer notre peuple à mourir pour des idéaux de liberté serait une cruelle ironie, mais établir des moyens pour ceux qui souhaitent aider les gens à l'étranger ne l'est pas."
 HOL_foreign_expeditions: "Expéditions Étrangères"
 HOL_foreign_expeditions_desc: "Avec nos ennemis prêts à intervenir dans des conflits lointains au nom de leurs idéaux, nous devons être prêts à faire de même pour les nôtres."
 HOL_why_we_fight: "Pourquoi nous combattons"
 HOL_why_we_fight_desc: "Le monde devient de plus en plus dangereux. Nos gens ont besoin de voir les atrocités commises par ceux qui recherchent le pouvoir. Il est temps que nous rallions les gens à notre cause et que tout le monde soit prêt à se battre pour notre liberté."
 HOL_technology_sharing: "Partage de technologie"
 HOL_technology_sharing_desc: "En partageant les progrès technologiques avec nos alliés occidentaux, toute notre nation sera en mesure de mener plus efficacement la recherche et le développement en temps de guerre."
