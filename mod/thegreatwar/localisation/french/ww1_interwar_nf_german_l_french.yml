 GER_int_imperialismus:0 "Impérialisme"
 GER_int_imperialismus_desc:0 "L'Empire allemand est fort, mais son héritage pourrait être plus important. En embrassant l'ambition impériale, nous nous préparons à faire revivre l'esprit du Saint Empire romain germanique et à affirmer notre domination légitime sur l'Europe."
 GER_int_game_of_thrones:0 "Game of Thrones"
 GER_int_game_of_thrones_desc:0 ""
 GER_int_heiliges_romisches_reich:0 "Heiliges Römisches Reich"
 GER_int_heiliges_romisches_reich_desc:0 ""
 GER_int_restore_burgundy:0 "Restaurer la Bourgogne"
 GER_int_restore_burgundy_desc:0 ""
 GER_int_claim_austria_and_bohemia:0 "Revendiquer l'Autriche et la Bohême"
 GER_int_claim_austria_and_bohemia_desc:0 "L'Autriche et la Bohême étaient autrefois au cœur de la domination impériale. Il est temps d'affirmer notre revendication historique et de ramener ces territoires sous la direction de l'Allemagne."
 GER_int_vereinigte_niederlande:0 "Vereinigte Niederlande"
 GER_int_vereinigte_niederlande_desc:0 ""
 GER_int_der_kirchenstaat:0 "Der Kirchenstaat"
 GER_int_der_kirchenstaat_desc:0 ""
 GER_int_old_prussia_is_prussia:0 "La vieille Prusse est la Prusse"
 GER_int_old_prussia_is_prussia_desc:0 "Nous pouvons faire revivre le glorieux héritage prussien que Frédéric II nous a légué, n'attendons pas !"
 GER_int_papal_coronation:0 "Couronnement papal"
 GER_int_papal_coronation_desc:0 ""
 GER_int_restore_the_teutonic_order:0 "Faire revivre l'ordre teutonique"
 GER_int_restore_the_teutonic_order_desc:0 ""
 GER_int_liberate_constantinopole:0 "Libérer Constantinople"
 GER_int_liberate_constantinopole_desc:0 "L'ancien bastion de la chrétienté se trouve entre des mains étrangères. Pour honorer notre foi et notre histoire, nous devons redonner à Constantinople la place qui lui revient dans le monde chrétien."
 GER_int_deus_vult: "Deus Vult"
 GER_int_deus_vult_desc:0 ""
 GER_int_crusader_king:0 "Crusader King"
 GER_int_crusader_king_desc:0 ""
 #-------------------------------------------------------------------------
 # INTERWAR - SHARED
 #=========================================================================
 GER_int_promote_fedor_von_bock:0 "Promouvoir Fedor von Bock"
 GER_int_promote_fedor_von_bock_desc:0 "Fedor von Bock a servi comme commandant de bataillon en 1916 et a été décoré du Pour le Mérite, la plus haute décoration militaire de l'Empire allemand. Dans les années 1920, Bock était, avec Kurt von Schleicher, Eugen Ott et Kurt von Hammerstein-Equord, membre d'un groupe secret connu sous le nom de Sondergruppe R, sélectionné par Hans von Seeckt et placé sous sa responsabilité. Ce groupe était chargé d'aider l'Allemagne à se soustraire à la partie V du traité de Versailles, qui avait désarmé l'Allemagne."
 #-------------------------------------------------------------------------
 # INTERWAR - DEFEAT
 #=========================================================================
 GER_int_defeat_in_the_weltkrieg:0 "Défaite de la Weltkrieg"
 GER_int_defeat_in_the_weltkrieg_desc:0 ""

 GER_int_crush_the_spartacists:0 "Écraser les spartakistes"
 GER_int_crush_the_spartacists_desc:0 "Il faut laisser les soldats des Freikorps attaquer les Spartacistes."
 GER_int_beer_hall_putsch_succeeds:0 "Succès du Putsch Beer Hall"
 GER_int_beer_hall_putsch_succeeds_desc:0 "Hitler est devenu le leader du parti national-socialiste et provoque des troubles à Munich. Se débarrasser de lui serait plus que bienvenu pour la stabilité de la République de Weimar. Lui donner une bonne occasion de tenter un coup d'état peut nous donner l'occasion de se débarrasser de lui. Bien sûr, nous courons le risque de son succès ..."
 interwar_hitler_putsch_success:0 "Le Putsch de la Brasserie réussit"
 GER_int_beer_hall_putsch_fails:0 "Echec du Putsch Beer Hall"
 GER_int_beer_hall_putsch_fails_desc:0 ""
 interwar_hitler_putsch_fail:0 "Le Putsch de la Brasserie échoue"
 GER_int_the_locarno_traties:0 "Les traités de Locarno"
 GER_int_the_locarno_traties_desc:0 "Nous avons compris que la France souhaitait vivement que les Britanniques garantissent ses frontières après la guerre. Nous pouvons faire un effort pour préserver la paix."
 GER_int_mein_kampf:0 "Mein Kampf"
 GER_int_mein_kampf_desc:0 "Le séjour d'Hitler en prison lui a donné l'occasion d'écrire un long livre sur sa vie et son idéologie. Autoriser sa publication et sa diffusion pourrait calmer le mouvement qui prend de l'ampleur. Et, espérons-le, ne pas continuer à le propager."
 GER_int_hitler_chancellor:0 "Nommer Hitler Chancelier de l'Allemagne"
 GER_int_hitler_chancellor_desc:0 "Le chancelier von Papen a conseillé au président Hindenburg de laisser son poste à Hitler. Tant que le président est en vie et qu'il est en mesure de conserver son pouvoir, Hitler ne devrait pas être en mesure d'exercer un véritable contrôle et s'épuisera. Il s'agit là d'un risque sérieux... mais qui peut permettre d'éviter une guerre civile."
 GER_int_reichstag_fire_decree:0 "Décret sur l'incendie du Reichstag"
 GER_int_reichstag_fire_decree_desc:0 "Le décret sur l'incendie du Reichstag (Reichstagsbrandverordnung) est le nom commun du décret du président du Reich pour la protection du peuple et de l'État, pris par le président allemand Paul von Hindenburg sur les conseils du chancelier Adolf Hitler en réponse immédiate à l'incendie du Reichstag. Ce décret annulait de nombreuses libertés civiles essentielles des citoyens allemands."
 GER_int_night_long_knives:0 "Nuit des longs couteaux"
 GER_int_night_long_knives_desc:0 "Maintenant que le nouveau Reich a pris le pouvoir, les anciens ennemis doivent être purgés. Toute personne susceptible de s'opposer au Reich doit être purgée, et vite !"

 GER_int_empower_liebknechtand_luxemburg:0 "Renforcer Liebknecht et Luxemburg"
 GER_int_empower_liebknechtand_luxemburg_desc:0 "C'est difficile à croire, et pourtant, Karl Liebknecht et Rosa Luxemburg ont été assassinés par les policiers qui les emmenaient en détention. La nouvelle met le pays en ébullition, et le gouvernement vacille devant les manifestations populaires ! C'était la provocation de trop de la part des conservateurs capitalistes ! Au moins nos camarades n'auront pas souffert pour rien."
 GER_int_contact_trotsky:0 "Contacter Trotsky"
 GER_int_contact_trotsky_desc:0 "Le nouveau pouvoir socialiste et ouvrier a besoin de conseillers extérieur pour faire face aux nombreux défis qui s'annonce, stabiliser le pays et asseoir son autorité. Pour cela, qui de mieux que Trotsky ? Nous devrions lui envoyer un télégramme pour l'inviter à Berlin en tant que conseiller spécial. Il nous sera d'une aide précieuse."
 GER_int_alte_kameraden: "Alte Kameraden"
 GER_int_alte_kameraden_desc:0 "Nous avons beaucoup d'intérêts en commun avec nos camarades soviétiques, à commencer par la lutte contre les capitalistes oeuvrent en Pologne. Nous devons répondre à leur appel et écraser la Pologne ! Ainsi, le conflit sera vite résolu, et la guerre s'arrêtera."
