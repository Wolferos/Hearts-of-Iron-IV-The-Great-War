l_french:
 alliance_choice:0 "Vous rejoindrez l'alliance à partir de l'objectif précédemment choisi.\n"
 choose_wisely:0 "§GVotre choix affectera l'alliance cible. Choisissez sagement.§!"
 no_proceed_benilux_alliance:0 "§RVous ne pourrez pas continuer avec le focus de l'alliance du Benelux si vous choisissez cette orientation.§!"
 fortify_belgium:0 "Fortifier les Frontières"

 #--------------------------------------------------------------
 # [Custom] Political Effort
 BEL_political_effort:0 "Développement politique"
 BEL_political_effort_desc:0 "Le temps de la Réforme est venu. La nation a été bien dirigée selon les vieux principes depuis des années, mais ces temps difficiles que nous traversons exigent un gouvernement capable d’y répondre. Si nous voulons pouvoir changer de voie, ou soutenir notre gouvernement actuel afin de résister à des agressions extérieures, le changement politique ne peut que profiter à notre nation et à l’avenir de notre peuple."
 BEL_collectivist_ethos:0 "L'ethos collectiviste"
 BEL_collectivist_ethos_desc:0 "La Nation est avant tout une construction civique, civile et sociale. Chaque effort des citoyen doit donc être dirigé vers le bien-être de la seule communauté qui vaille, celle de l'ensemble de ses concitoyens ! Nous devons promouvoir ces valeurs de coopération, d'entraide et de solidarité pour encourager ces actions du quotidien."
 BEL_ww1_sovereignist_ethos:0 "Ethos souverainiste"
 BEL_ww1_sovereignist_ethos_desc:0 "Qu'y-a-t-il de plus important que la souveraineté de notre nation ? Nous ne sommes pas un dominion, ni une colonie, ni un acteur mineur, mais un grand pays autonome. Il est temps de le réaffirmer sur la scène diplomatique."
 BEL_nationalism_focus:0 "Nationalisme"
 BEL_nationalism_focus_desc:0 "La fierté nationale pour notre grand (et plat) pays se regonfle grâce aux récents événements. Certains des hommes politiques de notre pays ont même inventé une nouvelle forme de gouvernement, connu sous le nom de « fascisme », qui puisse prendre racine dans notre pays. Peut-être que cette nouvelle façon de gouverner pourrait mener notre empire à un nouvel âge d’or !"
 BEL_internationalism_focus:0 "Internationalisme"
 BEL_internationalism_focus_desc:0 "La Révolution socialiste ne peut être arrêtée. Il est bon que notre peuple l’embrasse, et immédiatement, plutôt qu’au moyen d’une guerre civile. Quand nous commenceront à montrer notre soutien pour le Mouvement Communiste Internationaliste, nous serons auss rouges que le sang des hommes !"
 BEL_political_correctness:0 "Politiquement Correct"
 BEL_political_correctness_desc:0 "N’importe qui s’exprimant contre notre gouvernement commet clairement un crime de haine contre le peuple que nous défendons. Donc, quelqu’un qui se prononce contre le pouvoir en place devrait être surveillé de près."
 BEL_indoctrination_focus:0 "Endoctrinement"
 BEL_indoctrination_focus_desc:0 "Après des années de débats sur la manière d’obtenir des citoyens le soutien pour notre merveilleux nouveau régime, certains des membres du Conseil des Travailleurs ont suggéré l’établissement d’un nouveau « Ministère de l’Amour », qui persuaderait officiellement les gens de soutenir notre gouvernement. Nous ne parlerons pas ici de ce qui se passera officieusement dans ce ministère..."
 BEL_political_commissars:0 "Commissaires Politiques"
 BEL_political_commissars_desc:0 "L’armée est paradoxalement un endroit où le sentiment anti-national prospère. En nous assurant que notre gouvernement aie des yeux partout, nous pouvons traquer ces groupes d'agitateurs et les empêcher de grandir."
 BEL_ww1_democracy:0 "Priorité à la Démocratie"
 BEL_ww1_democracy_desc:0 "Il est dit que n’importe quel dirigeant tire son pouvoir du peuple. Si nous faisons un pas vers une société plus démocratique, même si nous ne le devenons pas réellement, nous pouvons au moins atteindre une meilleure position, pour pouvoir négocier avec des nations démocratiques du monde entier."
 BEL_militarism:0 "Militarisme"
 BEL_militarism_desc:0 "Notre armée devient de plus en plus partie prenante de la vie quotidienne de notre nation. Heureusement, le soutien populaire favorise nos troupes à l’heure actuelle, car ils les voient comme les héros qu’ils sont, se battant sous notre bannière pour défendre la Belgique. Cette culture militaire que nous allons établir servira la cause de nos forces armées."
 BEL_military_youth:0 "Jeunesse militaire"
 BEL_military_youth_desc:0 "Notre culture militariste doit aussi être présente chez nos enfants ! En forçant le respect de l’armée et en offrant une formation aux jeunes générations, nous pouvons être certains qu’ils grandissent et s’enrôlent pour servir notre glorieux régime. Certains pourraient appeler cela de l’exploitation... mais cela sonne mieux quand on dit que l’on donne un avenir brillant aux adolescents."
 BEL_paramilitarism:0 "Paramilitarisme"
 BEL_paramilitarism_desc:0 "Certains pays sont assez idiots pour condamner les milices armées, craignant les rébellions. Cependant, si nous sommes assez prudents pour limiter celles-ci aux loyalistes du régime, nous pouvons créer un autre groupe d’hommes en colères et armés, pouvant soutenir notre nation. Cela nous sera utile en cas de guerre."
 BEL_ww1_monarchy:0 "Priorité à l'Autoritarisme"
 BEL_ww1_monarchy_desc:0 "Les pouvoirs exercés par le Parlement et par le peuple peuvent être dangereux. La seule vraie façon de garder le contrôle de la nation, particulièrement dans de tels moments si difficiles, serait d’adopter une position généralement ferme, et de diriger notre pays comme il doit l’être."
 BEL_ww1_centralizedpower:0 "Programme de travail"
 BEL_ww1_centralizedpower_desc:0 "Avant, pendant ou après la guerre, tout le monde a un travail a réaliser pour son pays. Si nous mettons les vagabonds, les sans-abris et tous les autres mendiants inemployés au travail, nous pouvons accélérer notre développement économique et industriel."
 BEL_ww1_freespeech:0 "Liberté d'Expression"
 BEL_ww1_freespeech_desc:0 "En donnant aux gens le droit à la liberté d’expression et de manifestation, nous nous assurons qu’au moins, les gens peuvent mettre leur colère et leurs pensées dans quelque chose de plus créatif. Ceci dit, quelqu’un qui criera « AU FEU ! » dans un théâtre bondé, ou qui usera de n’importe quel terme un peu trop explicite pour décrire la mère du chef d’état, ira tout de même en prison..."
 BEL_ww1_reorganization_act:0 "Loi sur la réorganisation"
 BEL_ww1_reorganization_act_desc:0 "De grandes parties de notre territoire ont été sous l’emprise de groupes et d’individus divers depuis que la civilisation est parvenue jusqu’à notre nation. Au cours des siècles cependant, une part de ces terres a été mal administrée ou exploitée. En réorganisant ces terres et leurs propriétaires, surtout ceux qui furent inefficaces, nous pouvons déplacer bon nombre de personnes pour leur permettre de travailler dans nos industries."
 BEL_ww1_limited_rearmament:0 "Réarmement limité"
 BEL_ww1_limited_rearmament_desc:0 "Approvisionner correctement notre armée en fournitures militaires nécessite de grands investissements et des réquisitions. Bien sûr, avec un rationnement limité, les civils pourront toujours s’amuser –probablement au détriment des militaires."
 BEL_ww1_full_rearmament:0 "Rationnement sévère"
 BEL_ww1_full_rearmament_desc:0 "Qui peut prévoir l'avenir et dire que les guerres s'arrêteront ? Nous devons nous assurer que nos forces restent à la hauteur de la tâche qui les attendent."
 BEL_ww1_unitedpeople:0 "Ferveur politique"
 BEL_ww1_unitedpeople_desc:0 "Une populace motivée peut accomplir de grandes choses ! En inspirant le peuple pour qu’il se rallie à notre bannière sacrée, nous pouvons gagner facilement leurs cœurs et leurs esprits et les amener à faire ce que nous voulons. Tant que nous avons une force d’opposition suffisamment raisonnable pour que nous ressemblions aux gentils."
 BEL_ww1_massive_effort:0 "Effort massif"
 BEL_ww1_massive_effort_desc:0 "Chaque homme et chaque femme doivent aider l’effort national ! Avec le spectre de la Grande Guerre qui s’approche un peu plus chaque jour, un grand programme économique a été entrepris pour développer notre capacité industrielle et nous aider à surmonter nos rivaux détestés !"
 BEL_ww1_fortify_city:0 "Fortifications civiles"
 BEL_ww1_fortify_city_desc:0 "Quand les combats atteindront nos frontières, il est préférable que nous y soyons préparés. En louant le services d’ouvriers du bâtiments pour construire des forteresses et des casemates sur certaines de nos provinces extérieures, et notamment sur le canal de la Meuse, nous pouvons tenir à distance l’ennemi qui oserait nous attaquer, et ce sans prendre de risques!"
 BEL_ww1_fortify_coast:0 "Défense côtière"
 BEL_ww1_fortify_coast_desc:0 "Une côte n’est pas facile à défendre. Maintenanht qu'il existe des navires capables de débarquer des troupes pratiquement n’importe où sur nos rivages, les forts côtiers ne seront pas de trop pour rejeter nos ennemis à la mer."

 #--------------------------------------------------------------
 # [Custom] Diplomatic Effort
 BEL_ww1_diplomatic_effort:0 "Développement diplomatique"
 BEL_ww1_diplomatic_effort_desc:0 "Il devient de plus en plus difficile de rester neutre dans le monde actuel. Notre corps diplomatique ne cesse de nous presser à prendre position dans les luttes de pouvoirs qui se développement, ou de déclarer officiellement notre neutralité. Nous ne pouvons pas encore répondre à la question, mais nous pouvons facilement donner les moyens à nos diplomates pour choisir une de ces options."
 BEL_ww1_benilux_focus:0 "Priorité au Bénélux"
 BEL_ww1_benilux_focus_desc:0 "Notre position géopolitique a toujours été très difficile, coincés comme nous pouvons l'être entre la France, l'Angleterre et l'Allemagne. Nous serons toujours cernés par des puissances plus ou moins hostiles et beaucoup plus puissantes. Alors, nous devons nous unir avec nos voisins néerlandais et luxembourgeois, pour que le Bénélux rassemble nos efforts communs pour notre défense !"
 BEL_ww1_entente_focus:0 "Amitié avec l'Entente"
 BEL_ww1_entente_focus_desc:0 "Il est difficile d'imaginer de nous concilier les faveurs des Prussiens, décidément trop agressifs et expansionnistes ! Nos voisins Français et Britanniques sont nos alliés naturels. C'est auprès d'eux que nous devons rechercher une alliance, pour que la Belgique survive au siècle suivant."
 BEL_adios_1839_agreement:0 "Le traité de Londres est trop restrictif"
 BEL_adios_1839_agreement_desc:0 "Le traité de 1839 est vieux et dépassé, et il sert surtout d'outil géopolitique aux Anglais et aux Allemands ! Nous devons exiger une révision de ses termes afins d'établir plus solidement notre souveraineté et notre indépendance, et le libre-usage de nos ports et bases navales."
 BEL_ww1_germany_focus:0 "Amitié avec les puissances centrales"
 BEL_ww1_germany_focus_desc:0 "L'alliance austro-prussienne est un dangereux mélange de puissance militaire brute et de réserves humaines presques inépuisables. Qui empêchera mieux ces teutons belliqueux de nous anéantir en cas de guerre ? Nous devrions les courtiser par voie diplomatique."
 BEL_ww1_neutrality_focus:0 "Neutralité"
 BEL_ww1_neutrality_focus_desc:0 "Rien n'arrêtera les vélleités de conquête. Après Napoléon, il y a eu Guillaume II, et il y en aura toujours d'autres : nous ne devons ni ne pouvons nous laisser entraîner tous les cinquante ans dans de nouvelles guerres aussi meurtrières qu'inutiles. La neutralité absolue doit être notre seule position politique, ne serait-ce que pour montrer l'exemple aux autres pays pacifiques."
 BEL_ww1_ally_benilux:0 "Alliance du Benelux"
 BEL_ww1_ally_benilux_desc:0 "Personne ne se fait d'illusions sur les capacités de résistance militaire de la Belgique, des Pays-Bas et plus encore du Luxembourg s'il prenait l'envie aux Allemands ou aux Français d'envahir l'un ou l'autre. Mais si nous convenons avec nos deux voisins d'une alliance militaire, alors ce défi sera beaucoup, beaucoup plus ardu pour quiconque... et nous accroissons nos chances de nous protéger d'une agression."
 BEL_ww1_conquer_benilux:0 "Conquérir le Benelux"
 BEL_ww1_conquer_benilux_desc:0 "Il fut un temps où la Belgique était infiniment plus grande qu'actuellement. Nous devrions réunifier l'antique territoire belge, d'autant plus que nos voisins ont trop fait preuve de leurs errements politiques et de leur faiblesse. Nous devons annexer le Luxembourg et les Pays-Bas."
 BEL_ww1_major_alliance:0 "Choisissez votre camp"
 BEL_ww1_major_alliance_desc:0 "La neutralité était un choix illusoire. Ce n'est désormais qu'une impasse et l'ensemble de la classe politique belge le reconnaît; il faut choisir un camp, et tout de suite... l'Entente, ou la Triplice ?"
 BEL_ww1_fortify_borders:0 "Fortifier les frontières"
 BEL_ww1_fortify_borders_desc:0 "Contrairement à nos voisins, nous n'avons absolument pas le luxe de pouvoir nous permettre de perdre quelques territoires avant de parvenir à stopper les envahisseurs : c'est sur les frontières qu'un agresseur extérieur doit être arrêté, ou pas du tout ! Nous devons donc financer un nouveau programme de construction de tranchées et de casemates blindées."
 BEL_ww1_demand_eupen:0 "Exiger Eupen"
 BEL_ww1_demand_eupen_desc:0 "La ville d'Eupen appartient pleinement à la Wallonnie, et l'empire allemand nous l'a volée en 1815. Ils n'en ont pas besoin, alors qu'elle fait partie de notre nation de plein droit ! Nous devons exiger son rattachement à la Belgique."

 BEL_ww1_unite_benilux:0 "Unifier le Benelux"
 BEL_ww1_unite_benilux_desc:0 "Assez patienté. Le Bénélux est partiellement ou en totalité sous notre contrôle, maintenant. Pour écrire l'Histoire, nous devons unifier totalement ces terres qui sont à la charnière de l'Europe."

 BEL_ww1_congo:0 "Politique belge au Congo"
 BEL_ww1_congo_desc:0 "Il est remarquable qu'une si petite nation comme la nôtre aie un empire colonial aussi étendu ! Nous ne devons pas laisser l'initiative au secteur privé, il faut résolument s'investir beaucoup plus que cela dans notre politique coloniale, recruter des administrateurs et dédier un ministère à ces questions."
 BEL_ww1_congo_infra:0 "Plan de financement des infrastructures du Congo"
 BEL_ww1_congo_infra_desc:0 "Le Congo est potentiellement immensément riche et peuplé de gens travailleurs et volontaires. Notre ministre des Colonies a préparé un programme en trente points qui s'appuie sur un plan de financement ambitieux : routes, voies ferrées, ports, gares, entrepôts, entreprises privées et lieux publics ! Dépensons sans compter."
 BEL_ww1_ReorganizeForcePublique:0 "Réorganiser la Force Publique"
 BEL_ww1_ReorganizeForcePublique_desc:0 "Notre armée coloniale ne peut plus se reposer exclusivement sur des soldats métropolitains envoyés péniblement au coeur de l'Afrique, en petit nombre et souffrant régulièrement de maladies et de problèmes d'approvisionnements. Nous devons nous appuyer sur les locaux et faire participer les Congolais à la force publique."
 BEL_ww1_congo_RubberMonocultureExpansion:0 "Expansion de la monoculture du caoutchouc"
 BEL_ww1_congo_RubberMonocultureExpansion_desc:0 "A quoi sert le caoutchouc ? Mais à tout, pardi ! Dans l'industrie civile autant que militaire, on en demande partout, et notamment pour les pneumatiques qui équipent les nouvelles automobiles. Et le hasard fait bien les choses, car cette ressource se trouve en abondance au Congo, où pousse l'hévéa. C'est une véritable mine d'or ; il nous faut financer un programme de construction de nouvelles cultures d'hévéas."
 BEL_ww1_ApproveLeopoldLegacyCongo:0 "Défendre l'héritage colonial de Léopold II"
 BEL_ww1_ApproveLeopoldLegacyCongo_desc:0 "Malgré ses ordres de répressions brutales, Léopold II a laissé à la Belgique un grand territoire en Afrique. C'est grâce à lui que nous avons pu nous emparer de tout le bassin du Congo ! Nous devons commémorer ses efforts."
 BEL_ww1_CongoFreeState:0 "Rétablir l'État libre du Congo"
 BEL_ww1_CongoFreeState_desc:0 "L'état indépendant du Congo qui avait été établi en 1885 a pavé la voie pour un futur rétablissement d'un état libre et souverain. Nous suggérons de continuer dans cette voie, et un jour le Congo sera notre allié le plus précieux."
 BEL_ww1_ColonialRepression:0 "Répression coloniale"
 BEL_ww1_ColonialRepression_desc:0 "Les troubles récents dans nos colonies africaines risquent de s'étendre comme un feu de paille. Il faut envoyer des instructions claires et nettes à nos autorités coloniales, et ordonner une répression sans pitié des révoltes et des actes de banditisme !"
 BEL_ww1_InviteEuropeanSettlers:0 "Inviter les colons européens"
 BEL_ww1_InviteEuropeanSettlers_desc:0 "Pour accroître notre emprise sur ce pays, nous devons encourager les Belges a émigrer là-bas, au coeur de l'Afrique. Plus de colons signifie plus d'entreprises, de marchandises et de pouvoir au bout du compte."
 BEL_ww1_DenyLeopoldLegacyCongo:0 "Nier l'héritage du roi Léopold en Afrique"
 BEL_ww1_DenyLeopoldLegacyCongo_desc:0 "Le roi Léopold II était sage, mais il a aussi commis de terribles erreurs et exploité horriblement les populations colonisées. Ces horreurs ne doivent plus se répéter... et nous devons discrètement faire passer à la trappe cet héritage malheureux."
 BEL_ww1_FreeCongo:0 "Congo libre"
 BEL_ww1_FreeCongo_desc:0 "L'Histoire ne va pas dans le sens de l'opression. Les Congolais méritent comme les autres d'être libres et indépendants, d'autant plus que cette colonie ne nous a pas rapporté tant que ça. Nous devons rencontrer les responsables politiques locaux et préparer une autonomie totale du pays."
 BEL_ww1_ClaimingHumanRightsAfrica:0 "Revendiquer les droits de l'homme en Afrique"
 BEL_ww1_ClaimingHumanRightsAfrica_desc:0 "Les Droits de l'Homme sont une vérité universelle, que cela concerne les Blancs, les Noirs ou n'importe quel autre peuple de la Terre ! Cela a été un aveuglement désastreux de le nier jusqu'ici. Les Congolais sont un peuple fier et libre, qui a assez souffert."
 #--------------------------------------------------------------
 # [Events]
 ww1_belgium.2.t:0 "La Belgique propose une alliance"
 ww1_belgium.2.d:0 "Aujourd'hui nous avons reçu un message de la Belgique nous invitant dans leur alliance. Ils proposent d'unir le Benelux et de créer une nouvelle alliance forte. Que devrions-nous faire ?"
 ww1_belgium.2.a:0 "C'est une bonne proposition."
 ww1_belgium.2.b:0 "Non!"
 ww1_belgium.3.t:0 "La Belgique exige la subjugation"
 ww1_belgium.3.d:0 "Aujourd'hui, la Belgique nous a envoyé une demande officielle de subjugation. Ils ont également dit qu'ils utiliseront la force si nécessaire. Quelle est notre réponse ?"
 ww1_belgium.3.a:0 "Nous n'avons pas le choix..."
 ww1_belgium.3.b:0 "Ils peuvent venir seulement s'ils brisent notre défense!"
 ww1_belgium.4.t:0 "La Belgique demande Eupen!"
 ww1_belgium.4.d:0 "Eupen a toujours été un territoire belge. Maintenant, ils revendiquent leurs terres légitimes. La Belgique n'est pas si forte, mais devrions-nous commencer la guerre pour un petit bout de terrain ?"
 ww1_belgium.4.a:0 "C'est leur terre historique après tout"
 ww1_belgium.4.b:0 "Non, c'est un territoire allemand"
 ww1_belgium.5.t:0 "Unir le Benelux"
 ww1_belgium.5.d:0 "Nous pensons qu'il est temps d'unir le Benelux. Nous allons unir les gens de la région du Benelux sous notre domination."
 ww1_belgium.5.a:0 "Nous enverrons la demande à nos voisins"
 ww1_belgium.5.b:0 "Nous contrôlons déjà le Benelux"
