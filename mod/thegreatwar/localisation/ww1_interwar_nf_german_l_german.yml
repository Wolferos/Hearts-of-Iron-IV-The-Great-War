l_german:
###  Übersetzung von Proho  ###
 # [GERMAN EMPIRE] Interwar
 #=========================================================================
 GER_int_beer_hall_putsch_succeeds:0 "Bierhallen-Putsch"
 GER_int_beer_hall_putsch_succeeds_desc:0 "Hitler ist zum Führer der Nationalsozialistischen Partei aufgestiegen und stiftet in München Unruhe. Ihn loszuwerden wäre gut für die Stabilität der Weimarer Republik. Wenn wir ihm eine gute Gelegenheit geben, loszuschießen und einen Staatsstreich zu versuchen, haben wir vielleicht die Möglichkeit, ihn loszuwerden. Natürlich gehen wir das Risiko ein, dass er Erfolg hat..."

 GER_int_the_locarno_traties:0 "Die Locarno Verträge"
 GER_int_the_locarno_traties_desc:0 "Wir haben erkannt, dass Frankreich eine britische Garantie für seine Nachkriegsgrenzen sehr wünscht. Wir können uns bemühen, den Frieden zu erhalten."
 GER_int_mein_kampf:0 "Mein Kampf"
 GER_int_mein_kampf_desc:0 "Hitlers Zeit im Gefängnis hat ihm die Möglichkeit gegeben, ein langes Buch über sein Leben und seine Ideologie zu schreiben. Die Erlaubnis zu seiner Veröffentlichung und Verbreitung könnte die wachsende Bewegung beruhigen. Und sie hoffentlich nicht weiter verbreiten."
 GER_int_hitler_chancellor:0 "Ernennung Hitlers zum Reichskanzler von Deutschland"
 GER_int_hitler_chancellor_desc:0 "Reichskanzler von Papen hat Reichspräsident Hindenburg geraten, Hitler seinen Posten zu überlassen. Solange der Reichspräsident am Leben und in der Lage war, seine Macht zu behalten, sollte Hitler nicht in der Lage sein, wirkliche Kontrolle auszuüben, und wird sich selbst ausbrennen. Dies ist ein ernsthaftes Risiko, kann aber einen Bürgerkrieg abwenden."

 GER_int_promote_fedor_von_bock:0 "Fedor von Bock befördern"
 GER_int_promote_fedor_von_bock_desc:0 "Fedor von Bock diente 1916 als Bataillonskommandeur und wurde mit dem Pour le Mérite, der höchsten militärischen Auszeichnung des Deutschen Reichs, ausgezeichnet. In den 1920er Jahren war Bock zusammen mit Kurt von Schleicher, Eugen Ott und Kurt von Hammerstein-Equord Mitglied einer geheimen Gruppe namens Sondergruppe R, die von Hans von Seeckt ausgewählt wurde und ihm unterstellt war, um Deutschland dabei zu helfen, den Teil V des Versailler Vertrags zu umgehen, der Deutschland entwaffnet hatte."

 GER_int_night_long_knives:0 "Nacht der langen Messer"
 GER_int_night_long_knives_desc:0 "Nun, da das neue Reich die Macht übernommen hat, müssen die alten Feinde beseitigt werden. Jeder, der auch nur im Entferntesten gegen das Reich sein könnte, muss beseitigt werden - und zwar schnell!"
 ############################################################################################
 interwar_hitler_putsch_success:0 "Bierhallen-Putsch Erfolgreich"
 interwar_hitler_putsch_fail:0 "Bierhallen-Putsch Gescheitert"
 ############################################################################################

 ############################################################################################
 GER_int_reichstag_fire_decree:0 "Reichstagsbrandverordnung"
 GER_int_reichstag_fire_decree_desc:0 "Die Reichstagsbrandverordnung ist die allgemeine Bezeichnung für die Verordnung des Reichspräsidenten zum Schutz von Volk und Staat, die der deutsche Reichspräsident Paul von Hindenburg auf Anraten von Reichskanzler Adolf Hitler als unmittelbare Reaktion auf den Reichstagsbrand erließ. Die Verordnung hob viele der wichtigsten bürgerlichen Freiheiten der deutschen Bürger auf."

 GER_int_crush_the_spartacists:0 "Zerschlagung der Spartakisten"
 GER_int_crush_the_spartacists_desc:0 "Da es uns nicht möglich ist, die Armee zu rufen, und wir nicht genügend Mittel für die Polizei haben, müssen wir es den Soldaten des Freikorps überlassen, die Spartakisten anzugreifen. Das wird viel Schaden anrichten, aber es ist die einzige Möglichkeit."

 GER_int_alte_kameraden:0 "Alte Kameraden"
 GER_int_alte_kameraden_desc:0 "Wir haben viele gemeinsame Interessen mit unseren sowjetischen Genossen, angefangen mit dem Kampf gegen die in Polen tätigen Kapitalisten. Wir müssen ihrem Ruf folgen und Polen zerschlagen! Auf diese Weise wird der Konflikt schnell gelöst und der Krieg beendet."

 GER_int_contact_trotsky:0 "Kontakt zu Trotzki"
 GER_int_contact_trotsky_desc:0 "Die neue sozialistische und Arbeitermacht braucht externe Berater, um die vielen Herausforderungen, die auf sie zukommen, zu bewältigen, das Land zu stabilisieren und ihre Autorität zu festigen. Wer wäre dafür besser geeignet als Trotzki? Wir sollten ihm ein Telegramm schicken und ihn als Sonderberater nach Berlin einladen. Er wird uns eine große Hilfe sein."

 GER_int_empower_liebknechtand_luxemburg:0 "Liebknecht und Luxemburg sind deutsche Märtyrer"
 GER_int_empower_liebknechtand_luxemburg_desc:0 "Es ist kaum zu glauben, und doch wurden Karl Liebknecht und Rosa Luxemburg von den Polizisten, die sie in Gewahrsam nahmen, ermordet. Die Nachricht brachte das Land in Aufruhr, und die Regierung wankte angesichts der Volksdemonstrationen! Das war eine Provokation zu viel von den kapitalistischen Konservativen! Wenigstens haben unsere Kameraden nicht umsonst gelitten."
 ############################################################################################