l_german:
###  Übersetzt von Proho  ###
 alliance_choice:0 "Sie schließen sich einer Allianz aus einem zuvor gewählten Schwerpunkt an.\n"
 choose_wisely:0 "§GIhre Wahl wird das Zielbündnis beeinflussen. Wähle weise.§!"
 no_proceed_benilux_alliance:0 "§RSie können nicht mit dem Fokus Benelux Allianz fortfahren, wenn Sie diesen Fokus wählen.§!"
 fortify_belgium:0 "Bau von Grenzbefestigungen"

 #--------------------------------------------------------------
 # [Custom] Diplomatic Effort
 BEL_ww1_diplomatic_effort:0 "Diplomatische Bemühungen"
 BEL_ww1_diplomatic_effort_desc:0 "In der heutigen Welt wird es immer schwieriger, neutral zu bleiben. Unser diplomatisches Korps drängt uns immer wieder, in den sich entwickelnden Machtkämpfen Stellung zu beziehen oder unsere Neutralität offiziell zu erklären. Wir können die Frage noch nicht beantworten, aber wir können unseren Diplomaten leicht die Mittel an die Hand geben, um eine dieser Optionen zu wählen."
 BEL_ww1_benilux_focus:0 "Benelux Fokus"
 BEL_ww1_benilux_focus_desc:0 "Unsere geopolitische Lage war schon immer sehr schwierig, eingezwängt, wie wir es zwischen Frankreich, England und Deutschland sein können. Wir werden immer von mehr oder weniger feindlichen und viel mächtigeren Mächten umzingelt sein. Also müssen wir uns mit unseren niederländischen und luxemburgischen Nachbarn zusammenschließen, damit die Benelux-Staaten unsere gemeinsamen Anstrengungen für unsere Verteidigung bündeln!"
 BEL_ww1_entente_focus:0 "Entente Freundschaft"
 BEL_ww1_entente_focus_desc:0 "Es ist schwer vorstellbar, dass wir die Gunst der Preußen erlangen, die entschieden zu aggressiv und expansionistisch sind! Unsere Nachbarn Frankreich und Großbritannien sind unsere natürlichen Verbündeten. Bei ihnen müssen wir uns um ein Bündnis bemühen, damit Belgien das nächste Jahrhundert überlebt."
 BEL_adios_1839_agreement:0 "Der Londoner Vertrag ist zu restriktiv"
 BEL_adios_1839_agreement_desc:0 "Der Vertrag von 1839 ist alt und überholt und dient vor allem den Briten und Deutschen als geopolitisches Instrument. Wir müssen eine Revision seiner Bedingungen fordern, um unsere Souveränität und Unabhängigkeit sowie die freie Nutzung unserer Häfen und Marinestützpunkte stärker zu verankern."
 BEL_ww1_germany_focus:0 "Mittelmächte Freundschaft"
 BEL_ww1_germany_focus_desc:0 "Die österreichisch-preußische Allianz ist eine gefährliche Mischung aus roher militärischer Macht und schier unerschöpflichen Menschenreserven. Wer könnte diese kriegerischen Teutonen besser davon abhalten, uns im Falle eines Krieges zu vernichten? Wir sollten sie auf diplomatischem Wege umwerben."
 BEL_ww1_neutrality_focus:0 "Neutralität Fokus"
 BEL_ww1_neutrality_focus_desc:0 "Nichts wird die Eroberungsgelüste aufhalten. Nach Napoleon kam Wilhelm II. und es wird immer wieder andere geben: Wir dürfen und können uns nicht alle 50 Jahre in neue Kriege hineinziehen lassen, die ebenso mörderisch wie sinnlos sind. Absolute Neutralität muss unsere einzige politische Position sein, und sei es nur, um anderen friedliebenden Ländern ein Beispiel zu geben."
 BEL_ww1_ally_benilux:0 "Benelux Allianz"
 BEL_ww1_ally_benilux_desc:0 "Niemand macht sich Illusionen über die militärische Widerstandsfähigkeit Belgiens, der Niederlande und noch mehr Luxemburgs, wenn es den Deutschen oder Franzosen in den Sinn käme, in eines der beiden Länder einzumarschieren. Aber wenn wir mit unseren beiden Nachbarn eine Militärallianz vereinbaren, dann wird diese Herausforderung für jeden viel, viel schwieriger sein ... und wir erhöhen unsere Chancen, uns vor einer Aggression zu schützen."
 BEL_ww1_conquer_benilux:0 "Eroberung Benelux"
 BEL_ww1_conquer_benilux_desc:0 "Es gab eine Zeit, in der Belgien unendlich viel größer war als heute. Wir sollten das alte belgische Territorium wiedervereinigen, zumal unsere Nachbarn ihre politischen Fehler und ihre Schwäche zu oft unter Beweis gestellt haben. Wir müssen Luxemburg und die Niederlande annektieren."
 BEL_ww1_major_alliance:0 "Seite wählen"
 BEL_ww1_major_alliance_desc:0 "Die Neutralität war eine illusorische Wahl. Sie ist nun eine Sackgasse und die gesamte belgische politische Klasse erkennt dies an; man muss sich für eine Seite entscheiden, und zwar sofort... die Entente oder die Triplice?"
 BEL_ww1_fortify_borders:0 "Grenzen befestigen"
 BEL_ww1_fortify_borders_desc:0 "Im Gegensatz zu unseren Nachbarn können wir es uns absolut nicht leisten, einige Gebiete zu verlieren, bevor wir die Invasoren stoppen können: An den Grenzen muss ein Angreifer von außen gestoppt werden - oder gar nicht! Wir müssen daher ein neues Programm zum Bau von Schützengräben und gepanzerten Kasematten finanzieren."
 BEL_ww1_demand_eupen:0 "Forderung Eupen"
 BEL_ww1_demand_eupen_desc:0 "Die Stadt Eupen gehört voll und ganz zur Wallonie, und das Deutsche Reich hat sie uns 1815 gestohlen. Sie brauchen sie nicht, obwohl sie von Rechts wegen Teil unserer Nation ist! Wir müssen ihren Anschluss an Belgien fordern."

 BEL_ww1_unite_benilux:0 "Benelux vereinen"
 BEL_ww1_unite_benilux_desc:0 "Genug der Geduld. Die Benelux-Staaten stehen jetzt teilweise oder ganz unter unserer Kontrolle. Um Geschichte zu schreiben, müssen wir diese Länder, die an der Nahtstelle Europas liegen, vollständig vereinen."

 BEL_ww1_congo:0 "Belgische Politik im Kongo"
 BEL_ww1_congo_desc:0 "Es ist bemerkenswert, dass eine so kleine Nation wie die unsere ein so großes Kolonialreich besitzt! Wir dürfen die Initiative nicht dem Privatsektor überlassen, sondern müssen entschieden viel mehr in unsere Kolonialpolitik investieren, Verwaltungsbeamte einstellen und ein Ministerium für diese Fragen widmen"
 BEL_ww1_congo_infra:0 "Kongos Finanzierungsplan für Infrastrukturen"
 BEL_ww1_congo_infra_desc:0 "Der Kongo ist potenziell unermesslich reich und wird von fleißigen und willigen Menschen bewohnt. Unser Kolonialminister hat ein Dreißig-Punkte-Programm ausgearbeitet, das auf einem ehrgeizigen Finanzierungsplan beruht: Straßen, Eisenbahnlinien, Häfen, Bahnhöfe, Lagerhäuser, Privatunternehmen und öffentliche Plätze! Geben wir alles aus, ohne zu zählen."
 BEL_ww1_ReorganizeForcePublique:0 "Reorganize Die Öffentliche Kraft"
 BEL_ww1_ReorganizeForcePublique_desc:0 "Unsere Kolonialarmee kann sich nicht mehr ausschließlich auf Soldaten aus dem Mutterland stützen, die mühsam ins Herz Afrikas geschickt werden, in geringer Zahl vorhanden sind und regelmäßig unter Krankheiten und Versorgungsproblemen leiden. Wir müssen uns auf die Einheimischen stützen und die Kongolesen an der öffentlichen Gewalt beteiligen."
 BEL_ww1_congo_RubberMonocultureExpansion:0 "Expansion der Kautschuk-Monokultur"
 BEL_ww1_congo_RubberMonocultureExpansion_desc:0 "Wofür wird Gummi verwendet? Natürlich für alles! Sowohl in der zivilen als auch in der militärischen Industrie ist Kautschuk überall gefragt, vor allem für die Reifen, mit denen neue Autos ausgerüstet werden. Und wie es der Zufall will, gibt es im Kongo, wo der Kautschukbaum wächst, eine Fülle von Kautschuk. Wir müssen ein Programm zum Aufbau neuer Gummibaumkulturen finanzieren."
 BEL_ww1_ApproveLeopoldLegacyCongo:0 "Das koloniale Erbe von Leopold II. verteidigen"
 BEL_ww1_ApproveLeopoldLegacyCongo_desc:0 "Trotz seiner brutalen Unterdrückungsbefehle hat Leopold II. Belgien ein großes Gebiet in Afrika hinterlassen. Ihm ist es zu verdanken, dass wir das gesamte Kongobecken in Besitz nehmen konnten! Wir müssen seiner Bemühungen gedenken."
 BEL_ww1_CongoFreeState:0 "Wiedererrichtung des Freistaates Kongo"
 BEL_ww1_CongoFreeState_desc:0 "Der unabhängige Staat Kongo, der 1885 gegründet worden war, ebnete den Weg für eine zukünftige Wiederherstellung eines freien und souveränen Staates. Wir schlagen vor, dass wir auf diesem Weg weitergehen, und eines Tages wird der Kongo unser wertvollster Verbündeter sein."
 BEL_ww1_ColonialRepression:0 "Koloniale Unterdrückung"
 BEL_ww1_ColonialRepression_desc:0 "Die jüngsten Unruhen in unseren afrikanischen Kolonien drohen sich wie ein Lauffeuer auszubreiten. Wir müssen klare und eindeutige Anweisungen an unsere Kolonialbehörden senden und eine gnadenlose Niederschlagung von Aufständen und Banditentum anordnen!"
 BEL_ww1_InviteEuropeanSettlers:0 "Europäische Siedler einladen"
 BEL_ww1_InviteEuropeanSettlers_desc:0 "Um unseren Einfluss auf das Land zu vergrößern, müssen wir die Belgier dazu ermutigen, dorthin auszuwandern, ins Herz von Afrika. Mehr Siedler bedeuten letztlich mehr Unternehmen, Waren und Macht."
 BEL_ww1_DenyLeopoldLegacyCongo:0 "König Leopolds Erbe in Afrika leugnen"
 BEL_ww1_DenyLeopoldLegacyCongo_desc:0 "König Leopold II. war weise, aber er machte auch schreckliche Fehler und beutete die kolonisierte Bevölkerung auf schreckliche Weise aus. Diese Schrecken dürfen sich nicht wiederholen ... und wir müssen dieses unselige Erbe diskret unter den Teppich kehren."
 BEL_ww1_FreeCongo:0 "Freies Kongo"
 BEL_ww1_FreeCongo_desc:0 "Die Geschichte geht nicht in die Richtung der Unterdrückung. Die Kongolesen verdienen es wie alle anderen, frei und unabhängig zu sein, zumal uns diese Kolonie nicht so viel eingebracht hat. Wir müssen uns mit den lokalen Politikern treffen und eine vollständige Autonomie des Landes vorbereiten."
 BEL_ww1_ClaimingHumanRightsAfrica:0 "Menschenrechte in Afrika einfordern"
 BEL_ww1_ClaimingHumanRightsAfrica_desc:0 "Die Menschenrechte sind eine universelle Wahrheit, egal ob es sich um Weiße, Schwarze oder irgendein anderes Volk auf der Erde handelt! Es war eine verheerende Blindheit, dies bislang zu leugnen. Die Kongolesen sind ein stolzes und freies Volk, das genug gelitten hat."
 #--------------------------------------------------------------
 # [Events]
 ww1_belgium.2.t:0 "Belgien schlägt Allianz vor"
 ww1_belgium.2.d:0 "Heute haben wir die Nachricht erhalten, dass Belgien uns in seine Allianz einladen möchte. Sie schlagen vor, die Benelux-Staaten zu vereinen und eine neue starke Allianz zu gründen. Was sollen wir tun?"
 ww1_belgium.2.a:0 "Das ist ein guter Vorschlag"
 ww1_belgium.2.b:0 "Nein"
 ww1_belgium.3.t:0 "Belgien fordert Unterwerfung"
 ww1_belgium.3.d:0 "Heute hat uns Belgien eine offizielle Forderung nach Unterwerfung übermittelt. Sie sagten auch, dass sie notfalls Gewalt anwenden werden. Was ist unsere Antwort?"
 ww1_belgium.3.a:0 "Wir haben keine Wahl"
 ww1_belgium.3.b:0 "Sie können nur kommen, wenn sie unsere Verteidigung durchbrechen."
 ww1_belgium.4.t:0 "Belgien fordert Eupen"
 ww1_belgium.4.d:0 "Eupen war immer ein belgisches Gebiet. Jetzt fordern sie ihr rechtmäßiges Land. Belgien ist nicht so stark, aber sollten wir für ein kleines Stück Land einen Krieg beginnen?"
 ww1_belgium.4.a:0 "Es ist schließlich ihr historisches Land"
 ww1_belgium.4.b:0 "Nein, es ist deutsches Gebiet"
 ww1_belgium.5.t:0 "Benelux vereinen"
 ww1_belgium.5.d:0 "Wir denken, dass es an der Zeit ist, Benelux zu vereinen. Wir werden die Menschen der Benelux-Region unter unserer Herrschaft vereinen."
 ww1_belgium.5.a:0 "Wir werden die Forderung an unsere Nachbarn weiterleiten"
 ww1_belgium.5.b:0 "Wir kontrollieren bereits Benelux"
