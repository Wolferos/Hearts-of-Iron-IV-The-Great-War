l_german:
###  Übersetzung von Proho
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 RUS_ww1_army_effort: "Reorganisation der kaiserlich-russischen Armee"
 RUS_ww1_army_effort_desc: "Die Armee hat seit den Reformen von Dmitry Milyutin im Jahr 1874 keine größeren Reformen mehr erlebt und ist eindeutig nicht auf einen globalen Konflikt vorbereitet: Viele Ausrüstungsgegenstände sind veraltet, die logistische Infrastruktur ist unzureichend und wir haben nur sehr wenige Lastwagen oder Luftschiffe. Es ist an der Zeit, die kaiserliche Armee neu zu organisieren, denn wenn der Tag erst einmal gekommen ist, wird es zu spät sein."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 RUS_ww1_form_air_force: "Gründung des Kaiserlich Russischen Flugdienstes"
 RUS_ww1_form_air_force_desc: "Die militärische Luftfahrt scheint eine große Zukunft zu haben. Deshalb müssen wir den Kaiserlich-Russischen Flugdienst so schnell wie möglich aus dem Pionierkorps herauslösen und zu einer eigenen Abteilung der Armee machen."
 RUS_ww1_aviation_effort_2: "Sikorskys Flugzeugforschung"
 RUS_ww1_aviation_effort_2_desc: "Die Genialität von Igor Sikorsky auf dem Gebiet der Luftfahrt steht außer Zweifel. Wir müssen diesen begabten Ingenieur unterstützen, damit er russische Flugzeuge entwickeln kann, die in der Lage sind, mit den Leistungen der anderen Großmächte zu konkurrieren, wenn nicht sie sogar zu übertreffen."
 RUS_ww1_aviation_effort_4: "Russko-Baltiisky Vagonny Zavod"
 RUS_ww1_aviation_effort_4_desc: "Die Eisenbahn ist eine hervorragende Antwort auf das erste unserer Probleme, nämlich die extreme Ausdehnung unseres Landes! Dank der Eisenbahn können wir alle Regionen erschließen und Nachrichten, Waren, Reisende und Truppen leichter von einem Punkt der Welt zum anderen transportieren. Einer unserer Minister schlug daher vor, ein Unternehmen in Riga, Lettland, zu gründen, das diese Maschinen in großen Stückzahlen herstellen sollte."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================
 RUS_ww1_extension_of_the_putilov_factory: "Erweiterung der Putilow-Fabrik"
 RUS_ww1_extension_of_the_putilov_factory_desc: "Die Fabrik von Nikolai Putilow wird bald ihr 50-jähriges Bestehen feiern, und sie floriert, produziert Schienen und Lokomotiven in großer Zahl, die von Sankt Petersburg aus bis in die Nöte unseres Landes exportiert werden. Wir sollten ihnen umfangreiche Kredite gewähren, damit sie ihre Aktivitäten weiter ausbauen können, denn im Kriegsfall wird uns dieses industrielle Potenzial sehr nützlich sein. Übrigens könnten diese Werkstätten auch leicht in Waffenfabriken umgewandelt werden!"
 RUS_ww1_airfield_expansion_1: "Das Militärgelände Gatchina als Flugplatz"
 RUS_ww1_airfield_expansion_1_desc: "Flugplätze haben den Luxus, dass sie nur ein Stück Land benötigen, das relativ nah an einem Straßennetz liegt. Die Einrichtung dieser Grundstücke ist eine Arbeit für sich, die sich jedoch auszahlen wird. In der Nähe von Gatschina gibt es viel ehemaliges Ackerland, das sich gut für diesen Zweck eignen würde."
 RUS_ww1_extra_tech_slot_2: "Erweiterung der Akademie der Wissenschaften"
 RUS_ww1_extra_tech_slot_2_desc: "Die Freigabe eines Budgets zur Erweiterung der Forschungsabteilungen der Akademie der Wissenschaften in Petrograd würde uns die Durchführung von mehr experimentellen Projekten ermöglichen."
#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 RUS_ww1_naval_effort: "Verstärkung der Kaiserlich Russischen Marine"
 RUS_ww1_naval_effort_desc: "Seit unserer Niederlage bei Tsushima wird die kaiserlich-russische Marine nicht mehr gefürchtet. Wir müssen die notwendigen Maßnahmen ergreifen, damit diese Vorstellung so schnell wie möglich aus den Köpfen der Menschen verschwindet."
 RUS_ww1_european_seas_focus: "Schwerpunkt Europa"
 RUS_ww1_european_seas_focus_desc: "Russland wird immer aus der Kiewer Rus' hervorgehen. Unsere Hauptinteressen werden immer auf diese Region gerichtet sein, und wir müssen unsere politische und diplomatische Position in dieser Hinsicht stärken."
 RUS_ww1_asian_seas_focus: "Schwerpunkt Asien"
 RUS_ww1_asian_seas_focus_desc: "Négliger l'Extrême-Orient serait une grave erreur. Les prétentions impérialistes du Japon ne sont pas passées inaperçues, de même que la progression des Américains dans le Pacifique. Il faut renforcer nos intérêts dans la région !"
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 RUS_ww1_political_effort: "Politische Bemühungen"
 RUS_ww1_political_effort_desc: "Die Zeit für eine Reformation ist gekommen. Die Nation wurde jahrelang gut nach den alten Prinzipien regiert, aber diese schwierigen Zeiten, in denen wir uns befinden, erfordern eine Regierung, die in der Lage ist, auf sie zu reagieren. Wenn wir in der Lage sein wollen, den Weg zu ändern oder unsere derzeitige Regierung zu unterstützen, um Angriffen von außen standzuhalten, kann ein politischer Wandel unserer Nation und der Zukunft unseres Volkes nur zugutekommen."
 RUS_ww1_reject_reforms: "Ablehnung der Reformen"
 RUS_ww1_reject_reforms_desc: "Die von unseren Gegnern vorgeschlagenen Reformen haben nur ein Ziel, die Schwächung des Reiches und des Zaren. Wir dürfen keine Schwächen zeigen. Das würden sie ausnutzen, um uns zu erstechen."
 RUS_ww1_adopt_reforms: "Annahme der Reformen"
 RUS_ww1_adopt_reforms_desc: "Das Reich wird von allen Seiten angegriffen, vielleicht sollten wir einige von der Opposition vorgeschlagene Reformen akzeptieren. Wenn wir nichts tun, laufen wir Gefahr, dass revolutionäre Bewegungen entstehen."
 RUS_ww1_condemn_marxist_ideas: "Verurteilung marxistischer Ideen"
 RUS_ww1_condemn_marxist_ideas_desc: "Die Ideen von Marx sind mehr als gefährlich und werden unter dem Deckmantel der Gleichheit nur soziale Unordnung verbreiten und eine seit Jahrhunderten bestehende Ordnung in Frage stellen! Und außerdem: Wie kann man einem Deutschen trauen?"
 RUS_ww1_crush_strikes: "Streiks zerschlagen"
 RUS_ww1_crush_strikes_desc: "Die gewalttätigen Streiks, die in letzter Zeit an allen Ecken und Enden des Landes ausgebrochen sind, laufen über. Man muss die Truppe schicken, um diese Aufstände niederzuschlagen!"
 RUS_strengthen_the_constitution: "Stärkung der Verfassung"
 RUS_strengthen_the_constitution_desc: "Die einzige Antwort auf politische Unruhen ist Zuverlässigkeit und Entschlossenheit. Mehrere unserer prominenten Politiker haben sich kürzlich für eine Überarbeitung der kaiserlichen Verfassung ausgesprochen, um sie zu stärken und damit die Macht wieder zu festigen."
 RUS_ww1_arrest_opposition_leaders: "Oppositionsführer verhaften"
 RUS_ww1_arrest_opposition_leaders_desc: "Uns wurden Beweise dafür vorgelegt, dass einige Politiker in die jüngsten zivilen Unruhen verwickelt sind. Sie werden ausreichen, um sie vor einem Gericht wegen Hochverrats zu verurteilen!"
 RUS_ww1_dissolve_imperial_duma: "Auflösung der Reichsduma"
 RUS_ww1_dissolve_imperial_duma_desc: "Die Duma war eine lästige Versammlung, die nur dazu diente, den schärfsten Reformern des Landes einen Kauknochen zu geben. Aber das hat die Liberalen nicht beruhigt, und sie verstrickt sich wieder einmal in lange und unfruchtbare Debatten. Wir sollten ein Dekret erlassen, um ihre dritte Auflösung anzuordnen."
 RUS_ww1_reinforce_tsar_authority: "Die Autorität des Zaren stärken"
 RUS_ww1_reinforce_tsar_authority_desc: "Die legitime Autorität des Zaren wird ständig in Frage gestellt, wir müssen energische Maßnahmen ergreifen, um dem ein Ende zu setzen, auch wenn wir uns damit Feinde machen."
 RUS_ww1_purge_imperial_guard: "Säuberung der Kaiserlichen Garde"
 RUS_ww1_purge_imperial_guard_desc: "Insiderinformationen berichten uns von einem wachsenden Anteil an abtrünnigen Offizieren und störenden Elementen in den Wachbataillonen. Wir können eine solche Abspaltung innerhalb der Truppen, die den imperialen Thron schützen sollen, nicht tolerieren!"
 RUS_ww1_discuss_tsar_authority: "Erörtern der Autorität des Zaren"
 RUS_ww1_discuss_tsar_authority_desc: "Der Zar hat vielleicht zu viel Macht. Vielleicht sollten wir uns von den Briten inspirieren lassen und die Macht der Parlamentarier stärken, bevor es zu spät ist und das Reich in sich zusammenfällt."
 RUS_ww1_parliamentary_immunity: "Parlamentarische Immunität"
 RUS_ww1_parliamentary_immunity_desc: "Wenn wir Russland grundlegend reformieren, zu einem modernen Staat machen und vor allem auf dem Weg zur Demokratie vorankommen wollen, dann müssen wir aufhören, Angst vor Reformern zu haben, und die mundtotmachende Macht der Zaren und der etablierten Behörden einschränken. Es muss eine parlamentarische Immunität gesetzlich verankert werden, damit jeder gewählte Abgeordnete sicher sein kann, dass er keine Repressalien zu befürchten hat, wenn er ein Projekt vorschlägt."
 RUS_ww1_fifth_duma: "Etablierung der Fünften Duma"
 RUS_ww1_fifth_duma_desc: "Seit der letzten Auflösung ist ein wenig Wasser den Fluss hinuntergeflossen. Die Wahlen haben stattgefunden und die politische Landschaft wurde neu zusammengesetzt; es scheint ein guter Zeitpunkt zu sein, um die Parlamentarier zurückzuholen und eine fünfte Duma zu bilden. Hoffentlich muss diese nicht wie die vorherigen aufgelöst werden..."
 RUS_ww1_legitimate_power: "Legitimierte Macht in der Führung"
 RUS_ww1_legitimate_power_desc: "Offenbar ist es in den Augen des Volkes nicht mehr ausreichend, die weltliche Macht von Gott zu erhalten. Wir müssen an unserer Kommunikation arbeiten, um neue Wege zu finden, die kaiserliche Macht zu legitimieren."
 RUS_ww1_adopt_marxist_ideas: "Marxistische Ideen übernehmen"
 RUS_ww1_adopt_marxist_ideas_desc: "Die Arbeiten von Marx und Engels haben gezeigt, wie die zunehmende Industrialisierung der Industrieländer, die das ganze letzte Jahrhundert über geherrscht hat, in Wirklichkeit nur einer privilegierten bürgerlichen Klasse zugute kam und im Gegenzug die Arbeiter und Bauern erheblich verarmt hat, ohne dass die adligen Klassen in irgendeiner Weise davon profitiert hätten. Dieses kapitalistische System muss wie ein tollwütiger Hund mundtot gemacht werden! Wir müssen in unser politisches Programm Elemente aufnehmen, die die Ideen von Marx aufgreifen."
 RUS_ww1_legitimate_bolsheviks: "Konsolidierung der Macht der Bolschewiki"
 RUS_ww1_legitimate_bolsheviks_desc: "Der Sturz der provisorischen Regierung war ein erster Schritt, aber diese gewaltsam erlangte Macht muss gefestigt werden, um nicht erneut gestürzt zu werden. Es müssen eine Reihe von Dekreten und Reformen veröffentlicht werden, um die Forderungen des Volkes zu erfüllen, und es muss so schnell wie möglich eine Regierung sowie eine Kommission gebildet werden, die die neue sozialistische Republik gründen soll."
 RUS_ww1_disarm_the_cossacks: "Entwaffnung der Kosaken"
 RUS_ww1_disarm_the_cossacks_desc: "Die Kosaken sind zu mächtig. Wir können sie nicht mehr machen lassen, was sie wollen, wir müssen sie entwaffnen, bevor sie zum x-ten Mal einen Staatsstreich durchführen."
 RUS_ww1_right_of_the_people: "Erklärung der Rechte der Völker"
 RUS_ww1_right_of_the_people_desc: ""
 RUS_export_the_revolution: "Die Revolution exportieren"
 RUS_export_the_revolution_desc: "Das ist der Leitspruch der Kommunisten, ein Motto, das den Geist der Einheit und Solidarität, der klassenbewusste Menschen bewegt, auf den Punkt bringt: Proletarier aller Länder, vereinigt euch! Also werden wir dieses Prinzip wörtlich nehmen und damit beginnen, die Revolution zu exportieren, indem wir unsere besten Redner und politischen Agitatoren ins Ausland schicken. Die soziale Revolution wird global sein oder sie wird nicht sein!"
 RUS_ww1_sovereignist_ethos: "Souveränistisches Ethos"
 RUS_ww1_sovereignist_ethos_desc: "Gibt es etwas Wichtigeres als die Souveränität unserer Nation? Wir sind kein Dominion, keine Kolonie und kein unbedeutender Akteur, sondern ein großes, eigenständiges Land. Es ist an der Zeit, dies auf der diplomatischen Bühne erneut zu bekräftigen."
 RUS_ww1_support_kaiser: "Stärkung der kaiserlichen Autorität"
 RUS_ww1_support_kaiser_desc: "Kaiser Wilhelm II. ist ein Mann mit gesundem Menschenverstand, der einen starken und verantwortungsbewussten deutschen Staat aufgebaut hat. Wer weiß, was passieren wird, wenn er von der Macht verdrängt wird? Wir müssen dem deutschen Herrscher unsere Unterstützung zukommen lassen."
 RUS_ww1_contest_kaiser: "Kaiserliche Autorität anfechten"
 RUS_ww1_contest_kaiser_desc: "Kaiser Wilhelm II. ist alt, ja sogar senil! Seine Entscheidungen werden immer erratischer, und er hat eine ganze Clique von Operettengenerälen mit sich gezogen, die nach Macht und Eroberung gieren. Sie werden nicht aufhören, Kriege führen zu wollen. Es muss eine Reihe von innenpolitischen Maßnahmen eingeleitet werden, um seine Autorität zu untergraben."
 RUS_ww1_internationalism_focus: "Schwerpunkt Internationalismus"
 RUS_ww1_internationalism_focus_desc: "Die Kommunistische Revolution kann nicht aufgehalten werden. Es ist gut, dass unser Volk sie umarmt, und zwar sofort und nicht durch einen Bürgerkrieg. Wenn wir anfangen, unsere Unterstützung für die internationalistische kommunistische Bewegung zu zeigen, werden wir rot wie Menschenblut sein!"
 RUS_ww1_militarism: "Militarismus"
 RUS_ww1_militarism_desc: "Unsere Armee wird immer mehr zu einem Teil des täglichen Lebens unserer Nation. Glücklicherweise begünstigt die Unterstützung der Bevölkerung unsere Truppen derzeit, da sie sie als die Helden sehen, die sie sind, die unter unserem Banner kämpfen. Diese Militärkultur, die wir etablieren werden, wird der Sache unserer Streitkräfte dienen."
 RUS_ww1_indoctrination_focus: "Indoktrination"
 RUS_ww1_indoctrination_focus_desc: "Nach jahrelangen Debatten darüber, wie wir die Unterstützung der Bürger für unser wunderbares neues Regime gewinnen können, haben einige Mitglieder des Arbeiterrats die Einrichtung eines neuen „Ministeriums der Liebe“ vorgeschlagen, das die Menschen offiziell davon überzeugen soll, unsere Regierung zu unterstützen. Wir werden hier nicht darüber sprechen, was in diesem Ministerium inoffiziell geschehen wird..."
 RUS_ww1_political_commissars: "Politische Kommissare"
 RUS_ww1_political_commissars_desc: "Das Militär ist paradoxerweise ein Ort, an dem anti-nationale Stimmungen gedeihen. Wenn wir dafür sorgen, dass unsere Regierung ihre Augen überall hat, können wir diese Agitprop-Gruppen aufspüren und sie am Wachsen hindern."
 RUS_ww1_paramilitarism: "Paramilitarismus"
 RUS_ww1_paramilitarism_desc: "Einige Länder sind so dumm, bewaffnete Milizen aus Angst vor Rebellionen zu verurteilen. Wenn wir jedoch vorsichtig genug sind, diese auf Regimetreue zu beschränken, können wir eine weitere Gruppe wütender und bewaffneter Männer schaffen, die unsere Nation unterstützen können. Dies wird uns im Falle eines Krieges von Nutzen sein."
 RUS_ww1_political_correctness: "Politische Korrektheit"
 RUS_ww1_political_correctness_desc: "Bestimmen wir Intellektuelle, die der Macht nahe stehen, um die Nachrichtenagenturen genau zu überwachen ... und sicherzustellen, dass jeder Text nicht subversiv ist."
 RUS_ww1_military_youth: "Militärische Jugend"
 RUS_ww1_military_youth_desc: "Unsere militaristische Kultur muss auch bei unseren Kindern präsent sein! Indem wir den Respekt vor dem Militär erzwingen und der jungen Generation eine Ausbildung bieten, können wir sicher sein, dass sie heranwachsen und sich einschreiben, um unserem glorreichen Regime zu dienen. Manche mögen dies als Ausbeutung bezeichnen ... aber es klingt besser, wenn man sagt, dass wir den Heranwachsenden eine glänzende Zukunft ermöglichen."
 RUS_ww1_student_movement_focus: "Studentenbewegung"
 RUS_ww1_student_movement_focus_desc: "Die Universitäten und Studentenligen sind voll von jungen, blutrünstigen Menschen, die darauf aus sind, sich zu prügeln oder neue politische Ideen zu verbreiten. Es wird nicht schwer sein, Agenten in den richtigen Netzwerken zu platzieren, um all diese Energie in die richtige Richtung zu lenken!"
 RUS_ww1_monarchy: "Schwerpunkt Autoritarismus"
 RUS_ww1_monarchy_desc: "Die Macht, die vom Parlament und vom Volk ausgeübt wird, kann gefährlich sein. Der einzige wirkliche Weg, die Kontrolle über die Nation zu behalten, insbesondere in solch schwierigen Zeiten, wäre, eine allgemein feste Position einzunehmen und unser Land so zu führen, wie es sein sollte."
 RUS_ww1_democracy: "Schwerpunkt Demokratie"
 RUS_ww1_democracy_desc: "Es wird gesagt, dass jeder Herrscher seine Macht vom Volk ableitet. Wenn wir einen Schritt in Richtung einer demokratischeren Gesellschaft machen, auch wenn wir es nicht wirklich werden, können wir zumindest eine bessere Position erreichen, um mit demokratischen Nationen auf der ganzen Welt verhandeln zu können."
 RUS_ww1_centralizedpower: "Bürokratie"
 RUS_ww1_centralizedpower_desc: "Indem wir die Zahl der Staatsbeamten verdoppeln, stärken wir unsere Kontroll- und Regulierungsmöglichkeiten über unsere gesamte Regierung und stellen sicher, dass uns nichts entgeht. Die Anstrengungen der Nation werden viel besser genutzt. Außerdem wird es die nationale Papierindustrie in Schwung bringen..."
 RUS_ww1_freespeech: "Freie Rede"
 RUS_ww1_freespeech_desc: "Die Zeiten ändern sich und wir müssen zeigen, dass wir keine Angst vor Widerspruch haben. Wir müssen das Dekret unterzeichnen, das das Erscheinen von Gazetten erlaubt, die nicht systematisch vom kaiserlichen Zensurausschuss genehmigt werden."
 RUS_ww1_reorganization_act: "Umstrukturierungsgesetz"
 RUS_ww1_reorganization_act_desc: "Der militärisch-industrielle Apparat leidet unter seiner Überalterung und der Zersplitterung seiner Anstrengungen. Unser Wirtschaftsminister hat einen ehrgeizigen Plan zur Reorganisation unserer Produktionskapazitäten vorgeschlagen."
 RUS_ww1_leave_central_power: "Mittelmächte verlassen"
 RUS_ww1_leave_central_power_desc: "Was hat uns dazu bewogen, dieser Tripel-Allianz beizutreten? Es ist offensichtlich, dass sie überhaupt nicht in unserem Sinne ist und sogar unsere Interessen an unserer Westgrenze bedroht. Es waren die Franzosen und die Engländer, mit denen wir uns hätten verbünden sollen. Verlassen wir den Deutsch-Österreichischen Bund sofort."
 RUS_ww1_limited_rearmament: "Begrenzte Wiederaufrüstung"
 RUS_ww1_limited_rearmament_desc: "Unsere Armee angemessen mit militärischen Gütern zu versorgen, erfordert große Investitionen und Requisitionen. Natürlich können sich Zivilisten bei einer begrenzten Rationierung immer noch amüsieren - wahrscheinlich auf Kosten des Militärs."
 RUS_ww1_full_rearmament: "Volle Wiederbewaffnung"
 RUS_ww1_full_rearmament_desc: "Wer kann in die Zukunft blicken und sagen, dass die Kriege aufhören werden? Wir müssen dafür sorgen, dass unsere Streitkräfte den vor ihnen liegenden Aufgaben gewachsen bleiben."
 RUS_ww1_unitedpeople: "Das Reich vereinigen"
 RUS_ww1_unitedpeople_desc: "Von den Ufern der Ostsee bis zu den Stränden des Pazifiks vereint das Russische Reich Dutzende von Völkern mit unterschiedlichen Ursprüngen und Bestrebungen. Wir müssen dieses riesige Gebiet besser vereinen, indem wir seine Bevölkerung unter einem einzigen Banner vereinen."
 RUS_ww1_massive_effort: "Massive Anstrengung"
 RUS_ww1_massive_effort_desc: "Jeder Mann und jede Frau muss den nationalen Bemühungen helfen! Da das Gespenst des Großen Krieges jeden Tag ein wenig näher rückte, wurde ein großes Wirtschaftsprogramm in Angriff genommen, um unsere industrielle Kapazität zu entwickeln und uns zu helfen, unsere verhassten Rivalen zu überwinden!"
 RUS_ww1_fortify_city: "Zivile Befestigungen"
 RUS_ww1_fortify_city_desc: "Der Wind des Krieges kann sich unangenehm schnell drehen, und die Front entwickelt sich noch schneller. Es wäre hilfreich, Gruppen von arbeitslosen Bürgern zu mobilisieren, damit sie an bestimmten Stellen Verteidigungsanlagen errichten, und das würde den Pioniertruppen Zeit sparen."
 RUS_ww1_fortify_coast: "Küstenverteidigung"
 RUS_ww1_fortify_coast_desc: "Eine Küste ist nicht leicht zu verteidigen. Da es Schiffe gibt, die praktisch überall an unseren Küsten Truppen anlanden können, sind Küstenforts nicht zu unterschätzen, wenn es darum geht, unsere Feinde ins Meer zurückzuwerfen."
 RUS_ww1_install_communism: "Proletarische Revolution"
 RUS_ww1_install_communism_desc: "Die Arbeiter sind der Motor des sozialen und industriellen Wandels! Die Zeit ist gekommen, dass die Ausgebeuteten, die Unterdrückten, die Ausgestoßenen, diejenigen, die nur die Kraft ihrer Hände und Arme für sich haben, dass diese ihre Zukunft selbst in die Hand nehmen! Wir müssen die proletarische Revolution in unserem eigenen Land organisieren, und zwar in großem Maßstab!"
 RUS_ww1_install_democracy: "Freie Wahlen"
 RUS_ww1_install_democracy_desc: "Die Macht geht immer vom Volk aus. Die Abhaltung freier Wahlen wird zumindest die Illusion einer direkten Demokratie und einer guten Repräsentativität der Bürger schaffen und unserer Regierung die Legitimität verleihen, die ihr bisher fehlte."
 RUS_ww1_oppression_minorities: "Minderheiten unterdrücken"
 RUS_ww1_oppression_minorities_desc: "Es ist eine altbekannte Technik, die immer wieder funktioniert... Einen Sündenbock zu benennen, lenkt die Aufmerksamkeit von den wütenden Elementen ab. Man muss nur eine gute, virulente Pressekampagne finanzieren..."
 RUS_ww1_make_concessions: "Zugeständnisse machen"
 RUS_ww1_make_concessions_desc: "Ein Nachgeben gegenüber bestimmten Forderungen wäre keine große politische oder finanzielle Anstrengung ... und würde stattdessen ein positiveres Bild der Regierung vermitteln."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 RUS_ww1_diplomatic_effort: "Diplomatische Bemühungen"
 RUS_ww1_diplomatic_effort_desc: "Wir müssen unser diplomatisches Korps finanziell und personell besser ausstatten, um in unseren Außenbeziehungen effektiv zu sein."
 RUS_ww1_assert_position_east: "Position im Osten behaupten"
 RUS_ww1_assert_position_east_desc: "Allzu oft neigen wir dazu, die sibirischen Gebiete für einen fernen Osten zu halten, der vom russischen Reich losgelöst ist, in dem keine Gesetze gelten und unsere Absichten unklar sind. Es ist an der Zeit, dass sich dies ändert und wir unsere Politik an den Ufern des Pazifiks neu definieren."
 RUS_ww1_BalkansPolitics: "Balkan Politik"
 RUS_ww1_BalkansPolitics_desc: "Der Balkan ist eine Region, die nun schon seit Jahrzehnten unsere Aufmerksamkeit auf sich zieht, da wir dort eine große Anzahl slawischer Völker finden, die unsere Interessen und unsere Kultur teilen, und es ist auch eine hochgradig strategische Region, von der aus jeder Konflikt ausbrechen kann, ganz zu schweigen von der Präsenz der Türken, die uns den Zugang zum Mittelmeer verwehren. Wir sollten unsere Außenpolitik darauf ausrichten, unsere Bemühungen in diesem Gebiet fortzusetzen."
 RUS_ww1_ApeasementBalkans: "Beschwichtigungspolitik auf dem Balkan"
 RUS_ww1_ApeasementBalkans_desc: "Auf dem Balkan sind schon viele Kriege ausgebrochen, und nur sehr wenig Nutzen ist daraus gezogen worden. Wenn Kanonen ein Ziel nicht erreichen, ist die Wahrscheinlichkeit groß, dass ein gutes diplomatisches Bankett mehr Erfolg verspricht - und das für viel weniger Geld. Es ist an der Zeit, dass wir uns versöhnlich zeigen."
 RUS_ww1_rom: "Annäherung an Rumänien"
 RUS_ww1_rom_desc: "Die Rumänen haben sich in den letzten Jahren weitgehend bewährt und friedliche Absichten gegenüber uns gezeigt. Wir sollten ihnen eine Delegation schicken und eine Freundschaftserklärung unterzeichnen."
 RUS_ww1_oirganization_realm: "Das Reich organisieren"
 RUS_ww1_oirganization_realm_desc: "Unser Reich ist konservativ, aber wir können das imperiale Regime beibehalten und trotzdem effizient sein. Wenn wir die richtigen Schritte unternehmen, um unsere interne Organisation zu vereinfachen, wird unser ziviles und wirtschaftliches Leben davon profitieren."
 RUS_ww1_fortify_russian_borders: "Russische Grenzen befestigen"
 RUS_ww1_fortify_russian_borders_desc: "Es ist undenkbar, die gesamten Grenzen Russlands zu befestigen, wenn man die absurde Anzahl an Kilometern bedenkt, die es abzudecken gilt. Aber dennoch können wir bereits mit dem Bau einer Handvoll Festungen beginnen, die an den richtigen Stellen platziert werden, um große Teile des Landes zu überwachen."
 RUS_ww1_airport_russian_borders: "Bau von Flughäfen in der Nähe der russischen Grenzen"
 RUS_ww1_airport_russian_borders_desc: "Es muss in den Bau von Flugplätzen in der Nähe unserer Grenzen investiert werden. Dies wird nicht nur für den zivilen Verkehr nützlich sein, sondern im Kriegsfall werden unsere Staffeln bereits fertige Flugplätze haben."
 RUS_ww1_fortify_italian_borders: "Italienische Grenzen befestigen"
 RUS_ww1_fortify_italian_borders_desc: "Die Grenzen des Königreichs Italien müssen verstärkt werden, denn derzeit ist es ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_fortify_bosnia_borders: "Balkan-Grenzen verstärken"
 RUS_ww1_fortify_bosnia_borders_desc: "Die Grenzen des Balkans müssen verstärkt werden, denn derzeit ist er ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_fortify_coast_dalmatia: "Dalmatinische Küsten befestigen"
 RUS_ww1_fortify_coast_dalmatia_desc: "Die Küsten Dalmatiens müssen verstärkt werden, denn derzeit ist es ein echtes Sieb! Wir müssen ein Ingenieurkorps dorthin schicken, das die Arbeiten beaufsichtigt, die zum Bau von Kasematten und Forts führen."
 RUS_ww1_ready_country: "Rekrutierungs-Propaganda"
 RUS_ww1_ready_country_desc: "Der Armee fehlt es an Gewehren, Lastwagen und Uniformen, vor allem aber an Rekruten. Der Militärdienst ist für junge Russen nicht mehr interessant, daher müssen wir einen Aufruf an Freiwillige starten und Propagandabilder veröffentlichen, die sie dazu auffordern, ihre Pflicht für das Vaterland zu tun."
 RUS_ww1_military_harmonization: "Harmonisierung des Militärs"
 RUS_ww1_military_harmonization_desc: "Einer der Gründe für die chronische Ineffizienz unserer Streitkräfte sind die zu großen Unterschiede in den Mitteln und Zielen der verschiedenen Armeen. Wenn wir das ändern wollen, müssen wir unsere militärischen Ziele neu und klar definieren und dafür sorgen, dass die Flotte, die Armee und auch die Flieger ihre Anstrengungen in diese Richtung lenken. Und schließlich müssen wir erhebliche Mittel investieren, um ihre Entwicklung zu unterstützen."
 RUS_ww1_balkans_policy: "Balkan Politik"
 RUS_ww1_balkans_policy_desc: "Der Balkan ist eine Region, die nun schon seit Jahrzehnten unsere Aufmerksamkeit auf sich zieht, da wir dort eine große Anzahl slawischer Völker finden, die unsere Interessen und unsere Kultur teilen, und es ist auch eine hochgradig strategische Region, von der aus jeder Konflikt ausbrechen kann, ganz zu schweigen von der Präsenz der Türken, die uns den Zugang zum Mittelmeer verwehren. Wir sollten unsere Außenpolitik darauf ausrichten, unsere Bemühungen in diesem Gebiet fortzusetzen."
 RUS_ww1_balkans_policy_intervene: "Erster Balkankrieg - Reaktion"
 RUS_ww1_balkans_policy_intervene_desc: "Der Balkan geht wieder in Flammen auf, und die Serben geraten mit den Griechen und Bulgaren aneinander! Wir unterstützen ihre Forderungen, und es ist an der Zeit, dies offen zu bekräftigen, vor allem gegenüber den Osmanen, die bereits ihre Waffen strecken, um die Situation auszunutzen."
 RUS_ww1_pro_fra: "Die Russisch-Französische Allianz feiern"
 RUS_ww1_pro_fra_desc: "Die seit langem bestehenden Bande der Freundschaft zwischen Russland und Frankreich sind stark, und unsere wirtschaftlichen und militärischen Interessen treffen aufeinander. Lassen Sie uns dieses Bündnis feiern, um den Österreichern und den Deutschen zu zeigen, dass wir im Falle eines Krieges als ein Mann gegen sie kämpfen werden."
 RUS_ww1_friend_with_auh: "Zweite Russisch-Österreichische Vereinbarung"
 RUS_ww1_friend_with_auh_desc: "Es hat Zeit und Geld gekostet, aber wir haben endlich eine neue Vereinbarung ausgearbeitet, die die Differenzen zwischen uns und den Österreichern für eine Weile aus der Welt schaffen wird. Wenn wir es jetzt unterzeichnen, sollte es die Wogen zwischen uns für eine Weile glätten."
 RUS_ww1_support_serbia_weapons: "Serbien unterstützen"
 RUS_ww1_support_serbia_weapons_desc: "Die Serben kämpfen eifrig, aber es fehlt ihnen an Waffen und Munition. Wir müssen ihnen einige Ladungen davon schicken, sonst werden sie in einigen Monaten der Zermürbung zum Opfer fallen."
 RUS_ww1_RussoTurkishBorder: "Stärkung der Russisch-Türkischen Grenze"
 RUS_ww1_RussoTurkishBorder_desc: "Wir haben die letzten Konflikte mit den Türken nicht vergessen, und trotz der vergangenen Jahre wurde nichts geregelt. Denken Sie daran, dass ihre Grenzen in beide Richtungen durchlässig sind und dass die Grenze zu den Türken durch die Stationierung von mehr Armeeeinheiten verstärkt werden muss. "
 RUS_ww1_AzerbaijanisRights: "Aserbaidschanisches Volk anerkennen"
 RUS_ww1_AzerbaijanisRights_desc: "Wir haben bereits versucht, Aserbaidschan einzunehmen, jedoch ohne Erfolg. Seitdem hat sich das Land jedoch entwickelt und verwestlicht; wir sollten ihre Unabhängigkeit und Freiheit anerkennen, um sie zu einem Verbündeten an unserer Südgrenze zu machen."
 RUS_ww1_CaucasusFocus: "Schwerpunkt Kaukasus"
 RUS_ww1_CaucasusFocus_desc: "Die jüngsten Prospektionskampagnen im Kaukasus zeigen, dass die Region im Laufe der Zeit immer interessanter werden wird, da sie nicht nur reich an fruchtbarem Ackerland, sondern auch an Ölquellen ist. Die Region sollte für unsere Investitionen und zivile Arbeit Priorität haben."
 RUS_ww1_BakuInvest: "Investieren in Baku"
 RUS_ww1_BakuInvest_desc: "Baku ist voller Öl, wir müssen die Region schnell entwickeln, denn unser Bedarf an dem schwarzen Gold wächst."
 RUS_ww1_restore_russia_glory: "Russlands früheren Ruhm wiederherstellen"
 RUS_ww1_restore_russia_glory_desc: "Es gab eine Zeit, in der die Legionen des Zaren auf beiden Seiten Eurasiens gefürchtet wurden, eine Zeit, in der Russland ein Titan war, den man nicht ignorieren konnte! Es ist an der Zeit, eine Politik der vollen Macht zu verfolgen und unsere Nation fürchten zu lassen. Wir werden den Thron von Sankt Petersburg mit Ruhm bedecken!"
 RUS_ww1_avenge_fall_constantinople: "1453 rächen"
 RUS_ww1_avenge_fall_constantinople_desc: "Der Fall von Konstantinopel war die Einnahme der Hauptstadt des Byzantinischen Reiches durch eine Invasionsarmee des Osmanischen Reiches am 29. Mai 1453. Die Osmanen standen unter dem Kommando von Mehmed dem Eroberer, dem siebten Sultan des Osmanischen Reiches, der ein Heer unter dem Kommando des byzantinischen Kaisers Konstantin XI Palaiologos besiegte."
 RUS_wilhlems_deal: "Abkommen mit Wilhlem II."
 RUS_wilhlems_deal_desc: "Die Deutschen sind uns definitiv feindlich gesinnt, aber der Kaiser ist trotzdem nicht verrückt. Es wird nichts kosten, sich die Vorschläge der deutschen Bevollmächtigten anzuhören."
 RUS_ww1_invest_west: "Im Westen investieren"
 RUS_ww1_invest_west_desc: "Die Menschen im Westen lassen sich leichter umwerben, wenn wir einige Murmeln bei ihnen anlegen. Wenn wir Kapital in ihre Fabriken investieren, ist das eine gute Geldanlage, und wir machen ihnen ein diplomatisches Geschenk."
 RUS_around_manchuria: "Investieren in der Äußeren Mandschurei"
 RUS_around_manchuria_desc: "Unsere Infrastruktur an der Grenze zu Korea muss verstärkt werden. Wenn die Japaner wieder einen Krieg wollen, müssen wir bereit sein."
 RUS_ww1_friend_with_romania: "Beziehungen zu Rumänien verbessern"
 RUS_ww1_friend_with_romania_desc: "Es ist an der Zeit, den Rumänen näher zu kommen. Wenn wir ihre Ambitionen in Siebenbürgen nicht in Frage stellen, könnten wir sie dazu bringen, ihre Positionen zu überdenken."
 RUS_ww1_EmbargoUK: "Sanktionen - Vereinigtes Königreich"
 RUS_ww1_EmbargoUK_desc: "Diese Briten sind wirklich ärgerlich, und ihre systematische Einmischung in die Weltangelegenheiten ist nicht mehr tolerierbar. Wir haben hier eine Gelegenheit, ihnen auf der diplomatischen Bühne die Nase zu putzen."
 RUS_ww1_JoinCentralPowers: "Messer im Rücken"
 RUS_ww1_JoinCentralPowers_desc: "Dies wird wahrscheinlich als der größte geopolitische Verrat dieses Jahrhunderts angesehen werden, aber man muss auch pragmatisch sein. Die Mittelmächte sind die einzigen Mächte, die kurz- und mittelfristig für uns von Interesse sind."
 RUS_ww1_reinforce_western_forts: "Verstärkung der Westgrenze"
 RUS_ww1_reinforce_western_forts_desc: "Die größte Bedrohung geht vom Westen aus. An dieser Grenze des Reiches müssen wir die meisten Divisionen konzentrieren."
 RUS_ww1_defy_germany: "Deutschland trotzen"
 RUS_ww1_defy_germany_desc: "Deutschland ist eine junge Nation, ein diplomatischer unbeschriebenes Blatt, das ihren mächtigsten Nachbarn nicht unterschätzen sollte! Es ist an der Zeit, sie mit ihren Ambitionen herauszufordern: Entweder sie knicken vor uns ein oder sie nehmen sie an - und wir werden Krieg gegen sie führen!"
 RUS_annex_northern_persia: "Nordpersien besetzen"
 RUS_annex_northern_persia_desc: ""
 RUS_ww1_Attack_Afghanistan: "Invasion in Afghanistan vorbereiten"
 RUS_ww1_Attack_Afghanistan_desc: "Eurasien ist der weiche Unterleib des Imperiums. Wir müssen uns sofort auf eine Invasion dieses kleinen Landes vorbereiten, um unsere Interessen dort zu schützen ... und eine Invasion unseres Staatsgebiets zu verhindern."
 RUS_russify_finland: "Finnland russifizieren"
 RUS_russify_finland_desc: "Wenn wir wollen, dass die Finnen unsere Autorität nicht mehr in Frage stellen, müssen wir sie an die russische Kultur assimilieren. Kurzfristig könnte dies zu Spannungen führen, aber langfristig könnte Finnland eine russische Region wie jede andere werden."
 RUS_ww1_leave_entente: "Entente verlassen"
 RUS_ww1_leave_entente_desc: "Die Franko-Briten sind in Wahrheit nicht zuverlässiger als die Österreich-Deutschen, und es gibt keine Garantie dafür, dass sie sich um unsere Interessen kümmern werden. Wir sollten die Entente verlassen; wenn es ihnen so wichtig ist, sich mit ihren unmittelbaren Nachbarn zu zerfleischen, dann sei es ihnen gegönnt."
 RUS_guarantee_serbia: "Serbien garantieren"
 RUS_guarantee_serbia_desc: "Die Serben müssen vor dem Appetit der Italiener, Österreicher oder sonst wem geschützt werden. Dieses Land kann uns nicht entgleiten, also müssen wir ihre Unabhängigkeit garantieren. Daher sollte jeder, der versucht, dieses kleine Land zu erobern, auf der Hut sein."
 RUS_ww1_add_fuel_to_the_fire: "Das Pulverfass zünden"
 RUS_ww1_add_fuel_to_the_fire_desc: ""
 RUS_ww1_support_serbia: "Orthodoxe Bruderschaft"
 RUS_ww1_support_serbia_desc: "Wenn wir eine Gemeinsamkeit mit den Serben haben, dann ist es die Religion! Unsere orthodoxen Brüder müssen unter unsere Schirmherrschaft gestellt werden. Schlagen wir ihnen vor, sich uns in einer Bruderschaft anzuschließen."
 RUS_fight_sweden_gotland: "Gotland beanspruchen"
 RUS_fight_sweden_gotland_desc: "Die Insel Götland ist nur ein Kieselstein inmitten der Gischt, aber ein Kieselstein, auf dem man Flugzeuge landen und Kanonen aufstellen könnte! Oder sogar einen Marinestützpunkt, der für jede anständige Kriegsflotte mehr als nützlich ist. Wir sollten einen offiziellen Anspruch auf diese Position erheben, damit sie uns nicht eines Tages direkt bedroht."
 RUS_european_focus: "Schwerpunkt Westen"
 RUS_european_focus_desc: "Unser Land ist das größte der Welt, aber in Europa liegen die meisten unserer Interessen und unsere wichtigsten Verbündeten. Dieser Region muss Priorität eingeräumt werden"
 RUS_ww1_scandinavia_focus: "Skandinavische Politik"
 RUS_ww1_scandinavia_focus_desc: "Die geografische Nähe zu Skandinavien macht diese Region für uns zu einer zentralen Herausforderung, ebenso wie die strategische und wirtschaftliche Konkurrenz, die dort um die Kontrolle über Eisen, Öl und Holz herrscht. Wir müssen uns diesen Ländern annähern, während wir gleichzeitig wichtige Abschreckungsmittel in dieser Region aufrechterhalten."
 RUS_asian_focus: "Russische Position in Asien stärken"
 RUS_asian_focus_desc: "Es wäre an der Zeit, die Asiaten und den Westen, der sich dafür interessiert, daran zu erinnern, dass Russland auch weiterhin eine Macht ist, die im Fernen Osten präsent ist. Diplomatisch und militärisch müssen wir unser Interesse an der Region verstärken und einige Machtdemonstrationen durchführen."
 RUS_ww1_Tungsten_Nerchinsk: "Suche nach Wolfram-Erz in der Nähe von Nerchinsk"
 RUS_ww1_Tungsten_Nerchinsk_desc: "Ein Memorandum des Irkutsker Instituts für Ingenieurwesen lässt uns wissen, dass in Transbaikalien, nahe der asiatischen Grenze, große Metallvorkommen entdeckt wurden. Einige Unternehmen könnten ihre Ausbeutung bereits jetzt übernehmen."
 RUS_ww1_Reinforce_Northern_Persia: "In Nordpersien investieren"
 RUS_ww1_Reinforce_Northern_Persia_desc: "Einige unserer führenden Industriellen schlagen vor, dass wir etwas Kapital in die persischen Gebiete im Süden investieren sollten. Es handelt sich um ein notorisch unterentwickeltes und archaisches Land, das jedoch über reiche Ländereien verfügt. Es wäre zweifellos eine gute Investition."
 RUS_ww1_Revoke_Persia_Convention: "Das Abkommen von 1907 widerrufen"
 RUS_ww1_Revoke_Persia_Convention_desc: "Das Englisch-Russische Abkommen von 1907 wurde am 31. August 1907 in Sankt Petersburg unterzeichnet. Die Konvention beendete den langen Streit um Persien. Das Vereinigte Königreich verpflichtete sich, sich aus Nordpersien herauszuhalten, und Russland erkannte Südpersien als Teil der britischen Einflusssphäre an."
 RUS_ww1_Support_Persia_Convention: "Das Abkommen von 1907 unterstützen"
 RUS_ww1_Support_Persia_Convention_desc: "Das Englisch-Russische Abkommen von 1907 wurde am 31. August 1907 in Sankt Petersburg unterzeichnet. Die Konvention beendete den langen Streit um Persien. Das Vereinigte Königreich verpflichtete sich, sich aus Nordpersien herauszuhalten, und Russland erkannte Südpersien als Teil der britischen Einflusssphäre an."
 RUS_ww1_Persian_Cossack_Brigade: "Verstärkung der persischen Kosakenbrigade"
 RUS_ww1_Persian_Cossack_Brigade_desc: "Die Persische Kosakenbrigade war eine Kavallerieeinheit im Kosakenstil, die 1879 in Persien gebildet wurde. Sie war den kaukasischen Kosakenregimentern der Russischen Kaiserlichen Armee nachempfunden und ist heute eine Eliteeinheit. Wir sollten diese Truppe mobilisieren, um sie zu einer Polizeieinheit zu machen."
 RUS_ww1_Russian_Influence_over_Persia: "Grenzüberschreitendes Abkommen mit Teheran"
 RUS_ww1_Russian_Influence_over_Persia_desc: "Wir haben ein Abkommen mit dem Schah von Persien vorbereitet. Es geht um territoriale, wirtschaftliche und finanzielle Fragen und ermöglicht es uns, die von uns gewünschten Personen in Schlüsselpositionen zu platzieren, um unseren Einfluss in ganz Persien geltend zu machen. Wir werden sie leicht manipulieren können."
 RUS_ww1_Puppet_Persia: "Nordpersien besetzen"
 RUS_ww1_Puppet_Persia_desc: "Nordpersien versinkt in Anarchie, und es gibt nur einen guten Grund, das Land zu besetzen. Na ja, nur die nördliche Region ... und was soll's, wenn wir es nicht tun, werden es schließlich die Briten sein, die sich darum kümmern!"
 RUS_ww1_Militarize_NorthenPersia: "Nordpersien militarisieren"
 RUS_ww1_Militarize_NorthenPersia_desc: "Persien wird weiter geschwächt; daher haben sie keine Chance, sich uns entgegenzustellen, wenn wir Militäreinheiten dorthin schicken, um die dort befindlichen russischen Interessen zu schützen."
 RUS_ww1_treaty_portsmouth: "Vertrag von Portsmouth widerrufen"
 RUS_ww1_treaty_portsmouth_desc: "Der Vertrag, den wir 1905 unterzeichnet hatten, war eine echte Demütigung, die wir gegenüber den japanischen Schurken erleiden mussten. Es kam nicht in Frage, weiterhin Kriegsentschädigungen zu zahlen und ihnen die Mandschurei so einfach abzutreten."
 RUS_annex_manchurian_sphere: "Mandschurei besetzen"
 RUS_annex_manchurian_sphere_desc: "Die Mandschurei ist das Pulverfass Asiens und ein Land, bei dem wir es uns nicht leisten können, es nicht mehr zu kontrollieren. Wir müssen Truppen dorthin zurückschicken, und sei es nur, um den Japanern den Weg zu versperren und notfalls schnell in China investieren zu können. Mehrere unserer Divisionen sind bereits abmarschbereit."
 RUS_ww1_friend_with_jap: "Verbündete aus Bequemlichkeit"
 RUS_ww1_friend_with_jap_desc: "Wer hätte gedacht, dass wir uns eines Tages den Japanern annähern würden? Die Zufälle der Geopolitik nehmen manchmal einen sehr seltsamen Weg. Wie auch immer, es ist nun so, dass ihre und unsere Ziele übereinstimmen und wir alle von einer Zusammenarbeit profitieren können. Vielleicht können wir am Ende sogar das Kriegsbeil endgültig begraben."
 RUS_reinforce_vladivostok: "Wladiwostok verstärken"
 RUS_reinforce_vladivostok_desc: "Wenn die Japaner uns erneut angreifen, muss Wladiwostok uneinnehmbar sein. Der Hafen muss mit zwei neuen Festungen verstärkt, Küstenbatterien gebaut und Lagerhäuser ausgehoben werden."
 RUS_mongolian_protectorate: "Mongolisches Protektorat"
 RUS_mongolian_protectorate_desc: "Die Mongolen sind schwach und bereit zu fallen. Wir haben kein besonderes Interesse daran, sie zu annektieren, aber es wäre eine Katastrophe, wenn sie selbst von unseren Rivalen im Süden annektiert würden. Wir könnten das Problem also lösen, indem wir ihnen ein Protektorat anbieten."
 RUS_ww1_Xinhai_Revolution_Opportunity: "Xinhai Revolution Chance"
 RUS_ww1_Xinhai_Revolution_Opportunity_desc: "Die Revolution, die gerade in China begonnen hat, bringt die Macht des Kaisers ins Wanken! Die Aufstände in Wuchang sind bereits blutig. Die Einmischung des Westens hat einer Gesellschaft, die durch Immobilität, Korruption und politische Unruhe bereits bis auf die Grundmauern untergraben war, nur den letzten Anstoß gegeben. Wir müssen uns mit dem Thema beschäftigen und die sich bietenden Gelegenheiten jetzt nutzen, denn unsere Rivalen werden nicht warten."
 RUS_ww1_polish_corps: "Polnisches Korps in Russland"
 RUS_ww1_polish_corps_desc: "Viele Polen leben in Russland, und viele Polen wollen gegen die Deutschen kämpfen, auch wenn sie kein eigenes Land haben! Wir brauchen immer noch Männer: Stellen wir eine rein polnische Legion zusammen, die aus Freiwilligen und Offizieren aus dieser Gemeinschaft besteht. Sie werden mit noch mehr Kraft und Zusammenhalt kämpfen."
 kis_brestlitovsk: "Vertrag von Brest-Litowsk"
 kis_tsarnicholasabdicated: "Zar dankt ab"
