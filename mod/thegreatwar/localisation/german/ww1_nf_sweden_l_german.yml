# Naval Tree
#=========================================================================
 SWE_ww1_naval_effort: "Modernisierung der Schwedischen Marine (Svenska Marinen)"
 SWE_ww1_naval_effort_desc: "Schiffe mit Verbrennungsmotor haben begonnen, ihre Zeitgenossen zu übertrumpfen, und eine neue Ära der Seekriegsführung eingeläutet. Riesige Schiffe mit ebenso großen Kanonen, die auf unglaubliche Entfernungen kämpfen, werden das Gebot der Stunde sein. Aus diesem Grund ist ein Modernisierungsprogramm für unsere Schiffe sowie eine Ausbildung unserer Offiziere in den neuen Methoden der Kriegsführung sicherlich angebracht."
 SWE_ww1_newnavalcanons_1: "Marinegeschütze"
 SWE_ww1_newnavalcanons_1_desc: "Während sich unsere Schiffsdesigns selbst ständig weiterentwickeln, dürfen wir die Waffen an Bord unserer Schiffe nicht vergessen. Obwohl wir seit über einem Jahrhundert die Kaliber standardisiert haben, gibt es immer noch viel zu viele unterschiedliche Geschützgrößen für viel zu viele Aufgaben. Wenn wir die Gesamtzahl der Standards reduzieren und die einzelnen Geschütztypen universeller einsetzen, können wir die Schiffskonstruktion rationalisieren."
 SWE_ww1_newnavalcanons_2: "Marinegeschütze II"
 SWE_ww1_newnavalcanons_2_desc: "Auch wenn wir jetzt die Probleme mit den Geschützen selbst gelöst haben, müssen wir auch bei der Ausrüstung für unsere Marinebatterien auf dem neuesten Stand bleiben. Entfernungsmesser werden allmählich zum Standard auf unseren Schiffen, und wenn unsere Offiziere wissen, wie sie damit umgehen müssen, insbesondere im Vergleich zur maximalen Reichweite unserer Geschütze, wird das Gefecht viel reibungsloser ablaufen und uns helfen, unsere neueren, besseren Geschütze besser zu nutzen."
 SWE_ww1_newnavalcanons_3: "Marinegeschütze III"
 SWE_ww1_newnavalcanons_3_desc: "Die analoge Feuerleitanlage macht in der Schifffahrt von sich reden, weil sie alle Geschütze eines Schiffes auf ein und dasselbe grobe Ziel lenken kann. Obwohl sie noch relativ primitiv ist, sind Schiffs- und Geschützkonstruktionen, die eine solche Funktion nutzen können, bereits sehr gefragt. Diese neuen Entwürfe können uns einen weiteren technologischen Vorsprung auf dem Meer verschaffen."
 SWE_ww1_dreadnought_effort: "Dreadnought Einsatz"
 SWE_ww1_dreadnought_effort_desc: "Seit die Briten zum ersten Mal die Dreadnought-Klasse vorgestellt haben, ist ein Wettrüsten zwischen den großen Seestreitkräften der Welt im Gange, um die größten und besten Kriegsschiffe herzustellen. Wenn unser Land im heutigen Seekrieg bestehen will, müssen wir selbst verbesserte Entwürfe für diese Schiffe herausbringen."
 SWE_ww1_flexible_navy: "Flexible Marine"
 SWE_ww1_flexible_navy_desc: "Eine große Anzahl von Schiffen nützt uns nichts, wenn sie nur auf einem sehr kleinen Teil des Ozeans patrouillieren. Der Aufbau einer Flotte, die überall hinfahren kann, wann immer sie gebraucht wird, mit einer großen Anzahl von Schirmen, die von einer angemessenen Anzahl von Schlachtschiffen und Dreadnoughts unterstützt werden, könnte uns dabei helfen, einen größeren Teil der Meere zu kontrollieren und auf eine größere Vielfalt von Bedrohungen zu reagieren, was uns erlauben würde, unsere Macht über die ganze Welt auszudehnen."
 SWE_ww1_large_navy: "Große Marine"
 SWE_ww1_large_navy_desc: "Nur Schlachtschiffe und Dreadnoughts zu haben, wäre an sich schon beeindruckend, aber einen soliden Kern von Schirmen und Schlachtkreuzern zu haben, kann die See leicht zu unseren Gunsten kippen, sowohl wegen der taktischen Optionen, die uns diese Schiffe geben, als auch wegen ihrer schieren Anzahl. Wenn wir auf diesem Konzept aufbauen und die entsprechende Doktrin studieren, könnte unsere Flotte einfach unschlagbar werden."
 SWE_ww1_navyreform: "Marineeinsatz"
 SWE_ww1_navyreform_desc: "Eine Seeschlacht wird nicht nur durch Kanonen und Schiffe gewonnen. Das beste Schiff der Welt nützt nichts, wenn es nicht zur richtigen Zeit und am richtigen Ort auf See ist. Durch Investitionen in direktere Kommunikationskanäle von Schiff zu Schiff und von Schiff zu Hafen können wir sicherstellen, dass ein Schiff genau zur richtigen Zeit am richtigen Ort ist, was uns bei unseren Bemühungen um die Vorherrschaft auf See hilft." 
 SWE_ww1_cruiser_effort: "Kreuzer Einsatz"
 SWE_ww1_cruiser_effort_desc: "Unsere Admiräle wünschen eine größere Anzahl und Investition in Kreuzer, um uns mittelgroße Schiffe zu geben, die sich für die Verfolgung kleinerer Schiffe, feindlicher Frachtschiffe und die Unterstützung größerer Kriegsschiffe eignen. Die Beauftragung von Schiffbauern mit der Entwicklung und dem Bau fortschrittlicher Designs dieser Schiffsklasse wird uns gegen jeden Feind mit einer großen, auf Zerstörer ausgerichteten Flotte helfen und unsere U-Boote vor Gefahren schützen."
 SWE_ww1_destroyer_effort: "Zerstörer Einsatz"
 SWE_ww1_destroyer_effort_desc: "Unsere Admiräle haben um eine größere Anzahl und Investition in Zerstörer gebeten, damit wir leichte Schiffe haben, die U-Boote ausschalten, den Rest der Flotte auskundschaften und Konvois eskortieren können. Die Bestellung von mehr und besseren Zerstörern in unseren Werften wird uns helfen, unsere Handelsrouten offen zu halten und U-Boote weit weg zu bringen." 
 SWE_ww1_capital_ships_effort: "Großschiff Einsatz"
 SWE_ww1_capital_ships_effort_desc: "Unsere Admirale haben eine einfache Forderung gestellt: Mehr von diesen erstaunlichen Dreadnoughts, und zwar größere und bessere. Der Bau dieser riesigen Schiffe wird uns helfen, die Kontrolle über die Gewässer zu erlangen, die Truppen an den Küsten zu unterstützen und unsere Invasionen auf See zu schützen."
 SWE_ww1_carrier_focus: "Schwerpunkt Träger"
 SWE_ww1_carrier_focus_desc: "Einige radikale Köpfe haben ein fast unbewaffnetes Schiff vorgeschlagen, das einfach nur eine Reihe von Marinebombern beherbergen soll. Das ist ein sehr vielversprechendes Projekt, auch wenn es durch die heutige Technologie ein wenig behindert wird. Wenn wir dieses Projekt weiterverfolgen, werden Flugzeuge vielleicht eines Tages sogar über den Gewässern zu sehen sein." 
 SWE_ww1_antisubmarine: "U-Boot Bekämpfung"
 SWE_ww1_antisubmarine_desc: "U-Boote sind schwer zu fangen, vor allem wenn sie gut kommandiert werden. Wenn wir nicht vorhaben, alle ankommenden Frachtschiffe auf den Grund des Ozeans sinken zu lassen, haben uns unsere Admiräle geraten, in Wasserbomben, fortschrittliche Torpedos und andere Waffen zu investieren, mit denen wir die unsichtbare Bedrohung ausschalten könnten." 
