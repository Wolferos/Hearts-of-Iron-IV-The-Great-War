###  Übersetzt von Proho
 # SPR
 SPR_alfonso_xiii_desc: "König Alfonso XIII., ''El Africano'', regiert Spanien seit dem Ende der Regentschaft seiner Mutter im Jahr 1902. Obwohl Spanien rechtlich gesehen eine konstitutionelle Monarchie ist, hat er sich in den letzten Jahren zum Lieblingskind der Aristokraten entwickelt und regiert das Land praktisch selbst. Mit dem Beginn des neuen Jahrzehnts geht der Plan des Königs, das Land zu modernisieren, weiter. Es lebe Rey Alfonso!"
