 GER_int_defeat_in_the_weltkrieg:0 "Niederlage im Weltkrieg"
 GER_int_defeat_in_the_weltkrieg_desc:0 ""

 GER_int_crush_the_spartacists:0 "Die Spartakisten zerschlagen"
 GER_int_crush_the_spartacists_desc:0 "Wir müssen die Freikorps-Soldaten die Spartakisten angreifen lassen."
 GER_int_beer_hall_putsch_succeeds:0 "Bierhallen-Putsch gelingt"
 GER_int_beer_hall_putsch_succeeds_desc:0 ""
 interwar_hitler_putsch_success:0 "Bierhallen-Putsch Erfolgreich"
 GER_int_beer_hall_putsch_fails:0 "Beer Hall Putsch Fails"
 GER_int_beer_hall_putsch_fails_desc:0 ""
 interwar_hitler_putsch_fail:0 "Bierhallen-Putsch scheitert"
 GER_int_the_locarno_traties:0 "Die Verträge von Locarno"
 GER_int_the_locarno_traties_desc:0 "Wir verstanden, dass Frankreich sich zutiefst eine britische Garantie für seine Nachkriegsgrenzen wünschte. Wir können uns bemühen, den Frieden zu bewahren."
 GER_int_mein_kampf:0 "Mein Kampf"
 GER_int_mein_kampf_desc:0 "Hitlers Zeit im Gefängnis hat ihm die Möglichkeit gegeben, ein umfangreiches Buch über sein Leben und seine Ideologie zu schreiben. Die Genehmigung seiner Veröffentlichung und Verbreitung könnte die wachsende Bewegung beruhigen. Und hoffentlich nicht weiter verbreiten."
 GER_int_hitler_chancellor:0 "Hitler zum Reichskanzler ernennen"
 GER_int_hitler_chancellor_desc:0 "Kanzler von Papen hat Präsident Hindenburg geraten, Hitler sein Amt zu übertragen. Solange der Präsident am Leben ist und seine Macht behalten kann, sollte Hitler keine echte Kontrolle ausüben können und sich selbst erschöpfen. Dies ist zwar ein ernstes Risiko, könnte aber einen Bürgerkrieg verhindern."
 GER_int_reichstag_fire_decree:0 "Reichstagsbrandverordnung"
 GER_int_reichstag_fire_decree_desc:0 "Die Reichstagsbrandverordnung ist die gebräuchliche Bezeichnung für die Verordnung des Reichspräsidenten zum Schutz von Volk und Staat, die der deutsche Reichspräsident Paul von Hindenburg auf Anraten von Reichskanzler Adolf Hitler als unmittelbare Reaktion auf den Reichstagsbrand erließ. Die Verordnung hob viele der wichtigsten bürgerlichen Freiheiten der deutschen Staatsbürger auf."
 GER_int_night_long_knives:0 "Nacht der langen Messer"
 GER_int_night_long_knives_desc:0 "Jetzt, da das neue Reich die Macht übernommen hat, müssen die alten Feinde beseitigt werden. Jeder, der jemals gegen das Reich sein könnte, muss beseitigt werden – und zwar schnell!"

