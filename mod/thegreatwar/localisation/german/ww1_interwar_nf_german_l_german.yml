 GER_int_imperialismus:0 "Imperialismus"
 GER_int_imperialismus_desc:0 "Das Deutsche Reich steht stark da, aber sein Vermächtnis könnte noch größer sein. Indem wir uns imperialen Ambitionen verschreiben, bereiten wir uns darauf vor, den Geist des Heiligen Römischen Reiches wiederzubeleben und unsere rechtmäßige Vorherrschaft über Europa zu behaupten."
 GER_int_game_of_thrones:0 "Das Spiel der Throne"
