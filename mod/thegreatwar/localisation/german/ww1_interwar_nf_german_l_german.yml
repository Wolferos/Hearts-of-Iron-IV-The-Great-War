 GER_int_restore_burgundy:0 "Burgund wiederherstellen"
 GER_int_restore_burgundy_desc:0 ""
 GER_int_claim_austria_and_bohemia:0 "Österreich und Böhmen beanspruchen"
 GER_int_claim_austria_and_bohemia_desc:0 "Österreich und Böhmen waren einst das Herzstück der Imperialen Herrschaft. Es ist an der Zeit, unseren historischen Anspruch geltend zu machen und diese Länder wieder unter deutsche Führung zu bringen."
 GER_int_vereinigte_niederlande:0 "Vereinigte Niederlande"
 GER_int_vereinigte_niederlande_desc:0 ""
 GER_int_der_kirchenstaat:0 "Der Kirchenstaat"
 GER_int_der_kirchenstaat_desc:0 ""
 GER_int_old_prussia_is_prussia:0 "Altpreußen ist Preußen"
 GER_int_old_prussia_is_prussia_desc:0 "Wir können das glorreiche preußische Erbe, das Friedrich II. uns hinterlassen hat, wiederbeleben. Warten wir nicht länger!"
 GER_int_papal_coronation:0 "Papstkrönung"
 GER_int_papal_coronation_desc:0 ""
 GER_int_restore_the_teutonic_order:0 "Deutschen Orden wiederbeleben"
 GER_int_restore_the_teutonic_order_desc:0 ""
 GER_int_liberate_constantinopole:0 "Konstantinopel befreien"
 GER_int_liberate_constantinopole_desc:0 "Die alte Bastion der Christenheit liegt in fremden Händen. Um unseren Glauben und unsere Geschichte zu ehren, müssen wir Konstantinopel wieder an seinen rechtmäßigen Platz in der christlichen Welt zurückbringen."
