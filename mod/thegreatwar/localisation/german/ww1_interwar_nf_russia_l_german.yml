l_german:
###  Übersetzung von Proho  ###
 # [RUSSLAND & WEISSRUSSLAND] Zwischenkriegszeit
 #=========================================================================

 RUS_int_honor_the_imperial_family:0 "Ehre die Kaiserfamilie"
 RUS_int_honor_the_imperial_family_desc:0 "Auch wenn wir es gerne täten, können wir Jahrhunderte der Geschichte nicht einfach auslöschen. Die Romanow-Dynastie ist ein Teil Russlands, ob imperial oder bolschewistisch, daher müssen wir ihr ein Mindestmaß an Würde zugestehen. Und nebenbei bemerkt wird dies auch ein sehr positives Signal des Respekts an die externen Mächte senden, die die Situation hier beobachten."

 RUS_int_support_kirill_vladimirovich:0 "Kirill Vladimirovich unterstützen"
 RUS_int_support_kirill_vladimirovich_desc:0 "Seit Nikolaus II. von den Roten ermordet wurde, hat sich die Liste der Anwärter auf den Zaren-Thron verkürzt. Der legitimste unter ihnen ist der Sohn von Großfürst Wladimir und Großfürstin Pawovna. Er ist derjenige, den wir als Herrscher anerkennen müssen."

 RUS_int_negotiate_with_trotsky:0 "Mit Trotzki verhandeln"
 RUS_int_negotiate_with_trotsky_desc:0 "Vielleicht ist es an der Zeit, der Realität ins Auge zu sehen. Die Bolschewiki sind zu stark. Wenn wir das Reich nicht mit Gewalt wiederherstellen können, dann ist vielleicht ein konstitutioneller Zarismus der Preis für das Überleben unserer Nation."

 RUS_int_disinherit_kirill_vladimirovich:0 "Kirill Wladimirowitsch enterben"
 RUS_int_disinherit_kirill_vladimirovich_desc:0 "Er, der Zar? Wir haben nicht vergessen, dass Prinz Wladimirowitsch der Erste war, der uns verraten hat, als der Thron ins Wanken geriet. Er war es, der an der Spitze der Garde-Füsiliere den Taurischen Palast angriff, bekleidet mit einem roten Hemd als Zeichen seiner Treue zu den Bolschewiki! Es kommt nicht in Frage, einen solchen Opportunisten auf dem Thron des Dritten Rom zu belassen..."

 RUS_int_reestablish_the_zemsky_sobor:0 "Wiederherstellung des Zemsky Sobor"
 RUS_int_reestablish_the_zemsky_sobor_desc:0 "In der Vergangenheit gab es eine Versammlung von Vertretern aus allen Regionen des Reiches, die aus allen Staaten kamen und die verschiedenen sozialen Schichten und Völker Russlands repräsentierten. Könnte dies in einer Zeit, in der wir dringend Einheit und Stabilität im Land brauchen, eine hervorragende Lösung sein? Die Menschen würden sich nicht nur gehört fühlen, sondern wir würden auch vielfältige Meinungen zu den Themen erhalten, die uns interessieren."

 RUS_int_tsar_michael_ii:0 "Tsar Michael II."
 RUS_int_tsar_michael_ii_desc:0 "Seit dem Tod von Zar Nikolaus II. geht der Thron an seinen jüngeren Bruder, Großfürst Michael Alexandrowitsch Romanow, über. Er ist ein weiser und verantwortungsbewusster Mann, hat jedoch bislang den Thron abgelehnt, bis er vom russischen Volk als Zar anerkannt wird. Das spricht für ihn, aber wir brauchen einen Herrscher, und zwar sofort. Wir werden ihn so schnell wie möglich auf den Thron setzen."

 RUS_int_reconciliation:0 "Versöhnung"
 RUS_int_reconciliation_desc:0 ""

 RUS_int_accept_polish_independence:0 "Polens Unabhängigkeit akzeptieren"
 RUS_int_accept_polish_independence_desc:0 "Es gibt eine Zeit für Imperialismus und eine Zeit für das Überleben. Die Polen wollen unbedingt unabhängig und frei sein, und wir haben heute nicht die Mittel, sie unter unserem Joch zu halten. Lasst uns ihre Forderungen nach Unabhängigkeit akzeptieren; das ist die einzig logische Entscheidung, die wir treffen können: Es wird später immer noch Zeit sein, sie wieder unter unsere Fittiche zu nehmen..."

 RUS_int_improve_russo_finnish_relations:0 "Verbesserung der Russisch-Finnischen Beziehungen"
 RUS_int_improve_russo_finnish_relations_desc:0 "Ein neues Land ist entstanden, und wir müssen gute Beziehungen zu ihm pflegen, sonst haben wir einen gefährlichen Gegner weniger als eine Autostunde von St. Petersburg entfernt! Schicken wir Diplomaten nach Helsinki und beginnen wir, die Beziehungen zu verbessern."

 RUS_int_all_the_russias:0 "Das ganze Russland"
 RUS_int_all_the_russias_desc:0 "Russland erstreckt sich von der Ostsee bis zum Pazifischen Ozean und umfasst ein Drittel der Erde und den größten Teil Eurasiens. Es vereint Dutzende von Völkern, Kulturen und Religionen, und um unseren Weg zurück zur Einheit zu finden, sollten wir uns an dieses wesentliche Konzept erinnern: Es gibt ein Russland, das aus vielen Russen besteht..."

 RUS_int_reclamation:0 ""
 RUS_int_reclamation_desc:0 ""

 RUS_int_reclaim_the_baltic:0 "Das Baltikum zurückgewinnen"
 RUS_int_reclaim_the_baltic_desc:0 "Unsere Kontrolle über die Ostsee muss vollständig sein, und wenn wir in einer Zeit, in der Russland schwankt, zögern, wird sich die Revolte wie ein Lauffeuer ausbreiten! Wir werden die Balten vernichten, wie es sich gehört. Mehrere Armeekorps sind noch immer in der Nähe von Petrograd stationiert; wir können schnell einen Offensivplan ausarbeiten."

 RUS_int_retake_the_caucasus:0 "Den Kaukasus zurückgewinnen"
 RUS_int_retake_the_caucasus_desc:0 "Der Kaukasus ist reich an Rohstoffen; wir dürfen nicht zulassen, dass er unter den Einfluss einer anderen Macht gerät. Er verfügt über riesige Öl- und Gasvorkommen, Wasser, Wälder mit einer reichen Tierwelt und ausgedehnte landwirtschaftliche Flächen, die hervorragende Erträge liefern. Niemand außer uns sollte ihn besitzen!"

 RUS_int_reclaim_the_finnish_throne:0 "Den Finnischen Thron zurückgewinnen"
 RUS_int_reclaim_the_finnish_throne_desc:0 "Die Bolschewiki akzeptierten die Unabhängigkeit Finnlands, solange es ihnen half, ihre Macht zu festigen. Aber das ist vorbei; wir müssen unsere Souveränität über dieses Gebiet einfordern."

 RUS_int_burn_the_treaty_of_fredrikshamn:0 "Verbrennt den Vertrag von Fredrikshamn."
 RUS_int_burn_the_treaty_of_fredrikshamn_desc:0 ""

 RUS_int_reconquer_chukotka:0 "Chukotka zurückerobern"
 RUS_int_reconquer_chukotka_desc:0 ""

 RUS_int_refuse_polish_independence:0 "Polens Unabhängigkeit ablehnen"
 RUS_int_refuse_polish_independence_desc:0 "Polen muss ein integraler Bestandteil unseres großen Russischen Reiches bleiben, wenn wir den Separatisten nachgeben, riskiert das gesamte Reich auseinanderzubrechen!"

 ############################################################################################
