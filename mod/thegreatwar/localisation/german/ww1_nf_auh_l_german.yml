l_german:
###  Übersetzung von Proho aktuallisiert  ### bis Zeile 151
# Army Tree
#=========================================================================
 AUH_ww1_army_effort: "Landstreitkräfte Österreich-Ungarns"
 AUH_ww1_army_effort_desc: "Die österreich-ungarische Armee ist derzeit in drei Zuständigkeitsbereiche aufgeteilt. Eine österreichische Armee, eine ungarische Armee und eine gemeinschaftliche Armee, die alle ihre eigenen Offiziere und Staabsstellen haben. Die Modernisierung einer solchen Armee ist eine große Herausforderung, aber machbar. Sie führt unweigerlich zu einer wesentlich effizienteren Armeestruktur." 
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 AUH_ww1_form_frr_rcece "Gründen Sie die K.u.K. Luftfahrtruppen"
 AUH_ww1_form_frr_rcecedesc: "Diese neuartigen Flugzeuge sind interessante Spielzeuge, möglicherweise sogar von militärischem Nutzen. Zivile Piloten könnten wir einfach für unsere Truppen begeistern. Experten könnten uns beraten wie wir diese neumodischen Apparate benutzen und wenn das Projekt Frücjhte trägt haben wir vielleicht einen entscheidenden Vorteil gegenüber unseren Gegner."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 AUH_ww1_naval_effort: "Verstärken Sie die K.u.K. Kriegsmarine"
 AUH_ww1_naval_effort_desc: "Obwohl Österreich seit dem 14. Jahrhundert kein Binnenstaat mehr ist, hatten unser Kaiserreich nie eine besonders furchterregende Marine. Ein großes Modernisierungsprogramm um unseren Bau von brandneuen Schiffen zu unterstützen wird uns hoffentlich eine Seestreitmacht geben, die im rauen Mittelmeer konkurrenzfähig ist."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 AUH_ww1_political_effort: "Politik-Bemühungen"
 AUH_ww1_political_effort_desc: "Die Zeit für eine Reformation ist gekommen. Die Nation wurde jahrelang gut nach den alten Prinzipien regiert, aber diese schwierigen Zeiten, in denen wir uns befinden, erfordern eine Regierung, die in der Lage ist, auf sie zu reagieren. Wenn wir in der Lage sein wollen, den Weg zu ändern oder unsere derzeitige Regierung zu unterstützen, um Angriffen von außen standzuhalten, kann ein politischer Wandel unserer Nation und der Zukunft unseres Volkes nur zugutekommen."
 AUH_ww1_sovereignist_ethos: "Zentralisierung"
 AUH_ww1_sovereignist_ethos_desc: "Die Autorität des Staates war zu lange geteilt. Indem wir die Macht der Unterstaaten im Vergleich zur zentralisierten Regierung beschneiden, können wir Regionalismus und Klüngel überwinden und eine stärkere Nation schaffen, was unweigerlich die Tür für neue Maßnahmen öffnen wird."
 AUH_ww1_support_kaiser: "Autorität des Kaisers stärken"
 AUH_ww1_support_kaiser_desc: "Seine königliche Majestät der Kaiser und König hat lange Zeit weise über unser Land regiert, aber die Drohungen gegen seine Herrschaft haben sich verschärft. Von Nationalisten die versuchen auszubrechen bis zu Föderalisten die versuchen eine regionalistische Demokratie zu formen, hat der Thron intern viele Feinde. Wir müssen eine Kampagne zur Wiederherstellung der Reputation für die K.u.K durchführen um seine Macht zu festigen."
 AUH_ww1_contest_kaiser: "Autorität des Kaisers in Frage stellen"
 AUH_ww1_contest_kaiser_desc: "Vielleicht ist die Monarchie keine geeignete Regierungsform mehr um einen multinationalen Staat zu regieren. Der Kaiser und König ist außerhalb von Österreich selbst sehr unbeliebt und hat viele Feinde in seinem eigenen Heimatland. Wenn wir seine Autorität von innen schwächen, welche Chance hat er dann seine Herrschaft zu behalten? Mächtigere Parteien können dann seinen Platz einnehmen."
 AUH_ww1_internationalism_focus: "Internationalismus-Schwerpunkt"
 AUH_ww1_internationalism_focus_desc: "Die Bolschewiki haben uns den Weg gezeigt, folgen wir Wladimir Lenin und machen wir Schluss mit den Privilegien der Bourgeoisie!"
 AUH_ww1_militarism: "Militarismus"
 AUH_ww1_militarism_desc: "Unsere Armee wird immer mehr zu einem Teil des täglichen Lebens unserer Nation. Glücklicherweise begünstigt die Unterstützung der Bevölkerung unsere Truppen derzeit, da sie sie als die Helden sehen, die sie sind, die unter unserem Banner kämpfen. Diese Militärkultur, die wir etablieren werden, wird der Sache unserer Streitkräfte dienen."
 AUH_ww1_indoctrination_focus: "Indoktrinierung"
 AUH_ww1_indoctrination_focus_desc: "Nach jahrelangen Debatten darüber, wie wir die Unterstützung der Bürger für unser wunderbares neues Regime gewinnen können, haben einige Mitglieder des Arbeiterrats die Einrichtung eines neuen "Ministeriums der Liebe" vorgeschlagen, das die Menschen offiziell davon überzeugen soll, unsere Regierung zu unterstützen. Wir werden hier nicht darüber sprechen, was in diesem Ministerium inoffiziell geschehen wird..."
 AUH_ww1_political_commissars: "Politkommissare"
 AUH_ww1_political_commissars_desc: "Das Militär ist paradoxerweise ein Ort, an dem anti-nationale Stimmungen gedeihen. Indem wir dafür sorgen, dass unsere Regierung ihre Augen überall hat, können wir diese Agitatorengruppen aufspüren und sie am Wachsen hindern."
 AUH_ww1_paramilitarism: "Paramilitarismus"
 AUH_ww1_paramilitarism_desc: "Einige Länder sind so dumm, bewaffnete Milizen aus Angst vor Rebellionen zu verurteilen. Wenn wir jedoch vorsichtig genug sind, diese auf Regimetreue zu beschränken, können wir eine weitere Gruppe wütender und bewaffneter Männer schaffen, die unsere Nation unterstützen können. Dies wird uns im Falle eines Krieges von Nutzen sein."
 AUH_ww1_political_correctness: "Politische Korrektheit"
 AUH_ww1_political_correctness_desc: "Jeder, der sich gegen unsere Regierung äußert, begeht eindeutig ein Verbrechen aus Hass gegen das Volk, das wir verteidigen. Daher sollte jemand, der sich gegen die herrschende Macht ausspricht, genau beobachtet werden."
 AUH_ww1_military_youth: "Militärjugend"
 AUH_ww1_military_youth_desc: "Unsere militaristische Kultur muss auch bei unseren Kindern präsent sein! Indem wir den Respekt vor dem Militär erzwingen und der jungen Generation eine Ausbildung bieten, können wir sicher sein, dass sie heranwachsen und sich einschreiben, um unserem glorreichen Regime zu dienen. Manche mögen dies als Ausbeutung bezeichnen ... aber es klingt besser, wenn man sagt, dass wir den Heranwachsenden eine glänzende Zukunft ermöglichen."
 AUH_ww1_student_movement_focus: "Studentenbewegung"
 AUH_ww1_student_movement_focus_desc: "Die Jugend unseres Landes ist in der Tat intelligent und das kann uns bei unseren Forschungen helfen, insbesondere im Bereich der Landdoktrinen."
 AUH_ww1_monarchy: "Autoritarismus-Schwerpunkt"
 AUH_ww1_monarchy_desc: "Die Macht, die vom Parlament und vom Volk ausgeübt wird, kann gefährlich sein. Der einzige wirkliche Weg, die Kontrolle über die Nation zu behalten, insbesondere in solch schwierigen Zeiten, wäre, eine allgemein feste Position einzunehmen und unser Land so zu führen, wie es sein sollte."
 AUH_ww1_democracy: "Demokratie-Schwerpunkt"
 AUH_ww1_democracy_desc: "Es wird gesagt, dass jeder Herrscher seine Macht vom Volk ableitet. Wenn wir einen Schritt in Richtung einer demokratischeren Gesellschaft machen, auch wenn wir es nicht wirklich werden, können wir zumindest eine bessere Position erreichen, um mit demokratischen Nationen auf der ganzen Welt verhandeln zu können."
 AUH_ww1_centralizedpower: "Bürokratie"
 AUH_ww1_centralizedpower_desc: "Indem wir die Zahl der Staatsbeamten verdoppeln, stärken wir unsere Fähigkeit, die gesamte Regierung zu kontrollieren und zu regulieren, und stellen sicher, dass uns nichts entgeht. Die Anstrengungen der Nation werden viel besser genutzt. Außerdem wird es die nationale Papierindustrie in Schwung bringen..."
 AUH_ww1_freespeech: "Freie Rede"
 AUH_ww1_freespeech_desc: "Wenn wir den Menschen das Recht auf freie Meinungsäußerung und Demonstrationsfreiheit geben, stellen wir sicher, dass die Menschen zumindest ihre Wut und ihre Gedanken in etwas Kreativeres stecken können. Abgesehen davon wird jemand, der in einem überfüllten Theater « FEUER! » ruft oder eine etwas zu deutliche Bezeichnung für die Mutter des Staatsoberhauptes verwendet, trotzdem ins Gefängnis gehen..."
 AUH_ww1_reorganization_act: "Reorganisierungs-Akt"
 AUH_ww1_reorganization_act_desc: "Große Teile unseres Landes sind seit dem Zeitpunkt, als die Zivilisation unsere Nation erreichte, unter der Herrschaft verschiedener Gruppen und Einzelpersonen gewesen. Im Laufe der Jahrhunderte wurde ein Teil dieses Landes jedoch schlecht verwaltet oder ausgebeutet. Durch die Neuordnung dieses Landes und seiner Besitzer, insbesondere derjenigen, die ineffizient waren, können wir viele Menschen umsiedeln und ihnen ermöglichen, in unseren Industrien zu arbeiten."
 AUH_ww1_leave_central_power: "Treten Sie aus den Mittelmächten aus"
 AUH_ww1_leave_central_power_desc: "Die Deutschen waren einst unsere beste Lebensversicherung, aber Österreich muss jetzt seinen eigenen Weg gehen. Vielleicht werden wir eines Tages, wenn die deutsche Regierung unsere Ideologie widerspiegelt oder wenn es notwendig ist, wieder ein Bündnis schließen. Jetzt aber müssen wir unseren Brüdern im Norden Lebewohl sagen und ihnen alles Gute wünschen."
 AUH_ww1_limited_rearmament: "Begrenzte Rationierung"
 AUH_ww1_limited_rearmament_desc: "Unsere Armee angemessen mit militärischen Gütern zu versorgen, erfordert große Investitionen und Requisitionen. Natürlich können sich Zivilisten bei einer begrenzten Rationierung immer noch amüsieren - wahrscheinlich auf Kosten des Militärs."
 AUH_ww1_full_rearmament: "Starke Rationierung"
 AUH_ww1_full_rearmament_desc: "Wer kann in die Zukunft blicken und sagen, dass die Kriege aufhören werden? Wir müssen dafür sorgen, dass unsere Streitkräfte den vor ihnen liegenden Aufgaben gewachsen bleiben."
 AUH_ww1_unitedpeople: "Vereinen Sie das Reich"
 AUH_ww1_unitedpeople_desc: "Eine merkwürdige Veränderung in der österreichischen Politik hat stattgefunden. Vielleicht haben die Menschen der nichtösterreichischen Bevölkerungsschichten hier ihren Platz angenommen oder sie sind einfach von dem Gejammer der Nationalisten mit blutendem Herzen müde."
 AUH_ww1_massive_effort: "Massive Bemühungen"
 AUH_ww1_massive_effort_desc: "Jeder Mann und jede Frau muss den nationalen Bemühungen helfen! Da das Gespenst des Großen Krieges jeden Tag ein wenig näher rückte, wurde ein großes Wirtschaftsprogramm in Angriff genommen, um unsere industrielle Kapazität zu entwickeln und uns zu helfen, unsere verhassten Rivalen zu überwinden!"
 AUH_ww1_fortify_city: "Zivile Befestigungen"
 AUH_ww1_fortify_city_desc: "Wenn die Kämpfe unsere Grenzen erreichen, ist es am besten, wenn wir darauf vorbereitet sind. Indem wir Bauarbeiter anheuern, um Festungen und Kasematten in einigen unserer Außenprovinzen zu errichten, können wir den Feind, der es wagen sollte, uns anzugreifen, auf Distanz halten - und das ohne jedes Risiko!"
 AUH_ww1_fortify_coast: "Küstenverteidigung"
 AUH_ww1_fortify_coast_desc: "Eine Küste ist nicht leicht zu verteidigen. Da es Schiffe gibt, die praktisch überall an unseren Küsten Truppen anlanden können, sind Küstenforts nicht zu unterschätzen, wenn es darum geht, unsere Feinde ins Meer zurückzuwerfen."
 AUH_ww1_install_communism: "Proletarier Revolution"
 AUH_ww1_install_communism_desc: "Die Leute haben genug von den österreichischen Eliten, die die Menschen auf dem Land und in den Fabriken kontrollieren und unterdrücken. Von nun an werden die Einwohner der Donaumonarchie angesichts der aristokratischen Unterdrückung zusammenstehen!"
 AUH_ww1_install_democracy: "Freie Wahlen"
 AUH_ww1_install_democracy_desc: "Zum ersten Mal werden die Einwohner der Donaumonarchie in ihrer Regierung mitreden können. Mit der alten Monarchie die jetzt der Vergangenheit angehört, kann eine Bundesrepublik ausgerufen werden die jedem Teil des Nationalstaats zuhören kann. Wir dürfen nicht länger Österreicher oder Ungar sein oder etwas mehr oder weniger als Bürger."
 AUH_ww1_end_dual_monarchy_emperor: "Beenden Sie die Doppelmonarchie"
 AUH_ww1_end_dual_monarchy_emperor_desc: "Ungarn hat Österreich nur heruntergezogen. Indem wir auf den ungarischen Thron als einen unserer Titel verzichten und ihn stattdessen dem österreichischen unterordnen, werden wir alle daran erinnern wer in der Monarchie das Sagen hat. Einige dieser schnauzbärtigen Barbaren mögen sich beschweren, aber was macht das schon? Wir haben sie 1846 besiegt und wir können es wieder tun wenn es sein muss." 
 AUH_ww1_oppression_minorities: "Unterdrücken Sie die Minderheiten"
 AUH_ww1_oppression_minorities_desc: "Der beste Weg die Loyalität von Minderheiten zu gewährleisten besteht darin, dass sie sich nicht untereinander identifizieren. Indem wir Publikationen in anderen Sprachen illegal machen, Bürger bestrafen die unsere Kultur nicht respektieren und lokale Minderwertigkeit erzwingen, können wir einige täuschen, dass sie denken sie gehören zu uns um die anderen davon abhalten, sich gegen uns auszusprechen."
 AUH_ww1_autrichian_lead: "Österreichisches Hauptquartier"
 AUH_ww1_autrichian_lead_desc: "Mit dem Ende der Doppelmonarchie und der Zentralisierung des Reiches unter Österreich ist das Militär wieder zu einer einheitlichen Organisation mit österreichischen Anführern an der Spitze geworden. Obwohl die Offiziere anderer Nationalitäten protestieren, hat ein solides, geeintes Militär wieder Vorteile für unsere Doktrin und ihre Verbreitung gebracht." 
 AUH_ww1_same_language: "Verbieten Sie die Sprachen von Minderheiten"
 AUH_ww1_same_language_desc: "Deutsch ist die einzige Sprache, die man sprechen darf. Die Nutzung anderer Sprachen ist in der Öffentlichkeit untersagt."
 AUH_ww1_dismantle_auh: "Lösen Sie Österreich-Ungarn auf"
 AUH_ww1_dismantle_auh_desc: "Der Traum von einer gemeinsamen österreichisch-ungarischen Monarchie liegt zerbrochen da. Vielleicht sollten wir unsere Träume vom Multinationalismus aufgeben und unser eigenes Schicksal verfolgen.
 AUH_ww1_make_concessions: "Machen Sie Zugeständnisse"
 AUH_ww1_make_concessions_desc: "Die Aristokraten sind zunehmend besorgt darüber, dass der Kaiser zu schnell zu viele günstige Rechte erteilt und den Thron weitergeben kann. Was wissen die schon..."                                
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 AUH_ww1_diplomatic_effort: "Diplomatie-Bemühungen"
 AUH_ww1_diplomatic_effort_desc: "In der heutigen Welt wird es immer schwieriger, neutral zu bleiben. Unser diplomatisches Korps drängt uns immer wieder, in den sich entwickelnden Machtkämpfen Stellung zu beziehen oder unsere Neutralität offiziell zu erklären. Wir können die Frage noch nicht beantworten, aber wir können unseren Diplomaten leicht die Mittel an die Hand geben, um eine dieser Optionen zu wählen."
 AUH_ww1_triple_alliance: "Erneuern Sie den Dreibund"
 AUH_ww1_triple_alliance_desc: "Der Dreierbund ist, ganz offen gesagt, das Einzige was uns auf der Landkarte hält. Wir wären regelrechte Idioten, nicht weiter mit den Bündnispartnern zu verhandeln und die Allianz weiterhin zu festigen."
 AUH_ww1_back_ger: "Stärken Sie die Beziehungen zu Deutschland"
 AUH_ww1_back_ger_desc: "Obwohl einige der österreichischen Aristokraten immer noch verbittert über den deutschen Vereinigungsprozess sind, sind die Deutschen unsere Brüder und einer der wenigen befreundeten Staaten die dieser Tage noch übrig sind."
 AUH_ww1_military_advisors: "Militärberater aus Deutschland"
 AUH_ww1_military_advisors_desc: "Man sagt, dass Preußen aus einer Kanonenkugel entstanden ist und auch wenn sie das Land nicht mehr so nennen, gilt dieses Axiom immer noch. Wenn wir die Hilfe Deutschlands zur Modernisierung unseres Militärs annehmen würden, könnten wir von dieser Allianz profitieren."
 AUH_ww1_back_italy: "Sichern Sie sich die Loyalität Italiens"
 AUH_ww1_back_italy_desc: "Die Italiener sind uns, gelinde gesagt, nicht gerade wohlgesonnen. Wir sollten Verhandlungen mit ihnen aufnehmen und die Beziehungen verbessern, wenn wir sie in unserer Allianz halten wollen. Aber wenn wir das tun, besteht die Möglichkeit, dass wir Territorium verlieren ..."
 AUH_ww1_give_italy_territories: "Treten Sie Südtirol und Istrien an Italien ab"
 AUH_ww1_give_italy_territories_descn: "Die Italiener haben ihre Forderungen deutlich gemacht: Die historisch italienische Region Istrien, sowie eine Konzession um die Stadt Split an der dalmatinischen Küste. Leider ist dies unser gesamtes Küstengebiet, aber es könnte ein lohnender Preis sein, um Italien bei den Mittelmächten zu halten. "
 AUH_ww1_italy_honnor_pact: "Rufen Sie Italien zu den Waffen"
 AUH_ww1_italy_honnor_pact_desc: "Italien ist jetzt de facto gezwungen, sich uns im Falle eines Krieges anzuschließen. Wenn wir ihnen Territorium abtreten und ihnen mehr von Frankreich versprechen, werden ihre Leute der Regierung die Hölle heiß machen. Jetzt, da die Dinge ihren Lauf nehmen ist es Zeit die Schulden für das Abtreten einiger unserer wertvollen Regionen einzutreiben. "
 AUH_ww1_assert_position_east: "Festigen Sie die Stellung im Osten"
 AUH_ww1_assert_position_east_desc: "Die Position der Mittelmächte im Osten ist die gleiche - Russland schwächen und eine Vormachtstellung in der Region sichern. Da insbesondere der Krieg mit Russland aufgrund der Situation auf dem Balkan fast unvermeidlich scheint, ist dies eine effektive Vorgehensweise die Frankreich und Russland näher zueinander bringen wird, was sich als problematisch erweisen könnte."
 AUH_ww1_anti_ru: "Anti-Russische Politik"
 AUH_ww1_anti_ru_desc: "Um unsere Position zu verbessern, werden wir die meisten diplomatischen Beziehungen zu Russland abbrechen und öffentlich gegen sie arbeiten. Das wird wahrscheinlich wenig bewirken und sie vorerst verärgern, aber es wird uns eine Vielzahl von Möglichkeiten eröffnen, mit ihnen in Zukunft umzugehen."
 AUH_ww1_anti_ru_limit_trade: "Schränken Sie den Handel mit Russland ein"
 AUH_ww1_anti_ru_limit_trade_desc: "Russland ist einer unserer wichtigsten Handelspartner und wir sind in der glücklichen Lage, dass sie uns mehr brauchen als wir sie. Indem wir russische Produkte mit Sanktionen und Tarifen belegen können wir sicherstellen, dass wir ihnen gegenüber einen wirtschaftlichen Vorsprung erlangen. "
 AUH_ww1_rom: "Annäherung mit Rumänien"
 AUH_ww1_rom_desc: "Die Rumänen sind uns ein Dorn im Auge. Wir kontrollieren einen großen Teil ihres Territoriums und obwohl sie offiziell ein kleines Mitglied des Dreibundes sind, gibt es keinen Zweifel, dass sie unser Territorium mit Neid betrachten. Wir sollten ihnen eine klare Botschaft übrmitteln, um sie dem Gewinnerteam näher zu bringen. Natürlich könnte man auch Zugeständnisse machen um sie wirklich zu gewinnen... " 
 AUH_ww1_rom_give_bucovina: "Treten Sie Bukowina an Rumänien"
 AUH_ww1_rom_give_bucovina_desc: "Die Bukowina ist keine bedeutende Landfläche, aber es ist eines der rumänischsten Gebiete in der österreichisch-ungarischen Monarchie. Dieses Territorium abzutreten garantiert nicht, dass wir ihre Herzen gewinnen, aber es ist sicherlich ein Angebot wert - wir sind viel besser dran mit einem festen Verbündeten als ein paar Hektar Land. "
 AUH_ww1_rom_honnor_pact: "Rufen Sie Rümänien zu den Waffen"
 AUH_ww1_rom_honnor_pact_desc: "Da Rumänien unser Angebot der Bukowina angenommen hat, sind wir in einer guten Position, sie in den gegenwärtigen Konflikt einzubeziehen. Es besteht kein Zweifel, dass wenn sie ablehnen, ihre Leute höchst unzufrieden mit ihnen sein werden."
 AUH_ww1_oirganization_realm: "Organisieren Sie das Reich"
 AUH_ww1_oirganization_realm_desc: "Österreich-Ungarn, als eine Sammlung von Teilen alter Königreiche, hat keine gute Verteidigungsstellung. Trotzdem können wir unsere Truppen festigen und eingraben, um zu versuchen die Hauptlast eines Vorstoßes an unseren breiten Grenzen zurückzuhalten. "
 AUH_ww1_fortify_russian_borders: "Befestigen Sie die Grenze zu Russland"
 AUH_ww1_fortify_russian_borders_desc: "Die galizische Region ist von großem strategischen Interesse und es ist wichtig die Russen fernzuhalten, wenn wir im Osten einen Vorteil haben wollen. Eine Befestigungslinie in dieser Region wird helfen, den Bären zurückzudrängen. "
 AUH_ww1_airport_russian_borders: "Bauen Sie Flugfelder an der Grenze zu Russland"
 AUH_ww1_airport_russian_borders_desc: "Das Aufkommen von Kampfflugzeugen könnte sehr wohl ein entscheidender Faktor für den Krieg im Osten sein. Wenn wir rechtzeitig gut angelegte Flugfelder bauen, können wir mehr Flugzeuge in der Region stationieren, was es wahrscheinlicher macht die feindliche Luftüberlegenheit zu brechen und dadurch entscheidende Schlachten in der Region zu gewinnen. "
 AUH_ww1_fortify_italian_borders: "Befestigen Sie die Grenze zu Italien"
 AUH_ww1_fortify_italian_borders_desc: "Die italienische Grenze ist lang und seltsam gekrümmt, was es den Einheiten schwer macht, sich gegenseitig zu unterstützen. Schlimmer noch, die Italiener selbst sind am Fuß der Bergketten und in befestigten Stadtgebieten fest verschanzt. Wenn wir schon nicht in absehbarer Zeit den Durchbruch schaffen, sollten wir zumindest sichergehen, dass wir einen Angriff aus dieser Richtung abwehren können."
 AUH_ww1_fortify_bosnia_borders: "Befestigen Sie die Grenzen am Balkan"
 AUH_ww1_fortify_bosnia_borders_desc: "Es ist sehr unwahrscheinlich, dass der Balkan uns ernsthafte Probleme bereiten wird, aber es ist immer besser sich zu sorgen, als dass französische Marines in der Region ankommen und uns ein böses Erwachen bereiten. Es wird Serbien und Montenegro auch die Chance nehmen unser Territorium in irgendeiner Weise zu anzugreifen, was für eine sichere Balkan-Kampagne sorgt. "
 AUH_ww1_fortify_coast_dalmatia: "Befestigen Sie die Küste Dalmatiens"
 AUH_ww1_fortify_coast_dalmatia_desc: "Obwohl wir nicht über eine starke Marine verfügen, haben wir immer noch eine lange Küstenlinie, die verteidigt werden muss, sofern nicht eine Front vom Balkan nach Italien entstehen soll. Das wäre eine Katastrophe für unsere Kriegsanstrengungen. Durch die Verbesserung bestehender Küstenforts und den Bau neuer Forts kann sichergestellt werden, dass wir uns diesem Albtraum niemals stellen müssen. "
 AUH_ww1_ready_country: "Rekrutierungs-Propaganda"
 AUH_ww1_ready_country_desc: "Österreich-Ungarn zufolge ist die österreichisch-ungarische Armee der angesehenste Arbeitgeber der Welt. Indem wir positive Nachrichten und Informationen über unser Land und unsere Streitkräfte verbreiten, können wir Enthusiasmus bei ansonsten apathischen Männern aufbauen, die unserem Militär helfen. "
 AUH_ww1_polnische_wehrmacht: "Polnische Wehrmacht"
 AUH_ww1_polnische_wehrmacht_desc: "Wenn wir den Polen nach dem Krieg ihren eigenen Staat versprechen, werden die Bewohner unseres Teils von Polen vielleicht eher bereit sein mitzumachen. Ob wir das Gebiet abtreten oder nicht, ist natürlich eine Frage, über die wir noch entscheiden müssen, aber im Moment können wir den Zustrom von arbeitsfähigen Männern genießen, ohne an die Konsequenzen zu denken. "
 AUH_ww1_military_harmonization: "Militärische Harmonisierung"
 AUH_ww1_military_harmonization_desc: "Eine Armee mit 3 Unterteilungen in ihren Landstreitkräften ist nicht leicht zu kontrollieren, aber in letzter Zeit haben sich unsere Offiziere daran gewöhnt mit den Feinheiten einer solchen Streitmacht umzugehen. Wenn unser Militär mehr organisch und einheitlicher operiert kommen mehr Ideen auf die oberste Ebene, was unserer Doktrin zugute kommt. "
 AUH_ww1_balkans_policy: "Balkanpolitik"
 AUH_ww1_balkans_policy_desc: "Seit dem Erwerb und der Annexion von Bosnien haben wir versucht unser Territorium am Balkan zu halten und, zugegebenermaßen, in dieser Region weiterzuexpandieren, wenn sich die Gelegenheit dazu bietet. Indem wir unser Anspruch auf der Weltbühne etablieren, können wir uns aktiver in die Politik der Balkanregion einbringen. "
 AUH_ww1_balkans_policy_intervene: "Reaktion auf den 1. Balkan-Krieg"
 AUH_ww1_balkans_policy_intervene_desc: "Der Balkankrieg war eine interessante Erfahrung, vor allem weil er die überraschende potenzielle Stärke dieser Balkanstaaten zeigte, wenn sie zusammenstehen. Obwohl wir das Osmanische Reich unterstützten, scheint es, dass ihre Macht in dieser Region völlig verblasst ist. Vielleicht muss Österreich einen neuen Freund in der Nähe finden, wenn wir jemals behalten wollen, was wir hier haben? "
 AUH_ww1_balkans_bulgaria_friend: "Entsenden Sie militärische Berater"
 AUH_ww1_balkans_bulgaria_friend_desc: "Die Bulgaren sind gerade in einer schwierigen Situation. Ihr Krieg gegen Serbien ist in einen Konflikt mit buchstäblich jedem einzelnen ihrer Nachbarn übergegangen. Wenn wir nicht mindestens Berater schicken, könnte es für sie vorbei sein. Dies ist natürlich auch eine interessante Gelegenheit, sich mit einem dieser Balkanstaaten anzufreunden ... "
 AUH_ww1_balkans_bulgaria_send_troops: "Entsenden Sie Truppen zur Unterstützung Bulgariens"
 AUH_ww1_balkans_bulgaria_send_troops_desc: "Um sicherzustellen, dass Bulgarien zumindest eine Chance hat nicht annektiert zu werden, können wir einige unserer eigenen Truppen, nominell Freiwillige, entsenden um Bulgarien zumindest einen Vorteil im Konflikt zu verschaffen. Dies wird einige dringend benötigte Erfahrungen liefern und Bulgarien weiter in unsere Ecke drängen. "
 AUH_ww1_balkans_serbian_expansion: "Untersuchen Sie den serbischen Expansionismus"
 AUH_ww1_balkans_serbian_expansion_desc: "Obwohl die Serben einst mit unserem Staat verbündet waren, seit wir Bosnien annektiert haben, waren die Dinge viel weniger freundlich zwischen der serbischen Regierung. Aufgrund der starken Zunahme der Kriminalität, insbesondere der jüngsten Immigranten aus Serbien, die sich direkt an unseren Grenzen befinden, muss eine Untersuchung der serbischen Aktivitäten in Österreich durchgeführt werden. "                                           
 AUH_ww1_balkans_serbian_ultimatum: "Stellen Sie Serbien ein Ultimatum"
 AUH_ww1_balkans_serbian_ultimatum_desc: "Also versuchten die serbischen Bastarde nur Rebellionen zu schüren, um ihre schmuddeligen Finger an unsere südslawischen Provinzen zu bekommen! Sie müssen für diesen klaren Vertrauensbruch bestraft werden. Unser guter Kaiser hat der serbischen Regierung ein Ultimatum gestellt, das sie sicherlich nicht ablehnen kann. "                                           
 AUH_ww1_annex_BOS: "Totale Annektierung von Bosnien und Herzegovina"
 AUH_ww1_annex_BOS_desc: "Bosnien gehört technisch gesehen seit 1908 zu unserem Reich, doch der Prozess seiner vollständigen Eingliederung in unser Reich verlief bis heute so langsam, dass es auch Jahre später noch ein gewisses Maß an Autonomie innerhalb unseres Reiches genießt. Dieser Zustand nützt niemandem. Natürlich stellt sich nun die Frage: ''Wird Österreich, Ungarn oder vielleicht beide diesen Staat regieren?''"
 AUH_ww1_Schutzkorps: "Stellen Sie mehr Schutzkorps"
 AUH_ww1_Schutzkorps_desc: "Das Schutzkorps war eine freiwillige Hilfsmiliz, die von den österreichisch-ungarischen Behörden in der neu annektierten Provinz Bosnien und Herzegowina eingerichtet worden war, um die bosnisch-serbische Opposition aufzuspüren. "              
