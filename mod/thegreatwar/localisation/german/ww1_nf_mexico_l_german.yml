l_german:
###  Übersetzt von Proho  ###
#--------------------------------------------------------------
# Army Tree
#=========================================================================
 MEX_ww1_army_effort: "Wiederaufbau der Mexikanischen Armee"
 MEX_ww1_army_effort_desc: "Die jüngste Instabilität des Landes hat sich drastisch negativ auf unser Militär ausgewirkt. Wir müssen eine angemessene Befehlskette und Doktrin wiederherstellen, wenn wir die Hoffnung haben wollen, künftige interne Konflikte - oder, Gott bewahre, ausländische Invasionen - zu überstehen..."
#--------------------------------------------------------------
# Aviation Tree
#=========================================================================
 MEX_ww1_form_air_force: "Gründung der Mexikanischen Luftwaffe"
 MEX_ww1_form_air_force_desc: "Der offizielle Vorgänger der Luftwaffe war die Militärische Hilfsluftmiliz, die im April 1913 während der mexikanischen Revolution vom Kriegssekretär und General der Marine, Manuel Mondragon, gegründet wurde. Er war es auch, der den Piloten Miguel Lebrija und Juan Guillermo Villasana erlaubte, Ziele in Campo de Balbuena direkt in Mexiko-Stadt zu bombardieren. Am 5. Februar 1915 gründete der Führer der Konstitutionellen Armee, Venustiano Carranza, die Arma de Aviación Militar, aus der später die mexikanische Luftwaffe hervorging."
#--------------------------------------------------------------
# Industrial Tree
#=========================================================================

#--------------------------------------------------------------
# Naval Tree
#=========================================================================
 MEX_ww1_naval_effort: "Wiederaufbau der Mexikanischen Marine"
 MEX_ww1_naval_effort_desc: "Unsere Marine ist noch sehr jung, vor allem im Vergleich zur Flotte der Yankees. So kann und darf es nicht weitergehen, wenn Mexiko eine Regionalmacht sein will."
#--------------------------------------------------------------
# Political Tree
#=========================================================================
 mex_political_effort: "Politische Anstrengung"
 mex_political_effort_desc: "Die Zeit für Reformen ist jetzt gekommen. Während die Nation unter der Führung des alten Systems jahrelang gut zurechtgekommen ist, erfordern diese turbulenten Zeiten eine Regierung, die in der Lage ist, darauf zu reagieren. Ob wir uns nun dafür entscheiden, unseren Weg als Nation zu ändern oder unsere bestehende Regierung zu stärken, damit sie neuen externen Bedrohungen standhalten kann - ein politischer Wandel kann für die Zukunft unseres Landes und seiner Bürger nur von Vorteil sein."
 mex_ww1_sovereignist_ethos: "Unterstützung von Maderos Demokratie"
 mex_ww1_sovereignist_ethos_desc: "Francisco Madero hat sich für eine Erneuerung der mexikanischen Demokratie ausgesprochen, um das Land wieder zu dem liberaleren und dezentraleren Staat zu machen, der es in der Vergangenheit war. Während Kritiker argumentieren, dass ein solcher Staat für den Niedergang Mexikos seit der Unabhängigkeit verantwortlich ist, könnte es sich lohnen, das Risiko einzugehen, um die Implosion des Staates zu vermeiden."
 mex_ww1_Support_the_democracy: "Unterstützen Sie die Demokratie"
 mex_ww1_Support_the_democracy_desc: "Es heißt, dass jeder Herrscher seine Macht im Grunde genommen vom Volk ableitet. Wenn wir uns in Richtung einer demokratischeren Gesellschaft bewegen, können wir, auch wenn wir selbst keine werden, zumindest in eine viel bessere Position für den Handel mit den verschiedenen demokratischen Nationen in der Welt kommen."
 mex_ww1_centralizedpower: "Arbeitsprogramm"
 mex_ww1_centralizedpower_desc: "In Kriegszeiten oder in den Zeiten unmittelbar davor oder danach hat jeder eine Aufgabe für seine Nation zu erledigen. Wenn wir Drifter, Obdachlose und all die anderen Schnorrer, die keine Arbeit finden, für uns bauen lassen, können wir neue Fabriken fast ohne Kosten errichten, und die Fabrik kann sogar aus demselben Arbeitskräftepool einstellen, wenn es nötig ist."
 mex_ww1_freespeech: "Freie Rede"
 mex_ww1_freespeech_desc: "Indem wir den Menschen das Recht auf freie Meinungsäußerung und Demonstration zugestehen, sorgen wir dafür, dass sie zumindest ihren Ärger und ihre Haltung auf kreativere Weise zum Ausdruck bringen können. Wer in einem überfüllten Kino "FEUER!" schreit oder die Mutter des Staatschefs mit einem Explosivwort bezeichnet, kommt trotzdem ins Gefängnis."
 mex_ww1_reorganization_act: "Umstrukturierungsgesetz"
 mex_ww1_reorganization_act_desc: "Ein großer Teil unseres Territoriums war im Besitz verschiedener Gruppen und Einzelpersonen, seit die Zivilisation in unserem bescheidenen Land Einzug gehalten hat. Im Laufe der Jahrhunderte wurde jedoch ein großer Teil dieses Gebiets ineffizient angelegt oder genutzt. Durch eine Neuordnung der Ländereien und Eigentümer unseres Landes, insbesondere derjenigen, die inaktiv waren, können wir einige der neu vertriebenen Menschen in unseren Fabriken unterbringen."
 mex_ww1_full_rearmament: "Strenge Rationierung"
 mex_ww1_full_rearmament_desc: "Da unsere tapferen Helden die Nation aktiv verteidigen, sollten sie bei der Versorgung mit Lebensmitteln und Materialien oberste Priorität haben! Natürlich könnte die Zivilbevölkerung im wahrsten Sinne des Wortes ihre Bohnen zählen, und wir könnten dadurch eine unruhigere Bevölkerung haben, aber zumindest werden unsere Jungs in Uniform in nächster Zeit nicht hungern müssen."
 Mex_collectivist_ethos: "Unterstützung anderer revolutionärer Anführer"
 Mex_collectivist_ethos_desc: "Der alte Staat ist dem Untergang geweiht und wird unser Land mit sich reißen, wenn wir keine extremen Maßnahmen ergreifen. Wenn wir eine härtere Haltung einnehmen und unser Land zu einer extremeren Regierungsform führen, können wir uns und unsere nationalen Interessen in der heutigen Welt wirksam schützen."
 Mex_nationalism_focus: "Pancho Villa unterstützen"
 Mex_nationalism_focus_desc: "Pancho Villa hat einen Vorgeschmack auf die Macht in Mexiko bekommen und seinen Tonfall verschärft, indem er zu einem harten Nationalisten und Pro-Militär wurde. Vielleicht ist er der Anführer, der uns endlich über Uncle Sam erheben wird..."
 mex_militarism: "Militarismus"
 mex_militarism_desc: "Unser wachsendes Militär wird mehr und mehr zu einem Teil des täglichen Lebens unserer Nation. Glücklicherweise werden unsere Truppen derzeit von der Bevölkerung unterstützt, die sie als die Helden ansieht, die für unsere Fahne kämpfen. Diese militärische Kultur, die wir aufbauen, fördert nur die Sache unserer Streitkräfte."
 mex_military_youth: "Jugend im Militär"
 mex_military_youth_desc: "Unsere militaristische Kultur muss sogar bei den Kindern präsent sein! Indem wir den jungen Generationen Respekt vor dem Militär eintrichtern und ihnen sogar eine Ausbildung anbieten, können wir sicherstellen, dass sie aufwachsen, um sich für unser glorreiches Regime zu verpflichten. Manche mögen das als Ausbeutung bezeichnen, aber es klingt besser, wenn man sagt, dass man den Teenagern eine glänzende Zukunft bietet."
 mex_paramilitarism: "Paramilitarism"
 mex_paramilitarism_desc: "Einige Nationen sind töricht genug, bewaffnete zivile Gruppen zu verurteilen, weil sie eine Rebellion befürchten. Wenn wir jedoch darauf achten, diese Ad-hoc-Milizen auf Regimetreue zu beschränken, können wir eine weitere Gruppe wütender, bewaffneter Männer schaffen, die unsere Nation unterstützen, was uns im Falle eines Krieges zugute kommen könnte."
 mex_internationalism_focus: "Emiliano Zapata unterstützen"
 mex_internationalism_focus_desc: "Emiliano Zapatas Botschaft des extremen Sozialismus in Mexiko - der, um es ganz offen zu sagen, nichts anderes als Kommunismus ist - ist in der Tat eine populäre Botschaft, insbesondere im äußersten Süden des Landes. Seine Position zu unterstützen, könnte die Bevölkerung ein für alle Mal beruhigen, auch wenn wir uns dadurch bei den Demokratien der Welt etwas unbeliebt machen."
 mex_political_correctness: "Politische Korrektheit"
 mex_political_correctness_desc: "Jeder, der sich gegen unsere Bewegung ausspricht, begeht eindeutig ein Hassverbrechen gegen die Menschen, die wir damit unterstützen. Deshalb muss jeder, der sich gegen das Regime ausspricht, genau beobachtet und vielleicht sogar entmannt werden."
 mex_indoctrination_focus: "Indoktrination"
 mex_indoctrination_focus_desc: "Nach jahrelangen Debatten darüber, wie man ungehorsame antikommunistische Bürger dazu bringen kann, endlich unser wunderbares neues Regime zu unterstützen, schlugen einige der Männer im Arbeiterrat die Einrichtung eines neuen "Ministeriums der Liebe" vor, das offiziell die Menschen davon überzeugt, warum sie unsere Regierung unterstützen sollten. Wir sprechen nicht darüber, was dort inoffiziell passiert."
 mex_political_commissars: "Politische Kommissare"
 mex_political_commissars_desc: "Ironischerweise ist das Militär ein Ort, an dem antikommunistische Unterstützung gedeiht. Indem wir dafür sorgen, dass unsere liebevolle Regierung überall Augen hat, können wir den Dissens mit diesen Gruppen ausmerzen, bevor er entstehen kann."
 mex_ww1_unitedpeople: "Patriotischer Eifer"
 mex_ww1_unitedpeople_desc: "Eine motivierte Bevölkerung kann Großes bewirken! Indem wir unser Volk dazu inspirieren, sich um unser heiliges Banner zu scharen, können wir leicht ihre Herzen und ihren Verstand gewinnen und sie für, nun ja, alles, was wir tun wollen, mitreißen, solange wir eine vernünftige Gegenmacht haben, die wie die Guten aussieht."
 mex_ww1_massive_effort: "Massive Anstrengung"
 mex_ww1_massive_effort_desc: "Jeder Mann und jede Frau muss die Bemühungen unserer Nation unterstützen! Da das Gespenst des Großen Krieges über allen schwebt, wurde ein großartiges Programm zum Aufbau unserer industriellen Kapazitäten in Angriff genommen, um uns zu helfen, unsere meistgehassten Rivalen zu besiegen!"
 mex_ww1_fortify_city: "Zivile Befestigungen"
 mex_ww1_fortify_city_desc: "Wenn der Kampf an unsere Grenzen kommt, ist es am besten, vorbereitet zu sein. Indem wir Bauarbeiter anheuern, um in einigen unserer Außenprovinzen Festungen und Bunker zu errichten, können wir jeden Feind, der es wagt, uns anzugreifen, sicher abwehren!"
 mex_ww1_fortify_coast: "Küstenverteidigung"
 mex_ww1_fortify_coast_desc: "Eine Küstenlinie ist nicht leicht zu verteidigen. Da Schiffe in der Lage sind, Truppen fast überall an der Küste unserer Nation anzulanden, sind Küstenforts, die gegen Invasionen vom Meer aus helfen können, nicht schwer zu errichten und werden dazu beitragen, unsere Feinde zurück in den Ozean zu werfen, aus dem sie gekommen sind."
 mex_ww1_improve_our_puertos: "Unsere Marine verbessern"
 mex_ww1_improve_our_puertos_desc: "Da wir uns im Krieg befinden, bleibt unsere Marine gegenüber dem Feind schwach. Dies wird helfen, unsere Häfen zu verteidigen."
 mex_ww1_Restore_Autocracy: "Das autoritäre Regime wiederherstellen"
 mex_ww1_Restore_Autocracy_desc: "Vielleicht funktioniert dieser Demokratie-Kram ja doch nicht so gut. Madero ist ein guter Präsident, aber der Staat braucht eindeutig mehr Macht und Zentralisierung. Ein General namens Victoriano Huerta wäre vielleicht qualifiziert, der Sache auf die Sprünge zu helfen..."
 mex_ww1_Unify_all_indigenous_languages: "Alle indigenen Völker vereinen"
 mex_ww1_Unify_all_indigenous_languages_desc: "Selbst nach all den Jahren sind die vielen mittelamerikanischen Ureinwohner noch immer nicht wirklich in unsere Gesellschaft integriert worden. Können sie nicht genauso gut eine Waffe halten und abfeuern wie die Söhne von Cortez? Um unserer militärischen Arbeitskraft willen muss dieser Zustand ein Ende haben!"
 mex_support_revolucionary_forces: "Viva la Revolución (Es lebe die Revolution)"
 mex_support_revolucionary_forces_desc: "Die Kräfte der mexikanischen Öffentlichkeit haben eindeutig keine Toleranz mehr für die Diktatur, die das Land regiert. Natürlich gibt es mehrere Wege, die nach der Absetzung beschritten werden könnten..."
 mex_ww1_Take_Action: "Neu-Zentralisierung"
 mex_ww1_Take_Action_desc: "Wer braucht schon einheimische und individuelle Rechte, wenn die Regierung sie einfach alle behalten kann? Neue Gesetze, die der Regierung mehr Macht geben sollen, werden uns helfen, die Herrschaft auszuüben und eine gewisse Ordnung in diesem labilen Staat herzustellen."
 mex_ww1_preserve: "Heldentum"
 mex_ww1_preserve_desc: "Es scheint, dass mindestens ein Mann in jedem Regiment eine erstaunliche Geschichte von Tapferkeit und Intrigen in der Schlacht zu erzählen hat, einen Feind überlistet oder irgendeine erstaunliche Leistung vollbracht hat. Wenn wir diese Männer in unserer Kultur verankern und ihnen einen besonderen Platz in unseren Divisionen einräumen, werden die übrigen Truppen versuchen, denselben Erfolg nachzuahmen."
 mex_ww1_paramilitarism: "Schwerpunkt Verteidigung"
 mex_ww1_paramilitarism_desc: "Wenn Sie einen Beweis dafür sehen wollen, dass der mexikanische Staat der Kämpfe innerhalb seiner eigenen Grenzen überdrüssig ist, dann sehen Sie sich nur die Größe unserer passenden Militärrekruten an. Daraus müssen wir das Beste machen. Eine umfassende Ausbildung der zweitklassigen Truppen könnte sie auf das gleiche Niveau wie unsere regulären Soldaten bringen."
 MEX_ww1_Strengthen_military_forces: "Stärkung der Streitkräfte"
 MEX_ww1_Strengthen_military_forces_desc: "Es gibt immer noch Bereiche, in denen unsere Ausrüstung und unsere Ausbildungsmethoden verbessert werden können. Alles, um eine bessere Armee zu bekommen..."
 MEX_ww1_Recluting_the_rebels: "Amnestie für Rebellen"
 MEX_ww1_Recluting_the_rebels_desc: "Mehrere ausgebildete Männer der mexikanischen Revolution wollen nach einem langen, vergeblichen Kampf einfach nur nach Hause zurückkehren. Das können wir ihnen nicht verdenken. Aber wir können diese Fähigkeiten auch nutzen. Wenn wir diesen Veteranen im Gegenzug für ein Jahr Dienst eine sichere Heimreise garantieren, könnten wir ihre Fähigkeiten nutzen und sie davon abhalten, unsere Regierung erneut zu bekämpfen!"
 MEX_ww1_Rebuild_Mexico: "Mexiko wiederaufbauen"
 MEX_ww1_Rebuild_Mexico_desc: "Die Revolution hat viele Menschen erschüttert. Wir müssen uns von dieser Tragödie erholen!"
 MEX_ww1_Renew_the_republic: "Diaz Ruhestand"
 MEX_ww1_Renew_the_republic_desc: "Präsident Diaz hat Mexiko lange genug gedient. In seinem fortgeschrittenen Alter kann er selbst das Land, das er gewonnen hat, nicht mehr wirksam regieren. Sein Stellvertreter, Victoriano Huerta, muss ihn ablösen."
 MEX_ww1_supress_the_rebels: "Verstecke der Rebellen stürmen"
 MEX_ww1_supress_the_rebels_desc: "Wir haben Rebellen verhaftet, die im Besitz einer Kopie des Plans von San Louis waren, zusammen mit Notizen, in denen bestimmte Verstecke und Treffpunkte genannt wurden. Wunderbar! Wenn wir die Truppen losschicken, können wir jede Art von Revolution im Keim ersticken."
 MEX_ww1_support_diaz: "Porfirio Diaz unterstützen"
 MEX_ww1_support_diaz_desc: "Die Rebellen mit blutendem Herzen, die keinen Grund haben, versammeln sich immer noch gegen unsere Regierung, gegen den Wohlstand und die Sicherheit, die der Porfiriato ihnen beschert hat. Jede Unterstützung, die wir aus unserer Gesellschaft aufbringen können, um die derzeitige Regierung an der Macht zu halten, ist notwendig."
 MEX_ww1_Save_Madero: "Friedlicher Übergang"
 MEX_ww1_Save_Madero_desc: "Der wichtigste Teil des Nachweises der Legitimität unserer neuen Verfassung ist der erste Übergang der Macht. Es ist sehr wichtig, dass der nächste Präsident der rechtmäßige Eigentümer des Staates wird. Venustiano Carranza bereitet sich auf eine Kandidatur vor, und die Gewährleistung, dass er im Falle seiner Wahl die Macht übernehmen kann, wird beweisen, dass unsere Demokratie funktioniert."
 mex_ww1_subjugate_UPCA: "Wiedervereinigung von Zentralamerika"
 mex_ww1_subjugate_UPCA_desc: "Die Staaten Zentralamerikas sind schwache, zersplitterte Nationen, zu klein und anfällig für ausländische Einflüsse, um als unabhängige Länder von Wert zu sein. Um unseren Feinden diesen potenziellen Aufmarschplatz zu nehmen, müssen wir eine Zentralamerikanische Union wiederherstellen - und sei es innerhalb unserer eigenen Grenzen..."
 mex_ww1_Lessons_of_war: "Lehren des Krieges"
 mex_ww1_Lessons_of_war_desc: "Durch die Instabilität in Mexiko haben viele unserer Soldaten Kampferfahrungen gesammelt, wie sie sonst nur in Europa zu finden sind. Wenn wir das Beste daraus machen können, kann das ein schöner Silberstreif am Horizont sein."
 mex_ww1_2nd_Mexican_American_war: "Aztlan zurückgewinnen"
 mex_ww1_2nd_Mexican_American_war_desc: "Aztlán ist das Gebiet in Nordmexiko, das vor so vielen Jahren von den Estados Unidos gestohlen wurde. Wir müssen einen Anspruch auf die Region erheben, um die Rückkehr der mexikanischen Regierung in dieses Gebiet vorzubereiten. Natürlich wird der Krieg noch nicht beginnen, aber das wird uns auf den Weg der Rache bringen."
 mex_ww1_Support_the_columbus_raid: "Unterstützen Sie den Columbus-Raubzug"
 mex_ww1_Support_the_columbus_raid_desc: "Pancho Villa plant einen Überfall auf die Stadt Columbus in Neu-Mexiko, um auf dem Territorium der Yankees Verwüstung anzurichten. Wenn wir ihn ein wenig anstacheln und versorgen würden, wäre er vielleicht eher in der Lage zu operieren. Natürlich würden wir damit den Zorn von Onkel Sam auf uns ziehen, aber die US-Armee ist ja sowieso keine große Bedrohung für uns... oder?"
 mex_ww1_demand_belice: "Forderung Belize"
 mex_ww1_demand_belice_desc: "Belize ist rechtmäßig ein Teil des guatemaltekischen Territoriums, das wir jetzt besitzen. Vielleicht sollten wir das Vereinigte Königreich daran erinnern, bevor es zum Eklat kommt..."
 mex_ww1_Reconquer_the_UPCA: "Zentralamerika zurückerobern"
 mex_ww1_Reconquer_the_UPCA_desc: "Die Staaten Zentralamerikas sind schwache, zersplitterte Nationen, zu klein und anfällig für ausländische Einflüsse, um als unabhängige Länder von Wert zu sein. Um unseren Feinden diesen potenziellen Aufmarschplatz zu nehmen, müssen wir eine zentralamerikanische Union wiederherstellen - und sei es innerhalb unserer eigenen Grenzen..."
 mex_ww1_Plan_of_San_Diego: "Plan von San Diego"
 mex_ww1_Plan_of_San_Diego_desc: "Wenn wir eine Chance gegen los Estados Unidos haben wollen, müssen wir ihre Industrie, ihre Bevölkerung und ihren Willen zur Kriegsführung schwächen. Eine Reihe von Angriffen auf die Grenzstädte könnte dafür ausreichen! Natürlich brauchen wir vielleicht einen Sündenbock - ich meine, einen Freiwilligen -, der diese Aktionen durchführt. Pancho Villa scheint ein vernünftiger Anfang zu sein."
 mex_ww1_Prepare_the_reconquista: "Vorbereitung der Reconquista"
 mex_ww1_Prepare_the_reconquista_desc: "Die Demütigung von 1848 muss rückgängig gemacht werden, bevor es zu spät ist! Rufen Sie das Weiße Haus an und sagen Sie ihnen, dass die Mexikaner über die Grenze kommen werden!"
 mex_ww1_Stabilize_the_country: "Das Land stabilisieren"
 mex_ww1_Stabilize_the_country_desc: "Die Turbulenzen im Land scheinen zumindest vorübergehend vorbei zu sein. Es ist an der Zeit, die Scherben aufzusammeln und da weiterzumachen, wo wir aufgehört haben."
#--------------------------------------------------------------
# Diplomatic Tree
#=========================================================================
 mex_why_we_fight: "UNASUR Zuerst."
 mex_why_we_fight_desc: "Die Instabilität der Weltlage ist zu groß, um sie zu ertragen, und die Gefahr, dass Lateinamerika - oder, Gott bewahre, uns - etwas Schlimmes zustößt, ist zu groß, um sie zu ignorieren. Wenn wir die Unión de Naciones Suramericanas als echtes Militärbündnis gründen, wird unsere gemeinsame Stärke jeden Möchtegern-Imperialisten abschrecken. Das wird natürlich auch dafür sorgen, dass sich kein Yankee in unsere Angelegenheiten einmischt."
 mex_Invite_Argentina: "Argentinien einladen"
 mex_Invite_Argentina_desc: "Argentinien verfügt über eine solide Arbeitskräftebasis und ein gutes Militär, hat aber Probleme mit Brasilien. Wenn wir diesen Konflikt schlichten, werden wir wahrscheinlich in der Lage sein, ihre Mitgliedschaft zu sichern."
 mex_Invite_Brazil: "Brasilien einladen"
 mex_Invite_Brazil_desc: "Brasilien ist eines der führenden Länder in der südlichen Hemisphäre, aber es gibt kleinere Konflikte in der Region. Die mexikanische Diplomatie kann das lösen, und sie werden hoffentlich eine gute Ergänzung für unser Bündnis sein."
 mex_Invite_COL: "Kolumbien einladen"
 mex_Invite_COL_desc: "Kolumbien ist nicht so weit von uns entfernt, und durch seine Mitgliedschaft wird unser Bündnis fast zusammenhängend - mit der Einnahme Panamas und Mittelamerikas wird es das natürlich sein. Es liegt auf der Hand, dass die Einladung dieses Landes Priorität haben sollte."
 mex_Invite_Bolivia: "Bolivien einladen"
 mex_Invite_Bolivia_desc: "Bolivien ist nicht das fortschrittlichste oder herausragendste Mitglied der UNASUR, aber es hat seine Bereitschaft bekundet, beizutreten, und solange es einen Weg zu unserem Land gibt, warum nicht?"
 mex_technology_sharing: "Gemeinsame Technologie"
 mex_technology_sharing_desc: "Indem wir technologische Fortschritte mit unseren Verbündeten teilen, wird unsere gesamte Fraktion in der Lage sein, Forschung und Entwicklung im Krieg effizienter zu betreiben."
