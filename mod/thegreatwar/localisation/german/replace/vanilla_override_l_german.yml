l_german:
 news.128.d:0 "Die Einnahme der Deutschen Hauptstadt wurde von offiziellen Stellen in Washington bestätigt. Die Kämpfe in der Stadt wurden als heftig beschrieben, wobei die Moltke-Brücke von verzweifelten deutschen Pionieren gesprengt wurde, um den Vormarsch der Invasoren aufzuhalten.\n\nAndere Brücken über die Spree wurden schließlich gesichert, die Angreifer stürmten trotz heftigen deutschen Widerstands die Kroll-Oper und den Reichstag. Die Schlacht um Berlin ist vorbei."
 news.128.b:0 "Berlin ist gefallen"
