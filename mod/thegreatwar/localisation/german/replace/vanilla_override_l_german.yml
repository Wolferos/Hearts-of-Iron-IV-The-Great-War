 news.155.d:0 "Obwohl sich viele einen dauerhaften Frieden in Europa gewünscht haben, hat eine jüngste Wendung der Ereignisse das Deutsche Reich erneut auf den Weg in den Krieg gebracht. Die deutschen Truppen sind mobilisiert und bereit zum Angriff."
 news.155.a:0 "Dies könnte der Beginn eines weiteren Krieges sein."
