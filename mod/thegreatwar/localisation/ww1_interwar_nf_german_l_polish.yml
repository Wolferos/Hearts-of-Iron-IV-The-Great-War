 #--------------------------------------------------------------
 # [GERMAN EMPIRE] Interwar
 #=========================================================================
 GER_int_beer_hall_putsch_succeeds:0 "Beer Hall Putsch"
 GER_int_beer_hall_putsch_succeeds_desc:0 "Hitler has become the leader of the National Socialist party, and is stirring up trouble in Munich. Getting rid of him would be great for the stability of the Weimar Republic. Giving him a good opportunity to shoot off and try a coup may give us the opportunity to get rid of him. Of course, we DO run the risk of his success..."

 GER_int_the_locarno_traties:0 "The Locarno Treaties"
 GER_int_the_locarno_traties_desc:0 "We realized that France deeply desired a British guarantee of its postwar borders. We can make an effort to preserve peace."
 GER_int_mein_kampf:0 "Mein Kampf"
 GER_int_mein_kampf_desc:0 "Hitler's time in prison has given him the opportunity to write a long book about his life and ideology. Allowing its publication and spread may calm the growing movement. And hopefully not keep spreading it."
 GER_int_hitler_chancellor:0 "Name Hitler Chancellor of Germany"
 GER_int_hitler_chancellor_desc:0 "Chancellor von Papen has advised President Hindenburg to give Hitler his post. So long as the President was alive and able to keep his power, Hitler shouldn't be able to exercize true control, and will burn himself out. Yet, this is a serious risk...but may avert Civil War."

 GER_int_promote_fedor_von_bock:0 "Promote Fedor von Bock"
 GER_int_promote_fedor_von_bock_desc:0 "Fedor von Bock served as a battalion commander in 1916 and was decorated with Pour le Mérite, German Empire's highest military decoration. In the 1920s, Bock was together with Kurt von Schleicher, Eugen Ott, and Kurt von Hammerstein-Equord a member of a secret group known as Sondergruppe R, selected by and responsible to Hans von Seeckt, who were in charge of helping Germany evade the Part V of the Treaty of Versailles, which had disarmed Germany."

 GER_int_night_long_knives:0 "Night of the Long Knives"
 GER_int_night_long_knives_desc:0 "Now that the new Reich has taken over, the old enemies must be purged. Anyone who could potentially ever even be against the Reich must be purged- and quickly!"
 ############################################################################################
 interwar_hitler_putsch_success:0 "Beer Hall Putsch Succeeded"
 interwar_hitler_putsch_fail:0 "Beer Hall Putsch Failed"
 ############################################################################################

 ############################################################################################
 GER_int_reichstag_fire_decree:0 "Reichstag Fire Decree"
 GER_int_reichstag_fire_decree_desc:0 "The Reichstag Fire Decree (Reichstagsbrandverordnung) is the common name of the Decree of the Reich President for the Protection of People and State issued by German President Paul von Hindenburg on the advice of Chancellor Adolf Hitler in immediate response to the Reichstag fire. The decree nullified many of the key civil liberties of German citizens."

 GER_int_crush_the_spartacists:0 "Crush the Spartacists"
 GER_int_crush_the_spartacists_desc:0 "We must let the Freikorps soldiers attack the Spartacists."

 GER_int_alte_kameraden:0 "Alte Kameraden"
 GER_int_alte_kameraden_desc:0 ""

 GER_int_contact_trotsky:0 "Contact Trotsky"
 GER_int_contact_trotsky_desc:0 ""

 GER_int_empower_liebknechtand_luxemburg:0 "Liebknecht and Luxemburg are German Martyrs"
 GER_int_empower_liebknechtand_luxemburg_desc:0 ""
