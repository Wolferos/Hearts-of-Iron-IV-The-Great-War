l_german:
## Politische Bemühungen # Übersetzt von Proho  ###
 SOV_ww1_recover_after_civwar:0 "Land wiederherstellen"
 SOV_ww1_recover_after_civwar_desc:0 "Der jahrelange Konflikt mit den Triplizen hat nur zu einem entsetzlichen Massaker an unserer Jugend und einer beispiellosen Verwüstung der ländlichen Gebiete geführt. Wir haben eine Liste der wichtigsten Maßnahmen zusammengestellt, die jetzt ergriffen werden müssen, um den langen und kostspieligen Wiederaufbau in Angriff zu nehmen."
 SOV_ww1_political_effort:0 "Politische Bemühungen"
 SOV_ww1_political_effort_desc:0 "Der Aufbau einer völlig neuen Kommunistischen Nation wird jeden guten Willen erfordern. Wir müssen die besten unserer Redner und die einflussreichsten Parteiführer zusammenbringen, um eine starke politische Bewegung zu schaffen."
 SOV_ww1_defend_revolution:0 "Verteidigung der Revolution"
 SOV_ww1_defend_revolution_desc:0 "Des milliers de gens sont morts pour mener à bien le rêve révolutionnaire. Nous avons la responsabilité morale et politique de défendre cet acquis contre les agresseurs intérieurs et extérieurs !"
 SOV_ww1_volunteers:0 "Nationaler Aufruf für Freiwillige"
 SOV_ww1_volunteers_desc:0 "Unseren Armeen fehlt es an fast allem, aber die erste Ressource sind die Brüste unserer Soldaten!Wir müssen jetzt eine Kampagne organisieren, um Freiwillige zur Verteidigung des Landes aufzurufen, damit wir schon morgen neue Bataillone aufstellen können!"
 SOV_ww1_execute_imperial_family:0 "Hinrichtung der Kaiserlichen Familie"
 SOV_ww1_execute_imperial_family_desc:0 "Es ist kein Geheimnis, dass die Weißen vor allem versuchen, die Familie Romanow wieder auf den Kaiserthron zu bringen.Wir haben sie in einer kleinen Villa in der Nähe von Jekaterinburg eingesperrt ... aber unsere neuesten Informationen deuten darauf hin, dass der Feind etwas versuchen könnte, um sie freizubekommen. Es gibt nur eine Lösung, um das Problem endgültig loszuwerden."
 SOV_ww1_claim_victory:0 "Sieg beanspruchen"
 SOV_ww1_claim_victory_desc:0 "Wir gewinnen an allen Fronten! Natürlich gibt es immer noch Widerstand, aber unser endgültiger Sieg steht außer Frage, und zwar gegen alle Widerstände.Wir können der Welt verkünden, dass wir als Sieger aus diesem Krieg hervorgegangen sind!"
 SOV_interwar_SupportSovietMongolia:0 "Mongolische Revolutionäre unterstützen"
 SOV_interwar_SupportSovietMongolia_desc:0 ""
 SOV_interwar_MongolianRevolution:0 "Mongolische Revolution"
 SOV_interwar_MongolianRevolution_desc:0 ""
 SOV_ww1_complete_revolution:0 "Revolution vollenden"
 SOV_ww1_complete_revolution_desc:0 "Die sozialistische Revolution ist nur noch wenige Schritte vom Endziel entfernt! Wenn wir unsere Doktrin bis zum Ende durchsetzen, ohne Kompromisse und Debatten, werden wir einen hundert Jahre alten Traum verwirklichen: eine große Weltmacht zu schaffen, in der Bauern und Arbeiter den ersten Platz einnehmen und den gerechten Ertrag ihrer Arbeit erhalten, ohne unter kapitalistischer Unterdrückung zu leiden!"
 SOV_ww1_soviet_constitution:0 "Sowjetische Verfassung"
 SOV_ww1_soviet_constitution_desc:0 "Genosse Kalinin ließ die brandneue Verfassung, die die Ukraine, Weißrussland, Transkaukasien und Russland unter dem Banner der Union der Sozialistischen Sowjetrepubliken vereinen wird, durch den Ausschuss genehmigen. Dies wird die politische Grundlage unseres Landes sein."
 SOV_ww1_foster_new_values:0 "Neue Werte fördern"
 SOV_ww1_foster_new_values_desc:0 "Wir haben uns mit Nachrichtenagenturen und Kommunikationsspezialisten in Verbindung gesetzt; wir können bereits morgen ein Propagandaprogramm aufstellen, das die Werte der Gleichheit und Solidarität, die wir fördern wollen, hervorhebt."
 SOV_ww1_SWP:0 "Soziale Wohlfahrtsprogramme annehmen"
 SOV_ww1_SWP_desc:0 "Freiheit, Gleichheit und vor allem Solidarität: Wir müssen denjenigen, die Hilfe benötigen, eine substanzielle Unterstützung zukommen lassen, und nach diesen so schwierigen Jahren sind es weiß Gott viele..."
 SOV_ww1_workers_paradise:0 "Arbeiterparadies"
 SOV_ww1_workers_paradise_desc:0 "Jahrzehnte der erzwungenen Industrialisierung und der unverschämten Freiheit, die den Kapitalisten gewährt wurde, haben die Arbeiter nur ärmer gemacht und ihnen das Leben zur Hölle gemacht. Wir werden die Produktionsmittel kollektivieren und den Arbeitern das Land und die Werkzeuge zurückgeben, bevor wir jedem den gerechten und fairen Ertrag seiner Arbeit sichern!"
 SOV_ww1_support_mensheviks:0 "Unterstützung der Menschewiki"
 SOV_ww1_support_mensheviks_desc:0 "Genosse Julius Martow vertritt die Vision eines kommunistischen Russlands, in dem jeder seine Stimme hat, eine Partei, die von der Masse gebildet wird. Dies würde uns eine beispiellose Legitimität des Volkes verschaffen, die weit über die Vorstellung des Genossen Lenin hinausgeht..."
 SOV_ww1_support_bolsheviks:0 "Unterstützung der Bolschewiki"
 SOV_ww1_support_bolsheviks_desc:0 "Genosse Lenin vertritt seinerseits die Vision einer sozialistischen Republik, die von einer Partei professionalisierter revolutionärer Kader geführt wird! Dies wäre auf lange Sicht eine interessantere Wahl, die uns einen starken Staat und große Mittel sichern würde, die für den Erfolg des Sozialismus eingesetzt werden."
 SOV_ww1_establish_cheka:0 "Gründung der Tscheka"
 SOV_ww1_establish_cheka_desc:0 "Wir müssen eine politische Polizei aufbauen, um das Regime zu bestätigen und die abweichenden Elemente zu überwachen. Felix Edmundowitsch Dserschinski ist der geeignete Mann, um sie zu leiten."
 SOV_ww1_red_terror:0 "Der Rote Terror"
 SOV_ww1_red_terror_desc:0 "Dserschinski und Kamenew sind formell. Um zu siegen und unsere Autorität zu behaupten, müssen wir rücksichtslos sein. Wir müssen maximale Unterdrückung der untersten Elemente zulassen, Exekutionen und Inhaftierungen erlauben - und vor dem Rest die Augen verschließen."
 SOV_ww1_gulag:0 "Den GULAG einrichten"
 SOV_ww1_gulag_desc:0 "Die Zaren hatten die Angewohnheit, widerspenstige Menschen in den Osten Sibiriens zu schicken, sozusagen um sie zu verbannen. Warum sollte man diese Idee nicht aufgreifen und ausreizen, indem man dort Arbeitslager errichtet, in denen die Feinde der Revolution arbeiten können, ohne andere anzustecken?"
 SOV_ww1_end_revolution:0 "Ende der Revolution"
 SOV_ww1_end_revolution_desc:0 "Die Volks- und Sozialrevolution ist vollendet! Die Imperialisten wurden zerschlagen, und die Tyrannen sind nicht mehr. Wir müssen nun die Revolution vollenden, die großen Prinzipien, die sie verlangt, annehmen und die soziale Ordnung zurückbringen, um die neue Nation aufzubauen."
 SOV_ww1_liberty:0 "Freiheit umarmen"
 SOV_ww1_liberty_desc:0 "Welchen Sinn hat eine Revolution, wenn wir die autoritären Mechanismen der alten Welt reproduzieren? Es gibt keine strahlende Zukunft ohne die Freiheit, die den Menschen gegeben wird! Lassen Sie uns unsere Vision bis zum Ende annehmen und sicherstellen, dass jeder Mann und jede Frau frei in ihren Entscheidungen, Mitteln und Handlungen ist!"
 SOV_ww1_strengthen_duma:0 "Die Duma stärken"
 SOV_ww1_strengthen_duma_desc:0 "Das Volk will mehr Legitimität und Repräsentativität, das ist unbestreitbar und wird sich auch nicht mehr ändern. Um diesen Willen widerzuspiegeln, muss das Unterhaus des russischen Parlaments, die Duma, gestärkt werden, indem die Zahl ihrer Abgeordneten erhöht und ihre Vorrechte sowie ihr Gewicht in der Regierung gestärkt werden."
 SOV_ww1_authority:0 "Autorität anerkennen"
 SOV_ww1_authority_desc:0 "Die unruhigen Zeiten, in denen wir uns befinden, erfordern eine starke Macht, die mächtig und autoritär genug sein muss, um die Hindernisse, die sich ergeben werden, umzuwerfen. Die Zeit für Demokratisierung und Dezentralisierung wird später kommen."
 SOV_ww1_imperial_glory:0 "Wiederherstellung der kaiserlichen Herrlichkeit"
 SOV_ww1_imperial_glory_desc:0 "Es war dumm von uns, Jahrhunderten der Macht und des internationalen Einflusses den Rücken zu kehren. Das Erbe der Zaren und der antiken Kiewer Rus' ist ein unverzichtbares Fundament unserer Nation, und darauf werden wir unsere neue Politik aufbauen, sowohl innen- als auch außenpolitisch."
 SOV_ww1_end_heretical_rule:0 "Ketzerische Herrschaft beenden"
 SOV_ww1_end_heretical_rule_desc:0 "Vergessen wir nicht, dass St. Petersburg auch der Sitz des Dritten Roms ist! Lassen Sie uns Gott an den Platz zurückbringen, der ihm zusteht, damit wir selbst unseren Platz zu seiner Rechten haben. Der Eifer des Volkes wird diese Entscheidung zweifellos begrüßen."
 SOV_ww1_new_russia:0 "Neues Russland"
 SOV_ww1_new_russia_desc:0 "Was wir tun, ist schlicht und einfach eine neue Nation zu gründen. Ein neues Russland, eine starke und neue Macht, die den Weg für zukünftige Generationen ebnen wird. Wir müssen unsere politische Doktrin stärken, um dieses Konzept viel stärker zu betonen. Das Russland, das wir aufbauen, ist nicht mehr das Russland der Vergangenheit."
 SOV_ww1_invite_romanovs:0 "Die Romanows zur Rückkehr einladen"
 SOV_ww1_invite_romanovs_desc:0 "Es gibt noch lebende Romanows; glücklicherweise sind nicht alle von ihnen im Kugelhagel der Revolutionäre umgekommen. Schicken wir ihnen eine Botschaft, in der wir sie offiziell bitten, an die Macht zurückzukehren. Die Zeit ist reif und sie sind der letzte Schliff, der unser Land wieder auferstehen lässt."
 ##### Diplomatische Bemühungen #####
 SOV_ww1_diplomatic_effort:0 "Diplomatische Bemühungen"
 SOV_ww1_diplomatic_effort_desc:0 "In der heutigen Welt wird es immer schwieriger, neutral zu bleiben. Unser diplomatisches Korps drängt uns immer wieder, in den sich entwickelnden Machtkämpfen Stellung zu beziehen oder unsere Neutralität offiziell zu erklären. Wir können die Frage noch nicht beantworten, aber wir können unseren Diplomaten leicht die Mittel an die Hand geben, um eine dieser Optionen zu wählen."
 SOV_ww1_respect_treaty:0 "Den Vertrag respektieren"
 SOV_ww1_respect_treaty_desc:0 "Der in Brest-Litowsk geschlossene Vertrag ist sehr streng, und wir hätten ihn so sicher nicht unterzeichnet, aber wir müssen damit leben. Die Einhaltung dieses Dokuments wird die Befriedung unserer Außenbeziehungen und die Respektabilität des neuen Regimes sicherstellen. Beeilen wir uns, die noch ausstehenden Schulden zu begleichen, und es wird Geschichte sein."
 SOV_ww1_break_treaty:0 "Den Vertrag brechen"
 SOV_ww1_break_treaty_desc:0 "Der 1918 in Brest-Litowsk geschlossene Vertrag war nur ein großer Scherz, den der Zar zum Abschluss eines entsetzlich schlecht geführten Krieges einräumte. Er zwang uns, den Osmanen und Österreich-Deutschen viel zu viel Land und fast 100 Tonnen Gold abzutreten! Es ist zu spät, die Länder, die uns entglitten sind, zu annektieren, aber wir können die Blutung noch eindämmen. Lassen Sie uns bekannt geben, dass wir alle Zahlungen einstellen."
 SOV_ww1_restore_order:0 "Ordnung wiederherstellen"
 SOV_ww1_restore_order_desc:0 "Die Revolution und der darauf folgende Bürgerkrieg haben im ganzen Reich zu zahlreichen Unruhen geführt und die öffentliche Gewalt mancherorts fast zum Erliegen gebracht. All diesem Chaos muss ein Ende gesetzt werden, gegen Ausschreitungen, Korruption und Chaos muss hart durchgegriffen werden."
 SOV_ww1_collectivisation:0 "Kollektivierung"
 SOV_ww1_collectivisation_desc:0 "Wir müssen jetzt mit der Kollektivierung des Landes beginnen, das ist einer der wichtigsten Schritte in der kommunistischen Revolution. Indem wir alles Land konfiszieren, um es durch die Zuweisung an Kolchosen und Sowchosen neu zu organisieren, werden wir die Produktion steigern und die tyrannische Herrschaft der Kulaken abschaffen. Und so viel zu den Unzufriedenen - sie werden sich daran gewöhnen."
 SOV_ww1_rebuild_industry:0 "Wiederaufbau unserer Industrie"
 SOV_ww1_rebuild_industry_desc:0 "Durch den jahrelangen Bürgerkrieg sind viele Unternehmen, Fabriken und Fließbänder verwahrlost, die durch den Krieg auf eine sehr harte Probe gestellt wurden, da sie notorisch unzureichend sind. Es muss viel Kapital in diesen Sektor investiert werden, um ihre wirtschaftliche Erholung zu organisieren und neue Betriebe zu gründen."
 SOV_ww1_siberian_development:0 "Entwicklung Sibiriens"
 SOV_ww1_siberian_development_desc:0 "Sibirien ist weit weg, riesig, sehr reich ... und praktisch leer! Ermutigen wir Familien, dorthin auszuwandern, und investieren wir, um dieses riesige Gebiet zu erschließen. Straßen, Eisenbahnlinien, Häfen, Wohnungen - wir brauchen alles!"
 SOV_ww1_revanshism:0 "Revanchismus"
 SOV_ww1_revanshism_desc:0 "Wer hat diesen dummen Krieg gegen die kapitalistischen Mächte Deutschland und Österreich verloren? Sicherlich nicht wir! Das ist die Niederlage des Zaren, die Niederlage der Imperialisten, die Schande der Tyrannen! Wir müssen zeigen, dass wir diese Niederlage nicht akzeptieren und dass die neue Macht ihrerseits im Falle eines Konflikts keinen militärischen Affront dulden wird."
 SOV_ww1_asian_claims:0 "Unsere Ansprüche in Asien durchsetzen"
 SOV_ww1_asian_claims_desc:0 "Die jüngste Revolution darf nicht vergessen lassen, dass wir immer noch Ansprüche auf die Pazifikinseln sowie auf die Mandschurei haben. Wir sollten diese Ansprüche auf diplomatischem Wege bekräftigen, damit unsere Nachbarn sie im Hinterkopf behalten."
 SOV_ww1_eastern_defenses:0 "Unsere östliche Verteidigung vorbereiten"
 SOV_ww1_eastern_defenses_desc:0 "Wir wissen nicht, wann der nächste Krieg ausbrechen wird, aber er wird ausbrechen. Ob Chinesen, Japaner oder sonst jemand, sie werden uns angreifen, und wir müssen darauf vorbereitet sein. Also müssen wir zusätzliche Mittel bereitstellen, um unsere Verteidigung im Fernen Osten vorzubereiten, indem wir unsere Infrastruktur und unsere Lager verstärken."
 SOV_ww1_revenge_japan:0 "Rache an Japan"
 SOV_ww1_revenge_japan_desc:0 "Auch wenn die Niederlage dem Zaren anzulasten ist, haben wir den katastrophalen Krieg von 1904-1905 gegen die Japaner nicht vergessen. Wir werden diese Schmach blutig abwaschen und unsere Position an den Ufern des Pazifiks erneut bekräftigen!"
 SOV_ww1_finland_intervention:0 "Leningrad sichern"
 SOV_ww1_finland_intervention_desc:0 "Die ehemalige Hauptstadt der Zaren ist eine wunderschöne Stadt, aber sie liegt sehr ungünstig am Ende eines Golfs, kaum eine Autostunde von Finnland entfernt und ganz in der Nähe unserer westlichen Nachbarn! Die Verteidigung Leningrads muss jetzt verstärkt werden, um zu verhindern, dass die Stadt im Falle eines Konflikts zu früh eingenommen wird."
 SOV_ww1_ukraine_war:0 "Ukrainisch-Sowjetischer Krieg"
 SOV_ww1_ukraine_war_desc:0 "La République socialiste soviétique d'Ukraine est une réalité, mais elle ne nous est pas complètement inféodée, et elle est encore incapable de contrôler entièrement son propre territoire. Il faut mobiliser les forces de l'armée rouge au sud, et les engager à fond en Ukraine afin de régler le problème définitivement !"
 SOV_ww1_poland_war:0 "Polnisch-Sowjetischer Krieg"
 SOV_ww1_poland_war_desc:0 "Die Polen sind eine Bedrohung für uns, eine Bedrohung, die es ohne die verheerende Niederlage der Zaristen gegen Deutschland nicht gegeben hätte! Und jetzt bedrohen sie unsere Revolution. Wie Genosse General Michail Tuchatschewski erklärt, befindet sich auf der Leiche des weißen Polens der Weg zur Weltrevolution. Marschieren wir auf Vilno, Minsk und Warschau!"
 SOV_ww1_third_international:0 "Die Dritte Internationale"
 SOV_ww1_third_international_desc:0 "Das ist die erste und wichtigste Lektion von Marx und Engels: Proletarier aller Länder, vereinigt euch! Nun, genau das werden wir tun, indem wir den Zusammenschluss aller kommunistischen Parteien in einer Dritten Arbeiterinternationale herbeiführen, die gegen die Imperialismen kämpft und die Verbreitung der Revolution in der ganzen Welt fördert."
 SOV_ww1_europe_revolution:0 "Export der Revolution nach Europa"
 SOV_ww1_europe_revolution_desc:0 "Die sozialistischen Ideen wurden im Herzen des alten Europas geboren! Da wir die ersten sind, die sie in die Tat umgesetzt haben, ist es an uns, in den westlichen Ländern kommunistische Bestrebungen zu wecken."
 SOV_ww1_asia_revolution:0 "Export der Revolution nach Asien"
 SOV_ww1_asia_revolution_desc:0 "Der Orient ist ein Land mit sklerotischen und konservativen Traditionen, die in jahrtausendealten Monarchien gefangen sind. Unsere Informationen bestätigen uns jedoch, dass revolutionäre Ideen dennoch ihren Weg finden. Wir können die Bildung lokaler politischer Parteien unterstützen."
 SOV_ww1_americas_revolution:0 "Export der Revolution nach Amerika"
 SOV_ww1_americas_revolution_desc:0 "Es gibt keinen schlimmeren kapitalistischen Albtraum auf der Erde als dieses Land, in dem die Reichen die Arbeiter schamlos ausbeuten. Wir müssen diskret Agenten dorthin delegieren, um unsere Ideen zu fördern und Arbeiter & Bauern zu vereinen."
 SOV_ww1_contact_french:0 "Die Franzosen kontaktieren"
 SOV_ww1_contact_french_desc:0 "Die Franzosen sind unsere Verbündeten und können uns sicherlich die Hilfe leisten, die wir derzeit dringend benötigen. Sie haben selbst Forderungen, die wir erleichtern könnten, um ihre Hilfe auszuhandeln."
 SOV_ww1_prepare_people:0 "Unsere Leute vorbereiten"
 SOV_ww1_prepare_people_desc:0 "Die Zeiten, in denen wir leben, sind unsicher, und die Bedrohungen sind vielfältig. Jeder Sowjetbürger muss bereit sein, hart zu arbeiten und notfalls zu den Waffen zu greifen, um das gefährdete Vaterland zu schützen. Lassen Sie uns eine wirksame Propagandakampagne finanzieren, um das Volk vor diesem Zustand zu warnen."
 SOV_ww1_rejoin_entente:0 "Wiedereintritt in Entente"
 SOV_ww1_rejoin_entente_desc:0 "Es kostet uns einiges, auch nur in Erwägung zu ziehen, offen imperialistischen Ländern beizutreten, aber wir müssen pragmatisch sein. Wenn wir in der jetzigen Situation nichts unternehmen, um die Tripel-Allianz zu besiegen, wird es später noch schlimmer, wenn sie gewonnen haben! Nehmen wir Kontakt mit der Entente auf und lassen sie wissen, dass wir bereit sind, unsere Kräfte mit den ihren zu vereinen."
 SOV_ww1_revenge_germany:0 "Rache an Deutschland"
 SOV_ww1_revenge_germany_desc:0 "Die imperialistischen Ansprüche des Kaisers haben Hunderttausende von Opfern gefordert! Und obwohl wir beschlossen haben, die Zaren loszuwerden, haben wir nicht vergessen, wer der Feind ist. Die Niederlage von 1917 muss gerächt werden!"
 SOV_ww1_persia_revolution:0 "Export der Revolution nach Persien"
 SOV_ww1_persia_revolution_desc:0 "Persien ist schwach, sklerotisch und vom Konservatismus untergraben. Es ist voll von Bauern und Arbeitern, die nur auf einen Auslöser warten, um sich ihrerseits zusammenzuschließen, Komitees zu gründen und die Macht zu beanspruchen. Wir sollten unsere Revolution zu ihnen exportieren, indem wir einige Emissäre und Aktivisten zu ihnen schicken, die ihnen unsere Ideen vorschlagen."
 SOV_ww1_support_jangali:0 "Unterstützung der Jangali-Partisanen"
 SOV_ww1_support_jangali_desc:0 "Die persischen Arbeiter haben sich ihrerseits gegen das Joch des Tyrannen erhoben, das sie seit Jahrhunderten erdulden. Und sie brauchen dringend unsere Hilfe, sei es in Form von Waffen, Geld oder Menschen. Die persischen Revolutionäre haben bereits eine lokale kommunistische Arbeiterpartei gegründet, die ihre Interessen mit unseren in Einklang bringt. Wir sollten mit ihr Kontakt aufnehmen und enge Beziehungen aufbauen, denn wenn ihre Revolution erfolgreich ist, wird ihr Land unser Verbündeter sein."
 ##### Generic Tree #####
 SOV_ww1_army_effort:0 "Die Rote Armee gründen"
 SOV_ww1_army_effort_desc:0 "Der Rat der Volkskommissare hat ein Dekret über die Schaffung einer Roten Armee der Arbeiter und Bauern vorbereitet, die Millionen von tapferen Männern unter dem kommunistischen Banner vereinen wird, bereit, den sozialistischen Traum zu verteidigen. Es muss nur noch unterschrieben werden."
 SOV_ww1_trenchwarfare:0 "Schwerpunkt Grabenkämpfe"
 SOV_ww1_trenchwarfare_desc:0 "Seit Gatling und Maxim ihre unheiligen Waffen der Kriegsführung eingeführt haben, ist unsere Nation sehr an Strategien interessiert, die auf der Verteidigung von Grabenlinien beruhen, die erstmals im amerikanischen Bürgerkrieg beobachtet wurden. Wir müssen Experten für diese Theorie suchen - sowohl Feld- als auch Sesselgeneräle -, um unser Wissen über die Landdoktrinen von morgen zu erweitern."
 SOV_ww1_artillery_effort_1:0 "Artillerie Einsatz"
 SOV_ww1_artillery_effort_1_desc:0 "Ein Schritt zur Erweiterung unseres jungen militärischen Modernisierungsprogramms ist die Weiterentwicklung unserer Artilleriebatterien. Die Suche nach Konstrukteuren für neue Waffen ist ein logischer erster Schritt, und sobald unser Projekt abgeschlossen ist, erwarten wir, dass wir die Vorteile eines leicht zu konstruierenden neuen Artilleriegeräts nutzen können."
 SOV_ww1_artillery_effort_2:0 "Artillerie Einsatz II"
 SOV_ww1_artillery_effort_2_desc:0 "Da wir nun einige fähige Artilleriekonstrukteure um uns versammelt haben, erscheint es logisch, ihre Bemühungen mit eigenen Fabriken zu unterstützen. Indem wir diese Männer als Vollzeit-Konstrukteure und Ingenieure einsetzen und ihnen Arbeiter unterstellen, können wir auf dem Gebiet der Artillerie leicht Fortschritte erzielen."
 SOV_ww1_artillery_effort_3:0 "Artillerie Einsatz III"
 SOV_ww1_artillery_effort_3_desc:0 "Feldtests erweisen sich als ein großes Problem mit unseren Artilleriegeschützen: Die große Vielfalt an Kalibern, die wir für die verschiedenen Bereiche und Modelle der Artillerie verwenden, erweist sich als kostspieliges Unterfangen und verringert die Effektivität unserer Kanonen auf dem Feld. Indem wir einige Standardgrößen für unsere Geschütze durchsetzen, können wir neue Artilleriemodelle herstellen, die uns im wahrsten Sinne des Wortes mehr Leistung für unser Geld bieten."
 SOV_ww1_artillery_effort_4:0 "Artillerie Einsatz IV"
 SOV_ww1_artillery_effort_4_desc:0 "Obwohl man glaubte, dass die Feldkanone mit Direktbeschuss vom Schlachtfeld verschwinden würde, fordern unsere Quartiermeister immer mehr dieser leichten Geschütze an, anstatt nur mehr Haubitzen und Belagerungsgeschütze zu verlangen. Die Konzentration unserer Bemühungen auf neue Direktfeuer-Geschütze und vielleicht mehr Geschosse zum Ausgleich werden nicht nur unweigerlich zu besseren Modellen führen, sondern vielleicht auch zu einigen unerwarteten Vorteilen in anderen Bereichen..."
 SOV_ww1_special_forces:0 "Schwerpunkt Spezialkräfte"
 SOV_ww1_special_forces_desc:0 "Trotz all ihrer Schrecken hat uns die chemische Kriegsführung rein zufällig eine Klasse von unglaublich disziplinierten Truppen mit blitzschneller Reaktionszeit beschert, die den anderen Gruppen in unserer Armee überlegen ist. Diese Männer scheinen recht nützlich zu sein, um als Marines, Gebirgsjäger und andere widerstandsfähige Klassen von Infanteristen zu agieren, die über das Kaliber des Standardschützen hinausgehen. Die Suche nach diesen Männern und guten Offizieren für sie könnte zu sehr viel effektiveren Spezialeinheiten führen. Wenn es nur eine Möglichkeit gäbe, sie schneller in die Schlacht zu schicken, wie die Kavallerie in den alten Tagen..."
 SOV_ww1_army_motorization_focus:0 "Schwerpunkt Motorisierung"
 SOV_ww1_army_motorization_focus_desc:0 "Einige unserer Genies im Generalstab - oder vielleicht auch nur Männer, die von den Pattsituationen in den Schützengräben die Nase voll haben - haben vorgeschlagen, Fahrzeuge speziell für den Truppentransport in Serie zu produzieren, die es unseren Männern ermöglichen würden, schneller zu den Schlachtfeldern und wieder zurück zu gelangen - und vielleicht auch drum herum. Natürlich erfordert selbst dieser einfache Akt eine spezielle Ausrüstung und Ausbildung, was eine Investition bedeutet, die sich jedoch leicht auszahlen könnte."
 SOV_ww1_doctrine_effort:0 "Doktrin Anstrengung"
 SOV_ww1_doctrine_effort_desc:0 "Obwohl die Ära des Generalstabs, der sich aus den Fürsten des Reiches zusammensetzte, schon lange vorbei ist, wurden mehrere unserer Generäle und andere hochrangige Offiziere nicht aufgrund ihrer Fähigkeiten, sondern aufgrund von Beziehungen oder Familienbanden für unsere Armeen ausgewählt. Das hält sie zwar loyal, aber andere Nationen beginnen, ihre eigenen Spitzenkräfte ernster zu nehmen und ihnen Konkurrenz zu machen. Wir müssen damit beginnen, Ernennungen aufgrund von Verdiensten vorzunehmen - auch wenn wir hoffentlich immer noch nicht zu viel des gemeinen Gesindels in den geschätzten Generalstab lassen..."
 SOV_ww1_doctrine_effort_2:0 "Doktrin Anstrengung II"
 SOV_ww1_doctrine_effort_2_desc:0 "Obwohl unser Generalstab jetzt durch und durch leistungsorientiert ist, sind sie vielleicht nicht die Einzigen, die bei unseren Militärdoktrinen helfen können. Eine Klasse von Männern, die seit dem frühen 19. Jahrhundert größtenteils in der Versenkung verschwunden ist - die reinen Militärtheoretiker - beginnt wieder aufzutauchen. Obwohl viele dieser Männer nur über begrenzte Kampferfahrung verfügen, können ihre Studien über den Krieg nicht ignoriert werden. Ihre Integration in unseren Stab könnte sich als vorteilhaft für unsere Militärtaktik erweisen."
 SOV_ww1_doctrine_effort_3:0 "Doktrin Anstrengung III"
 SOV_ww1_doctrine_effort_3_desc:0 "Eines unserer wichtigsten Elemente der Kriegsführung wurde bisher weitgehend ignoriert: Die Logistik. Da wir uns so sehr auf die Fähigkeiten der Truppen im Kampf konzentrieren, müssen wir sicherstellen, dass sie rechtzeitig ankommen und zumindest über Nahrung, Wasser und eine Waffe verfügen. Wenn wir den Experten in diesem Bereich eine Stimme geben und die Fahrer von Versorgungsfahrzeugen besser ausbilden würden, hätte dies nicht nur unmittelbare Vorteile für unsere Landstreitkräfte, sondern vielleicht auch zusätzliche Vorteile für die Zukunft."
 SOV_ww1_equipment_effort:0 "Ausrüstung Einsatz"
 SOV_ww1_equipment_effort_desc:0 "Unsere Generäle sind nicht die einzige alte Garde, die unser Militär im letzten Jahrhundert hält. Unsere Quartiermeister haben immer noch einige der militärischen Probleme des 19. Jahrhunderts hinter sich, wie Korruption und Abwesenheit. Durch die Auswahl der beliebtesten und erfahrensten Offiziere können wir vor allem die Fehler unserer aktuellen Waffen kennenlernen, so dass wir schneller korrigierte und verbesserte Entwürfe produzieren können - und außerdem sicherstellen, dass diese Männer nicht zu beliebt werden!"
 SOV_ww1_equipment_effort_2:0 "Ausrüstung Einsatz II"
 SOV_ww1_equipment_effort_2_desc:0 "Unsere neuen Quartiermeister haben uns nicht nur um neuere Gewehre gebeten, sondern auch um neuere Unterstützungswaffen. Die Erfahrung mit dieser Armee neuen Typs hat zu Ideen wie leichteren Maschinengewehren, Grabenmörsern und Gewehrgranaten geführt, die allesamt recht nützlich zu sein scheinen, solange wir die richtigen Leute für ihre Entwicklung und Herstellung gewinnen können."
 SOV_ww1_equipment_effort_3:0 "Ausrüstung Einsatz III"
 SOV_ww1_equipment_effort_3_desc:0 "Die Quartiermeister haben in einem Schreiben mehr Gewehre gefordert, die für die Bedingungen in den Schützengräben ausgerüstet sind - Gewehre, die Gewehrgranaten abfeuern, Bajonette oder Zielfernrohre aufsetzen können, und mehr Karabiner. Obwohl wir einfach mehr Gewehre produzieren könnten, scheint es logisch zu sein, unsere Gewehre auf den Standard zu bringen, dass sie all diese Dinge tun können - was ein neues, verbessertes Design bedeutet."
 SOV_ww1_equipment_effort_4:0 "Ausrüstung Einsatz IV"
 SOV_ww1_equipment_effort_4_desc:0 "Unsere Quartiermeister haben uns leider eine weitere Liste von Forderungen geschickt. Glücklicherweise haben wir unsere Postmeister angewiesen, jede weitere Post von ihnen zu ignorieren. Ihre letzte Forderung ist neue Ausrüstung für unser Pionierkorps - neue Karabinermodelle, neue Werkzeuge und vielleicht die neuen Flammenwerfer, die so bald wie möglich in Auftrag gegeben werden sollen. Natürlich könnte die Erweiterung des Ingenieurkorps als solche einige unsichtbare Vorteile mit sich bringen..."
 SOV_ww1_armor_effort_1:0 "Panzer Einsatz"
 SOV_ww1_armor_effort_1_desc:0 "Unsere früheren Investitionen haben sich gelohnt! Artilleriekonstrukteure, Ingenieure und Fahrzeugkonstrukteure haben uns einen völlig neuen Fahrzeugtyp vorgeschlagen - einen schwer gepanzerten Traktor mit einer Direktfeuerwaffe. Obwohl die ersten Entwürfe noch nicht kampffähig sind, ist dieses Konzept sehr vielversprechend - vor allem, wenn es darum geht, das Patt im Graben zu unseren Gunsten zu beenden, wenn diese Landschiffe dem Maschinengewehrfeuer standhalten können, wie behauptet wird."
 SOV_ww1_armor_effort_2:0 "Panzer Einsatz II"
 SOV_ww1_armor_effort_2_desc:0 "Unsere Experimente mit Rüstungen waren ein voller Erfolg! Dennoch dürfen wir uns mit unseren derzeitigen Entwürfen nicht zufrieden geben. Die Ingenieure haben interessante Konzepte vorgeschlagen, wie z.B. drehbare Geschütztürme, spezielle Maschinenräume und eine Luke für den Kommandanten, die nicht ignoriert werden dürfen. Wenn wir die Ersten sind, die diese Ideen in die Tat umsetzen, könnten wir vielleicht unaufhaltsam werden!"
 SOV_ww1_gasmask_focus:0 "Schwerpunkt Chemische Kriegsführung"
 SOV_ww1_gasmask_focus_desc:0 "Einige unserer Chemiker haben den Einsatz eines neuen, unglaublich tödlichen Mittels vorgeschlagen - Giftgas, das von unserer Artillerie und unseren Grabenmörsern eingesetzt wird. Obwohl die chemische Kriegsführung seit etwa einem Jahrhundert verpönt ist, haben wir keine andere Wahl, wenn wir den Krieg gewinnen wollen. Abgesehen von den Investitionen in diese Mittel ist es wahrscheinlich am besten, wenn wir schnell Gegenmaßnahmen entwickeln - es wäre bedauerlich, wenn sich ein solcher Fortschritt gegen uns wenden würde!"
 #--------------------------------------------------------------
 # [SOWJETUNION] Luftverkehrsbemühungen
 #=========================================================================
 SOV_ww1_airship_focus:0 "Schwerpunkt Luftschiff"
 SOV_ww1_airship_focus_desc:0 "Auch wenn sie langsam und schwer sind, haben sich Luftschiffe im Krieg als nützlich erwiesen, um weit über die Front hinaus zuzuschlagen. Wir sollten uns für sie interessieren und einige spezialisierte Unternehmen mit der Entwicklung neuer Modelle beauftragen."
 SOV_ww1_aviation_effort:0 "VVS Gründung"
 SOV_ww1_aviation_effort_desc:0 "Der Kommandant des bolschewistischen Lufthauptquartiers, Genosse Akashev, schlug vor, die Umwandlung des ehemaligen kaiserlichen Luftdienstes zu vollenden. Sein Plan war die offizielle Gründung der sowjetischen Luftstreitkräfte unter dem Kürzel VVS."
 SOV_ww1_fighter_focus:0 "Schwerpunkt Jäger"
 SOV_ww1_fighter_focus_desc:0 "Die Imperialisten haben den Großteil der Hangars geräumt, und die Flugzeuge, die wir noch haben, sind sowohl in schlechtem Zustand als auch veraltet. Wir müssen jetzt neue Flugzeuge für unsere Rote Luftwaffe in Auftrag geben."
 SOV_ww1_bomber_focus:0 "Schwerpunkt Bomber"
 SOV_ww1_bomber_focus_desc:0 "Um die Weißen und alle anderen zu vernichten, brauchen wir gute Flugzeuge, die in der Lage sind, Tonnen von Bomben auf den Kopf des Feindes abzuwerfen! Einige unserer Unternehmen sind bereits bereit, an neuen Bombermodellen zu arbeiten."
 SOV_ww1_aviation_effort_2:0 "Luftverkehrsbemühungen"
 SOV_ww1_aviation_effort_2_desc:0 "Jetzt, da wir offiziell eine Luftwaffe aufgestellt haben, haben wir einige interessante Fortschritte gemacht. Vor allem haben unsere Flugzeugkonstrukteure Entwürfe für spezifische Aufgaben vorgeschlagen, anstatt einfach ein allgemeines Modell zu bewaffnen. Um diese Flugzeuge, die für Aufgaben wie den Angriff auf feindliche Flugzeuge oder den Abwurf von Bomben konzipiert werden, effektiv einsetzen zu können, sind umfangreiche Tests und Forschungsarbeiten erforderlich, die sich jedoch zweifellos als nützlich erweisen werden."
 SOV_ww1_aviation_effort_3:0 "Luftverkehrsbemühungen II"
 SOV_ww1_aviation_effort_3_desc:0 "Die Entwicklung des synchronisierten Maschinengewehrs hat die Spielregeln für Flugzeuge verändert. Kampfflugzeuge sind jetzt viel effektiver, unsere Zeppeline könnten ihre letzten Flüge erleben, und wir brauchen innovative Denker, die uns helfen, mit dieser extremen Entwicklung Schritt zu halten. Wenn wir diese neue Entwicklung, die den Luftkrieg vielleicht ebenso verändern wird wie den Bodenkrieg, beherrschen, sind wir auf dem besten Weg zur Luftüberlegenheit."
 SOV_ww1_aviation_effort_4:0 "Luftverkehrsbemühungen III"
 SOV_ww1_aviation_effort_4_desc:0 "Unsere Luftwaffe, die erst vor kurzem gegründet wurde, hat sich inzwischen vollständig in den Rest unserer Streitkräfte integriert. Das bringt uns den offensichtlichen Vorteil, dass ein Pool von Theoretikern, Ingenieuren, Konstrukteuren und Experten immer noch vor unserer Tür steht - und eine neue Klasse von ''Ace''-Piloten, die sogar zu kleinen Berühmtheiten werden. Diese Leute einzustellen, kann uns sicher nicht schaden und wird zu schönen Entwicklungen in unserem Bereich führen."
 SOV_ww1_aviation_effort_5:0 "Luftverkehrsbemühungen IV"
 SOV_ww1_aviation_effort_5_desc:0 "Mit der Entwicklung brandneuer Flugzeugtypen wie dem taktischen und dem strategischen Bomber müssen wir noch mehr Tests und Theorien aufstellen, um herauszufinden, wie wir diese neuen Modelle am besten einsetzen können. Einige spekulieren bereits, dass Bomber eine Wunderwaffe sein könnten, die einen Krieg entscheiden kann. Was für ein Blödsinn!"
 SOV_ww1_pilotformation_1:0 "Pilotenausbildung"
 SOV_ww1_pilotformation_1_desc:0 "Gegenwärtig fliegen die Flugzeuge allein - weit voneinander entfernt - und liefern sich ein Duell mit jedem Feind, dem sie begegnen könnten. Mit immer mehr Maschinen am Himmel wird jedoch klar, dass dies nicht mehr die praktikabelste Art ist, Luftkämpfe zu führen. Einige unserer Physiker könnten uns dabei helfen, neue Formationen zu finden, die unsere Piloten nutzen können."
 SOV_ww1_pilotformation_2:0 "Pilotenausbildung II"
 SOV_ww1_pilotformation_2_desc:0 "Die neuen Formationen, die wir aufgestellt haben, waren in der Tat ein Segen für uns im Kampf. Allerdings ist es eine ganz andere Sache, dafür zu sorgen, dass die Leute sich an die Formationen halten. Wenn wir unsere Top-Asse dazu ermutigen, ein Handbuch für unsere Piloten über Lufttaktik und Formation herauszugeben, können wir sicherstellen, dass unsere Piloten sich an das halten, was am besten ist - und vielleicht werden diese Art von Schriften dazu beitragen, neue Tricks und Doktrinen zu verbreiten."
 SOV_ww1_aircraftprod_1:0 "Luftfahrzeugproduktion"
 SOV_ww1_aircraftprod_1_desc:0 "Obwohl Ingenieure bereits in angemessenem Umfang Flugzeuge für uns gebaut haben, ist es einfach an der Zeit, Fabriken in das Konzept einzuweihen. Die Massenproduktion von Flugzeugen wird uns dabei helfen, den Himmel mit freundlichen Flugzeugen zu überschwemmen - und, was noch wichtiger ist, uns dabei helfen, unseren Feinden den gleichen Vorteil vorzuenthalten. Und außerdem, wer weiß? Vielleicht haben einige dieser Fabrikingenieure ein paar gute Ideen für Flugzeugdesigns..."
 SOV_ww1_aircraftprod_2:0 "Luftfahrzeugproduktion II"
 SOV_ww1_aircraftprod_2_desc:0 "Die neuen Formationen, die wir aufgestellt haben, waren in der Tat ein Segen für uns im Kampf. Allerdings ist es eine ganz andere Sache, dafür zu sorgen, dass die Leute sich an die Formationen halten. Wenn wir unsere Top-Asse dazu ermutigen, ein Handbuch für unsere Piloten über Lufttaktik und Formation herauszugeben, können wir sicherstellen, dass unsere Piloten sich an das halten, was am besten ist - und vielleicht werden diese Art von Schriften dazu beitragen, neue Tricks und Doktrinen zu verbreiten."
 SOV_ww1_airbomb_1:0 "Luftbombardierung"
 SOV_ww1_airbomb_1_desc:0 "Während sich die Taktik unserer Jagdflugzeuge durch Formationen verbessert, sind unsere Bomber immer noch sehr einfache Maschinen mit sehr einfachen Doktrinen. Einige unserer alten Luftschiffbomber verfügen über ein im Wesentlichen ungenutztes Fachwissen, das den letzteren helfen könnte, während die Zeit die ersteren löst. Indem wir diese Männer einsetzen, können wir sicherstellen, dass die alten Lektionen der Bombardierung für neuere Maschinen nicht verloren gehen."
 SOV_ww1_airbomb_2:0 "Luftbombardierung II"
 SOV_ww1_airbomb_2_desc:0 "Die jüngsten Entwicklungen in der Luftkriegsführung, sowohl in der Theorie als auch in der Praxis, haben ein goldenes Zeitalter der Flugzeugentwicklung eingeläutet. Von den Piloten bis hin zu den Flugzeugmechanikern scheint jeder etwas zu verbessern und potenziell anzubieten zu haben, was wir auf nationaler Ebene nutzen können. Vielleicht werden Flugzeuge eines Tages die wichtigste Waffe im Krieg sein... nein, wahrscheinlich nicht."
 SOV_ww1_air_innovation:0 "Schwerpunkt Luft-Innovation"
 SOV_ww1_air_innovation_desc:0 "Einer unserer aufstrebenden mittleren Flugoffiziere zeigte kürzlich den Abschluss eines Projekts, an dem er im Geheimen gearbeitet hatte. Ein Wasserflugzeug wurde von einem stationären Schiff aus gestartet, warf eine Bombe auf einen unserer alten Abwracker und versenkte das arme alte Schiff, bevor das Flugzeug zurückkehrte und wieder andockte. Obwohl der Großteil unseres Oberkommandos davon unbeeindruckt war, könnte die Aufmerksamkeit des Staatsoberhauptes diesem Vorhaben durchaus Auftrieb geben."
 SOV_ww1_navalair:0 "Marinebombardierung"
 SOV_ww1_navalair_desc:0 "Einer unserer aufstrebenden mittleren Flugoffiziere zeigte kürzlich den Abschluss eines Projekts, an dem er im Geheimen gearbeitet hatte. Ein Wasserflugzeug wurde von einem stationären Schiff aus gestartet, warf eine Bombe auf einen unserer alten Abwracker und versenkte das arme alte Schiff, bevor das Flugzeug zurückkehrte und wieder andockte. Obwohl der Großteil unseres Oberkommandos davon unbeeindruckt war, könnte die Aufmerksamkeit des Staatsoberhauptes diesem Vorhaben durchaus Auftrieb geben."
 #--------------------------------------------------------------
 # [SOWJETUNION] Industrieller Einsatz
 #=========================================================================
 SOV_ww1_industrial_effort:0 "Industrieller Einsatz"
 SOV_ww1_industrial_effort_desc:0 "Die sowjetische Industrie muss den Erwartungen des Landes gerecht werden. Wir müssen ehrgeizige Pläne machen, um die Produktion und die wirtschaftliche Expansion anzukurbeln.Einige neue ehrgeizige Projekte zur Steigerung unserer industriellen Kapazitäten zu beginnen, würde kurz- und langfristige Vorteile für unsere Nation mit sich bringen, und das geringste davon wäre eine große Verbesserung unserer Fähigkeit, unsere Truppen zu bewaffnen."
 SOV_ww1_construction_effort:0 "Bauaufwand"
 SOV_ww1_construction_effort_desc:0 "Ein ausländisches Unternehmen aus einer benachbarten neutralen Nation ist mit einer unserer nationalen Industrien fusioniert worden. Wenn wir die neue Tochtergesellschaft dazu ermutigen, ihre Fabriken und Arbeitsplätze in unser Land zu verlegen, werden wir einen sofortigen Anstieg unserer zivilen Industrie erleben. Natürlich sollten wir den Bau dieser neuen Fabriken beaufsichtigen..."
 SOV_ww1_construction_effort_2:0 "Bauaufwand II"
 SOV_ww1_construction_effort_2_desc:0 "Manchmal muss sich der Staat sogar in einem Freihandelsmarkt einmischen. Wenn der Staat die Gründung neuer Unternehmen finanzieren muss, müssen wir dafür sorgen, dass wir wettbewerbsfähig und unabhängig von ausländischen Importen bleiben, falls der Handel schwieriger werden könnte."
 SOV_ww1_construction_effort_3:0 "Bauaufwand III"
 SOV_ww1_construction_effort_3_desc:0 "Unsere zivile industrielle Expansion ist fast abgeschlossen, aber es gibt immer noch einiges zu tun. Einige Grundstücke, die wir in einer Stadt besitzen, können immer noch an einen unserer Konzerne verkauft werden, mit deren Zustimmung, damit sie dort eine Manufaktur errichten. Dies wird unsere zivile Warenproduktion weiter erhöhen und uns mehr Optionen für zukünftige Bauten geben."
 SOV_ww1_production_effort:0 "Rüstungsaufwand"
 SOV_ww1_production_effort_desc:0 "Die Menge an Waffen, die wir erworben haben, hat das Interesse eines lokalen Stahlfabrikanten geweckt, der in unserem Land eine neue Waffenfabrik errichten möchte. Wenn wir diese Bemühungen unterstützen, indem wir ihm helfen, das nötige Land zu erwerben und ihm Investoren und Talente zur Verfügung stellen, werden wir mehr als nur den Gewinn einer neuen Rüstungsfabrik erhalten."
 SOV_ww1_production_effort_2:0 "Rüstungsaufwand II"
 SOV_ww1_production_effort_2_desc:0 "Ein Automobilunternehmen, das in der Vergangenheit Fahrzeuge der Militärklasse für uns gebaut hat, hat Interesse daran bekundet, eine völlig neue Fabrik speziell für die Militärproduktion zu errichten, um seine Produktionskapazitäten für den zivilen Markt zu erhalten. Wenn wir ihnen beim Bau dieser Fabrik helfen, könnten wir einen Exklusivvertrag aushandeln, was eine direkte Erhöhung unserer militärischen Produktionskapazität bedeuten würde."
 SOV_ww1_production_effort_3:0 "Rüstungsaufwand III"
 SOV_ww1_production_effort_3_desc:0 "Ein Flugzeugkonstrukteur und ein Mechaniker kamen mit einer neuen Anfrage zu uns, um eine Militärflugzeugfabrik zu gründen, in der Flugzeuge für unsere Armeen zusammengebaut werden sollten."
 SOV_ww1_dockyard_effort_1:0 "Werfterweiterung"
 SOV_ww1_dockyard_effort_1_desc:0 "Indem wir ungenutztes oder verlassenes Küstenland kaufen, um unsere bestehende Infrastruktur auszubauen, könnten wir unsere Arsenale und Werften vergrößern."
 SOV_ww1_dockyard_effort_2:0 "Werfterweiterung II"
 SOV_ww1_dockyard_effort_2_desc:0 "Matrosen der Handelsmarine, Fischer und pensionierte Seeleute unserer eigenen Marine können ihr Talent und ihre Erfahrung auf See nutzen, um an unseren neuen Docks zu arbeiten und sie zu beaufsichtigen."
 SOV_ww1_dockyard_effort_3:0 "Werfterweiterung III"
 SOV_ww1_dockyard_effort_3_desc:0 "Einige unserer alten Handelshäfen werden heutzutage nicht mehr viel genutzt. Mit ein paar Investitionen und Renovierungsarbeiten könnten diese leicht für militärische Zwecke umgebaut werden."
 SOV_ww1_airfield_expansion_1:0 "Flugplatz-Erweiterung"
 SOV_ww1_airfield_expansion_1_desc:0 "Flugplätze haben den Luxus, dass sie nur ein Stück Land benötigen, das relativ nah an einem Straßennetz liegt. Die Einrichtung eines solchen Geländes ist eine Arbeit für sich, die sich jedoch auszahlen wird."
 SOV_ww1_airfield_expansion_2:0 "Flugplatz-Erweiterung II"
 SOV_ww1_airfield_expansion_2_desc:0 "Einige unserer zivilen Landebahnen aus den Tagen vor der Militärluftfahrt sind noch da und jetzt verlassen. Wir können sie für einen Brotpreis zurückkaufen und für unsere eigenen Zwecke nutzen."
 SOV_ww1_airfield_expansion_3:0 "Flugplatz-Erweiterung III"
 SOV_ww1_airfield_expansion_3_desc:0 "Die Einrichtung geeigneter Flugplätze in der Nähe größerer städtischer Zentren kann uns die Schaffung einfacher Versorgungsbasen ermöglichen, die in der Lage sind, unsere wertvollen Bereiche zu schützen."
 SOV_ww1_infrastructure_effort:0 "Infrastruktur-Bemühungen"
 SOV_ww1_infrastructure_effort_desc:0 "Mit dem Wachstum unserer Industrie fordert der Privatsektor weiterhin, die Investitionen in die Infrastruktur zu erhöhen, um die nationale Wirtschaft zu unterstützen. Solange wir das tun, werden wir nicht mehr Möglichkeiten erhalten, neue Fabriken zu errichten. Natürlich hilft die Infrastruktur auch unserer Nation, indem sie die Geschwindigkeit und den Versorgungsfluss für unsere Truppen erhöht, daher könnte diese Investition kein so schlechter Plan sein."
 SOV_ww1_infrastructure_effort_2:0 "Infrastruktur-Bemühungen II"
 SOV_ww1_infrastructure_effort_2_desc:0 "Mit unseren Industriebetrieben, Werften und Landebahnen, die immer weiter ausgebaut werden, gibt es immer mehr zu investieren. Derzeit liegt der logische Schritt nach vorn bei den Eisenbahnen, die wir bislang weitgehend ignoriert haben. Investitionen in deren Modernisierung werden dazu beitragen, Vorräte und Menschen zu bewegen und neue Gebiete für Investitionen in unsere Wirtschaft zu erschließen."
 SOV_ww1_infrastructure_effort_3:0 "Infrastruktur-Bemühungen III"
 SOV_ww1_infrastructure_effort_3_desc:0 "Da ein großer Krieg droht, müssen wir weiterhin in Bauprojekte investieren und dafür sorgen, dass unsere Truppen die angenehmsten Eisenbahnen der Welt haben."
 SOV_ww1_infrastructure_effort_4:0 "Infrastruktur-Bemühungen IV"
 SOV_ww1_infrastructure_effort_4_desc:0 "Einige Bauingenieure haben die Schaffung eines der ehrgeizigsten Straßennetzes vorgeschlagen, das unsere größten Städte und einige unserer Militärstützpunkte miteinander verbinden soll. Die Investition in dieses Projekt wird unsere Infrastruktur zu einem Objekt der Begierde für die ganze Welt machen, alle Straßen werden zu unserer Hauptstadt führen!"
 SOV_ww1_extra_tech_slot:0 "Extra Forschungsplatz"
 SOV_ww1_extra_tech_slot_desc:0 "Mit einem so großen Industriesektor und mehreren unserer klügsten Köpfe an den Schalthebeln der Militärmanufakturen und der militärischen Entwicklung sind schnell Ergebnisse zu erwarten. Einige der Industrien, die wir anfangs unterstützt haben, haben einige leidenschaftliche Individuen hervorgebracht, die interessante Forschungen für unsere Nation durchführen können."
 SOV_ww1_extra_tech_slot_2:0 "Extra Forschungsplatz II"
 SOV_ww1_extra_tech_slot_2_desc:0 "Unsere großen Investitionen in Industrie und Infrastruktur haben unser Land - leider nicht auf der Landkarte - kleiner gemacht. Einige kluge Köpfe aus den dunkleren Teilen unseres Landes besuchen die Hauptstadt häufiger, und es wäre nicht besonders schwierig, sie in den Dienst der Nation zu integrieren."
 #--------------------------------------------------------------
 # [SOWJETUNION] Marine-Einsatz
 #=========================================================================
 SOV_ww1_naval_effort:0 "VMF aufbauen"
 SOV_ww1_naval_effort_desc:0 "Da wir bereits die beste Armee in Europa haben, müssen wir uns auch um unsere Marine kümmern, um mit der Royal Navy Schritt zu halten und sicherzustellen, dass Deutschland sich und sein Territorium auf jede erdenkliche Weise verteidigen kann. Wenn wir uns darauf konzentrieren, in unserem Wettrüsten gegen das Vereinigte Königreich kontinuierlich aufzurüsten, sind wir auf dem besten Weg zur Vorherrschaft in der Marine."
 SOV_ww1_newnavalcanons_1:0 "Marinegeschütze"
 SOV_ww1_newnavalcanons_1_desc:0 "Während sich das Design unserer Schiffe ständig weiterentwickelt, sollten wir die Marineartillerie an Bord unserer Schiffe nicht vergessen. Obwohl wir die Kaliber seit über einem Jahrhundert standardisiert haben, haben wir immer noch zu viele verschiedene Kaliber für zu viele verschiedene Rollen. Indem wir die Anzahl der Standards reduzieren und jede Waffenart universeller machen, können wir das Design von Schiffen rationalisieren."
 SOV_ww1_newnavalcanons_2:0 "Marinegeschütze II"
 SOV_ww1_newnavalcanons_2_desc:0 "Obwohl wir das Problem der Kanonen nun gelöst haben, sollten wir uns nun auf die Ausrüstung zur Unterstützung dieser Schiffsbatterien konzentrieren. Entfernungsmesser werden allmählich zum Standard auf unseren Schiffen. Die Gewissheit, dass unsere Offiziere damit umgehen können, vor allem bei maximaler Einsatzdistanz, wird es uns ermöglichen, unser Artilleriepotenzial voll auszuschöpfen."
 SOV_ww1_newnavalcanons_3:0 "Marinegeschütze III"
 SOV_ww1_newnavalcanons_3_desc:0 "Die Analoge Feuerkontrolle ist ein Meilenstein in der Schifffahrt, da sie alle Teile eines Schiffes auf das gleiche Ziel ausrichten kann. Obwohl es sich um ein relativ primitives Gerät handelt, ist es bereits sehr gefragt. Diese neuen Konstruktionen können uns einen entscheidenden Vorteil auf See verschaffen."
 SOV_ww1_dreadnought_effort:0 "Dreadnought-Einsatz"
 SOV_ww1_dreadnought_effort_desc:0 "Depuis que les Britanniques ont révélé la première classe de cuirassé, une course aux armement a été entreprise entre les plus grandes marines du mondes pour construire des cuirassés toujours plus grands et puissants. Si notre pays veut rester à la page, nous devons nous aussi améliorer nos conceptions et produire nos propres dreadnoughts."
 SOV_ww1_flexible_navy:0 "Flexible Marine"
 SOV_ww1_flexible_navy_desc:0 "Eine große Masse an Kriegsschiffen ist für uns völlig nutzlos, wenn wir sie nur zur Patrouillenfahrt auf einem kleinen Quadrat des Meeres einsetzen. Wir müssen eine Flotte aufbauen, die sich überall und jederzeit bewegen kann, mit einer ausreichenden Anzahl von Schirmen, die von einer Reihe von Schlachtkreuzern und Schlachtschiffen unterstützt werden. Dies wird uns helfen, die Meere zu kontrollieren und auf eine Vielzahl von Bedrohungen zu reagieren, indem wir unsere Streitkräfte an fast jeden Ort der Welt projizieren können."
 SOV_ww1_large_navy:0 "Große Marine"
 SOV_ww1_large_navy_desc:0 "Linienschiffe und Schlachtschiffe zu haben, ist an sich schon eine gute Sache, aber ein Herz aus Panzerschiffen und Panzerkreuzern zu schaffen, kann leicht den Ausschlag zu unseren Gunsten geben und uns alle taktischen Optionen eröffnen, die diese Rollen zulassen, solange sie in der richtigen Anzahl vorhanden sind. Wenn wir unsere Marine um dieses Konzept herum aufbauen und die entsprechende Doktrin studieren, wird unsere Flotte schlichtweg unschlagbar sein."
 SOV_ww1_navyreform:0 "Marineeinsatz"
 SOV_ww1_navyreform_desc:0 "Es sind nicht einfach nur Kanonen und Schiffe, mit denen man eine Seeschlacht gewinnen kann. Das beste Schiff der Welt ist nutzlos, wenn es nicht zur richtigen Zeit am richtigen Ort ist. Investitionen in direkte Kommunikationskanäle zwischen Schiffen sowie zwischen der Flotte und dem Hafen können sicherstellen, dass jedes Schiff zur richtigen Zeit am richtigen Ort ist, und unsere Seeherrschaft unterstützen."
 SOV_ww1_submarine_effort:0 "Unterseeboot Einsatz"
 SOV_ww1_submarine_effort_desc:0 "U-Boote sind billig, können in großer Zahl eingesetzt werden und können eine furchterregende materielle und psychologische Bedrohung verursachen! Wir müssen einen Teil des Marinebudgets für den Bau mehrerer dieser neuen Maschinen bereitstellen."
 SOV_ww1_cruiser_effort:0 "Kreuzer Einsatz"
 SOV_ww1_cruiser_effort_desc:0 "Unsere Admiräle fordern eine größere Flotte und eine große Investition in Kreuzer, um uns mittelgroße Schiffe zu verschaffen, die feindliche Schiffe und Transporter belästigen und größere Kriegsschiffe unterstützen können. Unsere Konstruktionsbüros in die Lage zu versetzen, neue Schiffsklassen dieser Art zu entwerfen und zu bauen, wird uns gegen jeden Feind mit einer großen Flotte helfen und unsere Unterseeboote sichern."
 SOV_ww1_destroyer_effort:0 "Zerstörer Einsatz"
 SOV_ww1_destroyer_effort_desc:0 "Unsere Admiräle haben den Ausbau unserer Torpedobootsflotte und größere Investitionen in diesem Bereich gefordert. Dies wird uns leichtere Schiffe bescheren, die gut für den Kampf gegen feindliche Tauchboote, die Aufklärung und die Begleitung von Konvois sind. Die Bestellung von besseren Torpedobooten bei unseren Werften wird uns helfen, unsere Handelsrouten offen zu halten und unsere eigenen U-Boote zu unterstützen."
 SOV_ww1_capital_ships_effort:0 "Großkampfschiffs Einsatz"
 SOV_ww1_capital_ships_effort_desc:0 "Unsere Admiräle haben uns eine relativ einfache Bitte geschickt: Mehr Schlachtschiffe, und zwar größere und mächtigere! Der Bau dieser titanischen Schiffe wird uns helfen, die Meere zu kontrollieren, und ermöglicht uns eine gute Feuerunterstützung für unsere Bodentruppen, die im Falle einer Seeinvasion an Land gehen. "
 SOV_ww1_carrier_focus:0 "Träger Einsatz"
 SOV_ww1_carrier_focus_desc:0 "Einige radikale Köpfe haben ein unbewaffnetes Schiff vorgeschlagen, das nur für den Einsatz von Marinebombern ausgerüstet ist, die von dort aus starten und weit draußen auf dem Meer zuschlagen sollen. Das ist ein sehr vielversprechendes Projekt, auch wenn es durch die heutige Technologie ein wenig behindert wird. Wenn wir unsere Bemühungen in diesem Projekt fortsetzen, wird die Marinefliegerei vielleicht eines Tages Allgemeingut werden..."
 SOV_ww1_antisubmarine:0 "U-Boot-Bekämpfung"
 SOV_ww1_antisubmarine_desc:0 "U-Boote sind besonders schwer zu fassende Schiffe, vor allem, wenn sie gut gesteuert werden. Sofern wir nicht vorhaben, unsere gesamte Transport- und Handelsflotte auf den Grund schicken zu lassen, haben uns unsere Admiräle geraten, mit Investitionen in Tiefenladungen, fortschrittliche Torpedos und andere Waffen zu beginnen, mit denen wir die Bedrohung aus der Welt schaffen können."
